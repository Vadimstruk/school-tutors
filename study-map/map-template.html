<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Моя карта навчання</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Карта навчання для 7 класу: предмет → розділ → тема → підтема → урок.
   Шрифти з Google Fonts мають кирилицю; без мережі сторінка бере системні шрифти. */
:root {
  --bg: #f6f4ee;
  --surface: #ffffff;
  --surface-2: #f1eee6;
  --ink: #1f2933;
  --ink-soft: #55606b;
  --line: #d8d3c7;
  --track: #e6e1d6;
  --accent: #19717f;
  --accent-ink: #ffffff;
  --accent-soft: #dcefF1;
  --focus: #2457d6;
  --good: #2e7a4c;
  --good-soft: #def0e4;
  --mid: #9a6400;
  --mid-soft: #f7ead2;
  --bad: #b0413b;
  --bad-soft: #f6dfdd;
  --now: #b4530e;
  --accent2: #c2410c;
  --now-soft: #fbe7d6;
  --next: #6247c8;
  --next-soft: #e9e4fb;
  --planned: #8b9097;
  --s1: #19717f; --s2: #6247c8; --s3: #b4530e; --s4: #2e7a4c;
  --shadow: 0 1px 2px rgba(31, 41, 51, .06), 0 4px 14px rgba(31, 41, 51, .06);
  --font-body: "Nunito", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14171d; --surface: #1c2028; --surface-2: #232833; --ink: #e9ebef; --ink-soft: #a9b0bc;
    --line: #363d4a; --track: #2c323e; --accent: #4fc0cf; --accent-ink: #0d2226; --accent-soft: #1d3a40; --accent2: #f08a4b;
    --focus: #8aaeff; --good: #6cc792; --good-soft: #1e3628; --mid: #e6b45c; --mid-soft: #3a2f1a;
    --bad: #f08a83; --bad-soft: #3d2423; --now: #f0a064; --now-soft: #3e2a1b; --next: #b3a2ff; --next-soft: #2c2645;
    --planned: #7d838d; --s1: #4fc0cf; --s2: #b3a2ff; --s3: #f0a064; --s4: #6cc792;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 4px 14px rgba(0, 0, 0, .25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #14171d; --surface: #1c2028; --surface-2: #232833; --ink: #e9ebef; --ink-soft: #a9b0bc;
  --line: #363d4a; --track: #2c323e; --accent: #4fc0cf; --accent-ink: #0d2226; --accent-soft: #1d3a40; --accent2: #f08a4b;
  --focus: #8aaeff; --good: #6cc792; --good-soft: #1e3628; --mid: #e6b45c; --mid-soft: #3a2f1a;
  --bad: #f08a83; --bad-soft: #3d2423; --now: #f0a064; --now-soft: #3e2a1b; --next: #b3a2ff; --next-soft: #2c2645;
  --planned: #7d838d; --s1: #4fc0cf; --s2: #b3a2ff; --s3: #f0a064; --s4: #6cc792;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 4px 14px rgba(0, 0, 0, .25);
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.6 var(--font-body); overflow-x: hidden; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 6px; }
sub, sup { line-height: 0; }
h1, h2, h3, p { margin: 0; }
.code { font: 600 .8em/1 var(--font-mono); color: var(--ink-soft); white-space: nowrap; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- Шапка ---------- */
header.top { background: var(--surface); border-bottom: 1px solid var(--line); }
.top-inner { max-width: 880px; margin: 0 auto; padding: 14px 16px 0; display: grid; gap: 10px; }
.top-row { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; }
.brand { font-size: 1.3rem; font-weight: 800; letter-spacing: -.01em; line-height: 1.2; }
.brand small { display: block; font-size: .92rem; font-weight: 600; color: var(--ink-soft); letter-spacing: 0; }
.toggle { min-height: 44px; border: 2px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 16px; font-weight: 700; }
.toggle:hover { border-color: var(--ink-soft); }
.toggle[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.tabs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: thin; margin: 0 -4px; padding: 0 4px; }
.tab { flex: none; min-height: 48px; border: 0; background: none; padding: 8px 14px; border-bottom: 4px solid transparent; font-weight: 700; color: var(--ink-soft); display: flex; align-items: center; gap: 8px; border-radius: 8px 8px 0 0; }
.tab:hover { color: var(--ink); background: var(--surface-2); }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--tab-c, var(--accent)); }
.tab .ic { font-size: 1.2rem; line-height: 1; }
.tabs-spacer { height: 0; }

/* ---------- Основна частина ---------- */
main { max-width: 880px; margin: 0 auto; padding: 20px 16px 40px; display: grid; gap: 18px; min-width: 0; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px; box-shadow: var(--shadow); min-width: 0; }
.card h3 { font-size: 1.05rem; font-weight: 800; margin-bottom: 8px; }
.card p + p { margin-top: 8px; }
.note { font-size: .9rem; color: var(--ink-soft); }
.btn { min-height: 44px; border: 2px solid var(--accent); background: var(--accent); color: var(--accent-ink); border-radius: 12px; padding: 8px 16px; font-weight: 800; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-align: center; }
.btn:hover { filter: brightness(1.07); }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); font-weight: 700; }
.btn.ghost:hover { border-color: var(--ink-soft); filter: none; }
.btn[aria-pressed="true"].mark { background: var(--good); border-color: var(--good); color: #fff; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

/* Вступ до предмета */
.intro { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 16px; align-items: center; }
.intro h2 { font-size: 1.35rem; font-weight: 800; line-height: 1.25; }
.intro .sub-line { color: var(--ink-soft); font-size: .95rem; }
.hints { display: grid; gap: 10px; }
.hint { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 12px 14px; border-radius: 12px; border: 1px solid transparent; }
.hint.now { background: var(--now-soft); border-color: color-mix(in srgb, var(--now) 35%, transparent); }
.hint.next { background: var(--next-soft); border-color: color-mix(in srgb, var(--next) 35%, transparent); }
.hint .lbl { font-weight: 800; }
.hint.now .lbl { color: var(--now); }
.hint.next .lbl { color: var(--next); }
.chip { min-height: 40px; display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 4px 14px; font-weight: 700; font-size: .92rem; border: 2px solid currentColor; background: var(--surface); }
.chip.next { color: var(--next); }
.chip.now { color: var(--now); }
.chip:hover { background: var(--surface-2); }
.badge { display: inline-flex; align-items: center; border-radius: 999px; padding: 1px 10px; font-size: .78rem; font-weight: 800; line-height: 1.6; white-space: nowrap; }
.badge.now { background: var(--now); color: #fff; }
.badge.next { background: var(--next); color: #fff; }

/* Умовні позначення */
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: .85rem; color: var(--ink-soft); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }

/* Кільце прогресу */
.ring { flex: none; display: block; }
.ring .trk { fill: none; stroke: var(--track); }
.ring .val { fill: none; stroke: var(--ring-c, var(--accent)); stroke-linecap: round; }
.ring text { font: 800 12px var(--font-body); fill: var(--ink); text-anchor: middle; dominant-baseline: central; }
.ring.big text { font-size: 15px; }

/* Дерево */
.tree, .topics, .subs { list-style: none; margin: 0; padding: 0; }
.tree { display: grid; gap: 14px; }
.sec { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); overflow: hidden; min-width: 0; }
.sec > h2, .topic > h3 { margin: 0; font-size: inherit; }
.sec-head { width: 100%; min-height: 72px; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 14px; align-items: center; text-align: left; background: none; border: 0; padding: 14px 16px; }
.sec-head:hover { background: var(--surface-2); }
.sec-head .nm { display: block; font-size: 1.1rem; font-weight: 800; line-height: 1.3; overflow-wrap: anywhere; }
.sec-head .meta { display: block; font-size: .85rem; color: var(--ink-soft); }
.chev { width: 28px; height: 28px; display: grid; place-items: center; border-radius: 50%; background: var(--surface-2); transition: transform .15s; font-size: .8rem; color: var(--ink-soft); }
[aria-expanded="true"] > .chev { transform: rotate(90deg); }
.sec-body { padding: 0 16px 16px; display: grid; gap: 10px; }
.sec-body > .what { color: var(--ink-soft); font-size: .95rem; }
.topics { display: grid; gap: 8px; }
.topic { border: 1px solid var(--line); border-radius: 12px; background: var(--bg); min-width: 0; }
.topic.now { border: 2px solid var(--now); background: var(--now-soft); }
.topic-head { width: 100%; min-height: 56px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 12px; align-items: center; text-align: left; background: none; border: 0; padding: 10px 12px; border-radius: 12px; }
.topic-head:hover { background: color-mix(in srgb, var(--surface-2) 70%, transparent); }
.topic-head .t1 { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 8px; min-width: 0; }
.topic-head .nm { font-weight: 800; overflow-wrap: anywhere; }
.topic-head .t2 { grid-column: 1 / -1; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; font-size: .82rem; color: var(--ink-soft); }
.topic-head .chev { grid-row: 1; grid-column: 2; }
.bar { height: 10px; border-radius: 5px; background: var(--track); overflow: hidden; display: block; min-width: 60px; }
.bar i { display: block; height: 100%; background: var(--bar-c, var(--accent)); border-radius: 5px; }
.topic-body { padding: 0 12px 12px; display: grid; gap: 8px; }
.topic-body > .what { font-size: .92rem; color: var(--ink-soft); }
.subs { display: grid; gap: 6px; }
.sub { width: 100%; min-height: 48px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; align-items: center; text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 12px; }
button.sub:hover { border-color: var(--ink-soft); }
.sub .nm { font-weight: 700; overflow-wrap: anywhere; }
.sub .tags { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; align-items: center; }
.sub.planned { background: transparent; border-style: dashed; color: var(--planned); }
.sub.planned .nm { font-weight: 600; }
.sub.is-next { border: 2px solid var(--next); }
.pill { display: inline-flex; align-items: center; gap: 4px; border-radius: 999px; padding: 1px 10px; font-size: .78rem; font-weight: 800; line-height: 1.6; white-space: nowrap; background: var(--surface-2); color: var(--ink-soft); }
.pill.st-read { background: var(--accent-soft); color: var(--accent); }
.pill.st-checked { background: var(--mid-soft); color: var(--mid); }
.pill.st-mastered { background: var(--good-soft); color: var(--good); }
.pill.st-planned { background: transparent; border: 1px dashed var(--planned); color: var(--planned); }
.pill.prac { background: transparent; border: 1px solid var(--line); color: var(--ink-soft); font-family: var(--font-mono); font-weight: 600; }
.empty { text-align: center; padding: 36px 20px; display: grid; gap: 10px; justify-items: center; }
.empty .big { font-size: 2.6rem; line-height: 1; }
.empty h2 { font-size: 1.3rem; font-weight: 800; }
.empty p { max-width: 46ch; color: var(--ink-soft); }

/* ---------- Урок ---------- */
.lesson { display: grid; gap: 16px; min-width: 0; }
.crumbs { font-size: .88rem; color: var(--ink-soft); overflow-wrap: anywhere; }
.lesson-title { font-size: 1.5rem; font-weight: 800; line-height: 1.25; overflow-wrap: anywhere; }
.lesson-title:focus { outline: none; }
.lesson-title:focus-visible { outline: 3px solid var(--focus); }
.lesson .card ul, .lesson .card ol { margin: 0; padding-left: 22px; display: grid; gap: 6px; }
.rules { display: grid; gap: 10px; }
.rule { border: 1px solid var(--line); border-left: 5px solid var(--accent); border-radius: 10px; padding: 10px 12px; background: var(--bg); display: grid; gap: 4px; min-width: 0; }
.rule .f { font: 600 1.05rem/1.5 var(--font-mono); overflow-wrap: anywhere; }
.rule .m { font-size: .95rem; color: var(--ink-soft); }
.task { padding: 12px 14px; border-radius: 10px; background: var(--surface-2); font-weight: 600; }
ol.steps { list-style: none; padding: 0 !important; counter-reset: st; margin-top: 12px !important; }
ol.steps li { counter-increment: st; display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 4px 10px; align-items: start; }
ol.steps li::before { content: counter(st); width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--accent); color: var(--accent-ink); font-weight: 800; font-size: .9rem; grid-row: span 2; }
ol.steps .do { font-weight: 700; }
ol.steps .why { font-size: .93rem; color: var(--ink-soft); }
ol.steps .why b { color: var(--ink); }
.answer { margin-top: 12px; padding: 10px 14px; border-radius: 10px; background: var(--good-soft); color: var(--ink); }
.answer b { color: var(--good); }
.mistakes li::marker { content: "⚠︎  "; color: var(--mid); }
.checks { display: grid; gap: 10px; }
.check { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: grid; gap: 10px; background: var(--bg); }
.check .q { font-weight: 700; }
.examples { display: grid; gap: 14px; }
.example { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; background: var(--bg); min-width: 0; }
.ex-n { font-size: .9rem; font-weight: 800; color: var(--accent); margin-bottom: 6px; }
.example .task { background: var(--surface); }
.opts { display: grid; gap: 8px; }
.opt { min-height: 44px; text-align: left; border: 2px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 12px; font-weight: 600; overflow-wrap: anywhere; }
.opt:hover:not([disabled]) { border-color: var(--ink-soft); }
.opt[disabled] { cursor: default; }
.opt.right { border-color: var(--good); background: var(--good-soft); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.ans-row input { flex: 1 1 10em; min-width: 0; min-height: 44px; border: 2px solid var(--line); border-radius: 10px; padding: 8px 12px; background: var(--surface); color: var(--ink); font-size: 1rem; }
.ans-row input:focus-visible { border-color: var(--focus); }
.check .a { padding: 8px 12px; border-radius: 8px; background: var(--surface); border: 1px dashed var(--line); }
.check .res { font-size: .9rem; font-weight: 700; }
.check .res.know { color: var(--good); }
.check .res.not-yet { color: var(--mid); }
.btn.know[aria-pressed="true"] { background: var(--good); border-color: var(--good); color: #fff; }
.btn.not-yet[aria-pressed="true"] { background: var(--mid); border-color: var(--mid); color: #fff; }
.ask { display: grid; gap: 10px; }
.ask textarea { width: 100%; min-height: 64px; resize: none; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: var(--bg); color: var(--ink); font-size: .95rem; line-height: 1.45; }
.pager { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.pager .btn { justify-content: flex-start; text-align: left; min-width: 0; }
.pager .btn.nx { justify-content: flex-end; text-align: right; grid-column: 2; }
.pager .btn span { overflow-wrap: anywhere; }
.ref { font-size: .85rem; color: var(--ink-soft); border-left: 3px solid var(--line); padding-left: 10px; }

/* ---------- Для батьків ---------- */
.par-head h2 { font-size: 1.35rem; font-weight: 800; }
.subj-cards { display: grid; gap: 14px; }
.meter { display: grid; gap: 4px; }
.meter .lbl { display: flex; justify-content: space-between; gap: 10px; font-size: .92rem; }
.meter .lbl b { font-variant-numeric: tabular-nums; white-space: nowrap; }
.meter .bar { height: 14px; border-radius: 7px; }
.meters { display: grid; gap: 10px; margin-top: 10px; }
table.acc { width: 100%; border-collapse: collapse; font-size: .92rem; }
table.acc th, table.acc td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--track); vertical-align: middle; }
table.acc th { font-size: .8rem; color: var(--ink-soft); font-weight: 700; }
table.acc td.num { white-space: nowrap; font-variant-numeric: tabular-nums; }
table.acc .bar { width: 100%; min-width: 50px; }
.weak { margin: 0; padding-left: 22px; display: grid; gap: 4px; }
.tips { margin: 0; padding-left: 22px; display: grid; gap: 8px; }

/* ---------- Малюнки ---------- */
.fig { margin: 12px 0 0; display: grid; justify-items: center; gap: 4px; min-width: 0; }
.fig-svg { display: block; max-width: 100%; height: auto; overflow: visible; }
.fig figcaption { font-size: .8rem; line-height: 1.4; color: var(--ink-soft); text-align: center; max-width: 340px; }
.card { --fig-bg: var(--surface); }
.example, .check { --fig-bg: var(--bg); }
.fig .it { color: var(--ink); }
/* Ореол під текстом малюнка: читається поверх ліній. */
.fig .f-num, .fig .f-axl, .fig .plb, .fig .flb, .fig .alb { paint-order: stroke; stroke: var(--fig-bg, var(--surface)); stroke-width: 3px; stroke-linejoin: round; }
.fig .s-hl { color: var(--accent); }
.fig .s-hl2 { color: var(--accent2); }
.fig .s-faint { color: var(--ink-soft); }
.fig .stk { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.fig .stk.fill { fill: color-mix(in srgb, currentColor 10%, transparent); }
.fig .s-hl .stk, .fig .s-hl2 .stk { stroke-width: 3; }
.fig .s-faint .stk { stroke-width: 1.2; }
.fig .s-dash .stk, .fig .s-dash .arc { stroke-dasharray: 6 5; }
.fig .arc { fill: none; stroke: currentColor; stroke-width: 2; }
.fig .alb { fill: currentColor; font: 700 14px var(--font-body); }
.fig .tick { stroke: var(--accent2); stroke-width: 2.5; stroke-linecap: round; }
.fig .s-hl .tick, .fig .s-hl2 .tick { stroke: currentColor; }
.fig .rmk { fill: none; stroke: currentColor; stroke-width: 1.6; }
.fig .pt { fill: var(--ink); }
.fig .plb { fill: var(--ink); font: italic 700 17px var(--font-body); }
.fig .flb { fill: currentColor; font: italic 700 15px var(--font-body); }
.fig .f-grid { fill: none; stroke: var(--track); stroke-width: 1; }
.fig .f-axis { fill: none; stroke: var(--ink-soft); stroke-width: 1.4; }
.fig .f-arrow { fill: var(--ink-soft); }
.fig .f-axl { fill: var(--ink-soft); font: italic 700 15px var(--font-body); }
.fig .f-num { fill: var(--ink-soft); font: 600 12px var(--font-body); }
/* Підсвітка на кроці прикладу: товстіше; без власного кольору — основний колір. */
.fig .it.on { color: var(--accent); }
.fig .it.on.s-hl2 { color: var(--accent2); }
.fig .it.on .stk, .fig .it.on .arc { stroke-width: 4.5; }
.fig .it.on .tick, .fig .it.on .rmk { stroke-width: 3; }
.fig .it.on .alb, .fig .it.on .flb { font-weight: 800; font-size: 16px; }

footer.foot { max-width: 880px; margin: 0 auto; padding: 0 16px 32px; font-size: .82rem; color: var(--ink-soft); display: flex; flex-wrap: wrap; gap: 4px 16px; justify-content: space-between; }

@media (max-width: 560px) {
  body { font-size: 16px; }
  .card { padding: 14px; border-radius: 14px; }
  .sec-head { padding: 12px; gap: 10px; }
  .sec-body { padding: 0 10px 12px; }
  .intro { grid-template-columns: minmax(0, 1fr); }
  .intro .ring { display: none; }
  .sub { grid-template-columns: minmax(0, 1fr); }
  .sub .tags { justify-content: flex-start; }
  .pager { grid-template-columns: minmax(0, 1fr); }
  .pager .btn.nx { grid-column: 1; }
  .lesson-title { font-size: 1.3rem; }
  table.acc .barcol { display: none; }
}
@media (prefers-reduced-motion: reduce) { .chev { transition: none; } }
</style>
</head>
<body>
<header class="top">
  <div class="top-inner">
    <div class="top-row">
      <h1 class="brand" id="brand">Моя карта навчання<small id="who"></small></h1>
      <button class="toggle" id="parents-toggle" type="button" aria-pressed="false">Для батьків</button>

  </div>
</header>
<main id="main" tabindex="-1" aria-live="off"></main>

<script>
/* ---------- Зміст: вставляє study-map/build-map.py з study-map/content/ ---------- */
/*@@CONTENT@@*/
// Змінюй, коли змінюється сторінка або уроки, щоб репетитор знав, що опубліковану копію учня треба оновити.
const MAP_VERSION = "2026-10-14k";
const DATA = (typeof CONTENT !== "undefined" && CONTENT && Array.isArray(CONTENT.subjects)) ? CONTENT : { subjects: [] };

/* ---------- Покажчики ---------- */
const SUBJ = {}, SEC = {}, TOP = {}, SUB = {};
DATA.subjects.forEach((s, si) => {
  s.color = `var(--s${(si % 4) + 1})`;
  s.sections = Array.isArray(s.sections) ? s.sections : [];
  s.subs = [];
  SUBJ[s.id] = s;
  s.sections.forEach(sec => {
    sec.subject = s; SEC[sec.id] = sec; sec.subs = [];
    (sec.topics || []).forEach(t => {
      t.section = sec; t.subject = s; TOP[t.id] = t;
      t.subtopics = t.subtopics || [];
      t.subtopics.forEach(st => {
        st.topic = t; st.section = sec; st.subject = s; SUB[st.id] = st;
        st.ready = st.status === "ready" && !!st.lesson;
        st.checks = st.ready ? (st.lesson.check || []).map((c, i) => ({ id: `${st.id}-${i + 1}`, q: c.q, a: c.a,
          fig: c.fig || null, options: Array.isArray(c.options) ? c.options : null, correct: c.correct, accept: Array.isArray(c.accept) ? c.accept : null })) : [];
        st.examples = st.ready && Array.isArray(st.lesson.examples) ? st.lesson.examples : [];
        sec.subs.push(st); s.subs.push(st);
      });
    });
  });
});

/* ---------- Сховище ---------- */
const LS_PROGRESS = "school-map:progress", LS_UI = "school-map:ui";
function lsGet(k) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
const clone = o => JSON.parse(JSON.stringify(o == null ? {} : o));
const isObj = v => !!v && typeof v === "object" && !Array.isArray(v);
function deepMerge(into, patch) {
  Object.keys(patch || {}).forEach(k => { if (isObj(patch[k])) into[k] = deepMerge(isObj(into[k]) ? into[k] : {}, patch[k]); else into[k] = patch[k]; });
  return into;
}
function normProgress(d) { d = isObj(d) ? d : {}; return { read: isObj(d.read) ? d.read : {}, checks: isObj(d.checks) ? d.checks : {}, updatedAt: d.updatedAt || null }; }

let progress = normProgress(lsGet(LS_PROGRESS));
let practice = {};                   // learner/practice → subtopics
let plan = { name: "", current: null, next: [] }; // learner/plan
let db = null, dbState = "local";    // local | live | readonly
let remoteExists = false, remoteBase = null;
let pending = null, inflight = null, writing = false;

/* Запис лише після дії учня, по одному за раз: зміни, що прийшли під час запису, чекають і йдуть одним наступним записом. */
function record(patch) {
  const now = new Date().toISOString();
  deepMerge(progress, patch);
  progress.updatedAt = now;
  lsSet(LS_PROGRESS, progress);
  if (!db || dbState !== "live") return;
  pending = deepMerge(pending || {}, patch);
  pump();
}
async function pump() {
  if (writing || !pending || !db) return;
  writing = true; inflight = pending; pending = null;
  const stamp = { updatedAt: new Date().toISOString(), mapVersion: MAP_VERSION };
  const ref = db.doc("learner/progress");
  const whole = () => ref.set(Object.assign(clone({ read: progress.read, checks: progress.checks }), stamp));
  try {
    if (!remoteExists) { await whole(); remoteExists = true; }
    else {
      try { await ref.update(Object.assign(clone(inflight), stamp)); }
      catch (e) {
        if (e && e.code === "invalid_argument") { await whole(); remoteExists = true; } // документ могли видалити
        else if (e && e.code === "unavailable") { await new Promise(r => setTimeout(r, 600 + Math.random() * 900)); await ref.update(Object.assign(clone(inflight), stamp)); }

    if (e && (e.code === "invalid_argument" || e.code === "revoked" || e.code === "not_granted")) { dbState = "readonly"; pending = null; paintStatus(); }

  }
}

  remoteBase = normProgress(clone(d));
  const merged = normProgress(clone(remoteBase));
  if (inflight) deepMerge(merged, inflight);
  if (pending) deepMerge(merged, pending);
  const changed = JSON.stringify([merged.read, merged.checks]) !== JSON.stringify([progress.read, progress.checks]);
  progress = merged;
  lsSet(LS_PROGRESS, progress);
  return changed;
}

/* ---------- Підрахунки ---------- */
function practiceOf(id) { const p = practice[id]; return p && +p.answered > 0 ? { answered: +p.answered, correct: +p.correct || 0, last: p.last || "" } : null; }
function isMastered(p) { return !!p && p.answered >= 3 && p.correct / p.answered >= 0.8; }
function checkCount(st) { const know = st.checks.filter(c => progress.checks[c.id] === "know").length; return { know, total: st.checks.length }; }
function statusOf(st) {
  if (!st.ready) return "planned";
  if (isMastered(practiceOf(st.id))) return "mastered";
  const c = checkCount(st);
  if (c.total && c.know === c.total) return "checked";
  if (progress.read[st.id]) return "read";
  return "new";
}
const STATUS = {
  planned: ["урок готується", "st-planned"],
  mastered: ["опановано на практиці", "st-mastered"],
  checked: ["самоперевірка пройдена", "st-checked"],
  read: ["прочитано", "st-read"],
  new: ["ще не відкрито", "st-new"]
};
// Бал підтеми: прочитано, самоперевірка, практика — по третині; «опановано» = 100 %.
function scoreOf(st) {
  const p = practiceOf(st.id);
  if (isMastered(p)) return 1;
  const c = checkCount(st);
  const prac = p ? Math.min(1, p.answered / 3) * Math.min(1, (p.correct / p.answered) / 0.8) : 0;
  return ((progress.read[st.id] ? 1 : 0) + (c.total ? c.know / c.total : 0) + prac) / 3;
}
function agg(subs) {
  const ready = subs.filter(s => s.ready);
  const pct = ready.length ? Math.round(ready.reduce((a, s) => a + scoreOf(s), 0) / ready.length * 100) : null;
  return { all: subs.length, ready: ready.length, pct,
    read: ready.filter(s => progress.read[s.id]).length,
    mastered: ready.filter(s => isMastered(practiceOf(s.id))).length };
}
const topicSubs = t => t.subtopics;

/* ---------- Допоміжне ---------- */
function esc(s) { return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
// У текстах уроків дозволено лише <b>, <i>, <sub>, <sup>; усе інше екранується.
function rich(s) { return esc(s).replace(/&lt;(\/?)(b|i|sub|sup)&gt;/g, "<$1$2>"); }

function plural(n, f) { const a = Math.abs(n) % 100, b = a % 10; return a > 10 && a < 20 ? f[2] : b === 1 ? f[0] : b >= 2 && b <= 4 ? f[1] : f[2]; }
function fmtDate(iso) {
  if (!iso) return "";
  const d = new Date(String(iso).length === 10 ? iso + "T12:00:00" : iso);
  if (isNaN(d)) return String(iso);
  try { return d.toLocaleDateString("uk-UA", { day: "numeric", month: "long", year: "numeric" }).replace(/\s*р\.$/, ""); } catch (e) { return String(iso).slice(0, 10); }
}
function ring(pct, size, color, big) {
  const sw = big ? 7 : 6, r = (size - sw) / 2, c = 2 * Math.PI * r, cx = size / 2;
  const v = pct == null ? 0 : Math.max(0, Math.min(100, pct));
  return `<svg class="ring${big ? " big" : ""}" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true" style="--ring-c:${color}">`
    + `<circle class="trk" cx="${cx}" cy="${cx}" r="${r}" stroke-width="${sw}"/>`
    + (v > 0 ? `<circle class="val" cx="${cx}" cy="${cx}" r="${r}" stroke-width="${sw}" stroke-dasharray="${(c * v / 100).toFixed(2)} ${c.toFixed(2)}" transform="rotate(-90 ${cx} ${cx})"/>` : "")

/* ---------- Стан інтерфейсу ---------- */
const uiSaved = lsGet(LS_UI) || {};
const ui = {
  subject: SUBJ[uiSaved.subject] ? uiSaved.subject : (DATA.subjects[0] && DATA.subjects[0].id) || null,
  view: "map",         // map | lesson | parents
  lesson: null,
  open: new Set(Array.isArray(uiSaved.open) ? uiSaved.open : []),
  openTouched: !!uiSaved.openTouched,
  steps: {},           // скільки кроків показано: ключ «<підтема>#<номер прикладу>»
  chk: {},             // самоперевірка в цьому візиті: { phase: "fresh"|"retry"|"done", value, wrong: [], msg }
  copied: null
};

function autoOpen() {
  // Поки учень сам нічого не розгортав: розгорнути тему «Зараз у школі» (або перший розділ).
  if (ui.openTouched) return;
  const cur = plan.current && TOP[plan.current.topic];
  if (cur && cur.subject.id === ui.subject) { ui.open.add(cur.section.id); ui.open.add(cur.id); return; }
  const s = SUBJ[ui.subject];
  if (s && s.sections[0] && !s.sections.some(x => ui.open.has(x.id))) ui.open.add(s.sections[0].id);
}

/* ---------- Шапка ---------- */
const $ = id => document.getElementById(id);
function renderHeader() {
  const grades = [...new Set(DATA.subjects.map(s => s.grade).filter(Boolean))];
  const bits = [];
  if (plan.name) bits.push(esc(plan.name));
  if (grades.length === 1) bits.push(`${grades[0]} клас`);
  $("who").innerHTML = bits.join(" · ");
  $("who").hidden = !bits.length;
  const tabs = $("tabs");
  tabs.hidden = !DATA.subjects.length || ui.view === "parents";
  tabs.innerHTML = DATA.subjects.map(s => {
    const sel = s.id === ui.subject;
    return `<button class="tab" type="button" role="tab" id="tab-${s.id}" aria-selected="${sel}" aria-controls="main" tabindex="${sel ? 0 : -1}" data-act="tab" data-id="${s.id}" data-k="tab-${s.id}" style="--tab-c:${s.color}"><span class="ic" aria-hidden="true">${esc(s.icon || "")}</span>${esc(s.name)}</button>`;
  }).join("");

  pt.hidden = !DATA.subjects.length;
  pt.setAttribute("aria-pressed", String(ui.view === "parents"));

  if (ui.view !== "parents" && ui.subject) { main.setAttribute("role", "tabpanel"); main.setAttribute("aria-labelledby", "tab-" + ui.subject); }

}
function paintStatus() {
  $("store-status").textContent = dbState === "live" ? "Прогрес зберігається разом з твоєю картою."
    : dbState === "readonly" ? "Цю карту відкрито лише для перегляду: позначки зберігаються тільки в цьому браузері."
    : "Прогрес зберігається в цьому браузері.";
  $("ver").textContent = "Версія карти " + MAP_VERSION;
}

/* ---------- Карта предмета ---------- */
function emptyHtml(title, text) {
  return `<div class="card empty"><div class="big" aria-hidden="true">🌱</div><h2>${title}</h2><p>${text}</p></div>`;
}
function subjectHtml(s) {
  if (!s.sections.length) return emptyHtml("Карта ще наповнюється…", `Уроки з предмета «${esc(s.name)}» скоро з'являться. А поки можна просто поговорити з репетитором: напиши «Привіт, ${esc(s.tutorCall || s.tutor || "")}».`);
  const a = agg(s.subs);
  const cur = plan.current && plan.current.subject === s.id ? TOP[plan.current.topic] : null;
  const next = (plan.next || []).map(id => SUB[id]).filter(st => st && st.subject.id === s.id);
  let hints = "";
  if (cur || next.length) {
    hints = `<div class="hints">`
      + (cur ? `<div class="hint now"><span class="lbl">📍 Зараз у школі:</span><span>${rich(cur.name)}</span><button class="chip now" type="button" data-act="goto-topic" data-id="${cur.id}" data-k="goto-${cur.id}">Показати на карті</button></div>` : "")
      + (next.length ? `<div class="hint next"><span class="lbl">➜ Наступний крок:</span>${next.map(st => `<button class="chip next" type="button" data-act="open" data-id="${st.id}" data-k="nx-${st.id}">${rich(st.name)}</button>`).join("")}</div>` : "")
      + `</div>`;
  }
  return `<section class="card intro" aria-label="Огляд предмета">
      ${ring(a.pct, 76, s.color, true)}
      <div><h2>${esc(s.icon || "")} ${esc(s.name)}</h2>
      <p class="sub-line">${s.tutor ? `Репетитор: ${esc(s.tutor)} · ` : ""}готових уроків ${a.ready} з ${a.all} · прочитано ${a.read}${a.mastered ? ` · опановано ${a.mastered}` : ""}</p></div>
    </section>
    ${hints}
    <div class="legend" aria-label="Умовні позначення">
      <span><span class="pill st-read">прочитано</span></span>
      <span><span class="pill st-checked">самоперевірка пройдена</span></span>
      <span><span class="pill st-mastered">опановано на практиці</span></span>
      <span><span class="pill st-planned">урок готується</span></span>
    </div>
    <ol class="tree">${s.sections.map(sec => sectionHtml(sec, cur)).join("")}</ol>`;
}
function sectionHtml(sec, cur) {
  const open = ui.open.has(sec.id), a = agg(sec.subs);
  return `<li class="sec"><h2><button class="sec-head" type="button" aria-expanded="${open}" aria-controls="b-${sec.id}" data-act="toggle" data-id="${sec.id}" data-k="h-${sec.id}">
      ${ring(a.pct, 52, sec.subject.color)}
      <span><span class="code">${esc(sec.id)}</span> <span class="nm">${rich(sec.name)}</span>
      <span class="meta">${sec.topics.length} ${plural(sec.topics.length, ["тема", "теми", "тем"])} · готових уроків ${a.ready} з ${a.all}${a.read ? ` · прочитано ${a.read}` : ""}${cur && cur.section === sec ? " · 📍 зараз у школі" : ""}</span></span>
      <span class="chev" aria-hidden="true">▶</span></button></h2>
    <div class="sec-body" id="b-${sec.id}"${open ? "" : " hidden"}>
      ${sec.what ? `<p class="what">${rich(sec.what)}</p>` : ""}
      <ul class="topics">${sec.topics.map(t => topicHtml(t, cur)).join("")}</ul>
    </div></li>`;
}
function topicHtml(t, cur) {
  const open = ui.open.has(t.id), a = agg(topicSubs(t)), isNow = cur === t;
  return `<li class="topic${isNow ? " now" : ""}" id="topic-${t.id}"><h3><button class="topic-head" type="button" aria-expanded="${open}" aria-controls="b-${t.id}" data-act="toggle" data-id="${t.id}" data-k="h-${t.id}">
      <span class="t1"><span class="code">${esc(t.id)}</span><span class="nm">${rich(t.name)}</span>${isNow ? `<span class="badge now">Зараз у школі</span>` : ""}</span>
      <span class="chev" aria-hidden="true">▶</span>
      <span class="t2">${a.ready ? bar(a.pct, t.subject.color) : `<span>уроки готуються</span>`}<span>${a.ready ? `${a.pct}% · ` : ""}${a.all} ${plural(a.all, ["підтема", "підтеми", "підтем"])}</span></span>
    </button></h3>
    <div class="topic-body" id="b-${t.id}"${open ? "" : " hidden"}>
      ${t.what ? `<p class="what">${rich(t.what)}</p>` : ""}
      <ul class="subs">${t.subtopics.map(subRowHtml).join("")}</ul>
    </div></li>`;
}
function subRowHtml(st) {
  const s = statusOf(st), p = practiceOf(st.id), isNext = (plan.next || []).includes(st.id);
  const tags = `<span class="tags">${isNext ? `<span class="badge next">Наступний крок</span>` : ""}${s !== "new" ? `<span class="pill ${STATUS[s][1]}">${STATUS[s][0]}</span>` : ""}${p && st.ready ? `<span class="pill prac" title="Задачі з репетитором: правильно ${p.correct} з ${p.answered}">✓ ${p.correct}/${p.answered}</span>` : ""}</span>`;
  const label = `<span><span class="code">${esc(st.id)}</span> <span class="nm">${rich(st.name)}</span></span>`;
  if (!st.ready) return `<li><div class="sub planned">${label}${tags}</div></li>`;
  return `<li><button class="sub${isNext ? " is-next" : ""}" type="button" data-act="open" data-id="${st.id}" data-k="s-${st.id}" aria-label="${esc(plain(st.name))}, урок. ${STATUS[s][0]}${isNext ? ", наступний крок" : ""}">${label}${tags}</button></li>`;
}

/* ---------- Малюнки (fig): опис фігури → SVG. Формат — study-map/FIGURES.md ----------
   Математичні координати (y вгору) переводимо в пікселі самі, тож товщина ліній не залежить від `view`.

const FIG = { maxW: 300, maxH: 300, pad: 26, dot: 3.5, tick: 12, tickGap: 5, right: 12, arcGap: 5 };

}
// Відрізок, обрізаний прямокутником (Liang–Barsky). t0, t1 — межі параметра; повертає [x0, y0, x1, y1] або null.

  try { return buildFig(fig, hl || []); }
  catch (e) { try { console.warn("Малюнок не намальовано:", e && e.message, fig && fig.caption); } catch (_) {} return ""; }
}
function buildFig(fig, hl) {

  const P = {};
  Object.keys(fig.points || {}).forEach(k => { const p = fig.points[k]; if (!Array.isArray(p) || p.length !== 2 || !fin(p[0]) || !fin(p[1])) throw new Error("погана точка " + k); P[k] = p; });
  const pt = n => { if (Array.isArray(n) && n.length === 2 && fin(n[0]) && fin(n[1])) return n; if (!P[n]) throw new Error("немає точки " + n); return P[n]; };
  const dx = v[2] - v[0], dy = v[3] - v[1];
  const sc = Math.min(FIG.maxW / dx, FIG.maxH / dy), pad = FIG.pad;
  const W = dx * sc + 2 * pad, H = dy * sc + 2 * pad;
  const X = x => pad + (x - v[0]) * sc, Y = y => pad + (v[3] - y) * sc;
  const f = n => Math.round(n * 10) / 10;
  const id = "fg" + (++figSeq);
  const back = [], body = [], top = [], front = [];
  const hlSet = new Set(hl);
  // Радіус дуги: біля спільної вершини менший кут — ближче до вершини (як у зразку).
  const angRank = {};
  (fig.items || []).forEach((it, i) => {

    const [A, O, B] = it.p.map(n => P[n]), tA = Math.atan2(A[1] - O[1], A[0] - O[0]), tB = Math.atan2(B[1] - O[1], B[0] - O[0]);

  // Дуга відходить далі від вершини лише тоді, коли всередині цього кута лежить менший кут

  }

  if (isObj(fig.axes)) {
    const st = +fig.axes.step > 0 ? +fig.axes.step : 1, ev = Math.max(1, Math.round(+fig.axes.every || 1));
    const g = [];
    for (let i = Math.ceil(v[0] / st); i * st <= v[2] + 1e-9; i++) g.push(`M${f(X(i * st))} ${f(Y(v[1]))}V${f(Y(v[3]))}`);
    for (let i = Math.ceil(v[1] / st); i * st <= v[3] + 1e-9; i++) g.push(`M${f(X(v[0]))} ${f(Y(i * st))}H${f(X(v[2]))}`);
    back.push(`<path class="f-grid" d="${g.join("")}"/>`);

      ax.push(`<path class="f-axis" d="M${f(X(v[0]))} ${f(oy)}H${f(x1)}"/><path class="f-arrow" d="M${f(x1)} ${f(oy)}l-9 -4v8z"/>`);
      top.push(`<text class="f-axl" x="${f(x1 - 2)}" y="${f(oy + 18)}" text-anchor="end">x</text>`); boxes.push([x1 - 12, oy + 4, x1, oy + 20]);
    }
    if (yAx) {
      const y1 = Y(v[3]) - 14;
      addSeg(ox, Y(v[1]), ox, y1);
      ax.push(`<path class="f-axis" d="M${f(ox)} ${f(Y(v[1]))}V${f(y1)}"/><path class="f-arrow" d="M${f(ox)} ${f(y1)}l-4 9h8z"/>`);
      top.push(`<text class="f-axl" x="${f(ox - 9)}" y="${f(y1 + 6)}" text-anchor="end">y</text>`); boxes.push([ox - 20, y1 - 8, ox - 8, y1 + 8]);
    }
    if (xAx && yAx) { top.push(`<text class="f-num" x="${f(ox - 5)}" y="${f(oy + 5)}" text-anchor="end" dominant-baseline="hanging">O</text>`); boxes.push([ox - 15, oy + 5, ox - 5, oy + 17]); }
    const S = st * ev;
    for (let i = Math.ceil(v[0] / S); i * S <= v[2] + 1e-9; i++) {
      const x = i * S; if (Math.abs(x) < 1e-9 || X(x) > X(v[2]) - 10) continue;
      top.push(`<text class="f-num" x="${f(X(x))}" y="${f(oy + 5)}" text-anchor="middle" dominant-baseline="hanging">${figNum(x)}</text>`);
      { const w = textW(figNum(x), 12); boxes.push([X(x) - w / 2, oy + 5, X(x) + w / 2, oy + 17]); }
      nums.push(`<path class="f-axis" d="M${f(X(x))} ${f(oy - 3)}v6"/>`);
    }
    for (let i = Math.ceil(v[1] / S); i * S <= v[3] + 1e-9; i++) {
      const y = i * S; if (Math.abs(y) < 1e-9 || Y(y) < Y(v[3]) + 10) continue;
      top.push(`<text class="f-num" x="${f(ox - 6)}" y="${f(Y(y))}" text-anchor="end" dominant-baseline="central">${figNum(y)}</text>`);
      { const w = textW(figNum(y), 12); boxes.push([ox - 6 - w, Y(y) - 6, ox - 6, Y(y) + 6]); }
      nums.push(`<path class="f-axis" d="M${f(ox - 3)} ${f(Y(y))}h6"/>`);
    }
    back.push(ax.join(""), nums.join(""));
  }

  const lineEnds = (a, b, t0, t1) => { const c = clipLine(a[0], a[1], b[0] - a[0], b[1] - a[1], t0, t1, v); if (!c) return ""; addSeg(X(c[0]), Y(c[1]), X(c[2]), Y(c[3])); return `M${f(X(c[0]))} ${f(Y(c[1]))}L${f(X(c[2]))} ${f(Y(c[3]))}`; };

  (fig.items || []).forEach((it, idx) => {
    if (!isObj(it)) throw new Error("елемент не об'єкт");
    const sty = figStyle(it.s), on = it.id != null && hlSet.has(String(it.id));
    const cls = `it t-${esc(it.t)} ${sty.cls}${on ? " on" : ""}`, data = it.id != null ? ` data-fid="${esc(it.id)}"` : "";
    const out = [];
    const p = Array.isArray(it.p) ? it.p.map(pt) : [];
    switch (it.t) {
      case "seg": {
        if (p.length !== 2) throw new Error("seg: потрібні 2 точки");
        addSeg(X(p[0][0]), Y(p[0][1]), X(p[1][0]), Y(p[1][1]));
        out.push(`<path class="stk" d="M${f(X(p[0][0]))} ${f(Y(p[0][1]))}L${f(X(p[1][0]))} ${f(Y(p[1][1]))}" clip-path="url(#${id}-c)"/>`);
        const n = Math.max(0, Math.min(3, Math.round(+it.ticks || 0)));
        if (n) {
          const ax = X(p[0][0]), ay = Y(p[0][1]), bx = X(p[1][0]), by = Y(p[1][1]), L = Math.hypot(bx - ax, by - ay) || 1;
          const ux = (bx - ax) / L, uy = (by - ay) / L, nx = -uy, ny = ux, mx = (ax + bx) / 2, my = (ay + by) / 2, h = FIG.tick / 2;
          let d = "";
          for (let i = 0; i < n; i++) { const o = (i - (n - 1) / 2) * FIG.tickGap, cx = mx + ux * o, cy = my + uy * o; d += `M${f(cx - nx * h)} ${f(cy - ny * h)}L${f(cx + nx * h)} ${f(cy + ny * h)}`; }

        }

      }
      case "ray": case "line": {
        if (p.length !== 2) throw new Error(it.t + ": потрібні 2 точки");

        out.push(`<path class="stk${it.fill ? " fill" : ""}" d="M${p.map(q => `${f(X(q[0]))} ${f(Y(q[1]))}`).join("L")}Z" clip-path="url(#${id}-c)"/>`);
        break;
      }
      case "circle": {
        const c = pt(it.c), r = it.through != null ? Math.hypot(pt(it.through)[0] - c[0], pt(it.through)[1] - c[1]) : +it.r;
        if (!(r > 0)) throw new Error("circle: поганий радіус");
        for (let j = 0; j < 36; j++) { const t0 = j * Math.PI / 18, t1 = (j + 1) * Math.PI / 18; addSeg(X(c[0]) + r * sc * Math.cos(t0), Y(c[1]) - r * sc * Math.sin(t0), X(c[0]) + r * sc * Math.cos(t1), Y(c[1]) - r * sc * Math.sin(t1)); }
        out.push(`<circle class="stk" cx="${f(X(c[0]))}" cy="${f(Y(c[1]))}" r="${f(r * sc)}" clip-path="url(#${id}-c)"/>`);

      }
      case "angle": {
        if (p.length !== 3) throw new Error("angle: потрібні 3 точки");
        const [A, O, B] = p, a1 = Math.atan2(A[1] - O[1], A[0] - O[0]), a2 = Math.atan2(B[1] - O[1], B[0] - O[0]);
        let d = a2 - a1; while (d <= -Math.PI) d += 2 * Math.PI; while (d > Math.PI) d -= 2 * Math.PI;
        if (Math.abs(Math.abs(d) - Math.PI) < 1e-6) d = Math.PI; // розгорнутий — проти годинникової від OA до OB
        const k = (rankOf[idx] || 0) + 1;
        const lenA = Math.hypot(A[0] - O[0], A[1] - O[1]) * sc, lenB = Math.hypot(B[0] - O[0], B[1] - O[1]) * sc;

        const arcs = Math.max(1, Math.min(3, Math.round(+it.arcs || 1)));
        let r = fin(it.r) && it.r > 0 ? it.r : Math.max(16, Math.min(28 + (k - 1) * 12, 0.45 * Math.min(lenA, lenB)));
        const cx = X(O[0]), cy = Y(O[1]);

        let path = "";
        for (let i = 0; i < arcs; i++) {
          const rr = r + i * FIG.arcGap, m = a1 + d / 2, s0 = at(a1, rr), s1 = at(m, rr), s2 = at(a1 + d, rr), sw = d > 0 ? 0 : 1;
          path += `M${f(s0[0])} ${f(s0[1])}A${f(rr)} ${f(rr)} 0 0 ${sw} ${f(s1[0])} ${f(s1[1])}A${f(rr)} ${f(rr)} 0 0 ${sw} ${f(s2[0])} ${f(s2[1])}`;

          const outer = r + (arcs - 1) * FIG.arcGap, tw = textW(txt, 14), dist = outer + 6 + Math.abs(ux) * tw / 2 + Math.abs(uy) * 8;

        const s = FIG.right, a = [hx + u[0] / lu * s, hy + u[1] / lu * s], b = [hx + w[0] / lw * s, hy + w[1] / lw * s];
        out.push(`<path class="rmk" d="M${f(a[0])} ${f(a[1])}L${f(a[0] + b[0] - hx)} ${f(a[1] + b[1] - hy)}L${f(b[0])} ${f(b[1])}"/>`);
        break;
      }
      case "label": {
        const q = pt(it.at);
        { const lw = textW(it.text, 15); boxes.push([X(q[0]) - lw / 2, Y(q[1]) - 8, X(q[0]) + lw / 2, Y(q[1]) + 8]); }
        out.push(`<text class="flb" x="${f(X(q[0]))}" y="${f(Y(q[1]))}" text-anchor="middle" dominant-baseline="central">${esc(it.text)}</text>`);
        break;
      }
      case "fn": {
        if (!fin(it.k) || !fin(it.b)) throw new Error("fn: k і b — числа");

        if (c) {

          if (it.label) {
            const L = Math.hypot(ex - sx, ey - sy) || 1, ux = (ex - sx) / L, uy = (ey - sy) / L, cands = [];

          }
        }
        break;
      }
      case "vline": {
        if (!fin(it.x)) throw new Error("vline: x — число");
        if (it.x >= v[0] && it.x <= v[2]) {
          const xx = X(it.x); addSeg(xx, Y(v[1]), xx, Y(v[3]));
          out.push(`<path class="stk" d="M${f(xx)} ${f(Y(v[1]))}V${f(Y(v[3]))}"/>`);
          if (it.label) {
            const cands = [];
            [10, 18].forEach(off => [0.8, 0.65, 0.5, 0.35, 0.2].forEach(t => { const yy = Y(v[1]) + (Y(v[3]) - Y(v[1])) * t; cands.push({ x: xx + off, y: yy, ux: 1, uy: 0 }, { x: xx - off, y: yy, ux: -1, uy: 0 }); }));
            later.push({ g: idx, html: () => place(cands, it.label, "flb", 15, { inside: viewBox }) });
          }
        }
        break;
      }
      case "plot": {
        const ps = (it.pts || []).map(q => pt(q));
        if (ps.length < 2) throw new Error("plot: потрібно ≥ 2 точки");
        ps.slice(1).forEach((q, j) => addSeg(X(ps[j][0]), Y(ps[j][1]), X(q[0]), Y(q[1])));
        out.push(`<path class="stk" d="M${ps.map(q => `${f(X(q[0]))} ${f(Y(q[1]))}`).join("L")}" clip-path="url(#${id}-c)"/>`);
        break;
      }
      default: throw new Error("невідомий тип " + it.t);
    }
    body.push([`<g class="${cls}"${data}>${out.join("")}`, "</g>"]);
  });

  // Точки й підписи — поверх усього.
  const hide = new Set(Array.isArray(fig.hide) ? fig.hide : []), lp = isObj(fig.lp) ? fig.lp : {};
  const shown = Object.keys(P).filter(k => !hide.has(k));
  const cxm = shown.reduce((a, k) => a + P[k][0], 0) / (shown.length || 1), cym = shown.reduce((a, k) => a + P[k][1], 0) / (shown.length || 1);
  shown.forEach(k => { const x = X(P[k][0]), y = Y(P[k][1]); boxes.push([x - 4, y - 4, x + 4, y + 4]); front.push(`<circle class="pt" cx="${f(x)}" cy="${f(y)}" r="${FIG.dot}"/>`); });
  const dirs = Object.keys(LP).map(key => { const [a, b] = LP[key], L = Math.hypot(a, b); return [a / L, b / L]; });
  shown.forEach(k => {
    const x = X(P[k][0]), y = Y(P[k][1]);
    let prefer = LP[lp[k]] ? [LP[lp[k]]] : null;
    if (!prefer) {
      let ax = P[k][0] - cxm, ay = -(P[k][1] - cym); const L = Math.hypot(ax, ay);
      if (L < 1e-9) { ax = 0.7; ay = -0.7; } else { ax /= L; ay /= L; }
      prefer = dirs.slice().sort((p1, p2) => (p2[0] * ax + p2[1] * ay) - (p1[0] * ax + p1[1] * ay));
    }
    const cands = prefer.map(([a, b]) => { const L = Math.hypot(a, b); return { x: x + a / L * 9, y: y + b / L * 9, ux: a / L, uy: b / L }; });
    // Власна точка не заважає своєму підпису: тимчасово прибираємо її квадратик.
    const own = boxes.findIndex(bx => bx[0] === x - 4 && bx[1] === y - 4);
    const saved = own >= 0 ? boxes.splice(own, 1)[0] : null;
    front.push(place(cands, figName(k), "plb", 17));
    if (saved) boxes.push(saved);
  });
  later.forEach(l => { body[l.g] && (body[l.g][0] += l.html()); });
  const cap = String(fig.caption || "");
  return `<figure class="fig"><svg class="fig-svg" viewBox="0 0 ${f(W)} ${f(H)}" width="${f(W)}" height="${f(H)}" role="img" aria-label="${esc(cap)}">`
    + `<defs><clipPath id="${id}-c"><rect x="${f(X(v[0]))}" y="${f(Y(v[3]))}" width="${f(dx * sc)}" height="${f(dy * sc)}"/></clipPath></defs>`
    + back.join("") + body.map(x => x.join("")).join("") + top.join("") + front.join("")
    + `</svg>${cap ? `<figcaption aria-hidden="true">${esc(cap)}</figcaption>` : ""}</figure>`;
}

function exampleHtml(st, ex, k) {

/* Перевірка введеної відповіді: однаково записані відповіді збігаються, а числа порівнюються як числа
   («x = 65», «65 грн» і «65» — те саме; «2,5» = «2.5»; «−2» = «-2»). */
function normAns(x) {
  // Пробіл між двома буквами значущий («не знаю» ≠ «незнаю»); решту пробілів ігноруємо («x = 65» = «x=65»).
  let v = String(x == null ? "" : x).normalize("NFD").replace(/\u0301/g, "").normalize("NFC").trim().toLowerCase()
    .replace(/[’ʼ‘`´]/g, "'").replace(/\s+/g, " ")
    .replace(/[−–—‐‑]/g, "-").replace(/,/g, ".").replace(/[×*]/g, "·");
  v = v.replace(/(^|[^\p{L}]) | (?=[^\p{L}]|$)/gu, "$1");
  return v.replace(/\.$/, "");
}
function numAns(x) {
  let v = normAns(x).replace(/^\p{L}+=/u, "").replace(/[\p{L}°%]+$/u, "");
  let m = v.match(/^([+-]?(?:\d+(?:\.\d+)?|\.\d+))$/);
  if (m) return Number(m[1]);
  m = v.match(/^([+-]?\d+(?:\.\d+)?)\/(\d+(?:\.\d+)?)$/);
  if (m && +m[2] !== 0) return Number(m[1]) / Number(m[2]);
  return null;
}
function isAccepted(c, input) {
  const ni = normAns(input), xi = numAns(input);
  if (!ni) return false;
  return c.accept.some(a => normAns(a) === ni || (xi !== null && numAns(a) !== null && Math.abs(numAns(a) - xi) < 1e-9));
}
function checkHtml(c, i) {
  const stored = progress.checks[c.id], u = ui.chk[c.id];
  const head = `${c.fig ? renderFig(c.fig) : ""}<p class="q">${i + 1}. ${rich(c.q)}</p>`;
  const explain = `<p class="a"><b>Пояснення:</b> ${rich(c.a)}</p>`;
  const again = `<div class="row"><button class="btn ghost" type="button" data-act="chk-again" data-id="${c.id}" data-k="again-${c.id}">Спробувати ще раз</button></div>`;
  // Уже відповідали раніше (або щойно): показати результат і пояснення.
  if ((!u && stored) || (u && u.phase === "done")) {
    const res = u ? u.result : stored;
    const msg = u ? u.msg : (stored === "know" ? "Минулого разу: правильно з першої спроби ✓" : "Минулого разу: ще треба повторити.");
    const opts = c.options ? `<div class="opts">${c.options.map((o, j) => `<button class="opt${j === c.correct ? " right" : u && u.wrong.includes(j) ? " wrong" : ""}" type="button" disabled>${"АБВГ"[j]}) ${rich(o)}</button>`).join("")}</div>` : "";
    return `<div class="check" data-check="${c.id}">${head}${opts}
      <p class="res ${res}" role="status">${esc(msg)}</p>${explain}${again}</div>`;
  }
  const st = u || { phase: "fresh", value: "", wrong: [] };
  const retryMsg = st.phase === "retry" ? `<p class="res not-yet" role="status">Не зовсім. Спробуй ще раз.</p>` : "";
  const giveUp = st.phase === "retry" ? `<button class="btn ghost" type="button" data-act="chk-show" data-id="${c.id}" data-k="show-${c.id}">Показати відповідь</button>` : "";
  if (c.options) {
    return `<div class="check" data-check="${c.id}">${head}
      <div class="opts" role="group" aria-label="Варіанти відповіді">${c.options.map((o, j) => `<button class="opt${st.wrong.includes(j) ? " wrong" : ""}" type="button" data-act="chk-opt" data-id="${c.id}" data-i="${j}" data-k="opt-${c.id}-${j}"${st.wrong.includes(j) ? " disabled" : ""}>${"АБВГ"[j]}) ${rich(o)}</button>`).join("")}</div>
      ${retryMsg}${giveUp ? `<div class="row">${giveUp}</div>` : ""}</div>`;
  }
  return `<div class="check" data-check="${c.id}">${head}
    <div class="row ans-row"><label class="sr" for="in-${c.id}">Твоя відповідь</label>
      <input class="chk-in" id="in-${c.id}" data-id="${c.id}" data-k="in-${c.id}" type="text" inputmode="text" autocomplete="off" spellcheck="false" placeholder="Твоя відповідь" value="${esc(st.value)}">
      <button class="btn" type="button" data-act="chk-submit" data-id="${c.id}" data-k="submit-${c.id}">Перевірити</button>${giveUp}</div>
    ${retryMsg}</div>`;
}
function findCheck(id) { const st = SUB[id.replace(/-\d+$/, "")]; return st ? st.checks.find(c => c.id === id) : null; }
function answerCheck(id, right, extra) {
  const c = findCheck(id); if (!c) return;
  const u = ui.chk[id] || (ui.chk[id] = { phase: "fresh", value: "", wrong: [] });
  if (extra && extra.value != null) u.value = extra.value;
  let result = null, msg = "";
  if (right && u.phase === "fresh") { result = "know"; msg = "Правильно!"; }
  else if (right) { result = "not-yet"; msg = "Правильно з другої спроби. Глянь пояснення, щоб наступного разу вийшло одразу."; }
  else if (u.phase === "fresh") { u.phase = "retry"; if (extra && extra.opt != null) u.wrong.push(extra.opt); }
  else { result = "not-yet"; msg = "Не зовсім. Ось правильна відповідь і пояснення — нічого страшного, повториш."; if (extra && extra.opt != null) u.wrong.push(extra.opt); }
  if (result) { u.phase = "done"; u.result = result; u.msg = msg; record({ checks: { [id]: result } }); }
}
function practiceLine(st, p) {
  const who = esc(st.subject.tutor || "репетитор");
  if (!p) return dbState === "local" ? `Тут з'являться результати задач, які дасть ${who}, коли карту відкрито як твою особисту сторінку з чату.` : `Поки задач на цю тему не було. Попроси їх нижче — результат з'явиться тут.`;
  const pct = Math.round(p.correct / p.answered * 100);
  return `Правильно <b>${p.correct} з ${p.answered}</b> (${pct}%)${p.last ? `, востаннє ${esc(fmtDate(p.last))}` : ""}. `
    + (isMastered(p) ? "Це вже опановано на практиці. Чудово!" : "Тему вважаємо опанованою, коли правильно хоча б 8 з 10 (і розв'язано щонайменше 3 задачі).");
}

/* ---------- Для батьків ---------- */
function parentsHtml() {
  const allPr = Object.keys(practice).map(id => [SUB[id], practiceOf(id)]).filter(x => x[0] && x[1]);
  const dates = [progress.updatedAt, ...allPr.map(x => x[1].last)].filter(Boolean).map(String).sort();
  const last = dates.length ? dates[dates.length - 1] : null;
  const cards = DATA.subjects.map(s => {
    const a = agg(s.subs);
    const cur = plan.current && plan.current.subject === s.id ? TOP[plan.current.topic] : null;
    const byTopic = [];
    s.sections.forEach(sec => sec.topics.forEach(t => {
      const ps = t.subtopics.map(st => practiceOf(st.id)).filter(Boolean);
      if (!ps.length) return;
      const ans = ps.reduce((x, p) => x + p.answered, 0), cor = ps.reduce((x, p) => x + p.correct, 0);
      byTopic.push([t, cor, ans]);
    }));
    const weak = s.subs.map(st => [st, practiceOf(st.id)]).filter(([, p]) => p && p.answered >= 3 && p.correct / p.answered < 0.6);
    const tone = pct => pct >= 80 ? "var(--good)" : pct >= 60 ? "var(--mid)" : "var(--bad)";
    const word = pct => pct >= 80 ? "добре" : pct >= 60 ? "непогано" : "варто підтягнути";
    return `<section class="card" aria-labelledby="ph-${s.id}">
      <h3 id="ph-${s.id}">${esc(s.icon || "")} ${esc(s.name)}${s.tutor ? ` <span class="note">· репетитор ${esc(s.tutor)}</span>` : ""}</h3>
      ${a.ready ? `<div class="meters">
        <div class="meter"><div class="lbl"><span>Прочитано уроків</span><b>${a.read} з ${a.ready}</b></div>${bar(Math.round(a.read / a.ready * 100), "var(--accent)")}</div>
        <div class="meter"><div class="lbl"><span>Опановано на практиці</span><b>${a.mastered} з ${a.ready}</b></div>${bar(Math.round(a.mastered / a.ready * 100), "var(--good)")}</div>
      </div>
      <p class="note" style="margin-top:8px">Рахуємо лише готові уроки (${a.ready} з ${a.all} підтем). Решта ще готується.</p>`
      : `<p class="note">Уроки з цього предмета ще готуються.</p>`}
      <p style="margin-top:12px"><b>Зараз у школі:</b> ${cur ? `${esc(cur.id)} ${rich(cur.name)}` : "репетитор ще не позначив тему."}</p>
      ${byTopic.length ? `<h3 style="margin-top:14px">Точність у задачах за темами</h3>
        <table class="acc"><thead><tr><th>Тема</th><th>Правильно</th><th class="barcol"><span class="sr">Шкала</span></th></tr></thead><tbody>
        ${byTopic.map(([t, cor, ans]) => { const pct = Math.round(cor / ans * 100); return `<tr><td>${rich(t.name)}</td><td class="num">${cor} з ${ans} · <b style="color:${tone(pct)}">${pct}%</b> <span class="note">${word(pct)}</span></td><td class="barcol">${bar(pct, tone(pct))}</td></tr>`; }).join("")}
        </tbody></table>` : `<p class="note" style="margin-top:8px">${dbState === "local" ? "Результати задач з репетитором видно, коли карту відкрито як особисту сторінку учня з чату." : "Задач з репетитором ще не було."}</p>`}
      ${weak.length ? `<h3 style="margin-top:14px">Що варто підтягнути</h3><ul class="weak">${weak.map(([st, p]) => `<li>${rich(st.name)} — правильно ${p.correct} з ${p.answered}</li>`).join("")}</ul>` : ""}
    </section>`;
  }).join("");
  return `<section class="par-head"><h2>Як ідуть справи</h2>
      <p class="note" style="margin-top:4px">${last ? `Остання активність: ${esc(fmtDate(last))}.` : "Поки що жодної позначки: уроки ще не відкривали."}</p></section>
    <div class="subj-cards">${cards}</div>
    <section class="card"><h3>Як допомогти</h3><ul class="tips">
      <li>Попросіть дитину пояснити Вам одну підтему своїми словами. Пояснити іншому — найкращий спосіб запам'ятати.</li>
      <li>Короткі заняття часто (15–20 хвилин кілька разів на тиждень) дають більше, ніж одне довге.</li>
      <li>Хваліть за старання й за чесне «Ще ні» в самоперевірці — так видно, що повторити.</li>
      <li>Якщо тема «варто підтягнути», не сваріть: у кожному уроці є готовий запит, щоб попросити в репетитора ще задач.</li>
      <li>Не розв'язуйте задачі замість дитини. Краще спитайте: «З чого ти почнеш?»</li>
    </ul><p class="note" style="margin-top:10px">Відсотки тут — з карти й задач з репетитором. Це не шкільна оцінка.</p></section>`;
}

/* ---------- Малювання ---------- */
function render(opts) {
  opts = opts || {};
  const main = $("main");
  const ae = document.activeElement, key = ae && ae.closest && ae.closest("[data-k]") && ae.dataset.k;
  renderHeader();
  let html;
  if (!DATA.subjects.length) html = emptyHtml("Карта ще наповнюється…", "Тут з'являться предмети, теми й короткі уроки. Зазирни трохи згодом — або вже зараз поговори з репетитором у чаті.");
  else if (ui.view === "parents") html = parentsHtml();
  else if (ui.view === "lesson" && SUB[ui.lesson] && SUB[ui.lesson].ready) html = lessonHtml(SUB[ui.lesson]);
  else { ui.view = "map"; autoOpen(); html = subjectHtml(SUBJ[ui.subject]); }
  main.innerHTML = html;
  paintStatus();
  if (opts.focus) { const el = document.querySelector(opts.focus); if (el) { el.focus({ preventScroll: !!opts.noScroll }); if (el.tagName === "INPUT") { try { el.setSelectionRange(el.value.length, el.value.length); } catch (e) {} } if (!opts.noScroll && el.scrollIntoView) el.scrollIntoView({ block: opts.block || "nearest" }); } }
  else if (key && document.activeElement === document.body) { const el = document.querySelector(`[data-k="${key}"]`); if (el) el.focus({ preventScroll: true }); }
}

function openLesson(id) {
  const st = SUB[id];
  if (!st || !st.ready) return;
  ui.subject = st.subject.id; ui.view = "lesson"; ui.lesson = id; ui.copied = null;
  ui.open.add(st.section.id); ui.open.add(st.topic.id);
  saveUi();
  render({ focus: "#lesson-title", noScroll: true });
  window.scrollTo(0, 0);
}
function backToMap() {
  const from = ui.lesson; ui.view = "map"; ui.lesson = null;
  render({ focus: from ? `[data-k="s-${from}"]` : "#main", block: "center" });
}

document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]");
  if (!b) return;
  const act = b.dataset.act, id = b.dataset.id;
  if (act === "tab") { ui.subject = id; ui.view = "map"; ui.lesson = null; saveUi(); render({ focus: `#tab-${id}`, noScroll: true }); }
  else if (act === "toggle") {
    ui.openTouched = true;
    if (ui.open.has(id)) ui.open.delete(id); else ui.open.add(id);
    saveUi(); render({ focus: `[data-k="h-${id}"]`, noScroll: true });
  }
  else if (act === "goto-topic") {
    const t = TOP[id]; if (!t) return;
    ui.open.add(t.section.id); ui.open.add(t.id); ui.openTouched = true; saveUi();
    render({ focus: `[data-k="h-${id}"]`, block: "center" });
  }
  else if (act === "open") openLesson(id);
  else if (act === "back") backToMap();
  else if (act === "step" || act === "steps-all" || act === "steps-reset") {
    const k = +b.dataset.ex, key = `${id}#${k}`, n = ((SUB[id].examples[k] || {}).steps || []).length;
    ui.steps[key] = act === "step" ? Math.min(n, (ui.steps[key] || 0) + 1) : act === "steps-all" ? n : 0;
    render({ focus: ui.steps[key] >= n ? `[data-k="steps-reset-${k}"]` : `[data-k="step-${k}"]`, noScroll: true });
  }
  else if (act === "chk-opt") { const c = findCheck(id), j = +b.dataset.i; answerCheck(id, j === c.correct, { opt: j }); focusCheck(id); }
  else if (act === "chk-submit") submitInput(id);
  else if (act === "chk-show") { const u = ui.chk[id]; if (u) { u.phase = "done"; u.result = "not-yet"; u.msg = "Ось правильна відповідь і пояснення. Спробуй потім ще раз."; record({ checks: { [id]: "not-yet" } }); } focusCheck(id); }
  else if (act === "chk-again") { ui.chk[id] = { phase: "fresh", value: "", wrong: [] }; focusCheck(id); }
  else if (act === "read") { record({ read: { [id]: !progress.read[id] } }); render({ focus: `[data-k="read"]`, noScroll: true }); }
  else if (act === "copy") copyAsk(b);
});
function focusCheck(id) {
  const u = ui.chk[id], c = findCheck(id);
  let sel = `[data-k="again-${id}"]`;
  if (u && u.phase !== "done") sel = c && c.options ? `[data-check="${id}"] .opt:not([disabled])` : `[data-k="in-${id}"]`;
  render({ focus: sel, noScroll: true });
}
function submitInput(id) {
  const inp = document.getElementById("in-" + id), c = findCheck(id);
  if (!inp || !c) return;
  const v = inp.value;
  if (!v.trim()) { inp.focus(); return; }
  answerCheck(id, isAccepted(c, v), { value: v });
  focusCheck(id);
}
document.addEventListener("keydown", e => {
  if (e.key === "Enter" && e.target.classList && e.target.classList.contains("chk-in")) { e.preventDefault(); submitInput(e.target.dataset.id); }
});
document.addEventListener("input", e => {
  if (e.target.classList && e.target.classList.contains("chk-in")) { const id = e.target.dataset.id; (ui.chk[id] = ui.chk[id] || { phase: "fresh", value: "", wrong: [] }).value = e.target.value; }
});
$("parents-toggle").addEventListener("click", () => {
  ui.view = ui.view === "parents" ? "map" : "parents";
  render({ focus: "#parents-toggle", noScroll: true });
  window.scrollTo(0, 0);
});
// Стрілки ліворуч/праворуч, Home, End — між вкладками предметів.
$("tabs").addEventListener("keydown", e => {
  const ids = DATA.subjects.map(s => s.id), i = ids.indexOf(ui.subject);
  let j = null;
  if (e.key === "ArrowRight") j = (i + 1) % ids.length; else if (e.key === "ArrowLeft") j = (i - 1 + ids.length) % ids.length;
  else if (e.key === "Home") j = 0; else if (e.key === "End") j = ids.length - 1;
  if (j === null) return;
  e.preventDefault();
  ui.subject = ids[j]; ui.view = "map"; ui.lesson = null; saveUi();
  render({ focus: `#tab-${ids[j]}`, noScroll: true });
});
function copyAsk(btn) {
  const ta = $("ask-text"), note = $("copy-note"), id = ui.lesson;
  const ok = () => { ui.copied = id; btn.textContent = "Скопійовано ✓"; note.textContent = "Тепер встав у чат з репетитором."; };
  const fallback = () => {
    ta.focus(); ta.select();
    let done = false;
    try { done = document.execCommand("copy"); } catch (e) {}
    if (done) ok(); else note.textContent = "Текст виділено — натисни Ctrl+C (або «Копіювати» на телефоні).";
  };
  try { navigator.clipboard.writeText(ta.value).then(ok, fallback); } catch (e) { fallback(); }
}

/* ---------- Спільна база (коли карта — особиста опублікована сторінка учня) ---------- */
let retries = 0;
function watch(path, onData) {
  let unsub = null;
  const start = () => {
    try {
      unsub = db.doc(path).onSnapshot(snap => onData(snap.exists ? (snap.data() || {}) : null), err => {
        if (err && err.code === "unavailable" && retries < 5) { retries++; setTimeout(start, 4000 * retries); }
      });
    } catch (e) {}
  };
  start();
}
let softPending = false;
function rerenderSoft() {
  // Поки учень друкує відповідь, не перебудовуємо сторінку: оновимося, коли поле втратить фокус.
  const ae = document.activeElement;
  if (ae && ae.classList && ae.classList.contains("chk-in")) { softPending = true; return; }
  softPending = false; render();
}
document.addEventListener("focusout", e => {
  if (softPending && e.target.classList && e.target.classList.contains("chk-in")) setTimeout(() => { if (softPending) rerenderSoft(); }, 0);
});
async function connect() {
  const c = window.claude;
  if (!c || typeof c.use !== "function") return;
  let handle = null;
  try { handle = await c.use("db"); } catch (e) { handle = null; }
  if (!handle) return;
  db = handle; dbState = "live"; paintStatus();
  try {
    const snap = await db.doc("learner/progress").get();
    if (snap.exists) {
      remoteExists = true;
      const remote = normProgress(clone(snap.data()));
      // Позначки, зроблені в цьому браузері, поки бази не було, доливаємо одним записом (база перемагає в суперечках).
      const extra = {};
      ["read", "checks"].forEach(k => Object.keys(progress[k]).forEach(id => { if (!(id in remote[k])) { extra[k] = extra[k] || {}; extra[k][id] = progress[k][id]; } }));
      applyRemoteProgress(remote);
      if (Object.keys(extra).length) record(extra);
    } else if (Object.keys(progress.read).length || Object.keys(progress.checks).length) {
      record({});
    }
  } catch (e) {
    if (e && (e.code === "revoked" || e.code === "not_granted" || e.code === "capability_disabled" || e.code === "capability_removed")) { db = null; dbState = "local"; paintStatus(); return; }
  }
  render();
  watch("learner/progress", d => { if (d) { remoteExists = true; if (applyRemoteProgress(d)) rerenderSoft(); } });
  watch("learner/practice", d => {
    const next = d && isObj(d.subtopics) ? clone(d.subtopics) : {};
    if (JSON.stringify(next) !== JSON.stringify(practice)) { practice = next; rerenderSoft(); }
  });
  watch("learner/plan", d => {
    const next = { name: d && typeof d.name === "string" ? d.name.trim() : "",
      current: d && isObj(d.current) && d.current.topic ? { subject: String(d.current.subject || (TOP[d.current.topic] ? TOP[d.current.topic].subject.id : "")), topic: String(d.current.topic) } : null,
      next: d && Array.isArray(d.next) ? d.next.map(String) : [] };
    if (JSON.stringify(next) !== JSON.stringify(plan)) { plan = next; rerenderSoft(); }
  });
}

render();
connect();
</script>
