<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Моя карта навчання</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Карта навчання для 7 класу: предмет → розділ → тема → підтема → урок.
   Шрифти з Google Fonts мають кирилицю; без мережі сторінка бере системні шрифти. */
:root {
  --bg: #f6f4ee;
  --surface: #ffffff;
  --surface-2: #f1eee6;
  --ink: #1f2933;
  --ink-soft: #55606b;
  --line: #d8d3c7;
  --track: #e6e1d6;
  --accent: #19717f;
  --accent-ink: #ffffff;
  --accent-soft: #dcefF1;
  --focus: #2457d6;
  --good: #2e7a4c;
  --good-soft: #def0e4;
  --mid: #9a6400;
  --mid-soft: #f7ead2;
  --bad: #b0413b;
  --bad-soft: #f6dfdd;
  --now: #b4530e;
  --now-soft: #fbe7d6;
  --next: #6247c8;
  --next-soft: #e9e4fb;
  --planned: #8b9097;
  --s1: #19717f; --s2: #6247c8; --s3: #b4530e; --s4: #2e7a4c;
  --shadow: 0 1px 2px rgba(31, 41, 51, .06), 0 4px 14px rgba(31, 41, 51, .06);
  --font-body: "Nunito", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14171d; --surface: #1c2028; --surface-2: #232833; --ink: #e9ebef; --ink-soft: #a9b0bc;
    --line: #363d4a; --track: #2c323e; --accent: #4fc0cf; --accent-ink: #0d2226; --accent-soft: #1d3a40;
    --focus: #8aaeff; --good: #6cc792; --good-soft: #1e3628; --mid: #e6b45c; --mid-soft: #3a2f1a;
    --bad: #f08a83; --bad-soft: #3d2423; --now: #f0a064; --now-soft: #3e2a1b; --next: #b3a2ff; --next-soft: #2c2645;
    --planned: #7d838d; --s1: #4fc0cf; --s2: #b3a2ff; --s3: #f0a064; --s4: #6cc792;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 4px 14px rgba(0, 0, 0, .25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #14171d; --surface: #1c2028; --surface-2: #232833; --ink: #e9ebef; --ink-soft: #a9b0bc;
  --line: #363d4a; --track: #2c323e; --accent: #4fc0cf; --accent-ink: #0d2226; --accent-soft: #1d3a40;
  --focus: #8aaeff; --good: #6cc792; --good-soft: #1e3628; --mid: #e6b45c; --mid-soft: #3a2f1a;
  --bad: #f08a83; --bad-soft: #3d2423; --now: #f0a064; --now-soft: #3e2a1b; --next: #b3a2ff; --next-soft: #2c2645;
  --planned: #7d838d; --s1: #4fc0cf; --s2: #b3a2ff; --s3: #f0a064; --s4: #6cc792;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 4px 14px rgba(0, 0, 0, .25);
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.6 var(--font-body); overflow-x: hidden; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 6px; }
sub, sup { line-height: 0; }
h1, h2, h3, p { margin: 0; }
.code { font: 600 .8em/1 var(--font-mono); color: var(--ink-soft); white-space: nowrap; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- Шапка ---------- */
header.top { background: var(--surface); border-bottom: 1px solid var(--line); }
.top-inner { max-width: 880px; margin: 0 auto; padding: 14px 16px 0; display: grid; gap: 10px; }
.top-row { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; }
.brand { font-size: 1.3rem; font-weight: 800; letter-spacing: -.01em; line-height: 1.2; }
.brand small { display: block; font-size: .92rem; font-weight: 600; color: var(--ink-soft); letter-spacing: 0; }
.toggle { min-height: 44px; border: 2px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 16px; font-weight: 700; }
.toggle:hover { border-color: var(--ink-soft); }
.toggle[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.tabs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: thin; margin: 0 -4px; padding: 0 4px; }
.tab { flex: none; min-height: 48px; border: 0; background: none; padding: 8px 14px; border-bottom: 4px solid transparent; font-weight: 700; color: var(--ink-soft); display: flex; align-items: center; gap: 8px; border-radius: 8px 8px 0 0; }
.tab:hover { color: var(--ink); background: var(--surface-2); }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--tab-c, var(--accent)); }
.tab .ic { font-size: 1.2rem; line-height: 1; }
.tabs-spacer { height: 0; }

/* ---------- Основна частина ---------- */
main { max-width: 880px; margin: 0 auto; padding: 20px 16px 40px; display: grid; gap: 18px; min-width: 0; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px; box-shadow: var(--shadow); min-width: 0; }
.card h3 { font-size: 1.05rem; font-weight: 800; margin-bottom: 8px; }
.card p + p { margin-top: 8px; }
.note { font-size: .9rem; color: var(--ink-soft); }
.btn { min-height: 44px; border: 2px solid var(--accent); background: var(--accent); color: var(--accent-ink); border-radius: 12px; padding: 8px 16px; font-weight: 800; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-align: center; }
.btn:hover { filter: brightness(1.07); }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); font-weight: 700; }
.btn.ghost:hover { border-color: var(--ink-soft); filter: none; }
.btn[aria-pressed="true"].mark { background: var(--good); border-color: var(--good); color: #fff; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

/* Вступ до предмета */
.intro { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 16px; align-items: center; }
.intro h2 { font-size: 1.35rem; font-weight: 800; line-height: 1.25; }
.intro .sub-line { color: var(--ink-soft); font-size: .95rem; }
.hints { display: grid; gap: 10px; }
.hint { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 12px 14px; border-radius: 12px; border: 1px solid transparent; }
.hint.now { background: var(--now-soft); border-color: color-mix(in srgb, var(--now) 35%, transparent); }
.hint.next { background: var(--next-soft); border-color: color-mix(in srgb, var(--next) 35%, transparent); }
.hint .lbl { font-weight: 800; }
.hint.now .lbl { color: var(--now); }
.hint.next .lbl { color: var(--next); }
.chip { min-height: 40px; display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 4px 14px; font-weight: 700; font-size: .92rem; border: 2px solid currentColor; background: var(--surface); }
.chip.next { color: var(--next); }
.chip.now { color: var(--now); }
.chip:hover { background: var(--surface-2); }
.badge { display: inline-flex; align-items: center; border-radius: 999px; padding: 1px 10px; font-size: .78rem; font-weight: 800; line-height: 1.6; white-space: nowrap; }
.badge.now { background: var(--now); color: #fff; }
.badge.next { background: var(--next); color: #fff; }

/* Умовні позначення */
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: .85rem; color: var(--ink-soft); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }

/* Кільце прогресу */
.ring { flex: none; display: block; }
.ring .trk { fill: none; stroke: var(--track); }
.ring .val { fill: none; stroke: var(--ring-c, var(--accent)); stroke-linecap: round; }
.ring text { font: 800 12px var(--font-body); fill: var(--ink); text-anchor: middle; dominant-baseline: central; }
.ring.big text { font-size: 15px; }

/* Дерево */
.tree, .topics, .subs { list-style: none; margin: 0; padding: 0; }
.tree { display: grid; gap: 14px; }
.sec { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); overflow: hidden; min-width: 0; }
.sec > h2, .topic > h3 { margin: 0; font-size: inherit; }
.sec-head { width: 100%; min-height: 72px; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 14px; align-items: center; text-align: left; background: none; border: 0; padding: 14px 16px; }
.sec-head:hover { background: var(--surface-2); }
.sec-head .nm { display: block; font-size: 1.1rem; font-weight: 800; line-height: 1.3; overflow-wrap: anywhere; }
.sec-head .meta { display: block; font-size: .85rem; color: var(--ink-soft); }
.chev { width: 28px; height: 28px; display: grid; place-items: center; border-radius: 50%; background: var(--surface-2); transition: transform .15s; font-size: .8rem; color: var(--ink-soft); }
[aria-expanded="true"] > .chev { transform: rotate(90deg); }
.sec-body { padding: 0 16px 16px; display: grid; gap: 10px; }
.sec-body > .what { color: var(--ink-soft); font-size: .95rem; }
.topics { display: grid; gap: 8px; }
.topic { border: 1px solid var(--line); border-radius: 12px; background: var(--bg); min-width: 0; }
.topic.now { border: 2px solid var(--now); background: var(--now-soft); }
.topic-head { width: 100%; min-height: 56px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 12px; align-items: center; text-align: left; background: none; border: 0; padding: 10px 12px; border-radius: 12px; }
.topic-head:hover { background: color-mix(in srgb, var(--surface-2) 70%, transparent); }
.topic-head .t1 { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 8px; min-width: 0; }
.topic-head .nm { font-weight: 800; overflow-wrap: anywhere; }
.topic-head .t2 { grid-column: 1 / -1; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; font-size: .82rem; color: var(--ink-soft); }
.topic-head .chev { grid-row: 1; grid-column: 2; }
.bar { height: 10px; border-radius: 5px; background: var(--track); overflow: hidden; display: block; min-width: 60px; }
.bar i { display: block; height: 100%; background: var(--bar-c, var(--accent)); border-radius: 5px; }
.topic-body { padding: 0 12px 12px; display: grid; gap: 8px; }
.topic-body > .what { font-size: .92rem; color: var(--ink-soft); }
.subs { display: grid; gap: 6px; }
.sub { width: 100%; min-height: 48px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; align-items: center; text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 12px; }
button.sub:hover { border-color: var(--ink-soft); }
.sub .nm { font-weight: 700; overflow-wrap: anywhere; }
.sub .tags { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; align-items: center; }
.sub.planned { background: transparent; border-style: dashed; color: var(--planned); }
.sub.planned .nm { font-weight: 600; }
.sub.is-next { border: 2px solid var(--next); }
.pill { display: inline-flex; align-items: center; gap: 4px; border-radius: 999px; padding: 1px 10px; font-size: .78rem; font-weight: 800; line-height: 1.6; white-space: nowrap; background: var(--surface-2); color: var(--ink-soft); }
.pill.st-read { background: var(--accent-soft); color: var(--accent); }
.pill.st-checked { background: var(--mid-soft); color: var(--mid); }
.pill.st-mastered { background: var(--good-soft); color: var(--good); }
.pill.st-planned { background: transparent; border: 1px dashed var(--planned); color: var(--planned); }
.pill.prac { background: transparent; border: 1px solid var(--line); color: var(--ink-soft); font-family: var(--font-mono); font-weight: 600; }
.empty { text-align: center; padding: 36px 20px; display: grid; gap: 10px; justify-items: center; }
.empty .big { font-size: 2.6rem; line-height: 1; }
.empty h2 { font-size: 1.3rem; font-weight: 800; }
.empty p { max-width: 46ch; color: var(--ink-soft); }

/* ---------- Урок ---------- */
.lesson { display: grid; gap: 16px; min-width: 0; }
.crumbs { font-size: .88rem; color: var(--ink-soft); overflow-wrap: anywhere; }
.lesson-title { font-size: 1.5rem; font-weight: 800; line-height: 1.25; overflow-wrap: anywhere; }
.lesson-title:focus { outline: none; }
.lesson-title:focus-visible { outline: 3px solid var(--focus); }
.lesson .card ul, .lesson .card ol { margin: 0; padding-left: 22px; display: grid; gap: 6px; }
.rules { display: grid; gap: 10px; }
.rule { border: 1px solid var(--line); border-left: 5px solid var(--accent); border-radius: 10px; padding: 10px 12px; background: var(--bg); display: grid; gap: 4px; min-width: 0; }
.rule .f { font: 600 1.05rem/1.5 var(--font-mono); overflow-wrap: anywhere; }
.rule .m { font-size: .95rem; color: var(--ink-soft); }
.task { padding: 12px 14px; border-radius: 10px; background: var(--surface-2); font-weight: 600; }
ol.steps { list-style: none; padding: 0 !important; counter-reset: st; margin-top: 12px !important; }
ol.steps li { counter-increment: st; display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 4px 10px; align-items: start; }
ol.steps li::before { content: counter(st); width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--accent); color: var(--accent-ink); font-weight: 800; font-size: .9rem; grid-row: span 2; }
ol.steps .do { font-weight: 700; }
ol.steps .why { font-size: .93rem; color: var(--ink-soft); }
ol.steps .why b { color: var(--ink); }
.answer { margin-top: 12px; padding: 10px 14px; border-radius: 10px; background: var(--good-soft); color: var(--ink); }
.answer b { color: var(--good); }
.mistakes li::marker { content: "⚠︎  "; color: var(--mid); }
.checks { display: grid; gap: 10px; }
.check { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: grid; gap: 10px; background: var(--bg); }
.check .q { font-weight: 700; }
.examples { display: grid; gap: 14px; }
.example { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; background: var(--bg); min-width: 0; }
.ex-n { font-size: .9rem; font-weight: 800; color: var(--accent); margin-bottom: 6px; }
.example .task { background: var(--surface); }
.opts { display: grid; gap: 8px; }
.opt { min-height: 44px; text-align: left; border: 2px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 12px; font-weight: 600; overflow-wrap: anywhere; }
.opt:hover:not([disabled]) { border-color: var(--ink-soft); }
.opt[disabled] { cursor: default; }
.opt.right { border-color: var(--good); background: var(--good-soft); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.ans-row input { flex: 1 1 10em; min-width: 0; min-height: 44px; border: 2px solid var(--line); border-radius: 10px; padding: 8px 12px; background: var(--surface); color: var(--ink); font-size: 1rem; }
.ans-row input:focus-visible { border-color: var(--focus); }
.check .a { padding: 8px 12px; border-radius: 8px; background: var(--surface); border: 1px dashed var(--line); }
.check .res { font-size: .9rem; font-weight: 700; }
.check .res.know { color: var(--good); }
.check .res.not-yet { color: var(--mid); }
.btn.know[aria-pressed="true"] { background: var(--good); border-color: var(--good); color: #fff; }
.btn.not-yet[aria-pressed="true"] { background: var(--mid); border-color: var(--mid); color: #fff; }
.ask { display: grid; gap: 10px; }
.ask textarea { width: 100%; min-height: 64px; resize: none; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: var(--bg); color: var(--ink); font-size: .95rem; line-height: 1.45; }
.pager { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.pager .btn { justify-content: flex-start; text-align: left; min-width: 0; }
.pager .btn.nx { justify-content: flex-end; text-align: right; grid-column: 2; }
.pager .btn span { overflow-wrap: anywhere; }
.ref { font-size: .85rem; color: var(--ink-soft); border-left: 3px solid var(--line); padding-left: 10px; }

/* ---------- Для батьків ---------- */
.par-head h2 { font-size: 1.35rem; font-weight: 800; }
.subj-cards { display: grid; gap: 14px; }
.meter { display: grid; gap: 4px; }
.meter .lbl { display: flex; justify-content: space-between; gap: 10px; font-size: .92rem; }
.meter .lbl b { font-variant-numeric: tabular-nums; white-space: nowrap; }
.meter .bar { height: 14px; border-radius: 7px; }
.meters { display: grid; gap: 10px; margin-top: 10px; }
table.acc { width: 100%; border-collapse: collapse; font-size: .92rem; }
table.acc th, table.acc td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--track); vertical-align: middle; }
table.acc th { font-size: .8rem; color: var(--ink-soft); font-weight: 700; }
table.acc td.num { white-space: nowrap; font-variant-numeric: tabular-nums; }
table.acc .bar { width: 100%; min-width: 50px; }
.weak { margin: 0; padding-left: 22px; display: grid; gap: 4px; }
.tips { margin: 0; padding-left: 22px; display: grid; gap: 8px; }

footer.foot { max-width: 880px; margin: 0 auto; padding: 0 16px 32px; font-size: .82rem; color: var(--ink-soft); display: flex; flex-wrap: wrap; gap: 4px 16px; justify-content: space-between; }

@media (max-width: 560px) {
  body { font-size: 16px; }
  .card { padding: 14px; border-radius: 14px; }
  .sec-head { padding: 12px; gap: 10px; }
  .sec-body { padding: 0 10px 12px; }
  .intro { grid-template-columns: minmax(0, 1fr); }
  .intro .ring { display: none; }
  .sub { grid-template-columns: minmax(0, 1fr); }
  .sub .tags { justify-content: flex-start; }
  .pager { grid-template-columns: minmax(0, 1fr); }
  .pager .btn.nx { grid-column: 1; }
  .lesson-title { font-size: 1.3rem; }
  table.acc .barcol { display: none; }
}
@media (prefers-reduced-motion: reduce) { .chev { transition: none; } }
</style>
</head>
<body>
<header class="top">
  <div class="top-inner">
    <div class="top-row">
      <h1 class="brand" id="brand">Моя карта навчання<small id="who"></small></h1>
      <button class="toggle" id="parents-toggle" type="button" aria-pressed="false">Для батьків</button>
    </div>
    <div class="tabs" id="tabs" role="tablist" aria-label="Предмети"></div>
    <div class="tabs-spacer"></div>
  </div>
</header>
<main id="main" tabindex="-1" aria-live="off"></main>
<footer class="foot"><span id="store-status"></span><span id="ver"></span></footer>

<script>
/* ---------- Зміст: вставляє study-map/build-map.py з study-map/content/ ---------- */
const CONTENT = {"subjects":[{"id":"algebra","name":"Алгебра","grade":7,"tutor":"Оля","tutorCall":"Олю","icon":"➗","sections":[{"id":"A1","subject":"algebra","name":"Лінійні рівняння з однією змінною","what":"Рівняння — це рівність з невідомим. Учимося знаходити невідоме і розв'язувати задачі за допомогою рівнянь.","topics":[{"id":"A1.1","name":"Рівняння та його корені","what":"Що таке рівняння, корінь і які перетворення не змінюють коренів.","subtopics":[{"id":"A1.1.1","name":"Рівняння і корінь рівняння","status":"ready","programmeRef":"Загальні відомості про рівняння.","lesson":{"what":"<b>Рівняння<\/b> — це рівність, у якій є невідоме число, позначене буквою. Цю букву називають <b>змінною<\/b>. <b>Корінь рівняння<\/b> — таке значення змінної, при якому рівняння перетворюється на правильну числову рівність.","ideas":["Ліва частина рівняння — усе, що стоїть зліва від знака «=», права частина — усе, що справа.","Щоб перевірити, чи є число коренем, підстав його замість змінної й порахуй <b>обидві<\/b> частини. Однаково — корінь, різне — не корінь.","<b>Розв'язати рівняння<\/b> — означає знайти всі його корені або показати, що коренів немає.","Рівняння може мати один корінь, кілька, безліч або жодного."],"rules":[{"f":"x + 7 = 12; x = 5, бо 5 + 7 = 12","means":"Корінь — це число, яке робить рівність правильною. Тут корінь — 5."}],"examples":[{"task":"Чи є число 5 коренем рівняння x + 7 = 12?","steps":[{"do":"Ліва частина при x = 5: 5 + 7 = 12","why":"Підставляємо 5 замість x."},{"do":"Права частина: 12","why":"Тут змінної немає — просто число."},{"do":"12 = 12 — рівність правильна","why":"Обидві частини рівні."}],"answer":"Відповідь: так, 5 — корінь рівняння."},{"task":"Чи є число 3 коренем рівняння 4x − 5 = 2x + 1? А число 2?","steps":[{"do":"При x = 3 ліва частина: 4 · 3 − 5 = 12 − 5 = 7","why":"Підставляємо 3 замість x у ліву частину."},{"do":"Права частина: 2 · 3 + 1 = 6 + 1 = 7","why":"Підставляємо те саме число в праву частину."},{"do":"7 = 7 — рівність правильна","why":"Обидві частини рівні, отже 3 — корінь."},{"do":"При x = 2: 4 · 2 − 5 = 3, а 2 · 2 + 1 = 5; 3 ≠ 5","why":"Частини різні, отже 2 — не корінь."}],"answer":"Відповідь: 3 — корінь рівняння, 2 — не корінь."},{"task":"Які з чисел −3, 0, 3 є коренями рівняння x · x = 9?","steps":[{"do":"x = −3: (−3) · (−3) = 9; 9 = 9","why":"Мінус на мінус дає плюс — рівність правильна."},{"do":"x = 0: 0 · 0 = 0; 0 ≠ 9","why":"Рівність неправильна — 0 не корінь."},{"do":"x = 3: 3 · 3 = 9; 9 = 9","why":"Рівність правильна."}],"answer":"Відповідь: корені −3 і 3 (рівняння має два корені); 0 — не корінь."}],"mistakes":["Рахують лише ліву частину. Правильно: порахуй <b>обидві<\/b> частини й порівняй їх.","При x = 4 записують 3x як 34. Правильно: 3x — це 3 · x, тобто 3 · 4 = 12.","Плутають рівняння і корінь. Рівняння — це запис x + 7 = 12, а корінь — число 5."],"check":[{"q":"Чи є число −2 коренем рівняння 3x + 10 = 4?","options":["Так","Ні"],"correct":0,"a":"Так: 3 · (−2) + 10 = −6 + 10 = 4, а права частина теж 4."},{"q":"Пастка: скільки коренів має рівняння x + 1 = x?","options":["Один","Жодного","Безліч"],"correct":1,"a":"Жодного. Яке число не підстав, ліва частина на 1 більша за праву."},{"q":"Марійка мала x гривень, купила зошит за 25 грн, і в неї залишилося 40 грн. Скільки гривень мала Марійка?","accept":["65"],"a":"x − 25 = 40, x = 40 + 25 = 65. Перевірка: 65 − 25 = 40."}]}},{"id":"A1.1.2","name":"Рівносильні рівняння і властивості рівнянь","status":"ready","programmeRef":"Рівносильні рівняння.","lesson":{"what":"<b>Рівносильні рівняння<\/b> — це рівняння, які мають ті самі корені (або обидва не мають коренів). Розв'язуючи рівняння, ми крок за кроком замінюємо його простішим рівносильним, поки не побачимо корінь.","ideas":["Рівняння 2x = 10 і x + 1 = 6 рівносильні: кожне має єдиний корінь 5.","<b>Властивість 1.<\/b> Будь-який доданок можна перенести з однієї частини рівняння в іншу, змінивши його знак на протилежний.","<b>Властивість 2.<\/b> Обидві частини рівняння можна помножити або поділити на одне й те саме число, яке <b>не дорівнює нулю<\/b>.","Розкриття дужок і зведення подібних доданків теж не змінюють коренів рівняння."],"rules":[{"f":"x + b = c → x = c − b","means":"Перенесли доданок b праворуч — його знак змінився з «+» на «−»."},{"f":"ax = c → x = c : a (a ≠ 0)","means":"Поділили обидві частини на те саме число a, яке не дорівнює нулю."}],"examples":[{"task":"Розв'яжи рівняння x + 9 = 4.","steps":[{"do":"x = 4 − 9","why":"Перенесли 9 праворуч, змінивши знак (властивість 1)."},{"do":"x = −5","why":"Обчислили: 4 − 9 = −5."},{"do":"Перевірка: −5 + 9 = 4","why":"Рівність правильна."}],"answer":"Відповідь: x = −5."},{"task":"Розв'яжи рівняння 5x − 8 = 3x + 6, записуючи на кожному кроці рівносильне рівняння.","steps":[{"do":"5x − 3x = 6 + 8","why":"Перенесли 3x ліворуч, а −8 праворуч, змінивши знаки (властивість 1)."},{"do":"2x = 14","why":"Звели подібні доданки: 5x − 3x = 2x; 6 + 8 = 14."},{"do":"x = 14 : 2, x = 7","why":"Поділили обидві частини на 2, а 2 ≠ 0 (властивість 2)."},{"do":"Перевірка: 5 · 7 − 8 = 27 і 3 · 7 + 6 = 27","why":"Обидві частини рівні — корінь знайдено правильно."}],"answer":"Відповідь: x = 7."},{"task":"Розв'яжи рівняння x/4 − 1 = 2.","steps":[{"do":"x/4 = 2 + 1","why":"Перенесли −1 праворуч, змінивши знак."},{"do":"x/4 = 3","why":"Обчислили праву частину."},{"do":"x = 3 · 4, x = 12","why":"Помножили обидві частини на 4, а 4 ≠ 0 (властивість 2)."},{"do":"Перевірка: 12/4 − 1 = 3 − 1 = 2","why":"Рівність правильна."}],"answer":"Відповідь: x = 12."}],"mistakes":["Переносять доданок, не змінюючи знака: з x + 4 = 10 пишуть x = 10 + 4. Правильно: x = 10 − 4, x = 6.","Ділять не всю частину: з 3x = 12 + 6 пишуть x = 4 + 6. Правильно: спершу 3x = 18, потім x = 18 : 3 = 6.","«Скорочують» на x: з 5x = 3x роблять 5 = 3 і кажуть, що коренів немає. Ділити можна лише на число, відмінне від нуля. Правильно: 5x − 3x = 0, 2x = 0, x = 0."],"check":[{"q":"Чи рівносильні рівняння x − 3 = 4 і 2x = 8?","options":["Так","Ні"],"correct":1,"a":"Ні: корінь першого — 7 (7 − 3 = 4), а другого — 4 (2 · 4 = 8). Корені різні."},{"q":"Пастка: чи рівносильні рівняння 0 · x = 5 і x + 2 = x?","options":["Так, бо обидва не мають коренів","Ні, бо вони різні на вигляд"],"correct":0,"a":"Так. Жодне з них не має коренів, а такі рівняння вважають рівносильними."},{"q":"У Тараса в кишені x гривень, а в скарбничці — утричі більше, разом 120 грн. Розв'яжи рівняння x + 3x = 120. Скільки гривень у Тараса в кишені?","accept":["30"],"a":"x + 3x = 120 рівносильне 4x = 120, звідси x = 30. Перевірка: 30 + 90 = 120."}]}}]},{"id":"A1.2","name":"Лінійні рівняння","what":"Рівняння виду ax = b і ті, що до нього зводяться.","subtopics":[{"id":"A1.2.1","name":"Лінійне рівняння ax = b","status":"ready","programmeRef":"Лінійні рівняння з однією змінною.","lesson":{"what":"<b>Лінійне рівняння з однією змінною<\/b> — це рівняння виду ax = b, де x — змінна, а a і b — числа. Число a, яке стоїть перед змінною, називають <b>коефіцієнтом<\/b>.","ideas":["Приклади лінійних рівнянь: 3x = 12 (a = 3, b = 12), −x = 7 (a = −1, b = 7), 0,5x = 2 (a = 0,5, b = 2).","Рівняння x<sup>2<\/sup> = 9 — не лінійне: у ньому змінна в квадраті.","Якщо коефіцієнт a ≠ 0, рівняння має один корінь: x = b : a.","Якщо коефіцієнт від'ємний, ділимо на від'ємне число — уважно зі знаком відповіді.","Якщо a = 0, рівняння має вигляд 0 · x = b — цей випадок розглядаємо окремо."],"rules":[{"f":"ax = b, a ≠ 0 → x = b : a","means":"Щоб знайти корінь, поділи число b на коефіцієнт a."}],"examples":[{"task":"Розв'яжи рівняння 7x = 35.","steps":[{"do":"a = 7, b = 35; a ≠ 0","why":"Це лінійне рівняння з одним коренем."},{"do":"x = 35 : 7","why":"Ділимо обидві частини на коефіцієнт 7."},{"do":"x = 5","why":"Обчислили частку."},{"do":"Перевірка: 7 · 5 = 35","why":"Рівність правильна."}],"answer":"Відповідь: x = 5."},{"task":"Розв'яжи рівняння −4x = 18.","steps":[{"do":"a = −4, b = 18; a ≠ 0","why":"Це лінійне рівняння, коефіцієнт не нуль — корінь один."},{"do":"x = 18 : (−4)","why":"Ділимо обидві частини на коефіцієнт −4."},{"do":"x = −4,5","why":"Додатне число поділити на від'ємне — результат від'ємний; 18 : 4 = 4,5."},{"do":"Перевірка: −4 · (−4,5) = 18","why":"Мінус на мінус дає плюс; 4 · 4,5 = 18. Рівність правильна."}],"answer":"Відповідь: x = −4,5."},{"task":"Розв'яжи рівняння 0,4x = 2.","steps":[{"do":"x = 2 : 0,4","why":"Ділимо обидві частини на коефіцієнт 0,4."},{"do":"x = 20 : 4","why":"Помножили ділене й дільник на 10, щоб позбутися коми."},{"do":"x = 5","why":"Обчислили частку."},{"do":"Перевірка: 0,4 · 5 = 2","why":"Рівність правильна."}],"answer":"Відповідь: x = 5."}],"mistakes":["Ділять «навпаки»: з 6x = 3 пишуть x = 6 : 3 = 2. Правильно: ділимо на коефіцієнт, x = 3 : 6 = 0,5.","Гублять мінус: з −x = 7 пишуть x = 7. Правильно: коефіцієнт тут −1, тож x = 7 : (−1) = −7.","Віднімають замість ділення: з 5x = 20 пишуть x = 20 − 5 = 15. Правильно: 5x — це 5 · x, тож x = 20 : 5 = 4."],"check":[{"q":"Яке з рівнянь — лінійне рівняння з однією змінною?","options":["x · x = 4","0,2x = −1","5 : x = 1"],"correct":1,"a":"0,2x = −1 має вигляд ax = b (a = 0,2, b = −1). У x · x = 4 змінна множиться сама на себе, а в 5 : x = 1 вона в дільнику."},{"q":"Дорога до школи — 3 км, велосипедист їде зі швидкістю 12 км/год. Розв'яжи рівняння 12t = 3, де t — час у годинах. Скільки хвилин триває дорога?","accept":["15"],"a":"t = 3 : 12 = 0,25 год. 0,25 · 60 = 15 хв. Перевірка: 12 · 0,25 = 3."},{"q":"Пастка: скільки коренів має рівняння 0 · x = 6?","options":["Жодного","Один: x = 6","Безліч"],"correct":0,"a":"Жодного: 0 · x завжди дорівнює 0, а не 6. Навіть x = 6 дає 0 · 6 = 0."}]}},{"id":"A1.2.2","name":"Рівняння, що зводяться до лінійних","status":"ready","programmeRef":"Розв'язування лінійних рівнянь.","lesson":{"what":"Деякі рівняння спершу мають дужки, дроби або змінну в обох частинах. Дозволеними перетвореннями їх можна звести до лінійного рівняння ax = b, а далі знайти x.","ideas":["Порядок дій: розкрий дужки → перенеси доданки зі змінною ліворуч, а числа праворуч → зведи подібні доданки → поділи на коефіцієнт.","Мінус перед дужками змінює знаки <b>всіх<\/b> доданків у дужках.","Переносячи доданок в іншу частину рівняння, змінюй його знак.","Якщо в рівнянні є дроби, помнож обидві частини на спільний знаменник — дробів не стане.","Наприкінці підстав корінь у <b>початкове<\/b> рівняння."],"rules":[{"f":"a(b + c) = ab + ac","means":"Розкриваємо дужки: число перед дужками множимо на кожен доданок."},{"f":"−(b − c) = −b + c","means":"Мінус перед дужками змінює знак кожного доданка в дужках."}],"examples":[{"task":"Розв'яжи рівняння 3x + 4 = x + 10.","steps":[{"do":"3x − x = 10 − 4","why":"Перенесли x ліворуч, а 4 праворуч, змінивши знаки."},{"do":"2x = 6","why":"Звели подібні доданки."},{"do":"x = 3","why":"Поділили обидві частини на 2."},{"do":"Перевірка: 3 · 3 + 4 = 13 і 3 + 10 = 13","why":"Обидві частини рівні."}],"answer":"Відповідь: x = 3."},{"task":"Розв'яжи рівняння 4(x − 3) − (x + 5) = x + 1.","steps":[{"do":"4x − 12 − x − 5 = x + 1","why":"Розкрили дужки; мінус перед другими дужками змінив знаки: −x − 5."},{"do":"3x − 17 = x + 1","why":"Звели подібні: 4x − x = 3x; −12 − 5 = −17."},{"do":"3x − x = 1 + 17","why":"Перенесли x ліворуч, а −17 праворуч, змінивши знаки."},{"do":"2x = 18, x = 9","why":"Звели подібні й поділили обидві частини на 2."},{"do":"Перевірка: 4 · (9 − 3) − (9 + 5) = 24 − 14 = 10 і 9 + 1 = 10","why":"Обидві частини рівні — корінь правильний."}],"answer":"Відповідь: x = 9."},{"task":"Розв'яжи рівняння (x + 1)/3 = (x − 1)/2.","steps":[{"do":"2(x + 1) = 3(x − 1)","why":"Помножили обидві частини на 6 — спільний знаменник."},{"do":"2x + 2 = 3x − 3","why":"Розкрили дужки."},{"do":"2x − 3x = −3 − 2","why":"Перенесли 3x ліворуч, а 2 праворуч, змінивши знаки."},{"do":"−x = −5, x = 5","why":"Звели подібні й поділили обидві частини на −1."},{"do":"Перевірка: (5 + 1)/3 = 2 і (5 − 1)/2 = 2","why":"Обидві частини рівні."}],"answer":"Відповідь: x = 5."}],"mistakes":["Розкриваючи −(x + 5), пишуть −x + 5. Правильно: −x − 5, бо мінус змінює знак кожного доданка.","Множать лише перший доданок: 4(x − 3) = 4x − 3. Правильно: 4x − 12.","Множачи рівняння x/2 + 3 = 5 на 2, пишуть x + 3 = 10. Правильно: множимо <b>кожен<\/b> доданок: x + 6 = 10, x = 4."],"check":[{"q":"Пастка зі знаками: розв'яжи рівняння 7 − 2(x + 1) = 3x. Знайди x.","accept":["1"],"a":"7 − 2x − 2 = 3x, 5 = 5x, x = 1. Перевірка: 7 − 2 · 2 = 3 і 3 · 1 = 3."},{"q":"Розв'яжи рівняння x/3 + x/2 = 10. Знайди x.","accept":["12"],"a":"Помножили на 6: 2x + 3x = 60, 5x = 60, x = 12. Перевірка: 4 + 6 = 10."},{"q":"Тренер купив 4 однакові м'ячі по x грн і отримав знижку 150 грн на всю покупку. Він заплатив стільки ж, скільки коштують 3 м'ячі без знижки: 4x − 150 = 3x. Скільки гривень коштує один м'яч?","accept":["150"],"a":"4x − 3x = 150, x = 150. Перевірка: 4 · 150 − 150 = 450 і 3 · 150 = 450."}]}},{"id":"A1.2.3","name":"Один корінь, безліч коренів чи жодного","status":"ready","programmeRef":"Розв'язування лінійних рівнянь.","lesson":{"what":"Лінійне рівняння ax = b може мати один корінь, безліч коренів або не мати жодного. Усе залежить від коефіцієнта a і числа b.","ideas":["a ≠ 0 — <b>один корінь<\/b> x = b : a. Наприклад, 2x = 8, x = 4.","a = 0 і b = 0 — рівняння 0 · x = 0 правильне при будь-якому x: <b>безліч коренів<\/b> (коренем є будь-яке число).","a = 0 і b ≠ 0 — рівняння, наприклад 0 · x = 5, <b>не має коренів<\/b>, бо 0 · x завжди дорівнює 0.","Якщо після спрощення змінна «зникла», подивись на числа: 0 = 0 — безліч коренів; 0 = 7 — коренів немає."],"rules":[{"f":"a ≠ 0 → один корінь x = b : a","means":"Ділимо b на коефіцієнт."},{"f":"a = 0, b = 0 → безліч коренів","means":"Підходить будь-яке число."},{"f":"a = 0, b ≠ 0 → коренів немає","means":"Жодне число не підходить."}],"examples":[{"task":"Розв'яжи рівняння 4x − 3 = x + 9.","steps":[{"do":"4x − x = 9 + 3","why":"Перенесли x ліворуч, а −3 праворуч, змінивши знаки."},{"do":"3x = 12","why":"Звели подібні: a = 3 ≠ 0 — корінь один."},{"do":"x = 4","why":"Поділили обидві частини на 3."},{"do":"Перевірка: 4 · 4 − 3 = 13 і 4 + 9 = 13","why":"Обидві частини рівні."}],"answer":"Відповідь: x = 4 (один корінь)."},{"task":"Розв'яжи рівняння 2(x + 3) − 5 = 2x + 1.","steps":[{"do":"2x + 6 − 5 = 2x + 1","why":"Розкрили дужки."},{"do":"2x + 1 = 2x + 1","why":"Звели числа: 6 − 5 = 1."},{"do":"2x − 2x = 1 − 1","why":"Перенесли доданки зі змінною ліворуч, числа праворуч, змінивши знаки."},{"do":"0 · x = 0","why":"a = 0 і b = 0: рівність правильна при будь-якому x."}],"answer":"Відповідь: рівняння має безліч коренів (коренем є будь-яке число)."},{"task":"Розв'яжи рівняння 5(x − 2) + 3 = 5x − 4.","steps":[{"do":"5x − 10 + 3 = 5x − 4","why":"Розкрили дужки."},{"do":"5x − 7 = 5x − 4","why":"Звели числа: −10 + 3 = −7."},{"do":"5x − 5x = −4 + 7","why":"Перенесли доданки зі змінною ліворуч, числа праворуч, змінивши знаки."},{"do":"0 · x = 3","why":"a = 0, b = 3 ≠ 0: жодне число не підходить."}],"answer":"Відповідь: рівняння не має коренів."}],"mistakes":["З 0 · x = 0 пишуть «x = 0». Правильно: коренем є <b>будь-яке<\/b> число, а не лише 0.","З 0 · x = 5 пишуть x = 5 : 0. На нуль ділити не можна — рівняння не має коренів.","Плутають 0 · x = 6 (коренів немає) і 6x = 0 (один корінь x = 0)."],"check":[{"q":"Пастка: скільки коренів має рівняння 3x − 4 = 3(x − 1)?","options":["Один","Жодного","Безліч"],"correct":1,"a":"Жодного: 3x − 4 = 3x − 3, звідси 0 · x = 1."},{"q":"Знайди корінь рівняння 5x = 0.","accept":["0"],"a":"x = 0 : 5 = 0. Корінь один. Перевірка: 5 · 0 = 0."},{"q":"У старшого брата 200 грн, у молодшого — 120 грн. Кожен щотижня відкладає ще по 50 грн. Через скільки тижнів у них буде порівну?","options":["Через 2 тижні","Через 80 тижнів","Ніколи — рівняння не має коренів"],"correct":2,"a":"200 + 50x = 120 + 50x, звідси 0 · x = −80 — коренів немає. Різниця завжди 80 грн."}]}}]},{"id":"A1.3","name":"Задачі за допомогою рівнянь","what":"Як перетворити текстову задачу на рівняння.","subtopics":[{"id":"A1.3.1","name":"Етапи розв'язування задачі за допомогою рівняння","status":"ready","programmeRef":"Розв'язування задач за допомогою лінійних рівнянь.","lesson":{"what":"Текстову задачу можна розв'язати за допомогою рівняння. Невідоме позначаємо буквою, записуємо умову рівнянням, розв'язуємо його й пояснюємо, що означає знайдене число.","ideas":["<b>Етап 1.<\/b> Позначаємо невідому величину буквою (наприклад, x) і через неї виражаємо інші величини.","<b>Етап 2.<\/b> Складаємо рівняння за умовою задачі.","<b>Етап 3.<\/b> Розв'язуємо рівняння.","<b>Етап 4.<\/b> Перевіряємо, чи відповідає знайдене умові й чи воно розумне (кількість учнів не буває 2,5), і записуємо відповідь словами з одиницями."],"rules":[],"examples":[{"task":"Задумали число. Якщо до нього додати 17, вийде 45. Яке число задумали?","steps":[{"do":"Нехай задумане число — x","why":"Етап 1: позначили невідоме."},{"do":"x + 17 = 45","why":"Етап 2: записали умову рівнянням."},{"do":"x = 45 − 17, x = 28","why":"Етап 3: перенесли 17 праворуч зі зміною знака."},{"do":"Перевірка: 28 + 17 = 45","why":"Етап 4: умова виконується."}],"answer":"Відповідь: задумали число 28."},{"task":"У двох сьомих класах разом 58 учнів. У 7-А на 4 учні більше, ніж у 7-Б. Скільки учнів у кожному класі?","steps":[{"do":"Нехай у 7-Б x учнів, тоді в 7-А — (x + 4) учнів","why":"Етап 1: позначили невідоме й виразили через нього іншу величину."},{"do":"x + (x + 4) = 58","why":"Етап 2: разом у двох класах 58 учнів."},{"do":"2x = 58 − 4, 2x = 54","why":"Етап 3: звели подібні й перенесли 4 праворуч зі зміною знака."},{"do":"x = 27; x + 4 = 31","why":"Поділили на 2 і знайшли, скільки учнів у 7-А."},{"do":"Перевірка: 27 + 31 = 58 і 31 − 27 = 4","why":"Етап 4: обидві умови виконано, числа цілі — відповідь розумна."}],"answer":"Відповідь: у 7-А — 31 учень, у 7-Б — 27 учнів."},{"task":"Сума трьох послідовних натуральних чисел (таких, що йдуть одне за одним, як 5, 6, 7) дорівнює 72. Знайди ці числа.","steps":[{"do":"Нехай менше число — x, тоді наступні — x + 1 і x + 2","why":"Етап 1: кожне наступне на 1 більше."},{"do":"x + (x + 1) + (x + 2) = 72","why":"Етап 2: сума дорівнює 72."},{"do":"3x + 3 = 72","why":"Етап 3: звели подібні."},{"do":"3x = 69, x = 23","why":"Перенесли 3 праворуч і поділили на 3."},{"do":"Перевірка: 23 + 24 + 25 = 72","why":"Етап 4: числа натуральні й послідовні, сума правильна."}],"answer":"Відповідь: 23, 24 і 25."}],"mistakes":["Знаходять x і зупиняються. Але x — це лише учні 7-Б. Правильно: знайти й 7-А (x + 4) і відповісти на <b>всі<\/b> питання задачі.","Не записують, що позначили буквою, і потім плутаються. Правильно: завжди починай з «Нехай x — …».","Залишають нерозумну відповідь, наприклад 27,5 учня. Правильно: така відповідь означає помилку — перевір рівняння й обчислення."],"check":[{"q":"Кіт важить утричі більше, ніж кошеня, а разом вони важать 8 кг. Скільки кілограмів важить кошеня?","accept":["2"],"a":"Нехай кошеня — x кг, кіт — 3x кг. x + 3x = 8, 4x = 8, x = 2. Перевірка: 2 + 6 = 8."},{"q":"Пастка: у задачі про кількість хлопців у класі вийшло x = 12,5. Що робити?","options":["Записати відповідь: 12,5 хлопця","Округлити до 13","Шукати помилку в рівнянні чи обчисленнях"],"correct":2,"a":"Кількість людей — ціле число, тож 12,5 означає помилку. Перевір рівняння й обчислення."},{"q":"Футбольна команда набрала за сезон 31 очко. За перемогу дають 3 очки, за нічию — 1. Нічиїх було 7. Скільки було перемог?","accept":["8"],"a":"3x + 7 = 31, 3x = 24, x = 8. Перевірка: 3 · 8 + 7 = 31."}]}},{"id":"A1.3.2","name":"Складаємо рівняння за умовою задачі","status":"ready","programmeRef":"Рівняння як математична модель задачі","lesson":{"what":"Рівняння, складене за умовою задачі, — це її <b>математична модель<\/b>: запис умови мовою математики. Головне — знайти в умові дві рівні величини й записати кожну з них через x.","ideas":["«На 5 більше» → x + 5; «на 5 менше» → x − 5; «у 3 рази більше» → 3x; «у 3 рази менше» → x : 3.","«Разом», «усього» — додаємо; «на скільки більше» — віднімаємо.","Шукай у тексті, що чому <b>дорівнює<\/b>, — саме це й стає рівнянням.","За x зручно брати меншу величину — тоді в рівнянні менше віднімання й дробів.","Перед складанням рівняння переведи величини в однакові одиниці (км і м, год і хв)."],"rules":[{"f":"вартість = ціна · кількість","means":"Для задач про покупки."},{"f":"s = v · t","means":"Шлях дорівнює швидкості, помноженій на час. Для задач на рух."}],"examples":[{"task":"Число, у 4 рази більше за x, на 15 більше за x. Запиши рівняння і знайди x.","steps":[{"do":"4x = x + 15","why":"«У 4 рази більше» — 4x; «на 15 більше» — x + 15."},{"do":"4x − x = 15","why":"Перенесли x ліворуч, змінивши знак."},{"do":"3x = 15, x = 5","why":"Звели подібні й поділили на 3."},{"do":"Перевірка: 4 · 5 = 20 і 5 + 15 = 20","why":"Обидві частини рівні."}],"answer":"Відповідь: x = 5."},{"task":"Мама купила 3 кг яблук і 2 кг груш і заплатила 230 грн. Кілограм груш на 15 грн дорожчий за кілограм яблук. Скільки коштує 1 кг яблук?","steps":[{"do":"Нехай 1 кг яблук коштує x грн, тоді 1 кг груш — (x + 15) грн","why":"«На 15 грн дорожчий» — додаємо 15."},{"do":"3x + 2(x + 15) = 230","why":"Вартість = ціна · кількість; разом заплатили 230 грн. Це модель задачі."},{"do":"5x + 30 = 230","why":"Розкрили дужки й звели подібні: 3x + 2x = 5x."},{"do":"5x = 200, x = 40","why":"Перенесли 30 праворуч зі зміною знака й поділили на 5."},{"do":"Перевірка: 3 · 40 + 2 · 55 = 120 + 110 = 230","why":"Сума збігається з умовою."}],"answer":"Відповідь: 1 кг яблук коштує 40 грн."},{"task":"Денис їхав від дому до стадіону велосипедом 0,5 год, а назад тією самою дорогою йшов пішки 1,5 год. Велосипедом він їхав на 8 км/год швидше, ніж ішов. З якою швидкістю він ішов?","steps":[{"do":"Нехай пішки — x км/год, тоді велосипедом — (x + 8) км/год","why":"«На 8 км/год швидше» — додаємо 8."},{"do":"1,5x = 0,5(x + 8)","why":"s = v · t; шлях туди й назад той самий."},{"do":"1,5x = 0,5x + 4","why":"Розкрили дужки."},{"do":"1,5x − 0,5x = 4, x = 4","why":"Перенесли 0,5x ліворуч і звели подібні."},{"do":"Перевірка: 1,5 · 4 = 6 км і 0,5 · 12 = 6 км","why":"Шляхи рівні."}],"answer":"Відповідь: 4 км/год."}],"mistakes":["«У 3 рази менше, ніж x» записують як x − 3. Правильно: x : 3. «У … рази» — множимо чи ділимо, «на …» — додаємо чи віднімаємо.","«У брата на 4 наліпки більше, ніж у сестри»: позначають наліпки сестри x, а брата записують x − 4. Правильно: x + 4 — у брата більше.","Додають величини в різних одиницях: 600 м + x = 1,8 км. Правильно: 1,8 км = 1800 м, тож 600 + x = 1800."],"check":[{"q":"Як записати «число, у 4 рази менше за x»?","options":["x − 4","4x","x : 4"],"correct":2,"a":"x : 4. «У … рази менше» — ділимо; «на … менше» — віднімаємо."},{"q":"Пастка: периметр прямокутника 30 см, довжина на 3 см більша за ширину x. Яке рівняння правильне?","options":["x + (x + 3) = 30","2(x + x + 3) = 30","x · (x + 3) = 30"],"correct":1,"a":"Периметр — сума <b>чотирьох<\/b> сторін: 2(x + x + 3) = 30, звідси x = 6. Ширина 6 см, довжина 9 см; 2 · (6 + 9) = 30."},{"q":"Дорога до школи — 1,8 км. Іра 10 хв ішла пішки зі швидкістю 60 м/хв, а решту шляху проїхала автобусом. Скільки метрів вона проїхала автобусом?","accept":["1200"],"a":"1,8 км = 1800 м. 60 · 10 + x = 1800, 600 + x = 1800, x = 1200. Перевірка: 600 + 1200 = 1800."}]}},{"id":"A1.3.3","name":"Задачі з життя: покупки, бюджет, рух","status":"ready","programmeRef":"Розв'язування задач за допомогою лінійних рівнянь.","lesson":{"what":"Рівняння допомагають у житті: спланувати покупку, порахувати сімейні витрати, зрозуміти, чи безпечно переходити дорогу. Етапи ті самі: позначаємо невідоме, складаємо рівняння, розв'язуємо, перевіряємо за змістом.","ideas":["<b>Покупки:<\/b> вартість = ціна · кількість. Якщо купують кілька різних речей, їхні вартості додають.","<b>Сімейний бюджет:<\/b> якщо вже є якась сума і щомісяця відкладають однаково, то через x місяців буде «що є + щомісячна сума · x».","<b>Безпека руху:<\/b> s = v · t. Автомобіль долає кілька метрів щосекунди й не може зупинитися миттєво — тому дорогу переходимо лише на зелене світло або коли машини зупинилися.","Перевір відповідь за змістом: чи реальна ціна, час, відстань; чи треба округлити до цілого (місяців, квитків)."],"rules":[{"f":"вартість = ціна · кількість","means":"Скільки заплатимо за кілька однакових речей."},{"f":"s = v · t","means":"Шлях = швидкість · час. Одиниці мають узгоджуватися: м/с і с, км/год і год."}],"examples":[{"task":"За 3 квитки в кіно й попкорн за 95 грн заплатили 545 грн. Скільки коштує один квиток?","steps":[{"do":"Нехай квиток коштує x грн; 3 квитки — 3x грн","why":"Вартість = ціна · кількість."},{"do":"3x + 95 = 545","why":"Квитки й попкорн разом коштують 545 грн."},{"do":"3x = 545 − 95, 3x = 450","why":"Перенесли 95 праворуч зі зміною знака."},{"do":"x = 150","why":"Поділили обидві частини на 3."},{"do":"Перевірка: 3 · 150 + 95 = 450 + 95 = 545","why":"Сума збігається з умовою."}],"answer":"Відповідь: квиток коштує 150 грн."},{"task":"Сім'я хоче купити пральну машину за 14 400 грн. Уже відкладено 3 600 грн. Скільки місяців треба відкладати по 1 800 грн, щоб вистачило на покупку?","steps":[{"do":"Нехай треба x місяців; за них відкладуть 1 800x грн","why":"Позначили невідоме буквою."},{"do":"3 600 + 1 800x = 14 400","why":"Те, що вже є, плюс нові заощадження — це ціна машини."},{"do":"1 800x = 14 400 − 3 600, 1 800x = 10 800","why":"Перенесли 3 600 праворуч зі зміною знака."},{"do":"x = 10 800 : 1 800, x = 6","why":"Поділили обидві частини на 1 800."},{"do":"Перевірка: 3 600 + 1 800 · 6 = 3 600 + 10 800 = 14 400","why":"Сума дорівнює ціні машини."}],"answer":"Відповідь: 6 місяців."},{"task":"Автомобіль їде зі швидкістю 54 км/год. Від миті, коли водій побачив пішохода, до повної зупинки авто проїжджає 35 м. Гальмівний шлях на 5 м довший, ніж шлях, який авто проїде, поки водій реагує (ще не тисне на гальмо). Скільки метрів авто проїде, перш ніж водій почне гальмувати?","steps":[{"do":"Нехай до початку гальмування — x м, тоді гальмівний шлях — (x + 5) м","why":"«На 5 м довший» — додаємо 5."},{"do":"x + (x + 5) = 35","why":"Разом до зупинки — 35 м."},{"do":"2x = 35 − 5, 2x = 30","why":"Звели подібні й перенесли 5 праворуч зі зміною знака."},{"do":"x = 15","why":"Поділили обидві частини на 2."},{"do":"Перевірка: 15 + 20 = 35","why":"Сума збігається з умовою."}],"answer":"Відповідь: 15 м. А до повної зупинки — аж 35 м, тому перед близькою машиною дорогу не переходять."}],"mistakes":["Забувають те, що вже є: пишуть 1 800x = 14 400 і отримують 8 місяців. Правильно: врахувати вже відкладені 3 600 грн.","Змішують одиниці: швидкість у км/год, а час у хвилинах. Правильно: спершу переведи, наприклад 15 хв = 0,25 год.","Залишають відповідь «4,5 місяця», хоча відкладають раз на місяць. Правильно: за 4 місяці не вистачить, тож потрібно 5 місяців."],"check":[{"q":"Безпека руху: автомобіль їде зі швидкістю 15 м/с (це 54 км/год), до пішохідного переходу йому 60 м. Пішохід іде зі швидкістю 1 м/с, дорога завширшки 7 м. Чи встигне пішохід перейти дорогу, поки авто доїде до переходу?","options":["Так, встигне","Ні, не встигне"],"correct":1,"a":"Авто: 15t = 60, t = 4 с. Пішоходу треба 7 : 1 = 7 с, а 7 > 4 — він <b>не встигне<\/b>. Переходь, лише коли машина зупинилася, а на світлофорі — на зелене."},{"q":"Тато купив 2 однакові футболки й кепку за 180 грн і заплатив 760 грн. Скільки гривень коштує одна футболка?","accept":["290"],"a":"2x + 180 = 760, 2x = 580, x = 290. Перевірка: 2 · 290 + 180 = 760."},{"q":"Пастка: Марко збирає на велосипед за 7 000 грн і відкладає по 1 500 грн щомісяця (спочатку грошей немає). Через скільки повних місяців він зможе купити велосипед?","accept":["5"],"a":"1 500x = 7 000, x = 7 000 : 1 500 ≈ 4,7. За 4 місяці буде лише 6 000 грн — замало, а за 5 місяців — 7 500 грн. Отже, 5 місяців."}]}}]}]},{"id":"A2","subject":"algebra","name":"Цілі вирази","what":"Вирази з буквами, степені, одночлени й многочлени. Учимося спрощувати вирази й розкладати їх на множники.","topics":[{"id":"A2.1","name":"Вирази зі змінними","what":"Що таке вираз зі змінними, його значення і тотожні перетворення.","subtopics":[{"id":"A2.1.1","name":"Числові вирази й вирази зі змінними","status":"planned","programmeRef":"Вирази зі змінними. Цілі раціональні вирази."},{"id":"A2.1.2","name":"Тотожність і тотожні перетворення","status":"planned","programmeRef":"Тотожність. Тотожні перетворення виразу."}]},{"id":"A2.2","name":"Степінь з натуральним показником","what":"Короткий запис множення однакових множників і його властивості.","subtopics":[{"id":"A2.2.1","name":"Що таке степінь","status":"planned","programmeRef":"Степінь з натуральним показником."},{"id":"A2.2.2","name":"Властивості степеня","status":"planned","programmeRef":"Властивості степеня з натуральним показником."}]},{"id":"A2.3","name":"Одночлени","what":"Добуток чисел і букв: стандартний вигляд, множення, піднесення до степеня.","subtopics":[{"id":"A2.3.1","name":"Одночлен стандартного вигляду","status":"planned","programmeRef":"Одночлен."},{"id":"A2.3.2","name":"Множення одночленів і піднесення до степеня","status":"planned","programmeRef":"Піднесення одночленів до степеня. Множення одночленів."}]},{"id":"A2.4","name":"Многочлени і дії з ними","what":"Сума одночленів: зведення подібних, додавання, віднімання, множення.","subtopics":[{"id":"A2.4.1","name":"Многочлен і подібні члени","status":"planned","programmeRef":"Многочлен. Подібні члени многочлена та їх зведення. Степінь многочлена."},{"id":"A2.4.2","name":"Додавання і віднімання многочленів","status":"planned","programmeRef":"Додавання, віднімання і множення многочленів."},{"id":"A2.4.3","name":"Множення одночлена на многочлен","status":"planned","programmeRef":"Додавання, віднімання і множення многочленів."},{"id":"A2.4.4","name":"Множення многочлена на многочлен","status":"planned","programmeRef":"Додавання, віднімання і множення многочленів."}]},{"id":"A2.5","name":"Формули скороченого множення","what":"Готові формули, що прискорюють обчислення.","subtopics":[{"id":"A2.5.1","name":"Квадрат суми і квадрат різниці","status":"planned","programmeRef":"Формули квадрата двочлена"},{"id":"A2.5.2","name":"Різниця квадратів","status":"planned","programmeRef":"різниці квадратів"},{"id":"A2.5.3","name":"Сума і різниця кубів","status":"planned","programmeRef":"суми і різниці кубів."}]},{"id":"A2.6","name":"Розкладання многочленів на множники","what":"Як перетворити суму на добуток.","subtopics":[{"id":"A2.6.1","name":"Винесення спільного множника за дужки","status":"planned","programmeRef":"Розкладання многочленів на множники"},{"id":"A2.6.2","name":"Спосіб групування","status":"planned","programmeRef":"Розкладання многочленів на множники"},{"id":"A2.6.3","name":"Розкладання за формулами скороченого множення","status":"planned","programmeRef":"Розкладання многочленів на множники"},{"id":"A2.6.4","name":"Кілька способів разом","status":"planned","programmeRef":"Розкладання многочленів на множники"}]}]},{"id":"A3","subject":"algebra","name":"Функції","what":"Як одна величина залежить від іншої. Учимося читати й будувати графіки.","topics":[{"id":"A3.1","name":"Функція","what":"Залежність, у якій кожному значенню аргументу відповідає одне значення функції.","subtopics":[{"id":"A3.1.1","name":"Функціональна залежність","status":"planned","programmeRef":"Функціональна залежність між величинами як математична модель реальних процесів."},{"id":"A3.1.2","name":"Область визначення і область значень","status":"planned","programmeRef":"Функція. Область визначення та область значень функції."},{"id":"A3.1.3","name":"Способи задання функції","status":"planned","programmeRef":"Способи задання функції."}]},{"id":"A3.2","name":"Графік функції","what":"Як зобразити функцію на координатній площині і як читати графік.","subtopics":[{"id":"A3.2.1","name":"Графік функції","status":"planned","programmeRef":"Графік функції."}]},{"id":"A3.3","name":"Лінійна функція","what":"Функція y = kx + b, її графік — пряма.","subtopics":[{"id":"A3.3.1","name":"Лінійна функція та її графік","status":"planned","programmeRef":"Лінійна функція, її графік та властивості"},{"id":"A3.3.2","name":"Пряма пропорційність","status":"planned","programmeRef":"Лінійна функція, її графік та властивості"},{"id":"A3.3.3","name":"Властивості лінійної функції за графіком","status":"planned","programmeRef":"Лінійна функція, її графік та властивості"}]}]},{"id":"A4","subject":"algebra","name":"Системи лінійних рівнянь з двома змінними","what":"Два рівняння з двома невідомими одночасно. Три способи розв'язування і задачі.","topics":[{"id":"A4.1","name":"Рівняння з двома змінними","what":"Розв'язки рівняння з двома змінними і його графік.","subtopics":[{"id":"A4.1.1","name":"Рівняння з двома змінними і його розв'язок","status":"planned","programmeRef":"Рівняння з двома змінними. Розв'язок рівняння з двома змінними."},{"id":"A4.1.2","name":"Графік лінійного рівняння з двома змінними","status":"planned","programmeRef":"Лінійне рівняння з двома змінними та його графік."}]},{"id":"A4.2","name":"Системи двох лінійних рівнянь","what":"Що таке система, її розв'язок і способи розв'язування.","subtopics":[{"id":"A4.2.1","name":"Система і її розв'язок","status":"planned","programmeRef":"Система двох лінійних рівнянь з двома змінними та її розв'язок."},{"id":"A4.2.2","name":"Графічний спосіб","status":"planned","programmeRef":"графічним способом"},{"id":"A4.2.3","name":"Спосіб підстановки","status":"planned","programmeRef":"способом підстановки"},{"id":"A4.2.4","name":"Спосіб додавання","status":"planned","programmeRef":"способом додавання."}]},{"id":"A4.3","name":"Задачі за допомогою систем","what":"Дві невідомі величини — два рівняння.","subtopics":[{"id":"A4.3.1","name":"Складаємо систему за умовою задачі","status":"planned","programmeRef":"Розв'язування задач за допомогою систем лiнійних рівнянь."}]}]}]},{"id":"geometry","name":"Геометрія","grade":7,"tutor":"Оля","tutorCall":"Олю","icon":"📐","sections":[{"id":"G1","subject":"geometry","name":"Елементарні геометричні фігури та їх властивості","what":"Точки, прямі, відрізки, промені й кути — з них складається вся геометрія. Учимося їх вимірювати.","topics":[{"id":"G1.1","name":"Точка, пряма, відрізок, промінь","what":"Найпростіші фігури і їхні властивості.","subtopics":[{"id":"G1.1.1","name":"Геометричні фігури. Точка і пряма","status":"ready","programmeRef":"Геометричні фігури.","lesson":{"what":"Геометрія вивчає фігури. <b>Геометрична фігура<\/b> — це будь-який набір точок: точка, пряма, трикутник, коло. Найпростіші з них — <b>точка<\/b> і <b>пряма<\/b>.","ideas":["Точка не має ні довжини, ні ширини. Її моделі — слід від гострого олівця, зірка на нічному небі, місто на великій карті. Точки позначають великими латинськими літерами: A, B, C.","Пряма не має ні початку, ні кінця — вона нескінченна в обидва боки. У зошиті ми малюємо за лінійкою лише її частину. Моделі прямої — туго натягнута нитка, промінь лазерної указки.","Пряму позначають малою латинською літерою (пряма <i>a<\/i>) або двома її точками (пряма AB). Пряма AB і пряма BA — це та сама пряма.","Якщо точка лежить на прямій, кажуть, що вона <b>належить<\/b> прямій: A ∈ <i>a<\/i>. Якщо не лежить — не належить: B ∉ <i>a<\/i>.","Дві прямі, які мають спільну точку, <b>перетинаються<\/b> в цій точці."],"rules":[{"f":"Через будь-які дві точки можна провести пряму, і до того ж тільки одну.","means":"Основна властивість прямої. Дві точки повністю задають пряму — тому пряму можна назвати двома її точками."},{"f":"Яка б не була пряма, існують точки, що належать цій прямій, і точки, що їй не належать.","means":"Поруч із будь-якою прямою завжди можна позначити точку і на ній, і поза нею."},{"f":"Дві різні прямі мають не більше однієї спільної точки.","means":"Якби спільних точок було дві, то через них проходили б дві різні прямі, а так не буває (див. основну властивість)."}],"examples":[{"task":"Накресліть пряму <i>a<\/i>. Позначте на ній точки A і B, а поза нею — точку C. Запишіть символами, які точки належать прямій <i>a<\/i>, а які ні. Чи можна провести через A і B ще одну пряму, відмінну від <i>a<\/i>?","steps":[{"do":"Малюємо пряму <i>a<\/i>, на ній точки A і B, а трохи вище прямої — точку C.","why":"Яка б не була пряма, є точки, що їй належать, і точки, що їй не належать."},{"do":"A і B лежать на прямій, тому A ∈ <i>a<\/i>, B ∈ <i>a<\/i>.","why":"«Належить» означає «лежить на»."},{"do":"C не лежить на прямій, тому C ∉ <i>a<\/i>.","why":"Знак ∉ означає «не належить»."},{"do":"Інша пряма через A і B неможлива: через них уже проходить пряма <i>a<\/i>.","why":"Через дві точки можна провести пряму, і до того ж тільки одну."}],"answer":"Відповідь: A ∈ <i>a<\/i>, B ∈ <i>a<\/i>, C ∉ <i>a<\/i>; іншої прямої через A і B провести не можна."},{"task":"Позначте в зошиті чотири точки A, B, C, D так, щоб жодні три з них не лежали на одній прямій. Скільки різних прямих можна провести через кожні дві з цих точок?","steps":[{"do":"Малюємо: чотири точки, наче кути неправильного чотирикутника. Дано: 4 точки, жодні три не на одній прямій. Знайти: кількість прямих.","why":"Спершу малюнок — так легше нічого не пропустити."},{"do":"Через точку A проводимо прямі до кожної з інших: AB, AC, AD — 3 прямі.","why":"Через дві точки проходить одна пряма, і тільки одна."},{"do":"Через точку B — нові прямі BC і BD (пряму BA вже порахували) — 2 прямі. Через C — нова пряма CD — 1 пряма.","why":"Пряма AB і пряма BA — та сама пряма, рахувати її двічі не можна."},{"do":"Разом: 3 + 2 + 1 = 6.","why":"Жодні три точки не на одній прямій, тому всі ці прямі різні."}],"answer":"Відповідь: 6 прямих (AB, AC, AD, BC, BD, CD)."},{"task":"Три прямі <i>a<\/i>, <i>b<\/i>, <i>c<\/i> попарно перетинаються, але не проходять через одну точку. Скільки всього точок перетину? Накресліть у зошиті: три прямі, що утворюють «трикутник».","steps":[{"do":"Дано: прямі <i>a<\/i>, <i>b<\/i>, <i>c<\/i> попарно перетинаються, через одну точку всі три не проходять. Знайти: кількість точок перетину.","why":"Записуємо умову."},{"do":"Складаємо пари прямих: <i>a<\/i> і <i>b<\/i>, <i>a<\/i> і <i>c<\/i>, <i>b<\/i> і <i>c<\/i> — 3 пари.","why":"Кожна точка перетину належить якійсь парі прямих."},{"do":"Кожна пара має рівно одну спільну точку.","why":"Дві різні прямі мають не більше однієї спільної точки, а за умовою вони перетинаються."},{"do":"Ці три точки різні, бо всі три прямі не проходять через одну точку. Разом 3 точки.","why":"Якби дві точки перетину збіглися, три прямі пройшли б через неї."}],"answer":"Відповідь: 3 точки перетину."}],"mistakes":["Вважати, що в прямої є кінці або довжина. Пряма нескінченна; кінці є у відрізка.","Рахувати пряму AB і пряму BA як дві різні прямі.","Думати, що через будь-які три точки можна провести одну пряму. Це так лише тоді, коли точки лежать на одній прямій."],"check":[{"q":"<b>Пастка.<\/b> Через будь-які три точки можна провести одну пряму?","options":["Так, завжди","Лише якщо вони лежать на одній прямій","Ніколи"],"correct":1,"a":"Лише якщо точки лежать на одній прямій. Інакше через кожні дві точки — своя пряма, разом 3 прямі."},{"q":"Садівник хоче посадити цибулю рівним рядком і натягнути мотузку між кілочками. Скільки кілочків йому досить?","options":["Три","Один","Два"],"correct":2,"a":"Два, бо через дві точки проходить пряма, і тільки одна."},{"q":"Позначили 5 точок, жодні три з яких не лежать на одній прямій. Скільки різних прямих можна провести через кожні дві з них? Введіть число.","accept":["10"],"a":"4 + 3 + 2 + 1 = 10: від першої точки — 4 прямі, від другої — ще 3 нові, і так далі."}]}},{"id":"G1.1.2","name":"Відрізок і промінь","status":"ready","programmeRef":"Точка, пряма, відрізок, промінь, кут. Їх властивості.","lesson":{"what":"<b>Відрізок<\/b> AB — частина прямої між точками A і B разом із цими точками; A і B — його <b>кінці<\/b>. <b>Промінь<\/b> — частина прямої, що має початок, але не має кінця: точка і всі точки прямої по один бік від неї.","ideas":["Порівняйте: у відрізка два кінці, у променя — лише початок, у прямої — ні початку, ні кінця.","«Точка C <b>лежить між<\/b> точками A і B» означає: C лежить на відрізку AB і не збігається з його кінцями.","Промінь називають двома літерами, і першою завжди пишуть початок: промінь OA починається в точці O і йде через точку A. Промінь AO — це вже інший промінь.","Точка O на прямій ділить її на два промені з початком O, які йдуть у протилежні боки. Їх називають <b>доповняльними<\/b>: разом вони складають усю пряму.","Моделі: край лінійки чи натягнута струна — відрізок; світло від ліхтарика — промінь (є початок, а далі воно йде в один бік)."],"rules":[{"f":"З трьох точок на прямій одна і тільки одна лежить між двома іншими.","means":"Основна властивість розміщення точок на прямій: якщо три точки на одній прямій, то рівно одна з них — «посередині»."},{"f":"Промінь OA: O — початок, A — будь-яка інша точка променя.","means":"Якщо на промені OA лежить ще точка B, то промінь OB — той самий промінь, що й OA."}],"examples":[{"task":"Накресліть пряму і позначте на ній точки A, B, C так, щоб точка B лежала між A і C. Назвіть промені з початком у точці B. Якому з них належить точка A?","steps":[{"do":"Малюємо пряму, на ній зліва направо A, B, C.","why":"B лежить між A і C, тому вона посередині."},{"do":"Точка B ділить пряму на два доповняльні промені: BA (ліворуч) і BC (праворуч).","why":"Точка на прямій ділить її на два промені; першою пишемо початок."},{"do":"Точка A лежить ліворуч від B, тобто на промені BA, а не на промені BC.","why":"Промінь BC іде від B праворуч, через C."}],"answer":"Відповідь: промені BA і BC; точка A належить променю BA."},{"task":"Накресліть пряму і позначте на ній точки M, K, P так, щоб точка K лежала між M і P. Скільки утворилося відрізків з кінцями в цих точках і скільки променів з початками в цих точках?","steps":[{"do":"Малюємо пряму, на ній зліва направо точки M, K, P.","why":"K лежить між M і P, тому вона посередині."},{"do":"Відрізки: MK, KP, MP — 3 відрізки.","why":"Відрізок задають два кінці, а пар точок тут три."},{"do":"Кожна точка ділить пряму на два доповняльні промені: у M — 2, у K — 2, у P — 2. Разом 2 + 2 + 2 = 6.","why":"Точка на прямій ділить її рівно на два промені."},{"do":"Зауважимо: промінь MK і промінь MP — той самий промінь (обидва починаються в M і йдуть праворуч). Тому рахуємо його один раз.","why":"Промінь визначають початок і напрям; точка P лежить на промені MK."}],"answer":"Відповідь: 3 відрізки і 6 променів."},{"task":"Точки A, B, C, D лежать на прямій саме в такому порядку. Скільки всього відрізків з кінцями в цих точках? У яких із них точка B лежить між кінцями?","steps":[{"do":"Малюємо пряму і на ній зліва направо A, B, C, D.","why":"Порядок точок задано в умові."},{"do":"Відрізки з кінцем A: AB, AC, AD (3); нові з кінцем B: BC, BD (2); нові з кінцем C: CD (1). Разом 3 + 2 + 1 = 6.","why":"Відрізок задають два кінці; AB і BA — той самий відрізок."},{"do":"B лежить між кінцями, якщо один кінець ліворуч від B, а другий — праворуч. Ліворуч лише A, праворуч — C і D.","why":"Означення «лежить між»."},{"do":"Отже, це відрізки AC і AD.","why":"У AB і BD точка B — кінець, а не внутрішня точка."}],"answer":"Відповідь: 6 відрізків; точка B лежить між кінцями відрізків AC і AD."}],"mistakes":["Плутати промінь OA і промінь AO. Першою літерою завжди пишуть початок.","Вважати промені MK і MP різними, хоча P лежить на промені MK — це той самий промінь.","Плутати відрізок, промінь і пряму на малюнку: відрізок малюють з двома позначеними кінцями, промінь — з одним, пряму — без кінців."],"check":[{"q":"<b>Пастка.<\/b> Що довше: промінь OA чи відрізок OA?","options":["Промінь OA","Відрізок OA","Порівняти не можна: промінь не має довжини"],"correct":2,"a":"Промінь нескінченний, у нього немає довжини. Довжину має лише відрізок."},{"q":"Світло від ліхтарика в темряві — це модель якої фігури?","options":["Відрізка","Променя","Прямої"],"correct":1,"a":"Променя: є початок (ліхтарик), а далі світло йде в один бік."},{"q":"Точки A, B, C лежать на прямій, B лежить між A і C. Чи належить точка C променю AB?","options":["Так","Ні"],"correct":0,"a":"Так: промінь AB іде від A через B і далі, а C лежить за B."}]}}]},{"id":"G1.2","name":"Кут","what":"Кут, його види і бісектриса.","subtopics":[{"id":"G1.2.1","name":"Кут і види кутів","status":"ready","programmeRef":"Точка, пряма, відрізок, промінь, кут. Їх властивості.","lesson":{"what":"<b>Кут<\/b> — фігура з двох променів зі спільним початком. Промені — це <b>сторони<\/b> кута, а їхній спільний початок — <b>вершина<\/b>.","ideas":["Кут позначають трьома літерами, вершина — завжди посередині: ∠ABC (вершина B). ∠ABC і ∠CBA — той самий кут, а ∠BAC — зовсім інший. Якщо зрозуміло, можна коротко: ∠B.","Кут, сторони якого — доповняльні промені (разом утворюють пряму), називають <b>розгорнутим<\/b>. Він дорівнює 180°.","Види кутів: <b>гострий<\/b> — менший за 90°; <b>прямий<\/b> — 90°; <b>тупий<\/b> — більший за 90°, але менший за 180°; <b>розгорнутий<\/b> — 180°.","Прямий кут на малюнку позначають маленьким квадратиком біля вершини.","Розмір кута не залежить від того, наскільки довгими намальовано його сторони. Моделі кута — стрілки годинника, розкриті ножиці, відчинені двері."],"rules":[{"f":"гострий: менше 90°; прямий: 90°; тупий: від 90° до 180° (не включно); розгорнутий: 180°","means":"Вид кута визначають за його градусною мірою."}],"examples":[{"task":"Визначте вид кожного кута: 35°, 90°, 91°, 179°, 180°.","steps":[{"do":"Згадуємо межі: гострий — менше 90°, прямий — 90°, тупий — більше 90°, але менше 180°, розгорнутий — 180°.","why":"Класифікація кутів за градусною мірою."},{"do":"35° < 90°, тому 35° — гострий; 90° — прямий.","why":"Порівнюємо з 90°."},{"do":"91° і 179° більші за 90°, але менші за 180°, тому обидва тупі.","why":"Навіть 91° — уже тупий, а 179° — ще не розгорнутий."},{"do":"180° — розгорнутий.","why":"Розгорнутий кут дорівнює 180°."}],"answer":"Відповідь: 35° — гострий, 90° — прямий, 91° і 179° — тупі, 180° — розгорнутий."},{"task":"Які кути утворюють годинна і хвилинна стрілки о 2:00, 3:00, 5:00 і 6:00? Назвіть вид кожного кута. Намалюйте в зошиті циферблат із цими положеннями стрілок.","steps":[{"do":"Малюємо циферблат. Повне коло — 360°, на ньому 12 поділок-годин. Одна поділка: 360° : 12 = 30°.","why":"Цифри на циферблаті розміщені через рівні проміжки."},{"do":"О цілій годині хвилинна стрілка на 12, а годинна — точно на числі годин. О 2:00 між ними 2 поділки: 2 · 30° = 60°; о 3:00 — 3 · 30° = 90°.","why":"Кут дорівнює кількості поділок між стрілками, помноженій на 30°."},{"do":"О 5:00: 5 · 30° = 150°; о 6:00: 6 · 30° = 180° — стрілки утворюють пряму.","why":"Той самий підрахунок поділок."},{"do":"Класифікуємо: 60° — гострий; 90° — прямий; 150° — тупий; 180° — розгорнутий.","why":"Порівнюємо з 90° і 180°."}],"answer":"Відповідь: о 2:00 — 60° (гострий), о 3:00 — 90° (прямий), о 5:00 — 150° (тупий), о 6:00 — 180° (розгорнутий)."},{"task":"З точки O проведено чотири промені OA, OB, OC, OD; вони йдуть по черзі, як віяло, і ∠AOD менший за розгорнутий. Скільки кутів з вершиною O на малюнку? Назвіть їх.","steps":[{"do":"Малюємо точку O і віялом чотири промені: OA, OB, OC, OD.","why":"Спершу малюнок."},{"do":"Кут утворюють будь-які два промені зі спільним початком O. Кути зі стороною OA: ∠AOB, ∠AOC, ∠AOD — 3.","why":"Означення кута."},{"do":"Нові кути зі стороною OB: ∠BOC, ∠BOD — 2; зі стороною OC: ∠COD — 1.","why":"∠BOA — це вже порахований ∠AOB, вершина O посередині назви."},{"do":"Разом 3 + 2 + 1 = 6.","why":"Кожну пару променів рахуємо один раз."}],"answer":"Відповідь: 6 кутів: ∠AOB, ∠AOC, ∠AOD, ∠BOC, ∠BOD, ∠COD."}],"mistakes":["Ставити вершину не посередині назви: для кута з вершиною B писати ∠BAC замість ∠ABC.","Думати, що кут стане більшим, якщо подовжити його сторони. Розмір кута від довжини сторін не залежить.","Плутати прямий кут (90°) з розгорнутим (180°). «Прямий» — не тому, що схожий на пряму!"],"check":[{"q":"<b>Пастка.<\/b> Учень подовжив сторони кута вдвічі. Що сталося з кутом?","options":["Не змінився","Збільшився вдвічі","Зменшився"],"correct":0,"a":"Кут залежить від того, наскільки «розходяться» сторони, а не від їхньої довжини."},{"q":"Двері відчинили так, що між дверима і стіною кут 120°. Який це кут?","options":["Гострий","Прямий","Тупий","Розгорнутий"],"correct":2,"a":"Тупий: 120° більше за 90°, але менше за 180°."},{"q":"З вершини O проведено промені OA, OB, OC, причому OB лежить між OA і OC. Скільки кутів з вершиною O на малюнку? Введіть число.","accept":["3"],"a":"Три: ∠AOB, ∠BOC, ∠AOC."}]}},{"id":"G1.2.2","name":"Бісектриса кута","status":"ready","programmeRef":"Бісектриса кута.","lesson":{"what":"<b>Бісектриса кута<\/b> — промінь з початком у вершині кута, який проходить між його сторонами і ділить кут навпіл, тобто на два рівні кути.","ideas":["<b>Рівні кути<\/b> — кути з однаковою градусною мірою.","Якщо OK — бісектриса ∠AOB, то ∠AOK = ∠KOB, і кожен з них — половина ∠AOB.","У кожного кута є бісектриса, і тільки одна.","Бісектриса розгорнутого кута утворює з його сторонами два прямі кути: 180° : 2 = 90°.","Як знайти бісектрису: виміряти кут транспортиром, поділити на 2 і відкласти половину від однієї сторони. Або вирізати кут з паперу й перегнути так, щоб сторони збіглися: лінія згину — бісектриса."],"rules":[{"f":"OK — бісектриса ∠AOB ⇒ ∠AOK = ∠KOB = ∠AOB : 2","means":"Щоб знайти половинку, ділимо весь кут на 2."},{"f":"∠AOB = 2 · ∠AOK","means":"Щоб знайти весь кут за половинкою, множимо на 2."}],"examples":[{"task":"Промінь OK — бісектриса ∠AOB, ∠AOK = 37°. Знайдіть ∠AOB. Накресліть кут AOB і промінь OK посередині.","steps":[{"do":"Дано: OK — бісектриса ∠AOB, ∠AOK = 37°. Знайти: ∠AOB.","why":"Записуємо умову."},{"do":"∠KOB = ∠AOK = 37°.","why":"Бо бісектриса ділить кут на два рівні кути."},{"do":"∠AOB = ∠AOK + ∠KOB = 37° + 37° = 74°.","why":"Бо промінь OK проходить між сторонами ∠AOB, і кут дорівнює сумі цих кутів."}],"answer":"Відповідь: ∠AOB = 74°."},{"task":"∠AOB = 140°. Промінь OK — бісектриса ∠AOB, промінь OM — бісектриса ∠AOK. Знайдіть ∠MOB. Накресліть у зошиті: кут AOB, всередині промінь OK, а між OA і OK — промінь OM.","steps":[{"do":"Дано: ∠AOB = 140°, OK — бісектриса ∠AOB, OM — бісектриса ∠AOK. Знайти: ∠MOB.","why":"Записуємо умову, щоб бачити, що відомо."},{"do":"∠AOK = ∠KOB = 140° : 2 = 70°.","why":"Бо бісектриса ділить кут навпіл."},{"do":"∠MOK = 70° : 2 = 35°.","why":"Бо OM — бісектриса ∠AOK."},{"do":"∠MOB = ∠MOK + ∠KOB = 35° + 70° = 105°.","why":"Бо промінь OK проходить між сторонами ∠MOB, а кут дорівнює сумі кутів, на які його ділить такий промінь."}],"answer":"Відповідь: ∠MOB = 105°."},{"task":"О 3:00 стрілки годинника утворюють прямий кут. Яким числом циферблата «вказує» бісектриса цього кута, і який кут вона утворює з хвилинною стрілкою? Намалюйте циферблат і бісектрису.","steps":[{"do":"О 3:00 хвилинна стрілка на 12, годинна на 3; кут між ними 3 · 30° = 90°.","why":"Одна поділка циферблата — 360° : 12 = 30°."},{"do":"Бісектриса утворює з кожною стрілкою кут 90° : 2 = 45°.","why":"Бо бісектриса ділить кут навпіл."},{"do":"45° : 30° = 1,5 поділки від числа 12, тобто рівно посередині між 1 і 2.","why":"Кожна поділка — 30°, а 45° — це півтори поділки."}],"answer":"Відповідь: бісектриса проходить посередині між числами 1 і 2 і утворює з хвилинною стрілкою кут 45°."}],"mistakes":["Множити замість ділити: шукаючи половину кута, писати 2 · ∠AOB.","Вважати бісектрисою будь-який промінь між сторонами кута. Бісектриса ділить кут саме на два <b>рівні<\/b> кути.","Шукати бісектрису «на око». Перевіряйте транспортиром: обидва утворені кути мають бути однакові."],"check":[{"q":"<b>Пастка.<\/b> Бісектриса гострого кута утворює з його стороною кут 50°. Чи можливо таке?","options":["Ні","Так"],"correct":0,"a":"Ні: тоді весь кут 2 · 50° = 100°, а це тупий кут, не гострий."},{"q":"Бісектриса ділить кут на два кути по 45°. Скільки градусів у всьому куті? Введіть число.","accept":["90"],"a":"2 · 45° = 90°, це прямий кут."},{"q":"Як знайти бісектрису кута, вирізаного з паперу, без транспортира?","options":["Провести промінь будь-куди між сторонами","Перегнути аркуш через вершину так, щоб сторони кута збіглися","Виміряти лінійкою довжини сторін"],"correct":1,"a":"Лінія згину ділить кут на дві частини, що накладаються одна на одну, тобто на рівні кути — це бісектриса."}]}}]},{"id":"G1.3","name":"Вимірювання відрізків і кутів","what":"Довжина відрізка, відстань між точками, градусна міра кута.","subtopics":[{"id":"G1.3.1","name":"Вимірювання відрізків. Відстань між двома точками","status":"ready","programmeRef":"Вимірювання відрізків і кутів.","lesson":{"what":"Виміряти відрізок — дізнатися, скільки разів у ньому вміщується одиниця довжини (1 мм, 1 см, 1 м). Отримане число — <b>довжина відрізка<\/b>: AB = 5 см. <b>Відстань між точками<\/b> A і B — це довжина відрізка AB.","ideas":["Кожний відрізок має довжину, більшу за нуль.","<b>Рівні відрізки<\/b> — відрізки однакової довжини. На малюнку їх позначають однаковою кількістю рисочок.","Якщо точка C лежить між A і B, то вона ділить відрізок AB на дві частини, і AB = AC + CB.","Якщо невідомо, яка з трьох точок лежить між іншими, треба розглянути всі можливі випадки — відповідей може бути дві.","Перед додаванням довжин переведіть їх в однакові одиниці: 1 см = 10 мм, 1 м = 100 см, 1 км = 1000 м."],"rules":[{"f":"AB = AC + CB, якщо точка C лежить між A і B","means":"Довжина відрізка дорівнює сумі довжин частин, на які його ділить будь-яка його точка."},{"f":"На будь-якому промені від його початку можна відкласти відрізок заданої довжини, і до того ж тільки один.","means":"Так ми будуємо відрізок потрібної довжини: від початку променя відміряємо лінійкою, скільки треба."}],"examples":[{"task":"Точка C лежить між точками A і B, AC = 2,5 см, CB = 3,7 см. Знайдіть AB. Накресліть відрізок AB і позначте на ньому C.","steps":[{"do":"Дано: C лежить між A і B, AC = 2,5 см, CB = 3,7 см. Знайти: AB.","why":"Записуємо умову."},{"do":"AB = AC + CB.","why":"Бо довжина відрізка дорівнює сумі довжин частин, на які його ділить точка C."},{"do":"AB = 2,5 + 3,7 = 6,2 (см).","why":"Додаємо десяткові дроби: кома під комою."}],"answer":"Відповідь: AB = 6,2 см."},{"task":"Відрізок AB = 4 см 5 мм. Точка C лежить між A і B, AC = 18 мм. Знайдіть CB. Накресліть такий відрізок у зошиті й перевірте лінійкою.","steps":[{"do":"Переводимо в однакові одиниці: 4 см 5 мм = 40 мм + 5 мм = 45 мм.","why":"1 см = 10 мм; додавати й віднімати можна лише однакові одиниці."},{"do":"AB = AC + CB, тобто 45 = 18 + CB.","why":"Бо C лежить між A і B — довжина відрізка дорівнює сумі його частин."},{"do":"CB = 45 − 18 = 27 (мм) = 2,7 см.","why":"Невідомий доданок = сума − відомий доданок."}],"answer":"Відповідь: CB = 27 мм (2,7 см)."},{"task":"Точки A, B, C лежать на одній прямій, AB = 8 см, BC = 3 см. Знайдіть AC. Розгляньте всі можливі випадки і для кожного зробіть окремий малюнок у зошиті.","steps":[{"do":"Дано: A, B, C на одній прямій, AB = 8 см, BC = 3 см. Знайти: AC. Невідомо, яка точка лежить між двома іншими, тому розглядаємо три випадки.","why":"З трьох точок на прямій одна і тільки одна лежить між двома іншими."},{"do":"Випадок 1: C між A і B. Тоді AB = AC + CB, тобто 8 = AC + 3, AC = 8 − 3 = 5 (см).","why":"Довжина відрізка дорівнює сумі довжин його частин."},{"do":"Випадок 2: B між A і C. Тоді AC = AB + BC = 8 + 3 = 11 (см).","why":"Та сама властивість: AC складається з частин AB і BC."},{"do":"Випадок 3: A між B і C. Тоді BC = BA + AC, тобто 3 = 8 + AC — неможливо, бо частина не може бути довшою за весь відрізок.","why":"Довжина відрізка AC має бути більшою за нуль."}],"answer":"Відповідь: AC = 5 см (якщо C лежить між A і B) або AC = 11 см (якщо B лежить між A і C)."}],"mistakes":["Розглядати лише один випадок і завжди додавати. Якщо точка лежить не між іншими, відстань може бути різницею.","Додавати довжини в різних одиницях (наприклад, 3 см + 5 мм = 8). Спершу переведіть: 30 мм + 5 мм = 35 мм.","Прикладати лінійку не від нуля, а від її краю."],"check":[{"q":"<b>Пастка.<\/b> Точки K, L, M лежать на прямій; KL = 4 см, LM = 6 см, KM = 10 см. Яка точка лежить між двома іншими?","options":["M","K","L"],"correct":2,"a":"L, бо KL + LM = 4 + 6 = 10 = KM."},{"q":"Дім, магазин і школа стоять уздовж прямої дороги, магазин — між домом і школою. Від дому до школи 1,2 км, від дому до магазину 0,5 км. Скільки кілометрів від магазину до школи?","accept":["0,7"],"a":"1,2 − 0,5 = 0,7 км, бо відстань від дому до школи — сума двох частин."},{"q":"Точки M, N, P лежать на одній прямій, MN = 7 см, NP = 2 см. Знайдіть MP у сантиметрах. Запишіть обидві можливі відповіді через «;» — від меншої до більшої.","accept":["5; 9","9; 5"],"a":"Якщо P між M і N: MP = 7 − 2 = 5 см. Якщо N між M і P: MP = 7 + 2 = 9 см. Точка M між N і P бути не може (2 = 7 + MP — неможливо)."}]}},{"id":"G1.3.2","name":"Вимірювання кутів","status":"ready","programmeRef":"Вимірювання відрізків і кутів.","lesson":{"what":"Кути вимірюють у <b>градусах<\/b> за допомогою <b>транспортира<\/b>. 1° — це 1/180 частина розгорнутого кута. Скільки градусів уміщується в куті — це його <b>градусна міра<\/b>.","ideas":["Кожний кут має градусну міру, більшу за 0°. Розгорнутий кут дорівнює 180°.","Як міряти: центр транспортира — у вершину кута; нульова позначка шкали — на одній стороні; число читаємо там, де шкалу перетинає друга сторона, <b>на тій самій шкалі<\/b>, що починається з нуля.","На транспортирі дві шкали (зовнішня і внутрішня). Звіряйтеся з видом кута: гострий кут не може мати 140°.","Якщо промінь OC проходить між сторонами ∠AOB, то ∠AOB = ∠AOC + ∠COB.","Від будь-якого променя в заданий бік від нього можна відкласти кут заданої градусної міри, меншої за 180°, і тільки один."],"rules":[{"f":"∠AOB = ∠AOC + ∠COB, якщо промінь OC проходить між сторонами ∠AOB","means":"Градусна міра кута дорівнює сумі градусних мір кутів, на які його ділить промінь, що проходить між сторонами."},{"f":"Розгорнутий кут = 180°","means":"1° — це 1/180 частина розгорнутого кута."}],"examples":[{"task":"Промінь OC проходить між сторонами ∠AOB, ∠AOC = 25°, ∠COB = 47°. Знайдіть ∠AOB. Накресліть кут і промінь OC.","steps":[{"do":"Дано: OC між сторонами ∠AOB, ∠AOC = 25°, ∠COB = 47°. Знайти: ∠AOB.","why":"Записуємо умову."},{"do":"∠AOB = ∠AOC + ∠COB.","why":"Бо градусна міра кута дорівнює сумі кутів, на які його ділить промінь між сторонами."},{"do":"∠AOB = 25° + 47° = 72°.","why":"Додаємо градусні міри."}],"answer":"Відповідь: ∠AOB = 72°."},{"task":"Учень приклав транспортир до ∠AOB: центр — у вершині O, сторона OA проходить через нуль внутрішньої шкали. Сторона OB перетинає дугу там, де на внутрішній шкалі 35, а на зовнішній — 145. На малюнку кут гострий. Скільки градусів у ∠AOB?","steps":[{"do":"Центр транспортира у вершині, нуль шкали — на стороні OA: прикладено правильно.","why":"Так вимірюють кут транспортиром."},{"do":"Читаємо ту шкалу, на якій нуль лежить на OA, — внутрішню: 35°.","why":"Число беремо зі шкали, що починається з нуля на стороні кута."},{"do":"Перевірка: кут гострий, 35° < 90° — збігається; 145° був би тупим. До того ж 35° + 145° = 180°: дві шкали «доповнюють» одна одну.","why":"Класифікація кутів допомагає помітити неправильну шкалу."}],"answer":"Відповідь: ∠AOB = 35°."},{"task":"∠AOB = 80°, ∠BOC = 30°. Знайдіть ∠AOC. Розгляньте всі можливі випадки і накресліть у зошиті кожен.","steps":[{"do":"Дано: ∠AOB = 80°, ∠BOC = 30°. Знайти: ∠AOC. Невідомо, як розміщені промені, тому розглядаємо випадки.","why":"Промінь OC може лежати всередині ∠AOB або поза ним."},{"do":"Випадок 1: OC проходить між сторонами ∠AOB. Тоді ∠AOB = ∠AOC + ∠COB: 80° = ∠AOC + 30°, ∠AOC = 80° − 30° = 50°.","why":"Кут дорівнює сумі кутів, на які його ділить промінь між сторонами."},{"do":"Випадок 2: OB проходить між сторонами ∠AOC. Тоді ∠AOC = ∠AOB + ∠BOC = 80° + 30° = 110°.","why":"Та сама властивість для кута AOC."},{"do":"Випадок 3: OA між сторонами ∠BOC. Тоді 30° = 80° + ∠AOC — неможливо.","why":"Частина кута не може бути більшою за весь кут."}],"answer":"Відповідь: ∠AOC = 50° (якщо OC між OA і OB) або ∠AOC = 110° (якщо OB між OA і OC)."}],"mistakes":["Читати число не з тієї шкали транспортира (140° замість 40°). Перевіряйте: гострий кут менший за 90°.","Ставити центр транспортира не у вершину кута або
