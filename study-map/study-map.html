/* Перевірка введеної відповіді: однаково записані відповіді збігаються, а числа порівнюються як числа
   («x = 65», «65 грн» і «65» — те саме; «2,5» = «2.5»; «−2» = «-2»). */
function normAns(x) {
  // Пробіл між двома буквами значущий («не знаю» ≠ «незнаю»); решту пробілів ігноруємо («x = 65» = «x=65»).
  let v = String(x == null ? "" : x).normalize("NFD").replace(/\u0301/g, "").normalize("NFC").trim().toLowerCase()
    .replace(/[’ʼ‘`´]/g, "'").replace(/\s+/g, " ")
    .replace(/[−–—‐‑]/g, "-").replace(/,/g, ".").replace(/[×*]/g, "·");
  v = v.replace(/(^|[^\p{L}]) | (?=[^\p{L}]|$)/gu, "$1");
  return v.replace(/\.$/, "");
}
function numAns(x) {
  let v = normAns(x).replace(/^\p{L}+=/u, "").replace(/[\p{L}°%]+$/u, "");
  let m = v.match(/^([+-]?(?:\d+(?:\.\d+)?|\.\d+))$/);
  if (m) return Number(m[1]);
  m = v.match(/^([+-]?\d+(?:\.\d+)?)\/(\d+(?:\.\d+)?)$/);
  if (m && +m[2] !== 0) return Number(m[1]) / Number(m[2]);
  return null;
}
function isAccepted(c, input) {
  const ni = normAns(input), xi = numAns(input);
  if (!ni) return false;
  return c.accept.some(a => normAns(a) === ni || (xi !== null && numAns(a) !== null && Math.abs(numAns(a) - xi) < 1e-9));
}
function checkHtml(c, i) {
  const stored = progress.checks[c.id], u = ui.chk[c.id];
  const head = `${c.fig ? renderFig(c.fig) : ""}<p class="q">${i + 1}. ${rich(c.q)}</p>`;
  const explain = `<p class="a"><b>Пояснення:</b> ${rich(c.a)}</p>`;
  const again = `<div class="row"><button class="btn ghost" type="button" data-act="chk-again" data-id="${c.id}" data-k="again-${c.id}">Спробувати ще раз</button></div>`;
  // Уже відповідали раніше (або щойно): показати результат і пояснення.
  if ((!u && stored) || (u && u.phase === "done")) {
    const res = u ? u.result : stored;
    const msg = u ? u.msg : (stored === "know" ? "Минулого разу: правильно з першої спроби ✓" : "Минулого разу: ще треба повторити.");
    const opts = c.options ? `<div class="opts">${c.options.map((o, j) => `<button class="opt${j === c.correct ? " right" : u && u.wrong.includes(j) ? " wrong" : ""}" type="button" disabled>${"АБВГ"[j]}) ${rich(o)}</button>`).join("")}</div>` : "";
    return `<div class="check" data-check="${c.id}">${head}${opts}
      <p class="res ${res}" role="status">${esc(msg)}</p>${explain}${again}</div>`;
  }
  const st = u || { phase: "fresh", value: "", wrong: [] };
  const retryMsg = st.phase === "retry" ? `<p class="res not-yet" role="status">Не зовсім. Спробуй ще раз.</p>` : "";
  const giveUp = st.phase === "retry" ? `<button class="btn ghost" type="button" data-act="chk-show" data-id="${c.id}" data-k="show-${c.id}">Показати відповідь</button>` : "";
  if (c.options) {
    return `<div class="check" data-check="${c.id}">${head}
      <div class="opts" role="group" aria-label="Варіанти відповіді">${c.options.map((o, j) => `<button class="opt${st.wrong.includes(j) ? " wrong" : ""}" type="button" data-act="chk-opt" data-id="${c.id}" data-i="${j}" data-k="opt-${c.id}-${j}"${st.wrong.includes(j) ? " disabled" : ""}>${"АБВГ"[j]}) ${rich(o)}</button>`).join("")}</div>
      ${retryMsg}${giveUp ? `<div class="row">${giveUp}</div>` : ""}</div>`;
  }
  return `<div class="check" data-check="${c.id}">${head}
    <div class="row ans-row"><label class="sr" for="in-${c.id}">Твоя відповідь</label>
      <input class="chk-in" id="in-${c.id}" data-id="${c.id}" data-k="in-${c.id}" type="text" inputmode="text" autocomplete="off" spellcheck="false" placeholder="Твоя відповідь" value="${esc(st.value)}">
      <button class="btn" type="button" data-act="chk-submit" data-id="${c.id}" data-k="submit-${c.id}">Перевірити</button>${giveUp}</div>
    ${retryMsg}</div>`;
}
function findCheck(id) { const st = SUB[id.replace(/-\d+$/, "")]; return st ? st.checks.find(c => c.id === id) : null; }
function answerCheck(id, right, extra) {
  const c = findCheck(id); if (!c) return;
  const u = ui.chk[id] || (ui.chk[id] = { phase: "fresh", value: "", wrong: [] });
  if (extra && extra.value != null) u.value = extra.value;
  let result = null, msg = "";
  if (right && u.phase === "fresh") { result = "know"; msg = "Правильно!"; }
  else if (right) { result = "not-yet"; msg = "Правильно з другої спроби. Глянь пояснення, щоб наступного разу вийшло одразу."; }
  else if (u.phase === "fresh") { u.phase = "retry"; if (extra && extra.opt != null) u.wrong.push(extra.opt); }
  else { result = "not-yet"; msg = "Не зовсім. Ось правильна відповідь і пояснення — нічого страшного, повториш."; if (extra && extra.opt != null) u.wrong.push(extra.opt); }
  if (result) { u.phase = "done"; u.result = result; u.msg = msg; record({ checks: { [id]: result } }); }
}
function practiceLine(st, p) {
  const who = esc(st.subject.tutor || "репетитор");
  if (!p) return dbState === "local" ? `Тут з'являться результати задач, які дасть ${who}, коли карту відкрито як твою особисту сторінку з чату.` : `Поки задач на цю тему не було. Попроси їх нижче — результат з'явиться тут.`;
  const pct = Math.round(p.correct / p.answered * 100);
  return `Правильно <b>${p.correct} з ${p.answered}</b> (${pct}%)${p.last ? `, востаннє ${esc(fmtDate(p.last))}` : ""}. `
    + (isMastered(p) ? "Це вже опановано на практиці. Чудово!" : "Тему вважаємо опанованою, коли правильно хоча б 8 з 10 (і розв'язано щонайменше 3 задачі).");
}

        <div class="meter"><div class="lbl"><span>Опановано на практиці</span><b>${a.mastered} з ${a.ready}</b></div>${bar(Math.round(a.mastered / a.ready * 100), "var(--good)")}</div>
      </div>

      : `<p class="note">Уроки з цього предмета ще готуються.</p>`}
      <p style="margin-top:12px"><b>Зараз у школі:</b> ${cur ? `${esc(cur.id)} ${rich(cur.name)}` : "репетитор ще не позначив тему."}</p>
      ${byTopic.length ? `<h3 style="margin-top:14px">Точність у задачах за темами</h3>
        <table class="acc"><thead><tr><th>Тема</th><th>Правильно</th><th class="barcol"><span class="sr">Шкала</span></th></tr></thead><tbody>
        ${byTopic.map(([t, cor, ans]) => { const pct = Math.round(cor / ans * 100); return `<tr><td>${rich(t.name)}</td><td class="num">${cor} з ${ans} · <b style="color:${tone(pct)}">${pct}%</b> <span class="note">${word(pct)}</span></td><td class="barcol">${bar(pct, tone(pct))}</td></tr>`; }).join("")}
        </tbody></table>` : `<p class="note" style="margin-top:8px">${dbState === "local" ? "Результати задач з репетитором видно, коли карту відкрито як особисту сторінку учня з чату." : "Задач з репетитором ще не було."}</p>`}
      ${weak.length ? `<h3 style="margin-top:14px">Що варто підтягнути</h3><ul class="weak">${weak.map(([st, p]) => `<li>${rich(st.name)} — правильно ${p.correct} з ${p.answered}</li>`).join("")}</ul>` : ""}
    </section>`;
  }).join("");
  return `<section class="par-head"><h2>Як ідуть справи</h2>
      <p class="note" style="margin-top:4px">${last ? `Остання активність: ${esc(fmtDate(last))}.` : "Поки що жодної позначки: уроки ще не відкривали."}</p></section>
    <div class="subj-cards">${cards}</div>
    <section class="card"><h3>Як допомогти</h3><ul class="tips">
      <li>Попросіть дитину пояснити Вам одну підтему своїми словами. Пояснити іншому — найкращий спосіб запам'ятати.</li>
      <li>Короткі заняття часто (15–20 хвилин кілька разів на тиждень) дають більше, ніж одне довге.</li>
      <li>Хваліть за старання й за чесне «Ще ні» в самоперевірці — так видно, що повторити.</li>
      <li>Якщо тема «варто підтягнути», не сваріть: у кожному уроці є готовий запит, щоб попросити в репетитора ще задач.</li>
      <li>Не розв'язуйте задачі замість дитини. Краще спитайте: «З чого ти почнеш?»</li>
    </ul><p class="note" style="margin-top:10px">Відсотки тут — з карти й задач з репетитором. Це не шкільна оцінка.</p></section>`;
}

/* ---------- Малювання ---------- */
function render(opts) {
  opts = opts || {};
  const main = $("main");
  const ae = document.activeElement, key = ae && ae.closest && ae.closest("[data-k]") && ae.dataset.k;
  renderHeader();
  let html;
  if (!DATA.subjects.length) html = emptyHtml("Карта ще наповнюється…", "Тут з'являться предмети, теми й короткі уроки. Зазирни трохи згодом — або вже зараз поговори з репетитором у чаті.");
  else if (ui.view === "parents") html = parentsHtml();
  else if (ui.view === "lesson" && SUB[ui.lesson] && SUB[ui.lesson].ready) html = lessonHtml(SUB[ui.lesson]);
  else { ui.view = "map"; autoOpen(); html = subjectHtml(SUBJ[ui.subject]); }
  main.innerHTML = html;
  paintStatus();
  if (opts.focus) { const el = document.querySelector(opts.focus); if (el) { el.focus({ preventScroll: !!opts.noScroll }); if (el.tagName === "INPUT") { try { el.setSelectionRange(el.value.length, el.value.length); } catch (e) {} } if (!opts.noScroll && el.scrollIntoView) el.scrollIntoView({ block: opts.block || "nearest" }); } }
  else if (key && document.activeElement === document.body) { const el = document.querySelector(`[data-k="${key}"]`); if (el) el.focus({ preventScroll: true }); }
}

function openLesson(id) {
  const st = SUB[id];
  if (!st || !st.ready) return;
  ui.subject = st.subject.id; ui.view = "lesson"; ui.lesson = id; ui.copied = null;
  ui.open.add(st.section.id); ui.open.add(st.topic.id);
  saveUi();
  render({ focus: "#lesson-title", noScroll: true });
  window.scrollTo(0, 0);
}
function backToMap() {
  const from = ui.lesson; ui.view = "map"; ui.lesson = null;
  render({ focus: from ? `[data-k="s-${from}"]` : "#main", block: "center" });
}

document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]");
  if (!b) return;
  const act = b.dataset.act, id = b.dataset.id;
  if (act === "tab") { ui.subject = id; ui.view = "map"; ui.lesson = null; saveUi(); render({ focus: `#tab-${id}`, noScroll: true }); }
  else if (act === "toggle") {
    ui.openTouched = true;
    if (ui.open.has(id)) ui.open.delete(id); else ui.open.add(id);
    saveUi(); render({ focus: `[data-k="h-${id}"]`, noScroll: true });
  }
  else if (act === "goto-topic") {
    const t = TOP[id]; if (!t) return;
    ui.open.add(t.section.id); ui.open.add(t.id); ui.openTouched = true; saveUi();
    render({ focus: `[data-k="h-${id}"]`, block: "center" });
  }
  else if (act === "open") openLesson(id);
  else if (act === "back") backToMap();
  else if (act === "step" || act === "steps-all" || act === "steps-reset") {
    const k = +b.dataset.ex, key = `${id}#${k}`, n = ((SUB[id].examples[k] || {}).steps || []).length;
    ui.steps[key] = act === "step" ? Math.min(n, (ui.steps[key] || 0) + 1) : act === "steps-all" ? n : 0;
    render({ focus: ui.steps[key] >= n ? `[data-k="steps-reset-${k}"]` : `[data-k="step-${k}"]`, noScroll: true });
  }
  else if (act === "chk-opt") { const c = findCheck(id), j = +b.dataset.i; answerCheck(id, j === c.correct, { opt: j }); focusCheck(id); }
  else if (act === "chk-submit") submitInput(id);
  else if (act === "chk-show") { const u = ui.chk[id]; if (u) { u.phase = "done"; u.result = "not-yet"; u.msg = "Ось правильна відповідь і пояснення. Спробуй потім ще раз."; record({ checks: { [id]: "not-yet" } }); } focusCheck(id); }
  else if (act === "chk-again") { ui.chk[id] = { phase: "fresh", value: "", wrong: [] }; focusCheck(id); }
  else if (act === "read") { record({ read: { [id]: !progress.read[id] } }); render({ focus: `[data-k="read"]`, noScroll: true }); }
  else if (act === "copy") copyAsk(b);
});
function focusCheck(id) {
  const u = ui.chk[id], c = findCheck(id);
  let sel = `[data-k="again-${id}"]`;
  if (u && u.phase !== "done") sel = c && c.options ? `[data-check="${id}"] .opt:not([disabled])` : `[data-k="in-${id}"]`;
  render({ focus: sel, noScroll: true });
}
function submitInput(id) {
  const inp = document.getElementById("in-" + id), c = findCheck(id);
  if (!inp || !c) return;
  const v = inp.value;
  if (!v.trim()) { inp.focus(); return; }
  answerCheck(id, isAccepted(c, v), { value: v });
  focusCheck(id);
}
document.addEventListener("keydown", e => {
  if (e.key === "Enter" && e.target.classList && e.target.classList.contains("chk-in")) { e.preventDefault(); submitInput(e.target.dataset.id); }
});
document.addEventListener("input", e => {
  if (e.target.classList && e.target.classList.contains("chk-in")) { const id = e.target.dataset.id; (ui.chk[id] = ui.chk[id] || { phase: "fresh", value: "", wrong: [] }).value = e.target.value; }
});
$("parents-toggle").addEventListener("click", () => {
  ui.view = ui.view === "parents" ? "map" : "parents";
  render({ focus: "#parents-toggle", noScroll: true });
  window.scrollTo(0, 0);
});
// Стрілки ліворуч/праворуч, Home, End — між вкладками предметів.
$("tabs").addEventListener("keydown", e => {
  const ids = DATA.subjects.map(s => s.id), i = ids.indexOf(ui.subject);
  let j = null;
  if (e.key === "ArrowRight") j = (i + 1) % ids.length; else if (e.key === "ArrowLeft") j = (i - 1 + ids.length) % ids.length;
  else if (e.key === "Home") j = 0; else if (e.key === "End") j = ids.length - 1;
  if (j === null) return;
  e.preventDefault();
  ui.subject = ids[j]; ui.view = "map"; ui.lesson = null; saveUi();
  render({ focus: `#tab-${ids[j]}`, noScroll: true });
});
function copyAsk(btn) {
  const ta = $("ask-text"), note = $("copy-note"), id = ui.lesson;
  const ok = () => { ui.copied = id; btn.textContent = "Скопійовано ✓"; note.textContent = "Тепер встав у чат з репетитором."; };
  const fallback = () => {
    ta.focus(); ta.select();
    let done = false;
    try { done = document.execCommand("copy"); } catch (e) {}
    if (done) ok(); else note.textContent = "Текст виділено — натисни Ctrl+C (або «Копіювати» на телефоні).";
  };
  try { navigator.clipboard.writeText(ta.value).then(ok, fallback); } catch (e) { fallback(); }
}

/* ---------- Спільна база (коли карта — особиста опублікована сторінка учня) ---------- */
let retries = 0;
function watch(path, onData) {
  let unsub = null;
  const start = () => {
    try {
      unsub = db.doc(path).onSnapshot(snap => onData(snap.exists ? (snap.data() || {}) : null), err => {
        if (err && err.code === "unavailable" && retries < 5) { retries++; setTimeout(start, 4000 * retries); }
      });
    } catch (e) {}
  };
  start();
}
let softPending = false;
function rerenderSoft() {
  // Поки учень друкує відповідь, не перебудовуємо сторінку: оновимося, коли поле втратить фокус.
  const ae = document.activeElement;
  if (ae && ae.classList && ae.classList.contains("chk-in")) { softPending = true; return; }
  softPending = false; render();
}
document.addEventListener("focusout", e => {
  if (softPending && e.target.classList && e.target.classList.contains("chk-in")) setTimeout(() => { if (softPending) rerenderSoft(); }, 0);
});
async function connect() {
  const c = window.claude;
  if (!c || typeof c.use !== "function") return;
  let handle = null;
  try { handle = await c.use("db"); } catch (e) { handle = null; }
  if (!handle) return;
  db = handle; dbState = "live"; paintStatus();
  try {
    const snap = await db.doc("learner/progress").get();
    if (snap.exists) {
      remoteExists = true;
      const remote = normProgress(clone(snap.data()));
      // Позначки, зроблені в цьому браузері, поки бази не було, доливаємо одним записом (база перемагає в суперечках).
      const extra = {};
      ["read", "checks"].forEach(k => Object.keys(progress[k]).forEach(id => { if (!(id in remote[k])) { extra[k] = extra[k] || {}; extra[k][id] = progress[k][id]; } }));
      applyRemoteProgress(remote);
      if (Object.keys(extra).length) record(extra);
    } else if (Object.keys(progress.read).length || Object.keys(progress.checks).length) {
      record({});
    }
  } catch (e) {
    if (e && (e.code === "revoked" || e.code === "not_granted" || e.code === "capability_disabled" || e.code === "capability_removed")) { db = null; dbState = "local"; paintStatus(); return; }
  }
  render();
  watch("learner/progress", d => { if (d) { remoteExists = true; if (applyRemoteProgress(d)) rerenderSoft(); } });
  watch("learner/practice", d => {
    const next = d && isObj(d.subtopics) ? clone(d.subtopics) : {};
    if (JSON.stringify(next) !== JSON.stringify(practice)) { practice = next; rerenderSoft(); }
  });
  watch("learner/plan", d => {
    const next = { name: d && typeof d.name === "string" ? d.name.trim() : "",
      current: d && isObj(d.current) && d.current.topic ? { subject: String(d.current.subject || (TOP[d.current.topic] ? TOP[d.current.topic].subject.id : "")), topic: String(d.current.topic) } : null,
      next: d && Array.isArray(d.next) ? d.next.map(String) : [] };
    if (JSON.stringify(next) !== JSON.stringify(plan)) { plan = next; rerenderSoft(); }
  });
}

render();
connect();
</script>
</body>
</html>
