"інфінітив, особова форма, дієприкметник, дієприслівник."},{"task":"Пастка. Встав пропущене: <i>Він хоче навч..ся плавати. Він швидко навч..ся.<\/i>","steps":[{"do":"Перше речення: хоче <i>що зробити?<\/i>","why":"Питання інфінітива, отже пишемо <i>-тися<\/i>: <i>навчитися<\/i>."},{"do":"Друге речення: він <i>що зробить?<\/i>","why":"Питання 3-ї особи, отже пишемо <i>-ться<\/i>: <i>навчиться<\/i>."}],"answer":"<i>Він хоче навчитися плавати. Він швидко навчиться.<\/i>"}],"mistakes":["<i>Я люблю вчиться<\/i> — помилка. Тут потрібен інфінітив (що робити?): <i>Я люблю вчитися<\/i>.","Вважають <i>-ти<\/i> закінченням. Ні: інфінітив не змінюється, тому закінчення не має, а <i>-ти<\/i> — суфікс.","Плутають інфінітив з іменником: <i>плавання<\/i> — іменник (що?), <i>плавати<\/i> — дієслово (що робити?)."],"check":[{"q":"Напиши неозначену форму дієслова <i>несемо<\/i>.","accept":["нести"],"a":"<i>нести<\/i>: питання <i>що робити?<\/i>, суфікс <i>-ти<\/i>."},{"q":"Пастка: яке речення написано правильно?","options":["Завтра ми будемо вчиться в новому класі.","Завтра ми будемо вчитися в новому класі.","Завтра ми будемо вчитця в новому класі."],"correct":1,"a":"<i>будемо що робити?<\/i> — <i>вчитися<\/i>, інфінітив на <i>-тися<\/i>. Форма <i>вчиться<\/i> відповідає на питання <i>що робить?<\/i>"},{"q":"Друг пише: <i>Підемо після уроків кататися на велосипедах?<\/i> Яка форма дієслова <i>кататися<\/i>?","options":["інфінітив","особова форма","дієприслівник"],"correct":0,"a":"<i>кататися<\/i> — що робити? Це інфінітив: суфікс <i>-ти<\/i> і постфікс <i>-ся<\/i>, немає ні часу, ні особи."}]}},{"id":"U2.1.3","name":"Вид дієслів","status":"ready","programmeRef":"Вид дієслів (доконаний, недоконаний).","lesson":{"what":"<b>Вид<\/b> показує, чи дія доведена до кінця. Дієслова <b>недоконаного виду<\/b> відповідають на питання <i>що робити?<\/i> і називають дію як процес (<i>писати<\/i>). Дієслова <b>доконаного виду<\/b> відповідають на питання <i>що зробити?<\/i> і називають дію, що має результат (<i>написати<\/i>).","ideas":["<b>Видова пара<\/b> — два дієслова з однаковим значенням, але різного виду: <i>робити — зробити, читати — прочитати, вирішувати — вирішити<\/i>.","Доконаний вид часто утворюється за допомогою префікса (<i>писати — написати<\/i>), недоконаний — за допомогою суфікса (<i>вирішити — вирішувати<\/i>). Буває, що пару утворюють різні слова: <i>брати — взяти<\/i>.","Дієслова недоконаного виду мають три часи: <i>пишу, писав, писатиму<\/i>. Доконаного — лише два: минулий (<i>написав<\/i>) і майбутній (<i>напишу<\/i>); теперішнього часу в них немає.","Вид визначаємо за питанням до інфінітива: <i>прочитали<\/i> → <i>прочитати<\/i> → що зробити? → доконаний."],"rules":[{"f":"що робити? — недоконаний; що зробити? — доконаний","means":"<i>малювати<\/i> (що робити?) — недоконаний вид; <i>намалювати<\/i> (що зробити?) — доконаний."}],"examples":[{"task":"Визнач вид дієслів: <i>будувати, побудувати, стрибнути<\/i>.","steps":[{"do":"<i>будувати<\/i> — що робити?","why":"Питання недоконаного виду: дія як процес."},{"do":"<i>побудувати<\/i> — що зробити?","why":"Питання доконаного виду: є результат."},{"do":"<i>стрибнути<\/i> — що зробити?","why":"Одна завершена дія — доконаний вид."}],"answer":"<i>будувати<\/i> — недоконаний вид; <i>побудувати, стрибнути<\/i> — доконаний."},{"task":"Добери видові пари: <i>вчити, відповісти, давати<\/i>.","steps":[{"do":"<i>вчити<\/i> (що робити?) → <i>вивчити<\/i> (що зробити?)","why":"Доконаний вид утворили префіксом <i>ви-<\/i>."},{"do":"<i>відповісти<\/i> (що зробити?) → <i>відповідати<\/i> (що робити?)","why":"Недоконаний вид утворили суфіксом."},{"do":"<i>давати<\/i> (що робити?) → <i>дати<\/i> (що зробити?)","why":"Пара відрізняється суфіксом <i>-ва-<\/i>."}],"answer":"<i>вчити — вивчити, відповісти — відповідати, давати — дати<\/i>."},{"task":"Пастка. Визнач вид і час дієслова <i>прочитаю<\/i>.","steps":[{"do":"Інфінітив — <i>прочитати<\/i>: що зробити?","why":"Отже, вид доконаний."},{"do":"<i>прочитаю<\/i> — дія відбудеться після того, як я це скажу.","why":"Це майбутній час."},{"do":"Перевірка: теперішнього часу в доконаного виду не буває.","why":"Тому <i>прочитаю<\/i> не може бути теперішнім часом, хоч і схоже на <i>читаю<\/i>."}],"answer":"доконаний вид, майбутній час."}],"mistakes":["Думають, що <i>напишу<\/i> — теперішній час. Ні: доконаний вид не має теперішнього часу, <i>напишу<\/i> — майбутній.","Визначають вид за префіксом: «є префікс — отже, доконаний». Але <i>розповідати, виконувати<\/i> мають префікс і все одно недоконаного виду (що робити?). Перевіряй питанням."],"check":[{"q":"Пастка: якого виду дієслово <i>виконувати<\/i>?","options":["доконаного","недоконаного"],"correct":1,"a":"<i>виконувати<\/i> — що робити? Недоконаний вид, хоч у слові є префікс <i>ви-<\/i>. Його пара доконаного виду — <i>виконати<\/i>."},{"q":"Напиши дієслово доконаного виду, яке утворює видову пару з дієсловом <i>брати<\/i>.","accept":["взяти"],"a":"<i>брати<\/i> (що робити?) — <i>взяти<\/i> (що зробити?). Цю пару утворюють різні слова."},{"q":"Тато залишив записку: <i>Купи, будь ласка, хліб і молоко.<\/i> Якого виду дієслово <i>купи<\/i>?","options":["доконаного","недоконаного"],"correct":0,"a":"<i>купи<\/i> — від <i>купити<\/i> (що зробити?), тому вид доконаний. Пара недоконаного виду — <i>купувати<\/i>."}]}},{"id":"U2.1.4","name":"Особові та безособові дієслова","status":"ready","programmeRef":"Безособові дієслова.","lesson":{"what":"<b>Особові дієслова<\/b> називають дію, яку виконує певна особа чи предмет, і можуть мати при собі підмет: <i>я читаю, сонце світить<\/i>. <b>Безособові дієслова<\/b> називають дію чи стан, що відбуваються самі собою, без діяча: <i>світає, вечоріє<\/i>. Підмета при них немає й бути не може.","ideas":["<b>Особа<\/b> показує, хто виконує дію: 1-а — мовець (<i>я, ми<\/i>), 2-а — співрозмовник (<i>ти, ви<\/i>), 3-я — той, про кого говорять (<i>він, вона, воно, вони<\/i>).","Особові форми мають дієслова теперішнього й майбутнього часу та наказового способу: <i>граю, граєш, гратимемо, грай<\/i>.","Безособові дієслова мають форму 3-ї особи однини (<i>світає, смеркає<\/i>), а в минулому часі — форму середнього роду (<i>світало, похолодало<\/i>).","Безособові дієслова часто називають явища природи (<i>вечоріє, похолодало<\/i>) і стан людини (<i>мені не спиться, нам щастить<\/i>)."],"rules":[{"f":"безособове дієслово = підмета немає й не може бути","means":"Перевірка: спробуй поставити підмет. <i>Сонце світить<\/i> — підмет є, дієслово особове. <i>Світає<\/i> — підмет поставити неможливо, дієслово безособове."}],"examples":[{"task":"Визнач особу й число дієслів: <i>малюю, граєте, біжить<\/i>.","steps":[{"do":"<i>малюю<\/i> — <i>я<\/i>","why":"1-а особа однини: дію виконує мовець."},{"do":"<i>граєте<\/i> — <i>ви<\/i>","why":"2-а особа множини."},{"do":"<i>біжить<\/i> — <i>він (вона, воно)<\/i>","why":"3-я особа однини."}],"answer":"<i>малюю<\/i> — 1-а особа, однина; <i>граєте<\/i> — 2-а особа, множина; <i>біжить<\/i> — 3-я особа, однина."},{"task":"Які дієслова безособові: <i>світає, гуляє, вечоріє, співає<\/i>?","steps":[{"do":"<i>гуляє, співає<\/i> — можна сказати <i>хлопчик гуляє, пташка співає<\/i>.","why":"Є діяч, тобто підмет: дієслова особові."},{"do":"<i>світає, вечоріє<\/i> — підмет поставити неможливо.","why":"Дія відбувається сама собою: дієслова безособові."}],"answer":"безособові — <i>світає, вечоріє<\/i>."},{"task":"Знайди безособове дієслово й поясни: <i>Уже смеркало, і на небі засвітилися зорі.<\/i>","steps":[{"do":"<i>засвітилися<\/i> — що зробили? Хто? — <i>зорі<\/i>.","why":"Є підмет, отже дієслово особове."},{"do":"<i>смеркало<\/i> — підмета немає й поставити його не можна.","why":"Це безособове дієслово."},{"do":"Форма <i>смеркало<\/i> — середнього роду.","why":"Безособові дієслова в минулому часі мають форму середнього роду."}],"answer":"<i>смеркало<\/i> — безособове дієслово; <i>засвітилися<\/i> — особове."}],"mistakes":["Шукають підмет у реченні з безособовим дієсловом. У реченні <i>Вечоріє<\/i> підмета немає, і це не помилка.","Ставлять безособове дієслово в чоловічий рід: <i>Уже світав<\/i>. Правильно: <i>Уже світало<\/i> — у минулому часі безособові дієслова мають форму середнього роду.","Плутають особові дієслова 3-ї особи з безособовими: у реченні <i>Дощ іде<\/i> є підмет <i>дощ<\/i>, тому <i>іде<\/i> — особове дієслово."],"check":[{"q":"Пастка: яке дієслово безособове?","options":["світить","світиться","світає"],"correct":2,"a":"<i>світає<\/i> — підмета не можна поставити. А <i>сонце світить<\/i>, <i>вікно світиться<\/i> — підмет є, ці дієслова особові."},{"q":"Утвори від дієслова <i>смеркати<\/i> форму минулого часу для речення <i>Уже …<\/i> Напиши одне слово.","accept":["смеркало"],"a":"<i>Уже смеркало.<\/i> Безособове дієслово в минулому часі має форму середнього роду: <i>-ло<\/i>."},{"q":"Іра пише подрузі: <i>Мені так не спиться перед змаганнями!<\/i> Яке тут дієслово <i>не спиться<\/i>?","options":["безособове: підмета немає й не може бути","особове: підмет — <i>мені<\/i>"],"correct":0,"a":"<i>Мені<\/i> — не підмет, а додаток (кому?). Підмета в цьому реченні немає, тому <i>не спиться<\/i> — безособове."}]}}]},{"id":"U2.2","name":"Часи дієслова","what":"Теперішній, минулий і майбутній час.","subtopics":[{"id":"U2.2.1","name":"Теперішній час. -ться, -шся","status":"ready","programmeRef":"Теперішній час дієслів (змінювання за особами та числами).","lesson":{"what":"<b>Теперішній час<\/b> означає дію, яка відбувається зараз або постійно: <i>Я читаю. Земля обертається навколо Сонця.<\/i> Дієслова теперішнього часу змінюються за <b>особами<\/b> й <b>числами<\/b>.","ideas":["Теперішній час мають лише дієслова недоконаного виду: <i>пишу<\/i> (від <i>писати<\/i>). <i>Напишу<\/i> — це вже майбутній час.","Шість форм: <i>я граю, ти граєш, він грає, ми граємо, ви граєте, вони грають<\/i>.","У зворотних дієсловах 3-ї особи (<i>він, вона, воно, вони<\/i>) пишемо <b>-ться<\/b>: <i>учиться, сміються<\/i>; у 2-й особі однини (<i>ти<\/i>) — <b>-шся<\/b>: <i>учишся, смієшся<\/i>.","Вимовляємо інакше, ніж пишемо: <i>-ться<\/i> звучить як довгий м’який [ц’:а], а <i>-шся<\/i> — як довгий м’який [с’:а]: <i>учиться<\/i> [учиц’:а], <i>учишся<\/i> [учис’:а]."],"rules":[{"f":"він, вона, воно, вони → -ться","means":"<i>він умивається, вони вмиваються<\/i>. Пишемо <i>-ться<\/i>, хоча чуємо [ц’:а]."},{"f":"ти → -шся","means":"<i>ти вмиваєшся, ти смієшся<\/i>. Після <i>ш<\/i> м’якого знака не пишемо: <i>-шся<\/i>, а не «-шься»."}],"examples":[{"task":"Зміни дієслово <i>читати<\/i> за особами й числами в теперішньому часі.","steps":[{"do":"Однина: <i>я читаю, ти читаєш, він (вона, воно) читає<\/i>.","why":"1-а, 2-а і 3-я особа однини."},{"do":"Множина: <i>ми читаємо, ви читаєте, вони читають<\/i>.","why":"1-а, 2-а і 3-я особа множини."}],"answer":"<i>читаю, читаєш, читає, читаємо, читаєте, читають<\/i>."},{"task":"Утвори потрібні форми дієслова <i>готуватися<\/i>: <i>Сестра … до олімпіади. А ти …?<\/i>","steps":[{"do":"Сестра (вона) — що робить? → <i>готується<\/i>","why":"3-я особа однини: пишемо <i>-ться<\/i>."},{"do":"Ти — що робиш? → <i>готуєшся<\/i>","why":"2-а особа однини: пишемо <i>-шся<\/i> без м’якого знака."}],"answer":"<i>Сестра готується до олімпіади. А ти готуєшся?<\/i>"},{"task":"Виправ помилки в повідомленні: <i>Ти не боїшься темряви? А Петрик боїтся.<\/i>","steps":[{"do":"<i>боїшься<\/i> → <i>боїшся<\/i>","why":"2-а особа однини: <i>-шся<\/i>, м’якого знака після <i>ш<\/i> немає."},{"do":"<i>боїтся<\/i> → <i>боїться<\/i>","why":"3-я особа однини: <i>-ться<\/i> з м’яким знаком."}],"answer":"<i>Ти не боїшся темряви? А Петрик боїться.<\/i>"}],"mistakes":["Пишуть так, як чують: <i>смієцця, вчисся<\/i>. Правильно: <i>сміється, вчишся<\/i>.","Ставлять м’який знак у 2-й особі: <i>ти вчишься<\/i>. Правильно: <i>ти вчишся<\/i>.","Плутають <i>-ться<\/i> і <i>-тися<\/i>: <i>Він любить купаться<\/i>. Правильно: <i>Він любить купатися<\/i> (що робити? — інфінітив), а <i>він купається<\/i> (що робить?)."],"check":[{"q":"Встав пропущене й напиши слово повністю: <i>Ти завжди так гарно сміє..ся!<\/i>","accept":["смієшся"],"a":"<i>смієшся<\/i>: 2-а особа однини (ти що робиш?) — <i>-шся<\/i> без м’якого знака."},{"q":"Пастка: як вимовляємо кінець слова <i>вчиться<\/i>?","options":["[т’с’а] — так, як пишемо","[с’:а] — довгий м’який [с’]","[ц’:а] — довгий м’який [ц’]"],"correct":2,"a":"<i>-ться<\/i> вимовляємо як довгий м’який [ц’:а]. Вимова [с’:а] — у формі <i>вчишся<\/i>."},{"q":"Яке повідомлення написано без помилок?","options":["Ти вже збираєшься на тренування?","Ти вже збираєшся на тренування?","Ти вже збираєсся на тренування?"],"correct":1,"a":"<i>збираєшся<\/i>: ти що робиш? — <i>-шся<\/i>, без м’якого знака. <i>-сся<\/i> — це вимова, а не написання."}]}},{"id":"U2.2.2","name":"Минулий час","status":"ready","programmeRef":"Минулий час дієслів (змінювання за родами та числами).","lesson":{"what":"<b>Минулий час<\/b> означає дію, яка відбувалася чи відбулася до того, як про неї говорять: <i>читав, прочитала<\/i>. Дієслова минулого часу змінюються не за особами, а за <b>родами<\/b> (в однині) і <b>числами<\/b>.","ideas":["Минулий час утворюємо від основи інфінітива: <i>писа-ти → писав, писала, писало, писали<\/i>.","Чоловічий рід має суфікс <i>-в<\/i>, жіночий, середній рід і множина — <i>-л-<\/i> із закінченням: <i>-ла, -ло, -ли<\/i>.","Якщо основа інфінітива закінчується на приголосний, у чоловічому роді суфікса <i>-в<\/i> немає, а <i>е, о<\/i> змінюються на <i>і<\/i>: <i>нести — ніс, несла<\/i>; <i>рости — ріс, росла<\/i>.","Особу в минулому часі показує займенник: <i>я читав, ти читав, він читав<\/i> — дієслово однакове.","У множині рід не розрізняємо: <i>хлопці читали, дівчата читали<\/i>."],"rules":[{"f":"він — -в; вона — -ла; воно — -ло; вони — -ли","means":"<i>малював, малювала, малювало, малювали<\/i>."}],"examples":[{"task":"Зміни за родами й числами дієслово <i>співати<\/i> в минулому часі.","steps":[{"do":"Основа інфінітива: <i>співа-<\/i>","why":"Відкидаємо суфікс <i>-ти<\/i>."},{"do":"Однина: <i>співав<\/i> (ч. р.), <i>співала<\/i> (ж. р.), <i>співало<\/i> (с. р.)","why":"Чоловічий рід — <i>-в<\/i>, жіночий — <i>-ла<\/i>, середній — <i>-ло<\/i>."},{"do":"Множина: <i>співали<\/i>","why":"У множині одна форма для всіх родів."}],"answer":"<i>співав, співала, співало, співали<\/i>."},{"task":"Утвори форми минулого часу від дієслів <i>нести<\/i> і <i>рости<\/i>.","steps":[{"do":"<i>нести<\/i>: основа <i>нес-<\/i> закінчується на приголосний.","why":"У чоловічому роді немає суфікса <i>-в<\/i>."},{"do":"<i>ніс, несла, несло, несли<\/i>","why":"У чоловічому роді <i>е<\/i> змінюється на <i>і<\/i>; в інших формах <i>е<\/i> залишається."},{"do":"<i>ріс, росла, росло, росли<\/i>","why":"Так само: <i>о<\/i> змінюється на <i>і<\/i> лише в чоловічому роді."}],"answer":"<i>ніс, несла, несло, несли<\/i>; <i>ріс, росла, росло, росли<\/i>."},{"task":"Визнач рід і число дієслів: <i>Сонце сховалося за хмару, і діти побігли додому.<\/i>","steps":[{"do":"<i>сховалося<\/i> — сонце (воно)","why":"Закінчення <i>-о<\/i> перед <i>-ся<\/i>: середній рід, однина."},{"do":"<i>побігли<\/i> — діти (вони)","why":"Множина; рід у множині не визначаємо."}],"answer":"<i>сховалося<\/i> — середній рід, однина; <i>побігли<\/i> — множина."}],"mistakes":["Переносять <i>і<\/i> з чоловічого роду в інші форми: <i>принісла<\/i>. Правильно: <i>принесла<\/i>; <i>і<\/i> буває лише в <i>приніс<\/i>.","Шукають особу в дієслові минулого часу. Її видно лише із займенника: <i>ти читала<\/i> і <i>вона читала<\/i> — та сама форма.","Визначають рід у множині: «<i>хлопці гуляли<\/i> — чоловічий рід». У множині рід не визначаємо."],"check":[{"q":"Утвори від дієслова <i>везти<\/i> форму для речення <i>Мама … нас до бабусі.<\/i> Напиши одне слово.","accept":["везла"],"a":"<i>везла<\/i>: жіночий рід, однина. <i>і<\/i> з’являється лише в чоловічому роді: <i>віз<\/i>."},{"q":"Пастка: яке речення написано правильно?","options":["Оля принісла торт.","Оля принисла торт.","Оля принесла торт."],"correct":2,"a":"<i>принесла<\/i>: у жіночому роді <i>е<\/i> залишається. <i>і<\/i> пишемо лише в <i>приніс<\/i>."},{"q":"Марко пише: <i>Я вчора дивився матч до пізньої ночі.<\/i> Визнач рід і число дієслова <i>дивився<\/i>.","options":["середній рід, однина","чоловічий рід, однина","множина"],"correct":1,"a":"<i>дивився<\/i> — чоловічий рід, однина: суфікс <i>-в<\/i> без закінчення, далі <i>-ся<\/i>. Дівчинка написала б <i>дивилася<\/i>."}]}},{"id":"U2.2.3","name":"Майбутній час","status":"ready","programmeRef":"Майбутній час дієслів (форми майбутнього часу; змінювання за особами та числами).","lesson":{"what":"<b>Майбутній час<\/b> означає дію, яка відбудеться після того, як про неї говорять. Він має три форми: <b>просту<\/b> (<i>напишу<\/i>), <b>складну<\/b> (<i>писатиму<\/i>) і <b>складену<\/b> (<i>буду писати<\/i>). Змінюється за особами й числами.","ideas":["<b>Проста<\/b> форма — у дієслів доконаного виду: <i>прочитаю, прочитаєш, прочитає…<\/i>","<b>Складна<\/b> форма — інфінітив недоконаного виду + <i>-му, -меш, -ме, -мемо, -мете, -муть<\/i>, пишемо одним словом: <i>читатиму, читатимеш<\/i>.","<b>Складена<\/b> форма — <i>буду, будеш, буде…<\/i> + інфінітив недоконаного виду, пишемо двома словами: <i>буду читати<\/i>.","Від дієслів доконаного виду складну й складену форми не утворюємо: не можна «буду прочитати», «прочитатиму»."],"rules":[{"f":"доконаний вид → прочитаю; недоконаний → читатиму, буду читати","means":"Спершу визнач вид дієслова, а тоді обирай форму майбутнього часу."},{"f":"-му, -меш, -ме, -мемо, -мете, -муть","means":"У закінченнях складної форми пишемо <i>е<\/i>: <i>гратимеш, гратиме, гратимемо, гратимете<\/i>."}],"examples":[{"task":"Утвори форми майбутнього часу 1-ї особи однини від дієслів <i>малювати<\/i> і <i>намалювати<\/i>.","steps":[{"do":"<i>малювати<\/i> — що робити? Недоконаний вид.","why":"Від нього утворюємо складну і складену форми."},{"do":"<i>малюватиму<\/i>; <i>буду малювати<\/i>","why":"Складна форма — одним словом, складена — двома."},{"do":"<i>намалювати<\/i> — що зробити? Доконаний вид → <i>намалюю<\/i>.","why":"Від доконаного виду — лише проста форма."}],"answer":"<i>малюватиму, буду малювати<\/i>; <i>намалюю<\/i>."},{"task":"Зміни дієслово <i>грати<\/i> за особами й числами в складній формі майбутнього часу.","steps":[{"do":"Однина: <i>гратиму, гратимеш, гратиме<\/i>","why":"Інфінітив + <i>-му, -меш, -ме<\/i>."},{"do":"Множина: <i>гратимемо, гратимете, гратимуть<\/i>","why":"Інфінітив + <i>-мемо, -мете, -муть<\/i>."}],"answer":"<i>гратиму, гратимеш, гратиме, гратимемо, гратимете, гратимуть<\/i>."},{"task":"Пастка. Знайди й виправ помилку: <i>Завтра я буду зробити домашнє завдання.<\/i>","steps":[{"do":"<i>зробити<\/i> — що зробити? Доконаний вид.","why":"З <i>буду<\/i> поєднуємо лише інфінітив недоконаного виду."},{"do":"Варіант 1: <i>Завтра я зроблю домашнє завдання.<\/i>","why":"Проста форма доконаного виду."},{"do":"Варіант 2: <i>Завтра я буду робити (робитиму) домашнє завдання.<\/i>","why":"Беремо дієслово недоконаного виду <i>робити<\/i>."}],"answer":"<i>Завтра я зроблю домашнє завдання<\/i> або <i>Завтра я буду робити (робитиму) домашнє завдання<\/i>."}],"mistakes":["<i>Буду прочитати<\/i> — помилка: з <i>буду<\/i> поєднуємо лише недоконаний вид. Правильно: <i>прочитаю<\/i> або <i>буду читати<\/i>.","Пишуть складну форму окремо: <i>читати му<\/i>. Правильно: <i>читатиму<\/i> — одним словом.","Пишуть <i>гратимиш<\/i>. Правильно: <i>гратимеш<\/i>, бо закінчення складної форми пишемо з <i>е<\/i>."],"check":[{"q":"Утвори складну форму майбутнього часу 2-ї особи однини (ти) від дієслова <i>малювати<\/i>.","accept":["малюватимеш"],"a":"<i>малюватимеш<\/i>: інфінітив <i>малювати<\/i> + <i>-меш<\/i>, одним словом."},{"q":"Пастка: яке речення правильне?","options":["Я буду написати твір у неділю.","Я напишу твір у неділю.","Я написатиму твір у неділю."],"correct":1,"a":"<i>написати<\/i> — доконаний вид, тому лише проста форма: <i>напишу<\/i>. <i>Буду…<\/i> і <i>-тиму<\/i> поєднуємо тільки з недоконаним видом."},{"q":"У чаті класу: <i>Завтра будемо прибирати шкільне подвір’я.<\/i> Яка тут форма майбутнього часу?","options":["проста","складна","складена"],"correct":2,"a":"<i>будемо прибирати<\/i> — складена форма: дієслово <i>бути<\/i> + інфінітив, два слова."}]}},{"id":"U2.2.4","name":"Дієслова дати, їсти, бути, відповісти","status":"ready","programmeRef":"Особливості відмінювання дієслів дати, їсти, бути та дієслів з основою на -вісти","lesson":{"what":"Кілька дієслів змінюються за особами не так, як інші: <i>дати, їсти, бути<\/i> і дієслова з основою на <i>-вісти<\/i> (<i>відповісти, розповісти<\/i>). Їхні форми треба просто запам’ятати.","ideas":["У 1-й особі однини основа коротка: <i>дам, їм, відповім<\/i>.","У 2-й особі однини — <i>-си<\/i>: <i>даси, їси, відповіси<\/i> (а не «дасиш»).","У 3-й особі однини — <i>-сть<\/i>: <i>дасть, їсть, відповість<\/i>; у 3-й особі множини з’являється <i>д<\/i>: <i>дадуть, їдять, відповідять<\/i>.","Так само змінюються дієслова з тими самими основами: <i>передати — передам, передаси<\/i>; <i>з’їсти — з’їм, з’їси<\/i>; <i>розповісти — розповім, розповіси<\/i>.","<i>Бути<\/i> в теперішньому часі має одну форму <i>є<\/i> для всіх осіб (<i>я є, вони є<\/i>), а в майбутньому — <i>буду, будеш, буде, будемо, будете, будуть<\/i>."],"rules":[{"f":"дам, даси, дасть, дамо, дасте, дадуть","means":"Так само: <i>продам, передаси, видасть<\/i>."},{"f":"їм, їси, їсть, їмо, їсте, їдять","means":"Так само: <i>з’їм, поїси<\/i>."},{"f":"відповім, відповіси, відповість, відповімо, відповісте, відповідять","means":"Так само: <i>розповім, розповіси, розповість…<\/i>"}],"examples":[{"task":"Утвори форму 2-ї особи однини (ти): <i>дати, з’їсти, розповісти<\/i>.","steps":[{"do":"<i>дати<\/i> → <i>даси<\/i>","why":"У 2-й особі однини цих дієслів — <i>-си<\/i>."},{"do":"<i>з’їсти<\/i> → <i>з’їси<\/i>","why":"Як <i>їси<\/i>; апостроф після префікса <i>з-<\/i> зберігається."},{"do":"<i>розповісти<\/i> → <i>розповіси<\/i>","why":"Як <i>відповіси<\/i>."}],"answer":"<i>даси, з’їси, розповіси<\/i>."},{"task":"Виправ помилки: <i>Вони нам завтра відповідуть, а вчителька дадить оцінки.<\/i>","steps":[{"do":"<i>відповідуть<\/i> → <i>відповідять<\/i>","why":"3-я особа множини від <i>відповісти<\/i> — <i>відповідять<\/i>."},{"do":"<i>дадить<\/i> → <i>дасть<\/i>","why":"3-я особа однини від <i>дати<\/i> — <i>дасть<\/i>."}],"answer":"<i>Вони нам завтра відповідять, а вчителька дасть оцінки.<\/i>"},{"task":"Встав потрібну форму дієслова <i>бути<\/i>: <i>Завтра в нас … контрольна. У мене … два брати.<\/i>","steps":[{"do":"<i>Завтра<\/i> — дія в майбутньому, 3-я особа однини → <i>буде<\/i>","why":"Майбутній час: <i>буду, будеш, буде…<\/i>"},{"do":"Зараз, у теперішньому часі → <i>є<\/i>","why":"У теперішньому часі <i>бути<\/i> має одну форму <i>є<\/i>."}],"answer":"<i>Завтра в нас буде контрольна. У мене є два брати.<\/i>"}],"mistakes":["<i>Ти мені дасиш?<\/i> — помилка. Правильно: <i>Ти мені даси?<\/i>","<i>Вони вже їдуть суп<\/i> — помилка: <i>їдуть<\/i> — від <i>їхати<\/i>. Від <i>їсти<\/i> — <i>їдять<\/i>.","<i>Він розповідить<\/i> — помилка. Правильно: <i>він розповість<\/i> (3-я особа однини на <i>-сть<\/i>)."],"check":[{"q":"Утвори потрібну форму дієслова <i>відповісти<\/i> й напиши одне слово: <i>Ти мені завтра …?<\/i>","accept":["відповіси"],"a":"<i>відповіси<\/i>: у 2-й особі однини дієслова на <i>-вісти<\/i> мають <i>-си<\/i>."},{"q":"Пастка: яка форма 3-ї особи множини від дієслова <i>дати<\/i>?","options":["дадять","дають","дадуть"],"correct":2,"a":"<i>вони дадуть<\/i>. <i>Дають<\/i> — від іншого дієслова, <i>давати<\/i>."},{"q":"Яке повідомлення друга написано правильно?","options":["Що ви зараз їсте? Ми — піцу.","Що ви зараз їдите? Ми — піцу.","Що ви зараз їсьте? Ми — піцу."],"correct":0,"a":"<i>ви їсте<\/i>: <i>їм, їси, їсть, їмо, їсте, їдять<\/i>. Форми «їдите» й «їсьте» неправильні."}]}}]},{"id":"U2.3","name":"Дієвідміни","what":"Чому пишемо «пишеш», але «сидиш».","subtopics":[{"id":"U2.3.1","name":"І та ІІ дієвідміни. Е, И в закінченнях","status":"ready","programmeRef":"Дієслова І та ІІ дієвідмін. Букви е, и в особових закінченнях дієслів.","lesson":{"what":"<b>Дієвідміна<\/b> — група дієслів з однаковими особовими закінченнями. В українській мові дві дієвідміни: І та ІІ. Знаючи дієвідміну, ти правильно пишеш <i>е<\/i> чи <i>и<\/i> в закінченні: <i>пишеш<\/i>, але <i>сидиш<\/i>.","ideas":["Дієвідміну визначаємо за закінченням <b>3-ї особи множини<\/b> (<i>вони що роблять?<\/i>): <i>-уть, -ють<\/i> — І дієвідміна; <i>-ать, -ять<\/i> — ІІ дієвідміна.","І дієвідміна: <i>-еш, -е (-є), -емо, -ете<\/i>: <i>пишеш, пише, пишемо, пишете<\/i>; <i>співаєш, співає<\/i>.","ІІ дієвідміна: <i>-иш, -ить, -имо, -ите<\/i>, після голосного — <i>-їш, -їть, -їмо, -їте<\/i>: <i>сидиш, сидить<\/i>; <i>стоїш, стоїть<\/i>.","Навіть коли <i>е<\/i> чи <i>и<\/i> в закінченні ненаголошені й чуються неясно, <i>у<\/i> й <i>а<\/i> у формі <i>вони…<\/i> добре чути: <i>колють<\/i> → І → <i>колеш<\/i>; <i>бачать<\/i> → ІІ → <i>бачиш<\/i>.","Підказка за інфінітивом: дієслова на <i>-ити, -іти<\/i> (<i>носити, сидіти<\/i>) здебільшого належать до ІІ дієвідміни, але є винятки: <i>жити, пити, шити, мити, хотіти<\/i> — І (<i>живуть, п’ють, шиють, миють, хочуть<\/i>). Тому найнадійніше — форма <i>вони…<\/i>"],"rules":[{"f":"вони -уть, -ють → І дієвідміна: -еш, -е, -емо, -ете","means":"<i>пишуть → пишеш, пише, пишемо, пишете<\/i>. У 3-й особі однини <i>ть<\/i> немає: <i>він пише<\/i>."},{"f":"вони -ать, -ять → ІІ дієвідміна: -иш, -ить, -имо, -ите","means":"<i>носять → носиш, носить, носимо, носите<\/i>; після голосного — <i>ї<\/i>: <i>стоять → стоїш, стоїть<\/i>."}],"examples":[{"task":"Визнач дієвідміну: <i>читати, кричати, малювати<\/i>.","steps":[{"do":"<i>вони читають<\/i> — <i>-ють<\/i>","why":"І дієвідміна."},{"do":"<i>вони кричать<\/i> — <i>-ать<\/i>","why":"ІІ дієвідміна."},{"do":"<i>вони малюють<\/i> — <i>-ють<\/i>","why":"І дієвідміна."}],"answer":"<i>читати, малювати<\/i> — І дієвідміна; <i>кричати<\/i> — ІІ."},{"task":"Встав <i>е<\/i> чи <i>и<\/i>: <i>(ти) пиш..ш, ход..ш, бач..ш, кол..ш<\/i>.","steps":[{"do":"<i>пишуть<\/i> → І → <i>пишеш<\/i>","why":"І дієвідміна — <i>е<\/i>."},{"do":"<i>ходять<\/i> → ІІ → <i>ходиш<\/i>","why":"ІІ дієвідміна — <i>и<\/i>."},{"do":"<i>бачать<\/i> → ІІ → <i>бачиш<\/i>","why":"ІІ дієвідміна — <i>и<\/i>."},{"do":"<i>колють<\/i> → І → <i>колеш<\/i>","why":"І дієвідміна — <i>е<\/i>."}],"answer":"<i>пишеш, ходиш, бачиш, колеш<\/i>."},{"task":"Пастка. Встав <i>е<\/i> чи <i>и<\/i>: <i>(ти) хоч..ш, (ти) жив..ш<\/i>.","steps":[{"do":"<i>хотіти<\/i> закінчується на <i>-іти<\/i>, але <i>вони хочуть<\/i> — <i>-уть<\/i>.","why":"Вирішує форма <i>вони…<\/i>: це І дієвідміна, тому <i>хочеш<\/i>."},{"do":"<i>жити<\/i> — на <i>-ити<\/i>, але <i>вони живуть<\/i> — <i>-уть<\/i>.","why":"Теж І дієвідміна: <i>живеш<\/i>."}],"answer":"<i>хочеш, живеш<\/i>."}],"mistakes":["<i>Ти ходеш<\/i> — помилка. <i>Вони ходять<\/i> → ІІ дієвідміна → <i>ходиш<\/i>.","<i>Він пишеть, він співаєть<\/i> — помилка. У І дієвідміні в 3-й особі однини <i>ть<\/i> немає: <i>пише, співає<\/i>.","Визначають дієвідміну лише за інфінітивом: <i>хотіти<\/i> на <i>-іти<\/i> — отже, «хочиш». Але <i>хочуть<\/i> — І дієвідміна, тому <i>хочеш<\/i>."],"check":[{"q":"Встав букву й напиши слово повністю: <i>Ти мене добре бач..ш?<\/i>","accept":["бачиш"],"a":"<i>вони бачать<\/i> — ІІ дієвідміна, тому <i>бачиш<\/i>."},{"q":"Пастка: яке слово написано правильно?","options":["хочеш","хочиш"],"correct":0,"a":"<i>вони хочуть<\/i> — І дієвідміна, тому <i>хочеш<\/i>, хоча інфінітив <i>хотіти<\/i> закінчується на <i>-іти<\/i>."},{"q":"Друг пише про тренування. Яке повідомлення без помилок?","options":["Ти завтра прийдиш? Тренер кажеть, що треба.","Ти завтра прийдеш? Тренер каже, що треба.","Ти завтра прийдеш? Тренер кажить, що треба."],"correct":1,"a":"<i>вони прийдуть, кажуть<\/i> — І дієвідміна: <i>прийдеш<\/i>; у 3-й особі однини — <i>каже<\/i>, без <i>ть<\/i>."}]}}]},{"id":"U2.4","name":"Способи дієслова","what":"Дійсний, умовний і наказовий спосіб.","subtopics":[{"id":"U2.4.1","name":"Дійсний, умовний, наказовий спосіб","status":"ready","programmeRef":"Спосіб дієслів (дійсний, умовний, наказовий).","lesson":{"what":"<b>Спосіб<\/b> показує, як дія пов’язана з дійсністю: чи вона справді відбувається, чи лише можлива, чи це прохання або наказ. В українській мові три способи: <b>дійсний<\/b>, <b>умовний<\/b> і <b>наказовий<\/b>.","ideas":["<b>Дійсний<\/b> спосіб — реальна дія в теперішньому, минулому чи майбутньому часі: <i>читаю, читав, читатиму<\/i>.","<b>Умовний<\/b> спосіб — дія можлива, бажана або залежить від умови: <i>прочитав би, якби мав час<\/i>. Часу він не має, змінюється за числами, а в однині — за родами.","<b>Наказовий<\/b> спосіб — наказ, прохання, порада, заклик: <i>читай, читаймо, читайте<\/i>. Часу теж не має, змінюється за особами й числами.","З наказовою формою будь обережним: <i>Дай ручку!<\/i> звучить різко. Ввічливіше — <i>Дай, будь ласка, ручку<\/i> або умовним способом: <i>Чи не міг би ти дати ручку?<\/i>"],"rules":[{"f":"дійсний: роблю, робив, робитиму; умовний: робив би; наказовий: роби","means":"Є частка <i>би (б)<\/i> — умовний спосіб; спонукання до дії — наказовий; реальна дія в певному часі — дійсний."}],"examples":[{"task":"Визнач спосіб дієслів: <i>малюю, малював би, малюй<\/i>.","steps":[{"do":"<i>малюю<\/i> — дія відбувається насправді, теперішній час.","why":"Дійсний спосіб."},{"do":"<i>малював би<\/i> — дія лише можлива.","why":"Є частка <i>би<\/i>: умовний спосіб."},{"do":"<i>малюй<\/i> — спонукання до дії.","why":"Наказовий спосіб."}],"answer":"<i>малюю<\/i> — дійсний, <i>малював би<\/i> — умовний, <i>малюй<\/i> — наказовий спосіб."},{"task":"Визнач спосіб дієслів у реченні: <i>Якби я вмів літати, я б облетів увесь світ.<\/i>","steps":[{"do":"<i>якби вмів<\/i> — дія не відбувається, це лише умова.","why":"Частка <i>би<\/i> входить у сполучник <i>якби<\/i>: дієслово <i>вмів<\/i> в умовному способі."},{"do":"<i>б облетів<\/i> — дія лише бажана.","why":"Є частка <i>б<\/i>: умовний спосіб."}],"answer":"обидва дієслова — <i>вмів<\/i> і <i>облетів<\/i> — в умовному способі."},{"task":"Зроби прохання ввічливішим: <i>Відчини вікно!<\/i>","steps":[{"do":"Додаємо ввічливі слова: <i>Відчини, будь ласка, вікно.<\/i>","why":"Наказовий спосіб пом’якшують словами <i>будь ласка<\/i>; їх виділяємо комами."},{"do":"Або питаємо умовним способом: <i>Чи не відчинив би ти вікно?<\/i>","why":"Умовний спосіб звучить як прохання, а не наказ."}],"answer":"<i>Відчини, будь ласка, вікно.<\/i> або <i>Чи не відчинив би ти вікно?<\/i>"}],"mistakes":["Вважають, що умовний спосіб має минулий час, бо <i>пішов би<\/i> схоже на <i>пішов<\/i>. Але умовний спосіб часу не має: <i>Завтра я пішов би в кіно.<\/i>","Плутають <i>ходімо<\/i> (наказовий спосіб, заклик: <i>Ходімо в парк!<\/i>) і <i>ходимо<\/i> (дійсний спосіб: <i>Ми щодня ходимо до школи<\/i>).","Пишуть частку <i>би<\/i> разом із дієсловом: <i>пішовби<\/i>. Правильно окремо: <i>пішов би<\/i>."],"check":[{"q":"Якого способу дієслово <i>допоможіть<\/i>?","options":["дійсного","умовного","наказового"],"correct":2,"a":"<i>допоможіть<\/i> — прохання до інших, наказовий спосіб."},{"q":"Пастка: у якому реченні дієслово в умовному способі?","options":["Я пішов би до бібліотеки, але вона зачинена.","Я пішов до бібліотеки.","Піди до бібліотеки."],"correct":0,"a":"<i>пішов би<\/i> — дія лише можлива, є частка <i>би<\/i>: умовний спосіб. <i>Пішов<\/i> — дійсний спосіб, минулий час; <i>піди<\/i> — наказовий."},{"q":"Ти пишеш у чаті класу: «… разом до музею!» Утвори від дієслова <i>ходити<\/i> форму наказового способу, яка закликає всіх, і тебе теж. Напиши одне слово.","accept":["ходімо"],"a":"<i>ходімо<\/i> — наказовий спосіб, 1-а особа множини. Не плутай із <i>ходимо<\/i> — дійсний спосіб, теперішній час."}]}},{"id":"U2.4.2","name":"Творення умовного й наказового способу","status":"ready","programmeRef":"Творення дієслів умовного й наказового способів.","lesson":{"what":"<b>Умовний спосіб<\/b> утворюємо так: дієслово в минулому часі + частка <i>би (б)<\/i>: <i>прочитав би<\/i>. <b>Наказовий спосіб<\/b> утворюємо від основи теперішнього або простого майбутнього часу: <i>пиш-уть → пиши<\/i>, <i>сяд-уть → сядь<\/i>.","ideas":["Частку пишемо окремо. Після приголосного зазвичай ставимо <i>би<\/i>, після голосного — <i>б<\/i>: <i>зробив би, зробила б<\/i>.","Наказовий спосіб, 2-а особа однини: із закінченням <i>-и<\/i> (<i>пиши, неси, ходи<\/i>) або без нього (<i>читай, сядь, стань<\/i>).","1-а особа множини: <i>-імо<\/i> або <i>-мо<\/i> (<i>пишімо, ходімо, читаймо, сядьмо<\/i>); 2-а особа множини: <i>-іть<\/i> або <i>-те<\/i> (<i>пишіть, ходіть, читайте, сядьте<\/i>).","Форму 3-ї особи утворюємо за допомогою слів <i>нехай, хай<\/i>: <i>нехай читає, хай пишуть<\/i>.","Замість «давайте пограємо» краще сказати одним словом наказового способу: <i>пограймо<\/i>."],"rules":[{"f":"умовний спосіб = минулий час + би (б)","means":"<i>малював би, малювала б, малювали б<\/i>. Частку пишемо окремо."},{"f":"сядь → сядьмо, сядьте","means":"Якщо наказова форма закінчується м’яким приголосним [д’], [т’], [з’], [с’], [ц’], [л’], [н’], пишемо <i>ь<\/i> і зберігаємо його перед <i>-мо, -те<\/i>: <i>стань — станьте, кинь — киньте, будь — будьмо<\/i>. Після губних і шиплячих <i>ь<\/i> немає: <i>постав — поставте, ріж — ріжте<\/i>."},{"f":"пиши → пишімо, пишіть","means":"Якщо в 2-й особі однини закінчення <i>-и<\/i>, то в множині — <i>-імо, -іть<\/i>: <i>неси — несімо, несіть<\/i>."}],"examples":[{"task":"Утвори умовний спосіб: <i>(дівчинка) намалювати, (ми) поїхати<\/i>.","steps":[{"do":"<i>намалювати<\/i> → <i>намалювала<\/i> → <i>намалювала б<\/i>","why":"Спершу минулий час жіночого роду; після голосного — <i>б<\/i>."},{"do":"<i>поїхати<\/i> → <i>поїхали<\/i> → <i>поїхали б<\/i>","why":"Минулий час множини + частка окремо."}],"answer":"<i>намалювала б, поїхали б<\/i>."},{"task":"Утвори наказовий спосіб (ти, ми, ви) від дієслів <i>сісти<\/i> і <i>писати<\/i>.","steps":[{"do":"<i>сядуть<\/i> → основа <i>сяд-<\/i> → <i>сядь<\/i>","why":"Закінчення немає, кінцевий [д’] м’який — пишемо <i>ь<\/i>."},{"do":"<i>сядьмо, сядьте<\/i>","why":"М’який знак зберігаємо перед <i>-мо, -те<\/i>."},{"do":"<i>пишуть<\/i> → <i>пиши<\/i> → <i>пишімо, пишіть<\/i>","why":"Є закінчення <i>-и<\/i>, тому в множині — <i>-імо, -іть<\/i>."}],"answer":"<i>сядь, сядьмо, сядьте<\/i>; <i>пиши, пишімо, пишіть<\/i>."},{"task":"Пастка. Виправ помилки в записці: <i>Встанте раніше й поставьте чайник.<\/i>","steps":[{"do":"<i>встанте<\/i> → <i>встаньте<\/i>","why":"У формі <i>встань<\/i> є <i>ь<\/i>, тому він зберігається перед <i>-те<\/i>."},{"do":"<i>поставьте<\/i> → <i>поставте<\/i>","why":"Після губного <i>в<\/i> м’якого знака не пишемо: <i>постав — поставте<\/i>."}],"answer":"<i>Встаньте раніше й поставте чайник.<\/i>"}],"mistakes":["<i>Сядте, станте<\/i> — забувають <i>ь<\/i>. Правильно: <i>сядьте, станьте<\/i>, бо в <i>сядь, стань<\/i> він є.","<i>Поставьте, ріжьте<\/i> — зайвий <i>ь<\/i> після губного й шиплячого. Правильно: <i>поставте, ріжте<\/i>.","Пишуть частку разом: <i>прийшлаб, зробивби<\/i>. Правильно окремо: <i>прийшла б, зробив би<\/i>."],"check":[{"q":"Утвори від дієслова <i>кинути<\/i> наказовий спосіб для звертання до кількох людей: «… м’яч сюди!» Напиши одне слово.","accept":["киньте"],"a":"<i>кинь — киньте<\/i>: м’який знак зберігаємо перед <i>-те<\/i>."},{"q":"Пастка: яке речення написано правильно?","options":["Сядте ближче до дошки.","Сядьте ближче до дошки."],"correct":1,"a":"<i>сядь — сядьте<\/i>: м’який знак наказової форми зберігаємо перед <i>-те<\/i>."},{"q":"Друг пише: <i>Я пішовби з тобою, але маю тренування.<\/i> Що тут не так?","options":["треба <i>пішов-би<\/i>, через дефіс","усе правильно","треба <i>пішов би<\/i>: частку пишемо окремо"],"correct":2,"a":"Умовний спосіб — дієслово + окрема частка: <i>Я пішов би з тобою…<\/i>"}]}}]},{"id":"U2.5","name":"Правопис і вимова дієслів","what":"Не з дієсловами і правильний наголос.","subtopics":[{"id":"U2.5.1","name":"Не з дієсловами","status":"ready","programmeRef":"Не з дієсловами.","lesson":{"what":"Частку <b>не<\/b> з дієсловами пишемо <b>окремо<\/b>: <i>не знаю, не хочу, не прийшли<\/i>. Разом — лише тоді, коли дієслово без <i>не<\/i> не вживається (<i>ненавидіти<\/i>), або коли <i>недо-<\/i> — префікс зі значенням «менше, ніж треба» (<i>недочувати<\/i>).","ideas":["Окремо в усіх формах дієслова: інфінітив (<i>не читати<\/i>), теперішній, минулий, майбутній час (<i>не читаю, не читав, не читатиму<\/i>), наказовий і умовний спосіб (<i>не читай, не читав би<\/i>).","Разом: <i>ненавидіти, нехтувати, нездужати<\/i> (тобто хворіти) — без <i>не<\/i> ці дієслова не вживаються або мають зовсім інше значення.","Префікс <i>недо-<\/i> означає, що дії менше, ніж треба: <i>недочувати<\/i> (погано чути), <i>недооцінювати<\/i> (оцінювати нижче, ніж треба), <i>недоїдати<\/i> (їсти менше, ніж треба).","Якщо ж <i>до-<\/i> означає «до кінця», а <i>не<\/i> просто заперечує, пишемо окремо: <i>Я не дочитав оповідання<\/i> (не дочитав до кінця)."],"rules":[{"f":"не + дієслово → окремо","means":"<i>не спізнюйся, не знав, не хотілося<\/i>."},{"f":"ненавидіти, нехтувати, нездужати → разом","means":"Без <i>не<\/i> такі дієслова не вживаються або мають інше значення."},{"f":"недо- (менше, ніж треба) → разом; не до- (не до кінця) → окремо","means":"<i>Дідусь недочуває<\/i> (погано чує), але <i>Я не дочув кінця фрази<\/i> (не почув до кінця)."}],"examples":[{"task":"Розкрий дужки: <i>(не)знаю, (не)навиджу, (не)хотіти<\/i>.","steps":[{"do":"<i>не знаю<\/i>","why":"Є слово <i>знаю<\/i>, <i>не<\/i> лише заперечує — окремо."},{"do":"<i>ненавиджу<\/i>","why":"Слова «навиджу» немає — разом."},{"do":"<i>не хотіти<\/i>","why":"Звичайне заперечення — окремо."}],"answer":"<i>не знаю, ненавиджу, не хотіти<\/i>."},{"task":"Розкрий дужки: <i>Бабуся (не)дочуває, а вчора ще й (не)здужала.<\/i>","steps":[{"do":"<i>недочуває<\/i> — погано чує.","why":"<i>недо-<\/i> зі значенням «менше, ніж треба» — разом."},{"do":"<i>нездужала<\/i> — хворіла.","why":"У значенні «хворіти» пишемо разом."}],"answer":"<i>Бабуся недочуває, а вчора ще й нездужала.<\/i>"},{"task":"Пастка. Розкрий дужки: <i>Сашко (не)дочитав оповідання, бо заснув.<\/i>","steps":[{"do":"Що означає слово? Сашко не дочитав до кінця.","why":"<i>до-<\/i> тут означає «до кінця», а <i>не<\/i> заперечує дію."},{"do":"Це не <i>недо-<\/i> зі значенням «менше, ніж треба».","why":"Отже, <i>не<\/i> пишемо окремо."}],"answer":"<i>Сашко не дочитав оповідання, бо заснув.<\/i>"}],"mistakes":["<i>Незнаю, нехочу<\/i> разом — дуже часта помилка в повідомленнях. Правильно: <i>не знаю, не хочу<\/i>.","<i>Не навиджу<\/i> окремо. Правильно: <i>ненавиджу<\/i>, бо без <i>не<\/i> такого слова немає.","Пишуть разом <i>недочитав<\/i> у значенні «не закінчив читати». Правильно: <i>не дочитав<\/i>; разом пишемо <i>недо-<\/i> лише зі значенням «менше, ніж треба»: <i>недооцінювати<\/i>."],"check":[{"q":"Розкрий дужки й напиши правильно (два слова або одне): <i>Я (не)знаю відповіді.<\/i>","accept":["не знаю"],"a":"<i>не знаю<\/i> — окремо: <i>не<\/i> з дієсловами пишемо окремо, бо є слово <i>знаю<\/i>."},{"q":"Пастка: яке речення написано правильно?","options":["Мій кіт ненавидить пилосос.","Мій кіт не навидить пилосос."],"correct":0,"a":"<i>ненавидить<\/i> — разом, бо без <i>не<\/i> це дієслово не вживається."},{"q":"Яке повідомлення написано правильно?","options":["Вибач, я незміг прийти, бо нездужав.","Вибач, я не зміг прийти, бо нездужав.","Вибач, я незміг прийти, бо не здужав."],"correct":1,"a":"<i>не зміг<\/i> — окремо (є слово <i>зміг<\/i>); <i>нездужав<\/i> у значенні «хворів» — разом."}]}},{"id":"U2.5.2","name":"Наголос у дієсловах","status":"ready","programmeRef":"Наголошування окремих дієслів та їхніх форм","lesson":{"what":"У деяких дієсловах наголос легко поставити не туди. У неозначеній формі <i>нести́, везти́, мести́, плести́<\/i> наголошений останній склад, а у формах <i>пишу́, кажу́<\/i> — закінчення.","ideas":["<i>нести́, везти́, мести́, плести́<\/i> — наголос на <i>-ти́<\/i>, а не на першому складі.","<i>несу́, везу́<\/i> — і в множині наголос лишається на закінченні: <i>несемо́, веземо́<\/i>.","<i>пишу́<\/i>, але <i>пи́шеш, пи́ше<\/i>; <i>кажу́<\/i>, але <i>ка́жеш, ка́же<\/i>: у 1-й особі однини наголос на закінченні, а далі переходить на основу.","Сумніваєшся — заглянь в орфоепічний словник (словник правильної вимови й наголосу)."],"rules":[{"f":"нести́, везти́, мести́, плести́","means":"Наголос на останньому складі."},{"f":"несемо́, веземо́","means":"Наголос на закінченні, як і в <i>несу́, везу́<\/i>."},{"f":"пишу́ — пи́шеш; кажу́ — ка́жеш","means":"У 1-й особі однини наголошене закінчення, в інших формах — основа."}],"examples":[{"task":"Постав наголос: <i>нести, плести, мести<\/i>.","steps":[{"do":"<i>нести́<\/i>","why":"Наголос на останньому складі."},{"do":"<i>плести́, мести́<\/i>","why":"Ці дієслова наголошуємо так само, як <i>нести́<\/i>."}],"answer":"<i>нести́, плести́, мести́<\/i>."},{"task":"Постав наголос: <i>пишу, пишеш; кажу, кажеш<\/i>.","steps":[{"do":"<i>пишу́, кажу́<\/i>","why":"1-а особа однини — наголос на закінченні."},{"do":"<i>пи́шеш, ка́жеш<\/i>","why":"В інших особах наголос переходить на основу."}],"answer":"<i>пишу́, пи́шеш; кажу́, ка́жеш<\/i>."},{"task":"Прочитай правильно: <i>Ми несемо подарунки, а тато везе нас на машині.<\/i>","steps":[{"do":"<i>несемо́<\/i>","why":"У множині цього дієслова наголос на закінченні."},{"do":"<i>везе́<\/i>","why":"Як і <i>везу́<\/i>, наголос на закінченні."}],"answer":"<i>Ми несемо́ подарунки, а тато везе́ нас на машині.<\/i>"}],"mistakes":["<i>не́сти, ве́зти<\/i> — помилка. Правильно: <i>нести́, везти́<\/i>.","<i>пи́шу, ка́жу<\/i> — помилка. Правильно: <i>пишу́, кажу́<\/i>.","<i>несе́мо, везе́мо<\/i> — помилка. Правильно: <i>несемо́, веземо́<\/i>."],"check":[{"q":"Де правильно поставлено наголос?","options":["пи́шу","пишу́"],"correct":1,"a":"<i>пишу́<\/i> — наголос на закінченні. А в <i>пи́шеш<\/i> — на основі."},{"q":"Пастка: яка вимова правильна?","options":["везти́","ве́зти"],"correct":0,"a":"<i>везти́<\/i> — наголос на останньому складі, як у <i>нести́<\/i>."},{"q":"Ти читаєш уголос повідомлення: <i>Ми вже несемо торт!<\/i> Як наголосити слово <i>несемо<\/i>?","options":["не́семо","несе́мо","несемо́"],"correct":2,"a":"<i>несемо́<\/i> — наголос на закінченні."}]}}]},{"id":"U2.6","name":"Мовлення: як слухати","what":"Що заважає порозумітися.","subtopics":[{"id":"U2.6.1","name":"Бар’єри спілкування. Правила гарного слухача","status":"ready","programmeRef":"Правила гарного слухача.","lesson":{"what":"<b>Бар’єри спілкування<\/b> — це перешкоди, через які люди не чують або не розуміють одне одного: шум, неуважність, незнайомі слова, образа. <b>Гарний слухач<\/b> не лише мовчить, коли говорить інший, а й намагається його зрозуміти й показує це.","ideas":["Зовнішні бар’єри: шум, поганий зв’язок, велика відстань.","Мовні бар’єри: незнайомі слова чи терміни, сленг, нечітка або надто швидка мова.","Бар’єри почуттів і ставлення: роздратування, образа, поспіх, упередження («він завжди говорить нецікаво»).","Гарний слухач дивиться на співрозмовника, не перебиває, не відволікається на телефон, ставить уточнювальні запитання й перепитує своїми словами: «Ти маєш на увазі, що…?»","Почуте використовуй доречно: коли передаєш інформацію іншим — будь точним, а чужі таємниці не розповідай."],"rules":[{"f":"слухаю → уточнюю → перепитую своїми словами","means":"Так ти перевіряєш, чи правильно зрозумів: «Тобто тренування перенесли на п’ятницю?»"}],"examples":[{"task":"Знайди бар’єр: Ліна розповідає Тарасові про свою поїздку, а він гортає стрічку в телефоні й відповідає «ага».","steps":[{"do":"Тарас не дивиться на Ліну й думає про інше.","why":"Це неуважність — один із найчастіших бар’єрів."},{"do":"Ліна відчуває, що її не слухають.","why":"Через це їй може перехотітися розповідати."},{"do":"Що змінити: відкласти телефон, дивитися на Ліну, поставити запитання про поїздку.","why":"Так гарний слухач показує, що йому цікаво."}],"answer":"бар’єр — неуважність (телефон). Треба відкласти телефон і слухати співрозмовницю."},{"task":"Учитель пояснює нове слово, а Петрик його не розуміє. Як учинити гарному слухачеві?","steps":[{"do":"Помітити, що слово незнайоме.","why":"Незнайоме слово — мовний бар’єр."},{"do":"Поставити уточнювальне запитання: «Поясніть, будь ласка, що означає це слово».","why":"Краще перепитати, ніж удавати, що все зрозумів."}],"answer":"не мовчати, а ввічливо перепитати значення слова."},{"task":"Тренер сказав: «Завтра зустрічаємося не о четвертій, а о п’ятій, біля спортзалу, бо стадіон зачинений». Перепитай своїми словами.","steps":[{"do":"Виділи головне: коли? — о п’ятій; де? — біля спортзалу.","why":"Гарний слухач запам’ятовує суть, а не всі слова."},{"do":"Перепитай коротко: «Тобто завтра о п’ятій біля спортзалу?»","why":"Так ти перевіряєш, чи правильно зрозумів, і тренер може тебе виправити."}],"answer":"«Тобто завтра о п’ятій біля спортзалу, правильно?»"}],"mistakes":["Перебивати, щоб швидше сказати своє. Краще дочекатися, поки співрозмовник закінчить думку.","Удавати, що зрозумів, хоча це не так. Краще чесно перепитати: «Поясни, будь ласка, ще раз».","Одразу оцінювати («Це нудно!»), не дослухавши. Спершу вислухай, потім кажи свою думку."],"check":[{"q":"Що з цього — бар’єр спілкування?","options":["уточнювальне запитання","гучна музика під час розмови","погляд на співрозмовника"],"correct":1,"a":"Гучна музика заважає чути — це зовнішній бар’єр. Запитання й погляд, навпаки, допомагають порозумітися."},{"q":"Пастка: Даринка весь час кивала, але потім не змогла переказати, що розповіла подруга. Чи була вона гарною слухачкою?","options":["Ні, бо лише вдавала увагу, а насправді не слухала","Так, бо кивала й не перебивала"],"correct":0,"a":"Кивати — замало. Гарний слухач справді стежить за думкою співрозмовника й може її переказати."},{"q":"Друг у голосовому повідомленні сказав, що похід переносять із суботи на неділю. Що краще написати у відповідь?","options":["Знову все переносять, як завжди!","Добре.","Тобто похід буде в неділю, а не в суботу? Я правильно зрозумів?","А що ти казав?"],"correct":2,"a":"Перепитати своїми словами — найкращий спосіб переконатися, що ти все зрозумів правильно."}]}}]}]},{"id":"U3","subject":"ukr","name":"Дієприкметник. Дієслівні форми на -но, -то","what":"Форма дієслова, схожа на прикметник: «прочитана книжка», «квітучий сад».","topics":[{"id":"U3.1","name":"Дієприкметник","what":"Що таке дієприкметник, які бувають і як утворюються.","subtopics":[{"id":"U3.1.1","name":"Дієприкметник як форма дієслова","status":"ready","programmeRef":"Дієприкметник як форма дієслова: загальне значення, морфологічні ознаки, синтаксична роль.","lesson":{"what":"<b>Дієприкметник<\/b> — особлива форма дієслова, яка називає ознаку предмета за дією: <i>прочитана книжка<\/i> (її прочитали), <i>пожовкле листя<\/i> (воно пожовкло). Дієприкметник відповідає на питання <b>який? яка? яке? які?<\/b> — як прикметник, але походить від дієслова.","ideas":["Від <b>дієслова<\/b> дієприкметник має вид (доконаний чи недоконаний) і час (теперішній чи минулий): <i>прочитаний<\/i> — від <i>прочитати<\/i> (що зробити?), тому доконаний вид; дія вже відбулася — минулий час.","Від <b>прикметника<\/b> дієприкметник має рід, число й відмінок і, як прикметник, узгоджується з іменником: <i>прочитаний лист, прочитана книжка, прочитані книжки<\/i>.","Як відрізнити від прикметника: спитай, чи стоїть за ознакою <b>дія<\/b>. <i>Пофарбований паркан<\/i> — паркан пофарбували (дієприкметник); <i>зелений паркан<\/i> — дії немає, це просто колір (прикметник).","У реченні дієприкметник найчастіше буває <b>означенням<\/b>: <i>На подвір’ї стояв пофарбований паркан.<\/i> Рідше — <b>частиною присудка<\/b>: <i>Двері були зачинені.<\/i>","Дієприкметники утворюються від дієслів за допомогою суфіксів: <i>сид<b>яч<\/b>ий, пожовк<b>л<\/b>ий, прочита<b>н<\/b>ий, зробл<b>ен<\/b>ий, вкри<b>т<\/b>ий<\/i>."],"rules":[{"f":"<i>пофарбувати<\/i> → <i>пофарбований<\/i> (паркан): ознака предмета за дією, питання <b>який?<\/b>","means":"Дієприкметник показує, що з предметом зробили або що предмет робить чи зробив сам: <i>пофарбований паркан<\/i> — паркан, який пофарбували; <i>пожовкле листя<\/i> — листя, яке пожовкло."},{"f":"дієприкметник = ознаки дієслова (вид, час) + ознаки прикметника (рід, число, відмінок)","means":"<i>Намальована картина<\/i>: доконаний вид, минулий час (від дієслова); жіночий рід, однина, називний відмінок (як у прикметника)."}],"examples":[{"task":"Знайди дієприкметник: <i>зелене листя, пожовкле листя, осіннє листя<\/i>.","steps":[{"do":"<i>Зелене<\/i> — дії за цим словом немає.","why":"Це прикметник: він називає колір, тобто постійну ознаку, а не ознаку за дією."},{"do":"<i>Осіннє<\/i> — утворене від іменника <i>осінь<\/i>.","why":"Це прикметник: ознака за часом, дієслова за ним немає."},{"do":"<i>Пожовкле<\/i> — від дієслова <i>пожовкнути<\/i>: листя, яке пожовкло.","why":"Ознака з’явилася внаслідок дії, тож це дієприкметник."}],"answer":"Дієприкметник — <i>пожовкле<\/i>."},{"task":"Визнач морфологічні ознаки й синтаксичну роль дієприкметника: <i>Мама похвалила намальовану картину.<\/i>","steps":[{"do":"Картину (яку?) <i>намальовану<\/i> — від дієслова <i>намалювати<\/i>.","why":"Питання прикметника, але слово походить від дієслова й означає ознаку за дією — це дієприкметник."},{"do":"<i>Намалювати<\/i> — що зробити? Отже, доконаний вид; дія вже відбулася — минулий час.","why":"Вид і час — ознаки, які дієприкметник має від дієслова."},{"do":"Жіночий рід, однина, знахідний відмінок — як в іменника <i>картину<\/i>.","why":"Дієприкметник узгоджується з іменником у роді, числі й відмінку."},{"do":"Залежить від іменника <i>картину<\/i> й відповідає на питання «яку?».","why":"Тож у реченні це означення."}],"answer":"<i>Намальовану<\/i> — дієприкметник: доконаний вид, минулий час, жіночий рід, однина, знахідний відмінок; у реченні — означення."},{"task":"Визнач синтаксичну роль дієприкметника <i>зачинені<\/i>: 1) <i>Зачинені двері скрипнули.<\/i> 2) <i>Двері були зачинені.<\/i>","steps":[{"do":"У першому реченні граматична основа — <i>двері скрипнули<\/i>.","why":"<i>Зачинені<\/i> відповідає на питання «які?» і залежить від підмета <i>двері<\/i> — це означення."},{"do":"У другому реченні граматична основа — <i>двері були зачинені<\/i>.","why":"Тут <i>зачинені<\/i> разом зі словом <i>були<\/i> повідомляє, що сталося з дверима, — це частина присудка."}],"answer":"1) означення; 2) частина присудка."}],"mistakes":["Уважають дієприкметником кожне слово, що відповідає на питання «який?». <i>Зелений, дерев’яний<\/i> — прикметники: дії за ними немає. Дієприкметники — <i>пофарбований<\/i> (його пофарбували), <i>зів’ялий<\/i> (він зів’яв).","Плутають дієприкметник із дієсловом минулого часу. <i>Намалював<\/i> — дієслово (що зробив?), <i>намальований<\/i> — дієприкметник (який?).","Не узгоджують дієприкметник з іменником: «намальований картина». Правильно: <i>намальована картина<\/i> — жіночий рід, як і <i>картина<\/i>."],"check":[{"q":"Яке слово є дієприкметником?","options":["вимитий","весняний","вимив","чистий"],"correct":0,"a":"<i>Вимитий<\/i> — ознака за дією (його вимили), питання «який?». <i>Вимив<\/i> — дієслово, <i>весняний<\/i> і <i>чистий<\/i> — прикметники."},{"q":"Пастка: у якому реченні дієприкметник є частиною присудка?","options":["Розбита чашка лежала на підлозі.","Чашка була розбита.","Мама склеїла розбиту чашку."],"correct":1,"a":"У реченні <i>Чашка була розбита<\/i> граматична основа — <i>чашка була розбита<\/i>, тож дієприкметник — частина присудка. В інших реченнях <i>розбита, розбиту<\/i> — означення."},{"q":"Друг написав: «Мій зламаний велосипед уже в майстерні». Якого виду дієприкметник <i>зламаний<\/i>?","options":["недоконаного","доконаного"],"correct":1,"a":"Доконаного: він утворений від дієслова <i>зламати<\/i> (що зробити?)."}]}},{"id":"U3.1.2","name":"Активні й пасивні дієприкметники","status":"ready","programmeRef":"Активні й пасивні дієприкметники.","lesson":{"what":"<b>Активний<\/b> дієприкметник називає ознаку предмета, який <b>сам<\/b> виконує дію або сам змінився: <i>пожовкле листя<\/i> (листя пожовкло). <b>Пасивний<\/b> — ознаку предмета, над яким дію виконав <b>хтось інший<\/b>: <i>скошена трава<\/i> (траву скосили).","ideas":["Перевірка: перебудуй сполучення з допомогою слова «який». Предмет діє сам — активний: <i>посивілий дідусь — дідусь, який посивів<\/i>. З предметом щось зробили — пасивний: <i>прочитана книжка — книжка, яку прочитали<\/i>.","Суфікси підказують: активні — <b>-уч- (-юч-), -ач- (-яч-), -л-<\/b> (<i>повзучий, лежачий, змерзлий<\/i>); пасивні — <b>-н-, -ен- (-єн-), -т-<\/b> (<i>прочитаний, зроблений, напоєний, вкритий<\/i>).","Активних дієприкметників <b>теперішнього часу<\/b> (із суфіксами -уч-, -юч-, -ач-, -яч-) у сучасній українській мові мало. Нормативні лише деякі: <i>квітучий, палаючий, лежачий, сидячий, тремтячий<\/i>. Більшість таких форм (<i>працюючий, читаючий, бажаючий<\/i>) вважають помилкою.","Як замінити ненормативний дієприкметник: підрядною частиною зі словом <b>«який»<\/b> (<i>працюючий учень → учень, який працює<\/i>); <b>іменником<\/b> (<i>завідуючий → завідувач, відпочиваючі → відпочивальники<\/i>); <b>прикметником<\/b> (<i>миючий засіб → мийний засіб, оточуючий світ → навколишній світ<\/i>)."],"rules":[{"f":"Активний: предмет діє <b>сам<\/b> — <i>посивілий дідусь<\/i> (дідусь посивів)","means":"Суфікси -уч- (-юч-), -ач- (-яч-), -л-: <i>повзучий, сидячий, посивілий<\/i>."},{"f":"Пасивний: дію виконали <b>над<\/b> предметом — <i>вимитий посуд<\/i> (посуд вимили)","means":"Суфікси -н-, -ен- (-єн-), -т-: <i>написаний, принесений, вимитий<\/i>."},{"f":"<i>працюючий учень<\/i> → <i>учень, який працює<\/i>","means":"Більшість активних дієприкметників теперішнього часу ненормативні. Замінюємо їх підрядною частиною з «який», іменником або прикметником."}],"examples":[{"task":"Визнач, активний чи пасивний дієприкметник: <i>посивілий дідусь, зав’язаний шнурок<\/i>.","steps":[{"do":"<i>Посивілий дідусь<\/i> — дідусь, який посивів.","why":"Дідусь сам зазнав зміни, ніхто над ним дії не виконував, — активний; суфікс -л-."},{"do":"<i>Зав’язаний шнурок<\/i> — шнурок, який зав’язали.","why":"Дію над шнурком виконав хтось інший — пасивний; суфікс -н-."}],"answer":"<i>Посивілий<\/i> — активний, <i>зав’язаний<\/i> — пасивний."},{"task":"Заміни ненормативний дієприкметник: <i>Працюючі батьки забирають дітей зі школи пізніше.<\/i>","steps":[{"do":"<i>Працюючі<\/i> — активний дієприкметник теперішнього часу (суфікс -юч-).","why":"Такі форми в сучасній українській мові здебільшого ненормативні."},{"do":"Перебудовуємо зі словом «які»: <i>батьки, які працюють<\/i>.","why":"Підрядна частина з «який» — найзручніший спосіб заміни."},{"do":"Виділяємо підрядну частину комами.","why":"Частину речення зі словом «які» в середині речення відокремлюємо комами з обох боків."}],"answer":"<i>Батьки, які працюють, забирають дітей зі школи пізніше.<\/i>"},{"task":"Добери нормативну заміну: <i>завідуючий бібліотекою, миючий засіб, оточуючий світ<\/i>.","steps":[{"do":"<i>Завідуючий<\/i> — це назва посади, тож замінюємо іменником <i>завідувач<\/i>.","why":"Назви осіб передаємо іменниками. Іменник <i>завідувач<\/i> вимагає родового відмінка: <i>завідувач бібліотеки<\/i>."},{"do":"<i>Миючий засіб<\/i> — засіб для миття, тож <i>мийний засіб<\/i>.","why":"Постійну ознаку предмета (для чого він) передаємо прикметником."},{"do":"<i>Оточуючий світ<\/i> → <i>навколишній світ<\/i>.","why":"Тут теж замінюємо прикметником."}],"answer":"<i>Завідувач бібліотеки, мийний засіб, навколишній світ.<\/i>"}],"mistakes":["Пишуть «співаючий хор», «читаючий учень». Правильно: <i>хор, який співає<\/i>; <i>учень, який читає<\/i>.","Плутають активний і пасивний за значенням. <i>Розтоплений сніг<\/i> — пасивний (сніг розтопили), а <i>розталий сніг<\/i> — активний (сніг розтанув сам).","Табличка «Для відпочиваючих» — помилка. Правильно: <i>Для відпочивальників<\/i>."],"check":[{"q":"Пастка: яке сполучення ненормативне?","options":["квітучий луг","пожовкле листя","працюючий комп’ютер","вимитий посуд"],"correct":2,"a":"<i>Працюючий<\/i> — ненормативна форма. Краще: <i>комп’ютер, який працює<\/i>, або <i>справний комп’ютер<\/i>. А <i>квітучий<\/i> — один із небагатьох нормативних активних дієприкметників теперішнього часу."},{"q":"Активний чи пасивний дієприкметник у сполученні <i>загублений м’яч<\/i>?","options":["пасивний","активний"],"correct":0,"a":"Пасивний: м’яч загубили, тобто дію виконав хтось інший; суфікс -ен-."},{"q":"Оголошення в спортзалі: «Усіх бажаючих запрошуємо на тренування». Як написати правильно?","options":["Усіх охочих запрошуємо на тренування.","Усіх бажаючих запрошуємо на тренування."],"correct":0,"a":"<i>Бажаючих<\/i> — ненормативний активний дієприкметник теперішнього часу. Правильно: <i>усіх охочих<\/i> (або <i>усіх, хто бажає<\/i>)."}]}},{"id":"U3.1.3","name":"Творення активних дієприкметників","status":"ready","programmeRef":"Творення активних дієприкметників.","lesson":{"what":"Активні дієприкметники бувають <b>теперішнього<\/b> часу (<i>лежачий<\/i> — той, що лежить) і <b>минулого<\/b> часу (<i>пожовклий<\/i> — той, що пожовк). Їх утворюють від дієслів за допомогою суфіксів.","ideas":["Активний дієприкметник теперішнього часу утворюємо від форми «вони …» теперішнього часу: <i>повзти → (вони) повзуть → повзучий<\/i>. Тому його мають лише дієслова недоконаного виду.","Дієвідміна підказує суфікс: І дієвідміна (вони -уть, -ють) → <b>-уч-, -юч-<\/b>; ІІ дієвідміна (вони -ать, -ять) → <b>-ач-, -яч-<\/b>.","Утворювати такі форми вміємо, щоб їх розпізнавати. Але більшість із них ненормативні (<i>читаючий, працюючий<\/i>), тому в мовленні замінюємо: <i>учень, який читає<\/i>.","Активні дієприкметники минулого часу із суфіксом <b>-л-<\/b> звичайні й поширені: <i>змерзлі руки, посивіле волосся, почервонілі щоки<\/i>."],"rules":[{"f":"основа теперішнього часу + <b>-уч- (-юч-)<\/b> (І дієвідміна) або <b>-ач- (-яч-)<\/b> (ІІ дієвідміна)","means":"Беремо форму «вони»: <i>повзуть → повз<b>уч<\/b>ий, палають → пала<b>юч<\/b>ий, лежать → леж<b>ач<\/b>ий, тремтять → тремт<b>яч<\/b>ий<\/i>."},{"f":"основа інфінітива + <b>-л-<\/b>","means":"Відкидаємо -ти (у дієсловах на -нути — і -ну-): <i>почорніти → почорні<b>л<\/b>ий, пожовкнути → пожовк<b>л<\/b>ий, зів’янути → зів’я<b>л<\/b>ий<\/i>. Найчастіше так утворюємо від дієслів доконаного виду, що означають перехід у новий стан."}],"examples":[{"task":"Утвори активний дієприкметник теперішнього часу від дієслова <i>повзти<\/i>.","steps":[{"do":"Форма «вони»: <i>повзуть<\/i>.","why":"Активний дієприкметник теперішнього часу утворюємо від основи теперішнього часу."},{"do":"Закінчення -уть — І дієвідміна, отже суфікс -уч-.","why":"І дієвідміна: суфікси -уч- (-юч-)."},{"do":"<i>повз<\/i> + <i>уч<\/i> + <i>ий<\/i>","why":"До основи додаємо суфікс і закінчення."}],"answer":"<i>Повзучий<\/i> (повзучі рослини)."},{"task":"Утвори активні дієприкметники минулого часу від дієслів <i>почервоніти, змерзнути<\/i>.","steps":[{"do":"<i>почервоні-ти<\/i> → <i>почервоні<\/i> + <i>л<\/i> + <i>ий<\/i>","why":"Відкидаємо -ти, додаємо суфікс -л- і закінчення."},{"do":"<i>змерз-ну-ти<\/i> → <i>змерз<\/i> + <i>л<\/i> + <i>ий<\/i>","why":"У дієсловах на -нути разом із -ти відпадає й -ну-."}],"answer":"<i>Почервонілий, змерзлий.<\/i>"},{"task":"Знайди й виправ ненормативну форму: <i>Читаючий учень не почув дзвоника.<\/i>","steps":[{"do":"<i>Читаючий<\/i>: <i>читають<\/i> → <i>чита<\/i> + <i>юч<\/i> + <i>ий<\/i> — активний дієприкметник теперішнього часу.","why":"Утворено за правилом, але така форма в сучасній мові ненормативна."},{"do":"Замінюємо підрядною частиною: <i>учень, який читав<\/i>.","why":"Учень читав тоді ж, коли не почув дзвоника, тому в підрядній частині — минулий час."},{"do":"Виділяємо підрядну частину комами з обох боків.","why":"Вона стоїть у середині речення."}],"answer":"<i>Учень, який читав, не почув дзвоника.<\/i>"}],"mistakes":["Утворюють активний дієприкметник теперішнього часу від дієслова доконаного виду: «прочитаючий». Такої форми немає: дієслова доконаного виду не мають теперішнього часу.","Плутають суфікси: «лежучий». <i>Лежати<\/i> — ІІ дієвідміна (вони лежать), тому <i>лежачий<\/i>.","Залишають -ну-: «змерзнулий». Правильно: <i>змерзлий<\/i>, <i>пожовклий<\/i>."],"check":[{"q":"Утвори активний дієприкметник минулого часу від дієслова <i>посивіти<\/i> (чоловічий рід). Напиши одне слово.","accept":["посивілий"],"a":"<i>Посиві-ти<\/i> → посивілий: відкидаємо -ти, додаємо суфікс -л- і закінчення."},{"q":"Пастка: який суфікс в активному дієприкметнику від дієслова <i>тремтіти<\/i> (вони тремтять)?","options":["-уч-","-юч-","-ач-","-яч-"],"correct":3,"a":"<i>Тремтять<\/i> — ІІ дієвідміна, тому -ач- (-яч-); після м’якого приголосного — -яч-: <i>тремтячий<\/i>."},{"q":"Ти підписуєш фото: «Ми з друзями на … галявині». Яке слово правильне?","options":["квітучій","квітнувшій"],"correct":0,"a":"<i>Квітучий<\/i> — один із нормативних активних дієприкметників теперішнього часу: <i>на квітучій галявині<\/i>. А форма «квітнувший» — неукраїнська: суфікса -вш- в українських дієприкметниках немає."}]}},{"id":"U3.1.4","name":"Творення пасивних дієприкметників","status":"ready","programmeRef":"Творення пасивних дієприкметників.","lesson":{"what":"Пасивні дієприкметники утворюємо від <b>основи інфінітива<\/b> перехідних дієслів (тих, що мають при собі додаток у знахідному відмінку: <i>прочитати книжку<\/i>) за допомогою суфіксів <b>-н-, -ен- (-єн-), -т-<\/b>.","ideas":["Від неперехідних дієслів, тобто таких, що не мають при собі додатка в знахідному відмінку (<i>сміятися, сидіти<\/i>), пасивних дієприкметників не утворюємо.","Перед суфіксом -ен- приголосні основи часто чергуються: <b>д → дж<\/b> (<i>посадити → посаджений<\/i>), <b>т → ч<\/b> (<i>помітити → помічений<\/i>), <b>з → ж<\/b> (<i>заморозити → заморожений<\/i>), <b>с → ш<\/b> (<i>скосити → скошений<\/i>), <b>ст → щ<\/b> (<i>очистити → очищений<\/i>).","Після губних <b>б, п, в, м<\/b> перед -ен- з’являється <b>л<\/b>: <i>зробити → зроблений, купити → куплений, зловити → зловлений<\/i>.","Пасивні дієприкметники в українській мові звучать природно й уживаються часто: <i>вивчений вірш, виграний матч, зібраний рюкзак<\/i>."],"rules":[{"f":"основа на -а- (-я-) + <b>-н-<\/b>","means":"<i>прочита-ти → прочита<b>н<\/b>ий, засія-ти → засія<b>н<\/b>ий, зав’яза-ти → зав’яза<b>н<\/b>ий<\/i>."},{"f":"основа на приголосний або на -и- (-ї-) + <b>-ен- (-єн-)<\/b>","means":"Голосний -и- (-ї-) відпадає: <i>принес-ти → принес<b>ен<\/b>ий, побачи-ти → побач<b>ен<\/b>ий<\/i>. Після голосного пишемо -єн-: <i>напоїти → напо<b>єн<\/b>ий<\/i>."},{"f":"основа на -ну-, -ер- та деякі інші (<i>бити, мити, шити, вкрити, взути, колоти<\/i>) + <b>-т-<\/b>","means":"<i>загорну-ти → загорну<b>т<\/b>ий, стер-ти → стер<b>т<\/b>ий, вими-ти → вими<b>т<\/b>ий, взу-ти → взу<b>т<\/b>ий<\/i>."}],"examples":[{"task":"Утвори пасивні дієприкметники від дієслів <i>написати, принести, загорнути<\/i>.","steps":[{"do":"<i>написа-ти<\/i> → <i>написа<\/i> + <i>н<\/i> + <i>ий<\/i>","why":"Основа на -а-, тому суфікс -н-."},{"do":"<i>принес-ти<\/i> → <i>принес<\/i> + <i>ен<\/i> + <i>ий<\/i>","why":"Основа на приголосний, тому суфікс -ен-."},{"do":"<i>загорну-ти<\/i> → <i>загорну<\/i> + <i>т<\/i> + <i>ий<\/i>","why":"Основа на -ну-, тому суфікс -т-."}],"answer":"<i>Написаний, принесений, загорнутий.<\/i>"},{"task":"Утвори пасивний дієприкметник від дієслова <i>посадити<\/i> і поясни написання.","steps":[{"do":"Основа інфінітива — <i>посади-<\/i>; голосний -и- відпадає, додаємо -ен-.","why":"Основа на -и-: суфікс -ен-."},{"do":"Перед -ен- <b>д<\/b> чергується з <b>дж<\/b>: <i>посадж<\/i> + <i>ен<\/i> + <i>ий<\/i>.","why":"Чергування д → дж (як у <i>саджу<\/i>)."}],"answer":"<i>Посаджений<\/i> (посаджене дерево)."},{"task":"Знайди й виправ помилки в повідомленні: <i>Торт уже купений, морозиво заморозене, кульки надуті.<\/i>","steps":[{"do":"<i>купити<\/i>: основа закінчується на губний <b>п<\/b>.","why":"Після губних перед -ен- з’являється л: <i>куплений<\/i>."},{"do":"<i>заморозити<\/i>: перед -ен- <b>з<\/b> чергується з <b>ж<\/b>.","why":"Чергування з → ж: <i>заморожене<\/i>."},{"do":"<i>надути<\/i> → <i>надутий<\/i> — написано правильно.","why":"Від <i>дути<\/i> пасивний дієприкметник утворюємо із суфіксом -т-, як <i>взутий<\/i>."}],"answer":"<i>Торт уже куплений, морозиво заморожене, кульки надуті.<\/i>"}],"mistakes":["Забувають про <b>л<\/b> після губних: «зробений», «купений». Правильно: <i>зроблений, куплений<\/i>.","Не роблять чергування: «посадений», «скосений». Правильно: <i>посаджений, скошений<\/i>.","Пишуть -ен- після голосного: «напоений». Правильно: <i>напоєний<\/i> — після голосного -єн-."],"check":[{"q":"Утвори пасивний дієприкметник від дієслова <i>зробити<\/i> (чоловічий рід). Напиши одне слово.","accept":["зроблений"],"a":"<i>Зроби-ти<\/i>: -и- відпадає, додаємо -ен-; після губного <b>б<\/b> з’являється <b>л<\/b> — <i>зроблений<\/i>."},{"q":"Пастка: який дієприкметник утворено правильно?","options":["очистений","очищенний","очищений"],"correct":2,"a":"Перед -ен- <b>ст<\/b> чергується з <b>щ<\/b>, а в суфіксі дієприкметника одне н: <i>очищений<\/i>."},{"q":"На коробці написано: «Товар … в Україні». Яке слово правильне?","options":["виробений","виробльений","вироблений"],"correct":2,"a":"<i>Виробити<\/i>: після губного <b>б<\/b> перед -ен- з’являється <b>л<\/b> — <i>вироблений<\/i>."}]}},{"id":"U3.1.5","name":"Відмінювання дієприкметників","status":"ready","programmeRef":"Відмінювання дієприкметників.","lesson":{"what":"Дієприкметники змінюються за родами, числами й відмінками так само, як прикметники <b>твердої групи<\/b> (як <i>новий<\/i>): <i>прочитаний, прочитаного, прочитаному…<\/i>","ideas":["Дієприкметник стоїть у тому самому роді, числі й відмінку, що й іменник, до якого він належить: <i>про прочитану книжку, з прочитаною книжкою<\/i>.","Закінчення такі самі, як у прикметника <i>новий<\/i>: <i>нового — прочитаного, новою — прочитаною, нових — прочитаних<\/i>.","Активні дієприкметники теж відмінюються за твердою групою: <i>квітучий, квітучого, квітучому<\/i>; <i>пожовклий, пожовклого, пожовклому<\/i>.","Щоб не помилитися в закінченні, постав питання від іменника: <i>(яким?) засніженим схилом<\/i>."],"rules":[{"f":"Н. засніжений, Р. засніженого, Д. засніженому, З. засніжений / засніженого, О. засніженим, М. (на) засніженому","means":"Чоловічий рід, однина. У знахідному відмінку — як у називному для неживих (<i>бачу засніжений ліс<\/i>) і як у родовому для істот (<i>бачу засмученого друга<\/i>)."},{"f":"Н. засніжена, Р. засніженої, Д. засніженій, З. засніжену, О. засніженою, М. (на) засніженій","means":"Жіночий рід, однина: закінчення як у прикметника <i>нова<\/i>."},{"f":"Н. засніжені, Р. засніжених, Д. засніженим, З. засніжені / засніжених, О. засніженими, М. (на) засніжених","means":"Множина — однакова для всіх родів."}],"examples":[{"task":"Провідміняй в однині сполучення <i>загублений ключ<\/i>.","steps":[{"do":"Н. загублений ключ, Р. загубленого ключа, Д. загубленому ключу (ключеві)","why":"Закінчення дієприкметника — як у прикметника твердої групи: -ий, -ого, -ому."},{"do":"З. загублений ключ","why":"<i>Ключ<\/i> — неживий іменник, тому знахідний збігається з називним."},{"do":"О. загубленим ключем, М. на загубленому ключі","why":"Орудний: -им; місцевий: -ому."}],"answer":"<i>Загублений ключ, загубленого ключа, загубленому ключу (ключеві), загублений ключ, загубленим ключем, на загубленому ключі.<\/i>"},{"task":"Встав закінчення: <i>Ми з’їжджали на санчатах засніжен.. схилом. Дідусь розповів про зруйнован.. міст.<\/i>","steps":[{"do":"<i>схилом<\/i> — орудний відмінок, чоловічий рід, однина.","why":"Дієприкметник у тому самому відмінку: (яким?) <i>засніженим<\/i>."},{"do":"<i>про міст<\/i> — знахідний відмінок; <i>міст<\/i> — неживий.","why":"Для неживих знахідний збігається з називним: (який?) <i>зруйнований<\/i>."}],"answer":"<i>засніженим схилом; про зруйнований міст.<\/i>"},{"task":"Знайди й виправ помилку: <i>Ми довго говорили про виграний матч і про забитих голів.<\/i>","steps":[{"do":"<i>про<\/i> (що?) <i>голи<\/i> — знахідний відмінок, множина.","why":"Прийменник <i>про<\/i> тут вимагає знахідного відмінка."},{"do":"<i>Голи<\/i> — неживий іменник, тож знахідний збігається з називним.","why":"Форма «голів» тут неправильна, як і «забитих»."},{"do":"Дієприкметник узгоджуємо з іменником: <i>забиті голи<\/i>.","why":"Дієприкметник стоїть у тому самому відмінку й числі, що й іменник."}],"answer":"<i>Ми довго говорили про виграний матч і про забиті голи.<\/i>"}],"mistakes":["Ставлять дієприкметник не в тому відмінку, що й іменник: «з прочитаної книжкою». Правильно: <i>з прочитаною книжкою<\/i> (обидва слова в орудному).","Для істот у знахідному відмінку беруть форму називного: «бачу засмучений друг». Правильно: <i>бачу засмученого друга<\/i>.","Пишуть закінчення м’якої групи: «засніженього». Дієприкметники відмінюються за твердою групою: <i>засніженого<\/i>."],"check":[{"q":"Постав дієприкметник у потрібну форму: <i>пишаюся (виконаний) проєктом<\/i>. Напиши одне слово.","accept":["виконаним"],"a":"Пишаюся (чим?) проєктом — орудний відмінок, чоловічий рід, тож <i>виконаним<\/i>: <i>пишаюся виконаним проєктом<\/i>."},{"q":"Пастка: як правильно?","options":["бачу розгублений хлопчика","бачу розгубленого хлопчика","бачу розгублений хлопчик"],"correct":1,"a":"<i>Хлопчик<\/i> — істота, тому в знахідному відмінку форма як у родовому: <i>бачу розгубленого хлопчика<\/i>."},{"q":"Подруга пише: «Я сфотографувала … клумбу біля школи». Яке слово правильне?","options":["квітучу","квітучою","квітучої"],"correct":0,"a":"Сфотографувала (що?) клумбу — знахідний відмінок, жіночий рід, тож <i>квітучу<\/i>."}]}}]},{"id":"U3.2","name":"Дієприкметниковий зворот","what":"Дієприкметник із залежними словами і коми.","subtopics":[{"id":"U3.2.1","name":"Дієприкметниковий зворот і коми","status":"ready","programmeRef":"Дієприкметниковий зворот. Розділові знаки в реченнях із дієприкметниковими зворотами.","lesson":{"what":"<b>Дієприкметниковий зворот<\/b> — це дієприкметник разом із залежними словами: (стежка) <i>вкрита листям<\/i>, (учень) <i>захоплений грою<\/i>. У реченні весь зворот — одне поширене означення. <b>Означуване слово<\/b> — іменник чи займенник, до якого належить зворот.","ideas":["Межі звороту шукаємо так: від дієприкметника ставимо питання до слів, які від нього залежать: <i>вкрита (чим?) листям<\/i>. Означуване слово до звороту не входить.","Зворот <b>після<\/b> означуваного слова виділяємо комами: <i>Стежка, вкрита листям, вела до річки.<\/i> Якщо зворот стоїть у кінці речення, кома лише перед ним: <i>Ми йшли стежкою, вкритою листям.<\/i>","Зворот <b>перед<\/b> означуваним словом комами не виділяємо: <i>Вкрита листям стежка вела до річки.<\/i>","Зворот, що стосується <b>особового займенника<\/b> (<i>я, ти, він, вона, ми, ви, вони<\/i>), виділяємо завжди, де б він не стояв: <i>Захоплений грою, він не почув дзвоника. Він, захоплений грою, не почув дзвоника.<\/i>","Зворот перед означуваним словом виділяють комами й тоді, коли він має додаткове значення причини (його можна замінити словами «бо…», «оскільки…»): <i>Утомлені довгою дорогою, туристи швидко заснули.<\/i>"],"rules":[{"f":"означуване слово<b>,<\/b> зворот<b>,<\/b> …","means":"Зворот після означуваного слова виділяємо комами з обох боків: <i>Учень, захоплений грою, не почув дзвоника.<\/i>"},{"f":"зворот + означуване слово — без ком","means":"<i>Захоплений грою учень не почув дзвоника.<\/i>"},{"f":"зворот + особовий займенник — коми завжди","means":"<i>Захоплений грою, він не почув дзвоника.<\/i>"}],"examples":[{"task":"Знайди дієприкметниковий зворот і означуване слово: <i>Ми довго розглядали малюнок, намальований молодшою сестричкою.<\/i>","steps":[{"do":"Дієприкметник — <i>намальований<\/i>.","why":"Відповідає на питання «який?» і походить від дієслова <i>намалювати<\/i>."},{"do":"Залежні слова: намальований (ким?) <i>сестричкою<\/i>, сестричкою (якою?) <i>молодшою<\/i>.","why":"Усі вони разом із дієприкметником утворюють зворот."},{"do":"Означуване слово — <i>малюнок<\/i>; зворот стоїть після нього.","why":"Тому перед зворотом кома. Після нього кінець речення — друга кома не потрібна."}],"answer":"Зворот — <i>намальований молодшою сестричкою<\/i>; означуване слово — <i>малюнок<\/i>."},{"task":"Розстав коми: <i>Парта пофарбована в зелений колір стояла біля вікна.<\/i>","steps":[{"do":"Граматична основа — <i>парта стояла<\/i>.","why":"Спершу знаходимо підмет і присудок."},{"do":"Зворот — <i>пофарбована в зелений колір<\/i>; означуване слово — <i>парта<\/i>.","why":"Пофарбована (у що?) в колір, колір (який?) зелений."},{"do":"Зворот стоїть після означуваного слова в середині речення.","why":"Виділяємо його комами з обох боків."}],"answer":"<i>Парта, пофарбована в зелений колір, стояла біля вікна.<\/i>"},{"task":"Перестав зворот перед означуване слово й поясни розділові знаки: <i>Поле, засіяне пшеницею, золотилося на сонці.<\/i>","steps":[{"do":"Ставимо зворот перед словом <i>поле<\/i>: <i>Засіяне пшеницею поле…<\/i>","why":"Означуване слово — <i>поле<\/i>."},{"do":"Коми знімаємо.","why":"Зворот перед означуваним словом не виділяємо."},{"do":"Порівняй із займенником: <i>Засіяне пшеницею, воно золотилося на сонці.<\/i>","why":"Зворот при особовому займеннику виділяємо завжди."}],"answer":"<i>Засіяне пшеницею поле золотилося на сонці.<\/i> — без ком."}],"mistakes":["Ставлять кому між зворотом та іменником: «Вкрита листям, стежка вела до річки». Зворот перед означуваним іменником не виділяємо: <i>Вкрита листям стежка вела до річки.<\/i>","Ставлять лише одну кому, коли зворот у середині речення: «Стежка, вкрита листям вела до річки». Такий зворот виділяємо з <b>обох<\/b> боків: <i>Стежка, вкрита листям, вела до річки.<\/i>","Включають у зворот означуване слово. У реченні <i>Вкрита листям стежка вела до річки<\/i> зворот — лише <i>вкрита листям<\/i>."],"check":[{"q":"Пастка: де розділові знаки правильні?","options":["Зібрані в лісі, гриби лежали в кошику.","Зібрані в лісі гриби лежали в кошику.","Гриби зібрані в лісі, лежали в кошику.","Гриби, зібрані в лісі лежали в кошику."],"correct":1,"a":"Зворот <i>зібрані в лісі<\/i> стоїть перед означуваним словом <i>гриби<\/i>, тож коми не потрібні. Якби він стояв після іменника, ми виділили б його з обох боків: <i>Гриби, зібрані в лісі, лежали в кошику.<\/i>"},{"q":"У якому реченні розділові знаки правильні?","options":["Утомлена після тренування вона швидко заснула.","Утомлена, після тренування вона швидко заснула.","Утомлена після тренування, вона швидко заснула."],"correct":2,"a":"Зворот <i>утомлена після тренування<\/i> стосується особового займенника <i>вона<\/i>, тому його виділяємо комою завжди: <i>Утомлена після тренування, вона швидко заснула.<\/i>"},{"q":"Ти пишеш другові: «Повертаю тобі книжку прочитану за вихідні». Де поставити кому?","options":["після слова „книжку“","після слова „прочитану“","кома не потрібна"],"correct":0,"a":"Зворот <i>прочитану за вихідні<\/i> стоїть після означуваного слова <i>книжку<\/i>, тому перед ним кома: <i>Повертаю тобі книжку, прочитану за вихідні.<\/i> Далі кінець речення — друга кома не потрібна."}]}}]},{"id":"U3.3","name":"Правопис дієприкметників","what":"Н чи НН, разом чи окремо з НЕ.","subtopics":[{"id":"U3.3.1","name":"Н у дієприкметниках, НН у прикметниках","status":"ready","programmeRef":"Буква н у дієприкметниках та букви нн у прикметниках дієприкметникового походження.","lesson":{"what":"У <b>дієприкметниках<\/b> пишемо <b>одну<\/b> букву н: <i>зроблений, сказаний, прочитаний<\/i>. Дві букви <b>нн<\/b> пишемо лише в невеликій групі <b>прикметників дієприкметникового походження<\/b> — тобто прикметників, які колись утворилися від дієприкметників, а тепер означають постійну ознаку: <i>нескінченний, бездоганний<\/i>.","ideas":["У дієприкметнику завжди одне н — і з префіксом не-, і з залежними словами: <i>написаний, незакінчений малюнок, не закінчений учора малюнок<\/i>.","Більшість прикметників, що походять від дієприкметників, теж пишемо з одним н: <i>варена картопля, печена риба, смажені гриби, неждані гості<\/i>.","Подвоєне нн пишемо в групі прикметників із наголошеними суфіксами -а́нн-, -е́нн-. Більшість із них означає «такий, якого неможливо…»: <i>нездола́нний<\/i> (неможливо здолати), <i>невблага́нний<\/i>, <i>незліче́нний<\/i> (неможливо злічити), <i>нескінче́нний<\/i>, <i>несказа́нний<\/i> (неможливо сказати словами), <i>недоторка́нний<\/i>; а також <i>бездога́нний, свяще́нний<\/i>.","Ці слова з нн треба запам’ятати. Якщо слова в цьому списку немає, пиши одне н."],"rules":[{"f":"дієприкметник → <b>н<\/b>: <i>зроблений, сказаний, прочитаний, вивчений<\/i>","means":"Суфікси пасивних дієприкметників -н-, -ен- (-єн-) мають одну букву н."},{"f":"<b>нн<\/b>: <i>бездоганний, невблаганний, нездоланний, недоторканний, незліченний, нескінченний, несказанний, священний<\/i>","means":"Невелика група прикметників дієприкметникового походження з наголошеними суфіксами -анн-, -енн-. Їх запам’ятовуємо."}],"examples":[{"task":"Встав н або нн: <i>прочита..ий лист, бездога..ий диктант<\/i>.","steps":[{"do":"<i>Прочитаний<\/i> — від дієслова <i>прочитати<\/i>: лист прочитали.","why":"Це дієприкметник, у ньому одне н."},{"do":"<i>Бездоганний<\/i> — «без догани», такий, якому нема чим дорікнути.","why":"Слово з групи прикметників із нн."}],"answer":"<i>Прочитаний лист, бездоганний диктант.<\/i>"},{"task":"Встав н або нн: <i>нескінче..а розмова, незакінче..ий малюнок<\/i>.","steps":[{"do":"<i>Нескінченна розмова<\/i> — розмова, якій немає кінця.","why":"Прикметник із групи нн (наголос <i>нескінче́нна<\/i>)."},{"do":"<i>Незакінчений малюнок<\/i> — малюнок, який не закінчили.","why":"Це дієприкметник (є дія: закінчити), тому одне н."}],"answer":"<i>Нескінченна розмова, незакінчений малюнок.<\/i>"},{"task":"Знайди помилки в меню шкільної їдальні: <i>Варенна картопля, смажена риба, печенні яблука.<\/i>","steps":[{"do":"<i>Варена<\/i> — прикметник дієприкметникового походження, якого немає в групі з нн.","why":"Отже, пишемо одне н."},{"do":"<i>Смажена<\/i> — написано правильно.","why":"Одне н, як і в більшості таких слів."},{"do":"<i>Печені<\/i> — теж немає в групі з нн.","why":"Пишемо одне н."}],"answer":"<i>Варена картопля, смажена риба, печені яблука.<\/i>"}],"mistakes":["Пишуть нн у дієприкметниках: «зробленний», «сказанний». Правильно: <i>зроблений, сказаний<\/i>.","Пишуть нн у звичайних прикметниках дієприкметникового походження: «варенний», «печенний». Правильно: <i>варений, печений<\/i>.","Пишуть одне н у словах із групи нн: «бездоганий», «невблаганий». Правильно: <i>бездоганний, невблаганний<\/i>."],"check":[{"q":"Встав пропущене й напиши слово повністю: <i>несказа..а радість<\/i>.","accept":["несказанна"],"a":"<i>Несказанна<\/i> радість — така, яку неможливо сказати словами. Це слово з групи прикметників із нн."},{"q":"Пастка: де помилка?","options":["неждані гості","нескінченна дорога","зробленна вправа","недоторканний запас"],"correct":2,"a":"<i>Зроблена<\/i> — дієприкметник, у ньому одне н. <i>Неждані<\/i> теж з одним н, а <i>нескінченна, недоторканний<\/i> — слова з групи нн."},{"q":"Ти пишеш у класний чат: «Домашнє завдання вже …!» Яке слово правильне?","options":["перевірене","перевіренне"],"correct":0,"a":"<i>Перевірене<\/i> — дієприкметник від дієслова <i>перевірити<\/i>, тому одне н."}]}},{"id":"U3.3.2","name":"Не з дієприкметниками","status":"ready","programmeRef":"Написання не з дієприкметниками.","lesson":{"what":"<b>Не<\/b> з дієприкметником пишемо <b>разом<\/b>, якщо при ньому немає залежних слів (<i>непрочитана книжка<\/i>), і <b>окремо<\/b>, якщо залежні слова є (<i>не прочитана мною книжка<\/i>) або якщо дієприкметник є частиною присудка (<i>Книжка не прочитана.<\/i>).","ideas":["Залежні слова — це слова, до яких від дієприкметника можна поставити питання: <i>не прочитана (ким?) мною<\/i>, <i>не скошена (коли?) вчасно<\/i>, <i>(ще) не зібраний<\/i>.","Порівняй: <i>незакінчений малюнок<\/i> (разо
