аного з паперу, без транспортира?","options":["Провести промінь будь-куди між сторонами","Перегнути аркуш через вершину так, щоб сторони кута збіглися","Виміряти лінійкою довжини сторін"],"correct":1,"a":"Лінія згину ділить кут на дві частини, що накладаються одна на одну, тобто на рівні кути — це бісектриса."}],"fig":{"caption":"Промінь OK — бісектриса ∠AOB: ∠AOK = ∠KOB (однакові дуги).","view":[-2,-0.8,4,3.6],"points":{"O":[0,0],"A":[3.5,0],"B":[-0.573,3.25],"K":[2.121,2.528]},"lp":{"O":"s"},"items":[{"t":"ray","p":["O","A"]},{"t":"ray","p":["O","B"]},{"t":"ray","p":["O","K"],"s":"hl"},{"t":"angle","p":["A","O","K"],"arcs":1,"s":"hl"},{"t":"angle","p":["K","O","B"],"arcs":1,"s":"hl"}]}}}]},{"id":"G1.3","name":"Вимірювання відрізків і кутів","what":"Довжина відрізка, відстань між точками, градусна міра кута.","subtopics":[{"id":"G1.3.1","name":"Вимірювання відрізків. Відстань між двома точками","status":"ready","programmeRef":"Вимірювання відрізків і кутів.","lesson":{"what":"Виміряти відрізок — дізнатися, скільки разів у ньому вміщується одиниця довжини (1 мм, 1 см, 1 м). Отримане число — <b>довжина відрізка<\/b>: AB = 5 см. <b>Відстань між точками<\/b> A і B — це довжина відрізка AB.","ideas":["Кожний відрізок має довжину, більшу за нуль.","<b>Рівні відрізки<\/b> — відрізки однакової довжини. На малюнку їх позначають однаковою кількістю рисочок.","Якщо точка C лежить між A і B, то вона ділить відрізок AB на дві частини, і AB = AC + CB.","Якщо невідомо, яка з трьох точок лежить між іншими, треба розглянути всі можливі випадки — відповідей може бути дві.","Перед додаванням довжин переведіть їх в однакові одиниці: 1 см = 10 мм, 1 м = 100 см, 1 км = 1000 м."],"rules":[{"f":"AB = AC + CB, якщо точка C лежить між A і B","means":"Довжина відрізка дорівнює сумі довжин частин, на які його ділить будь-яка його точка."},{"f":"На будь-якому промені від його початку можна відкласти відрізок заданої довжини, і до того ж тільки один.","means":"Так ми будуємо відрізок потрібної довжини: від початку променя відміряємо лінійкою, скільки треба."}],"examples":[{"task":"Точка C лежить між точками A і B, AC = 2,5 см, CB = 3,7 см. Знайдіть AB. Накресліть відрізок AB і позначте на ньому C.","steps":[{"do":"Дано: C лежить між A і B, AC = 2,5 см, CB = 3,7 см. Знайти: AB.","why":"Записуємо умову.","hl":["s1","s2"]},{"do":"AB = AC + CB.","why":"Бо довжина відрізка дорівнює сумі довжин частин, на які його ділить точка C.","hl":["s1","s2"]},{"do":"AB = 2,5 + 3,7 = 6,2 (см).","why":"Додаємо десяткові дроби: кома під комою.","hl":["lq"]}],"answer":"Відповідь: AB = 6,2 см.","fig":{"caption":"Відрізок AB, точка C між A і B; AC = 2,5 см, CB = 3,7 см, AB — ?","view":[-0.7,-1,6.9,0.9],"points":{"A":[0,0],"C":[2.5,0],"B":[6.2,0]},"lp":{"A":"n","C":"n","B":"n"},"items":[{"t":"seg","p":["A","C"],"s":"hl","id":"s1"},{"t":"seg","p":["C","B"],"s":"hl2","id":"s2"},{"t":"label","at":[1.25,0.35],"text":"2,5 см"},{"t":"label","at":[4.35,0.35],"text":"3,7 см"},{"t":"label","at":[3.1,-0.6],"text":"AB = ?","id":"lq"}],"check":[{"len":[["A","C"],2.5]},{"len":[["C","B"],3.7]},{"col":["A","C","B"]}]}},{"task":"Відрізок AB = 4 см 5 мм. Точка C лежить між A і B, AC = 18 мм. Знайдіть CB. Накресліть такий відрізок у зошиті й перевірте лінійкою.","steps":[{"do":"Переводимо в однакові одиниці: 4 см 5 мм = 40 мм + 5 мм = 45 мм.","why":"1 см = 10 мм; додавати й віднімати можна лише однакові одиниці.","hl":["lt"]},{"do":"AB = AC + CB, тобто 45 = 18 + CB.","why":"Бо C лежить між A і B — довжина відрізка дорівнює сумі його частин.","hl":["s1","s2"]},{"do":"CB = 45 − 18 = 27 (мм) = 2,7 см.","why":"Невідомий доданок = сума − відомий доданок.","hl":["s2","lq"]}],"answer":"Відповідь: CB = 27 мм (2,7 см).","fig":{"caption":"Відрізок AB = 4 см 5 мм, точка C між A і B; AC = 18 мм, CB — ? (масштаб: 1 одиниця = 1 см).","view":[-0.7,-1,5.2,0.9],"points":{"A":[0,0],"C":[1.8,0],"B":[4.5,0]},"lp":{"A":"n","C":"n","B":"n"},"items":[{"t":"seg","p":["A","C"],"s":"hl","id":"s1"},{"t":"seg","p":["C","B"],"s":"hl2","id":"s2"},{"t":"label","at":[0.9,0.35],"text":"18 мм"},{"t":"label","at":[3.15,0.35],"text":"?","id":"lq"},{"t":"label","at":[2.25,-0.6],"text":"AB = 4 см 5 мм","id":"lt"}],"check":[{"len":[["A","B"],4.5]},{"len":[["A","C"],1.8]},{"col":["A","C","B"]}]}},{"task":"Точки A, B, C лежать на одній прямій, AB = 8 см, BC = 3 см. Знайдіть AC. Розгляньте всі можливі випадки і для кожного зробіть окремий малюнок у зошиті.","steps":[{"do":"Дано: A, B, C на одній прямій, AB = 8 см, BC = 3 см. Знайти: AC. Невідомо, яка точка лежить між двома іншими, тому розглядаємо три випадки.","why":"З трьох точок на прямій одна і тільки одна лежить між двома іншими.","hl":["sab","lab"]},{"do":"Випадок 1: C між A і B (на малюнку — точка C₁). Тоді AB = AC + CB, тобто 8 = AC + 3, AC = 8 − 3 = 5 (см).","why":"Довжина відрізка дорівнює сумі довжин його частин.","hl":["s1","q1"]},{"do":"Випадок 2: B між A і C (на малюнку — точка C₂). Тоді AC = AB + BC = 8 + 3 = 11 (см).","why":"Та сама властивість: AC складається з частин AB і BC.","hl":["s2","q2"]},{"do":"Випадок 3: A між B і C. Тоді BC = BA + AC, тобто 3 = 8 + AC — неможливо, бо частина не може бути довшою за весь відрізок.","why":"Довжина відрізка AC має бути більшою за нуль."}],"answer":"Відповідь: AC = 5 см (якщо C лежить між A і B) або AC = 11 см (якщо B лежить між A і C).","fig":{"caption":"Обидва можливі випадки на одній прямій: AB = 8 см; випадок 1 — точка C₁ між A і B; випадок 2 — точка C₂ за точкою B, тобто B між A і C₂. BC₁ = BC₂ = 3 см.","view":[-0.8,-1.1,11.8,1.1],"points":{"A":[0,0],"C1":[5,0],"B":[8,0],"C2":[11,0]},"lp":{"A":"n","C1":"n","B":"n","C2":"n"},"items":[{"t":"seg","p":["A","B"],"id":"sab"},{"t":"seg","p":["C1","B"],"ticks":1,"s":"hl","id":"s1"},{"t":"seg","p":["B","C2"],"ticks":1,"s":"hl2","id":"s2"},{"t":"label","at":[2.5,0.4],"text":"AC₁ = ?","id":"q1"},{"t":"label","at":[4,-0.6],"text":"AB = 8 см","id":"lab"},{"t":"label","at":[6.5,0.4],"text":"3 см"},{"t":"label","at":[9.5,0.4],"text":"3 см"},{"t":"label","at":[8.8,-0.6],"text":"AC₂ = ?","id":"q2"}],"check":[{"len":[["A","B"],8]},{"len":[["B","C1"],3]},{"len":[["B","C2"],3]},{"col":["A","C1","B"]},{"col":["A","B","C2"]}]}}],"mistakes":["Розглядати лише один випадок і завжди додавати. Якщо точка лежить не між іншими, відстань може бути різницею.","Додавати довжини в різних одиницях (наприклад, 3 см + 5 мм = 8). Спершу переведіть: 30 мм + 5 мм = 35 мм.","Прикладати лінійку не від нуля, а від її краю."],"check":[{"q":"<b>Пастка.<\/b> Точки K, L, M лежать на прямій; KL = 4 см, LM = 6 см, KM = 10 см. Яка точка лежить між двома іншими?","options":["M","K","L"],"correct":2,"a":"L, бо KL + LM = 4 + 6 = 10 = KM."},{"q":"Дім, магазин і школа стоять уздовж прямої дороги, магазин — між домом і школою. Від дому до школи 1,2 км, від дому до магазину 0,5 км. Скільки кілометрів від магазину до школи?","accept":["0,7"],"a":"1,2 − 0,5 = 0,7 км, бо відстань від дому до школи — сума двох частин.","fig":{"caption":"Пряма дорога: дім Д, магазин М між домом і школою, школа Ш. ДМ = 0,5 км, ДШ = 1,2 км, МШ — ?","view":[-0.7,-1,6.7,0.9],"points":{"Д":[0,0],"М":[2.5,0],"Ш":[6,0]},"lp":{"Д":"n","М":"n","Ш":"n"},"items":[{"t":"seg","p":["Д","М"],"s":"hl"},{"t":"seg","p":["М","Ш"],"s":"hl2"},{"t":"label","at":[1.25,0.35],"text":"0,5 км"},{"t":"label","at":[4.25,0.35],"text":"?"},{"t":"label","at":[3,-0.6],"text":"ДШ = 1,2 км"}],"check":[{"col":["Д","М","Ш"]}]}},{"q":"Точки M, N, P лежать на одній прямій, MN = 7 см, NP = 2 см. Знайдіть MP у сантиметрах. Запишіть обидві можливі відповіді через «;» — від меншої до більшої.","accept":["5; 9","9; 5"],"a":"Якщо P між M і N: MP = 7 − 2 = 5 см. Якщо N між M і P: MP = 7 + 2 = 9 см. Точка M між N і P бути не може (2 = 7 + MP — неможливо)."}],"fig":{"caption":"Зверху: точка C лежить між A і B, тому AB = AC + CB. Знизу: відрізки MN і PQ рівні — на них однакові рисочки.","view":[-0.8,-1.5,7.2,2.3],"points":{"A":[0,1.5],"C":[2,1.5],"B":[5,1.5],"M":[0,0],"N":[3,0],"P":[3.8,-0.9],"Q":[6.619,0.126]},"lp":{"A":"n","C":"n","B":"n","M":"s","N":"s","P":"s","Q":"n"},"items":[{"t":"seg","p":["A","C"],"s":"hl"},{"t":"seg","p":["C","B"],"s":"hl2"},{"t":"seg","p":["M","N"],"ticks":1},{"t":"seg","p":["P","Q"],"ticks":1}],"check":[{"col":["A","C","B"]},{"eq":[["M","N"],["P","Q"]]}]}}},{"id":"G1.3.2","name":"Вимірювання кутів","status":"ready","programmeRef":"Вимірювання відрізків і кутів.","lesson":{"what":"Кути вимірюють у <b>градусах<\/b> за допомогою <b>транспортира<\/b>. 1° — це 1/180 частина розгорнутого кута. Скільки градусів уміщується в куті — це його <b>градусна міра<\/b>.","ideas":["Кожний кут має градусну міру, більшу за 0°. Розгорнутий кут дорівнює 180°.","Як міряти: центр транспортира — у вершину кута; нульова позначка шкали — на одній стороні; число читаємо там, де шкалу перетинає друга сторона, <b>на тій самій шкалі<\/b>, що починається з нуля.","На транспортирі дві шкали (зовнішня і внутрішня). Звіряйтеся з видом кута: гострий кут не може мати 140°.","Якщо промінь OC проходить між сторонами ∠AOB, то ∠AOB = ∠AOC + ∠COB.","Від будь-якого променя в заданий бік від нього можна відкласти кут заданої градусної міри, меншої за 180°, і тільки один."],"rules":[{"f":"∠AOB = ∠AOC + ∠COB, якщо промінь OC проходить між сторонами ∠AOB","means":"Градусна міра кута дорівнює сумі градусних мір кутів, на які його ділить промінь, що проходить між сторонами."},{"f":"Розгорнутий кут = 180°","means":"1° — це 1/180 частина розгорнутого кута."}],"examples":[{"task":"Промінь OC проходить між сторонами ∠AOB, ∠AOC = 25°, ∠COB = 47°. Знайдіть ∠AOB. Накресліть кут і промінь OC.","steps":[{"do":"Дано: OC між сторонами ∠AOB, ∠AOC = 25°, ∠COB = 47°. Знайти: ∠AOB.","why":"Записуємо умову.","hl":["rc"]},{"do":"∠AOB = ∠AOC + ∠COB.","why":"Бо градусна міра кута дорівнює сумі кутів, на які його ділить промінь між сторонами.","hl":["a1","a2"]},{"do":"∠AOB = 25° + 47° = 72°.","why":"Додаємо градусні міри.","hl":["a3"]}],"answer":"Відповідь: ∠AOB = 72°.","fig":{"caption":"Промінь OC між сторонами ∠AOB; ∠AOC = 25°, ∠COB = 47°, ∠AOB — ?","view":[-1.5,-0.8,4.2,3.8],"points":{"O":[0,0],"A":[3.6,0],"C":[3.172,1.479],"B":[1.051,3.234]},"lp":{"O":"s"},"items":[{"t":"ray","p":["O","A"]},{"t":"ray","p":["O","B"]},{"t":"ray","p":["O","C"],"s":"hl","id":"rc"},{"t":"angle","p":["A","O","C"],"label":"25°","s":"hl","id":"a1"},{"t":"angle","p":["C","O","B"],"label":"47°","s":"hl2","id":"a2"},{"t":"angle","p":["A","O","B"],"label":"?","id":"a3"}],"check":[{"ang":[["A","O","B"],72]}]}},{"task":"Учень приклав транспортир до ∠AOB: центр — у вершині O, сторона OA проходить через нуль внутрішньої шкали. Сторона OB перетинає дугу там, де на внутрішній шкалі 35, а на зовнішній — 145. На малюнку кут гострий. Скільки градусів у ∠AOB?","steps":[{"do":"Центр транспортира у вершині, нуль шкали — на стороні OA: прикладено правильно.","why":"Так вимірюють кут транспортиром.","hl":["ra","i0"]},{"do":"Читаємо ту шкалу, на якій нуль лежить на OA, — внутрішню: 35°.","why":"Число беремо зі шкали, що починається з нуля на стороні кута.","hl":["i0","i35","rb"]},{"do":"Перевірка: кут гострий, 35° < 90° — збігається; 145° був би тупим. До того ж 35° + 145° = 180°: дві шкали «доповнюють» одна одну.","why":"Класифікація кутів допомагає помітити неправильну шкалу.","hl":["a1","o145"]}],"answer":"Відповідь: ∠AOB = 35°.","fig":{"caption":"Транспортир прикладено до ∠AOB: центр у вершині O, сторона OA проходить через 0 внутрішньої шкали. Сторона OB перетинає дугу біля 35 на внутрішній шкалі і 145 на зовнішній. Кут гострий.","view":[-4.1,-0.7,4.3,4],"points":{"O":[0,0],"A":[4,0],"B":[3.195,2.237],"U":[-3,0],"V":[3,0]},"hide":["U","V"],"lp":{"O":"s","A":"s","B":"ne"},"items":[{"t":"circle","c":"O","r":3,"s":"faint"},{"t":"seg","p":["U","V"],"s":"faint"},{"t":"ray","p":["O","A"],"s":"hl","id":"ra"},{"t":"ray","p":["O","B"],"id":"rb"},{"t":"angle","p":["A","O","B"],"label":"?","id":"a1"},{"t":"label","at":[2.547,0.133],"text":"0","id":"i0"},{"t":"label","at":[3.445,0.181],"text":"180","id":"o180"},{"t":"label","at":[1.982,1.605],"text":"35","id":"i35"},{"t":"label","at":[2.681,2.171],"text":"145","id":"o145"},{"t":"label","at":[-2.547,0.133],"text":"180"},{"t":"label","at":[-3.445,0.181],"text":"0"}],"check":[{"ang":[["A","O","B"],35]},{"col":["U","O","A"]}]}},{"task":"∠AOB = 80°, ∠BOC = 30°. Знайдіть ∠AOC. Розгляньте всі можливі випадки і накресліть у зошиті кожен.","steps":[{"do":"Дано: ∠AOB = 80°, ∠BOC = 30°. Знайти: ∠AOC. Невідомо, як розміщені промені, тому розглядаємо випадки.","why":"Промінь OC може лежати всередині ∠AOB або поза ним.","hl":["a0","a1","a2"]},{"do":"Випадок 1: OC проходить між сторонами ∠AOB (на малюнку — промінь OC₁). Тоді ∠AOB = ∠AOC + ∠COB: 80° = ∠AOC + 30°, ∠AOC = 80° − 30° = 50°.","why":"Кут дорівнює сумі кутів, на які його ділить промінь між сторонами.","hl":["rc1","a1","a3"]},{"do":"Випадок 2: OB проходить між сторонами ∠AOC (на малюнку — промінь OC₂). Тоді ∠AOC = ∠AOB + ∠BOC = 80° + 30° = 110°.","why":"Та сама властивість для кута AOC.","hl":["rc2","a2","a4"]},{"do":"Випадок 3: OA між сторонами ∠BOC. Тоді 30° = 80° + ∠AOC — неможливо.","why":"Частина кута не може бути більшою за весь кут."}],"answer":"Відповідь: ∠AOC = 50° (якщо OC між OA і OB) або ∠AOC = 110° (якщо OB між OA і OC).","fig":{"caption":"Обидва можливі випадки на одному малюнку: ∠AOB = 80°; випадок 1 — промінь OC₁ між OA і OB; випадок 2 — промінь OC₂ поза кутом, OB між OA і OC₂. ∠BOC₁ = ∠BOC₂ = 30°.","view":[-2.5,-0.8,4.2,4],"points":{"O":[0,0],"A":[3.7,0],"C1":[2.25,2.681],"B":[0.608,3.447],"C2":[-1.197,3.289]},"lp":{"O":"s"},"items":[{"t":"ray","p":["O","A"]},{"t":"ray","p":["O","B"]},{"t":"ray","p":["O","C1"],"s":"hl","id":"rc1"},{"t":"ray","p":["O","C2"],"s":"hl2","id":"rc2"},{"t":"angle","p":["A","O","B"],"label":"80°","id":"a0"},{"t":"angle","p":["C1","O","B"],"label":"30°","s":"hl","id":"a1"},{"t":"angle","p":["B","O","C2"],"label":"30°","s":"hl2","id":"a2"},{"t":"angle","p":["A","O","C1"],"label":"?","id":"a3"},{"t":"angle","p":["A","O","C2"],"label":"?","id":"a4"}]}}],"mistakes":["Читати число не з тієї шкали транспортира (140° замість 40°). Перевіряйте: гострий кут менший за 90°.","Ставити центр транспортира не у вершину кута або не суміщати нуль шкали зі стороною.","Розглядати лише один випадок розміщення променів, коли в задачі немає малюнка."],"check":[{"q":"<b>Пастка.<\/b> Учень виміряв гострий кут і прочитав 130° — не з тієї шкали. Скільки градусів насправді має цей кут? Введіть число.","accept":["50"],"a":"Дві шкали в сумі дають 180°: 180° − 130° = 50°. Гострий кут і має бути менший за 90°."},{"q":"Скільки градусів кут між стрілками годинника о 4:00? Введіть число.","accept":["120"],"a":"4 поділки по 30°: 4 · 30° = 120°.","fig":{"caption":"Циферблат о 4:00: хвилинна стрілка на 12, годинна на 4; кут між ними — ?","view":[-3,-3,3,3],"points":{"O":[0,0],"M":[0,1.8],"H":[1.126,-0.65]},"hide":["O","M","H"],"items":[{"t":"circle","c":"O","r":2.5},{"t":"label","at":[0,2.1],"text":"12"},{"t":"label","at":[2.1,0],"text":"3"},{"t":"label","at":[1.819,-1.05],"text":"4"},{"t":"label","at":[0,-2.1],"text":"6"},{"t":"label","at":[-2.1,0],"text":"9"},{"t":"seg","p":["O","M"]},{"t":"seg","p":["O","H"],"s":"hl2"},{"t":"angle","p":["M","O","H"],"label":"?","s":"hl"}]}},{"q":"∠AOB = 70°, ∠BOC = 45°. Знайдіть ∠AOC у градусах. Запишіть обидві можливі відповіді через «;» — від меншої до більшої.","accept":["25; 115","115; 25"],"a":"Якщо OC між OA і OB: 70° − 45° = 25°. Якщо OB між OA і OC: 70° + 45° = 115°."}],"fig":{"caption":"Промінь OC проходить між сторонами ∠AOB, тому ∠AOB = ∠AOC + ∠COB: 100° = 35° + 65°.","view":[-2,-0.8,4.2,3.8],"points":{"O":[0,0],"A":[3.6,0],"C":[2.785,1.95],"B":[-0.573,3.25]},"lp":{"O":"s"},"items":[{"t":"ray","p":["O","A"]},{"t":"ray","p":["O","B"]},{"t":"ray","p":["O","C"],"s":"hl"},{"t":"angle","p":["A","O","C"],"label":"35°","s":"hl"},{"t":"angle","p":["C","O","B"],"label":"65°","s":"hl2"},{"t":"angle","p":["A","O","B"],"label":"100°"}]}}}]}]},{"id":"G2","subject":"geometry","name":"Взаємне розміщення прямих на площині","what":"Як прямі можуть розташовуватися одна щодо одної: перетинатися, бути перпендикулярними чи паралельними.","topics":[{"id":"G2.1","name":"Суміжні та вертикальні кути","what":"Кути, що утворюються, коли прямі перетинаються.","subtopics":[{"id":"G2.1.1","name":"Суміжні кути","status":"ready","programmeRef":"Суміжні та вертикальні кути, їх властивості.","lesson":{"what":"Два кути називають <b>суміжними<\/b>, якщо одна сторона в них спільна, а дві інші разом утворюють пряму. У цьому уроці з'являються слова, якими говорить уся геометрія: <b>означення<\/b> (пояснює, що означає нове слово), <b>теорема<\/b> (твердження, яке доводять) і <b>наслідок<\/b> (те, що одразу випливає з теореми).","fig":{"caption":"Пряма AB, точка O на ній, промінь OC. Суміжні кути: ∠AOC = 125° і ∠COB = 55°.","view":[-5,-1,5,4],"points":{"A":[-4,0],"O":[0,0],"B":[4,0],"C":[2.008,2.867]},"lp":{"O":"s","C":"ne"},"items":[{"t":"line","p":["A","B"]},{"t":"ray","p":["O","C"],"s":"hl"},{"t":"angle","p":["A","O","C"],"label":"125°","s":"hl2"},{"t":"angle","p":["C","O","B"],"label":"55°","s":"hl"}],"check":[{"col":["A","O","B"]},{"ang":[["A","O","C"],125]},{"ang":[["C","O","B"],55]}]},"ideas":["<b>Означення.<\/b> ∠AOC і ∠COB — суміжні, якщо OC — їхня спільна сторона, а промені OA і OB доповнюють один одного до прямої AB.","<b>Теорема<\/b> складається з <b>умови<\/b> (що дано) і <b>вимоги<\/b> (що треба довести). «Якщо два кути суміжні (умова), то їхня сума дорівнює 180° (вимога)».","<b>Доведення.<\/b> Суміжні кути разом складають розгорнутий кут AOB, а промінь OC проходить між його сторонами. Тому ∠AOC + ∠COB = ∠AOB = 180°.","<b>Наслідки:<\/b> кут, суміжний із прямим, — прямий; суміжний із гострим — тупий; суміжний із тупим — гострий. Якщо суміжні кути рівні, то кожен з них дорівнює 90°."],"rules":[{"f":"∠AOC + ∠COB = 180°","means":"Сума суміжних кутів дорівнює 180°."},{"f":"∠2 = 180° − ∠1","means":"Знаючи один із суміжних кутів, другий знаходимо відніманням від 180°."}],"examples":[{"task":"Один із суміжних кутів дорівнює 47°. Знайдіть другий кут.","fig":{"caption":"Пряма AB, точка O на ній, промінь OC; ∠COB = 47°, ∠AOC — шуканий.","view":[-5,-1,5,3.5],"points":{"A":[-4,0],"O":[0,0],"B":[4,0],"C":[2.182,2.34]},"lp":{"O":"s","C":"ne"},"items":[{"t":"line","p":["A","B"],"id":"l"},{"t":"ray","p":["O","C"]},{"t":"angle","p":["C","O","B"],"label":"47°","s":"hl","id":"a1"},{"t":"angle","p":["A","O","C"],"label":"?","s":"hl2","id":"a2"}],"check":[{"col":["A","O","B"]},{"ang":[["C","O","B"],47]}]},"steps":[{"do":"Дано: ∠COB і ∠AOC — суміжні, ∠COB = 47°. Знайти: ∠AOC.","why":"Записуємо умову.","hl":["a1","a2"]},{"do":"∠AOC + ∠COB = 180°.","why":"Бо сума суміжних кутів дорівнює 180°.","hl":["l"]},{"do":"∠AOC = 180° − 47° = 133°.","why":"Віднімаємо відомий кут від 180°.","hl":["a2"]},{"do":"Перевірка: 133° + 47° = 180°. Кут 133° тупий — і справді, суміжний із гострим кутом тупий.","why":"Наслідок з теореми про суміжні кути.","hl":["a1","a2"]}],"answer":"Відповідь: 133°."},{"task":"∠1 і ∠2 — суміжні, причому ∠2 на 40° більший за ∠1. Знайдіть ці кути.","fig":{"caption":"Пряма AB, точка O, промінь OC; ∠1 = ∠COB, ∠2 = ∠AOC — суміжні кути, ∠2 більший.","view":[-5,-1,5,4],"points":{"A":[-4,0],"O":[0,0],"B":[4,0],"C":[1.197,3.289]},"lp":{"O":"s","C":"n"},"items":[{"t":"line","p":["A","B"]},{"t":"ray","p":["O","C"]},{"t":"angle","p":["C","O","B"],"label":"1","s":"hl","id":"a1"},{"t":"angle","p":["A","O","C"],"label":"2","s":"hl2","id":"a2"}],"check":[{"col":["A","O","B"]}]},"steps":[{"do":"Дано: ∠1 і ∠2 — суміжні, ∠2 = ∠1 + 40°. Знайти: ∠1, ∠2.","why":"Записуємо умову."},{"do":"Нехай ∠1 = x, тоді ∠2 = x + 40°.","why":"Менший кут позначаємо буквою, більший виражаємо через нього.","hl":["a1","a2"]},{"do":"x + x + 40° = 180°, 2x = 140°, x = 70°.","why":"Бо сума суміжних кутів дорівнює 180°."},{"do":"∠1 = 70°, ∠2 = 70° + 40° = 110°. Перевірка: 70° + 110° = 180°.","why":"Підставляємо x.","hl":["a1","a2"]}],"answer":"Відповідь: ∠1 = 70°, ∠2 = 110°."},{"task":"Суміжні кути відносяться як 2 : 7. Знайдіть ці кути.","fig":{"caption":"Пряма AB, точка O, промінь OC; ∠1 = ∠COB і ∠2 = ∠AOC — суміжні, ∠1 : ∠2 = 2 : 7.","view":[-5,-1,5,3],"points":{"A":[-4,0],"O":[0,0],"B":[4,0],"C":[2.681,2.25]},"lp":{"O":"s","C":"ne"},"items":[{"t":"line","p":["A","B"]},{"t":"ray","p":["O","C"]},{"t":"angle","p":["C","O","B"],"label":"1","s":"hl","id":"a1"},{"t":"angle","p":["A","O","C"],"label":"2","s":"hl2","id":"a2"}],"check":[{"col":["A","O","B"]}]},"steps":[{"do":"Нехай ∠1 = 2x, ∠2 = 7x.","why":"«Відносяться як 2 : 7» означає: у першому 2 однакові частини, у другому 7 таких частин.","hl":["a1","a2"]},{"do":"2x + 7x = 180°, 9x = 180°, x = 20°.","why":"Бо сума суміжних кутів дорівнює 180°."},{"do":"∠1 = 2 · 20° = 40°, ∠2 = 7 · 20° = 140°.","why":"Множимо кількість частин на одну частину.","hl":["a1","a2"]},{"do":"Перевірка: 40° + 140° = 180°, а 140 : 40 = 7 : 2.","why":"Обидві умови виконано."}],"answer":"Відповідь: 40° і 140°."}],"mistakes":["Вважати суміжними будь-які два кути зі спільною стороною. Потрібно ще, щоб дві інші сторони утворювали пряму.","У задачі «один кут на 40° більший» писати x + 40° = 180°. Правильно: x + (x + 40°) = 180° — додаємо обидва кути.","Плутати умову і вимогу теореми. Умова — після «якщо» (що дано), вимога — після «то» (що треба довести)."],"check":[{"q":"<b>Пастка.<\/b> Кути AOC і COB мають спільну сторону OC (див. малюнок). Чи обов'язково вони суміжні?","fig":{"caption":"Промені OA, OC і OB з однієї точки O; промені OA і OB не утворюють пряму.","view":[-5,-2.5,5,4],"points":{"O":[0,0],"A":[-4.0,0.0],"C":[-1.197,3.289],"B":[3.464,2.0]},"lp":{"O":"s"},"items":[{"t":"ray","p":["O","A"]},{"t":"ray","p":["O","C"],"s":"hl"},{"t":"ray","p":["O","B"]},{"t":"angle","p":["A","O","C"]},{"t":"angle","p":["C","O","B"]}]},"options":["Так, бо в них спільна сторона","Ні: ще треба, щоб OA і OB утворювали пряму","Так, якщо обидва кути гострі"],"correct":1,"a":"Спільної сторони мало. Суміжні кути разом утворюють розгорнутий кут, тобто OA і OB мають лежати на одній прямій. Тут ∠AOC + ∠COB менше за 180°."},{"q":"Драбина стоїть на рівній підлозі й утворює з підлогою кут 65°. Який кут утворює драбина з підлогою з іншого боку від неї? Введіть число.","accept":["115"],"a":"Ці два кути суміжні: підлога — пряма, драбина — спільна сторона. 180° − 65° = 115°."},{"q":"Теорема: «Якщо два кути суміжні, то їхня сума дорівнює 180°». Що в ній є <b>умовою<\/b>?","options":["Два кути суміжні","Сума кутів дорівнює 180°","Кути рівні","Уся теорема цілком"],"correct":0,"a":"Умова — те, що дано (після «якщо»): кути суміжні. Вимога — те, що доводимо (після «то»): їхня сума 180°."}]}},{"id":"G2.1.2","name":"Вертикальні кути","status":"ready","programmeRef":"Суміжні та вертикальні кути, їх властивості.","lesson":{"what":"Коли дві прямі перетинаються, утворюються чотири кути. Два з них, що лежать «навпроти» один одного, називають <b>вертикальними<\/b>: сторони одного кута є продовженнями сторін другого.","fig":{"caption":"Прямі AB і CD перетинаються в точці O. Вертикальні кути: ∠1 = ∠AOC і ∠3 = ∠BOD (по одній дузі), ∠2 = ∠COB і ∠4 = ∠DOA (по дві дуги).","view":[-5,-3.5,5,3.5],"points":{"A":[-4,0],"B":[4,0],"O":[0,0],"C":[-2.25,2.681],"D":[2.25,-2.681]},"lp":{"O":"s","C":"nw","D":"se"},"items":[{"t":"line","p":["A","B"]},{"t":"line","p":["C","D"]},{"t":"angle","p":["A","O","C"],"label":"1","s":"hl","arcs":1},{"t":"angle","p":["C","O","B"],"label":"2","s":"hl2","arcs":2},{"t":"angle","p":["B","O","D"],"label":"3","s":"hl","arcs":1},{"t":"angle","p":["D","O","A"],"label":"4","s":"hl2","arcs":2}],"check":[{"col":["A","O","B"]},{"col":["C","O","D"]}]},"ideas":["<b>Означення.<\/b> Два кути вертикальні, якщо сторони одного кута є доповняльними променями сторін другого. При перетині двох прямих — дві пари вертикальних кутів.","<b>Теорема.<\/b> Вертикальні кути рівні. <b>Доведення:<\/b> ∠1 + ∠2 = 180° і ∠3 + ∠2 = 180°, бо це суміжні кути. Отже, ∠1 = 180° − ∠2 = ∠3.","Досить знати один із чотирьох кутів, щоб знайти всі: якщо ∠1 = α, то ∠3 = α, а ∠2 = ∠4 = 180° − α.","Сусідні кути при перетині (∠1 і ∠2) — суміжні, протилежні (∠1 і ∠3) — вертикальні.","<b>Обернене твердження<\/b> — це коли умову і вимогу міняють місцями: «якщо кути рівні, то вони вертикальні». Воно <b>хибне<\/b>: рівні кути можуть лежати будь-де."],"rules":[{"f":"∠1 = ∠3, ∠2 = ∠4","means":"Вертикальні кути рівні."},{"f":"∠1 + ∠2 = 180°","means":"Сусідні кути при перетині двох прямих — суміжні."}],"examples":[{"task":"Прямі AB і CD перетинаються в точці O, ∠AOC = 38°. Знайдіть ∠BOD, ∠COB і ∠DOA.","fig":{"caption":"Прямі AB і CD перетинаються в точці O; ∠AOC = 38°, інші три кути шукані.","view":[-5,-3.5,5,3.5],"points":{"A":[-4,0],"B":[4,0],"O":[0,0],"C":[-2.758,2.155],"D":[2.758,-2.155]},"lp":{"O":"s","C":"nw","D":"se"},"items":[{"t":"line","p":["A","B"]},{"t":"line","p":["C","D"]},{"t":"angle","p":["A","O","C"],"label":"38°","s":"hl","id":"aoc"},{"t":"angle","p":["B","O","D"],"label":"?","s":"hl2","id":"bod"},{"t":"angle","p":["C","O","B"],"label":"?","id":"cob"},{"t":"angle","p":["D","O","A"],"label":"?","id":"doa"}],"check":[{"col":["A","O","B"]},{"col":["C","O","D"]},{"ang":[["A","O","C"],38]}]},"steps":[{"do":"∠BOD = ∠AOC = 38°.","why":"Бо вертикальні кути рівні.","hl":["aoc","bod"]},{"do":"∠COB = 180° − 38° = 142°.","why":"Бо ∠AOC і ∠COB — суміжні.","hl":["aoc","cob"]},{"do":"∠DOA = ∠COB = 142°.","why":"Бо вертикальні кути рівні.","hl":["cob","doa"]},{"do":"Перевірка: 38° + 142° + 38° + 142° = 360°.","why":"Дві пари суміжних кутів: 180° + 180°."}],"answer":"Відповідь: ∠BOD = 38°, ∠COB = ∠DOA = 142°."},{"task":"Сума двох кутів, що утворилися при перетині двох прямих, дорівнює 210°. Знайдіть усі чотири кути.","fig":{"caption":"Дві прямі перетинаються в точці O; ∠1 і ∠3 вертикальні, ∠2 і ∠4 вертикальні.","view":[-5,-3.5,5,3.5],"points":{"A":[-4,0],"B":[4,0],"O":[0,0],"C":[0.906,3.381],"D":[-0.906,-3.381]},"lp":{"O":"s","C":"n","D":"s"},"items":[{"t":"line","p":["A","B"]},{"t":"line","p":["C","D"]},{"t":"angle","p":["A","O","C"],"label":"1","s":"hl","arcs":1,"id":"a1"},{"t":"angle","p":["C","O","B"],"label":"2","s":"hl2","arcs":2,"id":"a2"},{"t":"angle","p":["B","O","D"],"label":"3","s":"hl","arcs":1,"id":"a3"},{"t":"angle","p":["D","O","A"],"label":"4","s":"hl2","arcs":2,"id":"a4"}],"check":[{"col":["A","O","B"]},{"col":["C","O","D"]}]},"steps":[{"do":"Сусідні кути — суміжні, їхня сума 180°, а не 210°. Отже, це вертикальні кути, наприклад ∠1 і ∠3.","why":"Будь-які два кути при перетині — або суміжні, або вертикальні.","hl":["a1","a3"]},{"do":"∠1 = ∠3 = 210° : 2 = 105°.","why":"Бо вертикальні кути рівні.","hl":["a1","a3"]},{"do":"∠2 = 180° − 105° = 75°.","why":"Бо ∠1 і ∠2 — суміжні.","hl":["a1","a2"]},{"do":"∠4 = ∠2 = 75°.","why":"Бо вертикальні кути рівні.","hl":["a2","a4"]}],"answer":"Відповідь: 105°, 75°, 105°, 75°."},{"task":"Прямі AB і CD перетинаються в точці O, ∠AOD у 4 рази менший від ∠AOC. Знайдіть ∠BOC і ∠BOD.","fig":{"caption":"Прямі AB і CD перетинаються в точці O; ∠AOD = x, ∠AOC = 4x; шукані ∠BOC і ∠BOD.","view":[-5,-3.5,5,3.5],"points":{"A":[-4,0],"B":[4,0],"O":[0,0],"C":[2.832,2.057],"D":[-2.832,-2.057]},"lp":{"O":"n","C":"ne","D":"sw"},"items":[{"t":"line","p":["A","B"]},{"t":"line","p":["C","D"]},{"t":"angle","p":["D","O","A"],"label":"x","s":"hl","id":"aod"},{"t":"angle","p":["A","O","C"],"label":"4x","s":"hl","id":"aoc"},{"t":"angle","p":["C","O","B"],"label":"?","s":"hl2","id":"boc"},{"t":"angle","p":["B","O","D"],"label":"?","s":"hl2","id":"bod"}],"check":[{"col":["A","O","B"]},{"col":["C","O","D"]}]},"steps":[{"do":"Нехай ∠AOD = x, тоді ∠AOC = 4x.","why":"Менший кут позначаємо буквою.","hl":["aod","aoc"]},{"do":"x + 4x = 180°, 5x = 180°, x = 36°. Отже, ∠AOD = 36°, ∠AOC = 144°.","why":"Бо ∠AOD і ∠AOC — суміжні (OC і OD утворюють пряму CD).","hl":["aod","aoc"]},{"do":"∠BOC = ∠AOD = 36°.","why":"Бо вертикальні кути рівні.","hl":["boc","aod"]},{"do":"∠BOD = ∠AOC = 144°.","why":"Бо вертикальні кути рівні.","hl":["bod","aoc"]}],"answer":"Відповідь: ∠BOC = 36°, ∠BOD = 144°."}],"mistakes":["Думати, що рівні кути обов'язково вертикальні. Це обернене твердження, і воно хибне.","Вважати, що сума двох будь-яких кутів при перетині дорівнює 180°. Так лише для сусідніх (суміжних); вертикальні — рівні.","Шукати вертикальний кут «поруч». Вертикальний кут лежить навпроти, через точку перетину."],"check":[{"q":"Дві прямі дороги перехрещуються. Один із кутів між ними 72°. Знайдіть тупий кут на цьому перехресті. Введіть число.","accept":["108"],"a":"Тупий кут — суміжний із кутом 72°: 180° − 72° = 108°. Інший тупий кут — вертикальний з ним, теж 108°."},{"q":"Прямі AB і CD перетинаються в точці O, ∠AOC + ∠BOD = 100°. Знайдіть ∠AOD (див. малюнок). Введіть число.","fig":{"caption":"Прямі AB і CD перетинаються в точці O; ∠AOC і ∠BOD вертикальні, ∠AOD шуканий.","view":[-5,-3.5,5,3.5],"points":{"A":[-4,0],"B":[4,0],"O":[0,0],"C":[-2.25,2.681],"D":[2.25,-2.681]},"lp":{"O":"n","C":"nw","D":"se"},"items":[{"t":"line","p":["A","B"]},{"t":"line","p":["C","D"]},{"t":"angle","p":["A","O","C"],"s":"hl","arcs":1},{"t":"angle","p":["B","O","D"],"s":"hl","arcs":1},{"t":"angle","p":["D","O","A"],"label":"?","s":"hl2"}],"check":[{"col":["A","O","B"]},{"col":["C","O","D"]}]},"accept":["130"],"a":"∠AOC = ∠BOD (вертикальні), тому кожен 100° : 2 = 50°. ∠AOD суміжний з ∠AOC: 180° − 50° = 130°."},{"q":"<b>Пастка.<\/b> Два кути дорівнюють по 40°. Чи можна стверджувати, що вони вертикальні?","options":["Так, рівні кути — вертикальні","Ні: вертикальні кути рівні, але рівні кути не обов'язково вертикальні"],"correct":1,"a":"Теорема каже: вертикальні ⇒ рівні. Обернене твердження «рівні ⇒ вертикальні» хибне: два кути по 40° можна намалювати в різних місцях зошита."}]}}]},{"id":"G2.2","name":"Перпендикулярні й паралельні прямі","what":"Перпендикуляр, відстань від точки до прямої, паралельність.","subtopics":[{"id":"G2.2.1","name":"Перпендикулярні прямі. Відстань від точки до прямої","status":"ready","programmeRef":"Перпендикуляр. Відстань від точки до прямої.","lesson":{"what":"Дві прямі <b>перпендикулярні<\/b>, якщо вони перетинаються під прямим кутом (90°); пишуть a ⊥ b. <b>Перпендикуляр<\/b> із точки A до прямої a — це відрізок AH, який лежить на прямій, перпендикулярній до a; точку H на прямій називають <b>основою перпендикуляра<\/b>. <b>Відстань від точки до прямої<\/b> — довжина цього перпендикуляра.","fig":{"caption":"Пряма a, точка A поза нею. AH — перпендикуляр до a (прямий кут при H), AM — похила (пунктир). Відстань від A до a дорівнює AH.","view":[-4,-1,5,4],"points":{"L1":[-5,0],"L2":[5,0],"A":[-0.5,3],"H":[-0.5,0],"M":[3,0]},"hide":["L1","L2"],"lp":{"A":"n","H":"s","M":"s"},"items":[{"t":"line","p":["L1","L2"]},{"t":"label","at":[4.5,0.35],"text":"a"},{"t":"seg","p":["A","H"],"s":"hl"},{"t":"right","p":["A","H","M"]},{"t":"seg","p":["A","M"],"s":"dash"}],"check":[{"perp":[["A","H"],["L1","L2"]]},{"col":["L1","H","M"]}]},"ideas":["Якщо при перетині двох прямих один кут прямий, то прямі й решта кутів: суміжний з ним 180° − 90° = 90°, а вертикальні кути рівні.","Через будь-яку точку — на прямій чи поза нею — можна провести пряму, перпендикулярну до даної, і тільки одну. У зошиті її проводять косинцем.","Відрізок AM, де M — точка прямої, а AM не перпендикулярний до прямої, називають <b>похилою<\/b>. Відстань від точки до прямої — це довжина саме перпендикуляра, а не похилої.","Перпендикуляр — найкоротший шлях від точки до прямої. Тому, щоб виміряти відстань, міряють лінійкою саме перпендикуляр."],"rules":[{"f":"a ⊥ b ⇔ кут між ними 90°","means":"Перпендикулярні прямі утворюють чотири прямі кути."},{"f":"відстань від A до a = AH, де AH ⊥ a, H на a","means":"Відстань від точки до прямої — довжина перпендикуляра."}],"examples":[{"task":"Прямі AB і CD перетинаються в точці O, ∠AOC = 90°. Знайдіть ∠COB, ∠BOD і ∠DOA.","fig":{"caption":"Прямі AB і CD перетинаються в точці O під прямим кутом AOC; інші три кути шукані.","view":[-5,-3.5,5,3.5],"points":{"A":[-4,0],"B":[4,0],"C":[0,3],"D":[0,-3],"O":[0,0]},"lp":{"O":"sw","C":"e","D":"e"},"items":[{"t":"line","p":["A","B"]},{"t":"line","p":["C","D"]},{"t":"right","p":["A","O","C"],"s":"hl","id":"r"},{"t":"angle","p":["C","O","B"],"label":"?","s":"hl2","id":"cob"},{"t":"angle","p":["B","O","D"],"label":"?","s":"hl2","id":"bod"},{"t":"angle","p":["D","O","A"],"label":"?","s":"hl2","id":"doa"}],"check":[{"col":["A","O","B"]},{"col":["C","O","D"]},{"ang":[["A","O","C"],90]}]},"steps":[{"do":"∠COB = 180° − 90° = 90°.","why":"Бо ∠AOC і ∠COB — суміжні.","hl":["r","cob"]},{"do":"∠BOD = ∠AOC = 90°.","why":"Бо вертикальні кути рівні.","hl":["r","bod"]},{"do":"∠DOA = ∠COB = 90°.","why":"Бо вертикальні кути рівні.","hl":["cob","doa"]},{"do":"Усі чотири кути прямі, тому AB ⊥ CD.","why":"Означення перпендикулярних прямих."}],"answer":"Відповідь: усі три кути по 90°."},{"task":"З точки A до прямої a провели перпендикуляр AH = 4 см і похилу AM = 5 см. Яка відстань від точки A до прямої a?","fig":{"caption":"Пряма a, перпендикуляр AH = 4 см і похила AM = 5 см.","view":[-3,-1,5,5],"points":{"L1":[-5,0],"L2":[6,0],"A":[0,4],"H":[0,0],"M":[3,0]},"hide":["L1","L2"],"lp":{"A":"n","H":"s","M":"s"},"items":[{"t":"line","p":["L1","L2"]},{"t":"label","at":[4.6,0.35],"text":"a"},{"t":"seg","p":["A","H"],"s":"hl","id":"ah"},{"t":"right","p":["A","H","M"],"id":"r"},{"t":"seg","p":["A","M"],"s":"dash","id":"am"},{"t":"label","at":[-0.9,2],"text":"4 см"},{"t":"label","at":[2.2,2.3],"text":"5 см"}],"check":[{"perp":[["A","H"],["L1","L2"]]},{"col":["L1","H","M"]},{"len":[["A","H"],4]},{"len":[["A","M"],5]}]},"steps":[{"do":"Дано: AH ⊥ a, AH = 4 см, AM = 5 см — похила. Знайти: відстань від A до a.","why":"Записуємо умову.","hl":["ah","am"]},{"do":"Відстань від точки до прямої — довжина перпендикуляра, тобто AH.","why":"Означення відстані від точки до прямої.","hl":["ah","r"]},{"do":"AM — похила, вона довша за перпендикуляр (5 см > 4 см), тому відстанню не є.","why":"Перпендикуляр — найкоротший відрізок від точки до прямої.","hl":["am"]}],"answer":"Відповідь: 4 см."},{"task":"Точка O лежить на прямій AB, промінь OC перпендикулярний до AB. Промінь OD проходить між OC і OB, ∠COD = 35°. Знайдіть ∠AOD.","fig":{"caption":"Пряма AB, точка O, промінь OC ⊥ AB, промінь OD між OC і OB; ∠COD = 35°, ∠AOD шуканий.","view":[-5,-1,5,4],"points":{"A":[-4,0],"O":[0,0],"B":[4,0],"C":[0,3.5],"D":[2.008,2.867]},"lp":{"O":"s","C":"n","D":"ne"},"items":[{"t":"line","p":["A","B"]},{"t":"ray","p":["O","C"]},{"t":"ray","p":["O","D"],"s":"hl"},{"t":"right","p":["A","O","C"],"id":"r"},{"t":"angle","p":["C","O","D"],"label":"35°","s":"hl","id":"cod"},{"t":"angle","p":["D","O","B"],"id":"dob"},{"t":"angle","p":["A","O","D"],"label":"?","s":"hl2","id":"aod"}],"check":[{"col":["A","O","B"]},{"perp":[["O","C"],["A","B"]]},{"ang":[["C","O","D"],35]}]},"steps":[{"do":"∠COB = 90°, бо OC ⊥ AB. Тоді ∠DOB = 90° − 35° = 55°.","why":"Промінь OD ділить прямий кут COB на два кути.","hl":["cod","dob"]},{"do":"∠AOD = 180° − ∠DOB = 180° − 55° = 125°.","why":"Бо ∠AOD і ∠DOB — суміжні.","hl":["aod","dob"]},{"do":"Інший спосіб: ∠AOD = ∠AOC + ∠COD = 90° + 35° = 125°.","why":"Промінь OC проходить між сторонами ∠AOD, а ∠AOC = 90°.","hl":["r","cod","aod"]}],"answer":"Відповідь: 125°."}],"mistakes":["Вважати відстанню від точки до прямої довжину похилої. Відстань — лише перпендикуляр.","Вирішувати «на око», що прямі перпендикулярні. Треба знати, що кут дорівнює 90° (за умовою, косинцем чи обчисленням).","Писати «перпендикуляр AH», коли H не лежить на прямій. Основа перпендикуляра H завжди на прямій."],"check":[{"q":"<b>Пастка.<\/b> З точки A до прямої a провели перпендикуляр AH і похилу AM = 10 см; HM = 8 см, AH = 6 см. Яка відстань від точки A до прямої a (у см)? Введіть число.","fig":{"caption":"Пряма a, перпендикуляр AH, похила AM = 10 см, HM = 8 см.","view":[-2,-1,10,7],"points":{"L1":[-3,0],"L2":[11,0],"A":[0,6],"H":[0,0],"M":[8,0]},"hide":["L1","L2"],"lp":{"A":"n","H":"s","M":"s"},"items":[{"t":"line","p":["L1","L2"]},{"t":"label","at":[9.6,0.4],"text":"a"},{"t":"seg","p":["A","H"],"s":"hl"},{"t":"right","p":["A","H","M"]},{"t":"seg","p":["A","M"],"s":"dash"},{"t":"label","at":[4.6,3.6],"text":"10 см"},{"t":"label","at":[4,-0.5],"text":"8 см"}],"check":[{"perp":[["A","H"],["L1","L2"]]},{"len":[["A","M"],10]},{"len":[["H","M"],8]},{"len":[["A","H"],6]}]},"accept":["6"],"a":"Відстань — довжина перпендикуляра AH, тобто 6 см. 10 см — це похила, а 8 см — відрізок на самій прямій."},{"q":"Будинок стоїть біля прямої дороги. Як прокласти від будинку до дороги найкоротшу стежку?","options":["Під кутом 45° до дороги","Перпендикулярно до дороги","Будь-як — довжина однакова"],"correct":1,"a":"Найкоротший шлях від точки до прямої — перпендикуляр. Його довжина і є відстанню від будинку до дороги."},{"q":"Прямі AB і CD перпендикулярні й перетинаються в точці O. Промінь OK — бісектриса кута AOC. Знайдіть ∠KOB (див. малюнок). Введіть число.","fig":{"caption":"Перпендикулярні прямі AB і CD перетинаються в точці O; OK — бісектриса прямого кута AOC; ∠KOB шуканий.","view":[-5,-3.5,5,3.8],"points":{"A":[-4,0],"B":[4,0],"C":[0,3.5],"D":[0,-3.5],"O":[0,0],"K":[-2.475,2.475]},"lp":{"O":"sw","C":"e","D":"e","K":"nw"},"items":[{"t":"line","p":["A","B"]},{"t":"line","p":["C","D"]},{"t":"ray","p":["O","K"],"s":"hl"},{"t":"right","p":["C","O","B"]},{"t":"angle","p":["A","O","K"],"arcs":1},{"t":"angle","p":["K","O","C"],"arcs":1},{"t":"angle","p":["K","O","B"],"label":"?","s":"hl2"}],"check":[{"col":["A","O","B"]},{"col":["C","O","D"]},{"perp":[["A","B"],["C","D"]]}]},"accept":["135"],"a":"∠AOC = 90°, бісектриса ділить його навпіл: ∠AOK = 45°. ∠KOB суміжний з ∠AOK: 180° − 45° = 135°. Інакше: ∠KOC + ∠COB = 45° + 90° = 135°."}]}},{"id":"G2.2.2","name":"Паралельні прямі","status":"ready","programmeRef":"Паралельні та перпендикулярні прямі, їх властивості.","lesson":{"what":"Дві прямі на площині називають <b>паралельними<\/b>, якщо вони не перетинаються; пишуть a ∥ b. Тут уперше трапляється <b>аксіома<\/b> — твердження, яке приймають без доведення, бо воно очевидне й лежить в основі геометрії. А ще — <b>доведення від супротивного<\/b>: припускаємо протилежне і доходимо до неможливого.","fig":{"caption":"Пряма b і точка M поза нею. Через M проходить пряма a, паралельна b, — і тільки одна.","view":[-5,-2.5,5,2.5],"points":{"M":[0.5,1.2],"a1":[-5,1.2],"a2":[5,1.2],"b1":[-5,-1.2],"b2":[5,-1.2]},"hide":["a1","a2","b1","b2"],"lp":{"M":"n"},"items":[{"t":"line","p":["a1","a2"],"s":"hl"},{"t":"line","p":["b1","b2"]},{"t":"label","at":[4.6,1.55],"text":"a"},{"t":"label","at":[4.6,-0.85],"text":"b"}],"check":[{"par":[["a1","a2"],["b1","b2"]]},{"col":["a1","M","a2"]}]},"ideas":["Дві прямі на площині або перетинаються (мають одну спільну точку), або паралельні (не мають жодної). Відрізки й промені паралельні, якщо лежать на паралельних прямих.","<b>Аксіома паралельності:<\/b> через точку, що не лежить на даній прямій, можна провести лише одну пряму, паралельну даній.","<b>Доведення від супротивного:<\/b> 1) припускаємо, що твердження неправильне; 2) міркуємо і доходимо до суперечності з аксіомою чи відомою теоремою; 3) отже, припущення хибне, а твердження правильне.","<b>Теорема.<\/b> Дві прямі, паралельні третій, паралельні між собою. <b>Наслідок:<\/b> якщо пряма перетинає одну з двох паралельних прямих, то вона перетинає і другу.","<b>Теорема.<\/b> Дві прямі, перпендикулярні до третьої прямої, паралельні."],"rules":[{"f":"a ∥ c, b ∥ c ⇒ a ∥ b","means":"Дві прямі, паралельні третій, паралельні між собою."},{"f":"a ⊥ c, b ⊥ c ⇒ a ∥ b","means":"Дві прямі, перпендикулярні до третьої, паралельні."}],"examples":[{"task":"Прямі a і b перпендикулярні до прямої c. Доведіть, що a ∥ b.","fig":{"caption":"Пряма c і дві прямі a і b, перпендикулярні до неї в точках P і Q.","view":[-4,-2.5,4,2.5],"points":{"P":[-1.5,0],"Q":[1.5,0],"c1":[-5,0],"c2":[5,0],"a1":[-1.5,3],"a2":[-1.5,-3],"b1":[1.5,3],"b2":[1.5,-3]},"hide":["c1","c2","a1","a2","b1","b2"],"lp":{"P":"sw","Q":"se"},"items":[{"t":"line","p":["c1","c2"]},{"t":"line","p":["a1","a2"],"s":"hl","id":"a"},{"t":"line","p":["b1","b2"],"s":"hl","id":"b"},{"t":"right","p":["a1","P","c2"],"id":"r1"},{"t":"right","p":["b1","Q","c2"],"id":"r2"},{"t":"label","at":[-1.85,2.2],"text":"a"},{"t":"label","at":[1.85,2.2],"text":"b"},{"t":"label","at":[3.6,0.35],"text":"c"}],"check":[{"perp":[["a1","a2"],["c1","c2"]]},{"perp":[["b1","b2"],["c1","c2"]]},{"col":["c1","P","Q"]}]},"steps":[{"do":"Дано: a ⊥ c, b ⊥ c. Довести: a ∥ b. Доводимо від супротивного.","why":"Умова — після «якщо», вимога — що треба довести.","hl":["r1","r2"]},{"do":"Припустимо, що a і b перетинаються в якійсь точці K.","why":"Крок 1: припускаємо протилежне до того, що доводимо.","hl":["a","b"]},{"do":"Тоді через точку K проходять дві різні прямі, перпендикулярні до c.","why":"Бо обидві прямі a і b перпендикулярні до c і проходять через K."},{"do":"Це неможливо: через точку можна провести лише одну пряму, перпендикулярну до даної. Отже, припущення хибне, і a ∥ b.","why":"Крок 3: дійшли до суперечності."}],"answer":"Відповідь: a ∥ b, що й треба було довести."},{"task":"Прямі a і b паралельні прямій c. Доведіть, що a ∥ b.","fig":{"caption":"Три горизонтальні прямі: a зверху, c посередині, b знизу; a ∥ c і b ∥ c.","view":[-5,-2.5,5,2.5],"points":{"a1":[-5.0,1.6],"a2":[5.0,1.6],"c1":[-5.0,0],"c2":[5.0,0],"b1":[-5.0,-1.6],"b2":[5.0,-1.6]},"hide":["a1","a2","c1","c2","b1","b2"],"items":[{"t":"line","p":["a1","a2"],"s":"hl","id":"a"},{"t":"line","p":["c1","c2"],"s":"hl2","id":"c"},{"t":"line","p":["b1","b2"],"s":"hl","id":"b"},{"t":"label","at":[4.6,1.95],"text":"a"},{"t":"label","at":[4.6,0.35],"text":"c"},{"t":"label","at":[4.6,-1.25],"text":"b"}],"check":[{"par":[["a1","a2"],["c1","c2"]]},{"par":[["b1","b2"],["c1","c2"]]}]},"steps":[{"do":"Дано: a ∥ c, b ∥ c. Довести: a ∥ b. Доводимо від супротивного.","why":"Записуємо умову і вимогу.","hl":["a","b","c"]},{"do":"Припустимо, що a і b перетинаються в точці M.","why":"Припускаємо протилежне.","hl":["a","b"]},{"do":"Точка M не лежить на c (бо a ∥ c). Тоді через M проходять дві прямі a і b, паралельні прямій c.","why":"Обидві прямі паралельні c за умовою.","hl":["c"]},{"do":"Це суперечить аксіомі паралельності: через M можна провести лише одну пряму, паралельну c. Отже, a ∥ b.","why":"Припущення хибне."}],"answer":"Відповідь: a ∥ b, що й треба було довести."},{"task":"Прямі a і b паралельні, пряма d перетинає пряму a в точці M. Доведіть, що d перетинає і пряму b.","fig":{"caption":"Паралельні прямі a і b; пряма d перетинає a в точці M і b в точці N.","view":[-5,-2.5,5,2.5],"points":{"a1":[-5.0,1.5],"a2":[5.0,1.5],"b1":[-5.0,-1.5],"b2":[5.0,-1.5],"M":[-1,1.5],"N":[0.6,-1.5]},"hide":["a1","a2","b1","b2"],"lp":{"M":"nw","N":"sw"},"items":[{"t":"line","p":["a1","a2"],"id":"a"},{"t":"line","p":["b1","b2"],"id":"b"},{"t":"line","p":["M","N"],"s":"hl","id":"d"},{"t":"label","at":[4.6,1.85],"text":"a"},{"t":"label","at":[4.6,-1.15],"text":"b"},{"t":"label","at":[1.5,-2.2],"text":"d"}],"check":[{"par":[["a1","a2"],["b1","b2"]]},{"col":["a1","M","a2"]},{"col":["b1","N","b2"]}]},"steps":[{"do":"Дано: a ∥ b, d перетинає a в точці M. Довести: d перетинає b.","why":"Записуємо умову і вимогу.","hl":["a","b","d"]},{"do":"Припустимо, що d не перетинає b, тобто d ∥ b.","why":"Доведення від супротивного.","hl":["d","b"]},{"do":"Тоді через точку M проходять дві прямі a і d, паралельні прямій b.","why":"a ∥ b за умовою, d ∥ b за припущенням.","hl":["a","d"]},{"do":"Це суперечить аксіомі паралельності. Отже, d перетинає b.","why":"Через точку поза прямою проходить лише одна пряма, паралельна їй."}],"answer":"Відповідь: d перетинає b, що й треба було довести."}],"mistakes":["Вважати паралельними два відрізки, які просто не перетинаються. Треба, щоб не перетиналися прямі, на яких вони лежать.","У доведенні від супротивного забути останній крок: назвати, з чим саме виникла суперечність (з аксіомою чи теоремою).","Думати, що аксіому треба доводити. Аксіоми приймають без доведення; доводять теореми."],"check":[{"q":"<b>Пастка.<\/b> Відрізки PQ і RS на малюнку не перетинаються. Чи обов'язково вони паралельні?","fig":{"caption":"Два відрізки PQ і RS, які не перетинаються, але трохи сходяться праворуч.","view":[-5,-2.5,3,2.5],"points":{"P":[-4,1.5],"Q":[0,1.2],"R":[-4,-1.5],"S":[0,-0.6]},"lp":{"P":"n","Q":"n","R":"s","S":"s"},"items":[{"t":"seg","p":["P","Q"],"s":"hl"},{"t":"seg","p":["R","S"],"s":"hl"}]},"options":["Так, бо вони не перетинаються","Ні: треба, щоб не перетиналися прямі PQ і RS"],"correct":1,"a":"Відрізки паралельні, лише якщо лежать на паралельних прямих. Прямі PQ і RS тут перетнуться праворуч, поза малюнком."},{"q":"Скільки прямих, паралельних прямій b, можна провести через точку M, що не лежить на b? Введіть число.","accept":["1","одну","одна"],"a":"Лише одну — це аксіома паралельності прямих."},{"q":"Що з навколишнього світу є моделлю паралельних прямих?","options":["Стрілки годинника о 3:00","Лінії на перехресті доріг","Протилежні краї аркуша зошита","Дві стежки, що сходяться біля школи"],"correct":2,"a":"Протилежні краї аркуша не перетинаються, хоч як їх продовжуй. Стрілки й дороги на перехресті перетинаються, а стежки сходяться."}]}},{"id":"G2.2.3","name":"Кут між прямими, що перетинаються","status":"ready","programmeRef":"Кут між двома прямими, що перетинаються.","lesson":{"what":"Дві прямі, що перетинаються, утворюють чотири кути — дві пари рівних. <b>Кутом між прямими<\/b> називають той із них, що не більший за 90°. Якщо всі кути прямі, кут між прямими дорівнює 90° — прямі перпендикулярні.","fig":{"caption":"Прямі AB і CD перетинаються в точці O; ∠COB = 65° — кут між прямими; ∠AOC = 115°.","view":[-5,-3.5,5,3.5],"points":{"A":[-4,0],"B":[4,0],"O":[0,0],"C":[1.479,3.172],"D":[-1.479,-3.172]},"lp":{"O":"n","C":"ne","D":"sw"},"items":[{"t":"line","p":["A","B"]},{"t":"line","p":["C","D"]},{"t":"angle","p":["C","O","B"],"label":"65°","s":"hl"},{"t":"angle","p":["A","O","C"],"label":"115°","s":"faint"}],"check":[{"col":["A","O","B"]},{"col":["C","O","D"]},{"ang":[["C","O","B"],65]}]},"ideas":["При перетині двох прямих маємо два гострі й два тупі кути (або чотири прямі). Кут між прямими — гострий з них (або 90°).","Кут між прямими завжди не більший за 90°. Тупий кут ніколи не є кутом між прямими.","Якщо відомий тупий кут β, то кут між прямими дорівнює 180° − β, бо сусідні кути суміжні.","Кут між прямими залежить лише від самих прямих, а не від того, які точки на них позначено."],"rules":[{"f":"0° < кут між прямими ≤ 90°","means":"Кут між прямими, що перетинаються, не тупий."},{"f":"φ = 180° − β, якщо β > 90°","means":"За тупим кутом кут між прямими знаходимо через суміжний кут."}],"examples":[{"task":"Один із кутів, що утворилися при перетині двох прямих, дорівнює 130°. Знайдіть кут між прямими.","fig":{"caption":"Прямі AB і CD перетинаються в точці O; ∠COB = 130°, ∠AOC — шуканий кут між прямими.","view":[-5,-3.5,5,3.5],"points":{"A":[-4,0],"B":[4,0],"O":[0,0],"C":[-2.25,2.681],"D":[2.25,-2.681]},"lp":{"O":"s","C":"nw","D":"se"},"items":[{"t":"line","p":["A","B"]},{"t":"line","p":["C","D"]},{"t":"angle","p":["C","O","B"],"label":"130°","s":"hl","id":"big"},{"t":"angle","p":["A","O","C"],"label":"?","s":"hl2","id":"small"}],"check":[{"col":["A","O","B"]},{"col":["C","O","D"]},{"ang":[["C","O","B"],130]}]},"steps":[{"do":"Кут 130° тупий, тому він не є кутом між прямими.","why":"Кут між прямими не більший за 90°.","hl":["big"]},{"do":"Сусідній кут: ∠AOC = 180° − 130° = 50°.","why":"Бо ∠AOC і ∠COB — суміжні.","hl":["small"]},{"do":"50° < 90°, отже, кут між прямими 50°.","why":"Означення кута між прямими.","hl":["small"]}],"answer":"Відповідь: 50°."},{"task":"Сума трьох кутів, що утворилися при перетині двох прямих, дорівнює 250°. Знайдіть кут між прямими.","fig":{"caption":"Дві прямі перетинаються в точці O, утворюючи кути 1, 2, 3, 4; ∠1 і ∠3 вертикальні, ∠2 і ∠4 вертикальні.","view":[-5,-3.5,5,3.5],"points":{"A":[-4,0],"B":[4,0],"O":[0,0],"C":[1.197,3.289],"D":[-1.197,-3.289]},"lp":{"O":"s","C":"n","D":"s"},"items":[{"t":"line","p":["A","B"]},{"t":"line","p":["C","D"]},{"t":"angle","p":["A","O","C"],"label":"1","s":"hl2","arcs":2,"id":"a1"},{"t":"angle","p":["C","O","B"],"label":"2","s":"hl","arcs":1,"id":"a2"},{"t":"angle","p":["B","O","D"],"label":"3","s":"hl2","arcs":2,"id":"a3"},{"t":"angle","p":["D","O","A"],"label":"4","s":"hl","arcs":1,"id":"a4"}],"check":[{"col":["A","O","B"]},{"col":["C","O","D"]}]},"steps":[{"do":"Усі чотири кути разом: 180° + 180° = 360°.","why":"Бо ∠1 + ∠2 = 180° і ∠3 + ∠4 = 180° — суміжні кути.","hl":["a1","a2","a3","a4"]},{"do":"Четвертий кут, якого немає в сумі (нехай це ∠1): 360° − 250° = 110°.","why":"Від суми всіх кутів віднімаємо суму трьох.","hl":["a1"]},{"do":"Сусідній з ним ∠2 = 180° − 110° = 70°.","why":"Бо ∠1 і ∠2 — суміжні.","hl":["a2"]},{"do":"Кути при перетині: 110°, 70°, 110°, 70°. Кут між прямими — 70°.","why":"Вибираємо кут, не більший за 90°.","hl":["a2","a4"]}],"answer":"Відповідь: 70°."},{"task":"Різниця двох кутів, що утворилися при перетині двох прямих, дорівнює 40°. Знайдіть кут між прямими.","fig":{"caption":"Дві прямі перетинаються в точці O; ∠1 = ∠AOC і ∠2 = ∠COB — сусідні кути, ∠2 більший за ∠1.","view":[-5,-3.5,5,3.5],"points":{"A":[-4,0],"B":[4,0],"O":[0,0],"C":[-1.197,3.289],"D":[1.197,-3.289]},"lp":{"O":"s","C":"n","D":"s"},"items":[{"t":"line","p":["A","B"]},{"t":"line","p":["C","D"]},{"t":"angle","p":["A","O","C"],"label":"1","s":"hl","id":"a1"},{"t":"angle","p":["C","O","B"],"label":"2","s":"hl2","id":"a2"}],"check":[{"col":["A","O","B"]},{"col":["C","O","D"]}]},"steps":[{"do":"Вертикальні кути рівні, їхня різниця 0°. Отже, ці кути сусідні, тобто суміжні.","why":"Інших пар кутів при перетині немає.","hl":["a1","a2"]},{"do":"Нехай ∠1 = x, ∠2 = x + 40°. Тоді x + x + 40° = 180°, 2x = 140°, x = 70°.","why":"Сума суміжних кутів 180°.","hl":["a1","a2"]},{"do":"Кути: 70° і 110°. Кут між прямими — 70°.","why":"Менший із кутів, не більший за 90°.","hl":["a1"]}],"answer":"Відповідь: 70°."}],"mistakes":["Називати кутом між прямими тупий кут (наприклад, 130°). Правильно: 180° − 130° = 50°.","Думати, що сума будь-яких двох кутів при перетині 180°. Це правда лише для сусідніх кутів."],"check":[{"q":"<b>Пастка.<\/b> Один із кутів, що утворилися при перетині двох прямих, у 5 разів більший за інший. Знайдіть кут між прямими. Введіть число.","accept":["30"],"a":"Кути різні, отже, сусідні: x + 5x = 180°, x = 30°. Кути 30° і 150°. Кут між прямими — 30°, а не 150°."},{"q":"Дві прямі вулиці перетинаються. На одному з рогів кут між тротуарами 104°. Під яким кутом перетинаються вулиці? Введіть число.","accept":["76"],"a":"104° — тупий кут. Кут між прямими: 180° − 104° = 76°."},{"q":"Чи може кут між двома прямими, що перетинаються, дорівнювати 95°?","options":["Так","Ні, кут між прямими не більший за 90°","Лише якщо прямі перпендикулярні"],"correct":1,"a":"Якщо при перетині є кут 95°, то сусідній з ним дорівнює 85°. Кутом між прямими називають саме цей, не більший за 90°."}]}}]},{"id":"G2.3","name":"Паралельні прямі і січна","what":"Кути при перетині двох прямих третьою і як за ними впізнати паралельні прямі.","subtopics":[{"id":"G2.3.1","name":"Кути, утворені при перетині двох прямих січною","status":"ready","programmeRef":"Кути, утворені при перетині двох прямих січною.","lesson":{"what":"Якщо пряма c перетинає дві прямі a і b у двох різних точках, її називають <b>січною<\/b>. При цьому утворюється вісім кутів. Деякі пари цих кутів мають свої назви — вони знадобляться, щоб розпізнавати паралельні прямі.","fig":{"caption":"Прямі a і b перетинає січна c в точках A і B. Кути при A: 1 і 2 над прямою a, 3 і 4 під нею; кути при B: 5 і 6 над прямою b, 7 і 8 під нею. Кути 1, 4, 5, 8 ліворуч від січної, 2, 3, 6, 7 — праворуч. Внутрішні кути 3, 4, 5, 6 лежать між прямими a і b.","view":[-5,-3.0,5,3.0],"points":{"A":[0.699,1.5],"B":[-0.699,-1.5],"Al":[-2.272,1.918],"Ar":[3.67,1.082],"Bl":[-3.683,-1.814],"Br":[2.285,-1.186],"Cu":[1.967,4.219],"Cd":[-1.967,-4.219]},"hide":["Al","Ar","Bl","Br","Cu","Cd"],"lp":{"A":"nw","B":"se"},"items":[{"t":"line","p":["Al","Ar"]},{"t":"line","p":["Bl","Br"]},{"t":"lin ро кути, <b>вимога<\/b> — «прямі паралельні». Отже, ознаку застосовують, коли треба <b>довести<\/b> паралельність.","<b>Ознака 1.<\/b> Якщо при перетині двох прямих січною внутрішні різносторонні кути рівні, то прямі паралельні. (Її доведення — у підручнику.)","<b>Ознака 2.<\/b> Якщо відповідні кути рівні, то прямі паралельні. Бо якщо ∠1 = ∠5, то ∠3 = ∠1 (вертикальні), тож ∠3 = ∠5 — це ознака 1.","<b>Ознака 3.<\/b> Якщо сума внутрішніх односторонніх кутів 180°, то прямі паралельні. Бо якщо ∠4 + ∠5 = 180°, а ∠4 + ∠3 = 180° (суміжні), то ∠3 = ∠5 — знову ознака 1.","Як діяти: знайди на малюнку пару кутів, за потреби перейди до іншої пари через вертикальні чи суміжні кути — і застосуй одну з ознак."],"rules":[{"f":"∠3 = ∠5 ⇒ a ∥ b","means":"Внутрішні різносторонні кути рівні — прямі паралельні."},{"f":"∠1 = ∠5 ⇒ a ∥ b","means":"Відповідні кути рівні — прямі паралельні."},{"f":"∠4 + ∠5 = 180° ⇒ a ∥ b","means":"Сума внутрішніх односторонніх кутів 180° — прямі паралельні."}],"examples":[{"task":"Прямі a і b перетнуто січною c, ∠1 = 48°, ∠5 = 48°. Чи паралельні прямі a і b?","fig":{"caption":"Прямі a і b, січна c; ∠1 = 48° (над a ліворуч від січної), ∠5 = 48° (над b ліворуч від січної).","view":[-5,-3.0,5,3.0],"points":{"A":[-1.351,1.5],"B":[1.351,-1.5],"Al":[-4.351,1.5],"Ar":[1.649,1.5],"Bl":[-1.649,-1.5],"Br":[4.351,-1.5],"Cu":[-3.358,3.729],"Cd":[3.358,-3.729]},"hide":["Al","Ar","Bl","Br","Cu","Cd"],"lp":{"A":"ne","B":"sw"},"items":[{"t":"line","p":["Al","Ar"],"id":"la"},{"t":"line","p":["Bl","Br"],"id":"lb"},{"t":"line","p":["Cd","Cu"],"id":"lc"},{"t":"label","at":[4.5,1.85],"text":"a"},{"t":"label","at":[4.5,-1.15],"text":"b"},{"t":"label","at":[-2.081,2.7],"text":"c"},{"t":"angle","p":["Al","A","Cu"],"label":"48°","id":"a1","s":"hl","arcs":1},{"t":"angle","p":["Bl","B","A"],"label":"48°","id":"a5","s":"hl","arcs":1}],"check":[{"col":["Al","A","Ar"]},{"col":["Bl","B","Br"]},{"col":["Cd","B","A"]},{"col":["B","A","Cu"]},{"par":[["Al","Ar"],["Bl","Br"]]}]},"steps":[{"do" -2.134,1.5],"Ar":[3.866,1.5],"Bl":[-3.866,-1.5],"Br":[2.134,-1.5],"Cu":[2.366,4.098],"Cd":[-2.366,-4.098]},"hide":["Al","Ar","Bl","Br","Cu","Cd"],"lp":{"A":"nw","B":"se"},"items":[{"t":"line","p":["Al","Ar"]},{"t":"line","p":["Bl","Br"]},{"t":"line","p":["Cd","Cu"]},{"t":"label","at":[4.5,1.85],"text":"a"},{"t":"label","at":[4.5,-1.15],"text":"b"},{"t":"label","at":[1.209,2.7],"text":"c"},{"t":"angle","p":["Al","A","Cu"],"label":"1","id":"a1","s":"hl","arcs":1},{"t":"angle","p":["Cu","A","Ar"],"label":"2","id":"a2","s":"hl2","arcs":2},{"t":"angle","p":["Ar","A","B"],"label":"3","id":"a3","s":"hl","arcs":1},{"t":"angle","p":["B","A","Al"],"label":"4","id":"a4","s":"hl2","arcs":2},{"t":"angle","p":["Bl","B","A"],"label":"5","id":"a5","s":"hl","arcs":1},{"t":"angle","p":["A","B","Br"],"label":"6","id":"a6","s":"hl2","arcs":2},{"t":"angle","p":["Br","B","Cd"],"label":"7","id":"a7","s":"hl","arcs":1},{"t":"angle","p":["Cd","B","Bl"],"label":"8","id":"a8","s":"hl2","arcs":2}],"check":[{"col":["Al","A","Ar"]},{"col":["Bl","B","Br"]},{"col":["Cd","B","A"]},{"col":["B","A","Cu"]},{"par":[["Al","Ar"],["Bl","Br"]]}]},"ideas":["<b>Пряма теорема<\/b> (ознака): «якщо ∠3 = ∠5, то a ∥ b». <b>Обернена<\/b> (властивість): «якщо a ∥ b, то ∠3 = ∠5». Обернене твердження буває хибним (згадай вертикальні кути), але тут воно правильне — його доводять.","<b>Доведення від супротивного.<\/b> Нехай a ∥ b, але ∠3 ≠ ∠5. Проведемо через A пряму a₁ так, щоб її внутрішній різносторонній кут дорівнював ∠5. За ознакою a₁ ∥ b. Тоді через A проходять дві прямі a і a₁, паралельні b, — суперечність з аксіомою паралельності. Отже, ∠3 = ∠5.","З рівності ∠3 = ∠5 випливають інші властивості: відповідні кути рівні (∠1 = ∠3 = ∠5), а ∠4 + ∠5 = ∠4 + ∠3 = 180°.","<b>Наслідок:<\/b> якщо пряма перпендикулярна до однієї з двох паралельних прямих, то вона перпендикулярна і до другої.","<b>Ознака чи властивість?<\/b> Треба довести, що прямі паралельні, — ознака. Паралельність дано, треба знайти кути — властивість."],"rules":[{"f":"a ∥ b ⇒ ∠3 = ∠5, ∠1 = ∠5","means":"Внутрішні різносторонні кути рівні; відповідні кути рівні."},{"f":"a ∥ b ⇒ ∠4 + ∠5 = 180°","means":"Сума внутрішніх односторонніх кутів дорівнює 180°."}],"examples":[{"task":"Паралельні прямі a і b перетнуто січною c, ∠1 = 68°. Знайдіть решту кутів.","fig":{"caption":"Паралельні прямі a і b, січна c; ∠1 = 68°, кути 2–8 шукані.","view":[-5,-3.0,5,3.0],"points":{"A":[-0.606,1.5],"B":[0.606,-1.5],"Al":[-3.606,1.5],"Ar":[2.394,1.5],"Bl":[-2.394,-1.5],"Br":[3.606,-1.5],"Cu":[-1.73,4.282],"Cd":[1.73,-4.282]},"hide":["Al","Ar","Bl","Br","Cu","Cd"],"lp":{"A":"ne","B":"sw"},"items":[{"t":"line","p":["Al","Ar"]},{"t":"line","p":["Bl","Br"]},{"t":"line","p":["Cd","Cu"]},{"t":"label","at":[4.5,1.85],"text":"a"},{"t":"label","at":[4.5,-1.15],"text":"b"},{"t":"label","at":[-0.741,2.7],"text":"c"},{"t":"angle","p":["Al","A","Cu"],"label":"68°","id":"a1","s":"hl"},{"t":"angle","p":["Cu","A","Ar"],"label":"2","id":"a2","s":"hl2"},{"t":"angle","p":["Ar","A","B"],"label":"3","id":"a3","s":"hl"},{"t":"angle","p":["B","A","Al"],"label":"4","id":"a4","s":"hl2"},{"t":"angle","p":["Bl","B","A"],"label":"5","id":"a5","s":"hl"},{"t":"angle","p":["A","B","Br"],"label":"6","id":"a6","s":"hl2"},{"t":"angle","p":["Br","B","Cd"],"label":"7","id":"a7","s":"hl"},{"t":"angle","p":["Cd","B","Bl"],"label":"8","id":"a8","s":"hl2"}],"check":[{"col":["Al","A","Ar"]},{"col":["Bl","B","Br"]},{"col":["Cd","B","A"]},{"col":["B","A","Cu"]},{"par":[["Al","Ar"],["Bl","Br"]]}]},"steps":[{"do":"∠3 = ∠1 = 68°.","why":"Бо ∠1 і ∠3 — вертикальні.","hl":["a1","a3"]},{"do":"∠5 = ∠1 = 68°, ∠7 = ∠5 = 68°.","why":"Бо ∠1 і ∠5 — відповідні, a ∥ b; ∠5 і ∠7 — вертикальні.","hl":["a1","a5","a7"]},{"do":"∠2 = 180° − 68° = 112°, ∠4 = ∠2 = 112°.","why":"Бо ∠1 і ∠2 — суміжні; ∠2 і ∠4 — вертикальні.","hl":["a2","a4"]},{"do":"∠6 = ∠2 = 112°, ∠8 = ∠6 = 112°. Перевірка: ∠4 + ∠5 = 112° + 68° = 180°.","why":"Бо ∠2 і ∠6 — відповідні; ∠6 і ∠8 — вертикальні. Сума односторонніх — 180°.","hl":
