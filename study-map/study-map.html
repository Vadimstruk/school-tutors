няння, які мають виконуватися одночасно. У зошиті їх пишуть одне під одним і об'єднують фігурною дужкою, а тут — в один рядок: { x + y = 7; x − y = 1 }. <b>Розв'язок системи<\/b> — пара (x; y), яка є розв'язком кожного рівняння.","ideas":["Пару перевіряють в <b>обох<\/b> рівняннях. Підходить лише до одного — це не розв'язок системи.","<b>Розв'язати систему<\/b> — знайти всі її розв'язки або показати, що їх немає.","Система двох лінійних рівнянь може мати один розв'язок, безліч розв'язків або жодного.","Якщо одне рівняння — це друге, помножене на число (x + y = 3 і 2x + 2y = 6), розв'язків безліч. Якщо ліві частини однакові, а праві різні (x + y = 3 і x + y = 5), розв'язків немає. На малюнку: прямі x + y = 3 і x + y = 5 паралельні, а 2x + 2y = 6 — та сама пряма, що й x + y = 3."],"rules":[{"f":"{ x + y = 7; x − y = 1 } → (4; 3)","means":"4 + 3 = 7 і 4 − 3 = 1 — обидві рівності правильні, тому (4; 3) — розв'язок системи."}],"examples":[{"task":"Чи є пара (4; 3) розв'язком системи { x + y = 7; x − y = 1 }?","steps":[{"do":"Перше рівняння: 4 + 3 = 7; 7 = 7","why":"Підставили x = 4, y = 3 — правильно.","hl":["f1","f1t"]},{"do":"Друге рівняння: 4 − 3 = 1; 1 = 1","why":"Теж правильно.","hl":["f2","f2t"]},{"do":"Обидві рівності правильні","why":"Пара підходить до кожного рівняння.","hl":["mx","my"]}],"answer":"Відповідь: так, (4; 3) — розв'язок системи.","fig":{"caption":"Графіки рівнянь x + y = 7 і x − y = 1 перетинаються в точці M(4; 3) — це розв'язок системи.","view":[-2,-2,8,8],"axes":{"step":1,"every":1},"points":{"M":[4,3],"Hmx":[4,0],"Hmy":[0,3]},"hide":["Hmx","Hmy"],"lp":{"M":"e"},"items":[{"t":"fn","k":-1,"b":7,"id":"f1"},{"t":"fn","k":1,"b":-1,"id":"f2"},{"t":"seg","p":["Hmx","M"],"id":"mx","s":"dash"},{"t":"seg","p":["M","Hmy"],"id":"my","s":"dash"},{"t":"label","at":[6.533,-1.4],"text":"x + y = 7","id":"f1t"},{"t":"label","at":[5.333,6.2],"text":"x − y = 1","id":"f2t"}],"check":[{"on":["M",-1,7]},{"on":["M",1,-1]}]}},{"task":"Чи є пара (2; 1) розв'язком системи { 3x − y = 5; x + 4y = 7 }?","steps":[{"do":"Перше рівняння: 3 · 2 − 1 = 6 − 1 = 5; 5 = 5","why":"Перше рівняння пара задовольняє."},{"do":"Друге рівняння: 2 + 4 · 1 = 6; 6 ≠ 7","why":"Друге — ні."},{"do":"Пара не підходить до другого рівняння","why":"Розв'язок системи має задовольняти обидва."}],"answer":"Відповідь: ні, (2; 1) не є розв'язком системи."},{"task":"Яка з пар (1; 5), (2; 3), (3; 1) є розв'язком системи { 2x + y = 7; x − y = −1 }?","steps":[{"do":"Перше рівняння: 2 · 1 + 5 = 7, 2 · 2 + 3 = 7, 2 · 3 + 1 = 7","why":"Перше рівняння задовольняють усі три пари.","hl":["f1","f1t"]},{"do":"Друге рівняння: 1 − 5 = −4, 2 − 3 = −1, 3 − 1 = 2","why":"−1 вийшло лише для пари (2; 3).","hl":["f2","f2t"]},{"do":"Обидва рівняння задовольняє тільки (2; 3)","why":"Тому перевіряти треба обидва, а не лише перше.","hl":["bx","by"]}],"answer":"Відповідь: (2; 3).","fig":{"caption":"Пряма 2x + y = 7 проходить через усі три точки A(1; 5), B(2; 3), C(3; 1). Пряма x − y = −1 — лише через B(2; 3).","view":[-2,-2,6,8],"axes":{"step":1,"every":1},"points":{"A":[1,5],"B":[2,3],"C":[3,1],"Hbx":[2,0],"Hby":[0,3]},"hide":["Hbx","Hby"],"lp":{"A":"ne","B":"e","C":"ne"},"items":[{"t":"fn","k":-2,"b":7,"id":"f1"},{"t":"fn","k":1,"b":1,"id":"f2"},{"t":"seg","p":["Hbx","B"],"id":"bx","s":"dash"},{"t":"seg","p":["B","Hby"],"id":"by","s":"dash"},{"t":"label","at":[2.5,-1.5],"text":"2x + y = 7","id":"f1t"},{"t":"label","at":[3.2,6.2],"text":"x − y = −1","id":"f2t"}],"check":[{"on":["A",-2,7]},{"on":["B",-2,7]},{"on":["C",-2,7]},{"on":["B",1,1]}]}}],"mistakes":["Перевіряють пару лише в першому рівнянні. Правильно: підстав у <b>обидва<\/b>.","Підставляють числа пари навпаки: для (2; 1) беруть x = 1. Правильно: перше число — x, друге — y.","Думають, що кожна система має рівно один розв'язок. Буває також безліч розв'язків або жодного."],"check":[{"q":"Яка пара є розв'язком системи { x + y = 5; x − y = 3 }?","options":["(1; 4)","(3; 2)","(4; 1)"],"correct":2,"a":"(4; 1): 4 + 1 = 5 і 4 − 1 = 3. Пари (1; 4) і (3; 2) теж дають суму 5, але різниця в них −3 і 1."},{"q":"Пастка: скільки розв'язків має система { x + y = 4; x + y = 6 }?","options":["Один","Безліч","Жодного"],"correct":2,"a":"Жодного: та сама сума x + y не може дорівнювати водночас 4 і 6."},{"q":"У гаманці 7 монет по 2 грн і по 5 грн, разом 20 грн. x — кількість монет по 2 грн, y — по 5 грн: { x + y = 7; 2x + 5y = 20 }. Чи є пара (4; 3) розв'язком системи?","options":["Так","Ні"],"correct":1,"a":"Ні: 4 + 3 = 7, але 2 · 4 + 5 · 3 = 8 + 15 = 23 ≠ 20. Розв'язок — (5; 2): 5 + 2 = 7 і 10 + 10 = 20."}],"fig":{"caption":"Прямі x + y = 3 і x + y = 5 паралельні — спільних точок немає, у системи з цих рівнянь розв'язків немає. Рівняння 2x + 2y = 6 має той самий графік, що й x + y = 3: прямі збігаються, спільних точок безліч.","view":[-2,-3,8,7],"axes":{"step":1,"every":1},"points":{"A":[0,3],"B":[3,0],"C":[0,5],"D":[5,0]},"lp":{"A":"ne","B":"ne","C":"ne","D":"ne"},"items":[{"t":"fn","k":-1,"b":3,"id":"f1","s":"hl"},{"t":"fn","k":-1,"b":5,"id":"f2","s":"hl2"},{"t":"label","at":[3.633,-2.5],"text":"x + y = 3","id":"f1t","s":"hl"},{"t":"label","at":[2.533,-1.7],"text":"2x + 2y = 6","id":"f1t2","s":"hl"},{"t":"label","at":[5.733,1.1],"text":"x + y = 5","id":"f2t","s":"hl2"}],"check":[{"on":["A",-1,3]},{"on":["B",-1,3]},{"on":["C",-1,5]},{"on":["D",-1,5]}]}}},{"id":"A4.2.2","name":"Графічний спосіб","status":"ready","programmeRef":"графічним способом","lesson":{"what":"<b>Графічний спосіб<\/b>: будуємо в одній системі координат графіки обох рівнянь і шукаємо точку, де прямі перетинаються. Її координати — розв'язок системи, бо ця точка лежить на обох прямих.","ideas":["Для кожного рівняння знайди дві точки й проведи пряму — як у попередньому уроці.","Прямі перетинаються в одній точці — система має один розв'язок.","Прямі паралельні (не перетинаються) — розв'язків немає. Прямі збігаються — розв'язків безліч.","Графічний спосіб неточний: якщо точка перетину не на перетині ліній клітинок, координати можна прочитати лише приблизно. Тому знайдену пару завжди перевір підстановкою в обидва рівняння."],"rules":[{"f":"перетинаються → 1 розв'язок; паралельні → 0; збігаються → безліч","means":"Скільки спільних точок у двох прямих — стільки розв'язків у системи."}],"examples":[{"task":"Розв'яжи графічно систему { x + y = 5; x − y = 1 }.","steps":[{"do":"x + y = 5: точки (0; 5) і (5; 0)","why":"Поставили x = 0, потім y = 0.","hl":["f1","f1t"]},{"do":"x − y = 1: точки (0; −1) і (1; 0)","why":"x = 0 дає −y = 1, y = −1; y = 0 дає x = 1.","hl":["f2","f2t"]},{"do":"Побудуй обидві прямі: вони перетинаються в точці (3; 2)","why":"Читаємо координати точки перетину з малюнка.","hl":["mx","my"]},{"do":"Перевірка: 3 + 2 = 5 і 3 − 2 = 1","why":"Пара задовольняє обидва рівняння.","hl":["mx","my"]}],"answer":"Відповідь: (3; 2).","fig":{"caption":"Пряма x + y = 5 проходить через (0; 5) і (5; 0), пряма x − y = 1 — через (0; −1) і (1; 0). Вони перетинаються в точці M(3; 2).","view":[-2,-3,7,7],"axes":{"step":1,"every":1},"points":{"A":[0,5],"B":[5,0],"C":[0,-1],"D":[1,0],"M":[3,2],"Hmx":[3,0],"Hmy":[0,2]},"hide":["Hmx","Hmy"],"lp":{"A":"ne","B":"ne","C":"se","D":"nw","M":"e"},"items":[{"t":"fn","k":-1,"b":5,"id":"f1"},{"t":"fn","k":1,"b":-1,"id":"f2"},{"t":"seg","p":["Hmx","M"],"id":"mx","s":"dash"},{"t":"seg","p":["M","Hmy"],"id":"my","s":"dash"},{"t":"label","at":[5.533,-2.4],"text":"x + y = 5","id":"f1t"},{"t":"label","at":[4.333,5.2],"text":"x − y = 1","id":"f2t"}],"check":[{"on":["A",-1,5]},{"on":["B",-1,5]},{"on":["M",-1,5]},{"on":["C",1,-1]},{"on":["D",1,-1]},{"on":["M",1,-1]}]}},{"task":"Розв'яжи графічно систему { y = 2x − 1; x + 2y = 8 }.","steps":[{"do":"y = 2x − 1: точки (0; −1) і (2; 3)","why":"x = 0: y = −1; x = 2: y = 4 − 1 = 3.","hl":["f1","f1t"]},{"do":"x + 2y = 8: точки (0; 4) і (8; 0)","why":"x = 0: 2y = 8, y = 4; y = 0: x = 8.","hl":["f2","f2t"]},{"do":"Прямі перетинаються в точці (2; 3)","why":"Ця точка лежить на обох прямих.","hl":["mx","my"]},{"do":"Перевірка: 2 · 2 − 1 = 3 і 2 + 2 · 3 = 8","why":"Обидві рівності правильні.","hl":["mx","my"]}],"answer":"Відповідь: (2; 3).","fig":{"caption":"Пряма y = 2x − 1 проходить через (0; −1) і (2; 3), пряма x + 2y = 8 — через (0; 4) і (8; 0). Вони перетинаються в точці M(2; 3).","view":[-2,-2,9,6],"axes":{"step":1,"every":1},"points":{"A":[0,-1],"B":[0,4],"C":[8,0],"M":[2,3],"Hmx":[2,0],"Hmy":[0,3]},"hide":["Hmx","Hmy"],"lp":{"A":"se","B":"ne","C":"ne","M":"e"},"items":[{"t":"fn","k":2,"b":-1,"id":"f1"},{"t":"fn","k":-0.5,"b":4,"id":"f2"},{"t":"seg","p":["Hmx","M"],"id":"mx","s":"dash"},{"t":"seg","p":["M","Hmy"],"id":"my","s":"dash"},{"t":"label","at":[4.93,5.01],"text":"y = 2x − 1","id":"f1t"},{"t":"label","at":[7.24,1.71],"text":"x + 2y = 8","id":"f2t"}],"check":[{"on":["A",2,-1]},{"on":["M",2,-1]},{"on":["B",-0.5,4]},{"on":["C",-0.5,4]},{"on":["M",-0.5,4]}]}},{"task":"Розв'яжи графічно систему { x − y = 2; 2x − 2y = 6 }.","steps":[{"do":"x − y = 2: точки (0; −2) і (2; 0)","why":"Дві точки першої прямої.","hl":["f1","f1t"]},{"do":"2x − 2y = 6: точки (0; −3) і (3; 0)","why":"x = 0: −2y = 6, y = −3; y = 0: 2x = 6, x = 3.","hl":["f2","f2t"]},{"do":"Прямі паралельні: друга лежить на 1 нижче за першу","why":"Поділимо друге рівняння на 2: x − y = 3. Різниця x − y не може бути водночас 2 і 3.","hl":["f1","f2","f1t","f2t"]}],"answer":"Відповідь: розв'язків немає.","fig":{"caption":"Пряма x − y = 2 проходить через (0; −2) і (2; 0), пряма 2x − 2y = 6 — через (0; −3) і (3; 0). Прямі паралельні: друга на 1 нижче за першу.","view":[-2,-4,5,3],"axes":{"step":1,"every":1},"points":{"A":[0,-2],"B":[2,0],"C":[0,-3],"D":[3,0]},"lp":{"A":"e","B":"nw","C":"se","D":"nw"},"items":[{"t":"fn","k":1,"b":-2,"id":"f1"},{"t":"fn","k":1,"b":-3,"id":"f2"},{"t":"label","at":[2.083,1.39],"text":"x − y = 2","id":"f1t"},{"t":"label","at":[3.693,-0.78],"text":"2x − 2y = 6","id":"f2t"}],"check":[{"on":["A",1,-2]},{"on":["B",1,-2]},{"on":["C",1,-3]},{"on":["D",1,-3]}]}}],"mistakes":["Читають координати точки перетину навпаки — спершу по вертикалі. Правильно: спершу x (по горизонталі), потім y.","Вірять малюнку без перевірки. Неточно проведена пряма зсуває точку перетину — підстав пару в обидва рівняння.","Бачать на малюнку майже паралельні прямі й пишуть «розв'язків немає». Перевір рівняння: справді паралельні прямі мають однакові ліві частини після ділення на число, а праві — різні."],"check":[{"q":"У якій точці перетинаються графіки рівнянь x + y = 6 та y = x?","options":["(2; 4)","(3; 3)","(6; 0)"],"correct":1,"a":"(3; 3): 3 + 3 = 6 і 3 = 3. Точка (2; 4) лежить лише на першій прямій, (6; 0) — теж лише на першій."},{"q":"Пастка: як розташовані графіки рівнянь системи { x + 2y = 4; 2x + 4y = 8 } і скільки в неї розв'язків?","options":["Перетинаються — один розв'язок","Паралельні — жодного","Збігаються — безліч"],"correct":2,"a":"Друге рівняння — це перше, помножене на 2. Отже, це та сама пряма: прямі збігаються, розв'язків безліч."},{"q":"Оля і Петро мають разом 8 цукерок, у Олі на 2 більше. x — цукерки Олі, y — Петра: { x + y = 8; x − y = 2 }. Побудуй обидві прямі в зошиті. Скільки цукерок в Олі (координата x точки перетину)?","accept":["5"],"a":"Прямі перетинаються в точці (5; 3): 5 + 3 = 8 і 5 − 3 = 2. В Олі 5 цукерок, у Петра 3."}]}},{"id":"A4.2.3","name":"Спосіб підстановки","status":"ready","programmeRef":"способом підстановки","lesson":{"what":"<b>Спосіб підстановки<\/b>: з одного рівняння виражаємо одну змінну через іншу (наприклад, y = 2x − 1) і підставляємо цей вираз у друге рівняння. Виходить рівняння з однією змінною, яке ми вже вміємо розв'язувати.","ideas":["Порядок: 1) вирази змінну з одного рівняння; 2) підстав у друге; 3) розв'яжи рівняння з однією змінною; 4) знайди другу змінну; 5) перевір пару в обох рівняннях.","Виражай ту змінну, перед якою стоїть 1 або −1, — тоді не буде дробів.","Вираз підставляй <b>у дужках<\/b>: якщо x = 5 − 2y, то 3x = 3(5 − 2y).","Якщо змінна зникла і вийшла правильна рівність (0 = 0) — розв'язків безліч; неправильна (−2 = 4) — розв'язків немає."],"rules":[{"f":"{ y = 2x − 1; 3x + y = 9 } → 3x + (2x − 1) = 9","means":"Замість y у друге рівняння записали вираз 2x − 1 з першого."}],"examples":[{"task":"Розв'яжи систему { y = 2x − 1; 3x + y = 9 } способом підстановки.","steps":[{"do":"3x + (2x − 1) = 9","why":"y уже виражено — підставили 2x − 1 у друге рівняння."},{"do":"5x − 1 = 9, 5x = 10, x = 2","why":"Звели подібні й розв'язали лінійне рівняння."},{"do":"y = 2 · 2 − 1 = 3","why":"Знайдене x підставили у вираз для y."},{"do":"Перевірка: 3 = 2 · 2 − 1 і 3 · 2 + 3 = 9","why":"Обидва рівняння виконуються."}],"answer":"Відповідь: (2; 3)."},{"task":"Розв'яжи систему { x + 2y = 5; 3x − y = 8 } способом підстановки.","steps":[{"do":"x = 5 − 2y","why":"У першому рівнянні перед x стоїть 1 — його й виражаємо."},{"do":"3(5 − 2y) − y = 8","why":"Підставили вираз у друге рівняння, у дужках."},{"do":"15 − 6y − y = 8, −7y = −7, y = 1","why":"Розкрили дужки, звели подібні, перенесли 15 праворуч."},{"do":"x = 5 − 2 · 1 = 3","why":"Знайшли другу змінну."},{"do":"Перевірка: 3 + 2 · 1 = 5 і 3 · 3 − 1 = 8","why":"Обидві рівності правильні."}],"answer":"Відповідь: (3; 1)."},{"task":"Розв'яжи систему { 3x + 2y = 1; x − 4y = 19 } способом підстановки.","steps":[{"do":"x = 19 + 4y","why":"З другого рівняння: перенесли −4y праворуч зі зміною знака."},{"do":"3(19 + 4y) + 2y = 1, 57 + 12y + 2y = 1","why":"Підставили в перше рівняння й розкрили дужки."},{"do":"14y = 1 − 57, 14y = −56, y = −4","why":"Перенесли 57 праворуч і поділили на 14."},{"do":"x = 19 + 4 · (−4) = 19 − 16 = 3","why":"Знайшли x."},{"do":"Перевірка: 3 · 3 + 2 · (−4) = 9 − 8 = 1 і 3 − 4 · (−4) = 3 + 16 = 19","why":"Обидві рівності правильні."}],"answer":"Відповідь: (3; −4)."}],"mistakes":["Підставляють без дужок: з x = 5 − 2y пишуть 3 · 5 − 2y. Правильно: 3(5 − 2y) = 15 − 6y.","Знаходять x і зупиняються. Розв'язок системи — пара, тож знайди й другу змінну.","Підставляють вираз назад у те саме рівняння, з якого його отримали, — і виходить 0 = 0. Підставляй у <b>друге<\/b> рівняння."],"check":[{"q":"Розв'яжи систему { y = x + 2; 2x + y = 11 }. Чому дорівнює x?","accept":["3"],"a":"2x + (x + 2) = 11, 3x = 9, x = 3; y = 3 + 2 = 5. Перевірка: 5 = 3 + 2 і 6 + 5 = 11."},{"q":"Пастка: розв'яжи систему { y = 3x + 1; 6x − 2y = 4 }.","options":["(1; 4)","Розв'язків немає","Безліч розв'язків"],"correct":1,"a":"6x − 2(3x + 1) = 4, 6x − 6x − 2 = 4, −2 = 4 — неправильно за будь-якого x. Розв'язків немає. Пара (1; 4) підходить лише до першого рівняння: 6 − 8 = −2 ≠ 4."},{"q":"За 3 зошити і 2 ручки заплатили 90 грн. Ручка дорожча за зошит на 5 грн. x — ціна зошита, y — ціна ручки: { y = x + 5; 3x + 2y = 90 }. Скільки гривень коштує ручка?","accept":["21"],"a":"3x + 2(x + 5) = 90, 5x + 10 = 90, x = 16; y = 16 + 5 = 21. Перевірка: 3 · 16 + 2 · 21 = 48 + 42 = 90."}]}},{"id":"A4.2.4","name":"Спосіб додавання","status":"ready","programmeRef":"способом додавання.","lesson":{"what":"<b>Спосіб додавання<\/b>: додаємо рівняння системи почленно — ліву частину з лівою, праву з правою, — щоб одна змінна зникла. Якщо коефіцієнти (числа перед змінною) не протилежні, спершу множимо одне чи обидва рівняння на підходящі числа.","ideas":["Протилежні коефіцієнти, як 3y і −3y, при додаванні дають 0 — змінна y зникає.","Множ <b>усе<\/b> рівняння — і ліву, і праву частину: 2x − y = 1 після множення на 3 стає 6x − 3y = 3.","Коли одну змінну знайдено, підстав її в будь-яке з початкових рівнянь — знайдеш другу.","Якщо зникли обидві змінні: 0 = 0 — розв'язків безліч, 0 = 5 — розв'язків немає.","Наприкінці перевір пару в обох рівняннях."],"rules":[{"f":"{ A = B; C = D } → A + C = B + D","means":"Якщо дві рівності правильні, то й рівність їх сум правильна."}],"examples":[{"task":"Розв'яжи систему { x + y = 7; x − y = 3 } способом додавання.","steps":[{"do":"(x + y) + (x − y) = 7 + 3, 2x = 10","why":"Коефіцієнти перед y протилежні (1 і −1) — y зникає."},{"do":"x = 5","why":"Поділили на 2."},{"do":"5 + y = 7, y = 2","why":"Підставили x = 5 у перше рівняння."},{"do":"Перевірка: 5 + 2 = 7 і 5 − 2 = 3","why":"Обидві рівності правильні."}],"answer":"Відповідь: (5; 2)."},{"task":"Розв'яжи систему { 2x + 3y = 13; 2x − y = 1 } способом додавання.","steps":[{"do":"Друге рівняння помножимо на 3: 6x − 3y = 3","why":"Тепер перед y стоять 3 і −3 — протилежні числа."},{"do":"(2x + 3y) + (6x − 3y) = 13 + 3, 8x = 16, x = 2","why":"Додали перше рівняння і нове друге."},{"do":"2 · 2 − y = 1, y = 3","why":"Підставили x = 2 у початкове друге рівняння."},{"do":"Перевірка: 2 · 2 + 3 · 3 = 13 і 2 · 2 − 3 = 1","why":"Обидві рівності правильні."}],"answer":"Відповідь: (2; 3)."},{"task":"Розв'яжи систему { 3x + 2y = 4; 2x − 5y = 9 } способом додавання.","steps":[{"do":"Перше помножимо на 5: 15x + 10y = 20; друге на 2: 4x − 10y = 18","why":"Перед y з'явилися протилежні числа 10 і −10."},{"do":"19x = 38, x = 2","why":"Додали рівняння: 15x + 4x = 19x, 20 + 18 = 38."},{"do":"3 · 2 + 2y = 4, 2y = −2, y = −1","why":"Підставили x = 2 у початкове перше рівняння."},{"do":"Перевірка: 3 · 2 + 2 · (−1) = 4 і 2 · 2 − 5 · (−1) = 4 + 5 = 9","why":"Обидві рівності правильні."}],"answer":"Відповідь: (2; −1)."}],"mistakes":["Множать лише ліву частину: 2x − y = 1 → 6x − 3y = 1. Правильно: 6x − 3y = 3 — множимо й праву.","Додають рівняння з однаковими коефіцієнтами: 2x + 2x = 4x — змінна не зникла. Потрібні протилежні числа: спершу помнож одне з рівнянь на −1.","Помиляються зі знаками: −5 · (−1) записують як −5. Мінус на мінус — плюс: −5 · (−1) = 5."],"check":[{"q":"Розв'яжи систему { 2x + y = 11; 3x − y = 4 }.","options":["(5; 1)","(1; 9)","(3; 5)"],"correct":2,"a":"Додаємо: 5x = 15, x = 3; 2 · 3 + y = 11, y = 5. Перевірка: 6 + 5 = 11 і 9 − 5 = 4. Пари (5; 1) і (1; 9) задовольняють лише перше рівняння."},{"q":"Пастка: скільки розв'язків має система { 2x + 3y = 5; 4x + 6y = 10 }?","options":["Жодного","Безліч","Один: (1; 1)"],"correct":1,"a":"Помножимо перше на −2: −4x − 6y = −10. Додамо до другого: 0 = 0. Розв'язків безліч: (1; 1) — лише один із них, є ще (4; −1), (−2; 3)…"},{"q":"У скарбничці 12 монет по 2 грн і по 5 грн, разом 39 грн. x — монети по 2 грн, y — по 5 грн: { x + y = 12; 2x + 5y = 39 }. Скільки монет по 5 грн?","accept":["5"],"a":"Перше помножимо на −2: −2x − 2y = −24. Додамо до другого: 3y = 15, y = 5; x = 7. Перевірка: 7 + 5 = 12 і 14 + 25 = 39."}]}}]},{"id":"A4.3","name":"Задачі за допомогою систем","what":"Дві невідомі величини — два рівняння.","subtopics":[{"id":"A4.3.1","name":"Складаємо систему за умовою задачі","status":"ready","programmeRef":"Розв'язування задач за допомогою систем лiнійних рівнянь.","lesson":{"what":"Якщо в задачі дві невідомі величини, позначаємо їх x і y і з двох умов задачі складаємо два рівняння — виходить система. Таку систему називають <b>математичною моделлю<\/b> задачі: вона записує умову мовою математики.","ideas":["Порядок: що відомо → що знайти → що позначимо x, а що y → два рівняння → розв'язуємо систему → відповідь словами.","Кожна умова задачі («разом 25», «на 4 більше», «утричі старша») дає одне рівняння.","Усі величини — в однакових одиницях: гривні з гривнями, роки з роками.","Перевір відповідь за текстом задачі, а не лише за системою, і чи вона розумна: кількість людей чи квитків — ціле невід'ємне число."],"rules":[{"f":"дві невідомі → дві умови → система з двох рівнянь","means":"Скільки невідомих позначили буквами, стільки й рівнянь треба скласти."}],"examples":[{"task":"Сума двох чисел дорівнює 30, а їх різниця — 8. Знайди ці числа.","steps":[{"do":"Більше число — x, менше — y: { x + y = 30; x − y = 8 }","why":"Дві умови — два рівняння."},{"do":"Додамо рівняння: 2x = 38, x = 19","why":"Коефіцієнти перед y протилежні — спосіб додавання."},{"do":"19 + y = 30, y = 11","why":"Підставили x у перше рівняння."},{"do":"Перевірка: 19 + 11 = 30 і 19 − 11 = 8","why":"Обидві умови задачі виконуються."}],"answer":"Відповідь: 19 і 11."},{"task":"Для класу купили 25 квитків до театру: дитячі по 80 грн і дорослі по 120 грн. Усього заплатили 2200 грн. Скільки купили дитячих квитків?","steps":[{"do":"x — дитячі квитки, y — дорослі: { x + y = 25; 80x + 120y = 2200 }","why":"Перша умова — кількість квитків, друга — вартість."},{"do":"y = 25 − x; 80x + 120(25 − x) = 2200","why":"Спосіб підстановки: виразили y з першого рівняння."},{"do":"80x + 3000 − 120x = 2200, −40x = −800, x = 20","why":"Розкрили дужки, звели подібні, поділили на −40."},{"do":"y = 25 − 20 = 5. Перевірка: 20 · 80 + 5 · 120 = 1600 + 600 = 2200","why":"Вартість збігається з умовою."}],"answer":"Відповідь: 20 дитячих квитків (і 5 дорослих)."},{"task":"Мама старша за доньку на 26 років, а через 4 роки буде старшою за неї утричі. Скільки років кожній зараз?","steps":[{"do":"x — вік мами зараз, y — вік доньки зараз","why":"Дві невідомі величини."},{"do":"{ x − y = 26; x + 4 = 3(y + 4) }","why":"Через 4 роки кожна стане старшою на 4 роки — додаємо 4 до обох."},{"do":"x = y + 26; y + 26 + 4 = 3y + 12, 30 − 12 = 3y − y, 2y = 18, y = 9","why":"Підставили x з першого рівняння в друге."},{"do":"x = 9 + 26 = 35. Перевірка: 35 − 9 = 26; через 4 роки 39 і 13, 39 = 3 · 13","why":"Обидві умови виконуються."}],"answer":"Відповідь: мамі 35 років, доньці 9 років."}],"mistakes":["Складають одне рівняння для двох невідомих. Правильно: дві невідомі — дві умови — два рівняння.","У задачах на вік додають роки лише одній людині. Через 4 роки старшими на 4 роки стануть <b>обидві<\/b>.","Відповідають не на те питання: знайшли x і y, а питали лише про дорослі квитки. Перечитай питання перед відповіддю."],"check":[{"q":"У класі 28 учнів, дівчат на 4 більше, ніж хлопців. x — кількість дівчат, y — хлопців. Яка система є моделлю задачі?","options":["{ x + y = 28; x − y = 4 }","{ x + y = 28; y − x = 4 }","{ x − y = 28; x + y = 4 }"],"correct":0,"a":"Разом 28 — x + y = 28; дівчат на 4 більше — x − y = 4. Розв'язок: 16 дівчат і 12 хлопців (16 + 12 = 28, 16 − 12 = 4)."},{"q":"Пастка: ручка коштує x грн, зошит — y грн. 2 ручки і 3 зошити коштують 60 грн, а 4 ручки і 6 зошитів — 100 грн. Скільки розв'язків має ця задача?","options":["Один","Жодного — умова суперечлива","Безліч"],"correct":1,"a":"{ 2x + 3y = 60; 4x + 6y = 100 }. 4 ручки і 6 зошитів — це вдвічі більша покупка, тож мала б коштувати 120 грн, а не 100. Розв'язків немає."},{"q":"За 3 кг яблук і 2 кг груш заплатили 130 грн, а за 2 кг яблук і 3 кг груш — 145 грн. Скільки гривень коштує 1 кг груш?","accept":["35"],"a":"{ 3x + 2y = 130; 2x + 3y = 145 }, x — ціна яблук, y — груш. Перше помножимо на 2, друге на −3 і додамо: −5y = −175, y = 35; x = 20. Перевірка: 60 + 70 = 130 і 40 + 105 = 145."}]}}]}]}]},{"id":"geometry","name":"Геометрія","grade":7,"tutor":"Оля","tutorCall":"Олю","icon":"📐","sections":[{"id":"G1","subject":"geometry","name":"Елементарні геометричні фігури та їх властивості","what":"Точки, прямі, відрізки, промені й кути — з них складається вся геометрія. Учимося їх вимірювати.","topics":[{"id":"G1.1","name":"Точка, пряма, відрізок, промінь","what":"Найпростіші фігури і їхні властивості.","subtopics":[{"id":"G1.1.1","name":"Геометричні фігури. Точка і пряма","status":"ready","programmeRef":"Геометричні фігури.","lesson":{"what":"Геометрія вивчає фігури. <b>Геометрична фігура<\/b> — це будь-який набір точок: точка, пряма, трикутник, коло. Найпростіші з них — <b>точка<\/b> і <b>пряма<\/b>.","ideas":["Точка не має ні довжини, ні ширини. Її моделі — слід від гострого олівця, зірка на нічному небі, місто на великій карті. Точки позначають великими латинськими літерами: A, B, C.","Пряма не має ні початку, ні кінця — вона нескінченна в обидва боки. У зошиті ми малюємо за лінійкою лише її частину. Моделі прямої — туго натягнута нитка, промінь лазерної указки.","Пряму позначають малою латинською літерою (пряма <i>a<\/i>) або двома її точками (пряма AB). Пряма AB і пряма BA — це та сама пряма.","Якщо точка лежить на прямій, кажуть, що вона <b>належить<\/b> прямій: A ∈ <i>a<\/i>. Якщо не лежить — не належить: B ∉ <i>a<\/i>.","Дві прямі, які мають спільну точку, <b>перетинаються<\/b> в цій точці."],"rules":[{"f":"Через будь-які дві точки можна провести пряму, і до того ж тільки одну.","means":"Основна властивість прямої. Дві точки повністю задають пряму — тому пряму можна назвати двома її точками."},{"f":"Яка б не була пряма, існують точки, що належать цій прямій, і точки, що їй не належать.","means":"Поруч із будь-якою прямою завжди можна позначити точку і на ній, і поза нею."},{"f":"Дві різні прямі мають не більше однієї спільної точки.","means":"Якби спільних точок було дві, то через них проходили б дві різні прямі, а так не буває (див. основну властивість)."}],"examples":[{"task":"Накресліть пряму <i>a<\/i>. Позначте на ній точки A і B, а поза нею — точку C. Запишіть символами, які точки належать прямій <i>a<\/i>, а які ні. Чи можна провести через A і B ще одну пряму, відмінну від <i>a<\/i>?","steps":[{"do":"Малюємо пряму <i>a<\/i>, на ній точки A і B, а трохи вище прямої — точку C.","why":"Яка б не була пряма, є точки, що їй належать, і точки, що їй не належать.","hl":["l1"]},{"do":"A і B лежать на прямій, тому A ∈ <i>a<\/i>, B ∈ <i>a<\/i>.","why":"«Належить» означає «лежить на».","hl":["l1"]},{"do":"C не лежить на прямій, тому C ∉ <i>a<\/i>.","why":"Знак ∉ означає «не належить»."},{"do":"Інша пряма через A і B неможлива: через них уже проходить пряма <i>a<\/i>.","why":"Через дві точки можна провести пряму, і до того ж тільки одну.","hl":["l1"]}],"answer":"Відповідь: A ∈ <i>a<\/i>, B ∈ <i>a<\/i>, C ∉ <i>a<\/i>; іншої прямої через A і B провести не можна.","fig":{"caption":"Пряма a, на ній точки A і B, над прямою — точка C.","view":[-4,-1,4,2.4],"points":{"A":[-2,0],"B":[1.5,0],"C":[0,1.6]},"lp":{"A":"s","B":"s","C":"n"},"items":[{"t":"line","p":["A","B"],"id":"l1"},{"t":"label","at":[3.6,0.35],"text":"a"}]}},{"task":"Позначте в зошиті чотири точки A, B, C, D так, щоб жодні три з них не лежали на одній прямій. Скільки різних прямих можна провести через кожні дві з цих точок?","steps":[{"do":"Малюємо: чотири точки, наче кути неправильного чотирикутника. Дано: 4 точки, жодні три не на одній прямій. Знайти: кількість прямих.","why":"Спершу малюнок — так легше нічого не пропустити."},{"do":"Через точку A проводимо прямі до кожної з інших: AB, AC, AD — 3 прямі.","why":"Через дві точки проходить одна пряма, і тільки одна.","hl":["l1","l2","l3"]},{"do":"Через точку B — нові прямі BC і BD (пряму BA вже порахували) — 2 прямі. Через C — нова пряма CD — 1 пряма.","why":"Пряма AB і пряма BA — та сама пряма, рахувати її двічі не можна.","hl":["l4","l5","l6"]},{"do":"Разом: 3 + 2 + 1 = 6.","why":"Жодні три точки не на одній прямій, тому всі ці прямі різні.","hl":["l1","l2","l3","l4","l5","l6"]}],"answer":"Відповідь: 6 прямих (AB, AC, AD, BC, BD, CD).","fig":{"caption":"Чотири точки A, B, C, D, жодні три не на одній прямій, і шість прямих через кожні дві з них: AB, AC, AD, BC, BD, CD.","view":[-2,-1.5,6,4.5],"points":{"A":[0,0],"B":[4,0.5],"C":[3.2,3],"D":[-0.5,2.3]},"lp":{"A":"sw","B":"se","C":"ne","D":"nw"},"items":[{"t":"line","p":["A","B"],"id":"l1"},{"t":"line","p":["A","C"],"id":"l2"},{"t":"line","p":["A","D"],"id":"l3"},{"t":"line","p":["B","C"],"id":"l4"},{"t":"line","p":["B","D"],"id":"l5"},{"t":"line","p":["C","D"],"id":"l6"}]}},{"task":"Три прямі <i>a<\/i>, <i>b<\/i>, <i>c<\/i> попарно перетинаються, але не проходять через одну точку. Скільки всього точок перетину? Накресліть у зошиті: три прямі, що утворюють «трикутник».","steps":[{"do":"Дано: прямі <i>a<\/i>, <i>b<\/i>, <i>c<\/i> попарно перетинаються, через одну точку всі три не проходять. Знайти: кількість точок перетину.","why":"Записуємо умову."},{"do":"Складаємо пари прямих: <i>a<\/i> і <i>b<\/i>, <i>a<\/i> і <i>c<\/i>, <i>b<\/i> і <i>c<\/i> — 3 пари.","why":"Кожна точка перетину належить якійсь парі прямих.","hl":["la","lb","lc"]},{"do":"Кожна пара має рівно одну спільну точку.","why":"Дві різні прямі мають не більше однієї спільної точки, а за умовою вони перетинаються.","hl":["la","lb"]},{"do":"Ці три точки різні, бо всі три прямі не проходять через одну точку. Разом 3 точки.","why":"Якби дві точки перетину збіглися, три прямі пройшли б через неї.","hl":["la","lb","lc"]}],"answer":"Відповідь: 3 точки перетину.","fig":{"caption":"Три прямі a, b, c утворюють «трикутник»: a і b перетинаються в точці K, a і c — у точці L, b і c — у точці M.","view":[-1.5,-1.2,6,4],"points":{"K":[0,0],"L":[4,0],"M":[1.5,2.8]},"lp":{"K":"nw","L":"ne","M":"e"},"items":[{"t":"line","p":["K","L"],"id":"la"},{"t":"line","p":["K","M"],"id":"lb"},{"t":"line","p":["L","M"],"id":"lc"},{"t":"label","at":[5.6,-0.35],"text":"a"},{"t":"label","at":[2.3,3.5],"text":"b"},{"t":"label","at":[0.4,3.5],"text":"c"}]}}],"mistakes":["Вважати, що в прямої є кінці або довжина. Пряма нескінченна; кінці є у відрізка.","Рахувати пряму AB і пряму BA як дві різні прямі.","Думати, що через будь-які три точки можна провести одну пряму. Це так лише тоді, коли точки лежать на одній прямій."],"check":[{"q":"<b>Пастка.<\/b> Через будь-які три точки можна провести одну пряму?","options":["Так, завжди","Лише якщо вони лежать на одній прямій","Ніколи"],"correct":1,"a":"Лише якщо точки лежать на одній прямій. Інакше через кожні дві точки — своя пряма, разом 3 прямі."},{"q":"Садівник хоче посадити цибулю рівним рядком і натягнути мотузку між кілочками. Скільки кілочків йому досить?","options":["Три","Один","Два"],"correct":2,"a":"Два, бо через дві точки проходить пряма, і тільки одна."},{"q":"Позначили 5 точок, жодні три з яких не лежать на одній прямій. Скільки різних прямих можна провести через кожні дві з них? Введіть число.","accept":["10"],"a":"4 + 3 + 2 + 1 = 10: від першої точки — 4 прямі, від другої — ще 3 нові, і так далі."}],"fig":{"caption":"Прямі a і b перетинаються в точці O. Точка A лежить на прямій a (A ∈ a), точка B не лежить на прямій a (B ∉ a).","view":[-4.5,-1.5,4.5,3],"points":{"A":[-2.5,0],"O":[1,0],"Q":[2,1.732],"B":[-2,2]},"hide":["Q"],"lp":{"A":"s","O":"se","B":"n"},"items":[{"t":"line","p":["A","O"],"s":"hl","id":"la"},{"t":"line","p":["O","Q"],"s":"hl2","id":"lb"},{"t":"label","at":[4,0.35],"text":"a"},{"t":"label","at":[2.55,2.6],"text":"b"}],"check":[{"ang":[["A","O","Q"],120]}]}}},{"id":"G1.1.2","name":"Відрізок і промінь","status":"ready","programmeRef":"Точка, пряма, відрізок, промінь, кут. Їх властивості.","lesson":{"what":"<b>Відрізок<\/b> AB — частина прямої між точками A і B разом із цими точками; A і B — його <b>кінці<\/b>. <b>Промінь<\/b> — частина прямої, що має початок, але не має кінця: точка і всі точки прямої по один бік від неї.","ideas":["Порівняйте: у відрізка два кінці, у променя — лише початок, у прямої — ні початку, ні кінця.","«Точка C <b>лежить між<\/b> точками A і B» означає: C лежить на відрізку AB і не збігається з його кінцями.","Промінь називають двома літерами, і першою завжди пишуть початок: промінь OA починається в точці O і йде через точку A. Промінь AO — це вже інший промінь.","Точка O на прямій ділить її на два промені з початком O, які йдуть у протилежні боки. Їх називають <b>доповняльними<\/b>: разом вони складають усю пряму.","Моделі: край лінійки чи натягнута струна — відрізок; світло від ліхтарика — промінь (є початок, а далі воно йде в один бік)."],"rules":[{"f":"З трьох точок на прямій одна і тільки одна лежить між двома іншими.","means":"Основна властивість розміщення точок на прямій: якщо три точки на одній прямій, то рівно одна з них — «посередині»."},{"f":"Промінь OA: O — початок, A — будь-яка інша точка променя.","means":"Якщо на промені OA лежить ще точка B, то промінь OB — той самий промінь, що й OA."}],"examples":[{"task":"Накресліть пряму і позначте на ній точки A, B, C так, щоб точка B лежала між A і C. Назвіть промені з початком у точці B. Якому з них належить точка A?","steps":[{"do":"Малюємо пряму, на ній зліва направо A, B, C.","why":"B лежить між A і C, тому вона посередині.","hl":["r1","r2"]},{"do":"Точка B ділить пряму на два доповняльні промені: BA (ліворуч) і BC (праворуч).","why":"Точка на прямій ділить її на два промені; першою пишемо початок.","hl":["r1","r2"]},{"do":"Точка A лежить ліворуч від B, тобто на промені BA, а не на промені BC.","why":"Промінь BC іде від B праворуч, через C.","hl":["r1"]}],"answer":"Відповідь: промені BA і BC; точка A належить променю BA.","fig":{"caption":"Пряма, на ній зліва направо точки A, B, C. Точка B ділить пряму на промені BA (ліворуч) і BC (праворуч).","view":[-4.5,-0.8,4.5,0.8],"points":{"A":[-2.5,0],"B":[0,0],"C":[2.5,0]},"lp":{"A":"n","B":"n","C":"n"},"items":[{"t":"ray","p":["B","A"],"id":"r1"},{"t":"ray","p":["B","C"],"id":"r2"}],"check":[{"col":["A","B","C"]}]}},{"task":"Накресліть пряму і позначте на ній точки M, K, P так, щоб точка K лежала між M і P. Скільки утворилося відрізків з кінцями в цих точках і скільки променів з початками в цих точках?","steps":[{"do":"Малюємо пряму, на ній зліва направо точки M, K, P.","why":"K лежить між M і P, тому вона посередині.","hl":["l1"]},{"do":"Відрізки: MK, KP, MP — 3 відрізки.","why":"Відрізок задають два кінці, а пар точок тут три.","hl":["s1","s2","s3"]},{"do":"Кожна точка ділить пряму на два доповняльні промені: у M — 2, у K — 2, у P — 2. Разом 2 + 2 + 2 = 6.","why":"Точка на прямій ділить її рівно на два промені.","hl":["l1"]},{"do":"Зауважимо: промінь MK і промінь MP — той самий промінь (обидва починаються в M і йдуть праворуч). Тому рахуємо його один раз.","why":"Промінь визначають початок і напрям; точка P лежить на промені MK.","hl":["r1"]}],"answer":"Відповідь: 3 відрізки і 6 променів.","fig":{"caption":"Пряма, на ній зліва направо точки M, K, P. Відрізки MK, KP, MP; промінь MK проходить і через P.","view":[-4.5,-0.8,4.5,0.8],"points":{"M":[-2.5,0],"K":[0,0],"P":[2.5,0]},"lp":{"M":"n","K":"n","P":"n"},"items":[{"t":"line","p":["M","P"],"s":"faint","id":"l1"},{"t":"seg","p":["M","P"],"id":"s3"},{"t":"seg","p":["M","K"],"id":"s1"},{"t":"seg","p":["K","P"],"id":"s2"},{"t":"ray","p":["M","K"],"id":"r1"}],"check":[{"col":["M","K","P"]}]}},{"task":"Точки A, B, C, D лежать на прямій саме в такому порядку. Скільки всього відрізків з кінцями в цих точках? У яких із них точка B лежить між кінцями?","steps":[{"do":"Малюємо пряму і на ній зліва направо A, B, C, D.","why":"Порядок точок задано в умові.","hl":["l1"]},{"do":"Відрізки з кінцем A: AB, AC, AD (3); нові з кінцем B: BC, BD (2); нові з кінцем C: CD (1). Разом 3 + 2 + 1 = 6.","why":"Відрізок задають два кінці; AB і BA — той самий відрізок."},{"do":"B лежить між кінцями, якщо один кінець ліворуч від B, а другий — праворуч. Ліворуч лише A, праворуч — C і D.","why":"Означення «лежить між»."},{"do":"Отже, це відрізки AC і AD.","why":"У AB і BD точка B — кінець, а не внутрішня точка.","hl":["s1","s2"]}],"answer":"Відповідь: 6 відрізків; точка B лежить між кінцями відрізків AC і AD.","fig":{"caption":"Пряма, на ній зліва направо точки A, B, C, D. Точка B лежить між кінцями відрізків AC і AD.","view":[-1.5,-0.8,7.5,0.8],"points":{"A":[0,0],"B":[2,0],"C":[4,0],"D":[6,0]},"lp":{"A":"n","B":"n","C":"n","D":"n"},"items":[{"t":"line","p":["A","D"],"id":"l1"},{"t":"seg","p":["A","D"],"id":"s2"},{"t":"seg","p":["A","C"],"id":"s1"}],"check":[{"col":["A","B","C"]},{"col":["A","B","D"]}]}}],"mistakes":["Плутати промінь OA і промінь AO. Першою літерою завжди пишуть початок.","Вважати промені MK і MP різними, хоча P лежить на промені MK — це той самий промінь.","Плутати відрізок, промінь і пряму на малюнку: відрізок малюють з двома позначеними кінцями, промінь — з одним, пряму — без кінців."],"check":[{"q":"<b>Пастка.<\/b> Що довше: промінь OA чи відрізок OA?","options":["Промінь OA","Відрізок OA","Порівняти не можна: промінь не має довжини"],"correct":2,"a":"Промінь нескінченний, у нього немає довжини. Довжину має лише відрізок."},{"q":"Світло від ліхтарика в темряві — це модель якої фігури?","options":["Відрізка","Променя","Прямої"],"correct":1,"a":"Променя: є початок (ліхтарик), а далі світло йде в один бік."},{"q":"Точки A, B, C лежать на прямій, B лежить між A і C. Чи належить точка C променю AB?","options":["Так","Ні"],"correct":0,"a":"Так: промінь AB іде від A через B і далі, а C лежить за B.","fig":{"caption":"Пряма, на ній точки A, B, C; B лежить між A і C.","view":[-1.5,-0.8,6.5,0.8],"points":{"A":[0,0],"B":[2.2,0],"C":[5,0]},"lp":{"A":"n","B":"n","C":"n"},"items":[{"t":"line","p":["A","C"]}],"check":[{"col":["A","B","C"]}]}}],"fig":{"caption":"Зверху — відрізок AB (два кінці), посередині — промінь OK (початок O, далі без кінця), знизу — пряма a (ні початку, ні кінця).","view":[-1,-0.7,6.5,2.6],"points":{"A":[0,2],"B":[3.5,2],"O":[0,1],"K":[2,1],"P":[0,0],"Q":[2,0]},"hide":["P","Q"],"lp":{"A":"n","B":"n","O":"n","K":"n"},"items":[{"t":"seg","p":["A","B"],"s":"hl","id":"s1"},{"t":"ray","p":["O","K"],"s":"hl2","id":"r1"},{"t":"line","p":["P","Q"],"id":"l1"},{"t":"label","at":[6.1,0.3],"text":"a"}]}}}]},{"id":"G1.2","name":"Кут","what":"Кут, його види і бісектриса.","subtopics":[{"id":"G1.2.1","name":"Кут і види кутів","status":"ready","programmeRef":"Точка, пряма, відрізок, промінь, кут. Їх властивості.","lesson":{"what":"<b>Кут<\/b> — фігура з двох променів зі спільним початком. Промені — це <b>сторони<\/b> кута, а їхній спільний початок — <b>вершина<\/b>.","ideas":["Кут позначають трьома літерами, вершина — завжди посередині: ∠ABC (вершина B). ∠ABC і ∠CBA — той самий кут, а ∠BAC — зовсім інший. Якщо зрозуміло, можна коротко: ∠B.","Кут, сторони якого — доповняльні промені (разом утворюють пряму), називають <b>розгорнутим<\/b>. Він дорівнює 180°.","Види кутів: <b>гострий<\/b> — менший за 90°; <b>прямий<\/b> — 90°; <b>тупий<\/b> — більший за 90°, але менший за 180°; <b>розгорнутий<\/b> — 180°.","Прямий кут на малюнку позначають маленьким квадратиком біля вершини.","Розмір кута не залежить від того, наскільки довгими намальовано його сторони. Моделі кута — стрілки годинника, розкриті ножиці, відчинені двері."],"rules":[{"f":"гострий: менше 90°; прямий: 90°; тупий: від 90° до 180° (не включно); розгорнутий: 180°","means":"Вид кута визначають за його градусною мірою."}],"examples":[{"task":"Визначте вид кожного кута: 35°, 90°, 91°, 179°, 180°.","steps":[{"do":"Згадуємо межі: гострий — менше 90°, прямий — 90°, тупий — більше 90°, але менше 180°, розгорнутий — 180°.","why":"Класифікація кутів за градусною мірою."},{"do":"35° < 90°, тому 35° — гострий; 90° — прямий.","why":"Порівнюємо з 90°."},{"do":"91° і 179° більші за 90°, але менші за 180°, тому обидва тупі.","why":"Навіть 91° — уже тупий, а 179° — ще не розгорнутий."},{"do":"180° — розгорнутий.","why":"Розгорнутий кут дорівнює 180°."}],"answer":"Відповідь: 35° — гострий, 90° — прямий, 91° і 179° — тупі, 180° — розгорнутий."},{"task":"Які кути утворюють годинна і хвилинна стрілки о 2:00, 3:00, 5:00 і 6:00? Назвіть вид кожного кута. Намалюйте в зошиті циферблат із цими положеннями стрілок.","steps":[{"do":"Малюємо циферблат. Повне коло — 360°, на ньому 12 поділок-годин. Одна поділка: 360° : 12 = 30°.","why":"Цифри на циферблаті розміщені через рівні проміжки."},{"do":"О цілій годині хвилинна стрілка на 12, а годинна — точно на числі годин. О 2:00 між ними 2 поділки: 2 · 30° = 60°; о 3:00 — 3 · 30° = 90°.","why":"Кут дорівнює кількості поділок між стрілками, помноженій на 30°.","hl":["a1","a2"]},{"do":"О 5:00: 5 · 30° = 150°; о 6:00: 6 · 30° = 180° — стрілки утворюють пряму.","why":"Той самий підрахунок поділок.","hl":["a3","a4"]},{"do":"Класифікуємо: 60° — гострий; 90° — прямий; 150° — тупий; 180° — розгорнутий.","why":"Порівнюємо з 90° і 180°.","hl":["a1","a2","a3","a4"]}],"answer":"Відповідь: о 2:00 — 60° (гострий), о 3:00 — 90° (прямий), о 5:00 — 150° (тупий), о 6:00 — 180° (розгорнутий).","fig":{"caption":"Чотири циферблати: о 2:00 стрілки утворюють 60°, о 3:00 — 90°, о 5:00 — 150°, о 6:00 — 180° (стрілки на одній прямій). Довга стрілка — хвилинна (на 12), коротка — годинна.","view":[-2.3,-8.2,7.5,2.3],"points":{"O1":[0,0],"M1":[0,1.45],"H1":[0.909,0.525],"O2":[5.2,0],"M2":[5.2,1.45],"H2":[6.25,0],"O3":[0,-5.4],"M3":[0,-3.95],"H3":[0.525,-6.309],"O4":[5.2,-5.4],"M4":[5.2,-3.95],"H4":[5.2,-6.45]},"hide":["O1","M1","H1","O2","M2","H2","O3","M3","H3","O4","M4","H4"],"i :"Нові кути зі стороною OB: ∠BOC, ∠BOD — 2; зі стороною OC: ∠COD — 1.","why":"∠BOA — це вже порахований ∠AOB, вершина O посередині назви.","hl":["a4","a5","a6"]},{"do":"Разом 3 + 2 + 1 = 6.","why":"Кожну пару променів рахуємо один раз.","hl":["a1","a2","a3","a4","a5","a6"]}],"answer":"Відповідь: 6 кутів: ∠AOB, ∠AOC, ∠AOD, ∠BOC, ∠BOD, ∠COD.","fig":{"caption":"З точки O віялом виходять промені OA, OB, OC, OD; дуги показують шість кутів: ∠AOB, ∠AOC, ∠AOD, ∠BOC, ∠BOD, ∠COD.","view":[-4,-0.8,4,4],"points":{"O":[0,0],"A":[2.954,0.521],"B":[1.928,2.298],"C":[-0.261,2.989],"D":[-2.598,1.5]},"lp":{"O":"s"},"items":[{"t":"ray","p":["O","A"]},{"t":"ray","p":["O","B"]},{"t":"ray","p":["O","C"]},{"t":"ray","p":["O","D"]},{"t":"angle","p":["A","O","B"],"s":"faint","id":"a1"},{"t":"angle","p":["A","O","C"],"s":"faint","id":"a2"},{"t":"angle","p":["A","O","D"],"s":"faint","id":"a3"},{"t":"angle","p":["B","O","C"],"s":"faint","id":"a4"},{"t":"angle","p":["B","O","D"],"s":"faint","id":"a5"},{"t":"angle","p":["C","O","D"],"s":"faint","id":"a6"}]}}],"mistakes":["Ставити вершину не посередині назви: для кута з вершиною B писати ∠BAC замість ∠ABC.","Думати, що кут стане більшим, якщо подовжити його сторони. Розмір кута від довжини сторін не залежить.","Плутати прямий кут (90°) з розгорнутим (180°). «Прямий» — не тому, що схожий на пряму!"],"check":[{"q":"<b>Пастка.<\/b> Учень подовжив сторони кута вдвічі. Що сталося з кутом?","options":["Не змінився","Збільшився вдвічі","Зменшився"],"correct":0,"a":"Кут залежить від того, наскільки «розходяться» сторони, а не від їхньої довжини."},{"q":"Двері відчинили так, що між дверима і стіною кут 120°. Який це кут?","options":["Гострий","Прямий","Тупий","Розгорнутий"],"correct":2,"a":"Тупий: 120° більше за 90°, але менше за 180°.","fig":{"caption":"Вигляд згори: стіна OW, двері OD відчинені на 120°.","view":[-2.5,-0.8,3.8,3.2],"points":{"O":[0,0],"W":[3,0],"D":[-1.4,2.425]},"lp":{"O":"s"},"items":[{"t":"seg","p":["O","W"]},{"t":"seg","p":["O","D"]," "Якщо OK — бісектриса ∠AOB, то ∠AOK = ∠KOB, і кожен з них — половина ∠AOB.","У кожного кута є бісектриса, і тільки одна.","Бісектриса розгорнутого кута утворює з його сторонами два прямі кути: 180° : 2 = 90°.","Як знайти бісектрису: виміряти кут транспортиром, поділити на 2 і відкласти половину від однієї сторони. Або вирізати кут з паперу й перегнути так, щоб сторони збіглися: лінія згину — бісектриса."],"rules":[{"f":"OK — бісектриса ∠AOB ⇒ ∠AOK = ∠KOB = ∠AOB : 2","means":"Щоб знайти половинку, ділимо весь кут на 2."},{"f":"∠AOB = 2 · ∠AOK","means":"Щоб знайти весь кут за половинкою, множимо на 2."}],"examples":[{"task":"Промінь OK — бісектриса ∠AOB, ∠AOK = 37°. Знайдіть ∠AOB. Накресліть кут AOB і промінь OK посередині.","steps":[{"do":"Дано: OK — бісектриса ∠AOB, ∠AOK = 37°. Знайти: ∠AOB.","why":"Записуємо умову.","hl":["rk","a1"]},{"do":"∠KOB = ∠AOK = 37°.","why":"Бо бісектриса ділить кут на два рівні кути.","hl":["a1","a2"]},{"do":"∠AOB = ∠AOK + ∠KOB = 37° + 37° = 74°.","why":"Бо промінь OK проходить між сторонами ∠AOB, і кут дорівнює сумі цих кутів.","hl":["a3"]}],"answer":"Відповідь: ∠AOB = 74°.","fig":{"caption":"Кут AOB, промінь OK — його бісектриса; ∠AOK = 37°, ∠KOB = ∠AOK, ∠AOB — ?","view":[-1,-0.8,4.2,3.6],"points":{"O":[0,0],"A":[3.6,0],"K":[2.875,2.167],"B":[0.937,3.268]},"lp":{"O":"s"},"items":[{"t":"ray","p":["O","A"]},{"t":"ray","p":["O","B"]},{"t":"ray","p":["O","K"],"s":"hl","id":"rk"},{"t":"angle","p":["A","O","K"],"label":"37°","arcs":1,"id":"a1"},{"t":"angle","p":["K","O","B"],"arcs":1,"id":"a2"},{"t":"angle","p":["A","O","B"],"label":"?","id":"a3"}],"check":[{"ang":[["A","O","B"],74]}]}},{"task":"∠AOB = 140°. Промінь OK — бісектриса ∠AOB, промінь OM — бісектриса ∠AOK. Знайдіть ∠MOB. Накресліть у зошиті: кут AOB, всередині промінь OK, а між OA і OK — промінь OM.","steps":[{"do":"Дано: ∠AOB = 140°, OK — бісектриса ∠AOB, OM — бісектриса ∠AOK. Знайти: ∠MOB.","why":"Записуємо умову, щоб бачити, що відомо.","hl":["a0"]},{"do":"∠AOK = ∠KOB = 140° : 2 = 70°.","why":"Бо бісектриса ділить кут навпіл.","hl":["rk","a1","a2"]},{"do":"∠MOK = 70° : 2 = 35°.","why":"Бо OM — бісектриса ∠AOK.","hl":["rm","a3","a4"]},{"do":"∠MOB = ∠MOK + ∠KOB = 35° + 70° = 105°.","why":"Бо промінь OK проходить між сторонами ∠MOB, а кут дорівнює сумі кутів, на які його ділить такий промінь.","hl":["a4","a2","a5"]}],"answer":"Відповідь: ∠MOB = 105°.","fig":{"caption":"∠AOB = 140°, OK — бісектриса ∠AOB, OM — бісектриса ∠AOK. Однакові дуги — рівні кути. Шуканий ∠MOB позначено «?».","view":[-3.5,-0.8,4,3.8],"points":{"O":[0,0],"A":[3.6,0],"M":[2.785,1.95],"K":[1.163,3.195],"B":[-2.605,2.185]},"lp":{"O":"s"},"items":[{"t":"ray","p":["O","A"]},{"t":"ray","p":["O","B"]},{"t":"ray","p":["O","K"],"s":"hl","id":"rk"},{"t":"ray","p":["O","M"],"s":"hl2","id":"rm"},{"t":"angle","p":["A","O","B"],"label":"140°","id":"a0"},{"t":"angle","p":["A","O","M"],"arcs":2,"id":"a3"},{"t":"angle","p":["M","O","K"],"arcs":2,"id":"a4"},{"t":"angle","p":["K","O","B"],"arcs":1,"id":"a2"},{"t":"angle","p":["A","O","K"],"arcs":1,"id":"a1"},{"t":"angle","p":["M","O","B"],"label":"?","id":"a5"}],"check":[{"ang":[["A","O","B"],140]},{"ang":[["M","O","B"],105]}]}},{"task":"О 3:00 стрілки годинника утворюють прямий кут. Яким числом циферблата «вказує» бісектриса цього кута, і який кут вона утворює з хвилинною стрілкою? Намалюйте циферблат і бісектрису.","steps":[{"do":"О 3:00 хвилинна стрілка на 12, годинна на 3; кут між ними 3 · 30° = 90°.","why":"Одна поділка циферблата — 360° : 12 = 30°.","hl":["sm","sh","a0"]},{"do":"Бісектриса утворює з кожною стрілкою кут 90° : 2 = 45°.","why":"Бо бісектриса ділить кут навпіл.","hl":["sl","a1","a2"]},{"do":"45° : 30° = 1,5 поділки від числа 12, тобто рівно посередині між 1 і 2.","why":"Кожна поділка — 30°, а 45° — це півтори поділки.","hl":["sl"]}],"answer":"Відповідь: бісектриса проходить посередині між числами 1 і 2 і утворює з хвилинною стрілкою кут 45°.","fig":{"caption":"Циферблат о 3:00: хвилинна стрілка на 12, годинна на 3, кут мі
