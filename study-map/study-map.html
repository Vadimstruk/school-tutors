<b>ач<\/b> — суфіксальний","why":"До основи <i>чит-<\/i> додали суфікс <i>-ач-<\/i>."},{"do":"<i>ліс<\/i> + <i>рубати<\/i> → <i>ліс<\/i><b>о<\/b><i>руб<\/i> — складання основ","why":"Дві основи з’єднано сполучним голосним <i>о<\/i>."}],"answer":"Відповідь: префіксальний, суфіксальний, складання основ."},{"task":"Яким способом утворено слово <i>підвіконня<\/i>?","steps":[{"do":"Твірне слово — <i>вікно<\/i>","why":"<i>Підвіконня<\/i> — «те, що під вікном»."},{"do":"Пробуємо лише префікс: «підвікно» — такого слова немає","why":"Отже, самого префікса замало."},{"do":"Пробуємо лише суфікс: «віконня» — такого слова теж немає","why":"Отже, і суфікс окремо не додавали."},{"do":"Префікс <i>під-<\/i> і суфікс додано одночасно","why":"Це і є префіксально-суфіксальний спосіб."}],"answer":"Відповідь: префіксально-суфіксальний."}],"mistakes":["Твірним для <i>лісник<\/i> називають <i>лісовий<\/i>. Правильно: <i>ліс<\/i> — лісник доглядає ліс; твірне слово найближче за значенням і будовою.","<i>Пароплав<\/i> вважають утвореним за допомогою префікса. Правильно: це складання основ <i>пар<\/i> + <i>плав(ати)<\/i> зі сполучним <i>о<\/i>.","<i>Прадід<\/i> вважають складним словом. Правильно: <i>пра-<\/i> — префікс, окремо він не вживається, тож спосіб префіксальний."],"check":[{"q":"Яким способом утворено слово <i>вчителька<\/i>?","options":["префіксальний","суфіксальний","складання основ","префіксально-суфіксальний"],"correct":1,"a":"<i>Вчитель<\/i> + суфікс <i>-к-<\/i> → <i>вчителька<\/i>: суфіксальний спосіб."},{"q":"Пастка: яким способом утворено слово <i>прабабуся<\/i>?","options":["префіксальний","складання основ","суфіксальний"],"correct":0,"a":"До слова <i>бабуся<\/i> додали префікс <i>пра-<\/i>. Це не складання: <i>пра-<\/i> — не окреме слово."},{"q":"Ти пишеш оголошення для шкільної бібліотеки. Утвори від дієслова <i>читати<\/i> суфіксальним способом іменник чоловічого роду зі значенням «той, хто читає». Напиши одне слово в називному відмінку.","accept":["читач","читець"],"a":"<i>Читач<\/i>: <i>чит-<\/i> + суфікс <i>-ач-<\/i>. Підходить і <i>читець<\/i> (суфікс <i>-ець-<\/i>), але так частіше називають того, хто читає вголос перед слухачами."}]}},{"id":"U1.2.2","name":"Лексичне значення слова. Фразеологізми","status":"ready","programmeRef":"Лексичне значення слова. Групи слів за значенням, походженням, вживанням. Фразеологізми.","lesson":{"what":"<b>Лексичне значення<\/b> — це те, що слово означає: предмет, ознаку, дію (<i>парта<\/i> — «стіл для учня в класі»). Слова групують за значенням, походженням і вживанням. <b>Фразеологізм<\/b> — стійке сполучення слів з одним цілісним значенням: <i>бити байдики<\/i> — «ледарювати».","ideas":["За значенням слово буває <b>однозначне<\/b> чи <b>багатозначне<\/b>, вживається в <b>прямому<\/b> чи <b>переносному<\/b> значенні (<i>золотий перстень<\/i> — <i>золоті руки<\/i>). Є <b>синоніми<\/b> (<i>сміливий — хоробрий<\/i>), <b>антоніми<\/b> (<i>день — ніч<\/i>) і <b>омоніми<\/b> — однакові за звучанням, але різні за значенням (<i>коса<\/i> дівчини й <i>коса<\/i> для трави).","За походженням слова бувають <b>власне українські<\/b> (<i>мрія<\/i>, <i>рідний<\/i>) і <b>запозичені<\/b> з інших мов (<i>футбол<\/i>, <i>комп’ютер<\/i>).","За вживанням: <b>загальновживані<\/b> слова знають усі; <b>діалектизми<\/b> вживають у певній місцевості (<i>бараболя<\/i> — картопля); <b>терміни<\/b> — у науці (<i>дієслово<\/i>, <i>трикутник<\/i>).","Є ще <b>застарілі<\/b> слова (<i>чело<\/i> — лоб, <i>кольчуга<\/i>) і <b>неологізми<\/b> — нові слова (<i>вебінар<\/i>).","У фразеологізмі не можна замінити слово іншим: кажемо <i>як кіт наплакав<\/i> (мало), а не «як пес наплакав». Фразеологізм часто можна замінити одним словом."],"rules":[{"f":"<i>бити байдики<\/i> = ледарювати; <i>як кіт наплакав<\/i> = мало; <i>зарубати собі на носі<\/i> = добре запам’ятати","means":"Фразеологізм має одне цілісне значення, як окреме слово. Тому в реченні фразеологізм — один член речення, а не кілька."}],"examples":[{"task":"У якому значенні — прямому чи переносному — ужито слово <i>золотий<\/i>: <i>золотий перстень<\/i>; <i>золоті руки<\/i>?","steps":[{"do":"<i>золотий перстень<\/i> — пряме значення","why":"Перстень справді зроблений із золота."},{"do":"<i>золоті руки<\/i> — переносне значення","why":"Руки не із золота: так кажуть про вмілу людину. Значення перенесено за схожістю — вміння цінне, як золото."}],"answer":"Відповідь: у першому сполученні — пряме значення, у другому — переносне."},{"task":"Чим є слово <i>коса<\/i> в реченнях: <i>У сестри довга коса<\/i>; <i>Дідусь наточив косу<\/i>; <i>Ми відпочивали на піщаній косі<\/i>?","steps":[{"do":"Зіставляємо значення: заплетене волосся; знаряддя, яким косять траву; вузька смуга суходолу, що заходить у море","why":"Значення між собою не пов’язані."},{"do":"Слова звучать і пишуться однаково","why":"Форма однакова, а зміст різний."},{"do":"Отже, це омоніми","why":"Омоніми — слова, однакові за звучанням, але різні за значенням."}],"answer":"Відповідь: омоніми."},{"task":"Знайди фразеологізм і заміни його одним словом: <i>Олег на уроці бив байдики, а тепер не може розв’язати задачу.<\/i>","steps":[{"do":"Шукаємо стійке сполучення: <i>бив байдики<\/i>","why":"Слова тут не мають свого прямого значення — разом вони означають щось одне."},{"do":"Значення: «нічого не робив, ледарював»","why":"Фразеологізм має одне цілісне значення."},{"do":"Замінюємо: <i>Олег на уроці ледарював…<\/i>","why":"Одне слово передає той самий зміст."}],"answer":"Відповідь: <i>бив байдики<\/i> = <i>ледарював<\/i>."}],"mistakes":["Змінюють слово у фразеологізмі: «як собака наплакав». Правильно: <i>як кіт наплакав<\/i> — слова у фразеологізмі не замінюємо.","Плутають омоніми й багатозначні слова. Якщо значення пов’язані (<i>ніжка<\/i> дитини й <i>ніжка<\/i> стільця — схожі формою і роллю), це одне багатозначне слово; якщо не пов’язані (<i>коса<\/i> дівчини й <i>коса<\/i> для трави) — омоніми.","Вважають переносне значення помилкою. Правильно: <i>золоті руки<\/i>, <i>залізний характер<\/i> — звичайне вживання, яке робить мову виразною."],"check":[{"q":"У якому реченні слово <i>золотий<\/i> ужито в переносному значенні?","options":["У музеї зберігають золоту корону.","Мама носить золоту каблучку.","У бабусі золоті руки."],"correct":2,"a":"<i>Золоті руки<\/i> — вмілі, а не зроблені із золота. Корона й каблучка справді золоті — це пряме значення."},{"q":"Пастка: що означає фразеологізм <i>як кіт наплакав<\/i>?","options":["дуже сумно","дуже мало","дуже мокро"],"correct":1,"a":"<i>Як кіт наплакав<\/i> — «дуже мало»: <i>Цукерок залишилося як кіт наплакав<\/i>. Про сум тут не йдеться."},{"q":"Друг написав: «Я вчора весь день байдики бив». Заміни фразеологізм одним дієсловом минулого часу.","accept":["ледарював","байдикував","лінувався"],"a":"<i>Ледарював<\/i> (також <i>байдикував<\/i>, <i>лінувався<\/i>): <i>бити байдики<\/i> — нічого не робити."}]}}]},{"id":"U1.3","name":"Частини мови (повторення)","what":"Іменник, прикметник, числівник, займенник — що треба пам'ятати.","subtopics":[{"id":"U1.3.1","name":"Іменник: рід, число, відмінювання","status":"ready","programmeRef":"Рід та число іменників. Відмінювання іменників. Особливості окремих відмінкових форм іменників.","lesson":{"what":"<b>Іменник<\/b> — частина мови, що називає предмет і відповідає на питання <i>хто?<\/i> або <i>що?<\/i> Іменники мають <b>рід<\/b> і <b>число<\/b> та змінюються за <b>відмінками<\/b> — це й називаємо відмінюванням.","ideas":["Рід: чоловічий (<i>він, мій олівець<\/i>), жіночий (<i>вона, моя книжка<\/i>), середній (<i>воно, моє вікно<\/i>). Є і <b>спільний<\/b> рід: <i>сирота<\/i>, <i>нероба<\/i> — так можна сказати і про хлопця, і про дівчину.","Число: однина й множина. Деякі іменники мають лише множину (<i>ножиці<\/i>, <i>окуляри<\/i>, <i>канікули<\/i>) або лише однину (<i>молоко<\/i>, <i>молодь<\/i>, <i>сміливість<\/i>).","Відмінків сім: називний, родовий, давальний, знахідний, орудний, місцевий і кличний. <b>Кличний<\/b> вживаємо у звертанні: <i>Тарасе<\/i>, <i>Олено<\/i>, <i>друже<\/i>.","Іменники поділяємо на чотири відміни. І — жіночого, чоловічого та спільного роду на <i>-а, -я<\/i> (<i>мама, земля, Микола<\/i>). ІІ — чоловічого роду з нульовим закінченням або на <i>-о<\/i> та середнього роду на <i>-о, -е, -я<\/i> (<i>дуб, батько, село, поле, знання<\/i>). ІІІ — жіночого роду з нульовим закінченням і слово <i>мати<\/i> (<i>ніч, радість<\/i>). IV — іменники середнього роду, які при відмінюванні мають суфікси <i>-ат-, -ят-, -ен-<\/i> (<i>кошеня — кошеняти<\/i>, <i>ім’я — імені<\/i>)."],"rules":[{"f":"Р. в. однини чоловічого роду ІІ відміни: <b>-а (-я)<\/b> — <i>олівця, зошита, Києва, понеділка<\/i>; <b>-у (-ю)<\/b> — <i>цукру, сміху, дощу<\/i>","means":"<b>-а (-я)<\/b> — у назвах людей, тварин, конкретних предметів, міст, днів тижня й місяців. <b>-у (-ю)<\/b> — у назвах речовин, почуттів і понять, явищ природи. Сумніваєшся — перевір у словнику."},{"f":"Д. в. однини чоловічого роду: <i>братові<\/i> й <i>брату<\/i>, <i>учителеві<\/i> й <i>учителю<\/i>","means":"Обидва закінчення правильні. Закінчення <i>-ові (-еві, -єві)<\/i> особливо властиве назвам людей: <i>другові<\/i>, <i>Андрієві<\/i>."},{"f":"Кл. в.: <i>Тарасе, Андрію, Олено, Галю, Іване Петровичу, Ольго Петрівно<\/i>","means":"Звертаючись до когось, ставимо в кличному відмінку як ім’я, так і по батькові."}],"examples":[{"task":"Визнач рід і число іменників <i>сирота<\/i>, <i>ножиці<\/i>, <i>молоко<\/i>.","steps":[{"do":"<i>сирота<\/i> — спільний рід, однина","why":"Можна сказати і <i>цей сирота<\/i> (про хлопця), і <i>ця сирота<\/i> (про дівчинку)."},{"do":"<i>ножиці<\/i> — лише множина, рід не визначаємо","why":"Форми однини в цього слова немає, тому й роду немає."},{"do":"<i>молоко<\/i> — середній рід, лише однина","why":"<i>Воно, моє молоко<\/i>; це назва речовини."}],"answer":"Відповідь: спільний рід; лише множина; середній рід, лише однина."},{"task":"Постав іменники в родовому відмінку: <i>немає (олівець)<\/i>; <i>шматок (сир)<\/i>; <i>до (понеділок)<\/i>.","steps":[{"do":"<i>олівця<\/i>","why":"Конкретний предмет — закінчення <i>-а (-я)<\/i>."},{"do":"<i>сиру<\/i>","why":"Речовина — закінчення <i>-у<\/i>."},{"do":"<i>понеділка<\/i>","why":"Назва дня тижня — закінчення <i>-а<\/i>."}],"answer":"Відповідь: <i>немає олівця<\/i>, <i>шматок сиру<\/i>, <i>до понеділка<\/i>."},{"task":"Виправ речення: <i>Сергій Іванович, Тарас захворів!<\/i>","steps":[{"do":"Шукаємо, до кого звертаються: <i>Сергій Іванович<\/i>","why":"Звертання називає того, кому говорять."},{"do":"<i>Сергій Іванович<\/i> → <i>Сергію Івановичу<\/i>","why":"Звертання — у кличному відмінку: <i>Сергій → Сергію<\/i>, <i>Іванович → Івановичу<\/i>."},{"do":"<i>Тарас<\/i> не змінюємо","why":"Про Тараса розповідають — це підмет у називному відмінку, а не звертання."}],"answer":"Відповідь: <i>Сергію Івановичу, Тарас захворів!<\/i>"}],"mistakes":["<i>Немає олівцю.<\/i> Правильно: <i>немає олівця<\/i> — назва конкретного предмета в Р. в. має закінчення <i>-а (-я)<\/i>.","<i>Шматок цукра.<\/i> Правильно: <i>шматок цукру<\/i> — назва речовини має закінчення <i>-у<\/i>.","<i>Андрій, ходи сюди!<\/i> Правильно: <i>Андрію, ходи сюди!<\/i> — у звертанні потрібен кличний відмінок."],"check":[{"q":"Який іменник має лише форму множини?","options":["двері","зошити","яблука","друзі"],"correct":0,"a":"<i>Двері<\/i> — лише множина: кажемо <i>одні двері<\/i>, форми однини немає. Інші слова мають однину: <i>зошит, яблуко, друг<\/i>."},{"q":"Пастка: як правильно звернутися до друга на ім’я Сергій?","options":["Сергій, привіт!","Сергіє, привіт!","Сергію, привіт!"],"correct":2,"a":"<i>Сергію<\/i> — кличний відмінок: <i>Сергій → Сергію<\/i>, як <i>Андрій → Андрію<\/i>."},{"q":"Ти пишеш другові Миколі: «…, приходь на футбол!» Напиши його ім’я у формі звертання (кличний відмінок).","accept":["Миколо"],"a":"<i>Миколо<\/i>: <i>Микола<\/i> належить до І відміни, у кличному відмінку — закінчення <i>-о<\/i>: <i>Миколо, приходь на футбол!<\/i>"}]}},{"id":"U1.3.2","name":"Прикметник: групи й ступені порівняння","status":"ready","programmeRef":"Групи прикметників за значенням. Ступені порівняння прикметників.","lesson":{"what":"<b>Прикметник<\/b> — частина мови, що означає ознаку предмета й відповідає на питання <i>який?<\/i> <i>чий?<\/i> За значенням прикметники бувають якісні, відносні й присвійні. Якісні прикметники мають <b>ступені порівняння<\/b>: <i>сильний — сильніший — найсильніший<\/i>.","ideas":["<b>Якісні<\/b> прикметники називають ознаку, якої може бути більше чи менше: <i>високий<\/i>, <i>веселий<\/i>, <i>теплий<\/i>. Можна сказати <i>дуже теплий<\/i>.","<b>Відносні<\/b> називають ознаку через зв’язок з предметом, матеріалом, місцем чи часом: <i>дерев’яний<\/i> (з дерева), <i>шкільний<\/i>, <i>зимовий<\/i>. «Дуже дерев’яний» не кажемо.","<b>Присвійні<\/b> вказують на належність людині чи тварині й відповідають на питання <i>чий?<\/i> (<i>мамин<\/i>, <i>батьків<\/i>, <i>сестрин<\/i>).","<b>Вищий ступінь<\/b> показує, що ознаки більше чи менше, ніж в іншого предмета: <i>Сашко вищий за Петра<\/i>. <b>Найвищий<\/b> — що ознаки найбільше: <i>найвищий у класі<\/i>.","Деякі прикметники утворюють вищий ступінь від іншої основи: <i>добрий<\/i> (хороший) <i>— кращий<\/i>, <i>поганий — гірший<\/i>, <i>великий — більший<\/i>, <i>малий — менший<\/i>."],"rules":[{"f":"Вищий ступінь. Проста форма: сильн<b>іш<\/b>ий, лег<b>ш<\/b>ий; складена: <b>більш<\/b> (<b>менш<\/b>) уважний","means":"Проста форма — суфікс <i>-іш-<\/i> або <i>-ш-<\/i>; складена — слова <i>більш<\/i>, <i>менш<\/i> + прикметник. Перед <i>-ш-<\/i> бувають зміни: <i>високий — вищий<\/i>, <i>дорогий — дорожчий<\/i>, <i>вузький — вужчий<\/i>."},{"f":"Найвищий ступінь. Проста форма: <b>най<\/b>сильніший, <b>як<\/b>найкращий, <b>що<\/b>найкращий; складена: <b>найбільш<\/b> (<b>найменш<\/b>) уважний","means":"Проста форма — префікс <i>най-<\/i>; для підсилення додаємо ще <i>як-<\/i> або <i>що-<\/i> і пишемо разом. Складена — слова <i>найбільш<\/i>, <i>найменш<\/i> + прикметник."},{"f":"«більш сильніший», «самий кращий» — помилки","means":"Проста й складена форми не змішуються, а слово <i>самий<\/i> ступенів не творить. Правильно: <i>сильніший<\/i> або <i>більш сильний<\/i>; <i>найкращий<\/i>."}],"examples":[{"task":"Визнач групу прикметників: <i>бабусин пиріг<\/i>, <i>дерев’яний стіл<\/i>, <i>теплий вечір<\/i>.","steps":[{"do":"<i>бабусин<\/i> — присвійний","why":"Відповідає на питання <i>чий?<\/i> і показує, кому належить пиріг."},{"do":"<i>дерев’яний<\/i> — відносний","why":"Означає «зроблений з дерева»; більшою чи меншою ця ознака не буває."},{"do":"<i>теплий<\/i> — якісний","why":"Вечір може бути <i>теплішим<\/i> чи <i>дуже теплим<\/i>."}],"answer":"Відповідь: присвійний, відносний, якісний."},{"task":"Утвори всі форми ступенів порівняння прикметника <i>високий<\/i>.","steps":[{"do":"Вищий, проста форма: <i>вищий<\/i>","why":"Суфікс <i>-ок-<\/i> випадає, а <i>с<\/i> перед <i>-ш-<\/i> дає <i>щ<\/i>."},{"do":"Вищий, складена форма: <i>більш високий<\/i>, <i>менш високий<\/i>","why":"<i>Більш<\/i> або <i>менш<\/i> + початкова форма прикметника."},{"do":"Найвищий, проста форма: <i>найвищий<\/i> (з підсиленням — <i>якнайвищий<\/i>, <i>щонайвищий<\/i>)","why":"Префікс <i>най-<\/i> додаємо до простої форми вищого ступеня."},{"do":"Найвищий, складена форма: <i>найбільш високий<\/i>, <i>найменш високий<\/i>","why":"<i>Найбільш<\/i> або <i>найменш<\/i> + початкова форма прикметника."}],"answer":"Відповідь: <i>вищий<\/i>, <i>більш (менш) високий<\/i>; <i>найвищий<\/i>, <i>найбільш (найменш) високий<\/i>."},{"task":"Виправ помилки: <i>Це самий цікавий фільм, а наша команда більш сильніша.<\/i>","steps":[{"do":"<i>самий цікавий<\/i> → <i>найцікавіший<\/i> або <i>найбільш цікавий<\/i>","why":"Найвищий ступінь утворюємо префіксом <i>най-<\/i> чи словом <i>найбільш<\/i>, а не словом <i>самий<\/i>."},{"do":"<i>більш сильніша<\/i> → <i>сильніша<\/i> або <i>більш сильна<\/i>","why":"Проста й складена форми не змішуються: досить однієї."}],"answer":"Відповідь: <i>Це найцікавіший фільм, а наша команда сильніша.<\/i>"}],"mistakes":["<i>Самий високий.<\/i> Правильно: <i>найвищий<\/i> або <i>найбільш високий<\/i>.","<i>Більш красивіший.<\/i> Правильно: <i>красивіший<\/i> або <i>більш красивий<\/i> — одна форма, а не дві разом.","<i>Найбільш найкращий.<\/i> Правильно: <i>найкращий<\/i>; підсилюємо лише через <i>як-<\/i>, <i>що-<\/i>: <i>якнайкращий<\/i>."],"check":[{"q":"До якої групи належить прикметник у сполученні <i>сестрин зошит<\/i>?","options":["якісний","відносний","присвійний"],"correct":2,"a":"<i>Сестрин<\/i> — чий? Зошит належить сестрі, тож прикметник присвійний."},{"q":"Пастка: яка форма правильна?","options":["сильніший","більш сильніший","самий сильніший"],"correct":0,"a":"Правильно: <i>сильніший<\/i> (або <i>більш сильний<\/i>). У «більш сильніший» змішано дві форми, а слово «самий» ступенів не творить."},{"q":"Ти пишеш другові: «Це був … день літа!» Утвори від прикметника <i>щасливий<\/i> найвищий ступінь у простій формі (одне слово).","accept":["найщасливіший"],"a":"<i>Найщасливіший<\/i>: <i>щасливий → щасливіший → найщасливіший<\/i>."}]}},{"id":"U1.3.3","name":"Числівник: відмінювання й уживання","status":"ready","programmeRef":"Відмінювання числівників. Поєднання числівників з іменниками. Уживання числівників на позначення часу.","lesson":{"what":"<b>Числівник<\/b> — частина мови, що означає число, кількість предметів або їхній порядок при лічбі: <i>п’ять<\/i>, <i>п’ятеро<\/i>, <i>п’ятий<\/i>. Числівники мають свої особливості відмінювання, а з іменниками поєднуються за правилами, які варто пам’ятати.","ideas":["<b>Кількісні<\/b> числівники відповідають на питання <i>скільки?<\/i> (<i>три, сорок<\/i>), <b>порядкові<\/b> — на питання <i>котрий?<\/i> (<i>третій, сороковий<\/i>). Порядкові відмінюються, як прикметники.","<i>Два, три, чотири<\/i>: <i>двох, двом, двома<\/i>; <i>трьох, трьом, трьома<\/i>. Числівники <i>п’ять<\/i> — <i>двадцять<\/i> і <i>тридцять<\/i> мають паралельні форми: <i>п’яти<\/i> і <i>п’ятьох<\/i>, <i>п’ятьма<\/i> і <i>п’ятьома<\/i>.","<i>Сорок, дев’яносто, сто<\/i> мають лише дві форми: у називному й знахідному відмінках — <i>сорок<\/i>, в усіх інших — <i>сорока<\/i> (так само <i>дев’яноста<\/i>, <i>ста<\/i>).","У складених кількісних числівниках відмінюємо <b>кожне слово<\/b>: <i>двохсот сорока трьох<\/i>. У складених порядкових — <b>лише останнє<\/b>: <i>у дві тисячі двадцять шостому році<\/i>.","Про час питаємо так: <i>Котра година?<\/i> Вислів «Скільки часу?» тут не підходить. Відповідаємо порядковим числівником: <i>сьома година<\/i>, <i>о сьомій годині<\/i>."],"rules":[{"f":"<i>два, три, чотири<\/i> + Н. в. множини: <i>два зошити, три учні<\/i>; <i>п’ять<\/i> і більше + Р. в. множини: <i>п’ять зошитів<\/i>","means":"У складеному числівнику форму іменника визначає останнє слово: <i>двадцять чотири олівці<\/i>, але <i>двадцять п’ять олівців<\/i>. <i>Півтора<\/i>, <i>півтори<\/i> + Р. в. однини: <i>півтора кілометра<\/i>, <i>півтори години<\/i>."},{"f":"6:15 — <i>чверть на сьому<\/i>; 6:30 — <i>пів на сьому<\/i>; 6:45 — <i>за чверть сьома<\/i>","means":"До половини години лічимо хвилини «на» наступну годину: <i>десять хвилин на сьому<\/i> (6:10). Після половини кажемо, скільки лишилося до наступної: <i>за десять хвилин сьома<\/i> (6:50). Слово <i>пів<\/i> тут пишемо окремо."}],"examples":[{"task":"Поєднай з іменником <i>учень<\/i> числівники 3, 5, 24.","steps":[{"do":"<i>три учні<\/i>","why":"Після <i>три<\/i> — називний відмінок множини."},{"do":"<i>п’ять учнів<\/i>","why":"Після <i>п’ять<\/i> — родовий відмінок множини."},{"do":"<i>двадцять чотири учні<\/i>","why":"Форму визначає останнє слово — <i>чотири<\/i>, тому як після <i>чотири<\/i>."}],"answer":"Відповідь: <i>три учні<\/i>, <i>п’ять учнів<\/i>, <i>двадцять чотири учні<\/i>."},{"task":"Постав числівник у потрібній формі: <i>Бібліотека отримала листи від (245) читачів.<\/i>","steps":[{"do":"Прийменник <i>від<\/i> вимагає родового відмінка","why":"Від кого? — родовий відмінок."},{"do":"<i>двісті<\/i> → <i>двохсот<\/i>","why":"У складеному кількісному числівнику відмінюємо кожне слово."},{"do":"<i>сорок<\/i> → <i>сорока<\/i>","why":"<i>Сорок<\/i> в усіх відмінках, крім називного й знахідного, має форму <i>сорока<\/i>."},{"do":"<i>п’ять<\/i> → <i>п’яти<\/i> (або <i>п’ятьох<\/i>)","why":"Обидві форми родового відмінка правильні."}],"answer":"Відповідь: <i>від двохсот сорока п’яти читачів<\/i>."},{"task":"Запиши словами час на годиннику: 8:30, 8:45, 9:15.","steps":[{"do":"8:30 — <i>пів на дев’яту<\/i>","why":"Минула половина години, що йде «на» дев’яту."},{"do":"8:45 — <i>за чверть дев’ята<\/i>","why":"Після половини кажемо, скільки лишилося до дев’ятої."},{"do":"9:15 — <i>чверть на десяту<\/i> (або <i>п’ятнадцять хвилин на десяту<\/i>)","why":"Минула чверть години, що йде «на» десяту."}],"answer":"Відповідь: <i>пів на дев’яту<\/i>, <i>за чверть дев’ята<\/i>, <i>чверть на десяту<\/i>."}],"mistakes":["<i>Два учня<\/i>, <i>чотири олівця<\/i>. Правильно: <i>два учні<\/i>, <i>чотири олівці<\/i> — після 2, 3, 4 вживаємо називний відмінок множини.","<i>Без чверті дев’ять<\/i>, <i>половина дев’ятої<\/i>. Правильно: <i>за чверть дев’ята<\/i>, <i>пів на дев’яту<\/i>.","<i>У двохтисячі двадцять шостому році.<\/i> Правильно: <i>у дві тисячі двадцять шостому році<\/i> — у складеному порядковому числівнику змінюється лише останнє слово."],"check":[{"q":"Як правильно?","options":["чотири олівця","чотири олівці","чотири олівців"],"correct":1,"a":"Після <i>чотири<\/i> — називний відмінок множини: <i>чотири олівці<\/i>."},{"q":"Пастка: на годиннику 7:45. Як правильно сказати?","options":["без чверті вісім","чверть на восьму","за чверть восьма"],"correct":2,"a":"<i>За чверть восьма<\/i>: до восьмої лишилося п’ятнадцять хвилин. <i>Чверть на восьму<\/i> — це 7:15, а «без чверті вісім» — калька з російської мови."},{"q":"Друг пише: «Коли зустрічаємося?» Ви домовилися на 5:30. Напиши цей час словами, починаючи зі слова <i>пів<\/i>.","accept":["пів на шосту","о пів на шосту"],"a":"<i>Пів на шосту<\/i>; у реченні: <i>Зустрічаємося о пів на шосту<\/i>. Слово <i>пів<\/i> тут пишемо окремо."}]}},{"id":"U1.3.4","name":"Розряди займенників","status":"ready","programmeRef":"Розряди займенників.","lesson":{"what":"<b>Займенник<\/b> — частина мови, що вказує на предмет, ознаку чи кількість, але не називає їх: <i>він<\/i>, <i>такий<\/i>, <i>стільки<\/i>. За значенням займенники поділяють на дев’ять <b>розрядів<\/b>, тобто груп.","ideas":["<b>Особові<\/b>: <i>я, ти, він, вона, воно, ми, ви, вони<\/i>. <b>Зворотний<\/b>: <i>себе<\/i> — він не має називного відмінка й показує на самого діяча: <i>Оля купила собі книжку<\/i>.","<b>Присвійні<\/b> (чий?): <i>мій, твій, свій, наш, ваш, їхній<\/i>. <b>Вказівні<\/b>: <i>той, цей, такий, стільки<\/i>. <b>Означальні<\/b>: <i>весь, кожний (кожен), сам, самий, інший, всякий<\/i>.","<b>Питальні<\/b> вживаємо в питанні: <i>хто? що? який? чий? котрий? скільки?<\/i> Ті самі слова, коли вони з’єднують частини складного речення, — <b>відносні<\/b>: <i>Я знаю, хто прийде<\/i>.","<b>Неозначені<\/b>: <i>хтось, щось, дехто, абищо, будь-який, казна-хто<\/i>. <b>Заперечні<\/b>: <i>ніхто, ніщо, ніякий, нічий, жодний (жоден)<\/i>."],"rules":[{"f":"питальний: <i>Хто прийшов?<\/i> — відносний: <i>Я бачу, хто прийшов.<\/i>","means":"Слово те саме, а роль різна: питальний займенник ставить питання, відносний з’єднує частини складного речення."},{"f":"<i>себе, собі, собою, (на) собі<\/i>","means":"Зворотний займенник не має називного відмінка і не змінюється за родами та числами: <i>я дбаю про себе<\/i>, <i>вони дбають про себе<\/i>."}],"examples":[{"task":"Визнач розряд займенників у реченні: <i>Мій брат сам полагодив велосипед.<\/i>","steps":[{"do":"<i>Мій<\/i> — присвійний","why":"Чий брат? Займенник указує на належність."},{"do":"<i>сам<\/i> — означальний","why":"Уточнює: саме брат, без чужої допомоги."}],"answer":"Відповідь: <i>мій<\/i> — присвійний, <i>сам<\/i> — означальний."},{"task":"Визнач, питальний чи відносний займенник <i>хто<\/i> в реченнях <i>Хто розбив вікно?<\/i> і <i>Ми дізналися, хто розбив вікно.<\/i>","steps":[{"do":"У першому реченні <i>хто<\/i> — питальний","why":"Речення питальне, займенник ставить питання."},{"do":"У другому реченні <i>хто<\/i> — відносний","why":"Речення розповідне, займенник з’єднує частини складного речення: <i>Ми дізналися<\/i> + <i>хто розбив вікно<\/i>."}],"answer":"Відповідь: у першому реченні — питальний, у другому — відносний."},{"task":"Знайди всі займенники й визнач їхній розряд: <i>Ніхто з нас не бачив цього фільму, тому дехто запропонував інший.<\/i>","steps":[{"do":"<i>ніхто<\/i> — заперечний","why":"Заперечує, що така особа є."},{"do":"<i>нас<\/i> — особовий","why":"Це форма займенника <i>ми<\/i>."},{"do":"<i>цього<\/i> — вказівний","why":"Указує на певний фільм; початкова форма — <i>цей<\/i>."},{"do":"<i>дехто<\/i> — неозначений","why":"Особу не названо точно — якась людина."},{"do":"<i>інший<\/i> — означальний","why":"Уточнює ознаку: не цей, а інший фільм."}],"answer":"Відповідь: <i>ніхто<\/i> — заперечний, <i>нас<\/i> — особовий, <i>цього<\/i> — вказівний, <i>дехто<\/i> — неозначений, <i>інший<\/i> — означальний."}],"mistakes":["Займенник <i>хто<\/i> в реченні <i>Я знаю, хто це зробив<\/i> називають питальним. Правильно: тут він відносний — речення не питальне, а <i>хто<\/i> з’єднує його частини.","Пишуть «ихній». Правильно: <i>їхній<\/i>.","<i>Себе<\/i> вважають особовим займенником. Правильно: це зворотний займенник — він не має називного відмінка й не змінюється за родами та числами."],"check":[{"q":"До якого розряду належить займенник <i>будь-хто<\/i>?","options":["питальний","заперечний","вказівний","неозначений"],"correct":3,"a":"<i>Будь-хто<\/i> — неозначений: людину точно не визначено, «хтось, усе одно хто»."},{"q":"Пастка: <i>Я не знаю, що він вибере.<\/i> Займенник <i>що<\/i> тут…","options":["питальний","відносний"],"correct":1,"a":"Відносний: речення розповідне, а <i>що<\/i> з’єднує частини складного речення. Питальним <i>що<\/i> було б у реченні <i>Що він вибере?<\/i>"},{"q":"Ти вішаєш на двері записку: «… не заходити: я вчу уроки!» Встав заперечний займенник у потрібній формі (одне слово).","accept":["нікому"],"a":"<i>Нікому не заходити!<\/i> Це заперечний займенник <i>ніхто<\/i> в давальному відмінку."}]}}]},{"id":"U1.4","name":"Орфографічний практикум","what":"Головні правила правопису з попередніх класів.","subtopics":[{"id":"U1.4.1","name":"Е та И в корені слова","status":"ready","programmeRef":"на позначення ненаголошених голосних у корені слова.","lesson":{"what":"Ненаголошені звуки [е] та [и] в корені звучать схоже, тому букви легко сплутати. <b>Корінь<\/b> — спільна частина споріднених слів, у ньому головне значення. Щоб вибрати букву, змінюємо слово або добираємо споріднене так, щоб сумнівний звук став <b>наголошеним<\/b>.","ideas":["<b>Перевірне слово<\/b> — інша форма того самого слова або споріднене слово, у якому сумнівний звук під наголосом: <i>сестра — се́стри, зима — зи́ми<\/i>.","Під наголосом [е] та [и] звучать чітко, тому така перевірка надійна: <i>широкий — ши́рший, листок — ли́сти<\/i>.","Якщо ненаголошений [е] в іншій формі чи спорідненому слові чергується з [і], пишемо <b>е<\/b>: <i>шести — шість, семи — сім<\/i>.","Якщо звук в іншій формі слова випадає, пишемо <b>е<\/b>: <i>вітер — вітру, кашель — кашлю<\/i>.","Деякі слова перевірити наголосом не можна. Їх пишемо за орфографічним словником і запам’ятовуємо: <i>кишеня, лелека, пиріг, левада<\/i>."],"rules":[{"f":"сумнівний звук → перевірне слово з наголосом","means":"Змінюємо форму або добираємо споріднене слово: <i>зима́ → зи́ми<\/i>, тому пишемо <b>зима<\/b>; <i>весна́ → ве́сни<\/i>, тому <b>весна<\/b>."},{"f":"[е] чергується з [і] або випадає → е","means":"<i>шести — шість<\/i> (чергування з [і]); <i>вітер — вітру<\/i> (звук випадає). В обох випадках пишемо е."}],"examples":[{"task":"Яку букву треба вставити: <i>с..ло, гр..би<\/i>?","steps":[{"do":"село́ → се́ла: під наголосом чути [е].","why":"Змінюємо число — сумнівний звук стає наголошеним."},{"do":"гриби́ → гриб: чути [и].","why":"В односкладовому слові наголос падає на єдиний голосний, тож звук чути чітко."}],"answer":"<i>село, гриби<\/i>."},{"task":"Поясни, чому в словах <i>шести<\/i> та <i>вітер<\/i> пишемо е.","steps":[{"do":"шести — шість.","why":"Ненаголошений [е] чергується з [і] — пишемо е."},{"do":"вітер — вітру.","why":"У формі <i>вітру<\/i> звук зникає (випадає) — пишемо е."}],"answer":"<i>шести<\/i> — бо чергується з [і] (шість); <i>вітер<\/i> — бо звук випадає (вітру)."},{"task":"Знайди й виправ помилку: «У мене в кешені лежить ключ від хати».","steps":[{"do":"Шукаємо слова з ненаголошеним [е] чи [и] в корені — це <i>кешені<\/i>.","why":"Помилки найчастіше бувають у ненаголошених звуках."},{"do":"Пробуємо перевірити: <i>кишеня, кишені, кишеньковий<\/i> — у жодній формі цей звук не наголошений.","why":"Перевірне слово знайти не вдається."},{"do":"Звіряємося з орфографічним словником: <i>кишеня<\/i>.","why":"Неперевірювані слова пишемо за словником і запам’ятовуємо."}],"answer":"«У мене в <b>кишені<\/b> лежить ключ від хати»."}],"mistakes":["Перевіряють словом, де звук теж ненаголошений: <i>зимо́вий<\/i> для слова «зима». Правильно: брати форму, де сумнівний звук під наголосом, — <i>зи́ми<\/i>.","Пишуть так, як «чують»: «шерокий». Правильно: <i>широкий<\/i>, бо <i>ши́рший<\/i>.","Пишуть «лилека». Слово <i>лелека<\/i> наголосом не перевіряється — звіряйся зі словником."],"check":[{"q":"Пастка: у якому слові треба вставити <b>и<\/b>?","options":["с..стра","л..сток","в..сна","с..ло"],"correct":1,"a":"<i>листок<\/i>, бо <i>ли́сти<\/i>. В інших словах — е: <i>се́стри, ве́сни, се́ла<\/i>."},{"q":"Ти пишеш другові: «Сьогодні справжня з..ма!» Напиши пропущене слово повністю.","accept":["зима"],"a":"<b>зима<\/b>, бо <i>зи́ми<\/i> — під наголосом чути [и]."},{"q":"Чому в слові <i>кашель<\/i> пишемо е?","options":["Бо тут [е] наголошений","Бо так вимовляють","Бо у формі <i>кашлю<\/i> звук випадає"],"correct":2,"a":"У формі <i>кашлю<\/i> звук випадає, а такий звук позначаємо буквою е."}]}},{"id":"U1.4.2","name":"Правопис префіксів","status":"ready","programmeRef":"Правопис префіксів.","lesson":{"what":"<b>Префікс<\/b> — частина слова перед коренем, яка допомагає творити нові слова: <i>писати — переписати<\/i>. Більшість префіксів пишемо завжди однаково. Окремі правила мають префікси <b>з- (с-)<\/b> і <b>пре-, при-, прі-<\/b>.","ideas":["Префікси <i>роз-, без-, від-, над-, під-, об-, через-<\/i> на письмі не змінюються, навіть перед глухими приголосними: <i>розказати, безкрилий, відпочити, підписати<\/i>.","Префікс <b>з-<\/b> перед <b>к, п, т, ф, х<\/b> пишемо як <b>с-<\/b>: <i>сказати, спитати, стерти, сфотографувати, схопити<\/i>. Запам’ятати ці букви допомагає вислів <i>кафе «Птах»<\/i>.","<b>Пре-<\/b> означає «дуже», найвищу міру ознаки: <i>прегарний<\/i> (дуже гарний), <i>премудрий, прекрасний<\/i>.","<b>При-<\/b> означає наближення, приєднання, неповну дію або розміщення поблизу: <i>прибігти, приклеїти, присісти, приморський<\/i>.","<b>Прі-<\/b> пишемо лише в кількох словах: <i>прізвище, прізвисько, прірва<\/i>."],"rules":[{"f":"з- → с- перед к, п, т, ф, х","means":"<i>скопіювати, списати, стерти, сфотографувати, схопити<\/i>; перед іншими звуками — з-: <i>зробити, зшити, зварити<\/i>."},{"f":"пре- = «дуже»; при- = наближення, приєднання, неповна дія","means":"<i>предобрий<\/i> — дуже добрий; <i>прибудова<\/i> — те, що прибудували до будинку; <i>присісти<\/i> — сісти ненадовго."}],"examples":[{"task":"Що вставити, з- чи с-: <i>..писати, ..робити, ..хопити<\/i>?","steps":[{"do":"..писати: після префікса стоїть п.","why":"Перед к, п, т, ф, х пишемо с-: <i>списати<\/i>."},{"do":"..робити: після префікса стоїть р.","why":"Р немає серед к, п, т, ф, х — пишемо з-: <i>зробити<\/i>."},{"do":"..хопити: після префікса стоїть х.","why":"Х — серед к, п, т, ф, х, тому с-: <i>схопити<\/i>."}],"answer":"<i>списати, зробити, схопити<\/i>."},{"task":"Пре- чи при-: <i>пр..гарний, пр..їхати, пр..красний<\/i>?","steps":[{"do":"пр..гарний = «дуже гарний».","why":"Значення «дуже» — пишемо пре-: <i>прегарний<\/i>."},{"do":"пр..їхати = наблизитися, доїхати до місця.","why":"Значення наближення — пишемо при-: <i>приїхати<\/i>."},{"do":"пр..красний = «дуже красивий».","why":"Знову «дуже» — пре-: <i>прекрасний<\/i>."}],"answer":"<i>прегарний, приїхати, прекрасний<\/i>."},{"task":"Знайди й виправ помилку: «Ми зфотографувалися біля прекрасного водоспаду».","steps":[{"do":"Перевіряємо слова з префіксами: <i>зфотографувалися, прекрасного<\/i>.","why":"Помилки бувають саме в префіксах з-/с- і пре-/при-."},{"do":"У слові <i>зфотографувалися<\/i> після префікса стоїть ф.","why":"Перед к, п, т, ф, х пишемо с-: <i>сфотографувалися<\/i>."},{"do":"<i>Прекрасного<\/i> = «дуже красивого».","why":"Значення «дуже» — пре- написано правильно."}],"answer":"«Ми <b>сфотографувалися<\/b> біля прекрасного водоспаду»."}],"mistakes":["Пишуть «зпитати», «зфотографувати». Перед к, п, т, ф, х — лише с-: <i>спитати, сфотографувати<\/i>.","Пишуть «росказати», «беспечний». Префікси роз-, без- не змінюються: <i>розказати, безпечний<\/i>.","Пишуть «прикрасний». Якщо можна сказати «дуже» — пре-: <i>прекрасний<\/i>. А от <i>прикрасити<\/i> — це додати щось красиве, тут при-."],"check":[{"q":"Ти пишеш у чат класу: «Хто може … розклад і скинути сюди?» Як правильно?","options":["зфотографувати","сфотографувати","сфатографувати"],"correct":1,"a":"<b>сфотографувати<\/b>: перед ф префікс з- пишемо як с-."},{"q":"Пастка: у якому слові треба вставити <b>пре-<\/b>?","options":["пр..їхати","пр..сісти","пр..морський","пр..мудрий"],"correct":3,"a":"<i>премудрий<\/i> — дуже мудрий. Решта — з при-: <i>приїхати, присісти, приморський<\/i>."},{"q":"Напиши слово повністю: <i>пр..звище<\/i>.","accept":["прізвище"],"a":"<b>прізвище<\/b> — одне з небагатьох слів із прі- (як <i>прізвисько, прірва<\/i>)."}]}},{"id":"U1.4.3","name":"Велика буква та лапки у власних назвах","status":"ready","programmeRef":"Велика буква та лапки у власних назвах.","lesson":{"what":"<b>Власна назва<\/b> — це ім’я одного окремого предмета: людини, тварини, міста, річки, книжки, команди. Власні назви пишемо з великої букви. Назви книжок, фільмів, газет, команд, кораблів тощо ще й беремо в лапки «…».","ideas":["З великої букви <b>без лапок<\/b> пишемо імена, по батькові, прізвища, псевдоніми людей і клички тварин: <i>Марія, Олег Петренко, Леся Українка, пес Бровко<\/i>.","Географічні назви пишемо з великої букви, а родові слова (місто, річка, гора, море, вулиця) — з малої: <i>місто Полтава, річка Десна, гора Говерла, Чорне море, вулиця Садова<\/i>.","У лапках і з великої букви пишемо назви книжок і творів, газет, журналів, фільмів, телепередач, спортивних команд, кораблів, літаків: <i>повість «Кайдашева сім’я», журнал «Барвінок», літак «Мрія», команда «Зірка»<\/i>.","У назві в лапках з великої букви пишемо тільки <b>перше<\/b> слово (і власні імена, якщо вони там є): <i>«Лісова пісня»<\/i>."],"rules":[{"f":"власна назва → Велика буква","means":"<i>кіт Мурчик, місто Житомир, річка Дністер<\/i>. Слова <i>кіт, місто, річка<\/i> — загальні назви, тому з малої букви."},{"f":"назва твору, видання, команди → «З великої букви»","means":"<i>драма-феєрія «Лісова пісня», журнал «Барвінок»<\/i>. Слова <i>драма-феєрія, журнал<\/i> — поза лапками й з малої."}],"examples":[{"task":"Запиши правильно: «наш кіт мурчик спить на вікні».","steps":[{"do":"<i>Наш<\/i> — перше слово речення.","why":"Речення починаємо з великої букви."},{"do":"<i>кіт<\/i> — загальна назва.","why":"Так називаємо будь-якого кота — з малої букви."},{"do":"<i>Мурчик<\/i> — кличка тварини.","why":"Клички пишемо з великої букви без лапок."}],"answer":"«Наш кіт Мурчик спить на вікні»."},{"task":"Чи потрібні лапки: <i>місто полтава<\/i>, <i>літак мрія<\/i>?","steps":[{"do":"<i>Полтава<\/i> — географічна назва.","why":"Географічні назви пишемо з великої букви без лапок: <i>місто Полтава<\/i>."},{"do":"<i>Мрія<\/i> — назва літака.","why":"Назви літаків і кораблів беремо в лапки: <i>літак «Мрія»<\/i>."}],"answer":"<i>місто Полтава<\/i> (без лапок), <i>літак «Мрія»<\/i> (у лапках)."},{"task":"Виправ афішу: «Шкільний театр показує Виставу лісова Пісня» (лапок немає).","steps":[{"do":"<i>Виставу<\/i> — загальна назва, не частина назви.","why":"Пишемо з малої букви й поза лапками: <i>виставу<\/i>."},{"do":"Назва вистави — <i>Лісова пісня<\/i>.","why":"Назви творів беремо в лапки «…»."},{"do":"У назві велике лише перше слово: «Лісова пісня».","why":"У назві в лапках з великої — тільки перше слово."}],"answer":"Шкільний театр показує виставу «Лісова пісня»."}],"mistakes":["Беруть у лапки клички тварин: кіт «Мурчик». Правильно: <i>кіт Мурчик<\/i>.","Пишуть з великої букви родове слово посеред речення: «Біля села тече Річка Десна». Правильно: <i>тече річка Десна<\/i>.","У назві в лапках роблять великими всі слова: «Лісова Пісня». Правильно: <i>«Лісова пісня»<\/i>."],"check":[{"q":"Пастка: де написано правильно?","options":["Наш пес «Бровко» любить гратися.","Наш пес Бровко любить гратися.","Наш Пес Бровко любить гратися."],"correct":1,"a":"Кличку пишемо з великої букви без лапок, а слово <i>пес<\/i> — з малої: <i>пес Бровко<\/i>."},{"q":"Ти пишеш другові: «Ми їдемо на …!» Як правильно?","options":["чорне море","Чорне Море","Чорне море","«Чорне море»"],"correct":2,"a":"<b>Чорне море<\/b>: власна назва — з великої букви, родове слово <i>море<\/i> — з малої, лапки не потрібні."},{"q":"Як правильно записати назву повісті?","options":["«Кайдашева сім’я»","«Кайдашева Сім’я»","«кайдашева сім’я»"],"correct":0,"a":"<b>«Кайдашева сім’я»<\/b>: у лапках, з великої букви — лише перше слово."}]}},{"id":"U1.4.4","name":"Складні слова разом і з дефісом","status":"ready","programmeRef":"Правопис складних слів разом і з дефісом.","lesson":{"what":"<b>Складне слово<\/b> має два корені (або більше): <i>вод-о-спад, синьо-жовтий<\/i>. Одні складні слова пишемо разом, інші — через дефіс (коротку риску «-»). Підказка — будова слова і зв’язок між його частинами.","ideas":["Разом пишемо складні слова, у яких корені з’єднані <b>сполучним голосним<\/b> о або е: <i>водоспад, пароплав, землетрус, мовознавство<\/i>.","Разом пишемо слова, перша частина яких — числівник: <i>семикласник, п’ятиповерховий, двоколісний, триденний<\/i>.","Складні прикметники з <b>рівноправних<\/b> частин (між ними можна поставити «і») пишемо через дефіс: <i>синьо-жовтий<\/i> (синій і жовтий), <i>українсько-польський<\/i>. Якщо одна частина залежить від іншої — разом: <i>залізобетонний<\/i> (залізний бетон), <i>сільськогосподарський<\/i> (сільське господарство).","Відтінки кольорів пишемо через дефіс: <i>темно-синій, світло-зелений, яскраво-червоний<\/i>.","Складні іменники з двох слів без сполучного голосного пишемо через дефіс: <i>диван-ліжко, вагон-ресторан, хата-музей<\/i>."],"rules":[{"f":"корінь + о/е + корінь → разом","means":"<i>вод-о-спад → водоспад, земл-е-трус → землетрус<\/i>."},{"f":"рівноправні частини або відтінок кольору → через дефіс","means":"<i>синьо-жовтий<\/i> (синій і жовтий), <i>темно-синій<\/i> (відтінок синього)."},{"f":"числівник + слово → разом","means":"<i>семикласник, двоповерховий<\/i>."}],"examples":[{"task":"Разом чи через дефіс: <i>водо(?)спад, темно(?)синій<\/i>?","steps":[{"do":"<i>вод-о-спад<\/i>: корені з’єднані сполучним о.","why":"Слова зі сполучним голосним пишемо разом: <i>водоспад<\/i>."},{"do":"<i>темно(?)синій<\/i> — відтінок синього кольору.","why":"Відтінки кольорів пишемо через дефіс: <i>темно-синій<\/i>."}],"answer":"<i>водоспад, темно-синій<\/i>."},{"task":"Поясни написання: <i>синьо-жовтий прапор<\/i>, але <i>залізобетонний міст<\/i>.","steps":[{"do":"<i>синьо-жовтий<\/i> = синій і жовтий.","why":"Частини рівноправні, між ними можна поставити «і» — через дефіс."},{"do":"<i>залізобетонний<\/i> = із залізного бетону.","why":"Одна частина залежить від іншої (який бетон? залізний) — разом."}],"answer":"Рівноправні частини — через дефіс, залежні — разом."},{"task":"Знайди й виправ помилки: «Купив двохколісний велосипед світло зеленого кольору».","steps":[{"do":"<i>двохколісний<\/i>: перша частина — числівник два.","why":"У складних словах уживаємо форму <i>дво-<\/i>, а не «двох-», і пишемо разом: <i>двоколісний<\/i>."},{"do":"<i>світло зеленого<\/i> — це відтінок зеленого кольору.","why":"Відтінки кольорів пишемо через дефіс: <i>світло-зеленого<\/i>."}],"answer":"«Купив <b>двоколісний<\/b> велосипед <b>світло-зеленого<\/b> кольору»."}],"mistakes":["Пишуть «двохповерховий», «трьохденний». Правильно: <i>двоповерховий, триденний<\/i>.","Пишуть відтінок кольору разом: «темносиній». Правильно: <i>темно-синій<\/i>.","Ставлять дефіс після сполучного голосного: «водо-спад». Правильно: <i>водоспад<\/i>."],"check":[{"q":"Пастка: як правильно?","options":["двохповерховий","дво-поверховий","двоповерховий"],"correct":2,"a":"<b>двоповерховий<\/b>: форма <i>дво-<\/i>, пишемо разом."},{"q":"Напиши слово правильно (разом чи через дефіс): <i>світло(?)зелений<\/i>.","accept":["світло-зелений"],"a":"<b>світло-зелений<\/b> — відтінок кольору, тому через дефіс."},{"q":"Ти пишеш другові: «Мій новий шарф — …». Як правильно?","options":["синьо-жовтий","синьожовтий","синє-жовтий"],"correct":0,"a":"<b>синьо-жовтий<\/b>: синій і жовтий — рівноправні частини, тому дефіс."}]}},{"id":"U1.4.5","name":"Зміни приголосних перед -ськ-, -ств-, -ин-","status":"ready","programmeRef":"Зміни приголосних під час творення слів за допомогою суфіксів -ськ-, -ств- та під час творення іменників із суфіксом -ин-.","lesson":{"what":"Коли до основи слова додаємо <b>суфікс<\/b> (частину після кореня) <i>-ськ-<\/i> чи <i>-ств-<\/i>, кінцеві приголосні основи можуть змінюватися: <i>козак — козацький<\/i>. Так само змінюються приголосні, коли від прикметників на <i>-ський, -цький<\/i> творимо іменники із суфіксом <i>-ин(а)<\/i>: <i>полтавський — Полтавщина<\/i>.","ideas":["<b>г, ж, з<\/b> + <i>-ськ-, -ств-<\/i> → <b>-зьк-, -зтв-<\/b>: <i>Прага — празький, Париж — паризький, француз — французький, боягуз — боягузтво<\/i>.","<b>к, ч, ц<\/b> + <i>-ськ-, -ств-<\/i> → <b>-цьк-, -цтв-<\/b>: <i>козак — козацький, козацтво; ткач — ткацький, ткацтво; молодець — молодецький<\/i>.","<b>х, ш, с<\/b> + <i>-ськ-, -ств-<\/i> → <b>-ськ-, -ств-<\/b>: <i>чех — чеський, товариш — товариство, Одеса — одеський<\/i>.","<i>-ськ(ий)<\/i> + <i>-ин(а)<\/i> → <b>-щин(а)<\/b>; <i>-цьк(ий)<\/i> + <i>-ин(а)<\/i> → <b>-ччин(а)<\/b>: <i>полтавський — Полтавщина, київський — Київщина; донецький — Донеччина, вінницький — Вінниччина<\/i>.","У деяких іншомовних назвах кінцевий приголосний не змінюється: <i>Нью-Йорк — нью-йоркський, Цюрих — цюрихський<\/i>."],"rules":[{"f":"г, ж, з → -зьк-, -зтв-; к, ч, ц → -цьк-, -цтв-; х, ш, с → -ськ-, -ств-","means":"<i>Кременчук — кременчуцький, ткач — ткацтво, Черкаси — черкаський<\/i>."},{"f":"-ськ- + -ин(а) → -щин(а); -цьк- + -ин(а) → -ччин(а)","means":"<i>черкаський — Черкащина, вінницький — Вінниччина<\/i>."}],"examples":[{"task":"Утвори прикметники із суфіксом -ськ-: <i>Прага, ткач<\/i>.","steps":[{"do":"Основа <i>Праг-<\/i> закінчується на г.","why":"г + -ськ- → -зьк-: <i>празький<\/i>."},{"do":"Основа <i>ткач-<\/i> закінчується на ч.","why":"ч + -ськ- → -цьк-: <i>ткацький<\/i>."}],"answer":"<i>празький, ткацький<\/i>."},{"task":"Утвори іменники із суфіксом -ств-: <i>козак, товариш<\/i>.","steps":[{"do":"<i>козак<\/i> закінчується на к.","why":"к + -ств- → -цтв-: <i>козацтво<\/i>."},{"do":"<i>товариш<\/i> закінчується на ш.","why":"ш + -ств- → -ств-: <i>товариство<\/i>."}],"answer":"<i>козацтво, товариство<\/i>."},{"task":"Від прикметників утвори назви земель із суфіксом -ин(а): <i>київський, донецький<\/i>.","steps":[{"do":"<i>київський<\/i>: основа закінчується на -ськ-.","why":"-ськ- + -ин(а) → -щин(а): <i>Київщина<\/i>."},{"do":"<i>донецький<\/i>: основа закінчується на -цьк-.","why":"-цьк- + -ин(а) → -ччин(а): <i>Донеччина<\/i>, з двома ч."},{"do":"Назви земель — власні назви.","why":"Пишемо з великої букви."}],"answer":"<i>Київщина, Донеччина<\/i>."}],"mistakes":["Пишуть «Донечина» з однією ч. Правильно: <i>Донеччина<\/i>: -цьк- + -ин(а) дає -ччин(а).","Пишуть «козакський» або «козачький». Правильно: <i>козацький<\/i>.","Пишуть «парижський». Правильно: <i>паризький<\/i>: ж + -ськ- → -зьк-."],"check":[{"q":"Пастка: який прикметник утворено від слова <i>Париж<\/i>?","options":["парижський","паризький","парижзький"],"correct":1,"a":"<b>паризький<\/b>: ж + -ськ- → -зьк-."},{"q":"Утвори прикметник із суфіксом -ськ- від слова <i>ткач<\/i>. Напиши одне слово.","accept":["ткацький"],"a":"<b>ткацький<\/b>: ч + -ськ- → -цьк-."},{"q":"Ти пишеш бабусі: «На канікулах я поїду на …» (від слова <i>вінницький<\/i>). Як правильно?","options":["Вінничину","Вінницину","Вінниччину"],"correct":2,"a":"<b>Вінниччину<\/b>: -цьк- + -ин(а) → -ччин(а), тому дві ч."}]}},{"id":"U1.4.6","name":"Подвоєні букви","status":"ready","programmeRef":"Подвоєні букви.","lesson":{"what":"Дві однакові букви поспіль пишемо у двох випадках. Перший — коли на межі частин слова <b>збігаються<\/b> однакові звуки: <i>від-дати<\/i>. Другий — коли м’який приголосний між голосними вимовляємо довше, тобто він <b>подовжується<\/b>: <i>знання<\/i>.","ideas":["Збіг на межі префікса й кореня: <i>віддати, беззахисний, розсипати, оббігти<\/i>.","Збіг на межі кореня й суфікса: <i>осінь → осінній, туман → туманний, вікно → віконний, година → годинник<\/i>.","Подовження: приголосні <b>д, т, з, с, ц, л, н, ж, ч, ш<\/b> між двома голосними вимовляємо довше й подвоюємо на письмі в іменниках середнього роду на -я (<i>знання, життя, обличчя, колосся, Поділля<\/i>) і в орудному відмінку іменників жіночого роду на приголосний (<i>сіллю, ніччю, тінню, миттю<\/i>).","Якщо перед цим приголосним стоїть інший приголосний, подовження немає: <i>радістю, честю, повістю<\/i>.","Не плутай: у прикметниках із суфіксами -ан-, -ян-, -ин- пишемо одну н: <i>дерев’яний, глиняний, солов’їний<\/i>."],"rules":[{"f":"префікс або корінь + така сама буква → дві букви","means":"<i>від + дати = віддати; осін(ь) + н + ій = осінній<\/i>."},{"f":"голосний + д, т, з, с, ц, л, н, ж, ч, ш + голосний → подовження","means":"<i>знання, життя<\/i>; орудний відмінок: <i>сіль — сіллю, ніч — ніччю<\/i>; але <i>радість — радістю<\/i> (перед т стоїть с)."}],"examples":[{"task":"Встав пропущені букви: <i>бе..ахисний, ро..ипати, осі..ій<\/i>.","steps":[{"do":"<i>без<\/i> + <i>захисний<\/i>.","why":"Префікс закінчується на з, корінь починається з з — пишемо дві: <i>беззахисний<\/i>."},{"do":"<i>роз<\/i> + <i>сипати<\/i>.","why":"Префікс закінчується на з, корінь починається з с — пишемо обидві букви: <i>розсипати<\/i>."},{"do":"<i>осін(ь)<\/i> + суфікс <i>-н-<\/i> + <i>-ій<\/i>.","why":"Корінь на н і суфікс -н- — дві н: <i>осінній<\/i>."}],"answer":"<i>беззахисний, розсипати, осінній<\/i>."},{"task":"Утвори орудний відмінок: <i>сіль, ніч, радість<\/i>.","steps":[{"do":"сіль → сіллю.","why":"Перед л стоїть голосний — л подовжується, пишемо дві л."},{"do":"ніч → ніччю.","why":"Перед ч стоїть голосний — ч подовжується, пишемо дві ч."},{"do":"радість → радістю.","why":"Перед т стоїть приголосний с — подовження немає."}],"answer":"<i>сіллю, ніччю, радістю<\/i>."},{"task":"Знайди й виправ помилку: «На осінніх канікулах ми полагодили дерев’янний паркан».","steps":[{"do":"<i>осінніх<\/i>: осін(ь) + суфікс -н-.","why":"Збіг двох н — написано правильно."},{"do":"<i>дерев’янний<\/i>: дерев + суфікс -ян- + закінчення.","why":"У суфіксі -ян- одна н: <i>дерев’яний<\/i>."}],"answer":"«На осінніх канікулах ми полагодили <b>дерев’яний<\/b> паркан»."}],"mistakes":["Пишуть «знаня», «житя». Правильно: <i>знання, життя<\/i> — м’який приголосний між голосними подовжується.","Подвоюють після приголосного: «радісттю». Правильно: <i>радістю<\/i>, бо перед т стоїть с.","Пишуть «дерев’янний», «глинянний». Правильно: <i>дерев’яний, глиняний<\/i> — суфікс -ян- з однією н."],"check":[{"q":"Пастка: як правильно?","options":["ніччю","нічю","нічью"],"correct":0,"a":"<b>ніччю<\/b>: ч після голосного в орудному відмінку подовжується."},{"q":"Напиши пропущене слово повністю: «Найкращий скарб — це зна..я».","accept":["знання"],"a":"<b>знання<\/b>: м’який н між голосними подовжується."},{"q":"Ти пишеш у класний чат: «Завтра … о 15:00». Як правильно?","options":["тренуваня","тренуванння","тренування"],"correct":2,"a":"<b>тренування<\/b>: н між голосними подовжується — дві н, не одна й не три."}]}},{"id":"U1.4.7","name":"Апостроф. М’який знак","status":"ready","programmeRef":"Апостроф. М’який знак.","lesson":{"what":"<b>Апостроф<\/b> (’) показує, що після приголосного вимовляємо звук [й]: <i>м’ята<\/i> звучить як [мйата]. <b>М’який знак<\/b> (ь) показує, що приголосний перед ним м’який: <i>день, батько<\/i>. Окремих звуків ці знаки не позначають.","ideas":["Апостроф пишемо після <b>б, п, в, м, ф<\/b> перед я, ю, є, ї: <i>м’ясо, п’ять, б’ють, в’юн, торф’яний<\/i>. Але якщо перед губним стоїть інший приголосний кореня (крім р), апостроф не потрібен: <i>свято, цвях, тьмяний, мавпячий<\/i>. Після р — потрібен: <i>верб’я, черв’як<\/i>.","Апостроф пишемо після <b>р<\/b> у кінці складу: <i>бур’ян, пір’я, подвір’я<\/i>. Якщо [р’] м’який, апострофа немає: <i>буряк, рясний<\/i>.","Апостроф пишемо після префіксів на твердий приголосний перед я, ю, є, ї: <i>з’їзд, роз’яснити, від’їхати, без’ядерний<\/i>.","М’який знак пишемо після м’яких <b>д, т, з, с, ц, л, н<\/b> у кінці слова й складу (<i>кінь, мідь, батько, учитель, весільний<\/i>), у суфіксах -зьк-, -ськ-, -цьк-, -еньк-, -оньк- (<i>близький, український, козацький, маленький, рибонька<\/i>) і перед о (<i>сьогодні, льон, дзьоб<\/i>).","М’який знак <b>не<\/b> пишемо після н перед ж, ч, ш, щ (<i>кінчик, менший<\/i>), після р у кінці слова (<i>лікар, кобзар<\/i>), між подвоєними буквами (<i>знання, суддя<\/i>) і після губних."],"rules":[{"f":"б, п, в, м, ф або р + я, ю, є, ї → ’","means":"<i>п’ять, бур’ян<\/i>; але <i>свято<\/i> (перед в стоїть с) і <i>буряк<\/i> (р м’який)."},{"f":"м’який д, т, з, с, ц, л, н у кінці слова чи складу, перед о → ь","means":"<i>день, батько, сьогодні<\/i>; але <i>кінчик, лікар<\/i>."}],"examples":[{"task":"Чи потрібен апостроф: <i>м..ята, св..ято, бур..ян, бур..як<\/i>?","steps":[{"do":"<i>м..ята<\/i>: м перед я, перед м немає іншого приголосного.","why":"Після губного перед я пишемо апостроф: <i>м’ята<\/i>."},{"do":"<i>св..ято<\/i>: перед в стоїть с.","why":"Губний після іншого приголосного кореня — без апострофа: <i>свято<\/i>."},{"do":"<i>бур..ян<\/i>: р у кінці складу, далі чуємо [йа].","why":"Апостроф: <i>бур’ян<\/i>."},{"do":"<i>бур..як<\/i>: звук [р’] м’який, [й] не чуємо.","why":"Апострофа немає: <i>буряк<\/i>."}],"answer":"<i>м’ята, свято, бур’ян, буряк<\/i>."},{"task":"Чи потрібен м’який знак: <i>кін..чик, близ..кий, сіл..ський, лікар..<\/i>?","steps":[{"do":"<i>кін..чик<\/i>: н перед ч.","why":"Після н перед ж, ч, ш, щ ь не пишемо: <i>кінчик<\/i>."},{"do":"<i>близ..кий<\/i>: суфікс -зьк-.","why":"У суфіксі -зьк- пишемо ь: <i>близький<\/i>."},{"do":"<i>сіл..ський<\/i>: м’який л у кінці складу.","why":"Пишемо ь: <i>сільський<\/i>."},{"do":"<i>лікар..<\/i>: р у кінці слова.","why":"Після р у кінці слова ь не пишемо: <i>лікар<\/i>."}],"answer":"<i>кінчик, близький, сільський, лікар<\/i>."},{"task":"Виправ помилку в записці: «Мамо, сьогодні я їду на зїзд юних туристів. Повернуся о шостій вечора».","steps":[{"do":"<i>сьогодні<\/i>: м’який с перед о.","why":"Пишемо ь — написано правильно."},{"do":"<i>зїзд<\/i>: префікс з- і корінь, що починається з ї.","why":"Після префікса на твердий приголосний перед ї пишемо апостроф: <i>з’їзд<\/i>."}],"answer":"«Мамо, сьогодні я їду на <b>з’їзд<\/b> юних туристів. Повернуся о шостій вечора»."}],"mistakes":["Ставлять апостроф, коли перед губним стоїть інший приголосний: «св’ято», «цв’ях». Правильно: <i>свято, цвях<\/i>.","Пишуть «бур’як», як у слові «бур’ян». У слові <i>буряк<\/i> звук [р’] м’який, апостроф не потрібен.","Ставлять ь після р у кінці слова: «лікарь». Правильно: <i>лікар<\/i>."],"check":[{"q":"Пастка: у якому слові потрібен апостроф?","options":["цв..ях","тьм..яний","п..ять","св..ято"],"correct":2,"a":"<b>п’ять<\/b>: перед п немає іншого приголосного. У <i>цвях, тьмяний, свято<\/i> перед губним стоїть приголосний — апострофа немає."},{"q":"Ти пишеш другові: «Побачимося с..огодні!» Напиши пропущене слово повністю.","accept":["сьогодні"],"a":"<b>сьогодні<\/b>: м’який с перед о позначаємо буквою ь."},{"q":"Як правильно?","options":["кіньчик","кінчик","кін’чик"],"correct":1,"a":"<b>кінчик<\/b>: після н перед ч м’який знак не пишемо."}]}},{"id":"U1.4.8","name":"Слова іншомовного походження","status":"ready","programmeRef":"Написання слів іншомовного походження","lesson":{"what":"Слова, що прийшли в українську мову з інших мов (<i>фізика, клас, комп’ютер<\/i>), пишемо за окремими правилами. Головні з них — про букви <b>и<\/b> та <b>і<\/b>, подвоєні букви, апостроф і м’який знак. Тут ідеться про <b>загальні назви<\/b> — звичайні слова, не імена й не географічні назви.","ideas":["<b>Правило дев’ятки<\/b>: після <b>д, т, з, с, ц, ч, ш, ж, р<\/b> перед наступним <b>приголосним<\/b> пишемо <b>и<\/b>: <i>диктант, система, циркуль, шифр, режим, ритм, чипси<\/i>. Ці дев’ять букв легко запам’ятати за реченням «<i>Де ти з’їси цю чашу жиру?<\/i>».","<b>І<\/b> пишемо: на початку слова (<i>ідея, інтернет<\/i>); після інших приголосних (<i>фізика, кіно, бізнес, ліфт<\/i>); перед голосним і [й] (<i>радіо, діалог, тріумф<\/i>); у кінці слів, що не змінюються, навіть після «дев’ятки» (<i>таксі, журі<\/i>).","Подвоєних приголосних у загальних назвах здебільшого не пишемо: <i>клас, програма, колектив, граматика, сума<\/i>. Подвоєння зберігається лише в небагатьох словах, їх запам’ятовуємо: <i>ванна, тонна, вілла, нетто, брутто<\/i>.","Апостроф пишемо після <b>б, п, в, м, ф, г, к, х, ж, ч, ш, р<\/b> перед я, ю, є, ї, коли чуємо [й]: <i>комп’ютер, інтерв’ю, прем’єра, бар’єр, п’єса<\/i>. Якщо [й] немає — без апострофа: <i>бюро, бюджет, пюре<\/i>.","М’який знак пишемо після <b>д, т, з, с, л, н<\/b> перед я, ю, є, йо (<i>ательє, бульйон, мільйон, каньйон<\/i>), а також після м’якого л у кінці слова чи складу (<i>фільм, пальто, магістраль<\/i>)."],"rules":[{"f":"д, т, з, с, ц, ч, ш, ж, р + приголосний → и","means":"<i>диктант, сигнал, шифр, ритм<\/i>; але перед голосним — і: <i>радіо, тріумф<\/i>."},{"f":"на початку слова, після інших приголосних, перед голосним → і","means":"<i>ідея, фізика, кіно, діалог<\/i>."},{"f":"подвоєння в загальних назвах → немає (крім ванна, тонна, вілла, нетто, брутто)","means":"<i>клас, програма, колектив<\/i>; але <i>ванна, тонна<\/i>."}],"examples":[{"task":"Що вставити, и чи і: <i>д..ректор, ф..нал, рад..о, с..мвол<\/i>?","steps":[{"do":"<i>д..ректор<\/i>: д із «дев’ятки», після нього р — приголосний.","why":"Правило дев’ятки — пишемо и: <i>директор<\/i>."},{"do":"<i>ф..нал<\/i>: ф не входить до «дев’ятки».","why":"Після інших приголосних — і: <i>фінал<\/i>."},{"do":"<i>рад..о<\/i>: після пропуску голосний о.","why":"Перед голосним пишемо і: <i>радіо<\/i>."},{"do":"<i>с..мвол<\/i>: с із «дев’ятки», далі м — приголосний.","why":"Пишемо и: <i>символ<\/i>."}],"answer":"<i>директор, фінал, радіо, символ<\/i>."},{"task":"Одна чи дві букви: <i>гра(м)атика, ко(л)ектив, ва(н)а<\/i> (кімната)?","steps":[{"do":"<i>граматика<\/i> — загальна назва.","why":"У загальних назвах іншомовного походження приголосні не подвоюємо."},{"do":"<i>колектив<\/i> — загальна назва.","why":"Так само одна л."},{"do":"<i>ванна<\/i> — слово з переліку винятків.","why":"Подвоєння зберігається: <i>ванна<\/i>."}],"answer":"<i>граматика, колектив, ванна<\/i>."},{"task":"Знайди й виправ помилки: «Купив новий компютер і завантажив программу для фізики».","steps":[{"do":"<i>компютер<\/i>: п перед ю, чуємо [й].","why":"Після п перед ю, коли чуємо [й], пишемо апостроф: <i>комп’ютер<\/i>."},{"do":"<i>программу<\/i>: загальна назва з подвоєнням.","why":"У загальних назвах подвоєння немає: <i>програму<\/i>."},{"do":"<i>фізики<\/i>: ф не входить до «дев’ятки».","why":"Пишемо і — правильно."}],"answer":"«Купив новий <b>комп’ютер<\/b> і завантажив <b>програму<\/b> для фізики»."}],"mistakes":["Пишуть і після «дев’ятки»: «сістема», «дізайн». Правильно: <i>система, дизайн<\/i>.","Переносять подвоєння з інших мов: «класс», «программа». Правильно: <i>клас, програма<\/i>.","Ставлять апостроф там, де [й] не чуємо: «б’юро», «п’юре». Правильно: <i>бюро, пюре<\/i>."],"check":[{"q":"Пастка: у якому слові після р пишемо <b>і<\/b>?","options":["р..тм","тр..умф","р..торика"],"correct":1,"a":"<b>тріумф<\/b>: після пропуску голосний у, а перед голосним пишемо і. У <i>ритм, риторика<\/i> після р стоїть приголосний — и."},{"q":"Ти пишеш другові: «Мій новий комп..ютер — супер!» Напиши пропущене слово повністю.","accept":["комп’ютер"],"a":"<b>комп’ютер<\/b>: після п перед ю чуємо [й] — пишемо апостроф."},{"q":"Мама пише: «Помий, будь ласка, …». Як правильно?","options":["ванну","вану"],"correct":0,"a":"<b>ванну<\/b>: слово <i>ванна<\/i> — виняток, подвоєння зберігається."}]}}]},{"id":"U1.5","name":"Лексичні помилки","what":"Як не вжити слово не в тому значенні.","subtopics":[{"id":"U1.5.1","name":"Лексичні помилки","status":"ready","programmeRef":"Уживання слів у невластивому їм значенні; неточне вживання фразеологізмів; тавтологія; уживання зайвого слова","lesson":{"what":"<b>Лексична помилка<\/b> — це невдало вибране слово: воно не підходить за значенням, повторюється або зайве. <b>Тавтологія<\/b> — повтор поруч спільнокореневих слів: <i>розповісти розповідь<\/i>. <b>Фразеологізм<\/b> — стійкий вислів із цілісним значенням: <i>бити байдики<\/i> означає «ледарювати».","ideas":["Слово в невластивому значенні часто плутають зі схожим за звучанням: <i>абонент<\/i> — той, хто користується телефонним зв’язком, а <i>абонемент<\/i> — право відвідувати басейн чи бібліотеку.","Фразеологізм не можна змінювати чи вживати в чужому значенні: правильно <i>мати значення<\/i> або <i>відігравати роль<\/i>, а «грати значення» — помилка.","Тавтологію виправляємо, замінивши одне зі слів: не «розповісти розповідь», а <i>розповісти історію<\/i>.","Зайве слово повторює значення іншого: «вільна вакансія» (вакансія й так вільна), «пам’ятний сувенір», «моя автобіографія».","Не вживай слів і висловів, не властивих українській мові: не «приймати участь», а <i>брати участь<\/i>; не «на протязі тижня», а <i>протягом тижня<\/i>."],"rules":[{"f":"слово ↔ його точне значення","means":"Сумніваєшся — перевір значення в тлумачному словнику, а фразеологізм — у фразеологічному."}],"examples":[{"task":"Знайди й виправ помилку: «Я купив абонент у басейн».","steps":[{"do":"<i>абонент<\/i> — це людина, яка користується зв’язком.","why":"Перевіряємо, чи підходить значення слова до речення."},{"do":"Купують право відвідувати басейн — <i>абонемент<\/i>.","why":"Слова схожі за звучанням, але різні за значенням."}],"answer":"«Я купив <b>абонемент<\/b> у басейн»."},{"task":"Знайди тавтологію й виправ: «Бабуся розповіла цікаву розповідь».","steps":[{"do":"<i>розповіла<\/i> і <i>розповідь<\/i> мають спільний корінь.","why":"Повтор спільнокореневих слів поруч — тавтологія."},{"do":"Замінюємо одне слово: <i>розповідь → історію<\/i>.","why":"Зміст не змінюється, повтору немає."}],"answer":"«Бабуся розповіла цікаву <b>історію<\/b>»."},{"task":"Виправ дві помилки: «На протязі тижня Максим бив байдики над проєктом і вчасно все здав».","steps":[{"do":"«На протязі» — вислів, не властивий українській мові.","why":"Правильно: <i>протягом<\/i>."},{"do":"<i>Бити байдики<\/i> означає «ледарювати», а Максим працював і все здав.","why":"Фразеологізм ужито в чужому значенні — замінюємо: <i>старанно працював<\/i>."}],"answer":"«<b>Протягом<\/b> тижня Максим <b>старанно працював<\/b> над проєктом і вчасно все здав»."}],"mistakes":["Плутають <i>ефектний<\/i> (який справляє враження) і <i>ефективний<\/i> (який дає результат): правильно <i>ефективний спосіб навчання<\/i>, <i>ефектна сукня<\/i>.","Змішують фразеологізми: «це грає велике значення». Правильно: <i>має велике значення<\/i> або <i>відіграє велику роль<\/i>.","Додають зайве слово: «вільна вакансія». Правильно: <i>вакансія<\/i> або <i>вільне місце<\/i>."],"check":[{"q":"Пастка: у якому реченні <b>немає<\/b> лексичної помилки?","options":["Я маю абонент у басейн.","Ми взяли участь у змаганнях.","Це грає велике значення.","Ми прийняли участь у змаганнях."],"correct":1,"a":"<b>Ми взяли участь у змаганнях.<\/b> В інших реченнях треба: <i>абонемент<\/i>; <i>має велике значення<\/i>; <i>взяли участь<\/i>."},{"q":"Ти пишеш другові. Яке речення без зайвого слова?","options":["Дякую за сувенір з Карпат!","Дякую за пам’ятний сувенір з Карпат!"],"correct":0,"a":"<b>Дякую за сувенір з Карпат!<\/b> Сувенір — це вже річ на пам’ять, слово «пам’ятний» зайве."},{"q":"Заміни вислів у дужках одним правильним словом: «Ми тренувалися (на протязі) тижня».","accept":["протягом"],"a":"<b>протягом<\/b>: «на протязі» — вислів, не властивий українській мові."}]}}]},{"id":"U1.6","name":"Стилі мовлення й медіа","what":"Публіцистичний стиль, медіатексти й новини: як відрізнити правду від фейку.","subtopics":[{"id":"U1.6.1","name":"Стилі мовлення. Публіцистичний стиль","status":"ready","programmeRef":"Повторення вивченого про стилі мовлення. Поняття про публіцистичний стиль.","lesson":{"what":"<b>Стиль мовлення<\/b> — це спосіб висловлюватися, який залежить від того, де, з ким і навіщо ми говоримо. Ти вже знаєш розмовний, науковий, художній та офіційно-діловий стилі. <b>Публіцистичний<\/b> стиль — це мова газет, сайтів, телебачення й виступів: він розповідає про важливі події в житті суспільства й переконує.","ideas":["Розмовний стиль — невимушене спілкування з рідними й друзями; науковий — точні знання (підручник, енциклопедія); художній — образи й почуття (оповідання, вірш); офіційно-діловий — документи (заява, інструкція).","Мета публіцистичного стилю — <b>інформувати й впливати<\/b>: повідомити про подію, оцінити її, переконати читача, закликати до дії.","Ознаки публіцистичного стилю: актуальна тема, факти поєднано з оцінкою автора, звертання, заклики, <b>риторичні запитання<\/b> (запитання, на які не чекають відповіді: <i>Хіба можна мовчати?<\/i>).","Жанри публіцистичного стилю: замітка, стаття, репортаж, інтерв’ю, виступ на зборах."],"rules":[{"f":"публіцистичний стиль = суспільно важлива тема + факти + оцінка + заклик","means":"«Учні зібрали 300 кілограмів макулатури (факт). Це чудовий приклад турботи про довкілля (оцінка). Долучайтеся (заклик)!»"}],"examples":[{"task":"Визнач стиль тексту: «Учні нашої школи зібрали 300 кілограмів макулатури. Хіба це не чудовий приклад турботи про довкілля? Долучайтеся до наступної акції!»","steps":[{"do":"Тема — турбота про довкілля.","why":"Тема суспільно важлива й актуальна."},{"do":"Є точний факт — 300 кілограмів.","why":"Публіцистика спирається на факти."},{"do":"Є риторичне запитання й заклик «Долучайтеся!».","why":"Автор оцінює подію й закликає до дії."}],"answer":"Публіцистичний стиль."},{"task":"Порівняй тексти. А: «Вода кипить за температури 100 °C за нормального тиску». Б: «Чиста вода — наше спільне багатство. Бережімо її!»","steps":[{"do":"У тексті А — точне знання без оцінки.","why":"Це ознаки наукового стилю."},{"do":"У тексті Б — оцінка («наше спільне багатство») і заклик «Бережімо її!».","why":"Автор переконує — це публіцистичний стиль."}],"answer":"А — науковий стиль, Б — публіцистичний."},{"task":"Перероби розмовне речення на публіцистичний текст: «Слухай, у нас біля школи такий смітник, жах!»","steps":[{"do":"Прибираємо розмовні слова: <i>слухай, жах<\/i>.","why":"Публіцистичний текст звертається до багатьох, а не до одного друга."},{"do":"Додаємо факт: <i>Біля нашої школи вже місяць лежить купа сміття.<\/i>","why":"Переконуємо фактами."},{"do":"Додаємо оцінку й заклик: <i>Чи можемо ми з цим миритися? Запрошуємо всіх у суботу на толоку!<\/i>","why":"Риторичне запитання й заклик — ознаки публіцистичного стилю."}],"answer":"«Біля нашої школи вже місяць лежить купа сміття. Чи можемо ми з цим миритися? Запрошуємо всіх у суботу на толоку!»"}],"mistakes":["Плутають публіцистичний і науковий стилі. Науковий лише точно пояснює, без закликів; публіцистичний ще й оцінює та переконує.","Вважають публіцистичним будь-який текст у газеті. У газеті бувають і вірші, і оголошення — стиль визначаємо за метою й ознаками тексту.","Пишуть статтю самими вигуками без фактів. Публіцистика переконує фактами, а не лише емоціями."],"check":[{"q":"Який текст публіцистичний?","options":["«Іменник — це частина мови, що означає предмет».","«Мамо, я вже вдома, все добре».","«Наш клас висадив двадцять дубів. Приєднуйтеся до акції — зробімо місто зеленим!»","«Прошу звільнити мене від уроків 15 жовтня»."],"correct":2,"a":"Третій: суспільно важлива тема, факт (двадцять дубів) і заклик. Перший — науковий, другий — розмовний, четвертий — офіційно-діловий."},{"q":"Пастка: у статті є запитання «Хіба можна мовчати?». Яке це запитання?","options":["Звичайне — автор чекає відповіді від читача","Риторичне — відповіді не чекають, воно підсилює думку"],"correct":1,"a":"Це <b>риторичне<\/b> запитання: автор не чекає відповіді, а підсилює свою думку."},{"q":"Ти пишеш допис для шкільного сайту, щоб запросити всіх на благодійний ярмарок. Який стиль доречний?","options":["розмовний","науковий","офіційно-діловий","публіцистичний"],"correct":3,"a":"<b>Публіцистичний<\/b>: треба повідомити про подію й переконати людей прийти."}]}},{"id":"U1.6.2","name":"Медіатекст і надійність джерел","status":"ready","programmeRef":"Поняття про медіатекст.","lesson":{"what":"<b>Медіатекст<\/b> — повідомлення, створене для <b>засобів масової інформації<\/b> (ЗМІ): газет, радіо, телебачення, інтернет-видань. Він може поєднувати слова, фото, звук і відео. <b>Джерело інформації<\/b> — те, звідки ми її дізналися: людина, документ, сайт, видання.","ideas":["Медійна інформація швидко поширюється й розрахована на багатьох людей, тому в ній трапляються і помилки, і навмисна неправда.","У медіатексті розрізняй <b>факт<\/b> — те, що можна перевірити («Матч закінчився з рахунком 2 : 1»), і <b>думку<\/b> — оцінку автора («Це була найкраща гра сезону»).","<b>Надійне джерело<\/b>: відоме видання чи офіційний сайт; названо автора й дату; є посилання на першоджерело; ту саму інформацію підтверджують інші незалежні джерела.","<b>Фейк<\/b> — неправдива інформація, яку подають як правду. Ознаки фейку: гучний заголовок, сильні емоції, немає автора, дати й джерела, заклик «Терміново поширте!»."],"rules":[{"f":"Хто автор? Коли? Звідки відомо? Чи підтверджують інші джерела?","means":"Чотири запитання, які варто поставити до кожного повідомлення, перш ніж повірити й переслати."}],"examples":[{"task":"Факт чи думка: А) «У нашій школі відкрили новий спортзал». Б) «Новий спортзал — найкрасивіший у місті».","steps":[{"do":"А можна перевірити: прийти й побачити.","why":"Те, що можна перевірити, — факт."},{"do":"Б — оцінка: «найкрасивіший» кожен визначає по-своєму.","why":"Оцінка — це думка."}],"answer":"А — факт, Б — думка."},{"task":"Чи надійне повідомлення в соцмережі без автора: «Завтра в усіх школах скасують уроки! Терміново поширте!»?","steps":[{"do":"Немає автора, дати й джерела.","why":"Невідомо, хто й звідки це знає."},{"do":"Є сильні емоції й заклик «Терміново поширте!».","why":"Це типові ознаки фейку."},{"do":"Перевіряємо на офіційному сайті школи або питаємо класного керівника.","why":"Надійне джерело — офіційне."}],"answer":"Повідомлення ненадійне, схоже на фейк; його треба перевірити в офіційному джерелі."},{"task":"Друг надіслав новину: «Учені довели, що шоколад робить людину розумнішою». Як її перевірити?","steps":[{"do":"Шукаємо, які саме вчені й де це сказали.","why":"Без імені джерела твердження перевірити не можна."},{"do":"Шукаємо першоджерело — дослідження чи статтю.","why":"Переказ часто перекручує зміст."},{"do":"Дивимося, чи пишуть про це інші надійні видання.","why":"Правду підтверджують незалежні джерела."}],"answer":"Знайти, хто автор твердження, прочитати першоджерело й звірити з іншими надійними джерелами."}],"mistakes":["Вірять новині, бо її переслали багато людей. Кількість поширень не доводить правдивості.","Плутають думку з фактом. Слова «найкращий», «жахливий» — оцінки, їх не перевіриш.","Перевіряють новину на тому самому сайті, звідки її взяли. Шукай підтвердження в інших незалежних джерелах."],"check":[{"q":"Що з цього — факт?","options":["Цей фільм — найцікавіший цього року.","Фільм вийшов у кінотеатрах 5 вересня.","Усім сподобається цей фільм."],"correct":1,"a":"<b>Фільм вийшов у кінотеатрах 5 вересня<\/b> — це можна перевірити. Решта — думки."},{"q":"Пастка: повідомлення переслали вже 10 000 разів. Чи доводить це, що воно правдиве?","options":["Ні, треба перевірити джерело й підтвердження","Так, стільки людей не можуть помилятися"],"correct":0,"a":"<b>Ні.<\/b> Кількість поширень нічого не доводить — перевір джерело."},{"q":"У класному чаті пишуть: «Завтра уроків не буде!!! Поширте всім!» Як учинити?","options":["Одразу переслати всім друзям","Не приходити завтра до школи","Перевірити на сайті школи або спитати класного керівника"],"correct":2,"a":"Треба <b>перевірити<\/b> в офіційному джерелі: на сайті школи чи в класного керівника."}]}},{"id":"U1.6.3","name":"Новини","status":"ready","programmeRef":"Новини як оперативні повідомлення, які містять суспільно важливу та актуальну інформацію","lesson":{"what":"<b>Новина<\/b> — коротке оперативне, тобто швидке й свіже, повідомлення про подію, важливу для багатьох людей. Якісна новина відповідає на запитання: що сталося? де? коли? хто? — а якщо можна, ще й чому? як?","ideas":["Новина має бути <b>актуальною<\/b> — свіжою й важливою саме зараз — і <b>суспільно важливою<\/b>, тобто стосуватися багатьох людей.","Найважливіше в новині — на початку: уже перше речення розповідає головне.","<b>Достовірність<\/b> — головна ознака якісної новини: факти перевірено, названо джерело («як повідомила директорка школи»), точно вказано дату, місце, числа.","Якісна новина відокремлює факти від думок і не тисне на емоції."],"rules":[{"f":"Що? Де? Коли? Хто? (Чому? Як?)","means":"Запитання, на які відповідає новина. Плюс джерело: хто повідомив."}],"examples":[{"task":"На які запитання відповідає новина: «10 жовтня учні 7-А класу висадили 30 кленів у шкільному парку»?","steps":[{"do":"Що? — висадили 30 кленів.","why":"Подія, про яку повідомляють."},{"do":"Хто? — учні 7-А класу.","why":"Учасники події."},{"do":"Де? — у шкільному парку. Коли? — 10 жовтня.","why":"Місце й час роблять новину точною."}],"answer":"На всі чотири: що, хто, де, коли."},{"task":"Що не так у повідомленні: «Кажуть, що скоро в місті відкриють щось цікаве для дітей»?","steps":[{"do":"«Кажуть» — джерело не назване.","why":"Невідомо, хто це повідомив, отже, перевірити не можна."},{"do":"«Скоро», «щось», «у місті» — немає точного часу, події й місця.","why":"Новина не відповідає на запитання що? де? коли?"}],"answer":"Повідомлення недостовірне: немає джерела й точних фактів."},{"task":"Склади новину для шкільного сайту. Факти: шаховий турнір; 12 жовтня; 24 учні 5–7 класів; перемогла семикласниця Олена Коваль; повідомив учитель фізкультури.","steps":[{"do":"Починаємо з головного: що, коли, хто.","why":"Найважливіше — у першому реченні."},{"do":"Додаємо переможця.","why":"Це найцікавіший факт для читачів."},{"do":"Називаємо джерело.","why":"Джерело робить новину достовірною."}],"answer":"«12 жовтня у школі відбувся шаховий турнір, у якому змагалися 24 учні 5–7 класів. Перемогла семикласниця Олена Коваль. Про це повідомив учитель фізкультури»."}],"mistakes":["Починають новину з довгого вступу. Головне має бути в першому реченні.","Пишуть «кажуть», «усі знають» замість джерела. Назви, хто саме повідомив.","Подають свою оцінку як факт: «найкращий турнір в історії». Оцінці місце в статті чи коментарі, а не в новині."],"check":[{"q":"Яке повідомлення — новина?","options":["«Осінь — найкрасивіша пора року».","«Сьогодні о 9:00 у школі № 3 відкрили нову бібліотеку, повідомила директорка».","«Колись давно жив собі цар…»"],"correct":1,"a":"Повідомлення про <b>нову бібліотеку<\/b>: свіжа подія, точні час і місце, назване джерело."},{"q":"Пастка: «Кажуть, що завтра в усьому місті вимкнуть світло». Чого бракує, щоб повідомлення було достовірним?","options":["Джерела інформації","Гучнішого заголовка","Більше знаків оклику"],"correct":0,"a":"Бракує <b>джерела<\/b>: «кажуть» — це не джерело. Заголовок і знаки оклику достовірності не додають."},{"q":"Ти пишеш у класний чат новину про екскурсію. Що поставити на початок?","options":["Свою думку про музеї","Що, де й коли відбудеться","Опис погоди минулого тижня"],"correct":1,"a":"Найважливіше — на початку: <b>що, де й коли<\/b>."}]}}]}]},{"id":"U2","subject":"ukr","name":"Дієслово","what":"Частина мови, що означає дію: її форми, час, спосіб, дієвідміна і правопис.","topics":[{"id":"U2.1","name":"Дієслово та його форми","what":"Що таке дієслово і в яких формах воно буває.","subtopics":[{"id":"U2.1.1","name":"Дієслово: значення, ознаки, роль у реченні","status":"ready","programmeRef":"Дієслово: загальне значення, морфологічні ознаки, синтаксична роль.","lesson":{"what":"<b>Дієслово<\/b> — самостійна частина мови, яка означає дію або стан предмета й відповідає на питання <i>що робити? що зробити?<\/i> (<i>що робить? що зробив?<\/i> тощо). <b>Морфологічні ознаки<\/b> — це граматичні властивості слова: вид, час, особа, число, рід, спосіб. У реченні дієслово найчастіше буває <b>присудком<\/b>.","ideas":["Дієслово може означати дію (<i>бігти, писати<\/i>), стан (<i>спати, сумувати<\/i>) або зміну ознаки (<i>зеленіти, дорослішати<\/i>).","<b>Постійні<\/b> ознаки дієслова не змінюються: це <b>вид<\/b> (доконаний чи недоконаний) і <b>дієвідміна<\/b> (І чи ІІ).","<b>Змінні<\/b> ознаки змінюються разом із формою слова: спосіб, час, особа, число, а в минулому часі й умовному способі — рід.","Головна роль дієслова в реченні — <b>присудок<\/b>: <i>Діти <b>грають<\/b> у футбол.<\/i> Неозначена форма (<i>грати<\/i>) може бути й іншими членами речення.","Дієслова тісно пов’язані з особовими займенниками: <i>я пишу, ти пишеш, вони пишуть<\/i> — закінчення підказує, хто виконує дію."],"rules":[{"f":"дієслово → що робити? що зробити?","means":"Щоб перевірити, чи слово — дієслово, постав до нього таке питання в потрібній формі: <i>малює<\/i> (що робить?), <i>намалював<\/i> (що зробив?)."}],"examples":[{"task":"Знайди дієслова в реченні: <i>Уранці сонце визирнуло з-за хмари, і птахи весело заспівали.<\/i>","steps":[{"do":"<i>визирнуло<\/i> — що зробило?","why":"Питання дієслова, слово означає дію."},{"do":"<i>заспівали<\/i> — що зробили?","why":"Теж питання дієслова."},{"do":"<i>весело<\/i> — як? Це не дієслово.","why":"Слово показує ознаку дії, а не саму дію: це прислівник."}],"answer":"дієслова <i>визирнуло<\/i> і <i>заспівали<\/i>."},{"task":"Чи є дієсловом слово <i>читання<\/i> в реченні <i>Читання розвиває уяву<\/i>?","steps":[{"do":"Ставимо питання: <i>що<\/i> розвиває уяву? — <i>читання<\/i>.","why":"Питання <i>що?<\/i> — це питання іменника."},{"do":"Слово називає дію, але як предмет.","why":"Дію можуть називати й іменники: <i>ходьба, біг, читання<\/i>. Вирішує питання, а не лише значення."},{"do":"<i>розвиває<\/i> — що робить?","why":"Ось справжнє дієслово цього речення."}],"answer":"ні, <i>читання<\/i> — іменник; дієслово в реченні — <i>розвиває<\/i>."},{"task":"Визнач ознаки й синтаксичну роль дієслова <i>пишуть<\/i> у реченні <i>Семикласники пишуть диктант.<\/i>","steps":[{"do":"<i>пишуть<\/i> — що роблять? Початкова форма — <i>писати<\/i>.","why":"Питання дієслова; до початкової форми ставимо питання <i>що робити?<\/i>"},{"do":"Вид — недоконаний.","why":"<i>писати<\/i> відповідає на питання <i>що робити?<\/i>"},{"do":"Дійсний спосіб, теперішній час, 3-я особа, множина.","why":"Дія справді відбувається зараз; підходить займенник <i>вони<\/i>."},{"do":"Синтаксична роль — присудок.","why":"Дієслово говорить, що роблять <i>семикласники<\/i> (підмет)."}],"answer":"<i>пишуть<\/i> — дієслово недоконаного виду, дійсного способу, теперішнього часу, 3-ї особи множини; у реченні — присудок."}],"mistakes":["Вважають дієсловом кожне слово, що називає дію: <i>біг, читання, допомога<\/i>. Але це іменники (питання <i>що?<\/i>). Дієслово відповідає на питання <i>що робити? що зробити?<\/i>","Думають, що в минулому часі дієслово змінюється за особами. Ні: <i>я читав, ти читав, він читав<\/i> — форма та сама, особу показує займенник. Змінюється рід: <i>читав, читала, читало<\/i>.","Шукають присудок лише в кінці речення. Він може стояти будь-де: <i>На подвір’ї <b>гралися<\/b> діти.<\/i>"],"check":[{"q":"Пастка: у якому реченні слово <i>біг<\/i> — дієслово?","options":["Уранці на стадіоні був <i>біг<\/i> на сто метрів.","Собака <i>біг<\/i> за м’ячем.","<i>Біг<\/i> зміцнює серце."],"correct":1,"a":"<i>Собака біг<\/i> — що робив? Це дієслово минулого часу. В інших реченнях <i>біг<\/i> — іменник: питання <i>що?<\/i>"},{"q":"Знайди в реченні дієслово й напиши його одним словом: <i>Мій друг Андрій щосуботи тренується в басейні.<\/i>","accept":["тренується"],"a":"<i>тренується<\/i> — що робить? Інші слова: <i>друг, Андрій<\/i> — іменники, <i>мій<\/i> — займенник, <i>щосуботи<\/i> — прислівник."},{"q":"Оля написала мамі: <i>Мамо, я вже сідаю за уроки!<\/i> Яким членом речення є дієслово <i>сідаю<\/i>?","options":["підметом","обставиною","присудком"],"correct":2,"a":"<i>сідаю<\/i> — присудок: говорить, що робить підмет <i>я<\/i>."}]}},{"id":"U2.1.2","name":"Форми дієслова. Інфінітив","status":"ready","programmeRef":"Неозначена форма дієслова (інфінітив).","lesson":{"what":"Дієслово має кілька <b>форм<\/b>: неозначену форму (інфінітив), особові форми, дієприкметник, дієприслівник і форми на <i>-но, -то<\/i>. <b>Інфінітив<\/b> — початкова форма дієслова: він лише називає дію і не показує ні часу, ні особи, ні числа (<i>читати, сміятися<\/i>).","ideas":["<b>Особові форми<\/b> показують особу й число: <i>пишу, пишеш, пишуть<\/i>. <b>Дієприкметник<\/b> схожий на прикметник (<i>написаний<\/i> — який?), <b>дієприслівник<\/b> — на прислівник (<i>пишучи<\/i>), а форми на <i>-но, -то<\/i> — це <i>написано, зроблено<\/i>. Ці форми детально вивчатимеш далі.","Інфінітив відповідає на питання <i>що робити?<\/i> або <i>що зробити?<\/i>: <i>малювати, намалювати<\/i>.","Ознака інфінітива — суфікс <b>-ти<\/b>: <i>малювати, нести<\/i>. У зворотних дієсловах після нього стоїть <b>-ся<\/b> (постфікс — частинка в самому кінці слова): <i>умиватися, сміятися<\/i>.","У словнику дієслова подано в інфінітиві: щоб знайти значення слова <i>пишемо<\/i>, шукай <i>писати<\/i>.","У реченні інфінітив буває частиною присудка (<i>Я хочу <b>плавати<\/b><\/i>), підметом (<i><b>Плавати<\/b> — моє улюблене заняття<\/i>) та іншими членами речення."],"rules":[{"f":"інфінітив = основа + -ти (+ -ся)","means":"<i>писа-ти, сиді-ти, нес-ти, учи-ти-ся<\/i>. Інфінітив не змінюється, тому закінчення не має: <i>-ти<\/i> — суфікс."},{"f":"що робити? → -тися; що робить? → -ться","means":"<i>Я люблю вчитися<\/i> (що робити? — інфінітив), але <i>Він добре вчиться<\/i> (що робить? — 3-я особа)."}],"examples":[{"task":"Постав дієслова в неозначену форму: <i>пишемо, несли, сміється<\/i>.","steps":[{"do":"<i>пишемо<\/i> → <i>писати<\/i>","why":"Ставимо питання <i>що робити?<\/i> і додаємо суфікс <i>-ти<\/i>."},{"do":"<i>несли<\/i> → <i>нести<\/i>","why":"Інфінітив не має ні часу, ні числа."},{"do":"<i>сміється<\/i> → <i>сміятися<\/i>","why":"Зворотне дієслово: <i>-ся<\/i> зберігається й в інфінітиві."}],"answer":"<i>писати, нести, сміятися<\/i>."},{"task":"Яка це форма дієслова: <i>читати, читаю, прочитаний, читаючи<\/i>?","steps":[{"do":"<i>читати<\/i> — інфінітив.","why":"Питання <i>що робити?<\/i>, немає ні часу, ні особи."},{"do":"<i>читаю<\/i> — особова форма.","why":"Показує особу й число: <i>я<\/i>, однина."},{"do":"<i>прочитаний<\/i> — дієприкметник.","why":"Відповідає на питання <i>який?<\/i>, як прикметник, але утворений від дієслова."},{"do":"<i>читаючи<\/i> — дієприслівник.","why":"Відповідає на питання <i>що роблячи?<\/i> і показує додаткову дію."}],"answer":
