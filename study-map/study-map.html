<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Моя карта навчання</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Карта навчання для 7 класу: предмет → розділ → тема → підтема → урок.
   Шрифти з Google Fonts мають кирилицю; без мережі сторінка бере системні шрифти. */
:root {
  --bg: #f6f4ee;
  --surface: #ffffff;
  --surface-2: #f1eee6;
  --ink: #1f2933;
  --ink-soft: #55606b;
  --line: #d8d3c7;
  --track: #e6e1d6;
  --accent: #19717f;
  --accent-ink: #ffffff;
  --accent-soft: #dcefF1;
  --focus: #2457d6;
  --good: #2e7a4c;
  --good-soft: #def0e4;
  --mid: #9a6400;
  --mid-soft: #f7ead2;
  --bad: #b0413b;
  --bad-soft: #f6dfdd;
  --now: #b4530e;
  --now-soft: #fbe7d6;
  --next: #6247c8;
  --next-soft: #e9e4fb;
  --planned: #8b9097;
  --s1: #19717f; --s2: #6247c8; --s3: #b4530e; --s4: #2e7a4c;
  --shadow: 0 1px 2px rgba(31, 41, 51, .06), 0 4px 14px rgba(31, 41, 51, .06);
  --font-body: "Nunito", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14171d; --surface: #1c2028; --surface-2: #232833; --ink: #e9ebef; --ink-soft: #a9b0bc;
    --line: #363d4a; --track: #2c323e; --accent: #4fc0cf; --accent-ink: #0d2226; --accent-soft: #1d3a40;
    --focus: #8aaeff; --good: #6cc792; --good-soft: #1e3628; --mid: #e6b45c; --mid-soft: #3a2f1a;
    --bad: #f08a83; --bad-soft: #3d2423; --now: #f0a064; --now-soft: #3e2a1b; --next: #b3a2ff; --next-soft: #2c2645;
    --planned: #7d838d; --s1: #4fc0cf; --s2: #b3a2ff; --s3: #f0a064; --s4: #6cc792;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 4px 14px rgba(0, 0, 0, .25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #14171d; --surface: #1c2028; --surface-2: #232833; --ink: #e9ebef; --ink-soft: #a9b0bc;
  --line: #363d4a; --track: #2c323e; --accent: #4fc0cf; --accent-ink: #0d2226; --accent-soft: #1d3a40;
  --focus: #8aaeff; --good: #6cc792; --good-soft: #1e3628; --mid: #e6b45c; --mid-soft: #3a2f1a;
  --bad: #f08a83; --bad-soft: #3d2423; --now: #f0a064; --now-soft: #3e2a1b; --next: #b3a2ff; --next-soft: #2c2645;
  --planned: #7d838d; --s1: #4fc0cf; --s2: #b3a2ff; --s3: #f0a064; --s4: #6cc792;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 4px 14px rgba(0, 0, 0, .25);
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.6 var(--font-body); overflow-x: hidden; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 6px; }
sub, sup { line-height: 0; }
h1, h2, h3, p { margin: 0; }
.code { font: 600 .8em/1 var(--font-mono); color: var(--ink-soft); white-space: nowrap; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- Шапка ---------- */
header.top { background: var(--surface); border-bottom: 1px solid var(--line); }
.top-inner { max-width: 880px; margin: 0 auto; padding: 14px 16px 0; display: grid; gap: 10px; }
.top-row { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; }
.brand { font-size: 1.3rem; font-weight: 800; letter-spacing: -.01em; line-height: 1.2; }
.brand small { display: block; font-size: .92rem; font-weight: 600; color: var(--ink-soft); letter-spacing: 0; }
.toggle { min-height: 44px; border: 2px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 16px; font-weight: 700; }
.toggle:hover { border-color: var(--ink-soft); }
.toggle[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.tabs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: thin; margin: 0 -4px; padding: 0 4px; }
.tab { flex: none; min-height: 48px; border: 0; background: none; padding: 8px 14px; border-bottom: 4px solid transparent; font-weight: 700; color: var(--ink-soft); display: flex; align-items: center; gap: 8px; border-radius: 8px 8px 0 0; }
.tab:hover { color: var(--ink); background: var(--surface-2); }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--tab-c, var(--accent)); }
.tab .ic { font-size: 1.2rem; line-height: 1; }
.tabs-spacer { height: 0; }

/* ---------- Основна частина ---------- */
main { max-width: 880px; margin: 0 auto; padding: 20px 16px 40px; display: grid; gap: 18px; min-width: 0; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px; box-shadow: var(--shadow); min-width: 0; }
.card h3 { font-size: 1.05rem; font-weight: 800; margin-bottom: 8px; }
.card p + p { margin-top: 8px; }
.note { font-size: .9rem; color: var(--ink-soft); }
.btn { min-height: 44px; border: 2px solid var(--accent); background: var(--accent); color: var(--accent-ink); border-radius: 12px; padding: 8px 16px; font-weight: 800; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-align: center; }
.btn:hover { filter: brightness(1.07); }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); font-weight: 700; }
.btn.ghost:hover { border-color: var(--ink-soft); filter: none; }
.btn[aria-pressed="true"].mark { background: var(--good); border-color: var(--good); color: #fff; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

/* Вступ до предмета */
.intro { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 16px; align-items: center; }
.intro h2 { font-size: 1.35rem; font-weight: 800; line-height: 1.25; }
.intro .sub-line { color: var(--ink-soft); font-size: .95rem; }
.hints { display: grid; gap: 10px; }
.hint { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 12px 14px; border-radius: 12px; border: 1px solid transparent; }
.hint.now { background: var(--now-soft); border-color: color-mix(in srgb, var(--now) 35%, transparent); }
.hint.next { background: var(--next-soft); border-color: color-mix(in srgb, var(--next) 35%, transparent); }
.hint .lbl { font-weight: 800; }
.hint.now .lbl { color: var(--now); }
.hint.next .lbl { color: var(--next); }
.chip { min-height: 40px; display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 4px 14px; font-weight: 700; font-size: .92rem; border: 2px solid currentColor; background: var(--surface); }
.chip.next { color: var(--next); }
.chip.now { color: var(--now); }
.chip:hover { background: var(--surface-2); }
.badge { display: inline-flex; align-items: center; border-radius: 999px; padding: 1px 10px; font-size: .78rem; font-weight: 800; line-height: 1.6; white-space: nowrap; }
.badge.now { background: var(--now); color: #fff; }
.badge.next { background: var(--next); color: #fff; }

/* Умовні позначення */
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: .85rem; color: var(--ink-soft); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }

/* Кільце прогресу */
.ring { flex: none; display: block; }
.ring .trk { fill: none; stroke: var(--track); }
.ring .val { fill: none; stroke: var(--ring-c, var(--accent)); stroke-linecap: round; }
.ring text { font: 800 12px var(--font-body); fill: var(--ink); text-anchor: middle; dominant-baseline: central; }
.ring.big text { font-size: 15px; }

/* Дерево */
.tree, .topics, .subs { list-style: none; margin: 0; padding: 0; }
.tree { display: grid; gap: 14px; }
.sec { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); overflow: hidden; min-width: 0; }
.sec > h2, .topic > h3 { margin: 0; font-size: inherit; }
.sec-head { width: 100%; min-height: 72px; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 14px; align-items: center; text-align: left; background: none; border: 0; padding: 14px 16px; }
.sec-head:hover { background: var(--surface-2); }
.sec-head .nm { display: block; font-size: 1.1rem; font-weight: 800; line-height: 1.3; overflow-wrap: anywhere; }
.sec-head .meta { display: block; font-size: .85rem; color: var(--ink-soft); }
.chev { width: 28px; height: 28px; display: grid; place-items: center; border-radius: 50%; background: var(--surface-2); transition: transform .15s; font-size: .8rem; color: var(--ink-soft); }
[aria-expanded="true"] > .chev { transform: rotate(90deg); }
.sec-body { padding: 0 16px 16px; display: grid; gap: 10px; }
.sec-body > .what { color: var(--ink-soft); font-size: .95rem; }
.topics { display: grid; gap: 8px; }
.topic { border: 1px solid var(--line); border-radius: 12px; background: var(--bg); min-width: 0; }
.topic.now { border: 2px solid var(--now); background: var(--now-soft); }
.topic-head { width: 100%; min-height: 56px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 12px; align-items: center; text-align: left; background: none; border: 0; padding: 10px 12px; border-radius: 12px; }
.topic-head:hover { background: color-mix(in srgb, var(--surface-2) 70%, transparent); }
.topic-head .t1 { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 8px; min-width: 0; }
.topic-head .nm { font-weight: 800; overflow-wrap: anywhere; }
.topic-head .t2 { grid-column: 1 / -1; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; font-size: .82rem; color: var(--ink-soft); }
.topic-head .chev { grid-row: 1; grid-column: 2; }
.bar { height: 10px; border-radius: 5px; background: var(--track); overflow: hidden; display: block; min-width: 60px; }
.bar i { display: block; height: 100%; background: var(--bar-c, var(--accent)); border-radius: 5px; }
.topic-body { padding: 0 12px 12px; display: grid; gap: 8px; }
.topic-body > .what { font-size: .92rem; color: var(--ink-soft); }
.subs { display: grid; gap: 6px; }
.sub { width: 100%; min-height: 48px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; align-items: center; text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 12px; }
button.sub:hover { border-color: var(--ink-soft); }
.sub .nm { font-weight: 700; overflow-wrap: anywhere; }
.sub .tags { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; align-items: center; }
.sub.planned { background: transparent; border-style: dashed; color: var(--planned); }
.sub.planned .nm { font-weight: 600; }
.sub.is-next { border: 2px solid var(--next); }
.pill { display: inline-flex; align-items: center; gap: 4px; border-radius: 999px; padding: 1px 10px; font-size: .78rem; font-weight: 800; line-height: 1.6; white-space: nowrap; background: var(--surface-2); color: var(--ink-soft); }
.pill.st-read { background: var(--accent-soft); color: var(--accent); }
.pill.st-checked { background: var(--mid-soft); color: var(--mid); }
.pill.st-mastered { background: var(--good-soft); color: var(--good); }
.pill.st-planned { background: transparent; border: 1px dashed var(--planned); color: var(--planned); }
.pill.prac { background: transparent; border: 1px solid var(--line); color: var(--ink-soft); font-family: var(--font-mono); font-weight: 600; }
.empty { text-align: center; padding: 36px 20px; display: grid; gap: 10px; justify-items: center; }
.empty .big { font-size: 2.6rem; line-height: 1; }
.empty h2 { font-size: 1.3rem; font-weight: 800; }
.empty p { max-width: 46ch; color: var(--ink-soft); }

/* ---------- Урок ---------- */
.lesson { display: grid; gap: 16px; min-width: 0; }
.crumbs { font-size: .88rem; color: var(--ink-soft); overflow-wrap: anywhere; }
.lesson-title { font-size: 1.5rem; font-weight: 800; line-height: 1.25; overflow-wrap: anywhere; }
.lesson-title:focus { outline: none; }
.lesson-title:focus-visible { outline: 3px solid var(--focus); }
.lesson .card ul, .lesson .card ol { margin: 0; padding-left: 22px; display: grid; gap: 6px; }
.rules { display: grid; gap: 10px; }
.rule { border: 1px solid var(--line); border-left: 5px solid var(--accent); border-radius: 10px; padding: 10px 12px; background: var(--bg); display: grid; gap: 4px; min-width: 0; }
.rule .f { font: 600 1.05rem/1.5 var(--font-mono); overflow-wrap: anywhere; }
.rule .m { font-size: .95rem; color: var(--ink-soft); }
.task { padding: 12px 14px; border-radius: 10px; background: var(--surface-2); font-weight: 600; }
ol.steps { list-style: none; padding: 0 !important; counter-reset: st; margin-top: 12px !important; }
ol.steps li { counter-increment: st; display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 4px 10px; align-items: start; }
ol.steps li::before { content: counter(st); width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--accent); color: var(--accent-ink); font-weight: 800; font-size: .9rem; grid-row: span 2; }
ol.steps .do { font-weight: 700; }
ol.steps .why { font-size: .93rem; color: var(--ink-soft); }
ol.steps .why b { color: var(--ink); }
.answer { margin-top: 12px; padding: 10px 14px; border-radius: 10px; background: var(--good-soft); color: var(--ink); }
.answer b { color: var(--good); }
.mistakes li::marker { content: "⚠︎  "; color: var(--mid); }
.checks { display: grid; gap: 10px; }
.check { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: grid; gap: 10px; background: var(--bg); }
.check .q { font-weight: 700; }
.check .a { padding: 8px 12px; border-radius: 8px; background: var(--surface); border: 1px dashed var(--line); }
.check .res { font-size: .9rem; font-weight: 700; }
.check .res.know { color: var(--good); }
.check .res.not-yet { color: var(--mid); }
.btn.know[aria-pressed="true"] { background: var(--good); border-color: var(--good); color: #fff; }
.btn.not-yet[aria-pressed="true"] { background: var(--mid); border-color: var(--mid); color: #fff; }
.ask { display: grid; gap: 10px; }
.ask textarea { width: 100%; min-height: 64px; resize: none; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: var(--bg); color: var(--ink); font-size: .95rem; line-height: 1.45; }
.pager { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.pager .btn { justify-content: flex-start; text-align: left; min-width: 0; }
.pager .btn.nx { justify-content: flex-end; text-align: right; grid-column: 2; }
.pager .btn span { overflow-wrap: anywhere; }
.ref { font-size: .85rem; color: var(--ink-soft); border-left: 3px solid var(--line); padding-left: 10px; }

/* ---------- Для батьків ---------- */
.par-head h2 { font-size: 1.35rem; font-weight: 800; }
.subj-cards { display: grid; gap: 14px; }
.meter { display: grid; gap: 4px; }
.meter .lbl { display: flex; justify-content: space-between; gap: 10px; font-size: .92rem; }
.meter .lbl b { font-variant-numeric: tabular-nums; white-space: nowrap; }
.meter .bar { height: 14px; border-radius: 7px; }
.meters { display: grid; gap: 10px; margin-top: 10px; }
table.acc { width: 100%; border-collapse: collapse; font-size: .92rem; }
table.acc th, table.acc td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--track); vertical-align: middle; }
table.acc th { font-size: .8rem; color: var(--ink-soft); font-weight: 700; }
table.acc td.num { white-space: nowrap; font-variant-numeric: tabular-nums; }
table.acc .bar { width: 100%; min-width: 50px; }
.weak { margin: 0; padding-left: 22px; display: grid; gap: 4px; }
.tips { margin: 0; padding-left: 22px; display: grid; gap: 8px; }

footer.foot { max-width: 880px; margin: 0 auto; padding: 0 16px 32px; font-size: .82rem; color: var(--ink-soft); display: flex; flex-wrap: wrap; gap: 4px 16px; justify-content: space-between; }

@media (max-width: 560px) {
  body { font-size: 16px; }
  .card { padding: 14px; border-radius: 14px; }
  .sec-head { padding: 12px; gap: 10px; }
  .sec-body { padding: 0 10px 12px; }
  .intro { grid-template-columns: minmax(0, 1fr); }
  .intro .ring { display: none; }
  .sub { grid-template-columns: minmax(0, 1fr); }
  .sub .tags { justify-content: flex-start; }
  .pager { grid-template-columns: minmax(0, 1fr); }
  .pager .btn.nx { grid-column: 1; }
  .lesson-title { font-size: 1.3rem; }
  table.acc .barcol { display: none; }
}
@media (prefers-reduced-motion: reduce) { .chev { transition: none; } }
</style>
</head>
<body>
<header class="top">
  <div class="top-inner">
    <div class="top-row">
      <h1 class="brand" id="brand">Моя карта навчання<small id="who"></small></h1>
      <button class="toggle" id="parents-toggle" type="button" aria-pressed="false">Для батьків</button>
    </div>
    <div class="tabs" id="tabs" role="tablist" aria-label="Предмети"></div>
    <div class="tabs-spacer"></div>
  </div>
</header>
<main id="main" tabindex="-1" aria-live="off"></main>
<footer class="foot"><span id="store-status"></span><span id="ver"></span></footer>

<script>
/* ---------- Зміст: вставляє study-map/build-map.py з study-map/content/ ---------- */
const CONTENT = {"subjects":[{"id":"algebra","name":"Алгебра","grade":7,"tutor":"Оля","tutorCall":"Олю","icon":"➗","sections":[{"id":"A1","subject":"algebra","name":"Лінійні рівняння з однією змінною","what":"Рівняння — це рівність з невідомим. Учимося знаходити невідоме і розв'язувати задачі за допомогою рівнянь.","topics":[{"id":"A1.1","name":"Рівняння та його корені","what":"Що таке рівняння, корінь і які перетворення не змінюють коренів.","subtopics":[{"id":"A1.1.1","name":"Рівняння і корінь рівняння","status":"ready","programmeRef":"Загальні відомості про рівняння.","lesson":{"what":"<b>Рівняння<\/b> — це рівність, у якій є невідоме число, позначене буквою. Цю букву називають <b>змінною<\/b>. <b>Корінь рівняння<\/b> — таке значення змінної, при якому рівняння перетворюється на правильну числову рівність.","ideas":["Ліва частина рівняння — усе, що стоїть зліва від знака «=», права частина — усе, що справа.","Щоб перевірити, чи є число коренем, підстав його замість змінної й порахуй <b>обидві<\/b> частини. Однаково — корінь, різне — не корінь.","<b>Розв'язати рівняння<\/b> — означає знайти всі його корені або показати, що коренів немає.","Рівняння може мати один корінь, кілька, безліч або жодного."],"rules":[{"f":"x + 7 = 12; x = 5, бо 5 + 7 = 12","means":"Корінь — це число, яке робить рівність правильною. Тут корінь — 5."}],"example":{"task":"Чи є число 3 коренем рівняння 4x − 5 = 2x + 1? А число 2?","steps":[{"do":"При x = 3 ліва частина: 4 · 3 − 5 = 12 − 5 = 7","why":"Підставляємо 3 замість x у ліву частину."},{"do":"Права частина: 2 · 3 + 1 = 6 + 1 = 7","why":"Підставляємо те саме число в праву частину."},{"do":"7 = 7 — рівність правильна","why":"Обидві частини рівні, отже 3 — корінь."},{"do":"При x = 2: 4 · 2 − 5 = 3, а 2 · 2 + 1 = 5; 3 ≠ 5","why":"Частини різні, отже 2 — не корінь."}],"answer":"Відповідь: 3 — корінь рівняння, 2 — не корінь."},"mistakes":["Рахують лише ліву частину. Правильно: порахуй <b>обидві<\/b> частини й порівняй їх.","При x = 4 записують 3x як 34. Правильно: 3x — це 3 · x, тобто 3 · 4 = 12.","Плутають рівняння і корінь. Рівняння — це запис x + 7 = 12, а корінь — число 5."],"check":[{"q":"Чи є число −2 коренем рівняння 3x + 10 = 4?","a":"Так: 3 · (−2) + 10 = −6 + 10 = 4."},{"q":"Пастка: чи має корені рівняння x + 1 = x?","a":"Ні. Яке число не підстав, ліва частина на 1 більша за праву. Коренів немає."},{"q":"Марійка мала x гривень, купила зошит за 25 грн, і в неї залишилося 40 грн. Запиши рівняння і знайди x.","a":"x − 25 = 40, x = 65 грн. Перевірка: 65 − 25 = 40."}]}},{"id":"A1.1.2","name":"Рівносильні рівняння і властивості рівнянь","status":"ready","programmeRef":"Рівносильні рівняння.","lesson":{"what":"<b>Рівносильні рівняння<\/b> — це рівняння, які мають ті самі корені (або обидва не мають коренів). Розв'язуючи рівняння, ми крок за кроком замінюємо його простішим рівносильним, поки не побачимо корінь.","ideas":["Рівняння 2x = 10 і x + 1 = 6 рівносильні: кожне має єдиний корінь 5.","<b>Властивість 1.<\/b> Будь-який доданок можна перенести з однієї частини рівняння в іншу, змінивши його знак на протилежний.","<b>Властивість 2.<\/b> Обидві частини рівняння можна помножити або поділити на одне й те саме число, яке <b>не дорівнює нулю<\/b>.","Розкриття дужок і зведення подібних доданків теж не змінюють коренів рівняння."],"rules":[{"f":"x + b = c → x = c − b","means":"Перенесли доданок b праворуч — його знак змінився з «+» на «−»."},{"f":"ax = c → x = c : a (a ≠ 0)","means":"Поділили обидві частини на те саме число a, яке не дорівнює нулю."}],"example":{"task":"Розв'яжи рівняння 5x − 8 = 3x + 6, записуючи на кожному кроці рівносильне рівняння.","steps":[{"do":"5x − 3x = 6 + 8","why":"Перенесли 3x ліворуч, а −8 праворуч, змінивши знаки (властивість 1)."},{"do":"2x = 14","why":"Звели подібні доданки: 5x − 3x = 2x; 6 + 8 = 14."},{"do":"x = 14 : 2, x = 7","why":"Поділили обидві частини на 2, а 2 ≠ 0 (властивість 2)."},{"do":"Перевірка: 5 · 7 − 8 = 27 і 3 · 7 + 6 = 27","why":"Обидві частини рівні — корінь знайдено правильно."}],"answer":"Відповідь: x = 7."},"mistakes":["Переносять доданок, не змінюючи знака: з x + 4 = 10 пишуть x = 10 + 4. Правильно: x = 10 − 4, x = 6.","Ділять не всю частину: з 3x = 12 + 6 пишуть x = 4 + 6. Правильно: спершу 3x = 18, потім x = 18 : 3 = 6.","«Скорочують» на x: з 5x = 3x роблять 5 = 3 і кажуть, що коренів немає. Ділити можна лише на число, відмінне від нуля. Правильно: 5x − 3x = 0, 2x = 0, x = 0."],"check":[{"q":"Чи рівносильні рівняння x − 3 = 4 і 2x = 14?","a":"Так: кожне має єдиний корінь 7."},{"q":"Пастка: чи рівносильні рівняння 0 · x = 5 і x + 2 = x?","a":"Так. Жодне з них не має коренів, а такі рівняння вважають рівносильними."},{"q":"У Тараса в кишені x гривень, а в скарбничці — утричі більше, разом 120 грн. Яке простіше рівняння рівносильне рівнянню x + 3x = 120? Скільки грошей у кишені?","a":"4x = 120, x = 30. У кишені 30 грн (у скарбничці 90 грн)."}]}}]},{"id":"A1.2","name":"Лінійні рівняння","what":"Рівняння виду ax = b і ті, що до нього зводяться.","subtopics":[{"id":"A1.2.1","name":"Лінійне рівняння ax = b","status":"ready","programmeRef":"Лінійні рівняння з однією змінною.","lesson":{"what":"<b>Лінійне рівняння з однією змінною<\/b> — це рівняння виду ax = b, де x — змінна, а a і b — числа. Число a, яке стоїть перед змінною, називають <b>коефіцієнтом<\/b>.","ideas":["Приклади лінійних рівнянь: 3x = 12 (a = 3, b = 12), −x = 7 (a = −1, b = 7), 0,5x = 2 (a = 0,5, b = 2).","Рівняння x<sup>2<\/sup> = 9 — не лінійне: у ньому змінна в квадраті.","Якщо коефіцієнт a ≠ 0, рівняння має один корінь: x = b : a.","Якщо коефіцієнт від'ємний, ділимо на від'ємне число — уважно зі знаком відповіді.","Якщо a = 0, рівняння має вигляд 0 · x = b — цей випадок розглядаємо окремо."],"rules":[{"f":"ax = b, a ≠ 0 → x = b : a","means":"Щоб знайти корінь, поділи число b на коефіцієнт a."}],"example":{"task":"Розв'яжи рівняння −4x = 18.","steps":[{"do":"a = −4, b = 18; a ≠ 0","why":"Це лінійне рівняння, коефіцієнт не нуль — корінь один."},{"do":"x = 18 : (−4)","why":"Ділимо обидві частини на коефіцієнт −4."},{"do":"x = −4,5","why":"Додатне число поділити на від'ємне — результат від'ємний; 18 : 4 = 4,5."},{"do":"Перевірка: −4 · (−4,5) = 18","why":"Мінус на мінус дає плюс; 4 · 4,5 = 18. Рівність правильна."}],"answer":"Відповідь: x = −4,5."},"mistakes":["Ділять «навпаки»: з 6x = 3 пишуть x = 6 : 3 = 2. Правильно: ділимо на коефіцієнт, x = 3 : 6 = 0,5.","Гублять мінус: з −x = 7 пишуть x = 7. Правильно: коефіцієнт тут −1, тож x = 7 : (−1) = −7.","Віднімають замість ділення: з 5x = 20 пишуть x = 20 − 5 = 15. Правильно: 5x — це 5 · x, тож x = 20 : 5 = 4."],"check":[{"q":"Які з рівнянь лінійні: 7x = 2; x<sup>2<\/sup> = 4; 0,2x = −1?","a":"7x = 2 і 0,2x = −1. У рівнянні x<sup>2<\/sup> = 4 змінна в квадраті."},{"q":"Дорога до школи — 3 км, велосипедист їде зі швидкістю 12 км/год. Розв'яжи рівняння 12t = 3, де t — час у годинах.","a":"t = 3 : 12 = 0,25 год, тобто 15 хвилин."},{"q":"Пастка: скільки коренів має рівняння 0 · x = 6?","a":"Жодного: 0 · x завжди дорівнює 0, а не 6."}]}},{"id":"A1.2.2","name":"Рівняння, що зводяться до лінійних","status":"ready","programmeRef":"Розв'язування лінійних рівнянь.","lesson":{"what":"Деякі рівняння спершу мають дужки, дроби або змінну в обох частинах. Дозволеними перетвореннями їх можна звести до лінійного рівняння ax = b, а далі знайти x.","ideas":["Порядок дій: розкрий дужки → перенеси доданки зі змінною ліворуч, а числа праворуч → зведи подібні доданки → поділи на коефіцієнт.","Мінус перед дужками змінює знаки <b>всіх<\/b> доданків у дужках.","Переносячи доданок в іншу частину рівняння, змінюй його знак.","Якщо в рівнянні є дроби, помнож обидві частини на спільний знаменник — дробів не стане.","Наприкінці підстав корінь у <b>початкове<\/b> рівняння."],"rules":[{"f":"a(b + c) = ab + ac","means":"Розкриваємо дужки: число перед дужками множимо на кожен доданок."},{"f":"−(b − c) = −b + c","means":"Мінус перед дужками змінює знак кожного доданка в дужках."}],"example":{"task":"Розв'яжи рівняння 4(x − 3) − (x + 5) = x + 1.","steps":[{"do":"4x − 12 − x − 5 = x + 1","why":"Розкрили дужки; мінус перед другими дужками змінив знаки: −x − 5."},{"do":"3x − 17 = x + 1","why":"Звели подібні: 4x − x = 3x; −12 − 5 = −17."},{"do":"3x − x = 1 + 17","why":"Перенесли x ліворуч, а −17 праворуч, змінивши знаки."},{"do":"2x = 18, x = 9","why":"Звели подібні й поділили обидві частини на 2."},{"do":"Перевірка: 4 · (9 − 3) − (9 + 5) = 24 − 14 = 10 і 9 + 1 = 10","why":"Обидві частини рівні — корінь правильний."}],"answer":"Відповідь: x = 9."},"mistakes":["Розкриваючи −(x + 5), пишуть −x + 5. Правильно: −x − 5, бо мінус змінює знак кожного доданка.","Множать лише перший доданок: 4(x − 3) = 4x − 3. Правильно: 4x − 12.","Множачи рівняння x/2 + 3 = 5 на 2, пишуть x + 3 = 10. Правильно: множимо <b>кожен<\/b> доданок: x + 6 = 10, x = 4."],"check":[{"q":"Пастка зі знаками: розв'яжи 7 − 2(x + 1) = 3x.","a":"7 − 2x − 2 = 3x, 5 = 5x, x = 1. Перевірка: 7 − 2 · 2 = 3 = 3 · 1."},{"q":"Розв'яжи рівняння x/3 + x/2 = 10.","a":"Помножили на 6: 2x + 3x = 60, 5x = 60, x = 12."},{"q":"Тренер купив 4 однакові м'ячі по x грн і отримав знижку 150 грн на всю покупку. Він заплатив стільки ж, скільки коштують 3 м'ячі без знижки. Розв'яжи рівняння 4x − 150 = 3x.","a":"4x − 3x = 150, x = 150. Один м'яч коштує 150 грн."}]}},{"id":"A1.2.3","name":"Один корінь, безліч коренів чи жодного","status":"ready","programmeRef":"Розв'язування лінійних рівнянь.","lesson":{"what":"Лінійне рівняння ax = b може мати один корінь, безліч коренів або не мати жодного. Усе залежить від коефіцієнта a і числа b.","ideas":["a ≠ 0 — <b>один корінь<\/b> x = b : a. Наприклад, 2x = 8, x = 4.","a = 0 і b = 0 — рівняння 0 · x = 0 правильне при будь-якому x: <b>безліч коренів<\/b> (коренем є будь-яке число).","a = 0 і b ≠ 0 — рівняння, наприклад 0 · x = 5, <b>не має коренів<\/b>, бо 0 · x завжди дорівнює 0.","Якщо після спрощення змінна «зникла», подивись на числа: 0 = 0 — безліч коренів; 0 = 7 — коренів немає."],"rules":[{"f":"a ≠ 0 → один корінь x = b : a","means":"Ділимо b на коефіцієнт."},{"f":"a = 0, b = 0 → безліч коренів","means":"Підходить будь-яке число."},{"f":"a = 0, b ≠ 0 → коренів немає","means":"Жодне число не підходить."}],"example":{"task":"Розв'яжи рівняння 2(x + 3) − 5 = 2x + 1.","steps":[{"do":"2x + 6 − 5 = 2x + 1","why":"Розкрили дужки."},{"do":"2x + 1 = 2x + 1","why":"Звели числа: 6 − 5 = 1."},{"do":"2x − 2x = 1 − 1","why":"Перенесли доданки зі змінною ліворуч, числа праворуч, змінивши знаки."},{"do":"0 · x = 0","why":"a = 0 і b = 0: рівність правильна при будь-якому x."}],"answer":"Відповідь: рівняння має безліч коренів (коренем є будь-яке число)."},"mistakes":["З 0 · x = 0 пишуть «x = 0». Правильно: коренем є <b>будь-яке<\/b> число, а не лише 0.","З 0 · x = 5 пишуть x = 5 : 0. На нуль ділити не можна — рівняння не має коренів.","Плутають 0 · x = 6 (коренів немає) і 6x = 0 (один корінь x = 0)."],"check":[{"q":"Пастка: скільки коренів має рівняння 3x − 4 = 3(x − 1)?","a":"Жодного: 3x − 4 = 3x − 3, звідси 0 · x = 1."},{"q":"Скільки коренів має рівняння 5x = 0?","a":"Один: x = 0."},{"q":"У старшого брата 200 грн, у молодшого — 120 грн. Кожен щотижня відкладає ще по 50 грн. Через скільки тижнів у них буде порівну? Склади рівняння.","a":"200 + 50x = 120 + 50x, звідси 0 · x = −80 — коренів немає. Порівну не буде ніколи: різниця завжди 80 грн."}]}}]},{"id":"A1.3","name":"Задачі за допомогою рівнянь","what":"Як перетворити текстову задачу на рівняння.","subtopics":[{"id":"A1.3.1","name":"Етапи розв'язування задачі за допомогою рівняння","status":"ready","programmeRef":"Розв'язування задач за допомогою лінійних рівнянь.","lesson":{"what":"Текстову задачу можна розв'язати за допомогою рівняння. Невідоме позначаємо буквою, записуємо умову рівнянням, розв'язуємо його й пояснюємо, що означає знайдене число.","ideas":["<b>Етап 1.<\/b> Позначаємо невідому величину буквою (наприклад, x) і через неї виражаємо інші величини.","<b>Етап 2.<\/b> Складаємо рівняння за умовою задачі.","<b>Етап 3.<\/b> Розв'язуємо рівняння.","<b>Етап 4.<\/b> Перевіряємо, чи відповідає знайдене умові й чи воно розумне (кількість учнів не буває 2,5), і записуємо відповідь словами з одиницями."],"rules":[],"example":{"task":"У двох сьомих класах разом 58 учнів. У 7-А на 4 учні більше, ніж у 7-Б. Скільки учнів у кожному класі?","steps":[{"do":"Нехай у 7-Б x учнів, тоді в 7-А — (x + 4) учнів","why":"Етап 1: позначили невідоме й виразили через нього іншу величину."},{"do":"x + (x + 4) = 58","why":"Етап 2: разом у двох класах 58 учнів."},{"do":"2x = 58 − 4, 2x = 54","why":"Етап 3: звели подібні й перенесли 4 праворуч зі зміною знака."},{"do":"x = 27; x + 4 = 31","why":"Поділили на 2 і знайшли, скільки учнів у 7-А."},{"do":"Перевірка: 27 + 31 = 58 і 31 − 27 = 4","why":"Етап 4: обидві умови виконано, числа цілі — відповідь розумна."}],"answer":"Відповідь: у 7-А — 31 учень, у 7-Б — 27 учнів."},"mistakes":["Знаходять x і зупиняються. Але x — це лише учні 7-Б. Правильно: знайти й 7-А (x + 4) і відповісти на <b>всі<\/b> питання задачі.","Не записують, що позначили буквою, і потім плутаються. Правильно: завжди починай з «Нехай x — …».","Залишають нерозумну відповідь, наприклад 27,5 учня. Правильно: така відповідь означає помилку — перевір рівняння й обчислення."],"check":[{"q":"Кіт важить утричі більше, ніж кошеня, а разом вони важать 8 кг. Що позначиш буквою і яке вийде рівняння?","a":"Нехай кошеня важить x кг, тоді кіт — 3x кг. x + 3x = 8, x = 2. Кошеня — 2 кг, кіт — 6 кг."},{"q":"Пастка: у задачі про кількість хлопців у класі вийшло x = 12,5. Що це означає?","a":"Що десь помилка: хлопців не може бути 12,5. Перевір рівняння й обчислення."},{"q":"Футбольна команда набрала за сезон 31 очко. За перемогу дають 3 очки, за нічию — 1. Нічиїх було 7. Скільки було перемог?","a":"3x + 7 = 31, 3x = 24, x = 8. Відповідь: 8 перемог."}]}},{"id":"A1.3.2","name":"Складаємо рівняння за умовою задачі","status":"ready","programmeRef":"Рівняння як математична модель задачі","lesson":{"what":"Рівняння, складене за умовою задачі, — це її <b>математична модель<\/b>: запис умови мовою математики. Головне — знайти в умові дві рівні величини й записати кожну з них через x.","ideas":["«На 5 більше» → x + 5; «на 5 менше» → x − 5; «у 3 рази більше» → 3x; «у 3 рази менше» → x : 3.","«Разом», «усього» — додаємо; «на скільки більше» — віднімаємо.","Шукай у тексті, що чому <b>дорівнює<\/b>, — саме це й стає рівнянням.","За x зручно брати меншу величину — тоді в рівнянні менше віднімання й дробів.","Перед складанням рівняння переведи величини в однакові одиниці (км і м, год і хв)."],"rules":[{"f":"вартість = ціна · кількість","means":"Для задач про покупки."},{"f":"s = v · t","means":"Шлях дорівнює швидкості, помноженій на час. Для задач на рух."}],"example":{"task":"Мама купила 3 кг яблук і 2 кг груш і заплатила 230 грн. Кілограм груш на 15 грн дорожчий за кілограм яблук. Скільки коштує 1 кг яблук?","steps":[{"do":"Нехай 1 кг яблук коштує x грн, тоді 1 кг груш — (x + 15) грн","why":"«На 15 грн дорожчий» — додаємо 15."},{"do":"3x + 2(x + 15) = 230","why":"Вартість = ціна · кількість; разом заплатили 230 грн. Це модель задачі."},{"do":"5x + 30 = 230","why":"Розкрили дужки й звели подібні: 3x + 2x = 5x."},{"do":"5x = 200, x = 40","why":"Перенесли 30 праворуч зі зміною знака й поділили на 5."},{"do":"Перевірка: 3 · 40 + 2 · 55 = 120 + 110 = 230","why":"Сума збігається з умовою."}],"answer":"Відповідь: 1 кг яблук коштує 40 грн."},"mistakes":["«У 3 рази менше, ніж x» записують як x − 3. Правильно: x : 3. «У … рази» — множимо чи ділимо, «на …» — додаємо чи віднімаємо.","«У брата на 4 наліпки більше, ніж у сестри»: позначають наліпки сестри x, а брата записують x − 4. Правильно: x + 4 — у брата більше.","Додають величини в різних одиницях: 600 м + x = 1,8 км. Правильно: 1,8 км = 1800 м, тож 600 + x = 1800."],"check":[{"q":"Запиши мовою математики: «число, на 7 менше за x» і «число, у 4 рази більше за x».","a":"x − 7 і 4x."},{"q":"Пастка: периметр прямокутника 30 см, довжина на 3 см більша за ширину. Учень пише x + (x + 3) = 30. Де помилка?","a":"Периметр — сума <b>чотирьох<\/b> сторін: 2(x + x + 3) = 30, звідси x = 6. Ширина 6 см, довжина 9 см."},{"q":"Дорога до школи — 1,8 км. Іра 10 хв ішла пішки зі швидкістю 60 м/хв, а решту шляху проїхала автобусом. Склади рівняння і знайди, скільки метрів вона проїхала автобусом.","a":"60 · 10 + x = 1800, 600 + x = 1800, x = 1200. Автобусом — 1200 м."}]}},{"id":"A1.3.3","name":"Задачі з життя: покупки, бюджет, рух","status":"ready","programmeRef":"Розв'язування задач за допомогою лінійних рівнянь.","lesson":{"what":"Рівняння допомагають у житті: спланувати покупку, порахувати сімейні витрати, зрозуміти, чи безпечно переходити дорогу. Етапи ті самі: позначаємо невідоме, складаємо рівняння, розв'язуємо, перевіряємо за змістом.","ideas":["<b>Покупки:<\/b> вартість = ціна · кількість. Якщо купують кілька різних речей, їхні вартості додають.","<b>Сімейний бюджет:<\/b> якщо вже є якась сума і щомісяця відкладають однаково, то через x місяців буде «що є + щомісячна сума · x».","<b>Безпека руху:<\/b> s = v · t. Автомобіль долає кілька метрів щосекунди й не може зупинитися миттєво — тому дорогу переходимо лише на зелене світло або коли машини зупинилися.","Перевір відповідь за змістом: чи реальна ціна, час, відстань; чи треба округлити до цілого (місяців, квитків)."],"rules":[{"f":"вартість = ціна · кількість","means":"Скільки заплатимо за кілька однакових речей."},{"f":"s = v · t","means":"Шлях = швидкість · час. Одиниці мають узгоджуватися: м/с і с, км/год і год."}],"example":{"task":"Сім'я хоче купити пральну машину за 14 400 грн. Уже відкладено 3 600 грн. Скільки місяців треба відкладати по 1 800 грн, щоб вистачило на покупку?","steps":[{"do":"Нехай треба x місяців; за них відкладуть 1 800x грн","why":"Позначили невідоме буквою."},{"do":"3 600 + 1 800x = 14 400","why":"Те, що вже є, плюс нові заощадження — це ціна машини."},{"do":"1 800x = 14 400 − 3 600, 1 800x = 10 800","why":"Перенесли 3 600 праворуч зі зміною знака."},{"do":"x = 10 800 : 1 800, x = 6","why":"Поділили обидві частини на 1 800."},{"do":"Перевірка: 3 600 + 1 800 · 6 = 3 600 + 10 800 = 14 400","why":"Сума дорівнює ціні машини."}],"answer":"Відповідь: 6 місяців."},"mistakes":["Забувають те, що вже є: пишуть 1 800x = 14 400 і отримують 8 місяців. Правильно: врахувати вже відкладені 3 600 грн.","Змішують одиниці: швидкість у км/год, а час у хвилинах. Правильно: спершу переведи, наприклад 15 хв = 0,25 год.","Залишають відповідь «4,5 місяця», хоча відкладають раз на місяць. Правильно: за 4 місяці не вистачить, тож потрібно 5 місяців."],"check":[{"q":"Безпека руху: автомобіль їде зі швидкістю 15 м/с (це 54 км/год), до пішохідного переходу йому 60 м. За скільки секунд він туди доїде? Чи встигне пішохід перейти дорогу шириною 7 м зі швидкістю 1 м/с?","a":"15t = 60, t = 4 с. Пішоходу треба 7 с (7 : 1 = 7), тож він <b>не встигне<\/b>. Переходь, лише коли машина зупинилася, а на світлофорі — на зелене."},{"q":"Тато купив 2 однакові футболки й кепку за 180 грн і заплатив 760 грн. Скільки коштує одна футболка?","a":"2x + 180 = 760, 2x = 580, x = 290. Футболка коштує 290 грн."},{"q":"Пастка: Марко збирає на велосипед за 7 000 грн і відкладає по 1 500 грн щомісяця (спочатку грошей немає). Через скільки місяців він зможе купити велосипед?","a":"1 500x = 7 000, x = 7 000 : 1 500 ≈ 4,7. За 4 місяці буде лише 6 000 грн — замало, тому потрібно 5 місяців."}]}}]}]},{"id":"A2","subject":"algebra","name":"Цілі вирази","what":"Вирази з буквами, степені, одночлени й многочлени. Учимося спрощувати вирази й розкладати їх на множники.","topics":[{"id":"A2.1","name":"Вирази зі змінними","what":"Що таке вираз зі змінними, його значення і тотожні перетворення.","subtopics":[{"id":"A2.1.1","name":"Числові вирази й вирази зі змінними","status":"planned","programmeRef":"Вирази зі змінними. Цілі раціональні вирази."},{"id":"A2.1.2","name":"Тотожність і тотожні перетворення","status":"planned","programmeRef":"Тотожність. Тотожні перетворення виразу."}]},{"id":"A2.2","name":"Степінь з натуральним показником","what":"Короткий запис множення однакових множників і його властивості.","subtopics":[{"id":"A2.2.1","name":"Що таке степінь","status":"planned","programmeRef":"Степінь з натуральним показником."},{"id":"A2.2.2","name":"Властивості степеня","status":"planned","programmeRef":"Властивості степеня з натуральним показником."}]},{"id":"A2.3","name":"Одночлени","what":"Добуток чисел і букв: стандартний вигляд, множення, піднесення до степеня.","subtopics":[{"id":"A2.3.1","name":"Одночлен стандартного вигляду","status":"planned","programmeRef":"Одночлен."},{"id":"A2.3.2","name":"Множення одночленів і піднесення до степеня","status":"planned","programmeRef":"Піднесення одночленів до степеня. Множення одночленів."}]},{"id":"A2.4","name":"Многочлени і дії з ними","what":"Сума одночленів: зведення подібних, додавання, віднімання, множення.","subtopics":[{"id":"A2.4.1","name":"Многочлен і подібні члени","status":"planned","programmeRef":"Многочлен. Подібні члени многочлена та їх зведення. Степінь многочлена."},{"id":"A2.4.2","name":"Додавання і віднімання многочленів","status":"planned","programmeRef":"Додавання, віднімання і множення многочленів."},{"id":"A2.4.3","name":"Множення одночлена на многочлен","status":"planned","programmeRef":"Додавання, віднімання і множення многочленів."},{"id":"A2.4.4","name":"Множення многочлена на многочлен","status":"planned","programmeRef":"Додавання, віднімання і множення многочленів."}]},{"id":"A2.5","name":"Формули скороченого множення","what":"Готові формули, що прискорюють обчислення.","subtopics":[{"id":"A2.5.1","name":"Квадрат суми і квадрат різниці","status":"planned","programmeRef":"Формули квадрата двочлена"},{"id":"A2.5.2","name":"Різниця квадратів","status":"planned","programmeRef":"різниці квадратів"},{"id":"A2.5.3","name":"Сума і різниця кубів","status":"planned","programmeRef":"суми і різниці кубів."}]},{"id":"A2.6","name":"Розкладання многочленів на множники","what":"Як перетворити суму на добуток.","subtopics":[{"id":"A2.6.1","name":"Винесення спільного множника за дужки","status":"planned","programmeRef":"Розкладання многочленів на множники"},{"id":"A2.6.2","name":"Спосіб групування","status":"planned","programmeRef":"Розкладання многочленів на множники"},{"id":"A2.6.3","name":"Розкладання за формулами скороченого множення","status":"planned","programmeRef":"Розкладання многочленів на множники"},{"id":"A2.6.4","name":"Кілька способів разом","status":"planned","programmeRef":"Розкладання многочленів на множники"}]}]},{"id":"A3","subject":"algebra","name":"Функції","what":"Як одна величина залежить від іншої. Учимося читати й будувати графіки.","topics":[{"id":"A3.1","name":"Функція","what":"Залежність, у якій кожному значенню аргументу відповідає одне значення функції.","subtopics":[{"id":"A3.1.1","name":"Функціональна залежність","status":"planned","programmeRef":"Функціональна залежність між величинами як математична модель реальних процесів."},{"id":"A3.1.2","name":"Область визначення і область значень","status":"planned","programmeRef":"Функція. Область визначення та область значень функції."},{"id":"A3.1.3","name":"Способи задання функції","status":"planned","programmeRef":"Способи задання функції."}]},{"id":"A3.2","name":"Графік функції","what":"Як зобразити функцію на координатній площині і як читати графік.","subtopics":[{"id":"A3.2.1","name":"Графік функції","status":"planned","programmeRef":"Графік функції."}]},{"id":"A3.3","name":"Лінійна функція","what":"Функція y = kx + b, її графік — пряма.","subtopics":[{"id":"A3.3.1","name":"Лінійна функція та її графік","status":"planned","programmeRef":"Лінійна функція, її графік та властивості"},{"id":"A3.3.2","name":"Пряма пропорційність","status":"planned","programmeRef":"Лінійна функція, її графік та властивості"},{"id":"A3.3.3","name":"Властивості лінійної функції за графіком","status":"planned","programmeRef":"Лінійна функція, її графік та властивості"}]}]},{"id":"A4","subject":"algebra","name":"Системи лінійних рівнянь з двома змінними","what":"Два рівняння з двома невідомими одночасно. Три способи розв'язування і задачі.","topics":[{"id":"A4.1","name":"Рівняння з двома змінними","what":"Розв'язки рівняння з двома змінними і його графік.","subtopics":[{"id":"A4.1.1","name":"Рівняння з двома змінними і його розв'язок","status":"planned","programmeRef":"Рівняння з двома змінними. Розв'язок рівняння з двома змінними."},{"id":"A4.1.2","name":"Графік лінійного рівняння з двома змінними","status":"planned","programmeRef":"Лінійне рівняння з двома змінними та його графік."}]},{"id":"A4.2","name":"Системи двох лінійних рівнянь","what":"Що таке система, її розв'язок і способи розв'язування.","subtopics":[{"id":"A4.2.1","name":"Система і її розв'язок","status":"planned","programmeRef":"Система двох лінійних рівнянь з двома змінними та її розв'язок."},{"id":"A4.2.2","name":"Графічний спосіб","status":"planned","programmeRef":"графічним способом"},{"id":"A4.2.3","name":"Спосіб підстановки","status":"planned","programmeRef":"способом підстановки"},{"id":"A4.2.4","name":"Спосіб додавання","status":"planned","programmeRef":"способом додавання."}]},{"id":"A4.3","name":"Задачі за допомогою систем","what":"Дві невідомі величини — два рівняння.","subtopics":[{"id":"A4.3.1","name":"Складаємо систему за умовою задачі","status":"planned","programmeRef":"Розв'язування задач за допомогою систем лiнійних рівнянь."}]}]}]},{"id":"geometry","name":"Геометрія","grade":7,"tutor":"Оля","tutorCall":"Олю","icon":"📐","sections":[{"id":"G1","subject":"geometry","name":"Елементарні геометричні фігури та їх властивості","what":"Точки, прямі, відрізки, промені й кути — з них складається вся геометрія. Учимося їх вимірювати.","topics":[{"id":"G1.1","name":"Точка, пряма, відрізок, промінь","what":"Найпростіші фігури і їхні властивості.","subtopics":[{"id":"G1.1.1","name":"Геометричні фігури. Точка і пряма","status":"ready","programmeRef":"Геометричні фігури.","lesson":{"what":"Геометрія вивчає фігури. <b>Геометрична фігура<\/b> — це будь-який набір точок: точка, пряма, трикутник, коло. Найпростіші з них — <b>точка<\/b> і <b>пряма<\/b>.","ideas":["Точка не має ні довжини, ні ширини. Її моделі — слід від гострого олівця, зірка на нічному небі, місто на великій карті. Точки позначають великими латинськими літерами: A, B, C.","Пряма не має ні початку, ні кінця — вона нескінченна в обидва боки. У зошиті ми малюємо за лінійкою лише її частину. Моделі прямої — туго натягнута нитка, промінь лазерної указки.","Пряму позначають малою латинською літерою (пряма <i>a<\/i>) або двома її точками (пряма AB). Пряма AB і пряма BA — це та сама пряма.","Якщо точка лежить на прямій, кажуть, що вона <b>належить<\/b> прямій: A ∈ <i>a<\/i>. Якщо не лежить — не належить: B ∉ <i>a<\/i>.","Дві прямі, які мають спільну точку, <b>перетинаються<\/b> в цій точці."],"rules":[{"f":"Через будь-які дві точки можна провести пряму, і до того ж тільки одну.","means":"Основна властивість прямої. Дві точки повністю задають пряму — тому пряму можна назвати двома її точками."},{"f":"Яка б не була пряма, існують точки, що належать цій прямій, і точки, що їй не належать.","means":"Поруч із будь-якою прямою завжди можна позначити точку і на ній, і поза нею."},{"f":"Дві різні прямі мають не більше однієї спільної точки.","means":"Якби спільних точок було дві, то через них проходили б дві різні прямі, а так не буває (див. основну властивість)."}],"example":{"task":"Позначте в зошиті чотири точки A, B, C, D так, щоб жодні три з них не лежали на одній прямій. Скільки різних прямих можна провести через кожні дві з цих точок?","steps":[{"do":"Малюємо: чотири точки, наче кути неправильного чотирикутника. Дано: 4 точки, жодні три не на одній прямій. Знайти: кількість прямих.","why":"Спершу малюнок — так легше нічого не пропустити."},{"do":"Через точку A проводимо прямі до кожної з інших: AB, AC, AD — 3 прямі.","why":"Через дві точки проходить одна пряма, і тільки одна."},{"do":"Через точку B — нові прямі BC і BD (пряму BA вже порахували) — 2 прямі. Через C — нова пряма CD — 1 пряма.","why":"Пряма AB і пряма BA — та сама пряма, рахувати її двічі не можна."},{"do":"Разом: 3 + 2 + 1 = 6.","why":"Жодні три точки не на одній прямій, тому всі ці прямі різні."}],"answer":"Відповідь: 6 прямих (AB, AC, AD, BC, BD, CD)."},"mistakes":["Вважати, що в прямої є кінці або довжина. Пряма нескінченна; кінці є у відрізка.","Рахувати пряму AB і пряму BA як дві різні прямі.","Думати, що через будь-які три точки можна провести одну пряму. Це так лише тоді, коли точки лежать на одній прямій."],"check":[{"q":"<b>Пастка.<\/b> Через три точки завжди проходить одна пряма?","a":"Ні. Лише якщо вони лежать на одній прямій. Інакше через кожні дві точки — своя пряма, разом 3 прямі."},{"q":"Садівник хоче посадити цибулю рівним рядком. Скільки кілочків йому треба, щоб натягнути між ними мотузку? Чому?","a":"Два, бо через дві точки проходить пряма, і тільки одна."},{"q":"Прямі <i>a<\/i> і <i>b<\/i> перетинаються. Скільки в них спільних точок?","a":"Одна."}]}},{"id":"G1.1.2","name":"Відрізок і промінь","status":"ready","programmeRef":"Точка, пряма, відрізок, промінь, кут. Їх властивості.","lesson":{"what":"<b>Відрізок<\/b> AB — частина прямої між точками A і B разом із цими точками; A і B — його <b>кінці<\/b>. <b>Промінь<\/b> — частина прямої, що має початок, але не має кінця: точка і всі точки прямої по один бік від неї.","ideas":["Порівняйте: у відрізка два кінці, у променя — лише початок, у прямої — ні початку, ні кінця.","«Точка C <b>лежить між<\/b> точками A і B» означає: C лежить на відрізку AB і не збігається з його кінцями.","Промінь називають двома літерами, і першою завжди пишуть початок: промінь OA починається в точці O і йде через точку A. Промінь AO — це вже інший промінь.","Точка O на прямій ділить її на два промені з початком O, які йдуть у протилежні боки. Їх називають <b>доповняльними<\/b>: разом вони складають усю пряму.","Моделі: край лінійки чи натягнута струна — відрізок; світло від ліхтарика — промінь (є початок, а далі воно йде в один бік)."],"rules":[{"f":"З трьох точок на прямій одна і тільки одна лежить між двома іншими.","means":"Основна властивість розміщення точок на прямій: якщо три точки на одній прямій, то рівно одна з них — «посередині»."},{"f":"Промінь OA: O — початок, A — будь-яка інша точка променя.","means":"Якщо на промені OA лежить ще точка B, то промінь OB — той самий промінь, що й OA."}],"example":{"task":"Накресліть пряму і позначте на ній точки M, K, P так, щоб точка K лежала між M і P. Скільки утворилося відрізків з кінцями в цих точках і скільки променів з початками в цих точках?","steps":[{"do":"Малюємо пряму, на ній зліва направо точки M, K, P.","why":"K лежить між M і P, тому вона посередині."},{"do":"Відрізки: MK, KP, MP — 3 відрізки.","why":"Відрізок задають два кінці, а пар точок тут три."},{"do":"Кожна точка ділить пряму на два доповняльні промені: у M — 2, у K — 2, у P — 2. Разом 2 + 2 + 2 = 6.","why":"Точка на прямій ділить її рівно на два промені."},{"do":"Зауважимо: промінь MK і промінь MP — той самий промінь (обидва починаються в M і йдуть праворуч). Тому рахуємо його один раз.","why":"Промінь визначають початок і напрям; точка P лежить на промені MK."}],"answer":"Відповідь: 3 відрізки і 6 променів."},"mistakes":["Плутати промінь OA і промінь AO. Першою літерою завжди пишуть початок.","Вважати промені MK і MP різними, хоча P лежить на промені MK — це той самий промінь.","Плутати відрізок, промінь і пряму на малюнку: відрізок малюють з двома позначеними кінцями, промінь — з одним, пряму — без кінців."],"check":[{"q":"<b>Пастка.<\/b> Що довше: промінь OA чи відрізок OA?","a":"Порівнювати не можна: промінь нескінченний, у нього немає довжини. Довжину має лише відрізок."},{"q":"Світло від ліхтарика в темряві — це модель відрізка, променя чи прямої?","a":"Променя: є початок (ліхтарик), а далі світло йде в один бік."},{"q":"Точки A, B, C лежать на прямій, B лежить між A і C. Чи належить точка C променю AB?","a":"Так: промінь AB іде від A через B і далі, а C лежить за B."}]}}]},{"id":"G1.2","name":"Кут","what":"Кут, його види і бісектриса.","subtopics":[{"id":"G1.2.1","name":"Кут і види кутів","status":"ready","programmeRef":"Точка, пряма, відрізок, промінь, кут. Їх властивості.","lesson":{"what":"<b>Кут<\/b> — фігура з двох променів зі спільним початком. Промені — це <b>сторони<\/b> кута, а їхній спільний початок — <b>вершина<\/b>.","ideas":["Кут позначають трьома літерами, вершина — завжди посередині: ∠ABC (вершина B). ∠ABC і ∠CBA — той самий кут, а ∠BAC — зовсім інший. Якщо зрозуміло, можна коротко: ∠B.","Кут, сторони якого — доповняльні промені (разом утворюють пряму), називають <b>розгорнутим<\/b>. Він дорівнює 180°.","Види кутів: <b>гострий<\/b> — менший за 90°; <b>прямий<\/b> — 90°; <b>тупий<\/b> — більший за 90°, але менший за 180°; <b>розгорнутий<\/b> — 180°.","Прямий кут на малюнку позначають маленьким квадратиком біля вершини.","Розмір кута не залежить від того, наскільки довгими намальовано його сторони. Моделі кута — стрілки годинника, розкриті ножиці, відчинені двері."],"rules":[{"f":"гострий: менше 90°; прямий: 90°; тупий: від 90° до 180° (не включно); розгорнутий: 180°","means":"Вид кута визначають за його градусною мірою."}],"example":{"task":"Які кути утворюють годинна і хвилинна стрілки о 2:00, 3:00, 5:00 і 6:00? Назвіть вид кожного кута. Намалюйте в зошиті циферблат із цими положеннями стрілок.","steps":[{"do":"Малюємо циферблат. Повне коло — 360°, на ньому 12 поділок-годин. Одна поділка: 360° : 12 = 30°.","why":"Цифри на циферблаті розміщені через рівні проміжки."},{"do":"О цілій годині хвилинна стрілка на 12, а годинна — точно на числі годин. О 2:00 між ними 2 поділки: 2 · 30° = 60°; о 3:00 — 3 · 30° = 90°.","why":"Кут дорівнює кількості поділок між стрілками, помноженій на 30°."},{"do":"О 5:00: 5 · 30° = 150°; о 6:00: 6 · 30° = 180° — стрілки утворюють пряму.","why":"Той самий підрахунок поділок."},{"do":"Класифікуємо: 60° — гострий; 90° — прямий; 150° — тупий; 180° — розгорнутий.","why":"Порівнюємо з 90° і 180°."}],"answer":"Відповідь: о 2:00 — 60° (гострий), о 3:00 — 90° (прямий), о 5:00 — 150° (тупий), о 6:00 — 180° (розгорнутий)."},"mistakes":["Ставити вершину не посередині назви: для кута з вершиною B писати ∠BAC замість ∠ABC.","Думати, що кут стане більшим, якщо подовжити його сторони. Розмір кута від довжини сторін не залежить.","Плутати прямий кут (90°) з розгорнутим (180°). «Прямий» — не тому, що схожий на пряму!"],"check":[{"q":"<b>Пастка.<\/b> Учень подовжив сторони кута вдвічі. Чи змінився кут?","a":"Ні. Кут залежить від того, наскільки «розходяться» сторони, а не від їхньої довжини."},{"q":"Двері відчинили так, що між дверима і стіною кут 120°. Який це вид кута?","a":"Тупий (більший за 90°, менший за 180°)."},{"q":"З вершини O проведено промені OA, OB, OC, причому OB лежить між OA і OC. Скільки кутів на малюнку? Назвіть їх.","a":"Три: ∠AOB, ∠BOC, ∠AOC."}]}},{"id":"G1.2.2","name":"Бісектриса кута","status":"ready","programmeRef":"Бісектриса кута.","lesson":{"what":"<b>Бісектриса кута<\/b> — промінь з початком у вершині кута, який проходить між його сторонами і ділить кут навпіл, тобто на два рівні кути.","ideas":["<b>Рівні кути<\/b> — кути з однаковою градусною мірою.","Якщо OK — бісектриса ∠AOB, то ∠AOK = ∠KOB, і кожен з них — половина ∠AOB.","У кожного кута є бісектриса, і тільки одна.","Бісектриса розгорнутого кута утворює з його сторонами два прямі кути: 180° : 2 = 90°.","Як знайти бісектрису: виміряти кут транспортиром, поділити на 2 і відкласти половину від однієї сторони. Або вирізати кут з паперу й перегнути так, щоб сторони збіглися: лінія згину — бісектриса."],"rules":[{"f":"OK — бісектриса ∠AOB ⇒ ∠AOK = ∠KOB = ∠AOB : 2","means":"Щоб знайти половинку, ділимо весь кут на 2."},{"f":"∠AOB = 2 · ∠AOK","means":"Щоб знайти весь кут за половинкою, множимо на 2."}],"example":{"task":"∠AOB = 140°. Промінь OK — бісектриса ∠AOB, промінь OM — бісектриса ∠AOK. Знайдіть ∠MOB. Накресліть у зошиті: кут AOB, всередині промінь OK, а між OA і OK — промінь OM.","steps":[{"do":"Дано: ∠AOB = 140°, OK — бісектриса ∠AOB, OM — бісектриса ∠AOK. Знайти: ∠MOB.","why":"Записуємо умову, щоб бачити, що відомо."},{"do":"∠AOK = ∠KOB = 140° : 2 = 70°.","why":"Бо бісектриса ділить кут навпіл."},{"do":"∠MOK = 70° : 2 = 35°.","why":"Бо OM — бісектриса ∠AOK."},{"do":"∠MOB = ∠MOK + ∠KOB = 35° + 70° = 105°.","why":"Бо промінь OK проходить між сторонами ∠MOB, а кут дорівнює сумі кутів, на які його ділить такий промінь."}],"answer":"Відповідь: ∠MOB = 105°."},"mistakes":["Множити замість ділити: шукаючи половину кута, писати 2 · ∠AOB.","Вважати бісектрисою будь-який промінь між сторонами кута. Бісектриса ділить кут саме на два <b>рівні<\/b> кути.","Шукати бісектрису «на око». Перевіряйте транспортиром: обидва утворені кути мають бути однакові."],"check":[{"q":"<b>Пастка.<\/b> Бісектриса гострого кута утворює з його стороною кут 50°. Чи можливо таке?","a":"Ні: тоді весь кут 2 · 50° = 100°, а це тупий кут, не гострий."},{"q":"Бісектриса ділить кут на два кути по 45°. Який це кут?","a":"2 · 45° = 90°, прямий."},{"q":"Як знайти бісектрису кута, вирізаного з паперу, без транспортира?","a":"Перегнути аркуш через вершину так, щоб сторони кута збіглися. Лінія згину — бісектриса."}]}}]},{"id":"G1.3","name":"Вимірювання відрізків і кутів","what":"Довжина відрізка, відстань між точками, градусна міра кута.","subtopics":[{"id":"G1.3.1","name":"Вимірювання відрізків. Відстань між двома точками","status":"ready","programmeRef":"Вимірювання відрізків і кутів.","lesson":{"what":"Виміряти відрізок — дізнатися, скільки разів у ньому вміщується одиниця довжини (1 мм, 1 см, 1 м). Отримане число — <b>довжина відрізка<\/b>: AB = 5 см. <b>Відстань між точками<\/b> A і B — це довжина відрізка AB.","ideas":["Кожний відрізок має довжину, більшу за нуль.","<b>Рівні відрізки<\/b> — відрізки однакової довжини. На малюнку їх позначають однаковою кількістю рисочок.","Якщо точка C лежить між A і B, то вона ділить відрізок AB на дві частини, і AB = AC + CB.","Якщо невідомо, яка з трьох точок лежить між іншими, треба розглянути всі можливі випадки — відповідей може бути дві.","Перед додаванням довжин переведіть їх в однакові одиниці: 1 см = 10 мм, 1 м = 100 см, 1 км = 1000 м."],"rules":[{"f":"AB = AC + CB, якщо точка C лежить між A і B","means":"Довжина відрізка дорівнює сумі довжин частин, на які його ділить будь-яка його точка."},{"f":"На будь-якому промені від його початку можна відкласти відрізок заданої довжини, і до того ж тільки один.","means":"Так ми будуємо відрізок потрібної довжини: від початку променя відміряємо лінійкою, скільки треба."}],"example":{"task":"Точки A, B, C лежать на одній прямій, AB = 8 см, BC = 3 см. Знайдіть AC. Розгляньте всі можливі випадки і для кожного зробіть окремий малюнок у зошиті.","steps":[{"do":"Дано: A, B, C на одній прямій, AB = 8 см, BC = 3 см. Знайти: AC. Невідомо, яка точка лежить між двома іншими, тому розглядаємо три випадки.","why":"З трьох точок на прямій одна і тільки одна лежить між двома іншими."},{"do":"Випадок 1: C між A і B. Тоді AB = AC + CB, тобто 8 = AC + 3, AC = 8 − 3 = 5 (см).","why":"Довжина відрізка дорівнює сумі довжин його частин."},{"do":"Випадок 2: B між A і C. Тоді AC = AB + BC = 8 + 3 = 11 (см).","why":"Та сама властивість: AC складається з частин AB і BC."},{"do":"Випадок 3: A між B і C. Тоді BC = BA + AC, тобто 3 = 8 + AC — неможливо, бо частина не може бути довшою за весь відрізок.","why":"Довжина відрізка AC має бути більшою за нуль."}],"answer":"Відповідь: AC = 5 см (якщо C лежить між A і B) або AC = 11 см (якщо B лежить між A і C)."},"mistakes":["Розглядати лише один випадок і завжди додавати. Якщо точка лежить не між іншими, відстань може бути різницею.","Додавати довжини в різних одиницях (наприклад, 3 см + 5 мм = 8). Спершу переведіть: 30 мм + 5 мм = 35 мм.","Прикладати лінійку не від нуля, а від її краю."],"check":[{"q":"<b>Пастка.<\/b> Точки K, L, M лежать на прямій; KL = 4 см, LM = 6 см, KM = 10 см. Яка точка лежить між двома іншими?","a":"L, бо KL + LM = 4 + 6 = 10 = KM."},{"q":"Дім, магазин і школа стоять уздовж прямої дороги, магазин — між домом і школою. Від дому до школи 1,2 км, від дому до магазину 0,5 км. Яка відстань від магазину до школи?","a":"1,2 − 0,5 = 0,7 км."},{"q":"Точка C лежить на відрізку AB = 12 см, причому AC удвічі довший за CB. Знайдіть AC і CB.","a":"CB = 12 : 3 = 4 см, AC = 8 см."}]}},{"id":"G1.3.2","name":"Вимірювання кутів","status":"ready","programmeRef":"Вимірювання відрізків і кутів.","lesson":{"what":"Кути вимірюють у <b>градусах<\/b> за допомогою <b>транспортира<\/b>. 1° — це 1/180 частина розгорнутого кута. Скільки градусів уміщується в куті — це його <b>градусна міра<\/b>.","ideas":["Кожний кут має градусну міру, більшу за 0°. Розгорнутий кут дорівнює 180°.","Як міряти: центр транспортира — у вершину кута; нульова позначка шкали — на одній стороні; число читаємо там, де шкалу перетинає друга сторона, <b>на тій самій шкалі<\/b>, що починається з нуля.","На транспортирі дві шкали (зовнішня і внутрішня). Звіряйтеся з видом кута: гострий кут не може мати 140°.","Якщо промінь OC проходить між сторонами ∠AOB, то ∠AOB = ∠AOC + ∠COB.","Від будь-якого променя в заданий бік від нього можна відкласти кут заданої градусної міри, меншої за 180°, і тільки один."],"rules":[{"f":"∠AOB = ∠AOC + ∠COB, якщо промінь OC проходить між сторонами ∠AOB","means":"Градусна міра кута дорівнює сумі градусних мір кутів, на які його ділить промінь, що проходить між сторонами."},{"f":"Розгорнутий кут = 180°","means":"1° — це 1/180 частина розгорнутого кута."}],"example":{"task":"∠AOB = 80°, ∠BOC = 30°. Знайдіть ∠AOC. Розгляньте всі можливі випадки і накресліть у зошиті кожен.","steps":[{"do":"Дано: ∠AOB = 80°, ∠BOC = 30°. Знайти: ∠AOC. Невідомо, як розміщені промені, тому розглядаємо випадки.","why":"Промінь OC може лежати всередині ∠AOB або поза ним."},{"do":"Випадок 1: OC проходить між сторонами ∠AOB. Тоді ∠AOB = ∠AOC + ∠COB: 80° = ∠AOC + 30°, ∠AOC = 80° − 30° = 50°.","why":"Кут дорівнює сумі кутів, на які його ділить промінь між сторонами."},{"do":"Випадок 2: OB проходить між сторонами ∠AOC. Тоді ∠AOC = ∠AOB + ∠BOC = 80° + 30° = 110°.","why":"Та сама властивість для кута AOC."},{"do":"Випадок 3: OA між сторонами ∠BOC. Тоді 30° = 80° + ∠AOC — неможливо.","why":"Частина кута не може бути більшою за весь кут."}],"answer":"Відповідь: ∠AOC = 50° (якщо OC між OA і OB) або ∠AOC = 110° (якщо OB між OA і OC)."},"mistakes":["Читати число не з тієї шкали транспортира (140° замість 40°). Перевіряйте: гострий кут менший за 90°.","Ставити центр транспортира не у вершину кута або не суміщати нуль шкали зі стороною.","Розглядати лише один випадок розміщення променів, коли в задачі немає малюнка."],"check":[{"q":"<b>Пастка.<\/b> Учень виміряв гострий кут і отримав 130°. Що він зробив не так і яка правильна відповідь?","a":"Прочитав іншу шкалу. Правильно: 180° − 130° = 50°."},{"q":"Який кут утворюють стрілки годинника о 4:00?","a":"4 · 30° = 120°."},{"q":"Промінь OC проходить між сторонами ∠AOB = 120°, а ∠AOC на 40° більший за ∠COB. Знайдіть ці кути.","a":"∠COB = (120° − 40°) : 2 = 40°, ∠AOC = 80°."}]}}]}]},{"id":"G2","subject":"geometry","name":"Взаємне розміщення прямих на площині","what":"Як прямі можуть розташовуватися одна щодо одної: перетинатися, бути перпендикулярними чи паралельними.","topics":[{"id":"G2.1","name":"Суміжні та вертикальні кути","what":"Кути, що утворюються, коли прямі перетинаються.","subtopics":[{"id":"G2.1.1","name":"Суміжні кути","status":"planned","programmeRef":"Суміжні та вертикальні кути, їх властивості."},{"id":"G2.1.2","name":"Вертикальні кути","status":"planned","programmeRef":"Суміжні та вертикальні кути, їх властивості."}]},{"id":"G2.2","name":"Перпендикулярні й паралельні прямі","what":"Перпендикуляр, відстань від точки до прямої, паралельність.","subtopics":[{"id":"G2.2.1","name":"Перпендикулярні прямі. Відстань від точки до прямої","status":"planned","programmeR // Змінюй, коли змінюється сторінка або уроки, щоб репетитор знав, що опубліковану копію учня треба оновити.
const MAP_VERSION = "2026-10-14b";
const DATA = (typeof CONTENT !== "undefined" && CONTENT && Array.isArray(CONTENT.subjects)) ? CONTENT : { subjects: [] };

/* ---------- Покажчики ---------- */
const SUBJ = {}, SEC = {}, TOP = {}, SUB = {};
DATA.subjects.forEach((s, si) => {
  s.color = `var(--s${(si % 4) + 1})`;
  s.sections = Array.isArray(s.sections) ? s.sections : [];
  s.subs = [];
  SUBJ[s.id] = s;
  s.sections.forEach(sec => {
    sec.subject = s; SEC[sec.id] = sec; sec.subs = [];
    (sec.topics || []).forEach(t => {
      t.section = sec; t.subject = s; TOP[t.id] = t;
      t.subtopics = t.subtopics || [];
      t.subtopics.forEach(st => {
        st.topic = t; st.section = sec; st.subject = s; SUB[st.id] = st;
        st.ready = st.status === "ready" && !!st.lesson;
        st.checks = st.ready ? (st.lesson.check || []).map((c, i) => ({ id: `${st.id}-${i + 1}`, q: c.q, a: c.a })) : [];
        sec.subs.push(st); s.subs.push(st);
      });
    });
  });
});

/* ---------- Сховище ---------- */
const LS_PROGRESS = "school-map:progress", LS_UI = "school-map:ui";
function lsGet(k) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
const clone = o => JSON.parse(JSON.stringify(o == null ? {} : o));
const isObj = v => !!v && typeof v === "object" && !Array.isArray(v);
function deepMerge(into, patch) {
  Object.keys(patch || {}).forEach(k => { if (isObj(patch[k])) into[k] = deepMerge(isObj(into[k]) ? into[k] : {}, patch[k]); else into[k] = patch[k]; });
  return into;
}
function normProgress(d) { d = isObj(d) ? d : {}; return { read: isObj(d.read) ? d.read : {}, checks: isObj(d.checks) ? d.checks : {}, updatedAt: d.updatedAt || null }; }

let progress = normProgress(lsGet(LS_PROGRESS));
let practice = {};                   // learner/practice → subtopics
let plan = { name: "", current: null, next: [] }; // learner/plan
let db = null, dbState = "local";    // local | live | readonly
let remoteExists = false, remoteBase = null;
let pending = null, inflight = null, writing = false;

/* Запис лише після дії учня, по одному за раз: зміни, що прийшли під час запису, чекають і йдуть одним наступним записом. */
function record(patch) {
  const now = new Date().toISOString();
  deepMerge(progress, patch);
  progress.updatedAt = now;
  lsSet(LS_PROGRESS, progress);
  if (!db || dbState !== "live") return;
  pending = deepMerge(pending || {}, patch);
  pump();
}
async function pump() {
  if (writing || !pending || !db) return;
  writing = true; inflight = pending; pending = null;
  const stamp = { updatedAt: new Date().toISOString(), mapVersion: MAP_VERSION };
  const ref = db.doc("learner/progress");
  const whole = () => ref.set(Object.assign(clone({ read: progress.read, checks: progress.checks }), stamp));
  try {
    if (!remoteExists) { await whole(); remoteExists = true; }
    else {
      try { await ref.update(Object.assign(clone(inflight), stamp)); }
      catch (e) {
        if (e && e.code === "invalid_argument") { await whole(); remoteExists = true; } // документ могли видалити
        else if (e && e.code === "unavailable") { await new Promise(r => setTimeout(r, 600 + Math.random() * 900)); await ref.update(Object.assign(clone(inflight), stamp)); }
        else throw e;
      }
    }
  } catch (e) {
    if (e && (e.code === "invalid_argument" || e.code === "revoked" || e.code === "not_granted")) { dbState = "readonly"; pending = null; paintStatus(); }
  } finally {
    inflight = null; writing = false;
    if (pending) pump();
  }
}
function applyRemoteProgress(d) {
  remoteBase = normProgress(clone(d));
  const merged = normProgress(clone(remoteBase));
  if (inflight) deepMerge(merged, inflight);
  if (pending) deepMerge(merged, pending);
  const changed = JSON.stringify([merged.read, merged.checks]) !== JSON.stringify([progress.read, progress.checks]);
  progress = merged;
  lsSet(LS_PROGRESS, progress);
  return changed;
}

/* ---------- Підрахунки ---------- */
function practiceOf(id) { const p = practice[id]; return p && +p.answered > 0 ? { answered: +p.answered, correct: +p.correct || 0, last: p.last || "" } : null; }
function isMastered(p) { return !!p && p.answered >= 3 && p.correct / p.answered >= 0.8; }
function checkCount(st) { const know = st.checks.filter(c => progress.checks[c.id] === "know").length; return { know, total: st.checks.length }; }
function statusOf(st) {
  if (!st.ready) return "planned";
  if (isMastered(practiceOf(st.id))) return "mastered";
  const c = checkCount(st);
  if (c.total && c.know === c.total) return "checked";
  if (progress.read[st.id]) return "read";
  return "new";
}
const STATUS = {
  planned: ["урок готується", "st-planned"],
  mastered: ["опановано на практиці", "st-mastered"],
  checked: ["самоперевірка пройдена", "st-checked"],
  read: ["прочитано", "st-read"],
  new: ["ще не відкрито", "st-new"]
};
// Бал підтеми: прочитано, самоперевірка, практика — по третині; «опановано» = 100 %.
function scoreOf(st) {
  const p = practiceOf(st.id);
  if (isMastered(p)) return 1;
  const c = checkCount(st);
  const prac = p ? Math.min(1, p.answered / 3) * Math.min(1, (p.correct / p.answered) / 0.8) : 0;
  return ((progress.read[st.id] ? 1 : 0) + (c.total ? c.know / c.total : 0) + prac) / 3;
}
function agg(subs) {
  const ready = subs.filter(s => s.ready);
  const pct = ready.length ? Math.round(ready.reduce((a, s) => a + scoreOf(s), 0) / ready.length * 100) : null;
  return { all: subs.length, ready: ready.length, pct,
    read: ready.filter(s => progress.read[s.id]).length,
    mastered: ready.filter(s => isMastered(practiceOf(s.id))).length };
}
const topicSubs = t => t.subtopics;

/* ---------- Допоміжне ---------- */
function esc(s) { return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
// У текстах уроків дозволено лише <b>, <i>, <sub>, <sup>; усе інше екранується.
function rich(s) { return esc(s).replace(/&lt;(\/?)(b|i|sub|sup)&gt;/g, "<$1$2>"); }
function plain(s) { return String(s == null ? "" : s).replace(/<\/?(b|i|sub|sup)>/g, ""); }
function plural(n, f) { const a = Math.abs(n) % 100, b = a % 10; return a > 10 && a < 20 ? f[2] : b === 1 ? f[0] : b >= 2 && b <= 4 ? f[1] : f[2]; }
function fmtDate(iso) {
  if (!iso) return "";
  const d = new Date(String(iso).length === 10 ? iso + "T12:00:00" : iso);
  if (isNaN(d)) return String(iso);
  try { return d.toLocaleDateString("uk-UA", { day: "numeric", month: "long", year: "numeric" }).replace(/\s*р\.$/, ""); } catch (e) { return String(iso).slice(0, 10); }
}
function ring(pct, size, color, big) {
  const sw = big ? 7 : 6, r = (size - sw) / 2, c = 2 * Math.PI * r, cx = size / 2;
  const v = pct == null ? 0 : Math.max(0, Math.min(100, pct));
  return `<svg class="ring${big ? " big" : ""}" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true" style="--ring-c:${color}">`
    + `<circle class="trk" cx="${cx}" cy="${cx}" r="${r}" stroke-width="${sw}"/>`
    + (v > 0 ? `<circle class="val" cx="${cx}" cy="${cx}" r="${r}" stroke-width="${sw}" stroke-dasharray="${(c * v / 100).toFixed(2)} ${c.toFixed(2)}" transform="rotate(-90 ${cx} ${cx})"/>` : "")
    + `<text x="${cx}" y="${cx}">${pct == null ? "—" : pct + "%"}</text></svg>`;
}
function bar(pct, color) { return `<span class="bar" aria-hidden="true"><i style="width:${pct || 0}%;${color ? `--bar-c:${color}` : ""}"></i></span>`; }

const ui = {

  revealed: {},        // які відповіді самоперевірки відкрито

function saveUi() { lsSet(LS_UI, { subject: ui.subject, open: [...ui.open], openTouched: ui.openTouched }); }
function autoOpen() {
  // Поки учень сам нічого не розгортав: розгорнути тему «Зараз у школі» (або перший розділ).
  if (ui.openTouched) return;
  const cur = plan.current && TOP[plan.current.topic];
  if (cur && cur.subject.id === ui.subject) { ui.open.add(cur.section.id); ui.open.add(cur.id); return; }
  const s = SUBJ[ui.subject];
  if (s && s.sections[0] && !s.sections.some(x => ui.open.has(x.id))) ui.open.add(s.sections[0].id);
}

/* ---------- Шапка ---------- */
const $ = id => document.getElementById(id);

function paintStatus() {

    : dbState === "readonly" ? "Цю карту відкрито лише для перегляду: позначки зберігаються тільки в цьому браузері."

/* ---------- Карта предмета ---------- */
function emptyHtml(title, text) {
  return `<div class="card empty"><div class="big" aria-hidden="true">🌱</div><h2>${title}</h2><p>${text}</p></div>`;
}
function subjectHtml(s) {
  if (!s.sections.length) return emptyHtml("Карта ще наповнюється…", `Уроки з предмета «${esc(s.name)}» скоро з'являться. А поки можна просто поговорити з репетитором: напиши «Привіт, ${esc(s.tutorCall || s.tutor || "")}».`);
  const a = agg(s.subs);
  const cur = plan.current && plan.current.subject === s.id ? TOP[plan.current.topic] : null;
  const next = (plan.next || []).map(id => SUB[id]).filter(st => st && st.subject.id === s.id);
  let hints = "";
  if (cur || next.length) {
    hints = `<div class="hints">`
      + (cur ? `<div class="hint now"><span class="lbl">📍 Зараз у школі:</span><span>${rich(cur.name)}</span><button class="chip now" type="button" data-act="goto-topic" data-id="${cur.id}" data-k="goto-${cur.id}">Показати на карті</button></div>` : "")
      + (next.length ? `<div class="hint next"><span class="lbl">➜ Наступний крок:</span>${next.map(st => `<button class="chip next" type="button" data-act="open" data-id="${st.id}" data-k="nx-${st.id}">${rich(st.name)}</button>`).join("")}</div>` : "")
      + `</div>`;
  }
  return `<section class="card intro" aria-label="Огляд предмета">
      ${ring(a.pct, 76, s.color, true)}

      <p class="sub-line">${s.tutor ? `Репетитор: ${esc(s.tutor)} · ` : ""}готових уроків ${a.ready} з ${a.all} · прочитано ${a.read}${a.mastered ? ` · опановано ${a.mastered}` : ""}</p></div>
    </section>
    ${hints}
    <div class="legend" aria-label="Умовні позначення">
      <span><span class="pill st-read">прочитано</span></span>
      <span><span class="pill st-checked">самоперевірка пройдена</span></span>
      <span><span class="pill st-mastered">опановано на практиці</span></span>
      <span><span class="pill st-planned">урок готується</span></span>
    </div>
    <ol class="tree">${s.sections.map(sec => sectionHtml(sec, cur)).join("")}</ol>`;
}
function sectionHtml(sec, cur) {
  const open = ui.open.has(sec.id), a = agg(sec.subs);
  return `<li class="sec"><h2><button class="sec-head" type="button" aria-expanded="${open}" aria-controls="b-${sec.id}" data-act="toggle" data-id="${sec.id}" data-k="h-${sec.id}">
      ${ring(a.pct, 52, sec.subject.color)}
      <span><span class="code">${esc(sec.id)}</span> <span class="nm">${rich(sec.name)}</span>
      <span class="meta">${sec.topics.length} ${plural(sec.topics.length, ["тема", "теми", "тем"])} · готових уроків ${a.ready} з ${a.all}${a.read ? ` · прочитано ${a.read}` : ""}${cur && cur.section === sec ? " · 📍 зараз у школі" : ""}</span></span>
      <span class="chev" aria-hidden="true">▶</span></button></h2>
    <div class="sec-body" id="b-${sec.id}"${open ? "" : " hidden"}>
      ${sec.what ? `<p class="what">${rich(sec.what)}</p>` : ""}

}
function topicHtml(t, cur) {
  const open = ui.open.has(t.id), a = agg(topicSubs(t)), isNow = cur === t;
  return `<li class="topic${isNow ? " now" : ""}" id="topic-${t.id}"><h3><button class="topic-head" type="button" aria-expanded="${open}" aria-controls="b-${t.id}" data-act="toggle" data-id="${t.id}" data-k="h-${t.id}">

      <span class="chev" aria-hidden="true">▶</span>
      <span class="t2">${a.ready ? bar(a.pct, t.subject.color) : `<span>уроки готуються</span>`}<span>${a.ready ? `${a.pct}% · ` : ""}${a.all} ${plural(a.all, ["підтема", "підтеми", "підтем"])}</span></span>
    </button></h3>

function subRowHtml(st) {
  const s = statusOf(st), p = practiceOf(st.id), isNext = (plan.next || []).includes(st.id);
  const tags = `<span class="tags">${isNext ? `<span class="badge next">Наступний крок</span>` : ""}${s !== "new" ? `<span class="pill ${STATUS[s][1]}">${STATUS[s][0]}</span>` : ""}${p && st.ready ? `<span class="pill prac" title="Задачі з репетитором: правильно ${p.correct} з ${p.answered}">✓ ${p.correct}/${p.answered}</span>` : ""}</span>`;
  const label = `<span><span class="code">${esc(st.id)}</span> <span class="nm">${rich(st.name)}</span></span>`;

  return `<li><button class="sub${isNext ? " is-next" : ""}" type="button" data-act="open" data-id="${st.id}" data-k="s-${st.id}" aria-label="${esc(plain(st.name))}, урок. ${STATUS[s][0]}${isNext ? ", наступний крок" : ""}">${label}${tags}</button></li>`;
}

/* ---------- Урок ---------- */
function lessonHtml(st) {
  const L = st.lesson, s = st.subject, stt = statusOf(st), p = practiceOf(st.id);
  const shown = ui.steps[st.id] || 0, steps = (L.example && L.example.steps) || [];
