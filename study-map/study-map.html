<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Моя карта навчання</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Карта навчання для 7 класу: предмет → розділ → тема → підтема → урок.
   Шрифти з Google Fonts мають кирилицю; без мережі сторінка бере системні шрифти. */
:root {
  --bg: #f6f4ee;
  --surface: #ffffff;
  --surface-2: #f1eee6;
  --ink: #1f2933;
  --ink-soft: #55606b;
  --line: #d8d3c7;
  --track: #e6e1d6;
  --accent: #19717f;
  --accent-ink: #ffffff;
  --accent-soft: #dcefF1;
  --focus: #2457d6;
  --good: #2e7a4c;
  --good-soft: #def0e4;
  --mid: #9a6400;
  --mid-soft: #f7ead2;
  --bad: #b0413b;
  --bad-soft: #f6dfdd;
  --now: #b4530e;
  --now-soft: #fbe7d6;
  --next: #6247c8;
  --next-soft: #e9e4fb;
  --planned: #8b9097;
  --s1: #19717f; --s2: #6247c8; --s3: #b4530e; --s4: #2e7a4c;
  --shadow: 0 1px 2px rgba(31, 41, 51, .06), 0 4px 14px rgba(31, 41, 51, .06);
  --font-body: "Nunito", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14171d; --surface: #1c2028; --surface-2: #232833; --ink: #e9ebef; --ink-soft: #a9b0bc;
    --line: #363d4a; --track: #2c323e; --accent: #4fc0cf; --accent-ink: #0d2226; --accent-soft: #1d3a40;
    --focus: #8aaeff; --good: #6cc792; --good-soft: #1e3628; --mid: #e6b45c; --mid-soft: #3a2f1a;
    --bad: #f08a83; --bad-soft: #3d2423; --now: #f0a064; --now-soft: #3e2a1b; --next: #b3a2ff; --next-soft: #2c2645;
    --planned: #7d838d; --s1: #4fc0cf; --s2: #b3a2ff; --s3: #f0a064; --s4: #6cc792;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 4px 14px rgba(0, 0, 0, .25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #14171d; --surface: #1c2028; --surface-2: #232833; --ink: #e9ebef; --ink-soft: #a9b0bc;
  --line: #363d4a; --track: #2c323e; --accent: #4fc0cf; --accent-ink: #0d2226; --accent-soft: #1d3a40;
  --focus: #8aaeff; --good: #6cc792; --good-soft: #1e3628; --mid: #e6b45c; --mid-soft: #3a2f1a;
  --bad: #f08a83; --bad-soft: #3d2423; --now: #f0a064; --now-soft: #3e2a1b; --next: #b3a2ff; --next-soft: #2c2645;
  --planned: #7d838d; --s1: #4fc0cf; --s2: #b3a2ff; --s3: #f0a064; --s4: #6cc792;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 4px 14px rgba(0, 0, 0, .25);
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.6 var(--font-body); overflow-x: hidden; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 6px; }
sub, sup { line-height: 0; }
h1, h2, h3, p { margin: 0; }
.code { font: 600 .8em/1 var(--font-mono); color: var(--ink-soft); white-space: nowrap; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- Шапка ---------- */
header.top { background: var(--surface); border-bottom: 1px solid var(--line); }
.top-inner { max-width: 880px; margin: 0 auto; padding: 14px 16px 0; display: grid; gap: 10px; }
.top-row { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; }
.brand { font-size: 1.3rem; font-weight: 800; letter-spacing: -.01em; line-height: 1.2; }
.brand small { display: block; font-size: .92rem; font-weight: 600; color: var(--ink-soft); letter-spacing: 0; }
.toggle { min-height: 44px; border: 2px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 16px; font-weight: 700; }
.toggle:hover { border-color: var(--ink-soft); }
.toggle[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.tabs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: thin; margin: 0 -4px; padding: 0 4px; }
.tab { flex: none; min-height: 48px; border: 0; background: none; padding: 8px 14px; border-bottom: 4px solid transparent; font-weight: 700; color: var(--ink-soft); display: flex; align-items: center; gap: 8px; border-radius: 8px 8px 0 0; }
.tab:hover { color: var(--ink); background: var(--surface-2); }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--tab-c, var(--accent)); }
.tab .ic { font-size: 1.2rem; line-height: 1; }
.tabs-spacer { height: 0; }

/* ---------- Основна частина ---------- */
main { max-width: 880px; margin: 0 auto; padding: 20px 16px 40px; display: grid; gap: 18px; min-width: 0; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px; box-shadow: var(--shadow); min-width: 0; }
.card h3 { font-size: 1.05rem; font-weight: 800; margin-bottom: 8px; }
.card p + p { margin-top: 8px; }
.note { font-size: .9rem; color: var(--ink-soft); }
.btn { min-height: 44px; border: 2px solid var(--accent); background: var(--accent); color: var(--accent-ink); border-radius: 12px; padding: 8px 16px; font-weight: 800; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-align: center; }
.btn:hover { filter: brightness(1.07); }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); font-weight: 700; }
.btn.ghost:hover { border-color: var(--ink-soft); filter: none; }
.btn[aria-pressed="true"].mark { background: var(--good); border-color: var(--good); color: #fff; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

/* Вступ до предмета */
.intro { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 16px; align-items: center; }
.intro h2 { font-size: 1.35rem; font-weight: 800; line-height: 1.25; }
.intro .sub-line { color: var(--ink-soft); font-size: .95rem; }
.hints { display: grid; gap: 10px; }
.hint { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 12px 14px; border-radius: 12px; border: 1px solid transparent; }
.hint.now { background: var(--now-soft); border-color: color-mix(in srgb, var(--now) 35%, transparent); }
.hint.next { background: var(--next-soft); border-color: color-mix(in srgb, var(--next) 35%, transparent); }
.hint .lbl { font-weight: 800; }
.hint.now .lbl { color: var(--now); }
.hint.next .lbl { color: var(--next); }
.chip { min-height: 40px; display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 4px 14px; font-weight: 700; font-size: .92rem; border: 2px solid currentColor; background: var(--surface); }
.chip.next { color: var(--next); }
.chip.now { color: var(--now); }
.chip:hover { background: var(--surface-2); }
.badge { display: inline-flex; align-items: center; border-radius: 999px; padding: 1px 10px; font-size: .78rem; font-weight: 800; line-height: 1.6; white-space: nowrap; }
.badge.now { background: var(--now); color: #fff; }
.badge.next { background: var(--next); color: #fff; }

/* Умовні позначення */
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: .85rem; color: var(--ink-soft); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }

/* Кільце прогресу */
.ring { flex: none; display: block; }
.ring .trk { fill: none; stroke: var(--track); }
.ring .val { fill: none; stroke: var(--ring-c, var(--accent)); stroke-linecap: round; }
.ring text { font: 800 12px var(--font-body); fill: var(--ink); text-anchor: middle; dominant-baseline: central; }
.ring.big text { font-size: 15px; }

/* Дерево */
.tree, .topics, .subs { list-style: none; margin: 0; padding: 0; }
.tree { display: grid; gap: 14px; }
.sec { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); overflow: hidden; min-width: 0; }
.sec > h2, .topic > h3 { margin: 0; font-size: inherit; }
.sec-head { width: 100%; min-height: 72px; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 14px; align-items: center; text-align: left; background: none; border: 0; padding: 14px 16px; }
.sec-head:hover { background: var(--surface-2); }
.sec-head .nm { display: block; font-size: 1.1rem; font-weight: 800; line-height: 1.3; overflow-wrap: anywhere; }
.sec-head .meta { display: block; font-size: .85rem; color: var(--ink-soft); }
.chev { width: 28px; height: 28px; display: grid; place-items: center; border-radius: 50%; background: var(--surface-2); transition: transform .15s; font-size: .8rem; color: var(--ink-soft); }
[aria-expanded="true"] > .chev { transform: rotate(90deg); }
.sec-body { padding: 0 16px 16px; display: grid; gap: 10px; }
.sec-body > .what { color: var(--ink-soft); font-size: .95rem; }
.topics { display: grid; gap: 8px; }
.topic { border: 1px solid var(--line); border-radius: 12px; background: var(--bg); min-width: 0; }
.topic.now { border: 2px solid var(--now); background: var(--now-soft); }
.topic-head { width: 100%; min-height: 56px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 12px; align-items: center; text-align: left; background: none; border: 0; padding: 10px 12px; border-radius: 12px; }
.topic-head:hover { background: color-mix(in srgb, var(--surface-2) 70%, transparent); }
.topic-head .t1 { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 8px; min-width: 0; }
.topic-head .nm { font-weight: 800; overflow-wrap: anywhere; }
.topic-head .t2 { grid-column: 1 / -1; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; font-size: .82rem; color: var(--ink-soft); }
.topic-head .chev { grid-row: 1; grid-column: 2; }
.bar { height: 10px; border-radius: 5px; background: var(--track); overflow: hidden; display: block; min-width: 60px; }
.bar i { display: block; height: 100%; background: var(--bar-c, var(--accent)); border-radius: 5px; }
.topic-body { padding: 0 12px 12px; display: grid; gap: 8px; }
.topic-body > .what { font-size: .92rem; color: var(--ink-soft); }
.subs { display: grid; gap: 6px; }
.sub { width: 100%; min-height: 48px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; align-items: center; text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 12px; }
button.sub:hover { border-color: var(--ink-soft); }
.sub .nm { font-weight: 700; overflow-wrap: anywhere; }
.sub .tags { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; align-items: center; }
.sub.planned { background: transparent; border-style: dashed; color: var(--planned); }
.sub.planned .nm { font-weight: 600; }
.sub.is-next { border: 2px solid var(--next); }
.pill { display: inline-flex; align-items: center; gap: 4px; border-radius: 999px; padding: 1px 10px; font-size: .78rem; font-weight: 800; line-height: 1.6; white-space: nowrap; background: var(--surface-2); color: var(--ink-soft); }
.pill.st-read { background: var(--accent-soft); color: var(--accent); }
.pill.st-checked { background: var(--mid-soft); color: var(--mid); }
.pill.st-mastered { background: var(--good-soft); color: var(--good); }
.pill.st-planned { background: transparent; border: 1px dashed var(--planned); color: var(--planned); }
.pill.prac { background: transparent; border: 1px solid var(--line); color: var(--ink-soft); font-family: var(--font-mono); font-weight: 600; }
.empty { text-align: center; padding: 36px 20px; display: grid; gap: 10px; justify-items: center; }
.empty .big { font-size: 2.6rem; line-height: 1; }
.empty h2 { font-size: 1.3rem; font-weight: 800; }
.empty p { max-width: 46ch; color: var(--ink-soft); }

/* ---------- Урок ---------- */
.lesson { display: grid; gap: 16px; min-width: 0; }
.crumbs { font-size: .88rem; color: var(--ink-soft); overflow-wrap: anywhere; }
.lesson-title { font-size: 1.5rem; font-weight: 800; line-height: 1.25; overflow-wrap: anywhere; }
.lesson-title:focus { outline: none; }
.lesson-title:focus-visible { outline: 3px solid var(--focus); }
.lesson .card ul, .lesson .card ol { margin: 0; padding-left: 22px; display: grid; gap: 6px; }
.rules { display: grid; gap: 10px; }
.rule { border: 1px solid var(--line); border-left: 5px solid var(--accent); border-radius: 10px; padding: 10px 12px; background: var(--bg); display: grid; gap: 4px; min-width: 0; }
.rule .f { font: 600 1.05rem/1.5 var(--font-mono); overflow-wrap: anywhere; }
.rule .m { font-size: .95rem; color: var(--ink-soft); }
.task { padding: 12px 14px; border-radius: 10px; background: var(--surface-2); font-weight: 600; }
ol.steps { list-style: none; padding: 0 !important; counter-reset: st; margin-top: 12px !important; }
ol.steps li { counter-increment: st; display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 4px 10px; align-items: start; }
ol.steps li::before { content: counter(st); width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--accent); color: var(--accent-ink); font-weight: 800; font-size: .9rem; grid-row: span 2; }
ol.steps .do { font-weight: 700; }
ol.steps .why { font-size: .93rem; color: var(--ink-soft); }
ol.steps .why b { color: var(--ink); }
.answer { margin-top: 12px; padding: 10px 14px; border-radius: 10px; background: var(--good-soft); color: var(--ink); }
.answer b { color: var(--good); }
.mistakes li::marker { content: "⚠︎  "; color: var(--mid); }
.checks { display: grid; gap: 10px; }
.check { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: grid; gap: 10px; background: var(--bg); }
.check .q { font-weight: 700; }
.examples { display: grid; gap: 14px; }
.example { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; background: var(--bg); min-width: 0; }
.ex-n { font-size: .9rem; font-weight: 800; color: var(--accent); margin-bottom: 6px; }
.example .task { background: var(--surface); }
.opts { display: grid; gap: 8px; }
.opt { min-height: 44px; text-align: left; border: 2px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 12px; font-weight: 600; overflow-wrap: anywhere; }
.opt:hover:not([disabled]) { border-color: var(--ink-soft); }
.opt[disabled] { cursor: default; }
.opt.right { border-color: var(--good); background: var(--good-soft); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.ans-row input { flex: 1 1 10em; min-width: 0; min-height: 44px; border: 2px solid var(--line); border-radius: 10px; padding: 8px 12px; background: var(--surface); color: var(--ink); font-size: 1rem; }
.ans-row input:focus-visible { border-color: var(--focus); }
.check .a { padding: 8px 12px; border-radius: 8px; background: var(--surface); border: 1px dashed var(--line); }
.check .res { font-size: .9rem; font-weight: 700; }
.check .res.know { color: var(--good); }
.check .res.not-yet { color: var(--mid); }
.btn.know[aria-pressed="true"] { background: var(--good); border-color: var(--good); color: #fff; }
.btn.not-yet[aria-pressed="true"] { background: var(--mid); border-color: var(--mid); color: #fff; }
.ask { display: grid; gap: 10px; }
.ask textarea { width: 100%; min-height: 64px; resize: none; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: var(--bg); color: var(--ink); font-size: .95rem; line-height: 1.45; }
.pager { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.pager .btn { justify-content: flex-start; text-align: left; min-width: 0; }
.pager .btn.nx { justify-content: flex-end; text-align: right; grid-column: 2; }
.pager .btn span { overflow-wrap: anywhere; }
.ref { font-size: .85rem; color: var(--ink-soft); border-left: 3px solid var(--line); padding-left: 10px; }

/* ---------- Для батьків ---------- */
.par-head h2 { font-size: 1.35rem; font-weight: 800; }
.subj-cards { display: grid; gap: 14px; }
.meter { display: grid; gap: 4px; }
.meter .lbl { display: flex; justify-content: space-between; gap: 10px; font-size: .92rem; }
.meter .lbl b { font-variant-numeric: tabular-nums; white-space: nowrap; }
.meter .bar { height: 14px; border-radius: 7px; }
.meters { display: grid; gap: 10px; margin-top: 10px; }
table.acc { width: 100%; border-collapse: collapse; font-size: .92rem; }
table.acc th, table.acc td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--track); vertical-align: middle; }
table.acc th { font-size: .8rem; color: var(--ink-soft); font-weight: 700; }
table.acc td.num { white-space: nowrap; font-variant-numeric: tabular-nums; }
table.acc .bar { width: 100%; min-width: 50px; }
.weak { margin: 0; padding-left: 22px; display: grid; gap: 4px; }
.tips { margin: 0; padding-left: 22px; display: grid; gap: 8px; }

footer.foot { max-width: 880px; margin: 0 auto; padding: 0 16px 32px; font-size: .82rem; color: var(--ink-soft); display: flex; flex-wrap: wrap; gap: 4px 16px; justify-content: space-between; }

@media (max-width: 560px) {
  body { font-size: 16px; }
  .card { padding: 14px; border-radius: 14px; }
  .sec-head { padding: 12px; gap: 10px; }
  .sec-body { padding: 0 10px 12px; }
  .intro { grid-template-columns: minmax(0, 1fr); }
  .intro .ring { display: none; }
  .sub { grid-template-columns: minmax(0, 1fr); }
  .sub .tags { justify-content: flex-start; }
  .pager { grid-template-columns: minmax(0, 1fr); }
  .pager .btn.nx { grid-column: 1; }
  .lesson-title { font-size: 1.3rem; }
  table.acc .barcol { display: none; }
}
@media (prefers-reduced-motion: reduce) { .chev { transition: none; } }
</style>
</head>
<body>
<header class="top">
  <div class="top-inner">
    <div class="top-row">
      <h1 class="brand" id="brand">Моя карта навчання<small id="who"></small></h1>
      <button class="toggle" id="parents-toggle" type="button" aria-pressed="false">Для батьків</button>
    </div>
    <div class="tabs" id="tabs" role="tablist" aria-label="Предмети"></div>
    <div class="tabs-spacer"></div>
  </div>
</header>
<main id="main" tabindex="-1" aria-live="off"></main>
<footer class="foot"><span id="store-status"></span><span id="ver"></span></footer>

<script>
/* ---------- Зміст: вставляє study-map/build-map.py з study-map/content/ ---------- */
const CONTENT = {"subjects":[{"id":"algebra","name":"Алгебра","grade":7,"tutor":"Оля","tutorCall":"Олю","icon":"➗","sections":[{"id":"A1","subject":"algebra","name":"Лінійні рівняння з однією змінною","what":"Рівняння — це рівність з невідомим. Учимося знаходити невідоме і розв'язувати задачі за допомогою рівнянь.","topics":[{"id":"A1.1","name":"Рівняння та його корені","what":"Що таке рівняння, корінь і які перетворення не змінюють коренів.","subtopics":[{"id":"A1.1.1","name":"Рівняння і корінь рівняння","status":"ready","programmeRef":"Загальні відомості про рівняння.","lesson":{"what":"<b>Рівняння<\/b> — це рівність, у якій є невідоме число, позначене буквою. Цю букву називають <b>змінною<\/b>. <b>Корінь рівняння<\/b> — таке значення змінної, при якому рівняння перетворюється на правильну числову рівність.","ideas":["Ліва частина рівняння — усе, що стоїть зліва від знака «=», права частина — усе, що справа.","Щоб перевірити, чи є число коренем, підстав його замість змінної й порахуй <b>обидві<\/b> частини. Однаково — корінь, різне — не корінь.","<b>Розв'язати рівняння<\/b> — означає знайти всі його корені або показати, що коренів немає.","Рівняння може мати один корінь, кілька, безліч або жодного."],"rules":[{"f":"x + 7 = 12; x = 5, бо 5 + 7 = 12","means":"Корінь — це число, яке робить рівність правильною. Тут корінь — 5."}],"examples":[{"task":"Чи є число 5 коренем рівняння x + 7 = 12?","steps":[{"do":"Ліва частина при x = 5: 5 + 7 = 12","why":"Підставляємо 5 замість x."},{"do":"Права частина: 12","why":"Тут змінної немає — просто число."},{"do":"12 = 12 — рівність правильна","why":"Обидві частини рівні."}],"answer":"Відповідь: так, 5 — корінь рівняння."},{"task":"Чи є число 3 коренем рівняння 4x − 5 = 2x + 1? А число 2?","steps":[{"do":"При x = 3 ліва частина: 4 · 3 − 5 = 12 − 5 = 7","why":"Підставляємо 3 замість x у ліву частину."},{"do":"Права частина: 2 · 3 + 1 = 6 + 1 = 7","why":"Підставляємо те саме число в праву частину."},{"do":"7 = 7 — рівність правильна","why":"Обидві частини рівні, отже 3 — корінь."},{"do":"При x = 2: 4 · 2 − 5 = 3, а 2 · 2 + 1 = 5; 3 ≠ 5","why":"Частини різні, отже 2 — не корінь."}],"answer":"Відповідь: 3 — корінь рівняння, 2 — не корінь."},{"task":"Які з чисел −3, 0, 3 є коренями рівняння x · x = 9?","steps":[{"do":"x = −3: (−3) · (−3) = 9; 9 = 9","why":"Мінус на мінус дає плюс — рівність правильна."},{"do":"x = 0: 0 · 0 = 0; 0 ≠ 9","why":"Рівність неправильна — 0 не корінь."},{"do":"x = 3: 3 · 3 = 9; 9 = 9","why":"Рівність правильна."}],"answer":"Відповідь: корені −3 і 3 (рівняння має два корені); 0 — не корінь."}],"mistakes":["Рахують лише ліву частину. Правильно: порахуй <b>обидві<\/b> частини й порівняй їх.","При x = 4 записують 3x як 34. Правильно: 3x — це 3 · x, тобто 3 · 4 = 12.","Плутають рівняння і корінь. Рівняння — це запис x + 7 = 12, а корінь — число 5."],"check":[{"q":"Чи є число −2 коренем рівняння 3x + 10 = 4?","options":["Так","Ні"],"correct":0,"a":"Так: 3 · (−2) + 10 = −6 + 10 = 4, а права частина теж 4."},{"q":"Пастка: скільки коренів має рівняння x + 1 = x?","options":["Один","Жодного","Безліч"],"correct":1,"a":"Жодного. Яке число не підстав, ліва частина на 1 більша за праву."},{"q":"Марійка мала x гривень, купила зошит за 25 грн, і в неї залишилося 40 грн. Скільки гривень мала Марійка?","accept":["65"],"a":"x − 25 = 40, x = 40 + 25 = 65. Перевірка: 65 − 25 = 40."}]}},{"id":"A1.1.2","name":"Рівносильні рівняння і властивості рівнянь","status":"ready","programmeRef":"Рівносильні рівняння.","lesson":{"what":"<b>Рівносильні рівняння<\/b> — це рівняння, які мають ті самі корені (або обидва не мають коренів). Розв'язуючи рівняння, ми крок за кроком замінюємо його простішим рівносильним, поки не побачимо корінь.","ideas":["Рівняння 2x = 10 і x + 1 = 6 рівносильні: кожне має єдиний корінь 5.","<b>Властивість 1.<\/b> Будь-який доданок можна перенести з однієї частини рівняння в іншу, змінивши його знак на протилежний.","<b>Властивість 2.<\/b> Обидві частини рівняння можна помножити або поділити на одне й те саме число, яке <b>не дорівнює нулю<\/b>.","Розкриття дужок і зведення подібних доданків теж не змінюють коренів рівняння."],"rules":[{"f":"x + b = c → x = c − b","means":"Перенесли доданок b праворуч — його знак змінився з «+» на «−»."},{"f":"ax = c → x = c : a (a ≠ 0)","means":"Поділили обидві частини на те саме число a, яке не дорівнює нулю."}],"examples":[{"task":"Розв'яжи рівняння x + 9 = 4.","steps":[{"do":"x = 4 − 9","why":"Перенесли 9 праворуч, змінивши знак (властивість 1)."},{"do":"x = −5","why":"Обчислили: 4 − 9 = −5."},{"do":"Перевірка: −5 + 9 = 4","why":"Рівність правильна."}],"answer":"Відповідь: x = −5."},{"task":"Розв'яжи рівняння 5x − 8 = 3x + 6, записуючи на кожному кроці рівносильне рівняння.","steps":[{"do":"5x − 3x = 6 + 8","why":"Перенесли 3x ліворуч, а −8 праворуч, змінивши знаки (властивість 1)."},{"do":"2x = 14","why":"Звели подібні доданки: 5x − 3x = 2x; 6 + 8 = 14."},{"do":"x = 14 : 2, x = 7","why":"Поділили обидві частини на 2, а 2 ≠ 0 (властивість 2)."},{"do":"Перевірка: 5 · 7 − 8 = 27 і 3 · 7 + 6 = 27","why":"Обидві частини рівні — корінь знайдено правильно."}],"answer":"Відповідь: x = 7."},{"task":"Розв'яжи рівняння x/4 − 1 = 2.","steps":[{"do":"x/4 = 2 + 1","why":"Перенесли −1 праворуч, змінивши знак."},{"do":"x/4 = 3","why":"Обчислили праву частину."},{"do":"x = 3 · 4, x = 12","why":"Помножили обидві частини на 4, а 4 ≠ 0 (властивість 2)."},{"do":"Перевірка: 12/4 − 1 = 3 − 1 = 2","why":"Рівність правильна."}],"answer":"Відповідь: x = 12."}],"mistakes":["Переносять доданок, не змінюючи знака: з x + 4 = 10 пишуть x = 10 + 4. Правильно: x = 10 − 4, x = 6.","Ділять не всю частину: з 3x = 12 + 6 пишуть x = 4 + 6. Правильно: спершу 3x = 18, потім x = 18 : 3 = 6.","«Скорочують» на x: з 5x = 3x роблять 5 = 3 і кажуть, що коренів немає. Ділити можна лише на число, відмінне від нуля. Правильно: 5x − 3x = 0, 2x = 0, x = 0."],"check":[{"q":"Чи рівносильні рівняння x − 3 = 4 і 2x = 8?","options":["Так","Ні"],"correct":1,"a":"Ні: корінь першого — 7 (7 − 3 = 4), а другого — 4 (2 · 4 = 8). Корені різні."},{"q":"Пастка: чи рівносильні рівняння 0 · x = 5 і x + 2 = x?","options":["Так, бо обидва не мають коренів","Ні, бо вони різні на вигляд"],"correct":0,"a":"Так. Жодне з них не має коренів, а такі рівняння вважають рівносильними."},{"q":"У Тараса в кишені x гривень, а в скарбничці — утричі більше, разом 120 грн. Розв'яжи рівняння x + 3x = 120. Скільки гривень у Тараса в кишені?","accept":["30"],"a":"x + 3x = 120 рівносильне 4x = 120, звідси x = 30. Перевірка: 30 + 90 = 120."}]}}]},{"id":"A1.2","name":"Лінійні рівняння","what":"Рівняння виду ax = b і ті, що до нього зводяться.","subtopics":[{"id":"A1.2.1","name":"Лінійне рівняння ax = b","status":"ready","programmeRef":"Лінійні рівняння з однією змінною.","lesson":{"what":"<b>Лінійне рівняння з однією змінною<\/b> — це рівняння виду ax = b, де x — змінна, а a і b — числа. Число a, яке стоїть перед змінною, називають <b>коефіцієнтом<\/b>.","ideas":["Приклади лінійних рівнянь: 3x = 12 (a = 3, b = 12), −x = 7 (a = −1, b = 7), 0,5x = 2 (a = 0,5, b = 2).","Рівняння x<sup>2<\/sup> = 9 — не лінійне: у ньому змінна в квадраті.","Якщо коефіцієнт a ≠ 0, рівняння має один корінь: x = b : a.","Якщо коефіцієнт від'ємний, ділимо на від'ємне число — уважно зі знаком відповіді.","Якщо a = 0, рівняння має вигляд 0 · x = b — цей випадок розглядаємо окремо."],"rules":[{"f":"ax = b, a ≠ 0 → x = b : a","means":"Щоб знайти корінь, поділи число b на коефіцієнт a."}],"examples":[{"task":"Розв'яжи рівняння 7x = 35.","steps":[{"do":"a = 7, b = 35; a ≠ 0","why":"Це лінійне рівняння з одним коренем."},{"do":"x = 35 : 7","why":"Ділимо обидві частини на коефіцієнт 7."},{"do":"x = 5","why":"Обчислили частку."},{"do":"Перевірка: 7 · 5 = 35","why":"Рівність правильна."}],"answer":"Відповідь: x = 5."},{"task":"Розв'яжи рівняння −4x = 18.","steps":[{"do":"a = −4, b = 18; a ≠ 0","why":"Це лінійне рівняння, коефіцієнт не нуль — корінь один."},{"do":"x = 18 : (−4)","why":"Ділимо обидві частини на коефіцієнт −4."},{"do":"x = −4,5","why":"Додатне число поділити на від'ємне — результат від'ємний; 18 : 4 = 4,5."},{"do":"Перевірка: −4 · (−4,5) = 18","why":"Мінус на мінус дає плюс; 4 · 4,5 = 18. Рівність правильна."}],"answer":"Відповідь: x = −4,5."},{"task":"Розв'яжи рівняння 0,4x = 2.","steps":[{"do":"x = 2 : 0,4","why":"Ділимо обидві частини на коефіцієнт 0,4."},{"do":"x = 20 : 4","why":"Помножили ділене й дільник на 10, щоб позбутися коми."},{"do":"x = 5","why":"Обчислили частку."},{"do":"Перевірка: 0,4 · 5 = 2","why":"Рівність правильна."}],"answer":"Відповідь: x = 5."}],"mistakes":["Ділять «навпаки»: з 6x = 3 пишуть x = 6 : 3 = 2. Правильно: ділимо на коефіцієнт, x = 3 : 6 = 0,5.","Гублять мінус: з −x = 7 пишуть x = 7. Правильно: коефіцієнт тут −1, тож x = 7 : (−1) = −7.","Віднімають замість ділення: з 5x = 20 пишуть x = 20 − 5 = 15. Правильно: 5x — це 5 · x, тож x = 20 : 5 = 4."],"check":[{"q":"Яке з рівнянь — лінійне рівняння з однією змінною?","options":["x · x = 4","0,2x = −1","5 : x = 1"],"correct":1,"a":"0,2x = −1 має вигляд ax = b (a = 0,2, b = −1). У x · x = 4 змінна множиться сама на себе, а в 5 : x = 1 вона в дільнику."},{"q":"Дорога до школи — 3 км, велосипедист їде зі швидкістю 12 км/год. Розв'яжи рівняння 12t = 3, де t — час у годинах. Скільки хвилин триває дорога?","accept":["15"],"a":"t = 3 : 12 = 0,25 год. 0,25 · 60 = 15 хв. Перевірка: 12 · 0,25 = 3."},{"q":"Пастка: скільки коренів має рівняння 0 · x = 6?","options":["Жодного","Один: x = 6","Безліч"],"correct":0,"a":"Жодного: 0 · x завжди дорівнює 0, а не 6. Навіть x = 6 дає 0 · 6 = 0."}]}},{"id":"A1.2.2","name":"Рівняння, що зводяться до лінійних","status":"ready","programmeRef":"Розв'язування лінійних рівнянь.","lesson":{"what":"Деякі рівняння спершу мають дужки, дроби або змінну в обох частинах. Дозволеними перетвореннями їх можна звести до лінійного рівняння ax = b, а далі знайти x.","ideas":["Порядок дій: розкрий дужки → перенеси доданки зі змінною ліворуч, а числа праворуч → зведи подібні доданки → поділи на коефіцієнт.","Мінус перед дужками змінює знаки <b>всіх<\/b> доданків у дужках.","Переносячи доданок в іншу частину рівняння, змінюй його знак.","Якщо в рівнянні є дроби, помнож обидві частини на спільний знаменник — дробів не стане.","Наприкінці підстав корінь у <b>початкове<\/b> рівняння."],"rules":[{"f":"a(b + c) = ab + ac","means":"Розкриваємо дужки: число перед дужками множимо на кожен доданок."},{"f":"−(b − c) = −b + c","means":"Мінус перед дужками змінює знак кожного доданка в дужках."}],"examples":[{"task":"Розв'яжи рівняння 3x + 4 = x + 10.","steps":[{"do":"3x − x = 10 − 4","why":"Перенесли x ліворуч, а 4 праворуч, змінивши знаки."},{"do":"2x = 6","why":"Звели подібні доданки."},{"do":"x = 3","why":"Поділили обидві частини на 2."},{"do":"Перевірка: 3 · 3 + 4 = 13 і 3 + 10 = 13","why":"Обидві частини рівні."}],"answer":"Відповідь: x = 3."},{"task":"Розв'яжи рівняння 4(x − 3) − (x + 5) = x + 1.","steps":[{"do":"4x − 12 − x − 5 = x + 1","why":"Розкрили дужки; мінус перед другими дужками змінив знаки: −x − 5."},{"do":"3x − 17 = x + 1","why":"Звели подібні: 4x − x = 3x; −12 − 5 = −17."},{"do":"3x − x = 1 + 17","why":"Перенесли x ліворуч, а −17 праворуч, змінивши знаки."},{"do":"2x = 18, x = 9","why":"Звели подібні й поділили обидві частини на 2."},{"do":"Перевірка: 4 · (9 − 3) − (9 + 5) = 24 − 14 = 10 і 9 + 1 = 10","why":"Обидві частини рівні — корінь правильний."}],"answer":"Відповідь: x = 9."},{"task":"Розв'яжи рівняння (x + 1)/3 = (x − 1)/2.","steps":[{"do":"2(x + 1) = 3(x − 1)","why":"Помножили обидві частини на 6 — спільний знаменник."},{"do":"2x + 2 = 3x − 3","why":"Розкрили дужки."},{"do":"2x − 3x = −3 − 2","why":"Перенесли 3x ліворуч, а 2 праворуч, змінивши знаки."},{"do":"−x = −5, x = 5","why":"Звели подібні й поділили обидві частини на −1."},{"do":"Перевірка: (5 + 1)/3 = 2 і (5 − 1)/2 = 2","why":"Обидві частини рівні."}],"answer":"Відповідь: x = 5."}],"mistakes":["Розкриваючи −(x + 5), пишуть −x + 5. Правильно: −x − 5, бо мінус змінює знак кожного доданка.","Множать лише перший доданок: 4(x − 3) = 4x − 3. Правильно: 4x − 12.","Множачи рівняння x/2 + 3 = 5 на 2, пишуть x + 3 = 10. Правильно: множимо <b>кожен<\/b> доданок: x + 6 = 10, x = 4."],"check":[{"q":"Пастка зі знаками: розв'яжи рівняння 7 − 2(x + 1) = 3x. Знайди x.","accept":["1"],"a":"7 − 2x − 2 = 3x, 5 = 5x, x = 1. Перевірка: 7 − 2 · 2 = 3 і 3 · 1 = 3."},{"q":"Розв'яжи рівняння x/3 + x/2 = 10. Знайди x.","accept":["12"],"a":"Помножили на 6: 2x + 3x = 60, 5x = 60, x = 12. Перевірка: 4 + 6 = 10."},{"q":"Тренер купив 4 однакові м'ячі по x грн і отримав знижку 150 грн на всю покупку. Він заплатив стільки ж, скільки коштують 3 м'ячі без знижки: 4x − 150 = 3x. Скільки гривень коштує один м'яч?","accept":["150"],"a":"4x − 3x = 150, x = 150. Перевірка: 4 · 150 − 150 = 450 і 3 · 150 = 450."}]}},{"id":"A1.2.3","name":"Один корінь, безліч коренів чи жодного","status":"ready","programmeRef":"Розв'язування лінійних рівнянь.","lesson":{"what":"Лінійне рівняння ax = b може мати один корінь, безліч коренів або не мати жодного. Усе залежить від коефіцієнта a і числа b.","ideas":["a ≠ 0 — <b>один корінь<\/b> x = b : a. Наприклад, 2x = 8, x = 4.","a = 0 і b = 0 — рівняння 0 · x = 0 правильне при будь-якому x: <b>безліч коренів<\/b> (коренем є будь-яке число).","a = 0 і b ≠ 0 — рівняння, наприклад 0 · x = 5, <b>не має коренів<\/b>, бо 0 · x завжди дорівнює 0.","Якщо після спрощення змінна «зникла», подивись на числа: 0 = 0 — безліч коренів; 0 = 7 — коренів немає."],"rules":[{"f":"a ≠ 0 → один корінь x = b : a","means":"Ділимо b на коефіцієнт."},{"f":"a = 0, b = 0 → безліч коренів","means":"Підходить будь-яке число."},{"f":"a = 0, b ≠ 0 → коренів немає","means":"Жодне число не підходить."}],"examples":[{"task":"Розв'яжи рівняння 4x − 3 = x + 9.","steps":[{"do":"4x − x = 9 + 3","why":"Перенесли x ліворуч, а −3 праворуч, змінивши знаки."},{"do":"3x = 12","why":"Звели подібні: a = 3 ≠ 0 — корінь один."},{"do":"x = 4","why":"Поділили обидві частини на 3."},{"do":"Перевірка: 4 · 4 − 3 = 13 і 4 + 9 = 13","why":"Обидві частини рівні."}],"answer":"Відповідь: x = 4 (один корінь)."},{"task":"Розв'яжи рівняння 2(x + 3) − 5 = 2x + 1.","steps":[{"do":"2x + 6 − 5 = 2x + 1","why":"Розкрили дужки."},{"do":"2x + 1 = 2x + 1","why":"Звели числа: 6 − 5 = 1."},{"do":"2x − 2x = 1 − 1","why":"Перенесли доданки зі змінною ліворуч, числа праворуч, змінивши знаки."},{"do":"0 · x = 0","why":"a = 0 і b = 0: рівність правильна при будь-якому x."}],"answer":"Відповідь: рівняння має безліч коренів (коренем є будь-яке число)."},{"task":"Розв'яжи рівняння 5(x − 2) + 3 = 5x − 4.","steps":[{"do":"5x − 10 + 3 = 5x − 4","why":"Розкрили дужки."},{"do":"5x − 7 = 5x − 4","why":"Звели числа: −10 + 3 = −7."},{"do":"5x − 5x = −4 + 7","why":"Перенесли доданки зі змінною ліворуч, числа праворуч, змінивши знаки."},{"do":"0 · x = 3","why":"a = 0, b = 3 ≠ 0: жодне число не підходить."}],"answer":"Відповідь: рівняння не має коренів."}],"mistakes":["З 0 · x = 0 пишуть «x = 0». Правильно: коренем є <b>будь-яке<\/b> число, а не лише 0.","З 0 · x = 5 пишуть x = 5 : 0. На нуль ділити не можна — рівняння не має коренів.","Плутають 0 · x = 6 (коренів немає) і 6x = 0 (один корінь x = 0)."],"check":[{"q":"Пастка: скільки коренів має рівняння 3x − 4 = 3(x − 1)?","options":["Один","Жодного","Безліч"],"correct":1,"a":"Жодного: 3x − 4 = 3x − 3, звідси 0 · x = 1."},{"q":"Знайди корінь рівняння 5x = 0.","accept":["0"],"a":"x = 0 : 5 = 0. Корінь один. Перевірка: 5 · 0 = 0."},{"q":"У старшого брата 200 грн, у молодшого — 120 грн. Кожен щотижня відкладає ще по 50 грн. Через скільки тижнів у них буде порівну?","options":["Через 2 тижні","Через 80 тижнів","Ніколи — рівняння не має коренів"],"correct":2,"a":"200 + 50x = 120 + 50x, звідси 0 · x = −80 — коренів немає. Різниця завжди 80 грн."}]}}]},{"id":"A1.3","name":"Задачі за допомогою рівнянь","what":"Як перетворити текстову задачу на рівняння.","subtopics":[{"id":"A1.3.1","name":"Етапи розв'язування задачі за допомогою рівняння","status":"ready","programmeRef":"Розв'язування задач за допомогою лінійних рівнянь.","lesson":{"what":"Текстову задачу можна розв'язати за допомогою рівняння. Невідоме позначаємо буквою, записуємо умову рівнянням, розв'язуємо його й пояснюємо, що означає знайдене число.","ideas":["<b>Етап 1.<\/b> Позначаємо невідому величину буквою (наприклад, x) і через неї виражаємо інші величини.","<b>Етап 2.<\/b> Складаємо рівняння за умовою задачі.","<b>Етап 3.<\/b> Розв'язуємо рівняння.","<b>Етап 4.<\/b> Перевіряємо, чи відповідає знайдене умові й чи воно розумне (кількість учнів не буває 2,5), і записуємо відповідь словами з одиницями."],"rules":[],"examples":[{"task":"Задумали число. Якщо до нього додати 17, вийде 45. Яке число задумали?","steps":[{"do":"Нехай задумане число — x","why":"Етап 1: позначили невідоме."},{"do":"x + 17 = 45","why":"Етап 2: записали умову рівнянням."},{"do":"x = 45 − 17, x = 28","why":"Етап 3: перенесли 17 праворуч зі зміною знака."},{"do":"Перевірка: 28 + 17 = 45","why":"Етап 4: умова виконується."}],"answer":"Відповідь: задумали число 28."},{"task":"У двох сьомих класах разом 58 учнів. У 7-А на 4 учні більше, ніж у 7-Б. Скільки учнів у кожному класі?","steps":[{"do":"Нехай у 7-Б x учнів, тоді в 7-А — (x + 4) учнів","why":"Етап 1: позначили невідоме й виразили через нього іншу величину."},{"do":"x + (x + 4) = 58","why":"Етап 2: разом у двох класах 58 учнів."},{"do":"2x = 58 − 4, 2x = 54","why":"Етап 3: звели подібні й перенесли 4 праворуч зі зміною знака."},{"do":"x = 27; x + 4 = 31","why":"Поділили на 2 і знайшли, скільки учнів у 7-А."},{"do":"Перевірка: 27 + 31 = 58 і 31 − 27 = 4","why":"Етап 4: обидві умови виконано, числа цілі — відповідь розумна."}],"answer":"Відповідь: у 7-А — 31 учень, у 7-Б — 27 учнів."},{"task":"Сума трьох послідовних натуральних чисел (таких, що йдуть одне за одним, як 5, 6, 7) дорівнює 72. Знайди ці числа.","steps":[{"do":"Нехай менше число — x, тоді наступні — x + 1 і x + 2","why":"Етап 1: кожне наступне на 1 більше."},{"do":"x + (x + 1) + (x + 2) = 72","why":"Етап 2: сума дорівнює 72."},{"do":"3x + 3 = 72","why":"Етап 3: звели подібні."},{"do":"3x = 69, x = 23","why":"Перенесли 3 праворуч і поділили на 3."},{"do":"Перевірка: 23 + 24 + 25 = 72","why":"Етап 4: числа натуральні й послідовні, сума правильна."}],"answer":"Відповідь: 23, 24 і 25."}],"mistakes":["Знаходять x і зупиняються. Але x — це лише учні 7-Б. Правильно: знайти й 7-А (x + 4) і відповісти на <b>всі<\/b> питання задачі.","Не записують, що позначили буквою, і потім плутаються. Правильно: завжди починай з «Нехай x — …».","Залишають нерозумну відповідь, наприклад 27,5 учня. Правильно: така відповідь означає помилку — перевір рівняння й обчислення."],"check":[{"q":"Кіт важить утричі більше, ніж кошеня, а разом вони важать 8 кг. Скільки кілограмів важить кошеня?","accept":["2"],"a":"Нехай кошеня — x кг, кіт — 3x кг. x + 3x = 8, 4x = 8, x = 2. Перевірка: 2 + 6 = 8."},{"q":"Пастка: у задачі про кількість хлопців у класі вийшло x = 12,5. Що робити?","options":["Записати відповідь: 12,5 хлопця","Округлити до 13","Шукати помилку в рівнянні чи обчисленнях"],"correct":2,"a":"Кількість людей — ціле число, тож 12,5 означає помилку. Перевір рівняння й обчислення."},{"q":"Футбольна команда набрала за сезон 31 очко. За перемогу дають 3 очки, за нічию — 1. Нічиїх було 7. Скільки було перемог?","accept":["8"],"a":"3x + 7 = 31, 3x = 24, x = 8. Перевірка: 3 · 8 + 7 = 31."}]}},{"id":"A1.3.2","name":"Складаємо рівняння за умовою задачі","status":"ready","programmeRef":"Рівняння як математична модель задачі","lesson":{"what":"Рівняння, складене за умовою задачі, — це її <b>математична модель<\/b>: запис умови мовою математики. Головне — знайти в умові дві рівні величини й записати кожну з них через x.","ideas":["«На 5 більше» → x + 5; «на 5 менше» → x − 5; «у 3 рази більше» → 3x; «у 3 рази менше» → x : 3.","«Разом», «усього» — додаємо; «на скільки більше» — віднімаємо.","Шукай у тексті, що чому <b>дорівнює<\/b>, — саме це й стає рівнянням.","За x зручно брати меншу величину — тоді в рівнянні менше віднімання й дробів.","Перед складанням рівняння переведи величини в однакові одиниці (км і м, год і хв)."],"rules":[{"f":"вартість = ціна · кількість","means":"Для задач про покупки."},{"f":"s = v · t","means":"Шлях дорівнює швидкості, помноженій на час. Для задач на рух."}],"examples":[{"task":"Число, у 4 рази більше за x, на 15 більше за x. Запиши рівняння і знайди x.","steps":[{"do":"4x = x + 15","why":"«У 4 рази більше» — 4x; «на 15 більше» — x + 15."},{"do":"4x − x = 15","why":"Перенесли x ліворуч, змінивши знак."},{"do":"3x = 15, x = 5","why":"Звели подібні й поділили на 3."},{"do":"Перевірка: 4 · 5 = 20 і 5 + 15 = 20","why":"Обидві частини рівні."}],"answer":"Відповідь: x = 5."},{"task":"Мама купила 3 кг яблук і 2 кг груш і заплатила 230 грн. Кілограм груш на 15 грн дорожчий за кілограм яблук. Скільки коштує 1 кг яблук?","steps":[{"do":"Нехай 1 кг яблук коштує x грн, тоді 1 кг груш — (x + 15) грн","why":"«На 15 грн дорожчий» — додаємо 15."},{"do":"3x + 2(x + 15) = 230","why":"Вартість = ціна · кількість; разом заплатили 230 грн. Це модель задачі."},{"do":"5x + 30 = 230","why":"Розкрили дужки й звели подібні: 3x + 2x = 5x."},{"do":"5x = 200, x = 40","why":"Перенесли 30 праворуч зі зміною знака й поділили на 5."},{"do":"Перевірка: 3 · 40 + 2 · 55 = 120 + 110 = 230","why":"Сума збігається з умовою."}],"answer":"Відповідь: 1 кг яблук коштує 40 грн."},{"task":"Денис їхав від дому до стадіону велосипедом 0,5 год, а назад тією самою дорогою йшов пішки 1,5 год. Велосипедом він їхав на 8 км/год швидше, ніж ішов. З якою швидкістю він ішов?","steps":[{"do":"Нехай пішки — x км/год, тоді велосипедом — (x + 8) км/год","why":"«На 8 км/год швидше» — додаємо 8."},{"do":"1,5x = 0,5(x + 8)","why":"s = v · t; шлях туди й назад той самий."},{"do":"1,5x = 0,5x + 4","why":"Розкрили дужки."},{"do":"1,5x − 0,5x = 4, x = 4","why":"Перенесли 0,5x ліворуч і звели подібні."},{"do":"Перевірка: 1,5 · 4 = 6 км і 0,5 · 12 = 6 км","why":"Шляхи рівні."}],"answer":"Відповідь: 4 км/год."}],"mistakes":["«У 3 рази менше, ніж x» записують як x − 3. Правильно: x : 3. «У … рази» — множимо чи ділимо, «на …» — додаємо чи віднімаємо.","«У брата на 4 наліпки більше, ніж у сестри»: позначають наліпки сестри x, а брата записують x − 4. Правильно: x + 4 — у брата більше.","Додають величини в різних одиницях: 600 м + x = 1,8 км. Правильно: 1,8 км = 1800 м, тож 600 + x = 1800."],"check":[{"q":"Як записати «число, у 4 рази менше за x»?","options":["x − 4","4x","x : 4"],"correct":2,"a":"x : 4. «У … рази менше» — ділимо; «на … менше» — віднімаємо."},{"q":"Пастка: периметр прямокутника 30 см, довжина на 3 см більша за ширину x. Яке рівняння правильне?","options":["x + (x + 3) = 30","2(x + x + 3) = 30","x · (x + 3) = 30"],"correct":1,"a":"Периметр — сума <b>чотирьох<\/b> сторін: 2(x + x + 3) = 30, звідси x = 6. Ширина 6 см, довжина 9 см; 2 · (6 + 9) = 30."},{"q":"Дорога до школи — 1,8 км. Іра 10 хв ішла пішки зі швидкістю 60 м/хв, а решту шляху проїхала автобусом. Скільки метрів вона проїхала автобусом?","accept":["1200"],"a":"1,8 км = 1800 м. 60 · 10 + x = 1800, 600 + x = 1800, x = 1200. Перевірка: 600 + 1200 = 1800."}]}},{"id":"A1.3.3","name":"Задачі з життя: покупки, бюджет, рух","status":"ready","programmeRef":"Розв'язування задач за допомогою лінійних рівнянь.","lesson":{"what":"Рівняння допомагають у житті: спланувати покупку, порахувати сімейні витрати, зрозуміти, чи безпечно переходити дорогу. Етапи ті самі: позначаємо невідоме, складаємо рівняння, розв'язуємо, перевіряємо за змістом.","ideas":["<b>Покупки:<\/b> вартість = ціна · кількість. Якщо купують кілька різних речей, їхні вартості додають.","<b>Сімейний бюджет:<\/b> якщо вже є якась сума і щомісяця відкладають однаково, то через x місяців буде «що є + щомісячна сума · x».","<b>Безпека руху:<\/b> s = v · t. Автомобіль долає кілька метрів щосекунди й не може зупинитися миттєво — тому дорогу переходимо лише на зелене світло або коли машини зупинилися.","Перевір відповідь за змістом: чи реальна ціна, час, відстань; чи треба округлити до цілого (місяців, квитків)."],"rules":[{"f":"вартість = ціна · кількість","means":"Скільки заплатимо за кілька однакових речей."},{"f":"s = v · t","means":"Шлях = швидкість · час. Одиниці мають узгоджуватися: м/с і с, км/год і год."}],"examples":[{"task":"За 3 квитки в кіно й попкорн за 95 грн заплатили 545 грн. Скільки коштує один квиток?","steps":[{"do":"Нехай квиток коштує x грн; 3 квитки — 3x грн","why":"Вартість = ціна · кількість."},{"do":"3x + 95 = 545","why":"Квитки й попкорн разом коштують 545 грн."},{"do":"3x = 545 − 95, 3x = 450","why":"Перенесли 95 праворуч зі зміною знака."},{"do":"x = 150","why":"Поділили обидві частини на 3."},{"do":"Перевірка: 3 · 150 + 95 = 450 + 95 = 545","why":"Сума збігається з умовою."}],"answer":"Відповідь: квиток коштує 150 грн."},{"task":"Сім'я хоче купити пральну машину за 14 400 грн. Уже відкладено 3 600 грн. Скільки місяців треба відкладати по 1 800 грн, щоб вистачило на покупку?","steps":[{"do":"Нехай треба x місяців; за них відкладуть 1 800x грн","why":"Позначили невідоме буквою."},{"do":"3 600 + 1 800x = 14 400","why":"Те, що вже є, плюс нові заощадження — це ціна машини."},{"do":"1 800x = 14 400 − 3 600, 1 800x = 10 800","why":"Перенесли 3 600 праворуч зі зміною знака."},{"do":"x = 10 800 : 1 800, x = 6","why":"Поділили обидві частини на 1 800."},{"do":"Перевірка: 3 600 + 1 800 · 6 = 3 600 + 10 800 = 14 400","why":"Сума дорівнює ціні машини."}],"answer":"Відповідь: 6 місяців."},{"task":"Автомобіль їде зі швидкістю 54 км/год. Від миті, коли водій побачив пішохода, до повної зупинки авто проїжджає 35 м. Гальмівний шлях на 5 м довший, ніж шлях, який авто проїде, поки водій реагує (ще не тисне на гальмо). Скільки метрів авто проїде, перш ніж водій почне гальмувати?","steps":[{"do":"Нехай до початку гальмування — x м, тоді гальмівний шлях — (x + 5) м","why":"«На 5 м довший» — додаємо 5."},{"do":"x + (x + 5) = 35","why":"Разом до зупинки — 35 м."},{"do":"2x = 35 − 5, 2x = 30","why":"Звели подібні й перенесли 5 праворуч зі зміною знака."},{"do":"x = 15","why":"Поділили обидві частини на 2."},{"do":"Перевірка: 15 + 20 = 35","why":"Сума збігається з умовою."}],"answer":"Відповідь: 15 м. А до повної зупинки — аж 35 м, тому перед близькою машиною дорогу не переходять."}],"mistakes":["Забувають те, що вже є: пишуть 1 800x = 14 400 і отримують 8 місяців. Правильно: врахувати вже відкладені 3 600 грн.","Змішують одиниці: швидкість у км/год, а час у хвилинах. Правильно: спершу переведи, наприклад 15 хв = 0,25 год.","Залишають відповідь «4,5 місяця», хоча відкладають раз на місяць. Правильно: за 4 місяці не вистачить, тож потрібно 5 місяців."],"check":[{"q":"Безпека руху: автомобіль їде зі швидкістю 15 м/с (це 54 км/год), до пішохідного переходу йому 60 м. Пішохід іде зі швидкістю 1 м/с, дорога завширшки 7 м. Чи встигне пішохід перейти дорогу, поки авто доїде до переходу?","options":["Так, встигне","Ні, не встигне"],"correct":1,"a":"Авто: 15t = 60, t = 4 с. Пішоходу треба 7 : 1 = 7 с, а 7 > 4 — він <b>не встигне<\/b>. Переходь, лише коли машина зупинилася, а на світлофорі — на зелене."},{"q":"Тато купив 2 однакові футболки й кепку за 180 грн і заплатив 760 грн. Скільки гривень коштує одна футболка?","accept":["290"],"a":"2x + 180 = 760, 2x = 580, x = 290. Перевірка: 2 · 290 + 180 = 760."},{"q":"Пастка: Марко збирає на велосипед за 7 000 грн і відкладає по 1 500 грн щомісяця (спочатку грошей немає). Через скільки повних місяців він зможе купити велосипед?","accept":["5"],"a":"1 500x = 7 000, x = 7 000 : 1 500 ≈ 4,7. За 4 місяці буде лише 6 000 грн — замало, а за 5 місяців — 7 500 грн. Отже, 5 місяців."}]}}]}]},{"id":"A2","subject":"algebra","name":"Цілі вирази","what":"Вирази з буквами, степені, одночлени й многочлени. Учимося спрощувати вирази й розкладати їх на множники.","topics":[{"id":"A2.1","name":"Вирази зі змінними","what":"Що таке вираз зі змінними, його значення і тотожні перетворення.","subtopics":[{"id":"A2.1.1","name":"Числові вирази й вирази зі змінними","status":"ready","programmeRef":"Вирази зі змінними. Цілі раціональні вирази.","lesson":{"what":"<b>Числовий вираз<\/b> складається з чисел, знаків дій і дужок, наприклад 3 · (5 − 2). <b>Вираз зі змінними<\/b> містить ще й букви — <b>змінні<\/b>, наприклад 2a + 7. Якщо підставити числа замість змінних і виконати дії, отримаємо <b>значення виразу<\/b>.","ideas":["Числовий вираз має одне значення. Значення виразу зі змінними залежить від того, які числа підставили: 2a + 7 при a = 1 дорівнює 9, а при a = 4 — 15.","Між числом і буквою знак множення не пишуть: 3x означає 3 · x, ab означає a · b.","Порядок дій той самий, що й з числами: дужки → множення й ділення → додавання й віднімання. Від'ємне число підставляй у дужках: 2x при x = −3 — це 2 · (−3).","Вирази з чисел і змінних, у яких є лише додавання, віднімання, множення й ділення на число (не на змінну), називають <b>цілими виразами<\/b>: 3x − 5, ab, x : 4. Вираз 5 : x — не цілий, бо в ньому ділення на змінну."],"rules":[{"f":"2a + 7 при a = 4: 2 · 4 + 7 = 15","means":"Щоб знайти значення виразу, підстав число замість змінної й виконай дії по порядку."}],"examples":[{"task":"Знайди значення числового виразу 18 − 4 · (7 − 5).","steps":[{"do":"7 − 5 = 2","why":"Спершу дія в дужках."},{"do":"4 · 2 = 8","why":"Множення виконуємо раніше за віднімання."},{"do":"18 − 8 = 10","why":"Залишилося віднімання."}],"answer":"Відповідь: 10."},{"task":"Знайди значення виразу 3x − 2y при x = −2, y = 5.","steps":[{"do":"3 · (−2) − 2 · 5","why":"Підставляємо числа замість букв; від'ємне число — у дужках."},{"do":"3 · (−2) = −6; 2 · 5 = 10","why":"Спершу множення."},{"do":"−6 − 10 = −16","why":"Від −6 віднімаємо ще 10."}],"answer":"Відповідь: −16."},{"task":"Зошит коштує a грн, ручка — b грн. Запиши вираз для вартості 5 зошитів і 2 ручок. Знайди його значення при a = 18, b = 12.","steps":[{"do":"5 зошитів коштують 5a грн, 2 ручки — 2b грн","why":"Вартість = ціна · кількість."},{"do":"Уся покупка: 5a + 2b","why":"Складаємо вартість зошитів і ручок."},{"do":"5 · 18 + 2 · 12 = 90 + 24","why":"Підставляємо a = 18, b = 12 і множимо."},{"do":"90 + 24 = 114","why":"Додаємо."}],"answer":"Відповідь: 5a + 2b; при a = 18, b = 12 покупка коштує 114 грн."}],"mistakes":["При x = −3 пишуть 2x = 2 − 3. Правильно: 2x = 2 · (−3) = −6 — від'ємне число бери в дужки.","Рахують зліва направо без порядку дій: 2 + 3 · 4 = 5 · 4 = 20. Правильно: спершу множення, 2 + 12 = 14.","При a = 5 записують 4a як 45. Правильно: 4a — це 4 · a, тобто 4 · 5 = 20."],"check":[{"q":"Який з виразів — числовий?","options":["2x + 1","(7 − 3) · 5","a : 4"],"correct":1,"a":"У виразі (7 − 3) · 5 лише числа, знаки дій і дужки. У двох інших є букви — це вирази зі змінними."},{"q":"Пастка: знайди значення виразу 10 − 2x при x = −3.","accept":["16"],"a":"10 − 2 · (−3) = 10 − (−6) = 10 + 6 = 16. Мінус на мінус дає плюс."},{"q":"Таксі бере 40 грн за посадку і 15 грн за кожен кілометр. Поїздка на n кілометрів коштує 40 + 15n грн. Скільки гривень коштує поїздка на 6 км?","accept":["130"],"a":"40 + 15 · 6 = 40 + 90 = 130 грн."}]}},{"id":"A2.1.2","name":"Тотожність і тотожні перетворення","status":"ready","programmeRef":"Тотожність. Тотожні перетворення виразу.","lesson":{"what":"Два вирази <b>тотожно рівні<\/b>, якщо при будь-яких значеннях змінних їхні значення однакові. Рівність, правильну при будь-яких значеннях змінних, називають <b>тотожністю<\/b>. Заміну виразу тотожно рівним йому виразом називають <b>тотожним перетворенням<\/b>.","ideas":["3(x + 2) і 3x + 6 тотожно рівні: розкрили дужки — і при будь-якому x значення однакові. Отже, 3(x + 2) = 3x + 6 — тотожність.","Тотожні перетворення ти вже вмієш робити: переставляти доданки чи множники, розкривати дужки, зводити подібні доданки.","Щоб <b>довести тотожність<\/b>, перетвори одну частину так, щоб вийшла інша, або обидві частини — до одного й того самого виразу.","Щоб показати, що рівність <b>не<\/b> тотожність, досить одного значення змінної, при якому частини різні."],"rules":[{"f":"a + b = b + a; ab = ba","means":"Доданки й множники можна переставляти — це тотожності."},{"f":"a(b + c) = ab + ac","means":"Розкриття дужок — тотожне перетворення: значення виразу не змінюється."}],"examples":[{"task":"Спрости вираз 4(x − 3) + 5x.","steps":[{"do":"4x − 12 + 5x","why":"Розкриваємо дужки: 4 множимо на кожен доданок."},{"do":"9x − 12","why":"Зводимо подібні доданки: 4x + 5x = 9x."},{"do":"Перевірка при x = 1: 4 · (1 − 3) + 5 · 1 = −3 і 9 · 1 − 12 = −3","why":"Значення однакові — перетворення, схоже, правильне."}],"answer":"Відповідь: 9x − 12."},{"task":"Доведи тотожність 5(a + 2) − 3a = 2(a + 5).","steps":[{"do":"Ліва частина: 5a + 10 − 3a","why":"Розкриваємо дужки."},{"do":"5a + 10 − 3a = 2a + 10","why":"Зводимо подібні доданки: 5a − 3a = 2a."},{"do":"Права частина: 2(a + 5) = 2a + 10","why":"Розкриваємо дужки."},{"do":"2a + 10 = 2a + 10","why":"Обидві частини звели до одного виразу."}],"answer":"Відповідь: обидві частини дорівнюють 2a + 10, отже рівність — тотожність."},{"task":"Чи є тотожністю рівність 2(x + 1) = 2x + 1?","steps":[{"do":"При x = 0 ліва частина: 2 · (0 + 1) = 2","why":"Шукаємо число, при якому частини різні."},{"do":"Права частина: 2 · 0 + 1 = 1","why":"Підставляємо те саме число."},{"do":"2 ≠ 1","why":"Одного такого числа досить, щоб рівність не була тотожністю."}],"answer":"Відповідь: ні. Правильна тотожність: 2(x + 1) = 2x + 2."}],"mistakes":["Перевіряють одне число й кажуть «тотожність». Рівність x · x = 2x правильна при x = 2 (4 = 4), але при x = 3 маємо 9 ≠ 6. Щоб довести тотожність, потрібні перетворення, а не одна перевірка.","Розкриваючи −(a − 4), пишуть −a − 4. Правильно: −a + 4. Інакше вираз змінюється — це вже не тотожне перетворення.","«Зводять» неподібні доданки: 3x + 2 = 5x. Правильно: 3x + 2 спростити не можна, бо 3x і 2 — не подібні."],"check":[{"q":"Який вираз тотожно рівний виразу 2(3x − 1)?","options":["6x − 1","5x − 2","6x − 2"],"correct":2,"a":"2 · 3x − 2 · 1 = 6x − 2. Множимо на 2 <b>кожен<\/b> доданок у дужках."},{"q":"Пастка: чи є рівність a + a = a · a тотожністю?","options":["Ні","Так, бо при a = 2 маємо 2 + 2 = 2 · 2"],"correct":0,"a":"Ні: при a = 3 ліва частина 6, а права 9. Збіг при одному числі ще не робить рівність тотожністю."},{"q":"Оля купила 3 пакети соку по x грн, а потім ще 2 такі самі. Вираз 3x + 2x тотожно рівний 5x. Скільки гривень вона заплатила, якщо x = 24?","accept":["120"],"a":"3x + 2x = 5x, а 5 · 24 = 120 грн. Перевірка: 3 · 24 + 2 · 24 = 72 + 48 = 120."}]}}]},{"id":"A2.2","name":"Степінь з натуральним показником","what":"Короткий запис множення однакових множників і його властивості.","subtopics":[{"id":"A2.2.1","name":"Що таке степінь","status":"ready","programmeRef":"Степінь з натуральним показником.","lesson":{"what":"<b>Степінь<\/b> a<sup>n<\/sup> — короткий запис добутку n однакових множників a: a · a · … · a. Число a — <b>основа<\/b> степеня, n — <b>показник<\/b>: скільки разів a стоїть множником. Тут n — натуральне число: 1, 2, 3, …","ideas":["2<sup>3<\/sup> = 2 · 2 · 2 = 8, а не 2 · 3 = 6. Дію знаходження степеня називають <b>піднесенням до степеня<\/b>.","a<sup>1<\/sup> = a. Запис a<sup>2<\/sup> читають «a в квадраті», a<sup>3<\/sup> — «a в кубі».","Від'ємна основа: з парним показником результат додатний, з непарним — від'ємний: (−2)<sup>4<\/sup> = 16, (−2)<sup>3<\/sup> = −8.","−3<sup>2<\/sup> і (−3)<sup>2<\/sup> — різні вирази: −3<sup>2<\/sup> = −(3 · 3) = −9, а (−3)<sup>2<\/sup> = 9. Показник стосується лише того, що стоїть безпосередньо під ним.","Порядок дій: дужки → степінь → множення й ділення → додавання й віднімання."],"rules":[{"f":"a<sup>n<\/sup> = a · a · … · a (n множників)","means":"a — основа, n — показник: скільки разів a стоїть множником."},{"f":"a<sup>1<\/sup> = a","means":"Степінь з показником 1 — саме число."}],"examples":[{"task":"Обчисли 3<sup>4<\/sup>.","steps":[{"do":"3<sup>4<\/sup> = 3 · 3 · 3 · 3","why":"Показник 4 — чотири множники 3."},{"do":"3 · 3 = 9; 9 · 3 = 27","why":"Множимо по черзі."},{"do":"27 · 3 = 81","why":"Останній множник."}],"answer":"Відповідь: 81."},{"task":"Обчисли (−2)<sup>5<\/sup> і −2<sup>4<\/sup>.","steps":[{"do":"(−2)<sup>5<\/sup> = (−2) · (−2) · (−2) · (−2) · (−2)","why":"Основа −2 у дужках — множимо саме −2."},{"do":"(−2)<sup>5<\/sup> = −32","why":"2<sup>5<\/sup> = 32, а від'ємних множників п'ять (непарне число) — знак «−»."},{"do":"−2<sup>4<\/sup> = −(2 · 2 · 2 · 2)","why":"Дужок немає: до степеня підносимо лише 2, а мінус залишається спереду."},{"do":"−2<sup>4<\/sup> = −16","why":"2 · 2 · 2 · 2 = 16."}],"answer":"Відповідь: (−2)<sup>5<\/sup> = −32; −2<sup>4<\/sup> = −16."},{"task":"Знайди значення виразу 2x<sup>3<\/sup> − x<sup>2<\/sup> при x = −3.","steps":[{"do":"2 · (−3)<sup>3<\/sup> − (−3)<sup>2<\/sup>","why":"Підставляємо −3 у дужках."},{"do":"(−3)<sup>3<\/sup> = −27; (−3)<sup>2<\/sup> = 9","why":"Спершу степені."},{"do":"2 · (−27) − 9 = −54 − 9","why":"Потім множення."},{"do":"−54 − 9 = −63","why":"Наостанок віднімання."}],"answer":"Відповідь: −63."}],"mistakes":["2<sup>3<\/sup> рахують як 2 · 3 = 6. Правильно: 2 · 2 · 2 = 8 — показник каже, скільки множників, а не на що множити.","−3<sup>2<\/sup> рахують як 9. Правильно: −3<sup>2<\/sup> = −(3 · 3) = −9, а 9 — це (−3)<sup>2<\/sup>.","2 · 3<sup>2<\/sup> рахують як 6<sup>2<\/sup> = 36. Правильно: спершу степінь, 2 · 9 = 18."],"check":[{"q":"Бактерія щогодини ділиться навпіл: з однієї стає 2, з двох — 4 і так далі. Скільки бактерій буде через 5 годин, якщо спочатку була одна? (Це 2<sup>5<\/sup>.)","accept":["32"],"a":"2<sup>5<\/sup> = 2 · 2 · 2 · 2 · 2 = 32."},{"q":"Пастка: обчисли −2<sup>4<\/sup>.","options":["16","−8","−16"],"correct":2,"a":"Дужок немає, тож до степеня підносимо лише 2: −2<sup>4<\/sup> = −(2 · 2 · 2 · 2) = −16. А (−2)<sup>4<\/sup> було б 16."},{"q":"Знайди значення виразу x<sup>2<\/sup> + x<sup>3<\/sup> при x = −2.","accept":["−4"],"a":"(−2)<sup>2<\/sup> + (−2)<sup>3<\/sup> = 4 + (−8) = −4."}]}},{"id":"A2.2.2","name":"Властивості степеня","status":"ready","programmeRef":"Властивості степеня з натуральним показником.","lesson":{"what":"Для степенів з <b>однаковою основою<\/b> є прості правила: при множенні показники додають, при діленні — віднімають, а при піднесенні степеня до степеня — множать. Кожне правило легко пояснити, якщо розписати множники.","ideas":["a<sup>2<\/sup> · a<sup>3<\/sup> = (a · a) · (a · a · a) = a<sup>5<\/sup>: усього 2 + 3 = 5 множників.","a<sup>5<\/sup> : a<sup>2<\/sup> = a<sup>3<\/sup>: з п'яти множників a «скоротили» два (a ≠ 0).","(a<sup>2<\/sup>)<sup>3<\/sup> = a<sup>2<\/sup> · a<sup>2<\/sup> · a<sup>2<\/sup> = a<sup>6<\/sup>: три рази по два множники — 2 · 3 = 6.","(ab)<sup>3<\/sup> = ab · ab · ab = a<sup>3<\/sup>b<sup>3<\/sup>: до степеня підносимо кожен множник.","Правила працюють лише для однакових основ: 2<sup>3<\/sup> · 3<sup>2<\/sup> так не спростиш, рахуй окремо: 8 · 9 = 72."],"rules":[{"f":"a<sup>m<\/sup> · a<sup>n<\/sup> = a<sup>m+n<\/sup>","means":"Множимо степені з однаковою основою — основу залишаємо, показники додаємо."},{"f":"a<sup>m<\/sup> : a<sup>n<\/sup> = a<sup>m−n<\/sup> (a ≠ 0, m > n)","means":"Ділимо — показники віднімаємо."},{"f":"(a<sup>m<\/sup>)<sup>n<\/sup> = a<sup>mn<\/sup>; (ab)<sup>n<\/sup> = a<sup>n<\/sup>b<sup>n<\/sup>","means":"Степінь до степеня — показники множимо; добуток до степеня — підносимо кожен множник."}],"examples":[{"task":"Спрости вираз x<sup>4<\/sup> · x · x<sup>3<\/sup>.","steps":[{"do":"x<sup>4<\/sup> · x<sup>1<\/sup> · x<sup>3<\/sup>","why":"Змінна без показника — це степінь з показником 1."},{"do":"x<sup>4+1+3<\/sup>","why":"Основи однакові — показники додаємо."},{"do":"x<sup>8<\/sup>","why":"4 + 1 + 3 = 8."}],"answer":"Відповідь: x<sup>8<\/sup>."},{"task":"Спрости вираз (a<sup>3<\/sup>)<sup>4<\/sup> : a<sup>7<\/sup>.","steps":[{"do":"(a<sup>3<\/sup>)<sup>4<\/sup> = a<sup>12<\/sup>","why":"Степінь до степеня — показники множимо: 3 · 4 = 12."},{"do":"a<sup>12<\/sup> : a<sup>7<\/sup> = a<sup>12−7<\/sup>","why":"Ділимо — показники віднімаємо."},{"do":"a<sup>5<\/sup>","why":"12 − 7 = 5."}],"answer":"Відповідь: a<sup>5<\/sup>."},{"task":"Обчисли зручним способом 4<sup>3<\/sup> · 25<sup>3<\/sup>.","steps":[{"do":"4<sup>3<\/sup> · 25<sup>3<\/sup> = (4 · 25)<sup>3<\/sup>","why":"Показники однакові — це добуток, піднесений до степеня, лише записаний навпаки."},{"do":"(4 · 25)<sup>3<\/sup> = 100<sup>3<\/sup>","why":"4 · 25 = 100."},{"do":"100<sup>3<\/sup> = 1 000 000","why":"100 · 100 · 100 — шість нулів."}],"answer":"Відповідь: 1 000 000."}],"mistakes":["При множенні множать показники: a<sup>2<\/sup> · a<sup>3<\/sup> = a<sup>6<\/sup>. Правильно: a<sup>5<\/sup> — показники додають.","Множать основи: 2<sup>3<\/sup> · 2<sup>4<\/sup> = 4<sup>7<\/sup>. Правильно: основа залишається 2, тож 2<sup>7<\/sup> = 128.","При діленні ділять показники: a<sup>8<\/sup> : a<sup>2<\/sup> = a<sup>4<\/sup>. Правильно: a<sup>6<\/sup> — показники віднімають."],"check":[{"q":"Спрости вираз y<sup>3<\/sup> · y<sup>6<\/sup>. Знайди показник степеня, який вийде.","accept":["9"],"a":"y<sup>3<\/sup> · y<sup>6<\/sup> = y<sup>3+6<\/sup> = y<sup>9<\/sup>. Показник — 9."},{"q":"Пастка: чому дорівнює (x<sup>2<\/sup>)<sup>5<\/sup>?","options":["x<sup>10<\/sup>","x<sup>7<\/sup>","x<sup>25<\/sup>"],"correct":0,"a":"Степінь до степеня — показники множимо: 2 · 5 = 10. x<sup>7<\/sup> — це x<sup>2<\/sup> · x<sup>5<\/sup>, а не (x<sup>2<\/sup>)<sup>5<\/sup>."},{"q":"Флешка вміщує 2<sup>5<\/sup> ГБ, а один фільм займає 2<sup>2<\/sup> ГБ. Скільки таких фільмів поміститься на флешці?","accept":["8"],"a":"2<sup>5<\/sup> : 2<sup>2<\/sup> = 2<sup>3<\/sup> = 8. Перевірка: 32 : 4 = 8."}]}}]},{"id":"A2.3","name":"Одночлени","what":"Добуток чисел і букв: стандартний вигляд, множення, піднесення до степеня.","subtopics":[{"id":"A2.3.1","name":"Одночлен стандартного вигляду","status":"ready","programmeRef":"Одночлен.","lesson":{"what":"<b>Одночлен<\/b> — добуток чисел, змінних і їхніх степенів, наприклад 3a<sup>2<\/sup>b, −x, 7. Одночлен <b>стандартного вигляду<\/b> має один числовий множник на першому місці — <b>коефіцієнт<\/b>, а кожна змінна трапляється один раз, у вигляді степеня: 6x<sup>3<\/sup>y. <b>Степінь одночлена<\/b> — сума показників усіх його змінних.","ideas":["Одночлени: 5ab, −x<sup>2<\/sup>, 0,4m, 9. Не одночлени: a + b (є додавання), 3 : x (ділення на змінну).","Щоб звести одночлен до стандартного вигляду, перемнож окремо всі числа й окремо однакові змінні, збираючи їх у степені.","Коефіцієнт 1 чи −1 не пишуть: у x<sup>2<\/sup>y коефіцієнт 1, у −ab — коефіцієнт −1.","Змінна без показника має показник 1: степінь одночлена 4xy<sup>3<\/sup> дорівнює 1 + 3 = 4. Степінь числа без змінних (не нуля) вважають рівним 0."],"rules":[{"f":"2a · 3b · a<sup>2<\/sup> = 6a<sup>3<\/sup>b","means":"Числа перемножили (2 · 3 = 6), однакові змінні зібрали в степінь (a · a<sup>2<\/sup> = a<sup>3<\/sup>)."},{"f":"−5x<sup>2<\/sup>y<sup>3<\/sup>: коефіцієнт −5, степінь 2 + 3 = 5","means":"Коефіцієнт — числовий множник, степінь — сума показників змінних."}],"examples":[{"task":"Зведи до стандартного вигляду одночлен 3a · 5b · a.","steps":[{"do":"3 · 5 = 15","why":"Перемножуємо числа."},{"do":"a · a = a<sup>2<\/sup>","why":"Однакові змінні збираємо в степінь."},{"do":"15a<sup>2<\/sup>b","why":"Коефіцієнт — спереду, далі змінні."}],"answer":"Відповідь: 15a<sup>2<\/sup>b."},{"task":"Зведи до стандартного вигляду −2x<sup>2<\/sup>y · 0,5xy<sup>3<\/sup> · (−4). Назви коефіцієнт і степінь.","steps":[{"do":"−2 · 0,5 · (−4) = 4","why":"Перемножуємо числа; два мінуси дають плюс."},{"do":"x<sup>2<\/sup> · x = x<sup>3<\/sup>; y · y<sup>3<\/sup> = y<sup>4<\/sup>","why":"Однакові основи — показники додаємо."},{"do":"4x<sup>3<\/sup>y<sup>4<\/sup>","why":"Записуємо в стандартному вигляді."},{"do":"Коефіцієнт 4; степінь 3 + 4 = 7","why":"Степінь — сума показників змінних."}],"answer":"Відповідь: 4x<sup>3<\/sup>y<sup>4<\/sup>; коефіцієнт 4, степінь 7."},{"task":"Зведи −a · 2b · (−3a<sup>2<\/sup>) до стандартного вигляду і знайди значення при a = −1, b = 2.","steps":[{"do":"(−1) · 2 · (−3) = 6","why":"Перед a стоїть мінус — це множник −1."},{"do":"a · a<sup>2<\/sup> = a<sup>3<\/sup>, отже маємо 6a<sup>3<\/sup>b","why":"Збираємо однакові змінні."},{"do":"6 · (−1)<sup>3<\/sup> · 2 = 6 · (−1) · 2","why":"Підставляємо в простіший вираз: (−1)<sup>3<\/sup> = −1."},{"do":"6 · (−1) · 2 = −12","why":"Множимо."}],"answer":"Відповідь: 6a<sup>3<\/sup>b; при a = −1, b = 2 значення −12."}],"mistakes":["Додають числа замість множення: 2x · 3x = 5x<sup>2<\/sup>. Правильно: 2 · 3 = 6, тож 6x<sup>2<\/sup>.","Вважають, що в −x<sup>2<\/sup> коефіцієнта немає. Правильно: коефіцієнт −1.","Беруть за степінь одночлена найбільший показник: у 3x<sup>2<\/sup>y<sup>4<\/sup> кажуть 4. Правильно: 2 + 4 = 6."],"check":[{"q":"Який з одночленів записано в стандартному вигляді?","options":["3a · 2b","−4a<sup>2<\/sup>b","a · 5 · a"],"correct":1,"a":"У −4a<sup>2<\/sup>b одне число спереду, і кожна змінна трапляється один раз. 3a · 2b = 6ab, a · 5 · a = 5a<sup>2<\/sup> — їх ще треба звести."},{"q":"Пастка: знайди степінь одночлена 7xy<sup>3<\/sup>.","accept":["4"],"a":"x — це x<sup>1<\/sup>, тож степінь 1 + 3 = 4. Коефіцієнт 7 у степінь не входить."},{"q":"Квадратна плитка має сторону a см. Підлогу в коридорі виклали 3 рядами по 4 плитки, тож її площа 3 · 4 · a · a см<sup>2<\/sup>. Запиши площу як одночлен стандартного вигляду. Який його коефіцієнт?","accept":["12"],"a":"3 · 4 · a · a = 12a<sup>2<\/sup>. Коефіцієнт — 12."}]}},{"id":"A2.3.2","name":"Множення одночленів і піднесення до степеня","status":"ready","programmeRef":"Піднесення одночленів до степеня. Множення одночленів.","lesson":{"what":"Щоб <b>помножити одночлени<\/b>, перемножують їхні коефіцієнти, а степені з однаковими основами — додаючи показники. Щоб <b>піднести одночлен до степеня<\/b>, підносять до цього степеня кожен множник: і коефіцієнт, і кожну змінну. Результат записують у стандартному вигляді.","ideas":["2a<sup>2<\/sup>b · (−3ab<sup>4<\/sup>) = −6a<sup>3<\/sup>b<sup>5<\/sup>: коефіцієнти 2 · (−3) = −6, показники a: 2 + 1, b: 1 + 4.","(3x<sup>2<\/sup>)<sup>3<\/sup> = 3<sup>3<\/sup> · (x<sup>2<\/sup>)<sup>3<\/sup> = 27x<sup>6<\/sup>: число теж підносимо до степеня.","Від'ємний коефіцієнт з парним показником стає додатним, з непарним — залишається від'ємним: (−2a)<sup>2<\/sup> = 4a<sup>2<\/sup>, (−2a)<sup>3<\/sup> = −8a<sup>3<\/sup>.","Коли в прикладі є і степінь, і множення, спершу підносимо до степеня, потім множимо."],"rules":[{"f":"a<sup>m<\/sup> · a<sup>n<\/sup> = a<sup>m+n<\/sup>","means":"Множимо однакові основи — показники додаємо."},{"f":"(ab)<sup>n<\/sup> = a<sup>n<\/sup>b<sup>n<\/sup>","means":"До степеня підносимо кожен множник одночлена."},{"f":"(a<sup>m<\/sup>)<sup>n<\/sup> = a<sup>mn<\/sup>","means":"Степінь до степеня — показники множимо."}],"examples":[{"task":"Помнож одночлени 4x<sup>3<\/sup>y і 5xy<sup>2<\/sup>.","steps":[{"do":"4 · 5 = 20","why":"Перемножуємо коефіцієнти."},{"do":"x<sup>3<\/sup> · x = x<sup>4<\/sup>","why":"Показники x додаємо: 3 + 1."},{"do":"y · y<sup>2<\/sup> = y<sup>3<\/sup>","why":"Показники y додаємо: 1 + 2."},{"do":"20x<sup>4<\/sup>y<sup>3<\/sup>","why":"Записуємо в стандартному вигляді."}],"answer":"Відповідь: 20x<sup>4<\/sup>y<sup>3<\/sup>."},{"task":"Піднеси до степеня (−2a<sup>3<\/sup>b)<sup>4<\/sup>.","steps":[{"do":"(−2)<sup>4<\/sup> = 16","why":"Коефіцієнт підносимо до степеня; показник парний — результат додатний."},{"do":"(a<sup>3<\/sup>)<sup>4<\/sup> = a<sup>12<\/sup>","why":"Показники множимо: 3 · 4."},{"do":"b<sup>4<\/sup>","why":"b теж підносимо до четвертого степеня."},{"do":"16a<sup>12<\/sup>b<sup>4<\/sup>","why":"Збираємо все разом."}],"answer":"Відповідь: 16a<sup>12<\/sup>b<sup>4<\/sup>."},{"task":"Спрости вираз (−3x<sup>2<\/sup>y)<sup>3<\/sup> · 2xy<sup>2<\/sup>.","steps":[{"do":"(−3x<sup>2<\/sup>y)<sup>3<\/sup> = −27x<sup>6<\/sup>y<sup>3<\/sup>","why":"Спершу степінь: (−3)<sup>3<\/sup> = −27, (x<sup>2<\/sup>)<sup>3<\/sup> = x<sup>6<\/sup>, y<sup>3<\/sup>."},{"do":"−27 · 2 = −54","why":"Множимо коефіцієнти."},{"do":"x<sup>6<\/sup> · x = x<sup>7<\/sup>; y<sup>3<\/sup> · y<sup>2<\/sup> = y<sup>5<\/sup>","why":"Показники однакових змінних додаємо."},{"do":"−54x<sup>7<\/sup>y<sup>5<\/sup>","why":"Записуємо в стандартному вигляді."}],"answer":"Відповідь: −54x<sup>7<\/sup>y<sup>5<\/sup>."}],"mistakes":["Забувають піднести коефіцієнт: (3a)<sup>2<\/sup> = 3a<sup>2<\/sup>. Правильно: 3<sup>2<\/sup> = 9, тож 9a<sup>2<\/sup>.","Додають показники замість множити: (x<sup>3<\/sup>)<sup>2<\/sup> = x<sup>5<\/sup>. Правильно: x<sup>6<\/sup>.","Множать коефіцієнт на показник: (2b)<sup>3<\/sup> = 6b<sup>3<\/sup>. Правильно: 2<sup>3<\/sup> = 8, тож 8b<sup>3<\/sup>."],"check":[{"q":"Помнож одночлени 3a<sup>2<\/sup>b і −2ab<sup>3<\/sup>.","options":["−6a<sup>2<\/sup>b<sup>3<\/sup>","−6a<sup>3<\/sup>b<sup>4<\/sup>","a<sup>3<\/sup>b<sup>4<\/sup>","6a<sup>3<\/sup>b<sup>4<\/sup>"],"correct":1,"a":"Коефіцієнти: 3 · (−2) = −6. a<sup>2<\/sup> · a = a<sup>3<\/sup>, b · b<sup>3<\/sup> = b<sup>4<\/sup>. Разом −6a<sup>3<\/sup>b<sup>4<\/sup>."},{"q":"Пастка: піднеси до степеня (−2x<sup>2<\/sup>)<sup>3<\/sup>.","options":["−8x<sup>6<\/sup>","−6x<sup>6<\/sup>","8x<sup>6<\/sup>","−8x<sup>5<\/sup>"],"correct":0,"a":"(−2)<sup>3<\/sup> = −8 (показник непарний — мінус залишається), (x<sup>2<\/sup>)<sup>3<\/sup> = x<sup>6<\/sup> (показники множимо). Разом −8x<sup>6<\/sup>."},{"q":"Ребро кубика з конструктора — 2a см, тож його об'єм (2a)<sup>3<\/sup> см<sup>3<\/sup>. Запиши об'єм як одночлен стандартного вигляду. Який його коефіцієнт?","accept":["8"],"a":"(2a)<sup>3<\/sup> = 2<sup>3<\/sup> · a<sup>3<\/sup> = 8a<sup>3<\/sup>. Коефіцієнт — 8, а не 6."}]}}]},{"id":"A2.4","name":"Многочлени і дії з ними","what":"Сума одночленів: зведення подібних, додавання, віднімання, множення.","subtopics":[{"id":"A2.4.1","name":"Многочлен і подібні члени","status":"ready","programmeRef":"Многочлен. Подібні члени многочлена та їх зведення. Степінь многочлена.","lesson":{"what":"<b>Многочлен<\/b> — це сума одночленів, наприклад 3x<sup>2<\/sup> − 5x + 7. Кожен одночлен у цій сумі — <b>член многочлена<\/b>. <b>Подібні члени<\/b> мають однакову буквену частину (ті самі букви в тих самих степенях), наприклад 4xy і −7xy.","ideas":["Віднімання вважаємо додаванням: 3x<sup>2<\/sup> − 5x + 7 = 3x<sup>2<\/sup> + (−5x) + 7. Тож члени цього многочлена — 3x<sup>2<\/sup>, −5x і 7: знак належить члену.","<b>Звести подібні члени<\/b> — означає додати їхні коефіцієнти (числа перед буквами), а буквену частину залишити без змін: 4xy − 7xy = −3xy.","<b>Многочлен стандартного вигляду<\/b> — такий, у якому кожен член записано як одночлен стандартного вигляду і подібних членів немає.","<b>Степінь многочлена<\/b> стандартного вигляду — найбільший зі степенів його членів. Степінь члена — сума показників усіх його букв: у 2x<sup>2<\/sup>y степінь 2 + 1 = 3, а в числа без букв — 0.","Многочлен із двох членів називають <b>двочленом<\/b>, із трьох — <b>тричленом<\/b>. Одночлен теж вважають многочленом."],"rules":[{"f":"5a + 2b − 3a + b = (5 − 3)a + (2 + 1)b = 2a + 3b","means":"Додаємо коефіцієнти подібних членів, буквена частина не змінюється."},{"f":"3x<sup>4<\/sup> − x<sup>2<\/sup>y<sup>3<\/sup> + 1: степені членів 4, 5 і 0 → степінь многочлена 5","means":"Степінь многочлена — найбільший степінь його члена (у x<sup>2<\/sup>y<sup>3<\/sup> це 2 + 3 = 5)."}],"examples":[{"task":"Зведи подібні члени: 7x − 3y + 2x + 5y − x.","steps":[{"do":"Члени з x: 7x, 2x і −x; члени з y: −3y і 5y","why":"У подібних членів однакова буквена частина. −x — це −1 · x."},{"do":"7x + 2x − x = (7 + 2 − 1)x = 8x","why":"Додаємо коефіцієнти, x залишаємо."},{"do":"−3y + 5y = (−3 + 5)y = 2y","why":"Так само з y."}],"answer":"Відповідь: 8x + 2y."},{"task":"Зведи многочлен 3x<sup>2<\/sup> + 4x − 5x<sup>2<\/sup> + 2 − 4x + x<sup>2<\/sup> до стандартного вигляду і знайди його степінь.","steps":[{"do":"3x<sup>2<\/sup> − 5x<sup>2<\/sup> + x<sup>2<\/sup> = (3 − 5 + 1)x<sup>2<\/sup> = −x<sup>2<\/sup>","why":"Члени з x<sup>2<\/sup> — подібні, додаємо коефіцієнти."},{"do":"4x − 4x = 0","why":"Протилежні члени разом дають нуль — їх просто викреслюємо."},{"do":"3x<sup>2<\/sup> + 4x − 5x<sup>2<\/sup> + 2 − 4x + x<sup>2<\/sup> = −x<sup>2<\/sup> + 2","why":"Збираємо те, що залишилося."},{"do":"Степені членів −x<sup>2<\/sup> і 2: 2 і 0; найбільший — 2","why":"Число без букв має степінь 0."}],"answer":"Відповідь: −x<sup>2<\/sup> + 2; степінь многочлена — 2."},{"task":"Спрости вираз 2ab<sup>2<\/sup> − 3a<sup>2<\/sup>b + 5ab<sup>2<\/sup> + a<sup>2<\/sup>b і знайди його значення при a = −1, b = 2.","steps":[{"do":"2ab<sup>2<\/sup> + 5ab<sup>2<\/sup> = 7ab<sup>2<\/sup>","why":"Подібні: однакова буквена частина ab<sup>2<\/sup>."},{"do":"−3a<sup>2<\/sup>b + a<sup>2<\/sup>b = −2a<sup>2<\/sup>b","why":"Подібні: a<sup>2<\/sup>b. Коефіцієнти: −3 + 1 = −2. А ab<sup>2<\/sup> і a<sup>2<\/sup>b — <b>не<\/b> подібні: степені букв різні."},{"do":"7 · (−1) · 2<sup>2<\/sup> − 2 · (−1)<sup>2<\/sup> · 2 = −28 − 4 = −32","why":"Підставляємо числа у спрощений вираз — рахувати менше."}],"answer":"Відповідь: 7ab<sup>2<\/sup> − 2a<sup>2<\/sup>b; при a = −1, b = 2 його значення −32."}],"mistakes":["Додають неподібні члени: 3x + 2y = 5xy. Правильно: 3x і 2y не подібні, вираз 3x + 2y уже не спрощується.","Вважають подібними x<sup>2<\/sup>y і xy<sup>2<\/sup>. Правильно: букви ті самі, але степені різні — члени не подібні.","Додають і показники: 2x<sup>2<\/sup> + 3x<sup>2<\/sup> = 5x<sup>4<\/sup>. Правильно: показник не змінюється — 5x<sup>2<\/sup>."],"check":[{"q":"Зведи подібні члени: 4a − 7b − 6a + 2b.","options":["−2a − 5b","10a − 5b","−2a + 5b","−7ab"],"correct":0,"a":"4a − 6a = −2a; −7b + 2b = −5b. Разом −2a − 5b."},{"q":"Пастка: знайди степінь многочлена x<sup>3<\/sup> + 2x<sup>2<\/sup>y<sup>2<\/sup> − 5.","accept":["4"],"a":"Степені членів: 3, 2 + 2 = 4 і 0. Найбільший — 4, а не 3: у члені 2x<sup>2<\/sup>y<sup>2<\/sup> рахуємо показники обох букв."},{"q":"Мама купила 3 зошити по x грн і 2 ручки по y грн, а тато — ще 5 таких самих зошитів. Уся покупка коштує 3x + 2y + 5x грн. Зведи подібні члени і знайди, скільки гривень заплатили, якщо зошит коштує 15 грн, а ручка — 20 грн.","accept":["160"],"a":"3x + 2y + 5x = 8x + 2y. 8 · 15 + 2 · 20 = 120 + 40 = 160 грн."}]}},{"id":"A2.4.2","name":"Додавання і віднімання многочленів","status":"ready","programmeRef":"Додавання, віднімання і множення многочленів.","lesson":{"what":"Щоб додати чи відняти многочлени, беремо кожен у дужки, розкриваємо дужки і зводимо подібні члени. Результат — теж многочлен.","ideas":["Якщо перед дужками стоїть «+», дужки просто прибираємо — знаки членів не змінюються.","Якщо перед дужками стоїть «−», прибираючи дужки, змінюємо знак <b>кожного<\/b> члена в дужках на протилежний.","Многочлен, який віднімаєш, завжди бери в дужки. Так мінус не загубиться.","Після розкриття дужок позначай подібні члени однаково (підкресли однією чи двома рисками) — так нічого не пропустиш."],"rules":[{"f":"+(a − b + c) = a − b + c","means":"Плюс перед дужками: знаки не змінюються."},{"f":"−(a − b + c) = −a + b − c","means":"Мінус перед дужками: знак кожного члена змінюється на протилежний."}],"examples":[{"task":"Знайди суму многочленів 3x<sup>2<\/sup> − 2x + 1 і x<sup>2<\/sup> + 5x − 4.","steps":[{"do":"(3x<sup>2<\/sup> − 2x + 1) + (x<sup>2<\/sup> + 5x − 4) = 3x<sup>2<\/sup> − 2x + 1 + x<sup>2<\/sup> + 5x − 4","why":"Кожен многочлен — у дужки. Перед другими дужками «+», знаки не змінюються."},{"do":"3x<sup>2<\/sup> + x<sup>2<\/sup> = 4x<sup>2<\/sup>; −2x + 5x = 3x; 1 − 4 = −3","why":"Зводимо подібні члени."},{"do":"3x<sup>2<\/sup> − 2x + 1 + x<sup>2<\/sup> + 5x − 4 = 4x<sup>2<\/sup> + 3x − 3","why":"Записуємо результат."}],"answer":"Відповідь: 4x<sup>2<\/sup> + 3x − 3."},{"task":"Знайди різницю: (5a − 3b + 2) − (2a − 4b + 7).","steps":[{"do":"(5a − 3b + 2) − (2a − 4b + 7) = 5a − 3b + 2 − 2a + 4b − 7","why":"Мінус перед дужками: 2a → −2a, −4b → +4b, 7 → −7."},{"do":"5a − 2a = 3a; −3b + 4b = b; 2 − 7 = −5","why":"Зводимо подібні члени."},{"do":"5a − 3b + 2 − 2a + 4b − 7 = 3a + b − 5","why":"Записуємо результат."}],"answer":"Відповідь: 3a + b − 5."},{"task":"Спрости вираз (x<sup>2<\/sup> − 3xy) − (2x<sup>2<\/sup> − xy + y<sup>2<\/sup>) + (x<sup>2<\/sup> + y<sup>2<\/sup>).","steps":[{"do":"(x<sup>2<\/sup> − 3xy) − (2x<sup>2<\/sup> − xy + y<sup>2<\/sup>) + (x<sup>2<\/sup> + y<sup>2<\/sup>) = x<sup>2<\/sup> − 3xy − 2x<sup>2<\/sup> + xy − y<sup>2<\/sup> + x<sup>2<\/sup> + y<sup>2<\/sup>","why":"Другі дужки — з мінусом: змінюємо знаки всіх трьох членів. Треті — з плюсом."},{"do":"x<sup>2<\/sup> − 2x<sup>2<\/sup> + x<sup>2<\/sup> = 0; −y<sup>2<\/sup> + y<sup>2<\/sup> = 0","why":"Ці подібні члени разом дають нуль."},{"do":"−3xy + xy = −2xy","why":"Коефіцієнти: −3 + 1 = −2."}],"answer":"Відповідь: −2xy."}],"mistakes":["Змінюють знак лише першого члена: −(2a − 4b) = −2a − 4b. Правильно: −(2a − 4b) = −2a + 4b — знак змінюється в кожного члена.","Віднімають многочлен без дужок: 5x − 2x + 3 замість 5x − (2x + 3). Правильно: 5x − (2x + 3) = 5x − 2x − 3 = 3x − 3.","Додають показники під час зведення: x<sup>2<\/sup> + x<sup>2<\/sup> = x<sup>4<\/sup>. Правильно: x<sup>2<\/sup> + x<sup>2<\/sup> = 2x<sup>2<\/sup>."],"check":[{"q":"Знайди суму (2x<sup>2<\/sup> + 3x − 1) + (x<sup>2<\/sup> − 3x + 4).","options":["3x<sup>2<\/sup> + 6x + 3","3x<sup>2<\/sup> + 3","3x<sup>4<\/sup> + 3","x<sup>2<\/sup> + 3"],"correct":1,"a":"2x<sup>2<\/sup> + x<sup>2<\/sup> = 3x<sup>2<\/sup>; 3x − 3x = 0; −1 + 4 = 3. Разом 3x<sup>2<\/sup> + 3."},{"q":"Пастка: спрости (4a − b) − (a − 3b).","options":["3a − 4b","3a − 2b","3a + 2b","5a + 2b"],"correct":2,"a":"4a − b − a + 3b = 3a + 2b. Мінус перед дужками змінює знак і в a, і в −3b."},{"q":"У Петра було (5x + 20) грн, він витратив (2x + 35) грн. Скільки гривень у нього залишилося, якщо x = 40?","accept":["105"],"a":"(5x + 20) − (2x + 35) = 5x + 20 − 2x − 35 = 3x − 15. При x = 40: 120 − 15 = 105 грн."}]}},{"id":"A2.4.3","name":"Множення одночлена на многочлен","status":"ready","programmeRef":"Додавання, віднімання і множення многочленів.","lesson":{"what":"Щоб помножити одночлен на многочлен, множимо цей одночлен на <b>кожен<\/b> член многочлена і результати додаємо. Це розподільний закон множення, який ти вже знаєш: a(b + c) = ab + ac.","ideas":["Множимо по черзі на кожен член — так «розкриваємо дужки».","Знак члена множиться разом із ним: −2x · (−3) = 6x, бо мінус на мінус — плюс.","Однакові букви множимо, додаючи показники: x<sup>2<\/sup> · x<sup>3<\/sup> = x<sup>5<\/sup>.","Скільки членів у дужках, стільки й добутків. Порахуй, чи нічого не пропустив."],"rules":[{"f":"a(b + c − d) = ab + ac − ad","means":"Одночлен a множимо на кожен член у дужках і результати додаємо."}],"examples":[{"task":"Помнож: 3x(2x − 5).","steps":[{"do":"3x · 2x = 6x<sup>2<\/sup>","why":"Числа множимо: 3 · 2 = 6; x · x = x<sup>2<\/sup>."},{"do":"3x · (−5) = −15x","why":"Плюс на мінус — мінус."},{"do":"3x(2x − 5) = 6x<sup>2<\/sup> − 15x","why":"Записуємо обидва добутки."}],"answer":"Відповідь: 6x<sup>2<\/sup> − 15x."},{"task":"Помнож: −2a<sup>2<\/sup>(a<sup>2<\/sup> − 3ab + 4b).","steps":[{"do":"−2a<sup>2<\/sup> · a<sup>2<\/sup> = −2a<sup>4<\/sup>","why":"Показники a додаємо: 2 + 2 = 4."},{"do":"−2a<sup>2<\/sup> · (−3ab) = 6a<sup>3<\/sup>b","why":"Мінус на мінус — плюс; a<sup>2<\/sup> · a = a<sup>3<\/sup>."},{"do":"−2a<sup>2<\/sup> · 4b = −8a<sup>2<\/sup>b","why":"Мінус на плюс — мінус."},{"do":"−2a<sup>2<\/sup>(a<sup>2<\/sup> − 3ab + 4b) = −2a<sup>4<\/sup> + 6a<sup>3<\/sup>b − 8a<sup>2<\/sup>b","why":"Три члени в дужках — три добутки."}],"answer":"Відповідь: −2a<sup>4<\/sup> + 6a<sup>3<\/sup>b − 8a<sup>2<\/sup>b."},{"task":"Розв'яжи рівняння 4x(x − 3) − 2x(2x + 1) = 28.","steps":[{"do":"4x(x − 3) = 4x<sup>2<\/sup> − 12x","why":"Розкриваємо перші дужки."},{"do":"−2x(2x + 1) = −4x<sup>2<\/sup> − 2x","why":"Множимо на −2x разом зі знаком."},{"do":"4x<sup>2<\/sup> − 12x − 4x<sup>2<\/sup> − 2x = −14x","why":"4x<sup>2<\/sup> і −4x<sup>
