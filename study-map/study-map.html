м — залежних слів немає) — <i>не закінчений учора малюнок<\/i> (окремо — є залежне слово <i>учора<\/i>) — <i>Малюнок не закінчений.<\/i> (окремо — дієприкметник у присудку).","Окремо пишемо й тоді, коли є протиставлення зі сполучником <i>а<\/i>: <i>не прочитана, а прослухана книжка<\/i>.","Щоб не помилитися, спершу знайди граматичну основу речення, а потім — чи є при дієприкметнику залежні слова."],"rules":[{"f":"не + дієприкметник <b>без<\/b> залежних слів → <b>разом<\/b>","means":"<i>непрочитана книжка, неполитий город<\/i>."},{"f":"не + дієприкметник <b>із<\/b> залежними словами → <b>окремо<\/b>","means":"<i>не прочитана мною книжка, не политий учора город<\/i>."},{"f":"не + дієприкметник у присудку → <b>окремо<\/b>","means":"<i>Город не политий. Книжка не прочитана.<\/i>"}],"examples":[{"task":"Розкрий дужки: <i>(не)зачинені двері<\/i>; <i>(не)зачинені вітром двері<\/i>.","steps":[{"do":"У першому сполученні при дієприкметнику немає залежних слів.","why":"Пишемо разом: <i>незачинені двері<\/i>."},{"do":"У другому — зачинені (чим?) <i>вітром<\/i>: є залежне слово.","why":"Пишемо окремо: <i>не зачинені вітром двері<\/i>."}],"answer":"<i>Незачинені двері; не зачинені вітром двері.<\/i>"},{"task":"Розкрий дужки: <i>Задача (не)розв’язана.<\/i>","steps":[{"do":"Граматична основа — <i>задача не розв’язана<\/i>.","why":"Дієприкметник тут не означення, а частина присудка."},{"do":"Дієприкметник у ролі присудка пишемо з не окремо.","why":"Так само, як <i>не<\/i> з дієсловом: <i>задачу не розв’язали<\/i>."}],"answer":"<i>Задача не розв’язана.<\/i>"},{"task":"Знайди й виправ помилки: <i>На столі лежав не підписаний зошит. Невивчений вчасно вірш довелося вчити ввечері.<\/i>","steps":[{"do":"<i>не підписаний зошит<\/i>: залежних слів немає, протиставлення немає.","why":"Пишемо разом: <i>непідписаний зошит<\/i>."},{"do":"<i>Невивчений вчасно вірш<\/i>: вивчений (коли?) <i>вчасно<\/i> — є залежне слово.","why":"Пишемо окремо: <i>не вивчений вчасно вірш<\/i>."}],"answer":"<i>На столі лежав непідписаний зошит. Не вивчений вчасно вірш довелося вчити ввечері.<\/i>"}],"mistakes":["Пишуть окремо без залежних слів: «не перевірений диктант». Правильно: <i>неперевірений диктант<\/i>.","Пишуть разом, хоча є залежні слова: «неперевірений учителем диктант». Правильно: <i>не перевірений учителем диктант<\/i>.","Пишуть разом у присудку: «Диктант неперевірений». Правильно: <i>Диктант не перевірений.<\/i>"],"check":[{"q":"Розкрий дужки й напиши правильно: <i>(не)зібраний урожай<\/i>. Напиши лише дієприкметник із не.","accept":["незібраний"],"a":"Залежних слів при дієприкметнику немає, тож разом: <i>незібраний урожай<\/i>."},{"q":"Пастка: у якому сполученні <i>не<\/i> треба писати окремо?","options":["(не)политі квіти","(не)политі вчасно квіти","(не)вимита чашка"],"correct":1,"a":"Политі (коли?) <i>вчасно<\/i> — є залежне слово, тож окремо: <i>не политі вчасно квіти<\/i>. Інші — разом: <i>неполиті квіти, невимита чашка<\/i>."},{"q":"Мама залишила записку: «Посуд ще …». Як правильно?","options":["невимитий","не вимитий"],"correct":1,"a":"Окремо: дієприкметник тут — частина присудка (<i>посуд не вимитий<\/i>), та ще й має залежне слово <i>ще<\/i>. Правильно: <i>Посуд ще не вимитий.<\/i>"}]}}]},{"id":"U3.4","name":"Форми на -но, -то","what":"«Зроблено», «відкрито» — особлива форма дієслова.","subtopics":[{"id":"U3.4.1","name":"Дієслівні форми на -но, -то","status":"ready","programmeRef":"Дієслівні форми на -но, -то. Речення з дієслівними формами на -но, -то.","lesson":{"what":"Форми на <b>-но, -то<\/b> — незмінні дієслівні форми: <i>зроблено, відкрито, написано<\/i>. Вони повідомляють, що дію виконано, але не називають, хто її виконав. Утворюються від пасивних дієприкметників: <i>зроблений → зроблено, відкритий → відкрито<\/i>.","ideas":["Як утворити: закінчення пасивного дієприкметника -ий замінюємо на -о: <i>прочитан-ий → прочитано, вимит-ий → вимито<\/i>.","Ці форми не змінюються ні за родами, ні за числами: <i>урок закінчено, гру закінчено, змагання закінчено<\/i>.","У реченні форма на -но, -то — головний член <b>безособового<\/b> речення, тобто речення без підмета: <i>Хвіртку зачинено.<\/i> Слово <i>хвіртку<\/i> — не підмет, а додаток у знахідному відмінку: зачинено (що?) хвіртку.","Час показуємо словами <i>було<\/i> або <i>буде<\/i>: <i>Роботу було виконано вчора. Роботу буде виконано завтра.<\/i>","Виконавця в таких реченнях не називаємо. Не «Задачу розв’язано мною», а <i>Я розв’язав задачу<\/i>."],"rules":[{"f":"пасивний дієприкметник → форма на <b>-но, -то<\/b>: <i>зачинений → зачинено, розбитий → розбито<\/i>","means":"Форма не змінюється, а речення з нею не має підмета: <i>Хвіртку зачинено. Вікно розбито.<\/i>"},{"f":"<i>Хвіртка зачинена<\/i> — <i>Хвіртку зачинено<\/i>","means":"З дієприкметником предмет — підмет у називному відмінку; з формою на -но предмет стоїть у знахідному відмінку."}],"examples":[{"task":"Утвори форми на -но, -то: <i>написаний, забутий, перевірений<\/i>.","steps":[{"do":"<i>написан-ий<\/i> → <i>написано<\/i>","why":"Закінчення -ий замінюємо на -о."},{"do":"<i>забут-ий<\/i> → <i>забуто<\/i>","why":"Дієприкметник із суфіксом -т- дає форму на -то."},{"do":"<i>перевірен-ий<\/i> → <i>перевірено<\/i>","why":"Суфікс -ен- зберігається, закінчення -о."}],"answer":"<i>Написано, забуто, перевірено.<\/i>"},{"task":"Визнач граматичну основу: <i>Уроки вже зроблено.<\/i>","steps":[{"do":"<i>Зроблено<\/i> — незмінна форма на -но.","why":"Вона виконує роль головного члена речення."},{"do":"Зроблено (що?) <i>уроки<\/i> — знахідний відмінок.","why":"Отже, <i>уроки<\/i> — додаток, а не підмет."},{"do":"Підмета немає — речення безособове.","why":"Речення з формою на -но, -то завжди безособові."}],"answer":"Граматична основа — <i>зроблено<\/i>; речення безособове."},{"task":"Відредагуй речення: <i>Плакат до свята було намальовано нашим класом.<\/i>","steps":[{"do":"Виконавця названо орудним відмінком — <i>нашим класом<\/i>.","why":"У реченнях із формами на -но, -то виконавця не називаємо."},{"do":"Робимо виконавця підметом, а дію — присудком: <i>наш клас намалював<\/i>.","why":"Так речення звучить природно."}],"answer":"<i>Плакат до свята намалював наш клас.<\/i>"}],"mistakes":["Змінюють форму за родом: «Роботу виконана». Правильно: <i>Роботу виконано<\/i> (або з дієприкметником: <i>Робота виконана<\/i>).","Додають виконавця в орудному відмінку: «Задачу розв’язано мною». Краще: <i>Я розв’язав задачу.<\/i>","Плутають з дієприкметником: <i>зроблене завдання<\/i> — дієприкметник (яке?), він змінюється; <i>завдання зроблено<\/i> — форма на -но, вона незмінна."],"check":[{"q":"Утвори форму на -но, -то від дієприкметника <i>відкритий<\/i>. Напиши одне слово.","accept":["відкрито"],"a":"<i>Відкрит-ий<\/i> → <i>відкрито<\/i>: закінчення -ий замінюємо на -о."},{"q":"Пастка: яке речення правильне?","options":["Хвіртка зачинено.","Хвіртку зачинена.","Хвіртку зачинено."],"correct":2,"a":"З формою на -но предмет стоїть у знахідному відмінку: <i>Хвіртку зачинено.<\/i> З дієприкметником — у називному: <i>Хвіртка зачинена.<\/i>"},{"q":"Яка табличка на дверях спортзалу написана правильно?","options":["Вхід у взутті заборонено","Вхід у взутті забороненно"],"correct":0,"a":"<i>Заборонено<\/i> — форма на -но від дієприкметника <i>заборонений<\/i>, у якому одне н."}]}}]},{"id":"U3.5","name":"Мовлення: опис зовнішності","what":"Як описати людину.","subtopics":[{"id":"U3.5.1","name":"Опис зовнішності людини","status":"ready","programmeRef":"Особливості будови опису зовнішності людини.","lesson":{"what":"<b>Опис зовнішності людини<\/b> (його ще називають портретом) — текст, у якому ми показуємо, який вигляд має людина: зріст, статуру (будову тіла), обличчя, очі, волосся, одяг, рухи. Добрий опис допомагає читачеві «побачити» людину й відчути наше ставлення до неї.","ideas":["Будова опису: <b>вступ<\/b> — кого описуємо і яке загальне враження справляє людина; <b>основна частина<\/b> — риси зовнішності по черзі; <b>кінцівка<\/b> — що в людині найголовніше, наше ставлення до неї.","В основній частині йдемо послідовно: від загального (зріст, статура, постава) — до обличчя (очі, волосся, усмішка) — далі одяг, хода, жести.","Описуємо не все підряд, а <b>характерні<\/b> деталі — ті, за якими людину можна впізнати: ямочки на щоках, веснянки, руді кучері.","Допомагають точні прикметники й дієприкметники (<i>заплетене волосся, засмаглі руки<\/i>) і порівняння (<i>очі сині, як волошки<\/i>).","Зовнішність може підказати й характер: <i>промінці зморщок біля очей<\/i> — людина часто усміхається."],"rules":[{"f":"вступ → основна частина (зріст, статура → обличчя → одяг, рухи) → кінцівка","means":"Так опис стає послідовним, і читач легко уявляє людину."}],"examples":[{"task":"Визнач частини опису: <i>Мій дідусь — найвищий у нашій родині. Він худорлявий і ходить рівно, хоч йому вже сімдесят. Сиве волосся завжди акуратно зачесане, а сірі очі дивляться лагідно й трохи хитрувато. Руки в дідуся великі, засмаглі, у тонких зморшках. Коли я дивлюся на нього, думаю: таким добрим і сильним хочу бути й я.<\/i>","steps":[{"do":"Вступ: <i>Мій дідусь — найвищий у нашій родині.<\/i>","why":"Називаємо, кого описуємо, і загальне враження."},{"do":"Основна частина: статура й хода → волосся, очі → руки.","why":"Деталі йдуть від загального до окремого."},{"do":"Кінцівка: <i>таким добрим і сильним хочу бути й я<\/i>.","why":"Автор показує своє ставлення."}],"answer":"Вступ — перше речення; основна частина — від слів «Він худорлявий» до слів «у тонких зморшках»; кінцівка — останнє речення."},{"task":"Знайди в описі дієприкметники й поясни, що вони додають: <i>У дверях стояла дівчинка в розстебнутій курточці. Розпатлане волосся вибилося з-під шапки, а почервонілі від морозу щоки горіли.<\/i>","steps":[{"do":"Дієприкметники: <i>розстебнутій, розпатлане, почервонілі<\/i>.","why":"Вони відповідають на питання «який?» і означають ознаку за дією."},{"do":"Вони показують, що з дівчинкою щойно щось відбувалося.","why":"Читач здогадується: вона довго бігала надворі на морозі."}],"answer":"<i>Розстебнутій, розпатлане, почервонілі<\/i>: ці дієприкметники роблять портрет живим і показують стан дівчинки."},{"task":"Знайди зайве речення в описі: <i>Мій друг Андрій невисокий, кремезний. У нього темне коротке волосся й карі очі. Учора ми їли піцу. Андрій завжди ходить у спортивному костюмі й кедах.<\/i>","steps":[{"do":"Перевіряємо кожне речення: чи розповідає воно про зовнішність?","why":"В описі зовнішності всі речення працюють на портрет."},{"do":"<i>Учора ми їли піцу<\/i> — це подія, а не риса зовнішності.","why":"Таке речення розриває опис."}],"answer":"Зайве речення — <i>Учора ми їли піцу.<\/i>"}],"mistakes":["Перелічують усе підряд без порядку: очі, кросівки, зріст, ніс. Краще йти від загального до окремого.","Пишуть лише загальні слова: «гарна», «звичайна», «нормальна». Краще конкретні деталі: <i>руда коса, веснянки на носі<\/i>.","Забувають про кінцівку — і опис обривається. Додай одне-два речення про своє ставлення до людини."],"check":[{"q":"Яке речення найкраще підходить для вступу до опису зовнішності вчительки?","options":["У неї сині очі.","Вона носить окуляри.","Наша вчителька музики — тендітна жінка, яка ніби світиться зсередини."],"correct":2,"a":"Вступ називає, кого описуємо, і передає загальне враження. Очі й окуляри — деталі для основної частини."},{"q":"Пастка: яке речення НЕ описує зовнішність?","options":["Брат високий і широкоплечий.","У сестрички дві тоненькі кіски.","Брат любить грати в шахи.","У мами теплі карі очі."],"correct":2,"a":"<i>Брат любить грати в шахи<\/i> — це розповідь про захоплення, а не про те, який вигляд має людина."},{"q":"Друг питає, як упізнати на вокзалі твого двоюрідного брата. Який опис найкорисніший?","options":["Він добрий і веселий.","Він високий, рудий, у зеленій куртці й із синім рюкзаком.","Він мій брат, ти його впізнаєш."],"correct":1,"a":"Корисні характерні деталі зовнішності: зріст, колір волосся, одяг, речі."}]}}]}]},{"id":"U4","subject":"ukr","name":"Дієприслівник","what":"Форма дієслова, що означає додаткову дію: «читаючи», «прочитавши».","topics":[{"id":"U4.1","name":"Дієприслівник","what":"Що таке дієприслівник, його вид і час.","subtopics":[{"id":"U4.1.1","name":"Дієприслівник як форма дієслова","status":"ready","programmeRef":"Дієприслівник як форма дієслова: загальне значення, морфологічні ознаки, синтаксична роль.","lesson":{"what":"<b>Дієприслівник<\/b> — особлива незмінна форма дієслова, що означає <b>додаткову дію<\/b>. Основну дію в реченні називає дієслово-присудок, а дієприслівник — дію, яка її супроводжує: <i>Оля йшла додому, слухаючи музику<\/i>. Дієприслівник відповідає на питання <b>що роблячи?<\/b> або <b>що зробивши?<\/b>","ideas":["Від дієслова дієприслівник має <b>вид<\/b> і <b>час<\/b>, а ще може мати залежні слова: <i>слухаючи (що?) музику<\/i>.","Від прислівника — <b>незмінність<\/b>: дієприслівник не змінюється ні за родами, ні за числами, ні за особами: <i>брат ішов, співаючи<\/i>; <i>сестри йшли, співаючи<\/i>.","У реченні дієприслівник — <b>обставина<\/b>: він пояснює дієслово-присудок. Підкреслюємо його так само, як обставину: рисочка — крапка — рисочка.","Дієприслівники мають суфікси <b>-учи (-ючи), -ачи (-ячи)<\/b> (<i>несучи, читаючи, кричачи, сидячи<\/i>) або <b>-вши, -ши<\/b> (<i>прочитавши, принісши<\/i>). Кінцеве <i>-ся<\/i> в дієприслівнику стає <i>-сь<\/i>: <i>усміхатися — усміхаючись<\/i>.","Додаткову й основну дію виконує <b>той самий<\/b> діяч: <i>Сміючись, Марко розповідав смішну історію<\/i> — і сміється, і розповідає Марко."],"rules":[{"f":"присудок — основна дія; дієприслівник — додаткова дія","means":"<i>Тарас робив уроки, слухаючи музику.<\/i> Основна дія — <i>робив<\/i>, додаткова — <i>слухаючи<\/i> (робив уроки що роблячи?). Обидві дії виконує Тарас."},{"f":"дієприслівник (<i>прочитавши<\/i>) ≠ дієприкметник (<i>прочитаний<\/i>)","means":"Дієприкметник означає ознаку предмета за дією, відповідає на питання <i>який?<\/i> і змінюється, як прикметник: <i>прочитаний, прочитана, прочитані<\/i>. Дієприслівник означає додаткову дію, відповідає на питання <i>що зробивши?<\/i> або <i>що роблячи?<\/i> і не змінюється."}],"examples":[{"task":"Знайди дієприслівник у реченні: <i>Діти гралися на подвір’ї, голосно сміючись<\/i>.","steps":[{"do":"Основна дія — <i>гралися<\/i>.","why":"Це присудок: що робили діти? — гралися."},{"do":"Гралися (що роблячи?) — <i>сміючись<\/i>.","why":"Ставимо питання від присудка й так знаходимо додаткову дію."},{"do":"<i>Сміючись<\/i> не змінюється, має суфікс <b>-ючи<\/b>, а <i>-ся<\/i> стала <i>-сь<\/i>.","why":"Це ознаки дієприслівника."}],"answer":"Відповідь: <i>сміючись<\/i> — дієприслівник (разом із залежним словом <i>голосно<\/i>)."},{"task":"Чим відрізняються слова <i>прочитаний<\/i> і <i>прочитавши<\/i>? Поясни на прикладах.","steps":[{"do":"<i>Прочитаний лист, прочитана книжка.<\/i>","why":"Слово змінюється за родами, відповідає на питання <i>який?<\/i> — це дієприкметник."},{"do":"<i>Прочитавши книжку, Оля поставила її на полицю.<\/i>","why":"Слово не змінюється, відповідає на питання <i>що зробивши?<\/i> і називає додаткову дію — це дієприслівник."}],"answer":"Відповідь: <i>прочитаний<\/i> — дієприкметник (ознака предмета), <i>прочитавши<\/i> — дієприслівник (додаткова дія)."},{"task":"Розбери дієприслівник як форму дієслова: <i>Повернувшись зі школи, Андрій сів обідати<\/i>.","steps":[{"do":"<i>Повернувшись<\/i> — дієприслівник, форма дієслова <i>повернутися<\/i>.","why":"Означає додаткову дію, відповідає на питання <i>що зробивши?<\/i>"},{"do":"Доконаний вид, минулий час.","why":"Питання <i>що зробивши?<\/i> — доконаний вид; суфікс <b>-вши<\/b> — минулий час."},{"do":"Незмінний.","why":"Як і прислівник, дієприслівник не змінюється."},{"do":"У реченні — обставина.","why":"Пояснює присудок: сів обідати (що зробивши?) — повернувшись зі школи."}],"answer":"Відповідь: <i>повернувшись<\/i> — дієприслівник доконаного виду, минулого часу, незмінний; у реченні — обставина."}],"mistakes":["Називають дієприслівник присудком, бо це форма дієслова: у реченні <i>Ми йшли, розмовляючи<\/i> присудок — <i>йшли<\/i>, а <i>розмовляючи<\/i> — обставина.","Називають дієприслівником слово <i>написаний<\/i>, бо воно «від дієслова». Правильно: <i>написаний<\/i> змінюється (<i>написана, написане<\/i>) — це дієприкметник; дієприслівник — <i>написавши<\/i>.","Змінюють дієприслівник разом із підметом: <i>Дівчата йшли, співаючі<\/i>. Правильно: <i>Дівчата йшли, співаючи<\/i> — дієприслівник не змінюється."],"check":[{"q":"Яке слово — дієприслівник?","options":["прочитаний","читають","читаючи","читання"],"correct":2,"a":"<i>Читаючи<\/i> — дієприслівник: незмінний, питання <i>що роблячи?<\/i>, суфікс -ючи. <i>Прочитаний<\/i> — дієприкметник, <i>читають<\/i> — дієслово, <i>читання<\/i> — іменник."},{"q":"Пастка: у реченні <i>Діти бігли, сміючись<\/i> слово <i>сміючись<\/i> — це…","options":["присудок, бо це форма дієслова","обставина","означення"],"correct":1,"a":"Обставина. Присудок тут — <i>бігли<\/i> (основна дія), а дієприслівник <i>сміючись<\/i> називає додаткову дію й пояснює присудок: бігли (що роблячи?) сміючись."},{"q":"Петрик пише другові: «Я слухаю музику, (малювати) комікс». Утвори від дієслова в дужках дієприслівник (що роблячи?) і напиши лише його.","accept":["малюючи"],"a":"малюючи: <i>малювати → (вони) малюють → малюючи<\/i>. Речення: <i>Я слухаю музику, малюючи комікс<\/i>."}]}},{"id":"U4.1.2","name":"Вид і час дієприслівників","status":"ready","programmeRef":"Дієприслівники недоконаного й доконаного виду. Час дієприслівників.","lesson":{"what":"Дієприслівники бувають <b>недоконаного виду<\/b> (питання <i>що роблячи?<\/i>: <i>читаючи<\/i>) і <b>доконаного виду<\/b> (питання <i>що зробивши?<\/i>: <i>прочитавши<\/i>). Вид дієприслівник має той самий, що й дієслово, від якого він утворений, а <b>час<\/b> показує суфікс.","ideas":["Вид визначаємо за дієсловом: <i>читати<\/i> (що робити?) — недоконаний вид, тому й <i>читаючи<\/i> — недоконаного виду; <i>прочитати<\/i> (що зробити?) — доконаний вид, тому й <i>прочитавши<\/i> — доконаного.","<b>Теперішній час<\/b> — суфікси <b>-учи (-ючи), -ачи (-ячи)<\/b>: <i>несучи, читаючи, кричачи, говорячи<\/i>. Такі дієприслівники бувають лише недоконаного виду.","<b>Минулий час<\/b> — суфікси <b>-вши, -ши<\/b>: <i>прочитавши, принісши<\/i>. Найчастіше це дієприслівники доконаного виду; форми недоконаного виду на <i>-вши<\/i> (<i>читавши<\/i>) трапляються рідко.","Час дієприслівника показує, як його дія пов’язана з основною: теперішній — дії відбуваються <b>одночасно<\/b> (<i>Ми йшли, розмовляючи<\/i>); минулий — додаткова дія відбувається <b>раніше<\/b> за основну (<i>Поснідавши, ми пішли до школи<\/i>)."],"rules":[{"f":"форма «вони» теперішнього часу: -уть (-ють) → -учи (-ючи); -ать (-ять) → -ачи (-ячи)","means":"Дієслова І дієвідміни: <i>несуть → несучи<\/i>, <i>читають → читаючи<\/i>. Дієслова ІІ дієвідміни: <i>кричать → кричачи<\/i>, <i>говорять → говорячи<\/i>."},{"f":"основа неозначеної форми на голосний + -вши; основа минулого часу на приголосний + -ши","means":"<i>прочитати → прочитавши<\/i>, <i>зробити → зробивши<\/i>; <i>принести → (він) приніс → принісши<\/i>, <i>допомогти → (він) допоміг → допомігши<\/i>."}],"examples":[{"task":"Визнач вид і час дієприслівників <i>малюючи<\/i> і <i>намалювавши<\/i>.","steps":[{"do":"<i>Малюючи<\/i> — що роблячи? Недоконаний вид.","why":"Утворений від <i>малювати<\/i> (що робити?)."},{"do":"Суфікс <b>-ючи<\/b> — теперішній час.","why":"Суфікси -учи (-ючи), -ачи (-ячи) мають дієприслівники теперішнього часу."},{"do":"<i>Намалювавши<\/i> — що зробивши? Доконаний вид; суфікс <b>-вши<\/b> — минулий час.","why":"Утворений від <i>намалювати<\/i> (що зробити?); суфікси -вши, -ши — минулий час."}],"answer":"Відповідь: <i>малюючи<\/i> — недоконаного виду, теперішнього часу; <i>намалювавши<\/i> — доконаного виду, минулого часу."},{"task":"Утвори дієприслівники від дієслів <i>сидіти<\/i> і <i>писати<\/i>.","steps":[{"do":"<i>сидіти → (вони) сидять → сидячи<\/i>","why":"ІІ дієвідміна, закінчення <i>-ять<\/i>, тому суфікс <b>-ячи<\/b>."},{"do":"<i>писати → (вони) пишуть → пишучи<\/i>","why":"І дієвідміна, закінчення <i>-уть<\/i>, тому суфікс <b>-учи<\/b>. Основу беремо з форми <i>пишуть<\/i>, а не з <i>писати<\/i>."}],"answer":"Відповідь: <i>сидячи, пишучи<\/i>."},{"task":"Утвори дієприслівники доконаного виду від <i>принести<\/i> і <i>повернутися<\/i>; склади речення з одним із них.","steps":[{"do":"<i>принести → (він) приніс → принісши<\/i>","why":"Основа минулого часу закінчується на приголосний <i>с<\/i>, тому додаємо <b>-ши<\/b>."},{"do":"<i>повернутися → повернувшись<\/i>","why":"Основа <i>поверну-<\/i> закінчується на голосний — суфікс <b>-вши<\/b>; <i>-ся<\/i> стає <i>-сь<\/i>."},{"do":"<i>Повернувшись із табору, я довго розповідав про нових друзів.<\/i>","why":"Спершу повернувся, потім розповідав: дієприслівник минулого часу показує, що його дія відбулася раніше за основну."}],"answer":"Відповідь: <i>принісши, повернувшись<\/i>; речення — <i>Повернувшись із табору, я довго розповідав про нових друзів<\/i>."}],"mistakes":["Утворюють дієприслівник від неозначеної форми замість форми «вони»: <i>писаючи<\/i>. Правильно: <i>пишуть → пишучи<\/i>.","Плутають суфікси: <i>кричучи<\/i>, <i>несачи<\/i>. Правильно: <i>кричать → кричачи<\/i> (ІІ дієвідміна), <i>несуть → несучи<\/i> (І дієвідміна).","Визначають час за змістом усього речення: у <i>Поснідавши, я піду до школи<\/i> кажуть «майбутній». Правильно: суфікс <b>-вши<\/b> — минулий час; дієприслівник лише показує, що сніданок буде раніше, ніж похід до школи."],"check":[{"q":"Допиши записку мамі: «Мамо, (зробити) уроки, я пішла на тренування». Утвори від дієслова в дужках дієприслівник і напиши лише його.","accept":["зробивши"],"a":"зробивши: <i>зробити<\/i> — доконаний вид, основа на голосний, тому суфікс -вши. Записка: <i>Мамо, зробивши уроки, я пішла на тренування<\/i>."},{"q":"Пастка: який час дієприслівника <i>зробивши<\/i> в реченні <i>Зробивши уроки, я піду гуляти<\/i>?","options":["майбутній, бо гуляти я піду пізніше","теперішній","минулий"],"correct":2,"a":"Минулий: його показує суфікс -вши. Майбутнього часу дієприслівники не мають; тут дієприслівник показує, що уроки будуть зроблені раніше, ніж я піду гуляти."},{"q":"Якого виду дієприслівник <i>сидячи<\/i>?","options":["недоконаного","доконаного"],"correct":0,"a":"Недоконаного: <i>сидячи<\/i> відповідає на питання <i>що роблячи?<\/i> і утворений від <i>сидіти<\/i> (що робити?) за допомогою суфікса -ячи."}]}}]},{"id":"U4.2","name":"Дієприслівниковий зворот","what":"Коли ставити коми.","subtopics":[{"id":"U4.2.1","name":"Дієприслівниковий зворот і коми","status":"ready","programmeRef":"Дієприслівниковий зворот. Розділові знаки в реченнях з одиничними дієприслівниками та дієприслівниковими зворотами.","lesson":{"what":"<b>Дієприслівниковий зворот<\/b> — це дієприслівник разом із залежними словами: <i>повернувшись (звідки?) зі школи<\/i>. Зворот, як і <b>одиничний<\/b> дієприслівник (без залежних слів), у реченні зазвичай виділяємо <b>комами<\/b>.","ideas":["Щоб поставити коми, спершу знайди граматичну основу (підмет і присудок), потім — дієприслівник і всі слова, що від нього залежать. Так побачиш межі звороту.","Зворот виділяємо комами, <b>де б він не стояв<\/b>: на початку речення кома стоїть після звороту, у кінці — перед ним, у середині — з обох боків.","Одиничний дієприслівник теж виділяємо: <i>Усміхаючись, Марта відчинила двері<\/i>.","Не виділяємо звороти-<b>фразеологізми<\/b> (стійкі вислови, значення яких часто можна передати одним словом): <i>працювати не покладаючи рук<\/i> (старанно), <i>сидіти склавши руки<\/i> (нічого не робити), <i>бігти не чуючи ніг<\/i> (дуже швидко).","Не виділяємо й одиничний дієприслівник, що стоїть після присудка, означає спосіб дії і тісно з ним зливається: <i>Не читай лежачи. Учні слухали гімн стоячи.<\/i>"],"rules":[{"f":"<i>Повернувшись додому, я пообідав. — Я, повернувшись додому, пообідав. — Я пообідав, повернувшись додому.<\/i>","means":"Дієприслівниковий зворот і одиничний дієприслівник виділяємо комами з обох боків; на початку чи в кінці речення лишається одна кома."},{"f":"<i>Тато працює не покладаючи рук.<\/i>","means":"Фразеологізм пишемо без ком: <i>не покладаючи рук<\/i> = <i>старанно<\/i>."},{"f":"дієприслівник — дія того самого, хто виконує основну дію","means":"Правильно: <i>Читаючи книжку, я засумував<\/i> (і читаю, і сумую — я). Неправильно: <i>Читаючи книжку, мені стало сумно<\/i>."}],"examples":[{"task":"Постав коми: <i>Діти вибігли на подвір’я голосно сміючись.<\/i>","steps":[{"do":"Граматична основа — <i>діти вибігли<\/i>.","why":"Хто? — діти; що зробили? — вибігли."},{"do":"Зворот — <i>голосно сміючись<\/i>.","why":"Дієприслівник <i>сміючись<\/i> із залежним словом <i>голосно<\/i> (сміючись як?)."},{"do":"Зворот у кінці речення — кома перед ним.","why":"Зворот виділяємо комами; після нього кінець речення."}],"answer":"Відповідь: <i>Діти вибігли на подвір’я, голосно сміючись.<\/i>"},{"task":"Постав коми: <i>Оля зробивши домашнє завдання пішла на тренування.<\/i>","steps":[{"do":"Граматична основа — <i>Оля пішла<\/i>.","why":"Хто? — Оля; що зробила? — пішла."},{"do":"Зворот — <i>зробивши домашнє завдання<\/i>.","why":"Дієприслівник <i>зробивши<\/i> і залежні слова: зробивши (що?) завдання (яке?) домашнє."},{"do":"Зворот стоїть між підметом і присудком — дві коми.","why":"Зворот у середині речення виділяємо комами з обох боків."}],"answer":"Відповідь: <i>Оля, зробивши домашнє завдання, пішла на тренування.<\/i>"},{"task":"Чи потрібна кома? <i>Брат працював у саду не покладаючи рук. Брат працював у саду слухаючи музику.<\/i>","steps":[{"do":"<i>не покладаючи рук<\/i> — фразеологізм, кома не потрібна.","why":"Його значення передаємо одним словом: працював старанно."},{"do":"<i>слухаючи музику<\/i> — звичайний зворот, ставимо кому перед ним.","why":"Це додаткова дія (працював що роблячи?), зворот стоїть у кінці речення."}],"answer":"Відповідь: <i>Брат працював у саду не покладаючи рук. Брат працював у саду, слухаючи музику.<\/i>"}],"mistakes":["Ставлять лише одну кому, коли зворот усередині речення: <i>Оля, зробивши домашнє завдання пішла гуляти<\/i>. Правильно: <i>Оля, зробивши домашнє завдання, пішла гуляти<\/i>.","Відокремлюють фразеологізм: <i>Ми бігли, не чуючи ніг<\/i>. Правильно: <i>Ми бігли не чуючи ніг<\/i> — це стійкий вислів (дуже швидко).","Будують речення, де додаткову дію виконує не той, хто основну: <i>Ідучи до школи, у мене розв’язався шнурок<\/i>. Правильно: <i>Коли я йшов до школи, у мене розв’язався шнурок<\/i>."],"check":[{"q":"Де коми поставлено правильно?","options":["Прочитавши, казку бабуся вимкнула світло.","Прочитавши казку бабуся, вимкнула світло.","Прочитавши казку бабуся вимкнула світло.","Прочитавши казку, бабуся вимкнула світло."],"correct":3,"a":"Основа — <i>бабуся вимкнула<\/i>, зворот — <i>прочитавши казку<\/i>. Він стоїть на початку речення, тому кома після нього: <i>Прочитавши казку, бабуся вимкнула світло.<\/i>"},{"q":"Пастка: як правильно?","options":["Наша команда тренувалася, не покладаючи рук.","Наша команда тренувалася не покладаючи рук."],"correct":1,"a":"Без коми: <i>не покладаючи рук<\/i> — фразеологізм (= старанно), такі звороти комами не виділяємо."},{"q":"Мама надсилає повідомлення. Де коми поставлено правильно?","options":["Вийшовши з автобуса, напиши мені.","Вийшовши, з автобуса напиши мені.","Вийшовши з автобуса напиши, мені."],"correct":0,"a":"Зворот — <i>вийшовши з автобуса<\/i> (вийшовши звідки? з автобуса). Він на початку речення, тому кома після всього звороту: <i>Вийшовши з автобуса, напиши мені.<\/i>"}]}}]},{"id":"U4.3","name":"Правопис дієприслівників","what":"НЕ з дієприслівниками.","subtopics":[{"id":"U4.3.1","name":"Не з дієприслівниками","status":"ready","programmeRef":"Написання не з дієприслівниками.","lesson":{"what":"<b>Не<\/b> з дієприслівниками пишемо <b>окремо<\/b>, так само як із дієсловами: <i>не знаючи, не помітивши<\/i>. Разом пишемо лише ті дієприслівники, які без <i>не<\/i> не вживаються: <i>ненавидячи<\/i>.","ideas":["Дієприслівник — форма дієслова, тому правило для <i>не<\/i> в них спільне: <i>не знати — не знаючи<\/i>, <i>не помітити — не помітивши<\/i>.","Перевірка: прибери <i>не<\/i>. Якщо слово існує (<i>знаючи, помітивши<\/i>), пиши окремо. Якщо без <i>не<\/i> слова немає (<i>навидячи<\/i>, <i>хтуючи<\/i> — таких слів немає), пиши разом: <i>ненавидячи, нехтуючи<\/i>.","Разом пишемо й дієприслівники від дієслів із префіксом <b>недо-<\/b>, що означає «менше, ніж треба»: <i>недосипаючи<\/i> (від <i>недосипати<\/i> — спати менше, ніж треба). Але <i>не дочекавшись<\/i> — окремо: тут префікс <i>до-<\/i>, а слово <i>дочекавшись<\/i> вживається й без <i>не<\/i>.","Не плутай із дієприкметником: <i>непрочитаний лист<\/i> (дієприкметник без залежних слів — разом), але <i>не прочитавши листа<\/i> (дієприслівник — окремо)."],"rules":[{"f":"не + дієприслівник → окремо","means":"<i>не знаючи, не поспішаючи, не відпочивши<\/i>. Так само, як у дієсловах: <i>не знаю — не знаючи<\/i>."},{"f":"разом — якщо без не слово не вживається","means":"<i>ненавидячи<\/i> (бо немає слова <i>навидіти<\/i>), <i>нехтуючи<\/i> (бо немає слова <i>хтувати<\/i>)."}],"examples":[{"task":"Напиши правильно: <i>(не)поспішаючи<\/i>.","steps":[{"do":"Прибираємо <i>не<\/i>: <i>поспішаючи<\/i> — таке слово є.","why":"Перевіряємо, чи вживається слово без <i>не<\/i>."},{"do":"<i>Поспішаючи<\/i> — дієприслівник (що роблячи?).","why":"Не з дієприслівниками пишемо окремо."}],"answer":"Відповідь: <i>не поспішаючи<\/i>."},{"task":"Напиши правильно: <i>(не)навидячи, (не)хтуючи<\/i>.","steps":[{"do":"Прибираємо <i>не<\/i>: <i>навидячи<\/i>, <i>хтуючи<\/i> — таких слів немає.","why":"Дієслів <i>навидіти<\/i> і <i>хтувати<\/i> в мові немає."},{"do":"Пишемо разом.","why":"Дієприслівники, що без <i>не<\/i> не вживаються, пишемо з <i>не<\/i> разом."}],"answer":"Відповідь: <i>ненавидячи, нехтуючи<\/i>."},{"task":"Знайди й виправ помилки: <i>Незнаючи дороги, ми рушили в похід, недочекавшись провідника.<\/i>","steps":[{"do":"<i>Незнаючи → не знаючи<\/i>","why":"Слово <i>знаючи<\/i> вживається без <i>не<\/i>; не з дієприслівником — окремо."},{"do":"<i>недочекавшись → не дочекавшись<\/i>","why":"Дієслово <i>дочекатися<\/i> має префікс <i>до-<\/i>, а не <i>недо-<\/i>; слово <i>дочекавшись<\/i> вживається без <i>не<\/i>, тож пишемо окремо."},{"do":"Коми лишаємо на місці.","why":"Обидва звороти — <i>не знаючи дороги<\/i> і <i>не дочекавшись провідника<\/i> — виділено комами правильно."}],"answer":"Відповідь: <i>Не знаючи дороги, ми рушили в похід, не дочекавшись провідника.<\/i>"}],"mistakes":["Пишуть разом за звичкою: <i>незнаючи<\/i>, <i>непомітивши<\/i>. Правильно: <i>не знаючи<\/i>, <i>не помітивши<\/i>.","Розділяють слова, які без <i>не<\/i> не вживаються: <i>не навидячи<\/i>. Правильно: <i>ненавидячи<\/i>.","Плутають дієприслівник із дієприкметником: <i>не прочитаний лист<\/i>. Дієприкметник без залежних слів пишемо з <i>не<\/i> разом — <i>непрочитаний лист<\/i>, а дієприслівник — окремо: <i>не прочитавши листа<\/i>."],"check":[{"q":"Напиши правильно: <i>(не)помічаючи<\/i>.","accept":["не помічаючи"],"a":"не помічаючи — окремо: слово <i>помічаючи<\/i> вживається без <i>не<\/i>, а не з дієприслівниками пишемо окремо."},{"q":"Пастка: яке слово пишемо з <i>не<\/i> разом?","options":["(не)знаючи","(не)відпочивши","(не)думаючи","(не)хтуючи"],"correct":3,"a":"<i>Нехтуючи<\/i> — разом, бо слова <i>хтуючи<\/i> немає. Решту пишемо окремо: <i>не знаючи, не відпочивши, не думаючи<\/i>."},{"q":"Олег пише другові: «Вибач, я пішов, (не)дочекавшись тебе». Як написати слово?","options":["недочекавшись","не дочекавшись"],"correct":1,"a":"<i>Не дочекавшись<\/i> — окремо. Тут префікс <i>до-<\/i> (<i>дочекатися<\/i>), а не <i>недо-<\/i>, і слово <i>дочекавшись<\/i> вживається без <i>не<\/i>."}]}}]}]},{"id":"U5","subject":"ukr","name":"Прислівник","what":"Незмінна частина мови, що означає ознаку дії: «швидко», «вчора», «по-українськи».","topics":[{"id":"U5.1","name":"Прислівник як частина мови","what":"Значення, розряди, творення, ступені порівняння.","subtopics":[{"id":"U5.1.1","name":"Прислівник: значення, ознаки, розряди","status":"ready","programmeRef":"Прислівник: загальне значення, морфологічні ознаки, синтаксична роль. Розряди прислівників за значенням","lesson":{"what":"<b>Прислівник<\/b> — самостійна незмінна частина мови, що називає ознаку дії (<i>бігти швидко<\/i>), ознаку іншої ознаки (<i>дуже теплий<\/i>) або, рідше, ознаку предмета (<i>читання вголос<\/i>). Він відповідає на питання <i>як? де? коли? куди? звідки? чому? навіщо? якою мірою?<\/i>","ideas":["Прислівник <b>не змінюється<\/b>: ні за родами, ні за числами, ні за відмінками. Тому закінчення в нього немає: <i>швидко<\/i>, <i>учора<\/i>, <i>ліворуч<\/i>.","Найчастіше прислівник пояснює дієслово і в реченні є <b>обставиною<\/b> (підкреслюємо рискою з крапкою: — · — ·). Рідше він пояснює іменник і стає <b>означенням<\/b>: <i>читання<\/i> (яке?) <i>вголос<\/i>.","<b>Розряди за значенням<\/b> — це групи прислівників за тим, що вони означають. Розряд легко визначити за питанням.","<b>Означальні<\/b> прислівники показують, як відбувається дія: <b>способу дії<\/b> (як? яким способом? — <i>весело, пішки, по-дружньому<\/i>) і <b>міри і ступеня<\/b> (якою мірою? скільки разів? — <i>дуже, трохи, двічі<\/i>).","<b>Обставинні<\/b> прислівники вказують на місце, час, причину чи мету дії: <b>місця<\/b> (де? куди? звідки? — <i>удома, ліворуч, звідти<\/i>), <b>часу<\/b> (коли? відколи? — <i>учора, завжди, зранку<\/i>), <b>причини<\/b> (чому? — <i>згарячу, спросоння<\/i>), <b>мети<\/b> (навіщо? з якою метою? — <i>навмисне, напоказ<\/i>)."],"rules":[{"f":"як? → способу дії; якою мірою? скільки разів? → міри і ступеня; де? куди? звідки? → місця; коли? → часу; чому? → причини; навіщо? → мети","means":"Постав питання від дієслова до прислівника — і питання підкаже розряд. <i>Прийшов<\/i> (коли?) <i>учора<\/i> — прислівник часу; <i>прочитав<\/i> (скільки разів?) <i>двічі<\/i> — міри і ступеня."}],"examples":[{"task":"Знайди прислівники в реченні: «Уранці ми швидко зібралися й весело рушили до лісу».","steps":[{"do":"<i>Зібралися<\/i> (коли?) <i>уранці<\/i>.","why":"Слово відповідає на питання прислівника й пояснює дієслово."},{"do":"<i>Зібралися<\/i> (як?) <i>швидко<\/i>; <i>рушили<\/i> (як?) <i>весело<\/i>.","why":"Обидва слова не змінюються й називають ознаку дії."},{"do":"<i>До лісу<\/i> — не прислівник.","why":"Це іменник з прийменником: він змінюється (<i>ліс, лісу, лісом<\/i>), а прислівник — ні."}],"answer":"Прислівники: <i>уранці, швидко, весело<\/i>."},{"task":"Визнач розряд кожного прислівника: «Учора Олег навмисне голосно засміявся, щоб розвеселити сестру».","steps":[{"do":"<i>Засміявся<\/i> (коли?) <i>учора<\/i> — прислівник часу.","why":"Питання «коли?» — розряд часу."},{"do":"<i>Засміявся<\/i> (навіщо? з якою метою?) <i>навмисне<\/i> — прислівник мети.","why":"Олег засміявся з певною метою — щоб розвеселити сестру."},{"do":"<i>Засміявся<\/i> (як?) <i>голосно<\/i> — прислівник способу дії.","why":"Питання «як?» — розряд способу дії."}],"answer":"<i>Учора<\/i> — часу, <i>навмисне<\/i> — мети, <i>голосно<\/i> — способу дії."},{"task":"Яким членом речення є прислівник <i>вголос<\/i> у реченнях: 1) «Ми любимо читання вголос». 2) «Учитель читав уголос нову казку»?","steps":[{"do":"У першому реченні: <i>читання<\/i> (яке?) <i>вголос<\/i>.","why":"Прислівник пояснює іменник, тому це означення."},{"do":"У другому реченні: <i>читав<\/i> (як?) <i>уголос<\/i>.","why":"Прислівник пояснює дієслово, тому це обставина."},{"do":"<i>Вголос<\/i> / <i>уголос<\/i> — те саме слово.","why":"Після голосного пишемо <i>в<\/i> (<i>читання вголос<\/i>), після приголосного — <i>у<\/i> (<i>читав уголос<\/i>)."}],"answer":"1) означення; 2) обставина."}],"mistakes":["Шукають закінчення: у слові <i>швидко<\/i> вважають <i>-о<\/i> закінченням. Правильно: прислівник не змінюється, тому закінчення не має, а <i>-о<\/i> тут — суфікс.","Визначають розряд «на око», без питання: <i>двічі<\/i> вважають прислівником часу. Правильно: <i>прочитав<\/i> (скільки разів?) <i>двічі<\/i> — прислівник міри і ступеня.","Думають, що прислівник завжди обставина. Правильно: у сполученні <i>розмова<\/i> (яка?) <i>наодинці<\/i> прислівник — означення."],"check":[{"q":"Знайди прислівник у реченні «Восени ліс стає золотим» і визнач його розряд.","options":["<i>Восени<\/i> — прислівник часу","<i>Золотим<\/i> — прислівник способу дії","<i>Восени<\/i> — прислівник місця"],"correct":0,"a":"<i>Стає<\/i> (коли?) <i>восени<\/i> — прислівник часу. <i>Золотим<\/i> змінюється (<i>золотий, золота<\/i>) — це прикметник."},{"q":"Пастка: якого розряду прислівник у реченні «Ми двічі перечитали вірш»?","options":["часу","міри і ступеня","способу дії"],"correct":1,"a":"<i>Перечитали<\/i> (скільки разів?) <i>двічі<\/i> — прислівник міри і ступеня. Питання «коли?» до нього не підходить."},{"q":"Друг пише: «Зустрінемося завтра біля школи, не запізнюйся!» Напиши прислівник із цього повідомлення.","accept":["завтра"],"a":"Прислівник — <i>завтра<\/i> (зустрінемося коли?), розряд часу. <i>Біля школи<\/i> — іменник з прийменником, а не прислівник."}]}},{"id":"U5.1.2","name":"Творення прислівників","status":"ready","programmeRef":"Творення прислівників","lesson":{"what":"Більшість прислівників утворилася від інших слів: прикметників, іменників, числівників, займенників і навіть інших прислівників. Знаючи, як утворено слово, легше правильно його написати й відрізнити від схожого слова іншої частини мови.","ideas":["Від прикметника за допомогою суфікса <b>-о<\/b> або <b>-е<\/b> (суфіксальний спосіб): <i>веселий → весело<\/i>, <i>добрий → добре<\/i>, <i>гарячий → гаряче<\/i>.","Префікс <b>по-<\/b> разом із суфіксом <b>-ому<\/b> (<b>-єму<\/b>) або <b>-и<\/b> (префіксально-суфіксальний спосіб): <i>новий → по-новому<\/i>, <i>братський → по-братськи<\/i>, <i>український → по-українськи<\/i>.","Префікс до прислівника (префіксальний спосіб): <i>завтра → післязавтра<\/i>, <i>завжди → назавжди<\/i>.","Злиття прийменника з іншим словом: <i>до + дому → додому<\/i>, <i>з + ранку → зранку<\/i>, <i>у + двох → удвох<\/i>.","Перехід слова іншої частини мови в прислівник: іменники в орудному відмінку стали прислівниками — <i>бігом, зимою, вечорами<\/i>."],"rules":[{"f":"прислівник чи інша частина мови? → постав питання й перевір, чи слово змінюється","means":"Однакові на вигляд слова бувають різними частинами мови. <i>Ти добре<\/i> (як?) <i>намалював<\/i> — прислівник; <i>добре<\/i> (яке?) <i>серце<\/i> — прикметник (<i>добрий, добра, добре<\/i>). <i>Зимою<\/i> (коли?) <i>ми катаємося на ковзанах<\/i> — прислівник; <i>милуватися зимою<\/i> (чим?) — іменник."}],"examples":[{"task":"Утвори прислівники від прикметників: <i>сміливий, гарячий, дружній<\/i>.","steps":[{"do":"<i>сміливий → сміливо<\/i>","why":"Від основи прикметника + суфікс <i>-о<\/i>."},{"do":"<i>гарячий → гаряче<\/i>","why":"Після <i>ч<\/i> тут уживаємо суфікс <i>-е<\/i>."},{"do":"<i>дружній → по-дружньому<\/i>","why":"Префікс <i>по-<\/i> + суфікс <i>-ому<\/i>; такі прислівники пишемо через дефіс."}],"answer":"<i>Сміливо, гаряче, по-дружньому.<\/i>"},{"task":"Визнач, як утворено прислівники: <i>післязавтра, по-козацьки, зранку<\/i>.","steps":[{"do":"<i>післязавтра<\/i> = <i>після-<\/i> + <i>завтра<\/i>","why":"До прислівника додано префікс — префіксальний спосіб."},{"do":"<i>по-козацьки<\/i> = <i>по-<\/i> + <i>козацьк(ий)<\/i> + <i>-и<\/i>","why":"Від прикметника <i>козацький<\/i> одночасно додано префікс і суфікс — префіксально-суфіксальний спосіб."},{"do":"<i>зранку<\/i> = <i>з<\/i> + <i>ранку<\/i>","why":"Прийменник злився з іменником в одне слово."}],"answer":"Префіксальний; префіксально-суфіксальний; злиття прийменника з іменником."},{"task":"Розрізни частини мови: 1) «Дмитро добре знає правила». 2) «У Дмитра добре серце». 3) «Вечорами ми граємо в шахи». 4) «Ми милувалися теплими вечорами».","steps":[{"do":"1) <i>знає<\/i> (як?) <i>добре<\/i> — прислівник.","why":"Пояснює дієслово й не змінюється."},{"do":"2) <i>серце<\/i> (яке?) <i>добре<\/i> — прикметник.","why":"Пояснює іменник і змінюється: <i>доброго серця<\/i>."},{"do":"3) <i>граємо<\/i> (коли?) <i>вечорами<\/i> — прислівник.","why":"Відповідає на питання прислівника часу."},{"do":"4) <i>милувалися<\/i> (чим?) <i>вечорами<\/i> — іменник.","why":"Має означення <i>теплими<\/i> і відповідає на питання відмінка."}],"answer":"Прислівники — у реченнях 1 і 3; у реченні 2 — прикметник, у реченні 4 — іменник."}],"mistakes":["Пишуть <i>поновому<\/i> або <i>по новому<\/i>. Правильно: <i>по-новому<\/i> — прислівники з <i>по-<\/i> і <i>-ому<\/i> пишемо через дефіс.","Плутають прислівник і прикметник: «Сестра <i>гарне<\/i> співає». Правильно: співає (як?) <i>гарно<\/i> — прислівник; <i>гарне<\/i> (яке?) <i>місто<\/i> — прикметник.","Вважають прислівником кожне слово з прийменником: <i>до дому бабусі<\/i>. Тут <i>дому<\/i> — іменник (до чийого дому?), а <i>додому<\/i> (куди?) — прислівник."],"check":[{"q":"Яким способом утворено прислівник <i>по-дружньому<\/i>?","options":["суфіксальним","префіксальним","префіксально-суфіксальним"],"correct":2,"a":"<i>по-<\/i> + <i>дружн(ій)<\/i> + <i>-ому<\/i>: префікс і суфікс додано одночасно — префіксально-суфіксальний спосіб."},{"q":"Пастка: у якому реченні слово <i>добре<\/i> — прислівник?","options":["У нас було добре свято.","Ми провели свято добре.","Добре слово всім приємне."],"correct":1,"a":"<i>Провели<\/i> (як?) <i>добре<\/i> — прислівник. В інших реченнях <i>добре свято<\/i>, <i>добре слово<\/i> (яке?) — прикметник."},{"q":"Записка на дверях: «Малий спить, заходьте …». Утвори прислівник від прикметника <i>тихий<\/i> і напиши його.","accept":["тихо"],"a":"<i>тихий → тихо<\/i>: основа прикметника + суфікс <i>-о<\/i>. Заходьте (як?) <i>тихо<\/i>."}]}},{"id":"U5.1.3","name":"Ступені порівняння прислівників","status":"ready","programmeRef":"Ступені порівняння прислівників.","lesson":{"what":"Прислівники на <i>-о<\/i>, <i>-е<\/i>, утворені від якісних прикметників, мають <b>ступені порівняння<\/b>. <b>Вищий<\/b> показує, що ознака дії більша чи менша, ніж в іншому випадку (<i>бігає швидше<\/i>), <b>найвищий<\/b> — що вона найбільша чи найменша (<i>бігає найшвидше<\/i>).","ideas":["Вищий ступінь, <b>проста форма<\/b>: суфікс <b>-іш-<\/b> або <b>-ш-<\/b> + <b>-е<\/b>: <i>тихо → тихіше<\/i>, <i>швидко → швидше<\/i>. <b>Складена форма<\/b>: <b>більш<\/b> або <b>менш<\/b> + прислівник: <i>більш уважно<\/i>, <i>менш голосно<\/i>.","Найвищий ступінь, <b>проста форма<\/b>: префікс <b>най-<\/b> + вищий ступінь: <i>найтихіше<\/i>, <i>найшвидше<\/i>. Значення можна підсилити префіксами <b>як-<\/b>, <b>що-<\/b>: <i>якнайшвидше<\/i>, <i>щонайкраще<\/i> — пишемо <b>разом<\/b>. <b>Складена форма<\/b>: <b>найбільш<\/b> або <b>найменш<\/b> + прислівник: <i>найбільш уважно<\/i>.","Перед суфіксом <b>-ш-<\/b> приголосні змінюються: <i>високо → вище<\/i>, <i>низько → нижче<\/i>, <i>близько → ближче<\/i>, <i>дорого → дорожче<\/i>.","Деякі прислівники утворюють ступені від іншої основи: <i>добре → краще<\/i>, <i>погано → гірше<\/i>, <i>багато → більше<\/i>, <i>мало → менше<\/i>, <i>далеко → далі<\/i>."],"rules":[{"f":"швидко → швидше / більш швидко → найшвидше, якнайшвидше, щонайшвидше / найбільш швидко","means":"Просту і складену форми не змішуємо: <i>більш швидше<\/i>, <i>найбільш швидше<\/i> — помилки. Слова <i>самий<\/i> у ступенях порівняння немає: не «самий швидко», а <i>найшвидше<\/i>."}],"examples":[{"task":"Утвори ступені порівняння прислівника <i>весело<\/i> (прості й складені форми).","steps":[{"do":"Вищий, проста: <i>весел-<\/i> + <i>-іш-<\/i> + <i>-е<\/i> = <i>веселіше<\/i>.","why":"До основи додаємо суфікс <i>-іш-<\/i> і <i>-е<\/i>."},{"do":"Вищий, складена: <i>більш весело<\/i>, <i>менш весело<\/i>.","why":"Слово <i>більш<\/i> / <i>менш<\/i> + звичайний прислівник."},{"do":"Найвищий: <i>найвеселіше<\/i>, <i>якнайвеселіше<\/i>; складена — <i>найбільш весело<\/i>.","why":"Префікс <i>най-<\/i> (і за потреби <i>як-<\/i>, <i>що-<\/i>) до вищого ступеня, разом."}],"answer":"<i>Веселіше, більш весело; найвеселіше, якнайвеселіше, найбільш весело.<\/i>"},{"task":"Утвори вищий і найвищий ступені прислівника <i>високо<\/i>.","steps":[{"do":"Відкидаємо суфікс <i>-ок-<\/i>: <i>вис-<\/i>.","why":"Так само, як у прикметнику: <i>високий → вищий<\/i>."},{"do":"<i>с<\/i> + <i>ш<\/i> → <i>щ<\/i>: <i>вище<\/i>.","why":"Перед суфіксом <i>-ш-<\/i> приголосний <i>с<\/i> разом із ним дає <i>щ<\/i>."},{"do":"<i>най-<\/i> + <i>вище<\/i> = <i>найвище<\/i>; підсилено — <i>якнайвище<\/i>.","why":"Найвищий ступінь — префікс <i>най-<\/i> до вищого."}],"answer":"<i>Вище; найвище (якнайвище, щонайвище).<\/i>"},{"task":"Знайди й виправ помилки: «Мій брат бігає більш швидше за мене, а сестра — самий швидко».","steps":[{"do":"<i>більш швидше<\/i> → <i>швидше<\/i> або <i>більш швидко<\/i>.","why":"Проста форма (<i>швидше<\/i>) не поєднується зі словом <i>більш<\/i>."},{"do":"<i>самий швидко<\/i> → <i>найшвидше<\/i>.","why":"Найвищий ступінь утворюємо префіксом <i>най-<\/i> або словом <i>найбільш<\/i>, а не словом <i>самий<\/i>."}],"answer":"«Мій брат бігає швидше (більш швидко) за мене, а сестра — найшвидше»."}],"mistakes":["<i>Більш краще<\/i> → <i>краще<\/i>: у слові <i>краще<\/i> вже є значення «більше».","<i>Самий швидко<\/i> → <i>найшвидше<\/i> або <i>найбільш швидко<\/i>.","<i>Як найшвидше<\/i> → <i>якнайшвидше<\/i>: префікси <i>як-<\/i>, <i>що-<\/i> пишемо з прислівником разом."],"check":[{"q":"Утвори вищий ступінь (просту форму) прислівника <i>близько<\/i>. Напиши одне слово.","accept":["ближче"],"a":"<i>близько → ближче<\/i>: суфікс <i>-ьк-<\/i> відпадає, <i>з<\/i> перед <i>-ш-<\/i> дає <i>жч<\/i>, як у прикметнику <i>ближчий<\/i>."},{"q":"Пастка: як правильно? «Сьогодні ти співаєш … , ніж учора».","options":["більш краще","самий краще","краще"],"correct":2,"a":"<i>Краще<\/i> — проста форма вищого ступеня від <i>добре<\/i>. Додавати <i>більш<\/i> чи <i>самий<\/i> не можна."},{"q":"Ти пишеш другові: «Приходь …, гра вже починається!» Як правильно написати прислівник?","options":["якнайшвидше","як найшвидше","як-найшвидше"],"correct":0,"a":"<i>Якнайшвидше<\/i> — найвищий ступінь з префіксом <i>як-<\/i>, пишемо разом."}]}}]},{"id":"U5.2","name":"Правопис прислівників","what":"Н чи НН, И чи І, разом, окремо чи з дефісом, НЕ та НІ.","subtopics":[{"id":"U5.2.1","name":"Н та НН у прислівниках","status":"ready","programmeRef":"Букви н та нн у прислівниках.","lesson":{"what":"У прислівниках на <i>-о<\/i>, <i>-е<\/i>, утворених від прикметників, пишемо стільки букв <b>н<\/b>, скільки їх у прикметнику: <i>туманний → туманно<\/i>, <i>шалений → шалено<\/i>.","ideas":["Спершу знайди прикметник, від якого утворено прислівник, і перевір, скільки в ньому <b>н<\/b>.","<b>Нн<\/b> буває, коли корінь закінчується на <b>н<\/b>, а суфікс починається з <b>н<\/b>: <i>туман + н → туманний → туманно<\/i>, <i>закон + н → законний → законно<\/i>.","<b>Нн<\/b> — і в прикметниках із суфіксами <b>-енн-<\/b>, <b>-анн-<\/b> (<b>-янн-<\/b>), що означають дуже велику міру ознаки або неможливість дії: <i>страшенний → страшенно<\/i>, <i>несказанний → несказанно<\/i>, <i>незрівнянний → незрівнянно<\/i>.","Один <b>н<\/b> — коли в прикметнику один <b>н<\/b>: <i>шалений → шалено<\/i>, <i>здивований → здивовано<\/i>, <i>несподіваний → несподівано<\/i>, <i>зосереджений → зосереджено<\/i>."],"rules":[{"f":"прикметник з нн → прислівник з нн: туманно, законно, страшенно, несказанно, старанно","means":"Буква <b>н<\/b> кореня зустрічається з <b>н<\/b> суфікса, або прикметник має суфікс <i>-енн-<\/i>, <i>-анн-<\/i> (<i>-янн-<\/i>) зі значенням дуже великої міри чи неможливості дії. Прикметник <i>старанний<\/i> пишемо з <b>нн<\/b> — так само й <i>старанно<\/i>."},{"f":"прикметник з н → прислівник з н: шалено, здивовано, несподівано, впевнено","means":"Прислівник лише «бере» букви прикметника, нових не додає: <i>впевнений → впевнено<\/i>."}],"examples":[{"task":"Утвори прислівники від прикметників <i>туманний<\/i> і <i>зосереджений<\/i>.","steps":[{"do":"<i>туманний → туманно<\/i>","why":"У прикметнику <b>нн<\/b> (<i>туман + н<\/i>), тож і в прислівнику <b>нн<\/b>."},{"do":"<i>зосереджений → зосереджено<\/i>","why":"У прикметнику один <b>н<\/b>, тож і в прислівнику один."}],"answer":"<i>Туманно, зосереджено.<\/i>"},{"task":"Встав <b>н<\/b> або <b>нн<\/b> і напиши слова: <i>невпи..о, схвильова..о, страше..о<\/i>.","steps":[{"do":"<i>невпинний → невпинно<\/i>","why":"Прикметник <i>невпинний<\/i> пишемо з <b>нн<\/b>, тож і прислівник."},{"do":"<i>схвильований → схвильовано<\/i>","why":"У прикметнику один <b>н<\/b>."},{"do":"<i>страшенний → страшенно<\/i>","why":"Суфікс <i>-енн-<\/i> означає дуже велику міру ознаки — <b>нн<\/b>."}],"answer":"<i>Невпинно, схвильовано, страшенно.<\/i>"},{"task":"Знайди й виправ помилки: «Олена несподіванно засміялася, а потім старано виконала завдання».","steps":[{"do":"<i>несподіванно<\/i> → <i>несподівано<\/i>","why":"Прикметник <i>несподіваний<\/i> має один <b>н<\/b>."},{"do":"<i>старано<\/i> → <i>старанно<\/i>","why":"Прикметник <i>старанний<\/i> пишемо з <b>нн<\/b>."}],"answer":"«Олена несподівано засміялася, а потім старанно виконала завдання»."}],"mistakes":["<i>Старано<\/i> → <i>старанно<\/i>: перевір прикметник — <i>старанний<\/i>, з <b>нн<\/b>.","<i>Несподіванно<\/i> → <i>несподівано<\/i>: прикметник <i>несподіваний<\/i> має один <b>н<\/b>.","<i>Здивованно<\/i> → <i>здивовано<\/i>: від <i>здивований<\/i>, з одним <b>н<\/b>."],"check":[{"q":"Утвори прислівник від прикметника <i>законний<\/i> і напиши його.","accept":["законно"],"a":"<i>законний → законно<\/i>: у прикметнику <b>нн<\/b> (<i>закон + н<\/i>), тож і в прислівнику <b>нн<\/b>."},{"q":"Пастка: як правильно? «Ми були … раді перемозі нашої команди».","options":["несказано","несказанно"],"correct":1,"a":"<i>Несказанно<\/i> — від прикметника <i>несказанний<\/i> (такий, що й не сказати), де суфікс <i>-анн-<\/i> з <b>нн<\/b>."},{"q":"Оголошення в школі: «Просимо учнів … зайти до актової зали». Як правильно?","options":["організовано","організованно"],"correct":0,"a":"<i>Організовано<\/i> — від прикметника <i>організований<\/i>, у якому один <b>н<\/b>."}]}},{"id":"U5.2.2","name":"И та І в кінці прислівників","status":"ready","programmeRef":"Букви и та і в кінці прислівників.","lesson":{"what":"У кінці прислівників після <b>г, к, х<\/b> пишемо <b>и<\/b>: <i>навкруги, мовчки, трохи<\/i>. Після <b>ж, ч<\/b> найчастіше пишемо <b>і<\/b>: <i>двічі, вночі<\/i>, але кілька груп прислівників мають тут <b>и<\/b> — їх треба знати.","ideas":["Після <b>г, к, х<\/b> — завжди <b>и<\/b>: <i>навкруги, навшпиньки, мовчки, пішки, верхи, трохи, по-батьківськи<\/i>.","Після <b>ж, ч<\/b> пишемо <b>и<\/b> лише у двох випадках: у прислівниках з префіксом <b>по-<\/b> (<i>по-вовчи<\/i>) і в прислівниках на <b>-ачи<\/b>, <b>-ячи<\/b>, що утворилися від дієприслівників (<i>стоячи, лежачи, сидячи<\/i>).","В інших прислівниках після <b>ж, ч<\/b> — <b>і<\/b>: <i>двічі, тричі, вночі, опівночі, поночі, насторожі<\/i>.","Запам’ятай прислівники з <b>и<\/b> в кінці: <i>восени, безвісти, почасти<\/i>. А прислівники, що походять від іменника з прийменником у місцевому відмінку, мають <b>і<\/b>: <i>угорі, надворі<\/i>."],"rules":[{"f":"г, к, х + и: навкруги, мовчки, трохи","means":"Після цих трьох букв у кінці прислівника <b>і<\/b> не пишемо ніколи."},{"f":"ж, ч + і: двічі, вночі, насторожі; але по-…чи, -ачи (-ячи): по-вовчи, стоячи","means":"<b>И<\/b> після <b>ж, ч<\/b> — лише в прислівниках з <i>по-<\/i> і в тих, що утворилися від дієприслівників на <i>-ачи<\/i>, <i>-ячи<\/i>."},{"f":"запам’ятай: восени, безвісти, почасти","means":"Ці прислівники пишемо з <b>и<\/b> в кінці."}],"examples":[{"task":"Встав <b>и<\/b> або <b>і<\/b> й напиши слова: <i>навкруг.., мовчк.., вноч..<\/i>","steps":[{"do":"<i>навкруги<\/i>","why":"Після <b>г<\/b> — <b>и<\/b>."},{"do":"<i>мовчки<\/i>","why":"Після <b>к<\/b> — <b>и<\/b>."},{"do":"<i>вночі<\/i>","why":"Після <b>ч<\/b>; прислівник без <i>по-<\/i> і не на <i>-ачи<\/i> — отже, <b>і<\/b>."}],"answer":"<i>Навкруги, мовчки, вночі.<\/i>"},{"task":"Встав <b>и<\/b> або <b>і<\/b> й напиши слова: <i>трич.., сидяч.., по-вовч..<\/i>","steps":[{"do":"<i>тричі<\/i>","why":"Після <b>ч<\/b>, звичайний прислівник — <b>і<\/b>."},{"do":"<i>сидячи<\/i>","why":"Прислівник на <i>-ячи<\/i>, утворений від дієприслівника, — <b>и<\/b>."},{"do":"<i>по-вовчи<\/i>","why":"Прислівник з префіксом <i>по-<\/i> — після <b>ч<\/b> пишемо <b>и<\/b>."}],"answer":"<i>Тричі, сидячи, по-вовчи.<\/i>"},{"task":"Знайди й виправ помилки: «Восені ми двічи ходили до лісу пішкі».","steps":[{"do":"<i>Восені<\/i> → <i>Восени<\/i>","why":"Це слово треба запам’ятати: пишемо з <b>и<\/b>."},{"do":"<i>двічи<\/i> → <i>двічі<\/i>","why":"Після <b>ч<\/b>, без <i>по-<\/i> і не на <i>-ачи<\/i> — <b>і<\/b>."},{"do":"<i>пішкі<\/i> → <i>пішки<\/i>","why":"Після <b>к<\/b> — завжди <b>и<\/b>."}],"answer":"«Восени ми двічі ходили до лісу пішки»."}],"mistakes":["<i>Двічи, тричи<\/i> → <i>двічі, тричі<\/i>: після <b>ч<\/b> у таких прислівниках — <b>і<\/b>.","<i>Восені<\/i> → <i>восени<\/i>: слово-виняток, запам’ятай.","<i>Пішкі, мовчкі<\/i> → <i>пішки, мовчки<\/i>: після <b>к<\/b> — лише <b>и<\/b>."],"check":[{"q":"Встав букву й напиши слово повністю: <i>трич..<\/i>","accept":["тричі"],"a":"<i>Тричі<\/i>: після <b>ч<\/b> пишемо <b>і<\/b>, бо слово без префікса <i>по-<\/i> і не закінчується на <i>-ачи<\/i>, <i>-ячи<\/i>."},{"q":"Пастка: у якому слові в кінці пишемо <b>и<\/b>?","options":["вноч..","поноч..","стояч..","опівноч.."],"correct":2,"a":"<i>Стоячи<\/i> — прислівник на <i>-ячи<\/i>, утворений від дієприслівника, тому <b>и<\/b>. Інші: <i>вночі, поночі, опівночі<\/i> — з <b>і<\/b>."},{"q":"Повідомлення: «Ми поїдемо до бабусі …, у вересні». Як правильно?","options":["восені","восени"],"correct":1,"a":"<i>Восени<\/i> — прислівник, який треба запам’ятати: у кінці пишемо <b>и<\/b>."}]}},{"id":"U5.2.3","name":"Прислівники разом, окремо, з дефісом","status":"ready","programmeRef":"Написання прислівників разом, окремо і з дефісом.","lesson":{"what":"Прислівники пишемо <b>разом<\/b> (<i>угору, щодня, назавжди<\/i>) або <b>через дефіс<\/b> (<i>по-новому, будь-коли<\/i>). Деякі сполучення, що звучать як прислівник, пишемо <b>окремо<\/b>: <i>по двоє<\/i>.","ideas":["<b>Разом<\/b> пишемо прислівники, що утворилися з прийменника та іменника, прикметника, числівника, займенника чи прислівника: <i>угору, додому, зліва, удвох, утричі, навіщо, назавжди, віднині<\/i>.","<b>Разом<\/b> — прислівники з частинами <b>аби-<\/b>, <b>де-<\/b>, <b>ні-<\/b>, <b>що-<\/b>, <b>-сь<\/b>: <i>абияк, деінде, ніколи, щодня, десь, колись<\/i>.","<b>Через дефіс<\/b> — прислівники з <b>по-<\/b> на <b>-ому<\/b>, <b>-єму<\/b>, <b>-и<\/b>: <i>по-нашому, по-моєму, по-українськи, по-вовчи<\/i>; з <b>по-<\/b> від порядкових числівників: <i>по-перше, по-друге, по-третє<\/i>.","<b>Через дефіс<\/b> — прислівники з частками <b>будь-<\/b>, <b>казна-<\/b>, <b>хтозна-<\/b>, <b>-небудь<\/b>: <i>будь-коли, казна-де, хтозна-як, де-небудь<\/i>; а також повтори: <i>ледве-ледве, ось-ось, давним-давно, часто-густо, де-не-де, віч-на-віч, пліч-о-пліч<\/i>.","<b>Окремо<\/b> — <i>по<\/i> зі збірними числівниками: <i>по двоє, по троє<\/i> (але разом: <i>удвох, утрьох<\/i>)."],"rules":[{"f":"разом: прийменник + слово → угору, додому, удвох, назавжди; аби-, де-, ні-, що-, -сь → абияк, щодня, десь","means":"Прийменник давно злився зі словом і окремо не вживається: <i>піднятися<\/i> (куди?) <i>угору<\/i>."},{"f":"через дефіс: по-…ому, по-…и, по-перше; будь-, -небудь, казна-, хтозна-; повтори","means":"<i>По-моєму, по-українськи, по-друге, будь-де, коли-небудь, ось-ось.<\/i>"},{"f":"окремо: по двоє, по троє","means":"<i>По<\/i> зі збірним числівником пишемо окремо: <i>ішли по двоє<\/i>."}],"examples":[{"task":"Розкрий дужки: <i>(по)моєму, (що)дня, (будь)коли<\/i>.","steps":[{"do":"<i>по-моєму<\/i>","why":"<i>По-<\/i> + <i>-єму<\/i> — через дефіс."},{"do":"<i>щодня<\/i>","why":"Частину <i>що-<\/i> пишемо разом."},{"do":"<i>будь-коли<\/i>","why":"Частку <i>будь-<\/i> пишемо через дефіс."}],"answer":"<i>По-моєму, щодня, будь-коли.<\/i>"},{"task":"Розкрий дужки: <i>(по)перше, (на)завжди, (ледве)ледве<\/i>.","steps":[{"do":"<i>по-перше<\/i>","why":"<i>По-<\/i> + порядковий числівник — через дефіс."},{"do":"<i>назавжди<\/i>","why":"Прийменник злився з прислівником <i>завжди<\/i> — разом."},{"do":"<i>ледве-ледве<\/i>","why":"Повтор того самого слова — через дефіс."}],"answer":"<i>По-перше, назавжди, ледве-ледве.<\/i>"},{"task":"Знайди й виправ помилки: «Поперше, ми завжди ходимо по-двоє, а колинебудь підемо в похід удвох».","steps":[{"do":"<i>Поперше<\/i> → <i>По-перше<\/i>","why":"<i>По-<\/i> + порядковий числівник — через дефіс."},{"do":"<i>по-двоє<\/i> → <i>по двоє<\/i>","why":"<i>По<\/i> зі збірним числівником пишемо окремо."},{"do":"<i>колинебудь<\/i> → <i>коли-небудь<\/i>","why":"Частку <i>-небудь<\/i> пишемо через дефіс."},{"do":"<i>удвох<\/i> — правильно.","why":"Прийменник злився з числівником — разом."}],"answer":"«По-перше, ми завжди ходимо по двоє, а коли-небудь підемо в похід удвох»."}],"mistakes":["<i>Поукраїнськи<\/i>, <i>по українськи<\/i> → <i>по-українськи<\/i>: <i>по-<\/i> + <i>-и<\/i> — через дефіс.","<i>Будь коли<\/i> → <i>будь-коли<\/i>: частку <i>будь-<\/i> пишемо через дефіс.","<i>По-двоє<\/i> → <i>по двоє<\/i>, але <i>удвох<\/i> — разом."],"check":[{"q":"Розкрий дужки й напиши слово: <i>(по)українськи<\/i>","accept":["по-українськи"],"a":"<i>По-українськи<\/i>: прислівник з <i>по-<\/i> на <i>-и<\/i> пишемо через дефіс."},{"q":"Пастка: як правильно? «На екскурсію ми йшли …».","options":["подвоє","по-двоє","по двоє"],"correct":2,"a":"<i>По двоє<\/i> — <i>по<\/i> зі збірним числівником пишемо окремо. Не плутай з <i>удвох<\/i> — це прислівник, його пишемо разом."},{"q":"Ти пишеш однокласникові: «Дзвони мені …, я вдома». Як правильно?","options":["будь коли","будь-коли","будьколи"],"correct":1,"a":"<i>Будь-коли<\/i>: частку <i>будь-<\/i> з прислівником пишемо через дефіс."}]}},{"id":"U5.2.4","name":"Прислівникові сполучення","status":"ready","programmeRef":"Написання прислівникових сполучень.","lesson":{"what":"<b>Прислівникові сполучення<\/b> — це сталі сполучення прийменника з іменником, які в реченні працюють як прислівник: <i>до речі, на жаль, раз у раз<\/i>. Їх пишемо <b>окремо<\/b>. Також треба відрізняти прислівник (<i>угорі<\/i>) від однаково звучного сполучення прийменника з іменником (<i>у горі<\/i>).","ideas":["<b>Окремо<\/b> пишемо сполучення: <i>до речі, на жаль, на щастя, на диво, без кінця, без упину, до вподоби, на бігу, на ходу, як слід, по суті, уві сні, за кордоном, під силу<\/i>.","<b>Окремо<\/b> — сполучення з повтореним іменником: <i>раз у раз, день у день, рік у рік, час від часу, з дня на день<\/i>. Не плутай з тими, що пишемо через дефіс: <i>віч-на-віч, пліч-о-пліч<\/i>.","Як відрізнити прислівник від прийменника з іменником? Спробуй вставити означення або поставити питання до іменника. Можна — пишемо окремо: <i>на<\/i> (шкільному) <i>дворі<\/i>, <i>у<\/i> (великому) <i>горі<\/i>. Не можна — це прислівник, пишемо разом: <i>Надворі падає сніг<\/i>, <i>Угорі пливуть хмари<\/i>.","Пари для тренування: <i>прийшов удень<\/i> — <i>у день народження<\/i>; <i>іти додому<\/i> — <i>до дому бабусі<\/i>; <i>вивчити напам’ять<\/i> — <i>подарувати на пам’ять<\/i>."],"rules":[{"f":"окремо: до речі, на жаль, на щастя, раз у раз, без кінця","means":"Це сполучення слів, а не одне слово: <i>На жаль, дощ не вщухав<\/i>."},{"f":"разом чи окремо? → встав означення: на (шкільному) дворі — окремо; надворі — разом","means":"Якщо іменник можна пояснити означенням чи поставити до нього питання — пишемо окремо. Якщо слово відповідає на питання прислівника (<i>де? коли? куди?<\/i>) і означення не вставиш — разом."}],"examples":[{"task":"Розкрий дужки: <i>(на)жаль, (до)речі, (раз)у(раз)<\/i>.","steps":[{"do":"<i>на жаль<\/i>, <i>до речі<\/i>","why":"Прислівникові сполучення прийменника з іменником пишемо окремо."},{"do":"<i>раз у раз<\/i>","why":"Сполучення з повтореним іменником пишемо окремо, без дефісів."}],"answer":"<i>На жаль, до речі, раз у раз.<\/i>"},{"task":"Розкрий дужки: 1) «(У)горі сяяли зорі». 2) «Друг не залишив мене (в)горі».","steps":[{"do":"1) Сяяли (де?) — <i>угорі<\/i>. Означення не вставиш.","why":"Це прислівник місця — пишемо разом."},{"do":"2) Не залишив (у якому?) <i>горі<\/i> — можна вставити означення: <i>у великому горі<\/i>.","why":"Тут іменник <i>горе<\/i> з прийменником — пишемо окремо."},{"do":"Після голосного <i>мене<\/i> пишемо <i>в<\/i>: <i>в горі<\/i>.","why":"Чергування <i>у<\/i> / <i>в<\/i> для милозвучності."}],"answer":"1) «Угорі сяяли зорі». 2) «Друг не залишив мене в горі»."},{"task":"Розкрий дужки: «Ми вивчили вірш (на)пам’ять, а вчителька подарувала нам книжку (на)пам’ять про свято».","steps":[{"do":"Вивчили (як?) <i>напам’ять<\/i>.","why":"Прислівник способу дії — пишемо разом."},{"do":"Подарувала <i>на пам’ять<\/i> (про що?) <i>про свято<\/i>.","why":"Іменник <i>пам’ять<\/i> має залежне слово — пишемо окремо."}],"answer":"«Ми вивчили вірш напам’ять, а вчителька подарувала нам книжку на пам’ять про свято»."}],"mistakes":["<i>Нажаль<\/i> → <i>на жаль<\/i>: це сполучення двох слів.","<i>Доречі<\/i> → <i>до речі<\/i> (у значенні «між іншим»). Не плутай з прислівником <i>доречно<\/i> (= вчасно, до місця).","<i>Раз-у-раз<\/i> → <i>раз у раз<\/i>: пишемо окремо, без дефісів."],"check":[{"q":"Розкрий дужки й напиши правильно: <i>(на)щастя<\/i>","accept":["на щастя"],"a":"<i>На щастя<\/i> — прислівникове сполучення, пишемо окремо."},{"q":"Пастка: у якому реченні слово в дужках пишемо разом?","options":["(На)дворі вже стемніло.","Ми гуляли (на)дворі нашої школи.","Книжку подарували (на)пам’ять про подорож."],"correct":0,"a":"<i>Надворі<\/i> (де?) — прислівник, разом. <i>На дворі<\/i> (чийому?) <i>нашої школи<\/i> і <i>на пам’ять<\/i> (про що?) — іменники з прийменником, окремо."},{"q":"Повідомлення в чаті класу: «…, завтра контрольна з математики!» Як правильно?","options":["Доречі","До речі","До-речі"],"correct":1,"a":"<i>До речі<\/i> — прислівникове сполучення, пишемо окремо."}]}},{"id":"U5.2.5","name":"Не та ні з прислівниками","status":"ready","programmeRef":"Написання не та ні з прислівниками.","lesson":{"what":"<b>Не<\/b> з прислівниками на <i>-о<\/i>, <i>-е<\/i> пишемо разом або окремо — за тими самими правилами, що й з прикметниками. <b>Ні<\/b> пишемо разом у заперечних прислівниках: <i>ніколи, ніде, нікуди<\/i>.","ideas":["<b>Разом<\/b>, якщо без <i>не<\/i> слово не вживається: <i>негайно, незабаром, невдовзі, неподалік<\/i>.","<b>Разом<\/b>, якщо слово з <i>не<\/i> можна замінити синонімом без <i>не<\/i>: <i>недалеко<\/i> (= близько), <i>небагато<\/i> (= мало), <i>неправильно<\/i> (= помилково), <i>нечасто<\/i> (= рідко).","<b>Окремо<\/b>, якщо є протиставлення з <i>а<\/i>: <i>не швидко, а повільно<\/i>; якщо заперечення підсилюють слова <i>зовсім, далеко, аж ніяк<\/i>: <i>зовсім не страшно<\/i>; з прислівниками, які пишемо через дефіс: <i>не по-нашому<\/i>; із займенниковими прислівниками та прислівниками на кшталт <i>не тут, не там, не завжди, не сьогодні<\/i>.","<b>Ні<\/b> пишемо разом у заперечних прислівниках: <i>ніколи, ніде, нікуди, нізвідки, ніяк, нітрохи<\/i>. Окремо — коли <i>ні<\/i> повторюється як сполучник: <i>ні вчора, ні сьогодні<\/i>."],"rules":[{"f":"разом: негайно, незабаром; недалеко (= близько), нечасто (= рідко)","means":"Слово без <i>не<\/i> не вживається або має синонім без <i>не<\/i>."},{"f":"окремо: не далеко, а близько; зовсім не далеко; не по-нашому; не завжди","means":"Протиставлення, підсилене заперечення, прислівник з дефісом, займенниковий прислівник — пишемо окремо."},{"f":"ні — разом: ніколи, ніде, ніяк; окремо: ні вчора, ні сьогодні","means":"<i>Ні<\/i> як частина заперечного прислівника — разом; повторюване <i>ні … ні<\/i> — окремо."}],"examples":[{"task":"Розкрий дужки: <i>(не)забаром, (не)весело, (ні)коли<\/i>.","steps":[{"do":"<i>незабаром<\/i>","why":"Слова <i>забаром<\/i> без <i>не<\/i> немає — разом."},{"do":"<i>невесело<\/i>","why":"Можна замінити синонімом <i>сумно<\/i> — разом."},{"do":"<i>ніколи<\/i>","why":"Заперечний прислівник з <i>ні<\/i> — разом."}],"answer":"<i>Незабаром, невесело, ніколи.<\/i>"},{"task":"Розкрий дужки: 1) «Ми йшли (не)швидко, а повільно». 2) «У темному коридорі було зовсім (не)страшно».","steps":[{"do":"1) <i>не швидко<\/i>","why":"Є протиставлення з <i>а<\/i> (<i>а повільно<\/i>) — окремо."},{"do":"2) <i>не страшно<\/i>","why":"Заперечення підсилює слово <i>зовсім<\/i> — окремо."}],"answer":"1) «Ми йшли не швидко, а повільно». 2) «У темному коридорі було зовсім не страшно»."},{"task":"Розкрий дужки: «Я (не)завжди встигаю на автобус, але запізнююся (не)часто».","steps":[{"do":"<i>не завжди<\/i>","why":"Синоніма без <i>не<\/i> тут не дібрати, а <i>не<\/i> лише заперечує дію — окремо."},{"do":"<i>нечасто<\/i>","why":"Можна замінити синонімом <i>рідко<\/i> — разом."}],"answer":"«Я не завжди встигаю на автобус, але запізнююся нечасто»."}],"mistakes":["<i>Не забаром<\/i> → <i>незабаром<\/i>: без <i>не<\/i> слово не вживається.","<i>Ні коли<\/i>, <i>ні де<\/i> → <i>ніколи<\/i>, <i>ніде<\/i>: заперечні прислівники пишемо разом.","<i>Зовсім нестрашно<\/i> → <i>зовсім не страшно<\/i>: слово <i>зовсім<\/i> підсилює заперечення, тому окремо."],"check":[{"q":"Розкрий дужки й напиши слово: <i>(не)подалік<\/i>","accept":["неподалік"],"a":"<i>Неподалік<\/i>: без <i>не<\/i> слово не вживається, тому пишемо разом."},{"q":"Пастка: як правильно? «Сьогодні … холодно, а тепло».","options":["не холодно","нехолодно"],"correct":0,"a":"<i>Не холодно<\/i>: є протиставлення з <i>а<\/i> (<i>а тепло<\/i>), тому окремо. Без протиставлення можна й разом: <i>Сьогодні нехолодно<\/i> (= тепло)."},{"q":"Ти пишеш другові: «Я … не бачив такого матчу!» Як правильно?","options":["ні коли","ніколи","ні-коли"],"correct":1,"a":"<i>Ніколи<\/i> — заперечний прислівник, <i>ні<\/i> пишемо разом."}]}}]},{"id":"U5.3","name":"Наголос у прислівниках","what":"Як правильно наголошувати.","subtopics":[{"id":"U5.3.1","name":"Наголошування прислівників","status":"ready","programmeRef":"Наголошування прислівників","lesson":{"what":"У деяких прислівниках наголос часто ставлять неправильно. Правильний наголос — частина культури мовлення, тобто вміння говорити за нормами літературної мови. У цьому уроці наголошений голосний позначено знаком наголосу.","ideas":["Запам’ятай: <i>завжди́<\/i>, <i>назавжди́<\/i>, <i>сього́дні<\/i>, <i>вчо́ра<\/i>, <i>уве́чері<\/i>, <i>надво́рі<\/i>, <i>напа́м’ять<\/i>.","У прислівниках з <i>по-<\/i> наголос зазвичай такий самий, як у прикметнику, від якого вони утворені: <i>украї́нський → по-украї́нськи<\/i>.","У вищому ступені з суфіксом <i>-іш-<\/i> наголос часто падає на цей суфікс: <i>тихі́ше<\/i>, <i>веселі́ше<\/i>.","Якщо сумніваєшся, перевір наголос в <b>орфоепічному словнику<\/b> — це словник правильної вимови."],"rules":[{"f":"завжди́, назавжди́","means":"Наголос на останньому складі. Не «за́вжди», не «наза́вжди»."},{"f":"сього́дні, надво́рі, напа́м’ять","means":"Наголос на другому складі: <i>Сього́дні надво́рі тепло<\/i>."}],"examples":[{"task":"Постав наголос у словах <i>завжди<\/i> і <i>сьогодні<\/i>.","steps":[{"do":"<i>завжди́<\/i>","why":"Наголос на останньому складі — так подає орфоепічний словник."},{"do":"<i>сього́дні<\/i>","why":"Наголос на другому складі."}],"answer":"<i>Завжди́, сього́дні.<\/i>"},{"task":"Прочитай уголос правильно: «Увечері ми вивчили вірш напам’ять».","steps":[{"do":"<i>уве́чері<\/i>","why":"Наголос як у слові <i>ве́чір<\/i> — на <i>е<\/i>."},{"do":"<i>напа́м’ять<\/i>","why":"Наголос як у слові <i>па́м’ять<\/i> — на <i>а<\/i> після <i>п<\/i>."}],"answer":"«Уве́чері ми вивчили вірш напа́м’ять»."},{"task":"Знайди слово з неправильним наголосом: <i>за́вжди, надво́рі, вчо́ра<\/i>.","steps":[{"do":"<i>надво́рі<\/i>, <i>вчо́ра<\/i> — правильно.","why":"Так подають орфоепічні словники."},{"do":"<i>за́вжди<\/i> — помилка, правильно <i>завжди́<\/i>.","why":"У цьому прислівнику наголос на останньому складі."}],"answer":"Неправильно <i>за́вжди<\/i>; правильно — <i>завжди́<\/i>."}],"mistakes":["<i>За́вжди<\/i> → <i>завжди́<\/i>.","<i>Наза́вжди<\/i> → <i>назавжди́<\/i>.","<i>На́пам’ять<\/i> → <i>напа́м’ять<\/i>."],"check":[{"q":"Як правильно наголошувати слово <i>завжди<\/i>?","options":["за́вжди","завжди́"],"correct":1,"a":"<i>Завжди́<\/i> — наголос на останньому складі."},{"q":"Пастка: у якому слові наголос правильний?","options":["напа́м’ять","на́пам’ять","напам’я́ть"],"correct":0,"a":"<i>Напа́м’ять<\/i> — наголос такий самий, як у слові <i>па́м’ять<\/i>."},{"q":"Друг надиктовує голосове: «Зустрінемося сього́дні уве́чері». Чи правильно він наголошує прислівники?","options":["Ні, треба «сьо́годні»","Ні, треба «увечері́»","Так, обидва наголоси правильні"],"correct":2,"a":"<i>Сього́дні<\/i> й <i>уве́чері<\/i> — правильні наголоси."}]}}]},{"id":"U5.4","name":"Мовлення: портретний нарис","what":"Розповідь про людину.","subtopics":[{"id":"U5.4.1","name":"Портретний нарис","status":"ready","programmeRef":"Портретний нарис.","lesson":{"what":"<b>Портретний нарис<\/b> — невеликий твір про <b>реальну<\/b> людину: її справи, характер, захоплення, вигляд. Автор розповідає правдиві факти й показує своє ставлення до героя. Нарис поєднує риси публіцистичного й художнього стилів.","ideas":["Опис зовнішності показує, <i>як людина виглядає<\/i>. Портретний нарис розповідає, <i>яка вона<\/i>, — через справжні події, вчинки, слова.","<b>Будова нарису.<\/b> Вступ — чим людина цікава (яскрава деталь чи випадок). Основна частина — 2–3 епізоди з життя, справи, риси характеру, кілька деталей зовнішності, її улюблені слова. Висновок — що автор думає про цю людину, чого від неї навчився.","Матеріал для нарису збирають: розпитують людину й тих, хто її знає, спостерігають, записують цікаві фрази.","Мова нарису: точні факти (де, коли, скільки), влучні дієслова й прислівники (<i>терпляче пояснює<\/i>, <i>щодня тренується<\/i>), пряма мова героя, епітети й порівняння."],"rules":[{"f":"портретний нарис = реальна людина + правдиві факти + ставлення автора","means":"Нічого не вигадуємо про справжню людину. Риси характеру не перелічуємо, а показуємо через вчинки: не «вона добра», а «вона щоранку годує бездомних котів біля школи»."}],"examples":[{"task":"Який текст — початок портретного нарису? А: «Тарас Іванович високий, з широкими плечима й сивими вусами. Він носить синій спортивний костюм». Б: «Щосуботи о восьмій ранку, коли шкільний стадіон ще порожній, Тарас Іванович уже розкладає м’ячі для своєї футбольної секції. Двадцять років поспіль він учить хлопців і дівчат грати чесно».","steps":[{"do":"Текст А розповідає лише про вигляд людини.","why":"Це опис зовнішності, а не нарис."},{"do":"Текст Б має точні факти (щосуботи, о восьмій, двадцять років) і показує справу людини.","why":"Правдиві факти й справи героя — ознаки портретного нарису."},{"do":"У тексті Б відчутне ставлення автора: він захоплюється відданістю тренера.","why":"У нарисі автор не байдужий до героя."}],"answer":"Початок нарису — текст Б."},{"task":"Склади план портретного нарису про шкільну бібліотекарку.","steps":[{"do":"Вступ: що особливого — щоранку вона першою приходить до школи й зустрічає дітей новими книжками.","why":"Вступ має зацікавити яскравою деталлю."},{"do":"Основна частина: як вона допомогла знайти книжку для проєкту; як організувала книжковий обмін; її улюблена фраза; уважний погляд, окуляри на ланцюжку.","why":"Епізоди, слова й кілька деталей зовнішності показують характер."},{"do":"Висновок: чого я навчився завдяки їй — любити читати й не боятися питати.","why":"Висновок передає ставлення автора."}],"answer":"План: 1) Перша зустріч зранку. 2) Допомога з проєктом. 3) Книжковий обмін. 4) Улюблені слова й зовнішність. 5) Чого я навчився."},{"task":"Покращ речення для нарису: «Бабуся Ганна добра. Вона багато працює».","steps":[{"do":"Замінимо загальне слово <i>добра<\/i> вчинком.","why":"У нарисі рису характеру показуємо через справжній факт."},{"do":"Замінимо <i>багато працює<\/i> точними подробицями: що саме й коли.","why":"Конкретні факти роблять нарис правдивим і живим."},{"do":"Додамо влучні прислівники: <i>щоранку<\/i>, <i>терпляче<\/i>.","why":"Прислівники точно передають, як і коли відбувається дія."}],"answer":"«Щоранку бабуся Ганна пече пиріжки для всіх сусідських дітей, а ввечері терпляче вчить мене вишивати хрестиком»."}],"mistakes":["Вигадують події про справжню людину. Правильно: у нарисі лише правдиві факти — розпитай людину чи тих, хто її знає.","Пишуть тільки про зовнішність. Це опис зовнішності; у нарисі головне — справи й характер, а зовнішність — кілька влучних деталей.","Перелічують риси без прикладів: «вона добра, чесна, весела». Правильно: покажи кожну рису через вчинок чи випадок."],"check":[{"q":"Що головне в портретному нарисі?","options":["Вигадана казкова історія про героя","Правдива розповідь про реальну людину з фактами й ставленням автора","Докладний опис одягу та обличчя"],"correct":1,"a":"Портретний нарис — правдива розповідь про реальну людину: її справи, характер, а також ставлення автора до неї."},{"q":"Пастка: який початок найкраще підходить для портретного нарису про шкільну бібліотекарку?","options":["Жила-була бібліотекарка, яка вміла оживляти книжки.","Бібліотекарка має карі очі й темне волосся.","Щоранку о сьомій, коли школа ще порожня, пані Оксана вже розкладає на столі нові книжки для першокласників."],"correct":2,"a":"Третій варіант — правдивий факт, точний час і справа людини. Перший — казка (вигадка), другий — лише опис зовнішності."},{"q":"Ти пишеш до шкільної газети нарис про тренера. Що варто додати?","options":["Його слова, які він часто повторює на тренуваннях","Вигадану перемогу на олімпіаді, щоб було цікавіше","Довгий список одягу, який він носить"],"correct":0,"a":"Улюблені слова героя (пряма мова) оживляють нарис і показують характер. Вигадувати факти не можна, а довгий опис одягу — не головне."}]}}]}]},{"id":"U6","subject":"ukr","name":"Службові частини мови. Вигук","what":"Прийменник, сполучник, частка — маленькі слова, що зв'язують і уточнюють; вигук — для почуттів.","topics":[{"id":"U6.1","name":"Прийменник","what":"Слова, що пов'язують слова в реченні: «на», «через», «з-під».","subtopics":[{"id":"U6.1.1","name":"Прийменник: види за будовою","status":"ready","programmeRef":"Прийменник як службова частина мови. Види прийменників за будовою.","lesson":{"what":"<b>Прийменник<\/b> — службова частина мови, яка разом із відмінковою формою іменника, займенника чи числівника показує зв’язок між словами: <i>стрибнув <b>через<\/b> калюжу, лист <b>від<\/b> бабусі<\/i>. <b>Службова<\/b> — значить, що сама по собі вона не називає ні предмета, ні ознаки, ні дії й не буває окремим членом речення.","ideas":["Прийменник стоїть перед іменником (займенником, числівником) або перед означенням до нього: <i>на зеленій траві<\/i>. Сам прийменник не змінюється.","За будовою прийменники бувають <b>прості<\/b> — з одного слова, яке не складається з інших прийменників: <i>в, на, з, до, від, під, над, без, для, через<\/i>; <b>складні<\/b> — утворені з двох прийменників або з прийменника та іншого слова: <i>з-під, з-за, понад, поміж, навколо, заради<\/i>; <b>складені<\/b> — з кількох окремих слів: <i>незважаючи на, відповідно до, у зв’язку з, під час, на відміну від<\/i>.","Деякі слова бувають то прийменником, то прислівником. Якщо після слова стоїть іменник (займенник), якого воно стосується, — це прийменник: <i>Навколо <b>школи<\/b> посадили каштани<\/i>. Якщо такого іменника немає, а слово відповідає на питання <i>де? як?<\/i>, — це прислівник: <i>Навколо було тихо<\/i>.","Прийменник не є членом речення: він разом з іменником утворює один член речення. <i>За партою<\/i> — це одна обставина, а не «за» окремо."],"rules":[{"f":"прості: на, до, з · складні: з-під, поміж, навколо · складені: під час, незважаючи на","means":"Простий — одне коротке слово; складний — одне слово, утворене з кількох (іноді через дефіс); складений — кілька окремих слів, що разом працюють як один прийменник."},{"f":"навколо будинку — прийменник; навколо (де?) — прислівник","means":"Прийменник завжди «тягне» за собою іменник чи займенник у певному відмінку. Прислівник стоїть сам і відповідає на питання."}],"examples":[{"task":"Знайди прийменники й визнач їхній вид за будовою: <i>Через годину з-за хмари визирнуло сонце.<\/i>","steps":[{"do":"<i>через<\/i> (годину) — простий","why":"Одне слово, яке не складається з інших прийменників."},{"do":"<i>з-за<\/i> (хмари) — складний","why":"Утворений із двох прийменників <i>з<\/i> і <i>за<\/i>, пишемо через дефіс."}],"answer":"Прийменники: <i>через<\/i> — простий, <i>з-за<\/i> — складний."},{"task":"Знайди прийменники й визнач їхній вид: <i>Відповідно до розкладу урок фізкультури буде на стадіоні.<\/i>","steps":[{"do":"<i>відповідно до<\/i> (розкладу) — складений","why":"Два окремі слова, які разом пов’язують <i>буде<\/i> і <i>розкладу<\/i>, тобто працюють як один прийменник."},{"do":"<i>на<\/i> (стадіоні) — простий","why":"Одне слово, з інших прийменників не складається."}],"answer":"<i>Відповідно до<\/i> — складений прийменник, <i>на<\/i> — простий."},{"task":"Прийменник чи прислівник? 1) <i>Поблизу річки ми поставили намет.<\/i> 2) <i>Поблизу шуміла річка.<\/i>","steps":[{"do":"У 1) після <i>поблизу<\/i> стоїть іменник <i>річки<\/i> в родовому відмінку","why":"Слово пов’язує <i>поставили<\/i> з іменником <i>річки<\/i> — так працює прийменник."},{"do":"У 2) після <i>поблизу<\/i> немає іменника, якого воно стосується; ставимо питання: шуміла <i>де?<\/i> — поблизу","why":"<i>Річка<\/i> тут — підмет, від слова <i>поблизу<\/i> вона не залежить. Самостійне слово з питанням <i>де?<\/i> — прислівник."}],"answer":"1) прийменник; 2) прислівник."}],"mistakes":["Підкреслюють прийменник як окремий член речення. Правильно: <i>за партою<\/i> — одна обставина, прийменник — лише її частина.","Плутають складний і складений прийменник. <i>З-під<\/i> — одне слово (складний), <i>під час<\/i> — два слова (складений).","Кожне <i>навколо<\/i> називають прийменником. Якщо після нього немає іменника, якого воно стосується (<i>Навколо тихо<\/i>), — це прислівник."],"check":[{"q":"Який прийменник складений?","options":["понад","з-поміж","у зв’язку з","через"],"correct":2,"a":"<i>У зв’язку з<\/i> — складений: кілька окремих слів. <i>Понад<\/i> і <i>з-поміж<\/i> — складні (одне слово), <i>через<\/i> — простий."},{"q":"Пастка: у реченні <i>Діти бігали навколо.<\/i> слово <i>навколо<\/i> — це…","options":["прислівник","прийменник"],"correct":0,"a":"Прислівник: після нього немає іменника, якого воно стосується, а саме слово відповідає на питання <i>де?<\/i> Порівняй: <i>бігали навколо ялинки<\/i> — тут уже прийменник."},{"q":"Оголошення на дверях класу: <i>Під час перерви не бігайте коридором.<\/i> Випиши складений прийменник (два слова).","accept":["під час"],"a":"<i>Під час<\/i> — складений прийменник: два окремі слова, що разом означають час."}]}},{"id":"U6.1.2","name":"Написання прийменників","status":"ready","programmeRef":"Написання прийменників разом, окремо та з дефісом.","lesson":{"what":"Прийменники пишемо <b>разом<\/b>, <b>через дефіс<\/b> або <b>окремо<\/b> — залежно від того, як вони утворені. Правило коротке, а помилки в ньому трапляються часто.","ideas":["<b>Разом<\/b> пишемо складні прийменники, утворені з кількох прийменників або з прийменника та іншого слова: <i>понад, поміж, посеред, навколо, довкола, заради, задля, щодо, замість, наприкінці<\/i>.","<b>Через дефіс<\/b> пишемо складні прийменники з першою частиною <i>з<\/i> (<i>із<\/i>): <i>з-за, з-під, з-над, з-поміж, з-понад, із-за, із-під<\/i>.","<b>Окремо<\/b> пишемо складені прийменники — кожне слово окремо: <i>під час, відповідно до, згідно з, у зв’язку з, на відміну від, залежно від<\/i>. У прийменнику <i>незважаючи на<\/i> перша частина — одне слово, а <i>на<\/i> пишемо окремо.","Не плутай прийменник <i>незважаючи на<\/i> (= попри) з дієприслівником <i>не зважаючи<\/i> (= не звертаючи уваги): <i>Незважаючи на дощ, футбольний матч відбувся<\/i>, але <i
