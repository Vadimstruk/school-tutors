з рівнянь на −1.","Помиляються зі знаками: −5 · (−1) записують як −5. Мінус на мінус — плюс: −5 · (−1) = 5."],"check":[{"q":"Розв'яжи систему { 2x + y = 11; 3x − y = 4 }.","options":["(5; 1)","(1; 9)","(3; 5)"],"correct":2,"a":"Додаємо: 5x = 15, x = 3; 2 · 3 + y = 11, y = 5. Перевірка: 6 + 5 = 11 і 9 − 5 = 4. Пари (5; 1) і (1; 9) задовольняють лише перше рівняння."},{"q":"Пастка: скільки розв'язків має система { 2x + 3y = 5; 4x + 6y = 10 }?","options":["Жодного","Безліч","Один: (1; 1)"],"correct":1,"a":"Помножимо перше на −2: −4x − 6y = −10. Додамо до другого: 0 = 0. Розв'язків безліч: (1; 1) — лише один із них, є ще (4; −1), (−2; 3)…"},{"q":"У скарбничці 12 монет по 2 грн і по 5 грн, разом 39 грн. x — монети по 2 грн, y — по 5 грн: { x + y = 12; 2x + 5y = 39 }. Скільки монет по 5 грн?","accept":["5"],"a":"Перше помножимо на −2: −2x − 2y = −24. Додамо до другого: 3y = 15, y = 5; x = 7. Перевірка: 7 + 5 = 12 і 14 + 25 = 39."}]}}]},{"id":"A4.3","name":"Задачі за допомогою систем","what":"Дві невідомі величини — два рівняння.","subtopics":[{"id":"A4.3.1","name":"Складаємо систему за умовою задачі","status":"ready","programmeRef":"Розв'язування задач за допомогою систем лiнійних рівнянь.","lesson":{"what":"Якщо в задачі дві невідомі величини, позначаємо їх x і y і з двох умов задачі складаємо два рівняння — виходить система. Таку систему називають <b>математичною моделлю<\/b> задачі: вона записує умову мовою математики.","ideas":["Порядок: що відомо → що знайти → що позначимо x, а що y → два рівняння → розв'язуємо систему → відповідь словами.","Кожна умова задачі («разом 25», «на 4 більше», «утричі старша») дає одне рівняння.","Усі величини — в однакових одиницях: гривні з гривнями, роки з роками.","Перевір відповідь за текстом задачі, а не лише за системою, і чи вона розумна: кількість людей чи квитків — ціле невід'ємне число."],"rules":[{"f":"дві невідомі → дві умови → система з двох рівнянь","means":"Скільки невідомих позначили буквами, стільки й рівнянь треба скласти."}],"examples":[{"task":"Сума двох чисел дорівнює 30, а їх різниця — 8. Знайди ці числа.","steps":[{"do":"Більше число — x, менше — y: { x + y = 30; x − y = 8 }","why":"Дві умови — два рівняння."},{"do":"Додамо рівняння: 2x = 38, x = 19","why":"Коефіцієнти перед y протилежні — спосіб додавання."},{"do":"19 + y = 30, y = 11","why":"Підставили x у перше рівняння."},{"do":"Перевірка: 19 + 11 = 30 і 19 − 11 = 8","why":"Обидві умови задачі виконуються."}],"answer":"Відповідь: 19 і 11."},{"task":"Для класу купили 25 квитків до театру: дитячі по 80 грн і дорослі по 120 грн. Усього заплатили 2200 грн. Скільки купили дитячих квитків?","steps":[{"do":"x — дитячі квитки, y — дорослі: { x + y = 25; 80x + 120y = 2200 }","why":"Перша умова — кількість квитків, друга — вартість."},{"do":"y = 25 − x; 80x + 120(25 − x) = 2200","why":"Спосіб підстановки: виразили y з першого рівняння."},{"do":"80x + 3000 − 120x = 2200, −40x = −800, x = 20","why":"Розкрили дужки, звели подібні, поділили на −40."},{"do":"y = 25 − 20 = 5. Перевірка: 20 · 80 + 5 · 120 = 1600 + 600 = 2200","why":"Вартість збігається з умовою."}],"answer":"Відповідь: 20 дитячих квитків (і 5 дорослих)."},{"task":"Мама старша за доньку на 26 років, а через 4 роки буде старшою за неї утричі. Скільки років кожній зараз?","steps":[{"do":"x — вік мами зараз, y — вік доньки зараз","why":"Дві невідомі величини."},{"do":"{ x − y = 26; x + 4 = 3(y + 4) }","why":"Через 4 роки кожна стане старшою на 4 роки — додаємо 4 до обох."},{"do":"x = y + 26; y + 26 + 4 = 3y + 12, 30 − 12 = 3y − y, 2y = 18, y = 9","why":"Підставили x з першого рівняння в друге."},{"do":"x = 9 + 26 = 35. Перевірка: 35 − 9 = 26; через 4 роки 39 і 13, 39 = 3 · 13","why":"Обидві умови виконуються."}],"answer":"Відповідь: мамі 35 років, доньці 9 років."}],"mistakes":["Складають одне рівняння для двох невідомих. Правильно: дві невідомі — дві умови — два рівняння.","У задачах на вік додають роки лише одній людині. Через 4 роки старшими на 4 роки стануть <b>обидві<\/b>.","Відповідають не на те питання: знайшли x і y, а питали лише про дорослі квитки. Перечитай питання перед відповіддю."],"check":[{"q":"У класі 28 учнів, дівчат на 4 більше, ніж хлопців. x — кількість дівчат, y — хлопців. Яка система є моделлю задачі?","options":["{ x + y = 28; x − y = 4 }","{ x + y = 28; y − x = 4 }","{ x − y = 28; x + y = 4 }"],"correct":0,"a":"Разом 28 — x + y = 28; дівчат на 4 більше — x − y = 4. Розв'язок: 16 дівчат і 12 хлопців (16 + 12 = 28, 16 − 12 = 4)."},{"q":"Пастка: ручка коштує x грн, зошит — y грн. 2 ручки і 3 зошити коштують 60 грн, а 4 ручки і 6 зошитів — 100 грн. Скільки розв'язків має ця задача?","options":["Один","Жодного — умова суперечлива","Безліч"],"correct":1,"a":"{ 2x + 3y = 60; 4x + 6y = 100 }. 4 ручки і 6 зошитів — це вдвічі більша покупка, тож мала б коштувати 120 грн, а не 100. Розв'язків немає."},{"q":"За 3 кг яблук і 2 кг груш заплатили 130 грн, а за 2 кг яблук і 3 кг груш — 145 грн. Скільки гривень коштує 1 кг груш?","accept":["35"],"a":"{ 3x + 2y = 130; 2x + 3y = 145 }, x — ціна яблук, y — груш. Перше помножимо на 2, друге на −3 і додамо: −5y = −175, y = 35; x = 20. Перевірка: 60 + 70 = 130 і 40 + 105 = 145."}]}}]}]}]},{"id":"geometry","name":"Геометрія","grade":7,"tutor":"Оля","tutorCall":"Олю","icon":"📐","sections":[{"id":"G1","subject":"geometry","name":"Елементарні геометричні фігури та їх властивості","what":"Точки, прямі, відрізки, промені й кути — з них складається вся геометрія. Учимося їх вимірювати.","topics":[{"id":"G1.1","name":"Точка, пряма, відрізок, промінь","what":"Найпростіші фігури і їхні властивості.","subtopics":[{"id":"G1.1.1","name":"Геометричні фігури. Точка і пряма","status":"ready","programmeRef":"Геометричні фігури.","lesson":{"what":"Геометрія вивчає фігури. <b>Геометрична фігура<\/b> — це будь-який набір точок: точка, пряма, трикутник, коло. Найпростіші з них — <b>точка<\/b> і <b>пряма<\/b>.","ideas":["Точка не має ні довжини, ні ширини. Її моделі — слід від гострого олівця, зірка на нічному небі, місто на великій карті. Точки позначають великими латинськими літерами: A, B, C.","Пряма не має ні початку, ні кінця — вона нескінченна в обидва боки. У зошиті ми малюємо за лінійкою лише її частину. Моделі прямої — туго натягнута нитка, промінь лазерної указки.","Пряму позначають малою латинською літерою (пряма <i>a<\/i>) або двома її точками (пряма AB). Пряма AB і пряма BA — це та сама пряма.","Якщо точка лежить на прямій, кажуть, що вона <b>належить<\/b> прямій: A ∈ <i>a<\/i>. Якщо не лежить — не належить: B ∉ <i>a<\/i>.","Дві прямі, які мають спільну точку, <b>перетинаються<\/b> в цій точці."],"rules":[{"f":"Через будь-які дві точки можна провести пряму, і до того ж тільки одну.","means":"Основна властивість прямої. Дві точки повністю задають пряму — тому пряму можна назвати двома її точками."},{"f":"Яка б не була пряма, існують точки, що належать цій прямій, і точки, що їй не належать.","means":"Поруч із будь-якою прямою завжди можна позначити точку і на ній, і поза нею."},{"f":"Дві різні прямі мають не більше однієї спільної точки.","means":"Якби спільних точок було дві, то через них проходили б дві різні прямі, а так не буває (див. основну властивість)."}],"examples":[{"task":"Накресліть пряму <i>a<\/i>. Позначте на ній точки A і B, а поза нею — точку C. Запишіть символами, які точки належать прямій <i>a<\/i>, а які ні. Чи можна провести через A і B ще одну пряму, відмінну від <i>a<\/i>?","steps":[{"do":"Малюємо пряму <i>a<\/i>, на ній точки A і B, а трохи вище прямої — точку C.","why":"Яка б не була пряма, є точки, що їй належать, і точки, що їй не належать."},{"do":"A і B лежать на прямій, тому A ∈ <i>a<\/i>, B ∈ <i>a<\/i>.","why":"«Належить» означає «лежить на»."},{"do":"C не лежить на прямій, тому C ∉ <i>a<\/i>.","why":"Знак ∉ означає «не належить»."},{"do":"Інша пряма через A і B неможлива: через них уже проходить пряма <i>a<\/i>.","why":"Через дві точки можна провести пряму, і до того ж тільки одну."}],"answer":"Відповідь: A ∈ <i>a<\/i>, B ∈ <i>a<\/i>, C ∉ <i>a<\/i>; іншої прямої через A і B провести не можна."},{"task":"Позначте в зошиті чотири точки A, B, C, D так, щоб жодні три з них не лежали на одній прямій. Скільки різних прямих можна провести через кожні дві з цих точок?","steps":[{"do":"Малюємо: чотири точки, наче кути неправильного чотирикутника. Дано: 4 точки, жодні три не на одній прямій. Знайти: кількість прямих.","why":"Спершу малюнок — так легше нічого не пропустити."},{"do":"Через точку A проводимо прямі до кожної з інших: AB, AC, AD — 3 прямі.","why":"Через дві точки проходить одна пряма, і тільки одна."},{"do":"Через точку B — нові прямі BC і BD (пряму BA вже порахували) — 2 прямі. Через C — нова пряма CD — 1 пряма.","why":"Пряма AB і пряма BA — та сама пряма, рахувати її двічі не можна."},{"do":"Разом: 3 + 2 + 1 = 6.","why":"Жодні три точки не на одній прямій, тому всі ці прямі різні."}],"answer":"Відповідь: 6 прямих (AB, AC, AD, BC, BD, CD)."},{"task":"Три прямі <i>a<\/i>, <i>b<\/i>, <i>c<\/i> попарно перетинаються, але не проходять через одну точку. Скільки всього точок перетину? Накресліть у зошиті: три прямі, що утворюють «трикутник».","steps":[{"do":"Дано: прямі <i>a<\/i>, <i>b<\/i>, <i>c<\/i> попарно перетинаються, через одну точку всі три не проходять. Знайти: кількість точок перетину.","why":"Записуємо умову."},{"do":"Складаємо пари прямих: <i>a<\/i> і <i>b<\/i>, <i>a<\/i> і <i>c<\/i>, <i>b<\/i> і <i>c<\/i> — 3 пари.","why":"Кожна точка перетину належить якійсь парі прямих."},{"do":"Кожна пара має рівно одну спільну точку.","why":"Дві різні прямі мають не більше однієї спільної точки, а за умовою вони перетинаються."},{"do":"Ці три точки різні, бо всі три прямі не проходять через одну точку. Разом 3 точки.","why":"Якби дві точки перетину збіглися, три прямі пройшли б через неї."}],"answer":"Відповідь: 3 точки перетину."}],"mistakes":["Вважати, що в прямої є кінці або довжина. Пряма нескінченна; кінці є у відрізка.","Рахувати пряму AB і пряму BA як дві різні прямі.","Думати, що через будь-які три точки можна провести одну пряму. Це так лише тоді, коли точки лежать на одній прямій."],"check":[{"q":"<b>Пастка.<\/b> Через будь-які три точки можна провести одну пряму?","options":["Так, завжди","Лише якщо вони лежать на одній прямій","Ніколи"],"correct":1,"a":"Лише якщо точки лежать на одній прямій. Інакше через кожні дві точки — своя пряма, разом 3 прямі."},{"q":"Садівник хоче посадити цибулю рівним рядком і натягнути мотузку між кілочками. Скільки кілочків йому досить?","options":["Три","Один","Два"],"correct":2,"a":"Два, бо через дві точки проходить пряма, і тільки одна."},{"q":"Позначили 5 точок, жодні три з яких не лежать на одній прямій. Скільки різних прямих можна провести через кожні дві з них? Введіть число.","accept":["10"],"a":"4 + 3 + 2 + 1 = 10: від першої точки — 4 прямі, від другої — ще 3 нові, і так далі."}]}},{"id":"G1.1.2","name":"Відрізок і промінь","status":"ready","programmeRef":"Точка, пряма, відрізок, промінь, кут. Їх властивості.","lesson":{"what":"<b>Відрізок<\/b> AB — частина прямої між точками A і B разом із цими точками; A і B — його <b>кінці<\/b>. <b>Промінь<\/b> — частина прямої, що має початок, але не має кінця: точка і всі точки прямої по один бік від неї.","ideas":["Порівняйте: у відрізка два кінці, у променя — лише початок, у прямої — ні початку, ні кінця.","«Точка C <b>лежить між<\/b> точками A і B» означає: C лежить на відрізку AB і не збігається з його кінцями.","Промінь називають двома літерами, і першою завжди пишуть початок: промінь OA починається в точці O і йде через точку A. Промінь AO — це вже інший промінь.","Точка O на прямій ділить її на два промені з початком O, які йдуть у протилежні боки. Їх називають <b>доповняльними<\/b>: разом вони складають усю пряму.","Моделі: край лінійки чи натягнута струна — відрізок; світло від ліхтарика — промінь (є початок, а далі воно йде в один бік)."],"rules":[{"f":"З трьох точок на прямій одна і тільки одна лежить між двома іншими.","means":"Основна властивість розміщення точок на прямій: якщо три точки на одній прямій, то рівно одна з них — «посередині»."},{"f":"Промінь OA: O — початок, A — будь-яка інша точка променя.","means":"Якщо на промені OA лежить ще точка B, то промінь OB — той самий промінь, що й OA."}],"examples":[{"task":"Накресліть пряму і позначте на ній точки A, B, C так, щоб точка B лежала між A і C. Назвіть промені з початком у точці B. Якому з них належить точка A?","steps":[{"do":"Малюємо пряму, на ній зліва направо A, B, C.","why":"B лежить між A і C, тому вона посередині."},{"do":"Точка B ділить пряму на два доповняльні промені: BA (ліворуч) і BC (праворуч).","why":"Точка на прямій ділить її на два промені; першою пишемо початок."},{"do":"Точка A лежить ліворуч від B, тобто на промені BA, а не на промені BC.","why":"Промінь BC іде від B праворуч, через C."}],"answer":"Відповідь: промені BA і BC; точка A належить променю BA."},{"task":"Накресліть пряму і позначте на ній точки M, K, P так, щоб точка K лежала між M і P. Скільки утворилося відрізків з кінцями в цих точках і скільки променів з початками в цих точках?","steps":[{"do":"Малюємо пряму, на ній зліва направо точки M, K, P.","why":"K лежить між M і P, тому вона посередині."},{"do":"Відрізки: MK, KP, MP — 3 відрізки.","why":"Відрізок задають два кінці, а пар точок тут три."},{"do":"Кожна точка ділить пряму на два доповняльні промені: у M — 2, у K — 2, у P — 2. Разом 2 + 2 + 2 = 6.","why":"Точка на прямій ділить її рівно на два промені."},{"do":"Зауважимо: промінь MK і промінь MP — той самий промінь (обидва починаються в M і йдуть праворуч). Тому рахуємо його один раз.","why":"Промінь визначають початок і напрям; точка P лежить на промені MK."}],"answer":"Відповідь: 3 відрізки і 6 променів."},{"task":"Точки A, B, C, D лежать на прямій саме в такому порядку. Скільки всього відрізків з кінцями в цих точках? У яких із них точка B лежить між кінцями?","steps":[{"do":"Малюємо пряму і на ній зліва направо A, B, C, D.","why":"Порядок точок задано в умові."},{"do":"Відрізки з кінцем A: AB, AC, AD (3); нові з кінцем B: BC, BD (2); нові з кінцем C: CD (1). Разом 3 + 2 + 1 = 6.","why":"Відрізок задають два кінці; AB і BA — той самий відрізок."},{"do":"B лежить між кінцями, якщо один кінець ліворуч від B, а другий — праворуч. Ліворуч лише A, праворуч — C і D.","why":"Означення «лежить між»."},{"do":"Отже, це відрізки AC і AD.","why":"У AB і BD точка B — кінець, а не внутрішня точка."}],"answer":"Відповідь: 6 відрізків; точка B лежить між кінцями відрізків AC і AD."}],"mistakes":["Плутати промінь OA і промінь AO. Першою літерою завжди пишуть початок.","Вважати промені MK і MP різними, хоча P лежить на промені MK — це той самий промінь.","Плутати відрізок, промінь і пряму на малюнку: відрізок малюють з двома позначеними кінцями, промінь — з одним, пряму — без кінців."],"check":[{"q":"<b>Пастка.<\/b> Що довше: промінь OA чи відрізок OA?","options":["Промінь OA","Відрізок OA","Порівняти не можна: промінь не має довжини"],"correct":2,"a":"Промінь нескінченний, у нього немає довжини. Довжину має лише відрізок."},{"q":"Світло від ліхтарика в темряві — це модель якої фігури?","options":["Відрізка","Променя","Прямої"],"correct":1,"a":"Променя: є початок (ліхтарик), а далі світло йде в один бік."},{"q":"Точки A, B, C лежать на прямій, B лежить між A і C. Чи належить точка C променю AB?","options":["Так","Ні"],"correct":0,"a":"Так: промінь AB іде від A через B і далі, а C лежить за B."}]}}]},{"id":"G1.2","name":"Кут","what":"Кут, його види і бісектриса.","subtopics":[{"id":"G1.2.1","name":"Кут і види кутів","status":"ready","programmeRef":"Точка, пряма, відрізок, промінь, кут. Їх властивості.","lesson":{"what":"<b>Кут<\/b> — фігура з двох променів зі спільним початком. Промені — це <b>сторони<\/b> кута, а їхній спільний початок — <b>вершина<\/b>.","ideas":["Кут позначають трьома літерами, вершина — завжди посередині: ∠ABC (вершина B). ∠ABC і ∠CBA — той самий кут, а ∠BAC — зовсім інший. Якщо зрозуміло, можна коротко: ∠B.","Кут, сторони якого — доповняльні промені (разом утворюють пряму), називають <b>розгорнутим<\/b>. Він дорівнює 180°.","Види кутів: <b>гострий<\/b> — менший за 90°; <b>прямий<\/b> — 90°; <b>тупий<\/b> — більший за 90°, але менший за 180°; <b>розгорнутий<\/b> — 180°.","Прямий кут на малюнку позначають маленьким квадратиком біля вершини.","Розмір кута не залежить від того, наскільки довгими намальовано його сторони. Моделі кута — стрілки годинника, розкриті ножиці, відчинені двері."],"rules":[{"f":"гострий: менше 90°; прямий: 90°; тупий: від 90° до 180° (не включно); розгорнутий: 180°","means":"Вид кута визначають за його градусною мірою."}],"examples":[{"task":"Визначте вид кожного кута: 35°, 90°, 91°, 179°, 180°.","steps":[{"do":"Згадуємо межі: гострий — менше 90°, прямий — 90°, тупий — більше 90°, але менше 180°, розгорнутий — 180°.","why":"Класифікація кутів за градусною мірою."},{"do":"35° < 90°, тому 35° — гострий; 90° — прямий.","why":"Порівнюємо з 90°."},{"do":"91° і 179° більші за 90°, але менші за 180°, тому обидва тупі.","why":"Навіть 91° — уже тупий, а 179° — ще не розгорнутий."},{"do":"180° — розгорнутий.","why":"Розгорнутий кут дорівнює 180°."}],"answer":"Відповідь: 35° — гострий, 90° — прямий, 91° і 179° — тупі, 180° — розгорнутий."},{"task":"Які кути утворюють годинна і хвилинна стрілки о 2:00, 3:00, 5:00 і 6:00? Назвіть вид кожного кута. Намалюйте в зошиті циферблат із цими положеннями стрілок.","steps":[{"do":"Малюємо циферблат. Повне коло — 360°, на ньому 12 поділок-годин. Одна поділка: 360° : 12 = 30°.","why":"Цифри на циферблаті розміщені через рівні проміжки."},{"do":"О цілій годині хвилинна стрілка на 12, а годинна — точно на числі годин. О 2:00 між ними 2 поділки: 2 · 30° = 60°; о 3:00 — 3 · 30° = 90°.","why":"Кут дорівнює кількості поділок між стрілками, помноженій на 30°."},{"do":"О 5:00: 5 · 30° = 150°; о 6:00: 6 · 30° = 180° — стрілки утворюють пряму.","why":"Той самий підрахунок поділок."},{"do":"Класифікуємо: 60° — гострий; 90° — прямий; 150° — тупий; 180° — розгорнутий.","why":"Порівнюємо з 90° і 180°."}],"answer":"Відповідь: о 2:00 — 60° (гострий), о 3:00 — 90° (прямий), о 5:00 — 150° (тупий), о 6:00 — 180° (розгорнутий)."},{"task":"З точки O проведено чотири промені OA, OB, OC, OD; вони йдуть по черзі, як віяло, і ∠AOD менший за розгорнутий. Скільки кутів з вершиною O на малюнку? Назвіть їх.","steps":[{"do":"Малюємо точку O і віялом чотири промені: OA, OB, OC, OD.","why":"Спершу малюнок."},{"do":"Кут утворюють будь-які два промені зі спільним початком O. Кути зі стороною OA: ∠AOB, ∠AOC, ∠AOD — 3.","why":"Означення кута."},{"do":"Нові кути зі стороною OB: ∠BOC, ∠BOD — 2; зі стороною OC: ∠COD — 1.","why":"∠BOA — це вже порахований ∠AOB, вершина O посередині назви."},{"do":"Разом 3 + 2 + 1 = 6.","why":"Кожну пару променів рахуємо один раз."}],"answer":"Відповідь: 6 кутів: ∠AOB, ∠AOC, ∠AOD, ∠BOC, ∠BOD, ∠COD."}],"mistakes":["Ставити вершину не посередині назви: для кута з вершиною B писати ∠BAC замість ∠ABC.","Думати, що кут стане більшим, якщо подовжити його сторони. Розмір кута від довжини сторін не залежить.","Плутати прямий кут (90°) з розгорнутим (180°). «Прямий» — не тому, що схожий на пряму!"],"check":[{"q":"<b>Пастка.<\/b> Учень подовжив сторони кута вдвічі. Що сталося з кутом?","options":["Не змінився","Збільшився вдвічі","Зменшився"],"correct":0,"a":"Кут залежить від того, наскільки «розходяться» сторони, а не від їхньої довжини."},{"q":"Двері відчинили так, що між дверима і стіною кут 120°. Який це кут?","options":["Гострий","Прямий","Тупий","Розгорнутий"],"correct":2,"a":"Тупий: 120° більше за 90°, але менше за 180°."},{"q":"З вершини O проведено промені OA, OB, OC, причому OB лежить між OA і OC. Скільки кутів з вершиною O на малюнку? Введіть число.","accept":["3"],"a":"Три: ∠AOB, ∠BOC, ∠AOC."}]}},{"id":"G1.2.2","name":"Бісектриса кута","status":"ready","programmeRef":"Бісектриса кута.","lesson":{"what":"<b>Бісектриса кута<\/b> — промінь з початком у вершині кута, який проходить між його сторонами і ділить кут навпіл, тобто на два рівні кути.","ideas":["<b>Рівні кути<\/b> — кути з однаковою градусною мірою.","Якщо OK — бісектриса ∠AOB, то ∠AOK = ∠KOB, і кожен з них — половина ∠AOB.","У кожного кута є бісектриса, і тільки одна.","Бісектриса розгорнутого кута утворює з його сторонами два прямі кути: 180° : 2 = 90°.","Як знайти бісектрису: виміряти кут транспортиром, поділити на 2 і відкласти половину від однієї сторони. Або вирізати кут з паперу й перегнути так, щоб сторони збіглися: лінія згину — бісектриса."],"rules":[{"f":"OK — бісектриса ∠AOB ⇒ ∠AOK = ∠KOB = ∠AOB : 2","means":"Щоб знайти половинку, ділимо весь кут на 2."},{"f":"∠AOB = 2 · ∠AOK","means":"Щоб знайти весь кут за половинкою, множимо на 2."}],"examples":[{"task":"Промінь OK — бісектриса ∠AOB, ∠AOK = 37°. Знайдіть ∠AOB. Накресліть кут AOB і промінь OK посередині.","steps":[{"do":"Дано: OK — бісектриса ∠AOB, ∠AOK = 37°. Знайти: ∠AOB.","why":"Записуємо умову."},{"do":"∠KOB = ∠AOK = 37°.","why":"Бо бісектриса ділить кут на два рівні кути."},{"do":"∠AOB = ∠AOK + ∠KOB = 37° + 37° = 74°.","why":"Бо промінь OK проходить між сторонами ∠AOB, і кут дорівнює сумі цих кутів."}],"answer":"Відповідь: ∠AOB = 74°."},{"task":"∠AOB = 140°. Промінь OK — бісектриса ∠AOB, промінь OM — бісектриса ∠AOK. Знайдіть ∠MOB. Накресліть у зошиті: кут AOB, всередині промінь OK, а між OA і OK — промінь OM.","steps":[{"do":"Дано: ∠AOB = 140°, OK — бісектриса ∠AOB, OM — бісектриса ∠AOK. Знайти: ∠MOB.","why":"Записуємо умову, щоб бачити, що відомо."},{"do":"∠AOK = ∠KOB = 140° : 2 = 70°.","why":"Бо бісектриса ділить кут навпіл."},{"do":"∠MOK = 70° : 2 = 35°.","why":"Бо OM — бісектриса ∠AOK."},{"do":"∠MOB = ∠MOK + ∠KOB = 35° + 70° = 105°.","why":"Бо промінь OK проходить між сторонами ∠MOB, а кут дорівнює сумі кутів, на які його ділить такий промінь."}],"answer":"Відповідь: ∠MOB = 105°."},{"task":"О 3:00 стрілки годинника утворюють прямий кут. Яким числом циферблата «вказує» бісектриса цього кута, і який кут вона утворює з хвилинною стрілкою? Намалюйте циферблат і бісектрису.","steps":[{"do":"О 3:00 хвилинна стрілка на 12, годинна на 3; кут між ними 3 · 30° = 90°.","why":"Одна поділка циферблата — 360° : 12 = 30°."},{"do":"Бісектриса утворює з кожною стрілкою кут 90° : 2 = 45°.","why":"Бо бісектриса ділить кут навпіл."},{"do":"45° : 30° = 1,5 поділки від числа 12, тобто рівно посередині між 1 і 2.","why":"Кожна поділка — 30°, а 45° — це півтори поділки."}],"answer":"Відповідь: бісектриса проходить посередині між числами 1 і 2 і утворює з хвилинною стрілкою кут 45°."}],"mistakes":["Множити замість ділити: шукаючи половину кута, писати 2 · ∠AOB.","Вважати бісектрисою будь-який промінь між сторонами кута. Бісектриса ділить кут саме на два <b>рівні<\/b> кути.","Шукати бісектрису «на око». Перевіряйте транспортиром: обидва утворені кути мають бути однакові."],"check":[{"q":"<b>Пастка.<\/b> Бісектриса гострого кута утворює з його стороною кут 50°. Чи можливо таке?","options":["Ні","Так"],"correct":0,"a":"Ні: тоді весь кут 2 · 50° = 100°, а це тупий кут, не гострий."},{"q":"Бісектриса ділить кут на два кути по 45°. Скільки градусів у всьому куті? Введіть число.","accept":["90"],"a":"2 · 45° = 90°, це прямий кут."},{"q":"Як знайти бісектрису кута, вирізаного з паперу, без транспортира?","options":["Провести промінь будь-куди між сторонами","Перегнути аркуш через вершину так, щоб сторони кута збіглися","Виміряти лінійкою довжини сторін"],"correct":1,"a":"Лінія згину ділить кут на дві частини, що накладаються одна на одну, тобто на рівні кути — це бісектриса."}]}}]},{"id":"G1.3","name":"Вимірювання відрізків і кутів","what":"Довжина відрізка, відстань між точками, градусна міра кута.","subtopics":[{"id":"G1.3.1","name":"Вимірювання відрізків. Відстань між двома точками","status":"ready","programmeRef":"Вимірювання відрізків і кутів.","lesson":{"what":"Виміряти відрізок — дізнатися, скільки разів у ньому вміщується одиниця довжини (1 мм, 1 см, 1 м). Отримане число — <b>довжина відрізка<\/b>: AB = 5 см. <b>Відстань між точками<\/b> A і B — це довжина відрізка AB.","ideas":["Кожний відрізок має довжину, більшу за нуль.","<b>Рівні відрізки<\/b> — відрізки однакової довжини. На малюнку їх позначають однаковою кількістю рисочок.","Якщо точка C лежить між A і B, то вона ділить відрізок AB на дві частини, і AB = AC + CB.","Якщо невідомо, яка з трьох точок лежить між іншими, треба розглянути всі можливі випадки — відповідей може бути дві.","Перед додаванням довжин переведіть їх в однакові одиниці: 1 см = 10 мм, 1 м = 100 см, 1 км = 1000 м."],"rules":[{"f":"AB = AC + CB, якщо точка C лежить між A і B","means":"Довжина відрізка дорівнює сумі довжин частин, на які його ділить будь-яка його точка."},{"f":"На будь-якому промені від його початку можна відкласти відрізок заданої довжини, і до того ж тільки один.","means":"Так ми будуємо відрізок потрібної довжини: від початку променя відміряємо лінійкою, скільки треба."}],"examples":[{"task":"Точка C лежить між точками A і B, AC = 2,5 см, CB = 3,7 см. Знайдіть AB. Накресліть відрізок AB і позначте на ньому C.","steps":[{"do":"Дано: C лежить між A і B, AC = 2,5 см, CB = 3,7 см. Знайти: AB.","why":"Записуємо умову."},{"do":"AB = AC + CB.","why":"Бо довжина відрізка дорівнює сумі довжин частин, на які його ділить точка C."},{"do":"AB = 2,5 + 3,7 = 6,2 (см).","why":"Додаємо десяткові дроби: кома під комою."}],"answer":"Відповідь: AB = 6,2 см."},{"task":"Відрізок AB = 4 см 5 мм. Точка C лежить між A і B, AC = 18 мм. Знайдіть CB. Накресліть такий відрізок у зошиті й перевірте лінійкою.","steps":[{"do":"Переводимо в однакові одиниці: 4 см 5 мм = 40 мм + 5 мм = 45 мм.","why":"1 см = 10 мм; додавати й віднімати можна лише однакові одиниці."},{"do":"AB = AC + CB, тобто 45 = 18 + CB.","why":"Бо C лежить між A і B — довжина відрізка дорівнює сумі його частин."},{"do":"CB = 45 − 18 = 27 (мм) = 2,7 см.","why":"Невідомий доданок = сума − відомий доданок."}],"answer":"Відповідь: CB = 27 мм (2,7 см)."},{"task":"Точки A, B, C лежать на одній прямій, AB = 8 см, BC = 3 см. Знайдіть AC. Розгляньте всі можливі випадки і для кожного зробіть окремий малюнок у зошиті.","steps":[{"do":"Дано: A, B, C на одній прямій, AB = 8 см, BC = 3 см. Знайти: AC. Невідомо, яка точка лежить між двома іншими, тому розглядаємо три випадки.","why":"З трьох точок на прямій одна і тільки одна лежить між двома іншими."},{"do":"Випадок 1: C між A і B. Тоді AB = AC + CB, тобто 8 = AC + 3, AC = 8 − 3 = 5 (см).","why":"Довжина відрізка дорівнює сумі довжин його частин."},{"do":"Випадок 2: B між A і C. Тоді AC = AB + BC = 8 + 3 = 11 (см).","why":"Та сама властивість: AC складається з частин AB і BC."},{"do":"Випадок 3: A між B і C. Тоді BC = BA + AC, тобто 3 = 8 + AC — неможливо, бо частина не може бути довшою за весь відрізок.","why":"Довжина відрізка AC має бути більшою за нуль."}],"answer":"Відповідь: AC = 5 см (якщо C лежить між A і B) або AC = 11 см (якщо B лежить між A і C)."}],"mistakes":["Розглядати лише один випадок і завжди додавати. Якщо точка лежить не між іншими, відстань може бути різницею.","Додавати довжини в різних одиницях (наприклад, 3 см + 5 мм = 8). Спершу переведіть: 30 мм + 5 мм = 35 мм.","Прикладати лінійку не від нуля, а від її краю."],"check":[{"q":"<b>Пастка.<\/b> Точки K, L, M лежать на прямій; KL = 4 см, LM = 6 см, KM = 10 см. Яка точка лежить між двома іншими?","options":["M","K","L"],"correct":2,"a":"L, бо KL + LM = 4 + 6 = 10 = KM."},{"q":"Дім, магазин і школа стоять уздовж прямої дороги, магазин — між домом і школою. Від дому до школи 1,2 км, від дому до магазину 0,5 км. Скільки кілометрів від магазину до школи?","accept":["0,7"],"a":"1,2 − 0,5 = 0,7 км, бо відстань від дому до школи — сума двох частин."},{"q":"Точки M, N, P лежать на одній прямій, MN = 7 см, NP = 2 см. Знайдіть MP у сантиметрах. Запишіть обидві можливі відповіді через «;» — від меншої до більшої.","accept":["5; 9","9; 5"],"a":"Якщо P між M і N: MP = 7 − 2 = 5 см. Якщо N між M і P: MP = 7 + 2 = 9 см. Точка M між N і P бути не може (2 = 7 + MP — неможливо)."}]}},{"id":"G1.3.2","name":"Вимірювання кутів","status":"ready","programmeRef":"Вимірювання відрізків і кутів.","lesson":{"what":"Кути вимірюють у <b>градусах<\/b> за допомогою <b>транспортира<\/b>. 1° — це 1/180 частина розгорнутого кута. Скільки градусів уміщується в куті — це його <b>градусна міра<\/b>.","ideas":["Кожний кут має градусну міру, більшу за 0°. Розгорнутий кут дорівнює 180°.","Як міряти: центр транспортира — у вершину кута; нульова позначка шкали — на одній стороні; число читаємо там, де шкалу перетинає друга сторона, <b>на тій самій шкалі<\/b>, що починається з нуля.","На транспортирі дві шкали (зовнішня і внутрішня). Звіряйтеся з видом кута: гострий кут не може мати 140°.","Якщо промінь OC проходить між сторонами ∠AOB, то ∠AOB = ∠AOC + ∠COB.","Від будь-якого променя в заданий бік від нього можна відкласти кут заданої градусної міри, меншої за 180°, і тільки один."],"rules":[{"f":"∠AOB = ∠AOC + ∠COB, якщо промінь OC проходить між сторонами ∠AOB","means":"Градусна міра кута дорівнює сумі градусних мір кутів, на які його ділить промінь, що проходить між сторонами."},{"f":"Розгорнутий кут = 180°","means":"1° — це 1/180 частина розгорнутого кута."}],"examples":[{"task":"Промінь OC проходить між сторонами ∠AOB, ∠AOC = 25°, ∠COB = 47°. Знайдіть ∠AOB. Накресліть кут і промінь OC.","steps":[{"do":"Дано: OC між сторонами ∠AOB, ∠AOC = 25°, ∠COB = 47°. Знайти: ∠AOB.","why":"Записуємо умову."},{"do":"∠AOB = ∠AOC + ∠COB.","why":"Бо градусна міра кута дорівнює сумі кутів, на які його ділить промінь між сторонами."},{"do":"∠AOB = 25° + 47° = 72°.","why":"Додаємо градусні міри."}],"answer":"Відповідь: ∠AOB = 72°."},{"task":"Учень приклав транспортир до ∠AOB: центр — у вершині O, сторона OA проходить через нуль внутрішньої шкали. Сторона OB перетинає дугу там, де на внутрішній шкалі 35, а на зовнішній — 145. На малюнку кут гострий. Скільки градусів у ∠AOB?","steps":[{"do":"Центр транспортира у вершині, нуль шкали — на стороні OA: прикладено правильно.","why":"Так вимірюють кут транспортиром."},{"do":"Читаємо ту шкалу, на якій нуль лежить на OA, — внутрішню: 35°.","why":"Число беремо зі шкали, що починається з нуля на стороні кута."},{"do":"Перевірка: кут гострий, 35° < 90° — збігається; 145° був би тупим. До того ж 35° + 145° = 180°: дві шкали «доповнюють» одна одну.","why":"Класифікація кутів допомагає помітити неправильну шкалу."}],"answer":"Відповідь: ∠AOB = 35°."},{"task":"∠AOB = 80°, ∠BOC = 30°. Знайдіть ∠AOC. Розгляньте всі можливі випадки і накресліть у зошиті кожен.","steps":[{"do":"Дано: ∠AOB = 80°, ∠BOC = 30°. Знайти: ∠AOC. Невідомо, як розміщені промені, тому розглядаємо випадки.","why":"Промінь OC може лежати всередині ∠AOB або поза ним."},{"do":"Випадок 1: OC проходить між сторонами ∠AOB. Тоді ∠AOB = ∠AOC + ∠COB: 80° = ∠AOC + 30°, ∠AOC = 80° − 30° = 50°.","why":"Кут дорівнює сумі кутів, на які його ділить промінь між сторонами."},{"do":"Випадок 2: OB проходить між сторонами ∠AOC. Тоді ∠AOC = ∠AOB + ∠BOC = 80° + 30° = 110°.","why":"Та сама властивість для кута AOC."},{"do":"Випадок 3: OA між сторонами ∠BOC. Тоді 30° = 80° + ∠AOC — неможливо.","why":"Частина кута не може бути більшою за весь кут."}],"answer":"Відповідь: ∠AOC = 50° (якщо OC між OA і OB) або ∠AOC = 110° (якщо OB між OA і OC)."}],"mistakes":["Читати число не з тієї шкали транспортира (140° замість 40°). Перевіряйте: гострий кут менший за 90°.","Ставити центр транспортира не у вершину кута або не суміщати нуль шкали зі стороною.","Розглядати лише один випадок розміщення променів, коли в задачі немає малюнка."],"check":[{"q":"<b>Пастка.<\/b> Учень виміряв гострий кут і прочитав 130° — не з тієї шкали. Скільки градусів насправді має цей кут? Введіть число.","accept":["50"],"a":"Дві шкали в сумі дають 180°: 180° − 130° = 50°. Гострий кут і має бути менший за 90°."},{"q":"Скільки градусів кут між стрілками годинника о 4:00? Введіть число.","accept":["120"],"a":"4 поділки по 30°: 4 · 30° = 120°."},{"q":"∠AOB = 70°, ∠BOC = 45°. Знайдіть ∠AOC у градусах. Запишіть обидві можливі відповіді через «;» — від меншої до більшої.","accept":["25; 115","115; 25"],"a":"Якщо OC між OA і OB: 70° − 45° = 25°. Якщо OB між OA і OC: 70° + 45° = 115°."}]}}]}]},{"id":"G2","subject":"geometry","name":"Взаємне розміщення прямих на площині","what":"Як прямі можуть розташовуватися одна щодо одної: перетинатися, бути перпендикулярними чи паралельними.","topics":[{"id":"G2.1","name":"Суміжні та вертикальні кути","what":"Кути, що утворюються, коли прямі перетинаються.","subtopics":[{"id":"G2.1.1","name":"Суміжні кути","status":"planned","programmeRef":"Суміжні та вертикальні кути, їх властивості."},{"id":"G2.1.2","name":"Вертикальні кути","status":"planned","programmeRef":"Суміжні та вертикальні кути, їх властивості."}]},{"id":"G2.2","name":"Перпендикулярні й паралельні прямі","what":"Перпендикуляр, відстань від точки до прямої, паралельність.","subtopics":[{"id":"G2.2.1","name":"Перпендикулярні прямі. Відстань від точки до прямої","status":"planned","programmeRef":"Перпендикуляр. Відстань від точки до прямої."},{"id":"G2.2.2","name":"Паралельні прямі","status":"planned","programmeRef":"Паралельні та перпендикулярні прямі, їх властивості."},{"id":"G2.2.3","name":"Кут між прямими, що перетинаються","status":"planned","programmeRef":"Кут між двома прямими, що перетинаються."}]},{"id":"G2.3","name":"Паралельні прямі і січна","what":"Кути при перетині двох прямих третьою і як за ними впізнати паралельні прямі.","subtopics":[{"id":"G2.3.1","name":"Кути, утворені при перетині двох прямих січною","status":"planned","programmeRef":"Кути, утворені при перетині двох прямих січною."},{"id":"G2.3.2","name":"Ознаки паралельності прямих","status":"planned","programmeRef":"Ознаки паралельності прямих."},{"id":"G2.3.3","name":"Властивості кутів при паралельних прямих і січній","status":"planned","programmeRef":"Властивості кутів, утворених при перетині паралельних прямих січною"}]}]},{"id":"G3","subject":"geometry","name":"Трикутники. Ознаки рівності трик // Змінюй, коли змінюється сторінка або уроки, щоб репетитор знав, що опубліковану копію учня треба оновити.
const MAP_VERSION = "2026-10-14d";
const DATA = (typeof CONTENT !== "undefined" && CONTENT && Array.isArray(CONTENT.subjects)) ? CONTENT : { subjects: [] };

/* ---------- Покажчики ---------- */
const SUBJ = {}, SEC = {}, TOP = {}, SUB = {};
DATA.subjects.forEach((s, si) => {
  s.color = `var(--s${(si % 4) + 1})`;
  s.sections = Array.isArray(s.sections) ? s.sections : [];
  s.subs = [];
  SUBJ[s.id] = s;
  s.sections.forEach(sec => {
    sec.subject = s; SEC[sec.id] = sec; sec.subs = [];
    (sec.topics || []).forEach(t => {
      t.section = sec; t.subject = s; TOP[t.id] = t;
      t.subtopics = t.subtopics || [];
      t.subtopics.forEach(st => {
        st.topic = t; st.section = sec; st.subject = s; SUB[st.id] = st;
        st.ready = st.status === "ready" && !!st.lesson;
        st.checks = st.ready ? (st.lesson.check || []).map((c, i) => ({ id: `${st.id}-${i + 1}`, q: c.q, a: c.a,
          options: Array.isArray(c.options) ? c.options : null, correct: c.correct, accept: Array.isArray(c.accept) ? c.accept : null })) : [];
        st.examples = st.ready && Array.isArray(st.lesson.examples) ? st.lesson.examples : [];
        sec.subs.push(st); s.subs.push(st);
      });
    });
  });
});

/* ---------- Сховище ---------- */
const LS_PROGRESS = "school-map:progress", LS_UI = "school-map:ui";
function lsGet(k) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
const clone = o => JSON.parse(JSON.stringify(o == null ? {} : o));
const isObj = v => !!v && typeof v === "object" && !Array.isArray(v);
function deepMerge(into, patch) {
  Object.keys(patch || {}).forEach(k => { if (isObj(patch[k])) into[k] = deepMerge(isObj(into[k]) ? into[k] : {}, patch[k]); else into[k] = patch[k]; });
  return into;
}
function normProgress(d) { d = isObj(d) ? d : {}; return { read: isObj(d.read) ? d.read : {}, checks: isObj(d.checks) ? d.checks : {}, updatedAt: d.updatedAt || null }; }

let progress = normProgress(lsGet(LS_PROGRESS));
let practice = {};                   // learner/practice → subtopics
let plan = { name: "", current: null, next: [] }; // learner/plan
let db = null, dbState = "local";    // local | live | readonly
let remoteExists = false, remoteBase = null;
let pending = null, inflight = null, writing = false;

/* Запис лише після дії учня, по одному за раз: зміни, що прийшли під час запису, чекають і йдуть одним наступним записом. */
function record(patch) {
  const now = new Date().toISOString();
  deepMerge(progress, patch);
  progress.updatedAt = now;
  lsSet(LS_PROGRESS, progress);
  if (!db || dbState !== "live") return;
  pending = deepMerge(pending || {}, patch);
  pump();
}
async function pump() {
  if (writing || !pending || !db) return;
  writing = true; inflight = pending; pending = null;
  const stamp = { updatedAt: new Date().toISOString(), mapVersion: MAP_VERSION };
  const ref = db.doc("learner/progress");
  const whole = () => ref.set(Object.assign(clone({ read: progress.read, checks: progress.checks }), stamp));
  try {
    if (!remoteExists) { await whole(); remoteExists = true; }
    else {
      try { await ref.update(Object.assign(clone(inflight), stamp)); }
      catch (e) {
        if (e && e.code === "invalid_argument") { await whole(); remoteExists = true; } // документ могли видалити
        else if (e && e.code === "unavailable") { await new Promise(r => setTimeout(r, 600 + Math.random() * 900)); await ref.update(Object.assign(clone(inflight), stamp)); }
        else throw e;
      }
    }
  } catch (e) {
    if (e && (e.code === "invalid_argument" || e.code === "revoked" || e.code === "not_granted")) { dbState = "readonly"; pending = null; paintStatus(); }
  } finally {
    inflight = null; writing = false;
    if (pending) pump();
  }
}
function applyRemoteProgress(d) {
  remoteBase = normProgress(clone(d));
  const merged = normProgress(clone(remoteBase));
  if (inflight) deepMerge(merged, inflight);
  if (pending) deepMerge(merged, pending);
  const changed = JSON.stringify([merged.read, merged.checks]) !== JSON.stringify([progress.read, progress.checks]);
  progress = merged;
  lsSet(LS_PROGRESS, progress);
  return changed;
}

/* ---------- Підрахунки ---------- */
function practiceOf(id) { const p = practice[id]; return p && +p.answered > 0 ? { answered: +p.answered, correct: +p.correct || 0, last: p.last || "" } : null; }
function isMastered(p) { return !!p && p.answered >= 3 && p.correct / p.answered >= 0.8; }
function checkCount(st) { const know = st.checks.filter(c => progress.checks[c.id] === "know").length; return { know, total: st.checks.length }; }
function statusOf(st) {
  if (!st.ready) return "planned";
  if (isMastered(practiceOf(st.id))) return "mastered";
  const c = checkCount(st);
  if (c.total && c.know === c.total) return "checked";
  if (progress.read[st.id]) return "read";
  return "new";
}
const STATUS = {
  planned: ["урок готується", "st-planned"],
  mastered: ["опановано на практиці", "st-mastered"],
  checked: ["самоперевірка пройдена", "st-checked"],
  read: ["прочитано", "st-read"],
  new: ["ще не відкрито", "st-new"]
};
// Бал підтеми: прочитано, самоперевірка, практика — по третині; «опановано» = 100 %.
function scoreOf(st) {
  const p = practiceOf(st.id);
  if (isMastered(p)) return 1;
  const c = checkCount(st);
  const prac = p ? Math.min(1, p.answered / 3) * Math.min(1, (p.correct / p.answered) / 0.8) : 0;
  return ((progress.read[st.id] ? 1 : 0) + (c.total ? c.know / c.total : 0) + prac) / 3;
}
function agg(subs) {
  const ready = subs.filter(s => s.ready);
  const pct = ready.length ? Math.round(ready.reduce((a, s) => a + scoreOf(s), 0) / ready.length * 100) : null;
  return { all: subs.length, ready: ready.length, pct,
    read: ready.filter(s => progress.read[s.id]).length,
    mastered: ready.filter(s => isMastered(practiceOf(s.id))).length };
}
const topicSubs = t => t.subtopics;

/* ---------- Допоміжне ---------- */
function esc(s) { return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
// У текстах уроків дозволено лише <b>, <i>, <sub>, <sup>; усе інше екранується.
function rich(s) { return esc(s).replace(/&lt;(\/?)(b|i|sub|sup)&gt;/g, "<$1$2>"); }
function plain(s) { return String(s == null ? "" : s).replace(/<\/?(b|i|sub|sup)>/g, ""); }
function plural(n, f) { const a = Math.abs(n) % 100, b = a % 10; return a > 10 && a < 20 ? f[2] : b === 1 ? f[0] : b >= 2 && b <= 4 ? f[1] : f[2]; }
function fmtDate(iso) {
  if (!iso) return "";
  const d = new Date(String(iso).length === 10 ? iso + "T12:00:00" : iso);
  if (isNaN(d)) return String(iso);
  try { return d.toLocaleDateString("uk-UA", { day: "numeric", month: "long", year: "numeric" }).replace(/\s*р\.$/, ""); } catch (e) { return String(iso).slice(0, 10); }
}
function ring(pct, size, color, big) {
  const sw = big ? 7 : 6, r = (size - sw) / 2, c = 2 * Math.PI * r, cx = size / 2;
  const v = pct == null ? 0 : Math.max(0, Math.min(100, pct));
  return `<svg class="ring${big ? " big" : ""}" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true" style="--ring-c:${color}">`
    + `<circle class="trk" cx="${cx}" cy="${cx}" r="${r}" stroke-width="${sw}"/>`
    + (v > 0 ? `<circle class="val" cx="${cx}" cy="${cx}" r="${r}" stroke-width="${sw}" stroke-dasharray="${(c * v / 100).toFixed(2)} ${c.toFixed(2)}" transform="rotate(-90 ${cx} ${cx})"/>` : "")
    + `<text x="${cx}" y="${cx}">${pct == null ? "—" : pct + "%"}</text></svg>`;
}
function bar(pct, color) { return `<span class="bar" aria-hidden="true"><i style="width:${pct || 0}%;${color ? `--bar-c:${color}` : ""}"></i></span>`; }

/* ---------- Стан інтерфейсу ---------- */
const uiSaved = lsGet(LS_UI) || {};
const ui = {
  subject: SUBJ[uiSaved.subject] ? uiSaved.subject : (DATA.subjects[0] && DATA.subjects[0].id) || null,
  view: "map",         // map | lesson | parents

  chk: {},             // самоперевірка в цьому візиті: { phase: "fresh"|"retry"|"done", value, wrong: [], msg }
  copied: null

function saveUi() { lsSet(LS_UI, { subject: ui.subject, open: [...ui.open], openTouched: ui.openTouched }); }
function autoOpen() {
  // Поки учень сам нічого не розгортав: розгорнути тему «Зараз у школі» (або перший розділ).
  if (ui.openTouched) return;
  const cur = plan.current && TOP[plan.current.topic];
  if (cur && cur.subject.id === ui.subject) { ui.open.add(cur.section.id); ui.open.add(cur.id); return; }
  const s = SUBJ[ui.subject];
  if (s && s.sections[0] && !s.sections.some(x => ui.open.has(x.id))) ui.open.add(s.sections[0].id);
}

/* Перевірка введеної відповіді: однаково записані відповіді збігаються, а числа порівнюються як числа
   («x = 65», «65 грн» і «65» — те саме; «2,5» = «2.5»; «−2» = «-2»). */
function normAns(x) {
  let v = String(x == null ? "" : x).trim().toLowerCase().replace(/\s+/g, "")
    .replace(/[−–—‐‑]/g, "-").replace(/,/g, ".").replace(/[×*]/g, "·");
  return v.replace(/\.$/, "");
}
function numAns(x) {
  let v = normAns(x).replace(/^\p{L}+=/u, "").replace(/[\p{L}°%]+$/u, "");
  let m = v.match(/^([+-]?(?:\d+(?:\.\d+)?|\.\d+))$/);
  if (m) return Number(m[1]);
  m = v.match(/^([+-]?\d+(?:\.\d+)?)\/(\d+(?:\.\d+)?)$/);
  if (m && +m[2] !== 0) return Number(m[1]) / Number(m[2]);
  return null;
}
function isAccepted(c, input) {
  const ni = normAns(input), xi = numAns(input);
  if (!ni) return false;
  return c.accept.some(a => normAns(a) === ni || (xi !== null && numAns(a) !== null && Math.abs(numAns(a) - xi) < 1e-9));
}
function checkHtml(c, i) {
  const stored = progress.checks[c.id], u = ui.chk[c.id];
  const head = `<p class="q">${i + 1}. ${rich(c.q)}</p>`;
  const explain = `<p class="a"><b>Пояснення:</b> ${rich(c.a)}</p>`;
  const again = `<div class="row"><button class="btn ghost" type="button" data-act="chk-again" data-id="${c.id}" data-k="again-${c.id}">Спробувати ще раз</button></div>`;
  // Уже відповідали раніше (або щойно): показати результат і пояснення.
  if ((!u && stored) || (u && u.phase === "done")) {
    const res = u ? u.result : stored;
    const msg = u ? u.msg : (stored === "know" ? "Минулого разу: правильно з першої спроби ✓" : "Минулого разу: ще треба повторити.");
    const opts = c.options ? `<div class="opts">${c.options.map((o, j) => `<button class="opt${j === c.correct ? " right" : u && u.wrong.includes(j) ? " wrong" : ""}" type="button" disabled>${"АБВГ"[j]}) ${rich(o)}</button>`).join("")}</div>` : "";
    return `<div class="check" data-check="${c.id}">${head}${opts}
      <p class="res ${res}" role="status">${esc(msg)}</p>${explain}${again}</div>`;
  }
  const st = u || { phase: "fresh", value: "", wrong: [] };
  const retryMsg = st.phase === "retry" ? `<p class="res not-yet" role="status">Не зовсім. Спробуй ще раз.</p>` : "";
  const giveUp = st.phase === "retry" ? `<button class="btn ghost" type="button" data-act="chk-show" data-id="${c.id}" data-k="show-${c.id}">Показати відповідь</button>` : "";
  if (c.options) {
    return `<div class="check" data-check="${c.id}">${head}
      <div class="opts" role="group" aria-label="Варіанти відповіді">${c.options.map((o, j) => `<button class="opt${st.wrong.includes(j) ? " wrong" : ""}" type="button" data-act="chk-opt" data-id="${c.id}" data-i="${j}" data-k="opt-${c.id}-${j}"${st.wrong.includes(j) ? " disabled" : ""}>${"АБВГ"[j]}) ${rich(o)}</button>`).join("")}</div>
      ${retryMsg}${giveUp ? `<div class="row">${giveUp}</div>` : ""}</div>`;
  }
  return `<div class="check" data-check="${c.id}">${head}
    <div class="row ans-row"><label class="sr" for="in-${c.id}">Твоя відповідь</label>
      <input class="chk-in" id="in-${c.id}" data-id="${c.id}" data-k="in-${c.id}" type="text" inputmode="text" autocomplete="off" spellcheck="false" placeholder="Твоя відповідь" value="${esc(st.value)}">
      <button class="btn" type="button" data-act="chk-submit" data-id="${c.id}" data-k="submit-${c.id}">Перевірити</button>${giveUp}</div>
    ${retryMsg}</div>`;
}
function findCheck(id) { const st = SUB[id.replace(/-\d+$/, "")]; return st ? st.checks.find(c => c.id === id) : null; }
function answerCheck(id, right, extra) {
  const c = findCheck(id); if (!c) return;
  const u = ui.chk[id] || (ui.chk[id] = { phase: "fresh", value: "", wrong: [] });
  if (extra && extra.value != null) u.value = extra.value;
  let result = null, msg = "";
  if (right && u.phase === "fresh") { result = "know"; msg = "Правильно!"; }
  else if (right) { result = "not-yet"; msg = "Правильно з другої спроби. Глянь пояснення, щоб наступного разу вийшло одразу."; }
  else if (u.phase === "fresh") { u.phase = "retry"; if (extra && extra.opt != null) u.wrong.push(extra.opt); }
  else { result = "not-yet"; msg = "Не зовсім. Ось правильна відповідь і пояснення — нічого страшного, повториш."; if (extra && extra.opt != null) u.wrong.push(extra.opt); }
  if (result) { u.phase = "done"; u.result = result; u.msg = msg; record({ checks: { [id]: result } }); }
}
function practiceLine(st, p) {
  const who = esc(st.subject.tutor || "репетитор");
  if (!p) return dbState === "local" ? `Тут з'являться результати задач, які дасть ${who}, коли карту відкрито як твою особисту сторінку з чату.` : `Поки задач на цю тему не було. Попроси їх нижче — результат з'явиться тут.`;
  const pct = Math.round(p.correct / p.answered * 100);

}

    <section class="card"><h3>Як допомогти</h3><ul class="tips">
      <li>Попросіть дитину пояснити Вам одну підтему своїми словами. Пояснити іншому — найкращий спосіб запам'ятати.</li>
      <li>Короткі заняття часто (15–20 хвилин кілька разів на тиждень) дають більше, ніж одне довге.</li>
      <li>Хваліть за старання й за чесне «Ще ні» в самоперевірці — так видно, що повторити.</li>
      <li>Якщо тема «варто підтягнути», не сваріть: у кожному уроці є готовий запит, щоб попросити в репетитора ще задач.</li>
      <li>Не розв'язуйте задачі замість дитини. Краще спитайте: «З чого ти почнеш?»</li>
    </ul><p class="note" style="margin-top:10px">Відсотки тут — з карти й задач з репетитором. Це не шкільна оцінка.</p></section>`;
}

/* ---------- Малювання ---------- */
function render(opts) {
  opts = opts || {};
  const main = $("main");
  const ae = document.activeElement, key = ae && ae.closest && ae.closest("[data-k]") && ae.dataset.k;
  renderHeader();
  let html;
  if (!DATA.subjects.length) html = emptyHtml("Карта ще наповнюється…", "Тут з'являться предмети, теми й короткі уроки. Зазирни трохи згодом — або вже зараз поговори з репетитором у чаті.");
  else if (ui.view === "parents") html = parentsHtml();
  else if (ui.view === "lesson" && SUB[ui.lesson] && SUB[ui.lesson].ready) html = lessonHtml(SUB[ui.lesson]);
  else { ui.view = "map"; autoOpen(); html = subjectHtml(SUBJ[ui.subject]); }
  main.innerHTML = html;
  paintStatus();
  if (opts.focus) { const el = document.querySelector(opts.focus); if (el) { el.focus({ preventScroll: !!opts.noScroll }); if (el.tagName === "INPUT") { try { el.setSelectionRange(el.value.length, el.value.length); } catch (e) {} } if (!opts.noScroll && el.scrollIntoView) el.scrollIntoView({ block: opts.block || "nearest" }); } }
  else if (key && document.activeElement === document.body) { const el = document.querySelector(`[data-k="${key}"]`); if (el) el.focus({ preventScroll: true }); }
}

function openLesson(id) {
  const st = SUB[id];
  if (!st || !st.ready) return;
  ui.subject = st.subject.id; ui.view = "lesson"; ui.lesson = id; ui.copied = null;
  ui.open.add(st.section.id); ui.open.add(st.topic.id);
  saveUi();
  render({ focus: "#lesson-title", noScroll: true });
  window.scrollTo(0, 0);
}
function backToMap() {
  const from = ui.lesson; ui.view = "map"; ui.lesson = null;
  render({ focus: from ? `[data-k="s-${from}"]` : "#main", block: "center" });
}

document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]");
  if (!b) return;
  const act = b.dataset.act, id = b.dataset.id;
  if (act === "tab") { ui.subject = id; ui.view = "map"; ui.lesson = null; saveUi(); render({ focus: `#tab-${id}`, noScroll: true }); }
  else if (act === "toggle") {
    ui.openTouched = true;
    if (ui.open.has(id)) ui.open.delete(id); else ui.open.add(id);
    saveUi(); render({ focus: `[data-k="h-${id}"]`, noScroll: true });
  }
  else if (act === "goto-topic") {
    const t = TOP[id]; if (!t) return;
    ui.open.add(t.section.id); ui.open.add(t.id); ui.openTouched = true; saveUi();
    render({ focus: `[data-k="h-${id}"]`, block: "center" });
  }
  else if (act === "open") openLesson(id);
  else if (act === "back") backToMap();
  else if (act === "step" || act === "steps-all" || act === "steps-reset") {
    const k = +b.dataset.ex, key = `${id}#${k}`, n = ((SUB[id].examples[k] || {}).steps || []).length;
    ui.steps[key] = act === "step" ? Math.min(n, (ui.steps[key] || 0) + 1) : act === "steps-all" ? n : 0;
    render({ focus: ui.steps[key] >= n ? `[data-k="steps-reset-${k}"]` : `[data-k="step-${k}"]`, noScroll: true });
  }
  else if (act === "chk-opt") { const c = findCheck(id), j = +b.dataset.i; answerCheck(id, j === c.correct, { opt: j }); focusCheck(id); }
  else if (act === "chk-submit") submitInput(id);
  else if (act === "chk-show") { const u = ui.chk[id]; if (u) { u.phase = "done"; u.result = "not-yet"; u.msg = "Ось правильна відповідь і пояснення. Спробуй потім ще раз."; record({ checks: { [id]: "not-yet" } }); } focusCheck(id); }
  else if (act === "chk-again") { ui.chk[id] = { phase: "fresh", value: "", wrong: [] }; focusCheck(id); }
  else if (act === "read") { record({ read: { [id]: !progress.read[id] } }); render({ focus: `[data-k="read"]`, noScroll: true }); }
  else if (act === "copy") copyAsk(b);
});
function focusCheck(id) {
  const u = ui.chk[id], c = findCheck(id);
  let sel = `[data-k="again-${id}"]`;
  if (u && u.phase !== "done") sel = c && c.options ? `[data-check="${id}"] .opt:not([disabled])` : `[data-k="in-${id}"]`;
  render({ focus: sel, noScroll: true });
}
function submitInput(id) {
  const inp = document.getElementById("in-" + id), c = findCheck(id);
  if (!inp || !c) return;
  const v = inp.value;
  if (!v.trim()) { inp.focus(); return; }
  answerCheck(id, isAccepted(c, v), { value: v });
  focusCheck(id);
}
document.addEventListener("keydown", e => {
  if (e.key === "Enter" && e.target.classList && e.target.classList.contains("chk-in")) { e.preventDefault(); submitInput(e.target.dataset.id); }
});
document.addEventListener("input", e => {
  if (e.target.classList && e.target.classList.contains("chk-in")) { const id = e.target.dataset.id; (ui.chk[id] = ui.chk[id] || { phase: "fresh", value: "", wrong: [] }).value = e.target.value; }
});
$("parents-toggle").addEventListener("click", () => {
  ui.view = ui.view === "parents" ? "map" : "parents";
  render({ focus: "#parents-toggle", noScroll: true });
  window.scrollTo(0, 0);
});
// Стрілки ліворуч/праворуч, Home, End — між вкладками предметів.
$("tabs").addEventListener("keydown", e => {
  const ids = DATA.subjects.map(s => s.id), i = ids.indexOf(ui.subject);
  let j = null;
  if (e.key === "ArrowRight") j = (i + 1) % ids.length; else if (e.key === "ArrowLeft") j = (i - 1 + ids.length) % ids.length;
  else if (e.key === "Home") j = 0; else if (e.key === "End") j = ids.length - 1;
  if (j === null) return;
  e.preventDefault();
  ui.subject = ids[j]; ui.view = "map"; ui.lesson = null; saveUi();
  render({ focus: `#tab-${ids[j]}`, noScroll: true });
});
function copyAsk(btn) {
  const ta = $("ask-text"), note = $("copy-note"), id = ui.lesson;
  const ok = () => { ui.copied = id; btn.textContent = "Скопійовано ✓"; note.textContent = "Тепер встав у чат з репетитором."; };
  const fallback = () => {
    ta.focus(); ta.select();
    let done = false;
    try { done = document.execCommand("copy"); } catch (e) {}
    if (done) ok(); else note.textContent = "Текст виділено — натисни Ctrl+C (або «Копіювати» на телефоні).";
  };
  try { navigator.clipboard.writeText(ta.value).then(ok, fallback); } catch (e) { fallback(); }
}

/* ---------- Спільна база (коли карта — особиста опублікована сторінка учня) ---------- */
let retries = 0;
function watch(path, onData) {
  let unsub = null;
  const start = () => {
    try {
      unsub = db.doc(path).onSnapshot(snap => onData(snap.exists ? (snap.data() || {}) : null), err => {
        if (err && err.code === "unavailable" && retries < 5) { retries++; setTimeout(start, 4000 * retries); }
      });
    } catch (e) {}
  };
  start();
}
let softPending = false;
function rerenderSoft() {
  // Поки учень друкує відповідь, не перебудовуємо сторінку: оновимося, коли поле втратить фокус.
  const ae = document.activeElement;
  if (ae && ae.classList && ae.classList.contains("chk-in")) { softPending = true; return; }
  softPending = false; render();
}
document.addEventListener("focusout", e => {
  if (softPending && e.target.classList && e.target.classList.contains("chk-in")) setTimeout(() => { if (softPending) rerenderSoft(); }, 0);
});
async function connect() {
  const c = window.claude;
  if (!c || typeof c.use !== "function") return;
  let handle = null;
  try { handle = await c.use("db"); } catch (e) { handle = null; }
  if (!handle) return;
  db = handle; dbState = "live"; paintStatus();
  try {
    const snap = await db.doc("learner/progress").get();
    if (snap.exists) {
      remoteExists = true;
      const remote = normProgress(clone(snap.data()));
      // Позначки, зроблені в цьому браузері, поки бази не було, доливаємо одним записом (база перемагає в суперечках).
      const extra = {};
      ["read", "checks"].forEach(k => Object.keys(progress[k]).forEach(id => { if (!(id in remote[k])) { extra[k] = extra[k] || {}; extra[k][id] = progress[k][id]; } }));
      applyRemoteProgress(remote);
      if (Object.keys(extra).length) record(extra);
    } else if (Object.keys(progress.read).length || Object.keys(progress.checks).length) {
      record({});
    }
  } catch (e) {
    if (e && (e.code === "revoked" || e.code === "not_granted" || e.code === "capability_disabled" || e.code === "capability_removed")) { db = null; dbState = "local"; paintStatus(); return; }
  }
  render();
  watch("learner/progress", d => { if (d) { remoteExists = true; if (applyRemoteProgress(d)) rerenderSoft(); } });
  watch("learner/practice", d => {
    const next = d && isObj(d.subtopics) ? clone(d.subtopics) : {};
    if (JSON.stringify(next) !== JSON.stringify(practice)) { practice = next; rerenderSoft(); }
  });
  watch("learner/plan", d => {
    const next = { name: d && typeof d.name === "string" ? d.name.trim() : "",
      current: d && isObj(d.current) && d.current.topic ? { subject: String(d.current.subject || (TOP[d.current.topic] ? TOP[d.current.topic].subject.id : "")), topic: String(d.current.topic) } : null,
      next: d && Array.isArray(d.next) ? d.next.map(String) : [] };
    if (JSON.stringify(next) !== JSON.stringify(plan)) { plan = next; rerenderSoft(); }
  });
}

render();
connect();
</script>
</body>
</html>
