м за одне коло?","accept":["360"],"a":"Зовнішні кути: 180° − 50° = 130°, 180° − 60° = 120°, 180° − 70° = 110°. Разом 130° + 120° + 110° = 360° — повний оберт."}],"fig":{"caption":"Трикутник ABC; сторону AC продовжено за вершину C до точки D. ∠BCD — зовнішній кут при вершині C; він дорівнює сумі кутів A і B.","view":[-1.0,-1.0,10.5,6.144],"points":{"A":[0.0,0.0],"B":[3.602,5.144],"C":[6,0.0],"D":[9.5,0.0]},"items":[{"t":"poly","p":["A","B","C"]},{"t":"seg","p":["C","D"]},{"t":"angle","p":["B","C","D"],"s":"hl","arcs":1},{"t":"angle","p":["C","A","B"],"s":"hl2"},{"t":"angle","p":["A","B","C"],"s":"hl2"}],"check":[{"col":["A","C","D"]}]}}}]},{"id":"G3.5","name":"Прямокутні трикутники","what":"Трикутник з прямим кутом і його особливі властивості.","subtopics":[{"id":"G3.5.1","name":"Властивості прямокутних трикутників","status":"ready","programmeRef":"Прямокутні трикутники. Властивості прямокутних трикутників.","lesson":{"what":"<b>Прямокутний трикутник<\/b> — трикутник з прямим кутом. Сторони при прямому куті — <b>катети<\/b>, сторона проти прямого кута — <b>гіпотенуза<\/b>. У прямокутних трикутників є свої властивості й свої, коротші ознаки рівності.","ideas":["Сума гострих кутів прямокутного трикутника 90°: від 180° забирає 90° прямий кут.","Катет, що лежить проти кута 30°, дорівнює половині гіпотенузи. Чому: прикладемо до трикутника його дзеркальну копію — вийде рівносторонній трикутник, а катет — половина його сторони.","І навпаки: якщо катет дорівнює половині гіпотенузи, то кут проти нього 30°.","Ознаки рівності прямокутних трикутників (бо прямі кути вже рівні, потрібно лише два елементи): за двома катетами; за катетом і прилеглим гострим кутом; за катетом і протилежним гострим кутом; за гіпотенузою і гострим кутом; за гіпотенузою і катетом."],"rules":[{"f":"∠C = 90° ⇒ ∠A + ∠B = 90°","means":"Гострі кути прямокутного трикутника разом дають 90°."},{"f":"∠C = 90°, ∠A = 30° ⇒ BC = AB : 2","means":"Катет проти кута 30° — половина гіпотенузи."},{"f":"∠C = 90°, BC = AB : 2 ⇒ ∠A = 30°","means":"Обернене твердження: якщо катет — половина гіпотенузи, то проти нього кут 30°."}],"examples":[{"task":"У трикутнику ABC ∠C = 90°, ∠A = 27°. Знайдіть ∠B.","fig":{"caption":"Прямокутний трикутник ABC з прямим кутом C; ∠A = 27°, кут B позначено знаком питання.","view":[-1.0,-1.0,7.0,4.057],"points":{"A":[6,0.0],"B":[0.0,3.057],"C":[0.0,0.0]},"lp":{"C":"w"},"items":[{"t":"poly","p":["A","B","C"]},{"t":"right","p":["A","C","B"],"id":"r"},{"t":"angle","p":["C","A","B"],"label":"27°","s":"hl","id":"a"},{"t":"angle","p":["A","B","C"],"label":"?","s":"hl2","id":"b"}]},"steps":[{"do":"∠A + ∠B = 90°.","why":"Сума гострих кутів прямокутного трикутника 90°.","hl":["r"]},{"do":"∠B = 90° − 27° = 63°.","why":"Підставляємо відомий кут.","hl":["b"]},{"do":"Перевірка: 27° + 63° + 90° = 180°.","why":"Сума кутів трикутника 180°.","hl":["a","b"]}],"answer":"Відповідь: 63°."},{"task":"У трикутнику ABC ∠C = 90°, ∠A = 30°, AB = 14 см. Знайдіть катет BC.","fig":{"caption":"Прямокутний трикутник ABC з прямим кутом C; ∠A = 30°, гіпотенуза AB = 14 см, катет BC позначено знаком питання.","view":[-1.0,-1.0,13.124,8.0],"points":{"A":[12.124,0.0],"B":[0.0,7],"C":[0.0,0.0]},"lp":{"C":"w"},"items":[{"t":"poly","p":["A","B","C"]},{"t":"right","p":["A","C","B"]},{"t":"angle","p":["C","A","B"],"label":"30°","s":"hl","id":"a"},{"t":"seg","p":["A","B"],"s":"hl2","id":"ab"},{"t":"seg","p":["B","C"],"s":"hl","id":"bc"},{"t":"label","at":[6.312,3.933],"text":"14 см"},{"t":"label","at":[-0.5,3.5],"text":"?"}],"check":[{"len":[["A","B"],14]}]},"steps":[{"do":"AB — гіпотенуза.","why":"Вона лежить проти прямого кута C.","hl":["ab"]},{"do":"BC лежить проти кута A = 30°.","why":"Протилежна до ∠A сторона — та, на якій немає вершини A.","hl":["a","bc"]},{"do":"BC = 14 : 2 = 7 (см).","why":"Катет проти кута 30° дорівнює половині гіпотенузи.","hl":["bc"]}],"answer":"Відповідь: 7 см."},{"task":"У трикутнику ABC ∠C = 90°, ∠A = 60°, AB + AC = 18 см. Знайдіть AB і AC.","fig":{"caption":"Прямокутний трикутник ABC з прямим кутом C; ∠A = 60°, AB + AC = 18 см.","view":[-1.0,-1.0,7.0,11.392],"points":{"A":[6,0.0],"B":[0.0,10.392],"C":[0.0,0.0]},"lp":{"C":"w"},"items":[{"t":"poly","p":["A","B","C"]},{"t":"right","p":["A","C","B"]},{"t":"angle","p":["C","A","B"],"label":"60°","id":"a"},{"t":"angle","p":["A","B","C"],"label":"?","s":"hl","id":"b"},{"t":"seg","p":["A","C"],"s":"hl","id":"ac"},{"t":"seg","p":["A","B"],"s":"hl2","id":"ab"}],"check":[{"len":[["A","C"],6]},{"len":[["A","B"],12]}]},"steps":[{"do":"∠B = 90° − 60° = 30°.","why":"Сума гострих кутів прямокутного трикутника 90°.","hl":["b"]},{"do":"AC лежить проти кута B = 30°, тож AC = AB : 2, тобто AB = 2 · AC.","why":"Катет проти кута 30° — половина гіпотенузи.","hl":["ac","ab"]},{"do":"Нехай AC = x, тоді AB = 2x і x + 2x = 18, 3x = 18, x = 6.","why":"Складаємо рівняння за умовою."},{"do":"AC = 6 см, AB = 12 см. Перевірка: 12 + 6 = 18 і 6 = 12 : 2.","why":"Підставляємо в обидві умови.","hl":["ac","ab"]}],"answer":"Відповідь: AB = 12 см, AC = 6 см."}],"mistakes":["Беруть половину гіпотенузи для катета, <b>прилеглого<\/b> до кута 30°. Правильно: половині гіпотенузи дорівнює катет, що лежить <b>проти<\/b> кута 30°.","Застосовують правило «30° — половина» в трикутнику без прямого кута. Правильно: воно працює лише в прямокутному трикутнику, і йдеться про половину гіпотенузи.","Шукаючи гострий кут, віднімають від 180°, забувши про прямий кут. Правильно: другий гострий кут = 90° − перший."],"check":[{"q":"<b>Пастка.<\/b> У трикутнику ABC ∠C = 90°, ∠A = 30°, AB = 10 см. Чи правильно, що AC = 5 см?","fig":{"caption":"Прямокутний трикутник ABC з прямим кутом C; ∠A = 30°, AB = 10 см.","view":[-1.0,-1.0,9.66,6.0],"points":{"A":[8.66,0.0],"B":[0.0,5],"C":[0.0,0.0]},"lp":{"C":"w"},"items":[{"t":"poly","p":["A","B","C"]},{"t":"right","p":["A","C","B"]},{"t":"angle","p":["C","A","B"],"label":"30°"},{"t":"label","at":[4.58,2.933],"text":"10 см"}],"check":[{"len":[["A","B"],10]}]},"options":["Ні","Так"],"correct":0,"a":"Ні. Проти кута A = 30° лежить катет BC, тож 5 см — це BC. Катет AC прилеглий до кута 30°, а не протилежний."},{"q":"У прямокутних трикутниках ABC і KMN (∠C = ∠N = 90°) AB = KM і ∠A = ∠K. За якою ознакою вони рівні?","fig":{"caption":"Прямокутні трикутники ABC і KMN з прямими кутами C і N: гіпотенузи AB = KM, гострі кути ∠A = ∠K.","view":[-1.0,-1.0,13.0,4.2],"points":{"A":[5,0.0],"B":[0.0,3.2],"C":[0.0,0.0],"K":[7.0,0.0],"M":[12.0,3.2],"N":[12.0,0.0]},"lp":{"C":"w","N":"e"},"items":[{"t":"poly","p":["A","B","C"]},{"t":"poly","p":["K","M","N"]},{"t":"right","p":["A","C","B"]},{"t":"right","p":["K","N","M"]},{"t":"seg","p":["A","B"],"ticks":1,"s":"hl"},{"t":"seg","p":["K","M"],"ticks":1,"s":"hl"},{"t":"angle","p":["C","A","B"],"arcs":1,"s":"hl2"},{"t":"angle","p":["N","K","M"],"arcs":1,"s":"hl2"}]},"options":["За двома катетами","За катетом і прилеглим гострим кутом","За гіпотенузою і гострим кутом"],"correct":2,"a":"AB і KM — гіпотенузи (проти прямих кутів), ∠A і ∠K — гострі кути. Це ознака за гіпотенузою і гострим кутом."},{"q":"Драбину завдовжки 6 м приставили до стіни так, що вона утворює з землею кут 60°. На якій відстані від стіни (у метрах) стоїть низ драбини?","accept":["3"],"a":"Стіна, земля і драбина утворюють прямокутний трикутник; драбина — гіпотенуза. Кут між драбиною і стіною 90° − 60° = 30°, а відстань від стіни лежить проти нього: 6 : 2 = 3 (м)."}],"fig":{"caption":"Прямокутний трикутник ABC з прямим кутом C і ∠A = 30°. Добудуємо симетричний трикутник AB₁C: трикутник ABB₁ рівносторонній, тому катет BC — половина гіпотенузи AB.","view":[-1.0,-4.0,6.196,4.0],"points":{"A":[5.196,0.0],"B":[0.0,3],"C":[0.0,0.0],"B1":[0.0,-3]},"lp":{"C":"w","B1":"w"},"items":[{"t":"poly","p":["A","B","C"],"fill":true},{"t":"right","p":["A","C","B"]},{"t":"angle","p":["C","A","B"],"label":"30°"},{"t":"seg","p":["B","C"],"ticks":1,"s":"hl"},{"t":"seg","p":["C","B1"],"ticks":1,"s":"dash"},{"t":"seg","p":["A","B1"],"s":"dash"},{"t":"seg","p":["A","B"],"s":"hl2"}],"check":[{"mid":["C","B","B1"]}]}}}]},{"id":"G3.6","name":"Сторони і кути трикутника","what":"Як пов'язані сторони і кути, і коли з трьох відрізків можна скласти трикутник.","subtopics":[{"id":"G3.6.1","name":"Співвідношення між сторонами і кутами","status":"ready","programmeRef":"Співвідношення між сторонами і кутами трикутника.","lesson":{"what":"У трикутнику сторони й кути пов'язані: <b>проти більшої сторони лежить більший кут<\/b>, і навпаки, <b>проти більшого кута лежить більша сторона<\/b>. Так можна порівнювати кути, знаючи сторони, і сторони, знаючи кути.","ideas":["Щоб знайти найбільший кут, знайди найбільшу сторону — найбільший кут лежить навпроти неї. Найменший кут — навпроти найменшої сторони.","Проти рівних сторін лежать рівні кути, проти рівних кутів — рівні сторони (як у рівнобедреному трикутнику).","У прямокутному трикутнику гіпотенуза довша за кожен катет: вона лежить проти прямого кута, а він найбільший.","У тупокутному трикутнику найбільша сторона лежить проти тупого кута."],"rules":[{"f":"BC > AB ⇒ ∠A > ∠C","means":"Проти більшої сторони лежить більший кут."},{"f":"∠A > ∠C ⇒ BC > AB","means":"Проти більшого кута лежить більша сторона."}],"examples":[{"task":"Сторони трикутника ABC: AB = 5 см, BC = 7 см, AC = 6 см. Який кут найбільший, а який найменший?","fig":{"caption":"Трикутник ABC: AB = 5 см, BC = 7 см, AC = 6 см.","view":[-1.0,-1.0,7.0,5.899],"points":{"A":[0.0,0.0],"B":[1,4.899],"C":[6,0.0]},"items":[{"t":"poly","p":["A","B","C"]},{"t":"seg","p":["B","C"],"s":"hl","id":"bc"},{"t":"seg","p":["A","B"],"s":"hl2","id":"ab"},{"t":"angle","p":["B","A","C"],"s":"hl","id":"a"},{"t":"angle","p":["A","C","B"],"s":"hl2","id":"c"},{"t":"label","at":[0.01,2.549],"text":"5 см"},{"t":"label","at":[3.85,2.807],"text":"7 см"},{"t":"label","at":[3.0,-0.5],"text":"6 см"}],"check":[{"len":[["A","B"],5]},{"len":[["B","C"],7]},{"len":[["A","C"],6]}]},"steps":[{"do":"Найбільша сторона BC = 7 см, найменша AB = 5 см.","why":"Порівнюємо числа 5, 6, 7.","hl":["bc","ab"]},{"do":"Проти BC лежить ∠A — він найбільший.","why":"Проти більшої сторони лежить більший кут.","hl":["bc","a"]},{"do":"Проти AB лежить ∠C — він найменший.","why":"Проти меншої сторони лежить менший кут.","hl":["ab","c"]}],"answer":"Відповідь: найбільший ∠A, найменший ∠C (∠C < ∠B < ∠A)."},{"task":"У трикутнику ABC ∠A = 50°, ∠B = 60°. Яка сторона трикутника найбільша, а яка найменша?","fig":{"caption":"Трикутник ABC: ∠A = 50°, ∠B = 60°, кут C позначено знаком питання.","view":[-1.0,-1.0,7.0,5.987],"points":{"A":[0.0,0.0],"B":[4.185,4.987],"C":[6,0.0]},"items":[{"t":"poly","p":["A","B","C"]},{"t":"angle","p":["C","A","B"],"label":"50°","s":"hl2","id":"a"},{"t":"angle","p":["A","B","C"],"label":"60°","id":"b"},{"t":"angle","p":["A","C","B"],"label":"?","s":"hl","id":"c"},{"t":"seg","p":["A","B"],"s":"hl","id":"ab"},{"t":"seg","p":["B","C"],"s":"hl2","id":"bc"}]},"steps":[{"do":"∠C = 180° − 50° − 60° = 70°.","why":"Сума кутів трикутника 180°.","hl":["c"]},{"do":"Найбільший кут C, тож найбільша сторона — AB.","why":"Проти більшого кута лежить більша сторона.","hl":["c","ab"]},{"do":"Найменший кут A, тож найменша сторона — BC.","why":"Проти меншого кута — менша сторона.","hl":["a","bc"]}],"answer":"Відповідь: найбільша AB, найменша BC (BC < AC < AB)."},{"task":"У трикутнику ABC ∠C = 100°, AC = 4 см, BC = 6 см. Чи може сторона AB дорівнювати 5 см?","fig":{"caption":"Трикутник ABC з тупим кутом C = 100°; AC = 4 см, BC = 6 см, сторона AB позначена знаком питання.","view":[-2.042,-1.0,5.0,6.909],"points":{"A":[4,0.0],"B":[-1.042,5.909],"C":[0.0,0.0]},"lp":{"C":"s"},"items":[{"t":"poly","p":["A","B","C"]},{"t":"angle","p":["A","C","B"],"label":"100°","s":"hl","id":"c"},{"t":"angle","p":["C","A","B"],"s":"hl2","id":"a"},{"t":"angle","p":["C","B","A"],"s":"hl2","id":"b"},{"t":"seg","p":["A","B"],"s":"hl","id":"ab"},{"t":"label","at":[2.0,-0.5],"text":"4 см"},{"t":"label","at":[-1.013,2.868],"text":"6 см"},{"t":"label","at":[1.859,3.279],"text":"?"}],"check":[{"len":[["A","C"],4]},{"len":[["B","C"],6]},{"ang":[["A","C","B"],100]}]},"steps":[{"do":"∠A + ∠B = 180° − 100° = 80°, тож кожен з них менший від 100°.","why":"Сума кутів трикутника 180°.","hl":["a","b"]},{"do":"∠C — найбільший кут трикутника.","why":"Він більший за ∠A і за ∠B.","hl":["c"]},{"do":"AB — найбільша сторона, тобто AB > BC = 6 см.","why":"Проти найбільшого кута лежить найбільша сторона.","hl":["ab"]},{"do":"5 см < 6 см, тож AB = 5 см неможливо.","why":"Порівнюємо."}],"answer":"Відповідь: ні, бо AB має бути більшою за 6 см."}],"mistakes":["Шукають найбільший кут «біля» найбільшої сторони. Правильно: найбільший кут лежить <b>навпроти<\/b> найбільшої сторони, а не на її кінцях.","Думають, що якщо сторона вдвічі більша, то й кут проти неї вдвічі більший. Правильно: теорема лише порівнює («більше — менше»), а не дає кількох разів.","Вважають, що катет може бути довшим за гіпотенузу. Правильно: гіпотенуза лежить проти прямого кута — найбільшого, тож вона найдовша."],"check":[{"q":"<b>Пастка.<\/b> У трикутнику ABC AB = 8 см, BC = 5 см, AC = 6 см. Який кут найбільший?","fig":{"caption":"Трикутник ABC: AB = 8 см, BC = 5 см, AC = 6 см.","view":[-1.0,-1.0,9.0,4.745],"points":{"A":[0.0,0.0],"B":[8,0.0],"C":[4.688,3.745]},"items":[{"t":"poly","p":["A","B","C"]},{"t":"label","at":[4.0,-0.5],"text":"8 см"},{"t":"label","at":[6.719,2.204],"text":"5 см"},{"t":"label","at":[2.032,2.263],"text":"6 см"}],"check":[{"len":[["A","B"],8]},{"len":[["B","C"],5]},{"len":[["A","C"],6]}]},"options":["∠A","∠C","∠B"],"correct":1,"a":"∠C: він лежить проти найбільшої сторони AB. Кути A і B лежать на кінцях AB, а не навпроти."},{"q":"Трикутна клумба має кути 35°, 65° і 80°. Уздовж найдовшої сторони посадять троянди. Проти якого кута лежить ця сторона? Введіть його градусну міру.","accept":["80"],"a":"Найдовша сторона лежить проти найбільшого кута — 80°."},{"q":"У трикутнику ABC ∠A = 40°, ∠B = 70°. Які сторони рівні?","options":["AB = AC","AB = BC","AC = BC"],"correct":0,"a":"∠C = 180° − 40° − 70° = 70° = ∠B. Проти рівних кутів B і C лежать рівні сторони AC і AB."}],"fig":{"caption":"Трикутник ABC зі сторонами AB = 5, BC = 7, AC = 6. Найбільша сторона BC лежить проти найбільшого кута A.","view":[-1.0,-1.0,7.0,5.899],"points":{"A":[0.0,0.0],"B":[1,4.899],"C":[6,0.0]},"items":[{"t":"poly","p":["A","B","C"]},{"t":"seg","p":["B","C"],"s":"hl"},{"t":"angle","p":["B","A","C"],"s":"hl"},{"t":"label","at":[0.01,2.549],"text":"5"},{"t":"label","at":[3.85,2.807],"text":"7"},{"t":"label","at":[3.0,-0.5],"text":"6"}],"check":[{"len":[["A","B"],5]},{"len":[["B","C"],7]},{"len":[["A","C"],6]}]}}},{"id":"G3.6.2","name":"Нерівність трикутника","status":"ready","programmeRef":"Нерівність трикутника","lesson":{"what":"<b>Нерівність трикутника<\/b>: кожна сторона трикутника менша від суми двох інших сторін. Простими словами: прямий шлях між двома точками коротший, ніж «гак» через третю точку.","ideas":["Для △ABC виконуються три нерівності: AB < AC + CB, BC < BA + AC, AC < AB + BC.","Щоб перевірити, чи існує трикутник з даними сторонами, досить порівняти <b>найбільшу<\/b> сторону із сумою двох інших: якщо вона менша — трикутник існує.","Якщо найбільша сторона дорівнює сумі двох інших, трикутника немає: усі три точки лежать на одній прямій.","Наслідок: кожна сторона більша за різницю двох інших. Тому третя сторона x лежить між різницею і сумою двох відомих: a − b < x < a + b."],"rules":[{"f":"AB < AC + CB","means":"Будь-яка сторона менша від суми двох інших."},{"f":"a − b < c < a + b (a ≥ b)","means":"Третя сторона більша за різницю і менша від суми двох інших."}],"examples":[{"task":"Чи існує трикутник зі сторонами: а) 4 см, 5 см і 10 см; б) 3 см, 4 см і 6 см?","fig":{"caption":"Відрізок AB = 10 см. Коло з центром A радіуса 4 см і коло з центром B радіуса 5 см не перетинаються, тому третьої вершини трикутника немає.","view":[-4.5,-5.5,15.5,5.5],"points":{"A":[0.0,0.0],"B":[10,0.0],"P":[2.571,3.064],"Q":[6.786,3.83]},"hide":["P","Q"],"items":[{"t":"seg","p":["A","B"],"s":"hl","id":"ab"},{"t":"label","at":[5.0,-0.6],"text":"10 см"},{"t":"circle","c":"A","r":4,"s":"hl2 dash","id":"c1"},{"t":"circle","c":"B","r":5,"s":"hl2 dash","id":"c2"},{"t":"seg","p":["A","P"],"s":"faint"},{"t":"seg","p":["B","Q"],"s":"faint"},{"t":"label","at":[0.786,1.832],"text":"4"},{"t":"label","at":[8.893,2.215],"text":"5"}],"check":[{"len":[["A","B"],10]},{"onc":["P","A",4]},{"onc":["Q","B",5]}]},"steps":[{"do":"а) Найбільша сторона 10 см, сума двох інших 4 + 5 = 9 (см).","why":"Досить перевірити найбільшу сторону.","hl":["ab"]},{"do":"10 > 9, тож трикутника немає: кола радіусів 4 і 5 з центрами на кінцях відрізка 10 не перетинаються.","why":"Кожна сторона має бути меншою від суми двох інших.","hl":["c1","c2"]},{"do":"б) Найбільша сторона 6 см, а 3 + 4 = 7 (см); 6 < 7, тож трикутник існує.","why":"Нерівність трикутника виконується для найбільшої сторони, а для менших — і поготів."}],"answer":"Відповідь: а) ні; б) так."},{"task":"Дві сторони рівнобедреного трикутника 4 см і 9 см. Знайдіть його периметр.","fig":{"caption":"Рівнобедрений трикутник ABC з бічними сторонами AB = BC = 9 см і основою AC = 4 см.","view":[-1.0,-1.0,5.0,9.775],"points":{"A":[0.0,0.0],"B":[2,8.775],"C":[4,0.0]},"items":[{"t":"poly","p":["A","B","C"],"id":"t"},{"t":"seg","p":["A","B"],"ticks":1,"s":"hl","id":"ab"},{"t":"seg","p":["B","C"],"ticks":1,"s":"hl","id":"bc"},{"t":"label","at":[0.513,4.499],"text":"9 см"},{"t":"label","at":[2.0,-0.5],"text":"4 см"}],"check":[{"len":[["A","B"],9]},{"len":[["A","C"],4]}]},"steps":[{"do":"Випадок 1: бічні сторони по 4 см, основа 9 см. Але 4 + 4 = 8 < 9 — такого трикутника немає.","why":"Сторона має бути меншою від суми двох інших."},{"do":"Випадок 2: бічні сторони по 9 см, основа 4 см. 9 < 9 + 4 — трикутник існує.","why":"Перевіряємо найбільшу сторону.","hl":["ab","bc"]},{"do":"P = 9 + 9 + 4 = 22 (см).","why":"Периметр — сума сторін.","hl":["t"]}],"answer":"Відповідь: 22 см."},{"task":"Дві сторони трикутника 3 см і 8 см. Третя сторона — ціле число сантиметрів. Скільки значень вона може мати?","fig":{"caption":"Трикутник ABC: AC = 3 см, AB = 8 см, третя сторона BC = x.","view":[-1.0,-1.0,9.0,3.598],"points":{"A":[0.0,0.0],"B":[8,0.0],"C":[1.5,2.598]},"items":[{"t":"poly","p":["A","B","C"]},{"t":"seg","p":["B","C"],"s":"hl","id":"bc"},{"t":"label","at":[0.317,1.549],"text":"3 см"},{"t":"label","at":[4.0,-0.5],"text":"8 см"},{"t":"label","at":[4.936,1.763],"text":"x"}],"check":[{"len":[["A","C"],3]},{"len":[["A","B"],8]}]},"steps":[{"do":"x < 3 + 8 = 11.","why":"Сторона менша від суми двох інших.","hl":["bc"]},{"do":"x > 8 − 3 = 5, бо 8 < 3 + x.","why":"Сторона 8 см теж має бути меншою від суми двох інших."},{"do":"Отже, 5 < x < 11: x = 6, 7, 8, 9 або 10.","why":"Цілі числа між 5 і 11."},{"do":"Це 5 значень.","why":"Рахуємо."}],"answer":"Відповідь: 5 значень (6, 7, 8, 9, 10 см)."}],"mistakes":["Перевіряють лише найменшу сторону: «3 < 4 + 10 — отже трикутник є». Правильно: перевіряй <b>найбільшу<\/b> сторону — 10 < 3 + 4? Ні.","Вважають, що при рівності (5 = 2 + 3) трикутник існує. Правильно: нерівність строга; при рівності точки лежать на одній прямій.","У рівнобедреному трикутнику не перевіряють обидва випадки. Правильно: розглянь, яка сторона бічна, і перевір кожен випадок нерівністю трикутника."],"check":[{"q":"<b>Пастка.<\/b> Чи можна скласти трикутник з паличок завдовжки 5 см, 7 см і 12 см?","options":["Так","Ні"],"correct":1,"a":"Ні: 5 + 7 = 12, а найбільша сторона має бути <b>меншою<\/b> від суми двох інших. Палички ляжуть в одну лінію."},{"q":"Від дому до школи 1,2 км, а від дому до стадіону 0,5 км (по прямій). Яка найменша можлива відстань (у кілометрах) від школи до стадіону?","accept":["0,7"],"a":"Відстань від школи до стадіону не менша, ніж 1,2 − 0,5 = 0,7 (км). Рівно 0,7 км — коли стадіон лежить на прямому шляху від дому до школи."},{"q":"Дві сторони рівнобедреного трикутника 2 см і 7 см. Знайдіть третю сторону (у сантиметрах).","accept":["7"],"a":"Якби третя сторона була 2 см, то 2 + 2 = 4 < 7 — трикутника немає. Отже, третя сторона 7 см (трикутник 7, 7, 2)."}],"fig":{"caption":"Трикутник ABC. Шлях від A до B прямо (відрізок AB) коротший, ніж через вершину C (AC + CB).","view":[-1.0,-1.0,8.0,4.0],"points":{"A":[0.0,0.0],"B":[7,0.0],"C":[2.5,3]},"items":[{"t":"seg","p":["A","B"],"s":"hl"},{"t":"seg","p":["A","C"],"s":"hl2"},{"t":"seg","p":["C","B"],"s":"hl2"}]}}}]}]},{"id":"G4","subject":"geometry","name":"Коло і круг","what":"Коло, його елементи, дотична, вписане й описане коло, кути в колі і побудови циркулем і лінійкою.","topics":[{"id":"G4.1","name":"Коло і круг","what":"Центр, радіус, хорда, діаметр.","subtopics":[{"id":"G4.1.1","name":"Коло, круг і їхні елементи","status":"ready","programmeRef":"Коло. Круг.","lesson":{"what":"<b>Коло<\/b> — фігура з усіх точок площини, що лежать на однаковій відстані від однієї точки — <b>центра<\/b>. <b>Круг<\/b> — частина площини, обмежена колом, разом із самим колом. Відрізки в колі мають назви: радіус, хорда, діаметр.","fig":{"caption":"Коло з центром O і радіусом 3. OA — радіус, MN — діаметр (проходить через O), CD — хорда.","view":[-3.8,-3.8,3.8,3.8],"points":{"O":[0,0],"A":[1.5,2.598],"M":[-3,0],"N":[3,0],"C":[-2.719,-1.268],"D":[1.268,-2.719]},"lp":{"O":"s"},"items":[{"t":"circle","c":"O","r":3},{"t":"seg","p":["O","A"],"s":"hl","id":"r"},{"t":"label","at":[0.45,1.6],"text":"r"},{"t":"seg","p":["M","N"],"s":"hl2","id":"d"},{"t":"seg","p":["C","D"],"id":"ch"}],"check":[{"onc":["A","O",3]},{"onc":["M","O",3]},{"onc":["N","O",3]},{"onc":["C","O",3]},{"onc":["D","O",3]},{"col":["M","O","N"]}]},"ideas":["Коло креслять циркулем: голку ставлять у центр, а ніжку з олівцем розводять на потрібну відстань. Модель кола — обідок колеса чи обручка, модель круга — монета чи млинець.","<b>Радіус<\/b> — відрізок від центра до точки кола. Усі радіуси одного кола рівні; їхню довжину позначають <i>r<\/i>.","<b>Хорда<\/b> — відрізок, що сполучає дві точки кола. <b>Діаметр<\/b> — хорда, що проходить через центр. Діаметр складається з двох радіусів: <i>d<\/i> = 2<i>r<\/i>.","Точка лежить на колі, якщо її відстань до центра дорівнює <i>r<\/i>; всередині кола — якщо менша за <i>r<\/i>; поза колом — якщо більша.","Діаметр — найбільша з хорд кола: будь-яка інша хорда коротша."],"rules":[{"f":"<i>d<\/i> = 2<i>r<\/i>","means":"Діаметр удвічі довший за радіус; радіус — половина діаметра."},{"f":"Діаметр, перпендикулярний до хорди, ділить її навпіл.","means":"Якщо CD ⊥ AB і CD — діаметр, то він проходить через середину хорди AB."},{"f":"Діаметр, що проходить через середину хорди, яка не є діаметром, перпендикулярний до неї.","means":"Це обернене твердження: пряма через центр і середину хорди утворює з хордою прямий кут."}],"examples":[{"task":"Діаметр кола дорівнює 14 см. Знайдіть радіус. Точка K лежить на відстані 6 см від центра O. Де вона: на колі, всередині кола чи поза ним?","fig":{"caption":"Коло з центром O, діаметр AB = 14 см, точка K, OK = 6 см.","view":[-8,-8,8,8],"points":{"O":[0,0],"A":[-7,0],"B":[7,0],"K":[-3.0,5.196]},"lp":{"O":"s"},"items":[{"t":"circle","c":"O","r":7},{"t":"seg","p":["A","B"],"s":"hl","id":"d"},{"t":"label","at":[3.5,-0.7],"text":"14 см"},{"t":"seg","p":["O","K"],"s":"hl2","id":"k"},{"t":"label","at":[-2.2,2.2],"text":"6 см"}],"check":[{"len":[["A","B"],14]},{"len":[["O","K"],6]},{"col":["A","O","B"]},{"onc":["A","O",7]}]},"steps":[{"do":"Дано: d = 14 см, OK = 6 см. Знайти: r і де лежить K.","why":"Записуємо умову.","hl":["d","k"]},{"do":"r = d : 2 = 14 : 2 = 7 (см).","why":"Діаметр складається з двох радіусів: d = 2r.","hl":["d"]},{"do":"Порівнюємо: OK = 6 см, r = 7 см, 6 < 7.","why":"Відстань від центра до K менша за радіус.","hl":["k"]},{"do":"Отже, K лежить всередині кола (у крузі, але не на колі).","why":"Точки кола віддалені від центра рівно на r, а точки всередині — менше ніж на r.","hl":["k"]}],"answer":"Відповідь: r = 7 см; точка K лежить всередині кола."},{"task":"AB — хорда кола з центром O, ∠AOB = 80°. Знайдіть ∠OAB.","fig":{"caption":"Коло з центром O, хорда AB, радіуси OA і OB; ∠AOB = 80°, ∠OAB = ?","view":[-4.8,-4.8,4.8,4.8],"points":{"O":[0,0],"A":[-2.571,-3.064],"B":[2.571,-3.064]},"lp":{"O":"n"},"items":[{"t":"circle","c":"O","r":4},{"t":"seg","p":["O","A"],"ticks":1,"id":"oa"},{"t":"seg","p":["O","B"],"ticks":1,"id":"ob"},{"t":"seg","p":["A","B"]},{"t":"angle","p":["A","O","B"],"label":"80°","s":"hl2","id":"ao"},{"t":"angle","p":["O","A","B"],"label":"?","s":"hl","id":"aa"},{"t":"angle","p":["O","B","A"],"s":"hl","id":"ab"}],"check":[{"ang":[["A","O","B"],80]},{"ang":[["O","A","B"],50]},{"onc":["A","O",4]},{"onc":["B","O",4]}]},"steps":[{"do":"Дано: OA і OB — радіуси, ∠AOB = 80°. Знайти: ∠OAB.","why":"Записуємо умову.","hl":["ao"]},{"do":"OA = OB, тому △AOB рівнобедрений з основою AB.","why":"Усі радіуси кола рівні.","hl":["oa","ob"]},{"do":"∠OAB = ∠OBA.","why":"У рівнобедреному трикутнику кути при основі рівні.","hl":["aa","ab"]},{"do":"∠OAB + ∠OBA = 180° − 80° = 100°, тож ∠OAB = 100° : 2 = 50°.","why":"Сума кутів трикутника дорівнює 180°.","hl":["aa","ab","ao"]}],"answer":"Відповідь: ∠OAB = 50°."},{"task":"Діаметр CD кола з центром O перпендикулярний до хорди AB і перетинає її в точці M. Доведіть, що AM = MB. Знайдіть AB, якщо AM = 4 см.","fig":{"caption":"Коло з центром O, вертикальний діаметр CD, горизонтальна хорда AB, CD ⊥ AB у точці M; AM = 4 см.","view":[-5.8,-5.8,5.8,5.8],"points":{"O":[0,0],"C":[0,5],"D":[0,-5],"A":[-4,-3],"B":[4,-3],"M":[0,-3]},"lp":{"O":"e","M":"se","C":"n","D":"s"},"items":[{"t":"circle","c":"O","r":5},{"t":"seg","p":["C","D"],"s":"hl2","id":"cd"},{"t":"seg","p":["A","M"],"id":"am"},{"t":"seg","p":["M","B"],"id":"mb"},{"t":"label","at":[-2,-3.6],"text":"4 см"},{"t":"right","p":["B","M","O"],"id":"rt"},{"t":"seg","p":["O","A"],"s":"dash","ticks":1,"id":"oa"},{"t":"seg","p":["O","B"],"s":"dash","ticks":1,"id":"ob"}],"check":[{"len":[["A","M"],4]},{"onc":["A","O",5]},{"onc":["B","O",5]},{"onc":["C","O",5]},{"onc":["D","O",5]},{"col":["C","O","D"]},{"col":["A","M","B"]},{"col":["C","M","D"]},{"perp":[["C","D"],["A","B"]]},{"mid":["M","A","B"]}]},"steps":[{"do":"Проводимо радіуси OA і OB. OA = OB, тож △AOB рівнобедрений з основою AB.","why":"Усі радіуси кола рівні.","hl":["oa","ob"]},{"do":"OM ⊥ AB, тому OM — висота △AOB.","why":"За умовою діаметр CD перпендикулярний до хорди AB.","hl":["rt","cd"]},{"do":"Отже, OM — і медіана, тобто AM = MB.","why":"У рівнобедреному трикутнику висота, проведена до основи, є медіаною.","hl":["am","mb"]},{"do":"AB = 2 · AM = 2 · 4 = 8 (см).","why":"M — середина AB.","hl":["am","mb"]}],"answer":"Відповідь: AM = MB (доведено); AB = 8 см."}],"mistakes":["Плутати коло і круг. Коло — лише «обідок», лінія; круг — уся частина площини всередині разом з колом.","Ділити радіус навпіл, щоб знайти діаметр. Навпаки: <i>d<\/i> = 2<i>r<\/i>, тож діаметр 14 см — це радіус 7 см.","Вважати, що будь-який діаметр ділить хорду навпіл. Це так, коли діаметр перпендикулярний до хорди."],"check":[{"q":"<b>Пастка.<\/b> Чи може хорда кола бути довшою за його діаметр?","options":["Так, якщо хорда не проходить через центр","Ні, діаметр — найбільша хорда","Так, якщо коло велике"],"correct":1,"a":"Ні. Діаметр — найбільша хорда кола; будь-яка інша хорда коротша за нього."},{"q":"Радіус колеса велосипеда 35 см. Який діаметр колеса в сантиметрах? Введіть число.","accept":["70"],"a":"<i>d<\/i> = 2<i>r<\/i> = 2 · 35 = 70 (см)."},{"q":"AB — хорда кола з центром O, ∠OAB = 35°. Знайдіть ∠AOB у градусах. Введіть число.","fig":{"caption":"Коло з центром O, хорда AB, радіуси OA і OB; ∠OAB = 35°, ∠AOB = ?","view":[-3.8,-3.8,3.8,3.8],"points":{"O":[0,0],"A":[-2.457,-1.721],"B":[2.457,-1.721]},"lp":{"O":"n"},"items":[{"t":"circle","c":"O","r":3},{"t":"seg","p":["O","A"]},{"t":"seg","p":["O","B"]},{"t":"seg","p":["A","B"]},{"t":"angle","p":["O","A","B"],"label":"35°","s":"hl"},{"t":"angle","p":["A","O","B"],"label":"?","s":"hl2"}],"check":[{"ang":[["A","O","B"],110]}]},"accept":["110"],"a":"OA = OB (радіуси), тож ∠OBA = ∠OAB = 35°. ∠AOB = 180° − 35° − 35° = 110°."}]}}]},{"id":"G4.2","name":"Дотична до кола","what":"Пряма, що має з колом одну спільну точку.","subtopics":[{"id":"G4.2.1","name":"Дотична та її властивість","status":"ready","programmeRef":"Дотична до кола та її властивість.","lesson":{"what":"Пряма і коло можуть мати дві спільні точки, одну або жодної. Пряма, що має з колом рівно одну спільну точку, — <b>дотична<\/b>, а ця точка — <b>точка дотику<\/b>. Пряма з двома спільними точками — <b>січна<\/b>.","fig":{"caption":"Коло з центром O радіуса 2,5 і три паралельні прямі: a перетинає коло у двох точках (січна), b дотикається до кола в точці K (OK ⊥ b), c не має з колом спільних точок.","view":[-3,-3,4.6,3],"points":{"O":[0,0],"K":[2.5,0],"a1":[1.2,-2],"a2":[1.2,2],"b1":[2.5,1.5],"c1":[3.8,-2],"c2":[3.8,2]},"hide":["a1","a2","b1","c1","c2"],"lp":{"O":"s","K":"se"},"items":[{"t":"circle","c":"O","r":2.5},{"t":"line","p":["a1","a2"]},{"t":"label","at":[0.95,2.7],"text":"a"},{"t":"line","p":["K","b1"],"s":"hl"},{"t":"label","at":[2.25,2.7],"text":"b"},{"t":"line","p":["c1","c2"]},{"t":"label","at":[3.55,2.7],"text":"c"},{"t":"seg","p":["O","K"],"s":"hl2"},{"t":"right","p":["O","K","b1"]}],"check":[{"onc":["K","O",2.5]},{"perp":[["O","K"],["K","b1"]]}]},"ideas":["Усе вирішує відстань <i>d<\/i> від центра до прямої (довжина перпендикуляра). Якщо <i>d<\/i> < <i>r<\/i> — дві спільні точки, якщо <i>d<\/i> = <i>r<\/i> — одна, якщо <i>d<\/i> > <i>r<\/i> — жодної.","Дотична і радіус, проведений у точку дотику, утворюють прямий кут.","Щоб провести дотичну через точку кола, проводять радіус у цю точку і пряму, перпендикулярну до нього.","Якщо з однієї точки провести до кола дві дотичні, то відрізки від цієї точки до точок дотику рівні."],"rules":[{"f":"Дотична до кола перпендикулярна до радіуса, проведеного в точку дотику.","means":"Властивість дотичної: якщо AK — дотична, K — точка дотику, то OK ⊥ AK."},{"f":"Якщо пряма проходить через точку кола і перпендикулярна до радіуса, проведеного в цю точку, то вона — дотична.","means":"Ознака дотичної: так перевіряють і так будують дотичну."},{"f":"Відрізки дотичних, проведених до кола з однієї точки, рівні.","means":"Якщо AB і AC — дотичні з точки A, то AB = AC."}],"examples":[{"task":"Радіус кола 6 см. Відстань від центра O до прямої дорівнює: а) 4 см; б) 6 см; в) 8 см. Скільки спільних точок має пряма з колом у кожному випадку?","fig":{"caption":"Коло з центром O радіуса 6 і три прямі на відстанях 4, 6 і 8 від центра: a, b, c.","view":[-6.6,-6.8,9,6.8],"points":{"O":[0,0],"H1":[4,0],"H2":[6,0],"H3":[8,0],"a1":[4,5],"b1":[6,5],"c1":[8,5]},"hide":["H1","H2","H3","a1","b1","c1"],"lp":{"O":"s"},"items":[{"t":"circle","c":"O","r":6},{"t":"seg","p":["O","H3"],"s":"dash"},{"t":"line","p":["H1","a1"],"s":"hl","id":"la"},{"t":"label","at":[3.6,6.3],"text":"a"},{"t":"line","p":["H2","b1"],"s":"hl","id":"lb"},{"t":"label","at":[5.6,6.3],"text":"b"},{"t":"line","p":["H3","c1"],"s":"hl","id":"lc"},{"t":"label","at":[7.6,6.3],"text":"c"}],"check":[{"len":[["O","H1"],4]},{"len":[["O","H2"],6]},{"len":[["O","H3"],8]},{"perp":[["O","H3"],["H1","a1"]]},{"perp":[["O","H3"],["H2","b1"]]},{"perp":[["O","H3"],["H3","c1"]]}]},"steps":[{"do":"Порівнюємо відстань <i>d<\/i> від центра до прямої з радіусом <i>r<\/i> = 6 см.","why":"Від цього залежить, як розміщені пряма і коло."},{"do":"а) <i>d<\/i> = 4 см < 6 см — пряма a перетинає коло у двох точках.","why":"Якщо <i>d<\/i> < <i>r<\/i>, пряма — січна.","hl":["la"]},{"do":"б) <i>d<\/i> = 6 см = <i>r<\/i> — пряма b має з колом одну спільну точку.","why":"Якщо <i>d<\/i> = <i>r<\/i>, пряма — дотична.","hl":["lb"]},{"do":"в) <i>d<\/i> = 8 см > 6 см — пряма c не має з колом спільних точок.","why":"Якщо <i>d<\/i> > <i>r<\/i>, пряма проходить поза колом.","hl":["lc"]}],"answer":"Відповідь: а) 2 точки; б) 1 точка; в) жодної."},{"task":"AK — дотична до кола з центром O, K — точка дотику. OK = 5 см, OA = 10 см. Знайдіть кути трикутника OKA.","fig":{"caption":"Коло з центром O радіуса 5, точка A на відстані 10 від O, дотична AK; OK ⊥ AK.","view":[-5.8,-5.8,11,6.4],"points":{"O":[0,0],"K":[2.5,4.33],"A":[10,0]},"lp":{"O":"sw","K":"n","A":"s"},"items":[{"t":"circle","c":"O","r":5},{"t":"line","p":["A","K"],"s":"hl2","id":"t"},{"t":"seg","p":["O","K"],"s":"hl","id":"ok"},{"t":"label","at":[0.7,2.3],"text":"5 см"},{"t":"seg","p":["O","A"],"id":"oa"},{"t":"label","at":[6.5,-0.6],"text":"10 см"},{"t":"right","p":["O","K","A"],"id":"rt"},{"t":"angle","p":["O","A","K"],"label":"?","id":"aA"},{"t":"angle","p":["A","O","K"],"label":"?","id":"aO"}],"check":[{"len":[["O","K"],5]},{"len":[["O","A"],10]},{"onc":["K","O",5]},{"ang":[["O","A","K"],30]},{"ang":[["A","O","K"],60]}]},"steps":[{"do":"Дано: AK — дотична, OK = 5 см, OA = 10 см. Знайти: кути △OKA.","why":"Записуємо умову.","hl":["t"]},{"do":"OK ⊥ AK, отже ∠OKA = 90°.","why":"Дотична перпендикулярна до радіуса, проведеного в точку дотику.","hl":["rt","t"]},{"do":"У прямокутному △OKA катет OK = 5 см — половина гіпотенузи OA = 10 см, тому ∠OAK = 30°.","why":"Катет, що дорівнює половині гіпотенузи, лежить проти кута 30°.","hl":["ok","oa","aA"]},{"do":"∠AOK = 90° − 30° = 60°.","why":"Сума гострих кутів прямокутного трикутника — 90°.","hl":["aO"]}],"answer":"Відповідь: ∠OKA = 90°, ∠OAK = 30°, ∠AOK = 60°."},{"task":"З точки A до кола з центром O проведено дві дотичні AB і AC (B і C — точки дотику). Доведіть, що AB = AC. Знайдіть AC, якщо AB = 7 см.","fig":{"caption":"Коло з центром O, з точки A проведено дотичні AB і AC; OB ⊥ AB, OC ⊥ AC; AB = 7 см.","view":[-3.6,-3.8,8.4,3.8],"points":{"O":[0,0],"A":[7.616,0.0],"B":[1.182,2.757],"C":[1.182,-2.757]},"lp":{"O":"w","A":"e","B":"n","C":"s"},"items":[{"t":"circle","c":"O","r":3},{"t":"seg","p":["A","B"],"s":"hl","id":"ab"},{"t":"label","at":[4.7,2.3],"text":"7 см"},{"t":"seg","p":["A","C"],"s":"hl","id":"ac"},{"t":"seg","p":["O","B"],"ticks":1,"id":"ob"},{"t":"seg","p":["O","C"],"ticks":1,"id":"oc"},{"t":"seg","p":["O","A"],"s":"dash","id":"oa"},{"t":"right","p":["O","B","A"],"id":"rb"},{"t":"right","p":["O","C","A"],"id":"rc"}],"check":[{"len":[["A","B"],7]},{"onc":["B","O",3]},{"onc":["C","O",3]},{"eq":[["A","B"],["A","C"]]}]},"steps":[{"do":"Проводимо радіуси OB і OC та відрізок OA.","why":"Радіуси в точки дотику допоможуть побачити прямі кути.","hl":["ob","oc","oa"]},{"do":"OB ⊥ AB і OC ⊥ AC, тож △OBA і △OCA прямокутні.","why":"Дотична перпендикулярна до радіуса, проведеного в точку дотику.","hl":["rb","rc"]},{"do":"У них OB = OC, а гіпотенуза OA спільна.","why":"OB і OC — радіуси одного кола.","hl":["ob","oc","oa"]},{"do":"△OBA = △OCA за гіпотенузою і катетом, тому AB = AC = 7 см.","why":"У рівних трикутниках відповідні сторони рівні.","hl":["ab","ac"]}],"answer":"Відповідь: AB = AC (доведено); AC = 7 см."}],"mistakes":["Порівнювати відстань від центра до прямої з діаметром, а не з радіусом. Дотична — коли відстань дорівнює саме <i>r<\/i>.","Шукати прямий кут між дотичною і будь-яким відрізком. Перпендикулярний до дотичної лише радіус, проведений у точку дотику.","Думати, що дотична «трохи заходить» у коло. Дотична має з колом лише одну спільну точку, решта її точок — поза колом."],"check":[{"q":"<b>Пастка.<\/b> Діаметр кола 10 см, а пряма має з колом одну спільну точку. Яка відстань (у см) від центра до прямої? Введіть число.","accept":["5"],"a":"Пряма — дотична, тож відстань дорівнює радіусу: 10 : 2 = 5 (см), а не діаметру."},{"q":"AK — дотична до кола з центром O, K — точка дотику, ∠OAK = 25°. Знайдіть ∠AOK у градусах. Введіть число.","fig":{"caption":"Коло з центром O, дотична AK, K — точка дотику; ∠OAK = 25°, ∠AOK = ?","view":[-3.6,-3.6,7.8,3.8],"points":{"O":[0,0],"K":[1.268,2.719],"A":[7.099,0.0]},"lp":{"O":"sw","K":"n","A":"s"},"items":[{"t":"circle","c":"O","r":3},{"t":"line","p":["A","K"],"s":"hl2"},{"t":"seg","p":["O","K"]},{"t":"seg","p":["O","A"]},{"t":"angle","p":["O","A","K"],"label":"25°","s":"hl"},{"t":"angle","p":["A","O","K"],"label":"?","s":"hl"}],"check":[{"onc":["K","O",3]},{"perp":[["O","K"],["K","A"]]},{"ang":[["A","O","K"],65]}]},"accept":["65"],"a":"OK ⊥ AK, тож ∠OKA = 90°. ∠AOK = 90° − 25° = 65°."},{"q":"Колесо котиться по рівній дорозі. Який кут між дорогою і спицею, що йде від осі колеса до точки, якою колесо торкається дороги?","options":["45°","180°","90°"],"correct":2,"a":"Дорога — дотична до обода, спиця — радіус у точку дотику. Дотична перпендикулярна до такого радіуса: 90°."}]}}]},{"id":"G4.3","name":"Вписане й описане коло","what":"Коло всередині трикутника і коло навколо нього.","subtopics":[{"id":"G4.3.1","name":"Коло, описане навколо трикутника","status":"ready","programmeRef":"Коло, описане навколо трикутника.","lesson":{"what":"Коло <b>описане навколо трикутника<\/b>, якщо воно проходить через усі три його вершини. Його центр однаково віддалений від вершин. Знаходять центр за допомогою <b>серединних перпендикулярів<\/b> до сторін.","fig":{"caption":"Трикутник ABC, серединні перпендикуляри до його сторін (пунктир) перетинаються в точці O; коло з центром O проходить через A, B і C.","view":[-3.9,-3.9,4.3,3.9],"points":{"A":[-3,-1.5],"B":[3.2,-1.5],"C":[0.8,2.8],"O":[0.1,-0.41],"M1":[0.1,-1.5],"M2":[2.0,0.65],"M3":[-1.1,0.65]},"hide":["M1","M2","M3"],"lp":{"O":"e"},"items":[{"t":"circle","c":"O","through":"A","s":"hl"},{"t":"seg","p":["A","M1"],"ticks":1},{"t":"seg","p":["M1","B"],"ticks":1},{"t":"seg","p":["B","M2"],"ticks":2},{"t":"seg","p":["M2","C"],"ticks":2},{"t":"seg","p":["C","M3"],"ticks":3},{"t":"seg","p":["M3","A"],"ticks":3},{"t":"line","p":["M1","O"],"s":"dash"},{"t":"line","p":["M2","O"],"s":"dash"},{"t":"line","p":["M3","O"],"s":"dash"},{"t":"right","p":["B","M1","O"]},{"t":"right","p":["C","M2","O"]},{"t":"right","p":["A","M3","O"]},{"t":"seg","p":["O","A"],"s":"hl2"}],"check":[{"eq":[["O","A"],["O","B"]]},{"eq":[["O","A"],["O","C"]]},{"mid":["M1","A","B"]},{"mid":["M2","B","C"]},{"mid":["M3","C","A"]}]},"ideas":["<b>Серединний перпендикуляр<\/b> до відрізка — пряма, що проходить через середину відрізка і перпендикулярна до нього.","Кожна точка серединного перпендикуляра однаково віддалена від кінців відрізка. І навпаки: точка, однаково віддалена від кінців відрізка, лежить на його серединному перпендикулярі.","Серединні перпендикуляри до трьох сторін трикутника перетинаються в одній точці. Вона рівновіддалена від усіх вершин — це центр описаного кола.","Навколо будь-якого трикутника можна описати коло, і тільки одне. Радіус описаного кола позначають <i>R<\/i>: OA = OB = OC = <i>R<\/i>.","У гострокутному трикутнику центр описаного кола лежить усередині трикутника, у прямокутному — на середині гіпотенузи, у тупокутному — поза трикутником."],"rules":[{"f":"Кожна точка серединного перпендикуляра до відрізка рівновіддалена від його кінців.","means":"Якщо M лежить на серединному перпендикулярі до AB, то MA = MB."},{"f":"Центр кола, описаного навколо трикутника, — точка перетину серединних перпендикулярів до його сторін.","means":"Щоб знайти центр, досить провести серединні перпендикуляри до двох сторін."}],"examples":[{"task":"Точка M лежить на серединному перпендикулярі до відрізка AB, K — середина AB. Доведіть, що MA = MB. Знайдіть MB, якщо MA = 5 см.","fig":{"caption":"Відрізок AB, його середина K, серединний перпендикуляр KM; MA = 5 см, MB = ?","view":[-4,-1,4,5],"points":{"A":[-3,0],"B":[3,0],"K":[0,0],"M":[0,4]},"lp":{"K":"s","M":"e"},"items":[{"t":"seg","p":["A","K"],"ticks":1,"id":"ak"},{"t":"seg","p":["K","B"],"ticks":1,"id":"kb"},{"t":"line","p":["K","M"],"s":"dash","id":"p"},{"t":"right","p":["B","K","M"],"id":"rt"},{"t":"seg","p":["M","A"],"s":"hl","id":"ma"},{"t":"label","at":[-2,2.3],"text":"5 см"},{"t":"seg","p":["M","B"],"s":"hl2","id":"mb"},{"t":"label","at":[1.9,2.3],"text":"?"}],"check":[{"mid":["K","A","B"]},{"perp":[["K","M"],["A","B"]]},{"len":[["M","A"],5]}]},"steps":[{"do":"Дано: K — середина AB, MK ⊥ AB, MA = 5 см. Довести: MA = MB.","why":"Серединний перпендикуляр проходить через середину відрізка перпендикулярно до нього.","hl":["p","rt"]},{"do":"Розглянемо △MKA і △MKB: AK = KB, ∠MKA = ∠MKB = 90°, MK — спільна сторона.","why":"K — середина AB, MK ⊥ AB.","hl":["ak","kb","rt"]},{"do":"△MKA = △MKB за двома сторонами і кутом між ними.","why":"Перша ознака рівності трикутників.","hl":["ma","mb"]},{"do":"Тому MA = MB = 5 см.","why":"У рівних трикутниках відповідні сторони рівні.","hl":["ma","mb"]}],"answer":"Відповідь: MA = MB (доведено); MB = 5 см."},{"task":"Серединний перпендикуляр до сторони AB трикутника ABC перетинає сторону BC у точці D. BC = 10 см, AC = 6 см. Знайдіть периметр трикутника ADC.","fig":{"caption":"Трикутник ABC, BC = 10 см, AC = 6 см; серединний перпендикуляр до AB перетинає BC у точці D; проведено AD.","view":[-0.8,-1.2,10.8,6.4],"points":{"A":[2.052,5.638],"B":[10,0],"C":[0,0],"D":[4.026,0.0],"N":[6.026,2.819]},"hide":["N"],"lp":{"A":"n","D":"s","C":"sw","B":"se"},"items":[{"t":"poly","p":["A","B","C"]},{"t":"seg","p":["A","N"],"ticks":1},{"t":"seg","p":["N","B"],"ticks":1},{"t":"line","p":["N","D"],"s":"dash","id":"p"},{"t":"right","p":["B","N","D"]},{"t":"seg","p":["A","D"],"s":"hl","id":"ad"},{"t":"seg","p":["D","B"],"s":"hl2","id":"db"},{"t":"seg","p":["D","C"],"s":"hl","id":"dc"},{"t":"seg","p":["A","C"],"s":"hl","id":"ac"},{"t":"label","at":[0.4,3.2],"text":"6 см"},{"t":"label","at":[7.2,-0.7],"text":"10 см"}],"check":[{"len":[["B","C"],10]},{"len":[["A","C"],6]},{"col":["C","D","B"]},{"eq":[["D","A"],["D","B"]]},{"mid":["N","A","B"]},{"perp":[["N","D"],["A","B"]]}]},"steps":[{"do":"Дано: D на серединному перпендикулярі до AB, BC = 10 см, AC = 6 см. Знайти: P<sub>ADC<\/sub>.","why":"Записуємо умову.","hl":["p"]},{"do":"DA = DB.","why":"Кожна точка серединного перпендикуляра рівновіддалена від кінців відрізка.","hl":["ad","db"]},{"do":"P<sub>ADC<\/sub> = AD + DC + AC = DB + DC + AC.","why":"Замінюємо AD на рівний йому DB.","hl":["db","dc","ac"]},{"do":"DB + DC = BC = 10 см, тому P<sub>ADC<\/sub> = 10 + 6 = 16 (см).","why":"D лежить на стороні BC між B і C.","hl":["db","dc"]}],"answer":"Відповідь: 16 см."},{"task":"Точка O — центр кола, описаного навколо трикутника ABC, ∠OBC = 25°. Знайдіть ∠BOC.","fig":{"caption":"Трикутник ABC і описане коло з центром O; проведено OB і OC; ∠OBC = 25°, ∠BOC = ?","view":[-4.8,-4.8,4.8,4.8],"points":{"O":[0,0],"A":[-0.695,3.939],"B":[-3.625,-1.69],"C":[3.625,-1.69]},"lp":{"O":"n"},"items":[{"t":"circle","c":"O","r":4,"s":"faint"},{"t":"poly","p":["A","B","C"]},{"t":"seg","p":["O","B"],"ticks":1,"id":"ob"},{"t":"seg","p":["O","C"],"ticks":1,"id":"oc"},{"t":"angle","p":["O","B","C"],"label":"25°","s":"hl","id":"b"},{"t":"angle","p":["O","C","B"],"s":"hl","id":"c"},{"t":"angle","p":["B","O","C"],"label":"?","s":"hl2","id":"o"}],"check":[{"onc":["A","O",4]},{"onc":["B","O",4]},{"onc":["C","O",4]},{"ang":[["O","B","C"],25]},{"ang":[["B","O","C"],130]}]},"steps":[{"do":"OB = OC.","why":"Це радіуси описаного кола: центр рівновіддалений від вершин.","hl":["ob","oc"]},{"do":"△BOC рівнобедрений, тому ∠OCB = ∠OBC = 25°.","why":"Кути при основі рівнобедреного трикутника рівні.","hl":["b","c"]},{"do":"∠BOC = 180° − 25° − 25° = 130°.","why":"Сума кутів трикутника дорівнює 180°.","hl":["o"]}],"answer":"Відповідь: ∠BOC = 130°."}],"mistakes":["Плутати серединний перпендикуляр з висотою чи медіаною. Серединний перпендикуляр проходить через середину сторони під прямим кутом, але зазвичай не через вершину.","Шукати центр описаного кола на перетині бісектрис. Бісектриси дають центр вписаного кола, а описаного — серединні перпендикуляри.","Вважати, що центр описаного кола завжди всередині трикутника. У тупокутному трикутнику він поза ним."],"check":[{"q":"<b>Пастка.<\/b> Центр кола, описаного навколо трикутника, — це точка перетину…","options":["бісектрис трикутника","медіан трикутника","серединних перпендикулярів до сторін","висот трикутника"],"correct":2,"a":"Серединних перпендикулярів: лише їхні точки рівновіддалені від кінців сторін, а отже, й від усіх вершин."},{"q":"Три будинки стоять не на одній прямій. Де поставити ліхтар, щоб він був однаково віддалений від усіх трьох будинків?","options":["Посередині між двома найближчими  саму дугу?","options":["20°","40°","80°"],"correct":2,"a":"Вписаний кут — половина центрального, тож центральний удвічі більший: 2 · 40° = 80°."},{"q":"Точки A, B, C, D лежать на колі, C і D — по один бік від хорди AB. ∠ACB = 48°. Знайдіть ∠ADB у градусах. Введіть число.","fig":{"caption":"Коло, точки A, B, C, D на ньому; C і D лежать по один бік від AB; ∠ACB = 48°, ∠ADB = ?","view":[-3.8,-3.8,3.8,3.8],"points":{"O":[0,0],"A":[-2.819,-1.026],"B":[1.315,-2.696],"C":[1.026,2.819],"D":[-1.928,2.298]},"hide":["O"],"items":[{"t":"circle","c":"O","r":3},{"t":"seg","p":["C","A"],"s":"hl"},{"t":"seg","p":["C","B"],"s":"hl"},{"t":"seg","p":["D","A"],"s":"hl2"},{"t":"seg","p":["D","B"],"s":"hl2"},{"t":"angle","p":["A","C","B"],"label":"48°","s":"hl"},{"t":"angle","p":["A","D","B"],"label":"?","s":"hl2"}],"check":[{"ang":[["A","D","B"],48]}]},"accept":["48"],"a":"∠ACB і ∠ADB — вписані кути, що спираються на ту саму дугу AB, тому вони рівні: 48°."},{"q":"Глядачі сидять на дузі кола, а екран — хорда цього самого кола. Чи бачать усі ці глядачі екран під однаковим кутом?","options":["Так: це вписані кути, що спираються на ту саму дугу","Ні: хто ближче до центра ряду, бачить під більшим кутом","Ні: хто ближче до краю, бачить під більшим кутом"],"correct":0,"a":"Так. Для кожного глядача кут — вписаний і спирається на ту саму дугу (між кінцями екрана), а такі кути рівні."}]}}]},{"id":"G4.5","name":"Взаємне розміщення двох кіл","what":"Як можуть розташовуватися два кола.","subtopics":[{"id":"G4.5.1","name":"Взаємне розміщення двох кіл","status":"ready","programmeRef":"Взаємне розміщення двох кіл.","lesson":{"what":"Два кола можуть не мати спільних точок, мати одну спільну точку (кола <b>дотикаються<\/b>) або дві (кола <b>перетинаються<\/b>). Що саме — залежить від відстані <i>d<\/i> між центрами і радіусів <i>R<\/i> і <i>r<\/i> (<i>R<\/i> ≥ <i>r<\/i>).","fig":{"caption":"Три пари кіл. Ліворуч кола не мають спільних точок, посередині дотикаються в точці T, праворуч перетинаються в точках A і B.","view":[-9.5,-2.7,8.8,1.9],"points":{"P1":[-8,0],"P2":[-5,0],"Q1":[-1.5,0],"Q2":[1,0],"T":[-0.3,0],"R1":[5,0],"R2":[7,0],"A":[5.87,0.826],"B":[5.87,-0.826]},"hide":["P1","P2","Q1","Q2","R1","R2"],"lp":{"T":"n","A":"n","B":"s"},"items":[{"t":"circle","c":"P1","r":1.2},{"t":"circle","c":"P2","r":1.2},{"t":"circle","c":"Q1","r":1.2,"s":"hl"},{"t":"circle","c":"Q2","r":1.3,"s":"hl"},{"t":"circle","c":"R1","r":1.2,"s":"hl2"},{"t":"circle","c":"R2","r":1.4,"s":"hl2"},{"t":"label","at":[-6.5,-2.4],"text":"0 точок"},{"t":"label","at":[-0.3,-2.4],"text":"1 точка"},{"t":"label","at":[6,-2.4],"text":"2 точки"}],"check":[{"onc":["T","Q1",1.2]},{"onc":["T","Q2",1.3]},{"onc":["A","R1",1.2]},{"onc":["A","R2",1.4]}]},"ideas":["<i>d<\/i> > <i>R<\/i> + <i>r<\/i> — кола лежать одне поза одним, спільних точок немає.","<i>d<\/i> = <i>R<\/i> + <i>r<\/i> — кола дотикаються зовні (одна спільна точка).","<i>R<\/i> − <i>r<\/i> < <i>d<\/i> < <i>R<\/i> + <i>r<\/i> — кола перетинаються у двох точках.","<i>d<\/i> = <i>R<\/i> − <i>r<\/i> — кола дотикаються внутрішньо; <i>d<\/i> < <i>R<\/i> − <i>r<\/i> — менше коло всередині більшого без спільних точок. Кола зі спільним центром називають <b>концентричними<\/b>.","Точка дотику двох кіл лежить на прямій, що проходить через їхні центри."],"rules":[{"f":"<i>d<\/i> = <i>R<\/i> + <i>r<\/i> — зовнішній дотик; <i>d<\/i> = <i>R<\/i> − <i>r<\/i> — внутрішній дотик.","means":"Коли кола дотикаються, відстань між центрами дорівнює сумі радіусів (зовні) або різниці (всередині)."},{"f":"<i>R<\/i> − <i>r<\/i> < <i>d<\/i> < <i>R<\/i> + <i>r<\/i> — кола перетинаються.","means":"Дві спільні точки, коли відстань між центрами більша за різницю радіусів, але менша за їхню суму."}],"examples":[{"task":"Радіуси двох кіл 5 см і 3 см, відстань між їхніми центрами O<sub>1<\/sub> і O<sub>2<\/sub> дорівнює 8 см. Як розміщені кола? Де лежить їхня спільна точка?","fig":{"caption":"Кола з центрами O1 і O2 радіусів 5 і 3, O1O2 = 8 см; вони дотикаються в точці T на відрізку O1O2.","view":[-5.6,-5.6,11.6,5.6],"points":{"O1":[0,0],"O2":[8,0],"T":[5,0]},"lp":{"O1":"s","O2":"s","T":"ne"},"items":[{"t":"circle","c":"O1","r":5},{"t":"circle","c":"O2","r":3},{"t":"seg","p":["O1","T"],"s":"hl","id":"r1"},{"t":"label","at":[2.5,0.5],"text":"5 см"},{"t":"seg","p":["T","O2"],"s":"hl2","id":"r2"},{"t":"label","at":[6.5,-0.6],"text":"3 см"},{"t":"label","at":[4,-1.7],"text":"8 см","id":"d"}],"check":[{"len":[["O1","O2"],8]},{"onc":["T","O1",5]},{"onc":["T","O2",3]},{"col":["O1","T","O2"]}]},"steps":[{"do":"Дано: <i>R<\/i> = 5 см, <i>r<\/i> = 3 см, <i>d<\/i> = O<sub>1<\/sub>O<sub>2<\/sub> = 8 см. Знайти: як розміщені кола.","why":"Записуємо умову.","hl":["d"]},{"do":"<i>R<\/i> + <i>r<\/i> = 5 + 3 = 8 (см), тобто <i>d<\/i> = <i>R<\/i> + <i>r<\/i>.","why":"Порівнюємо відстань між центрами із сумою радіусів.","hl":["r1","r2"]},{"do":"Отже, кола дотикаються зовні — мають одну спільну точку T.","why":"Якщо <i>d<\/i> = <i>R<\/i> + <i>r<\/i>, кола дотикаються зовні."},{"do":"T лежить на відрізку O<sub>1<\/sub>O<sub>2<\/sub>, O<sub>1<\/sub>T = 5 см, TO<sub>2<\/sub> = 3 см.","why":"Точка дотику двох кіл лежить на прямій, що проходить через їхні центри.","hl":["r1","r2"]}],"answer":"Відповідь: кола дотикаються зовні; точка дотику T лежить на O<sub>1<\/sub>O<sub>2<\/sub> на відстані 5 см від O<sub>1<\/sub>."},{"task":"Радіуси двох кіл 6 см і 2 см, відстань між центрами 4 см. Як розміщені кола? А якби відстань між центрами була 5 см?","fig":{"caption":"Кола з центрами O1 і O2 радіусів 6 і 2, O1O2 = 4 см; менше коло всередині більшого і дотикається до нього в точці T.","view":[-6.6,-6.6,6.9,6.6],"points":{"O1":[0,0],"O2":[4,0],"T":[6,0]},"lp":{"O1":"s","O2":"s","T":"e"},"items":[{"t":"circle","c":"O1","r":6,"s":"hl","id":"c1"},{"t":"circle","c":"O2","r":2,"s":"hl2","id":"c2"},{"t":"seg","p":["O1","O2"],"s":"dash","id":"d"},{"t":"label","at":[2,0.5],"text":"4 см"}],"check":[{"len":[["O1","O2"],4]},{"onc":["T","O1",6]},{"onc":["T","O2",2]},{"col":["O1","O2","T"]}]},"steps":[{"do":"<i>R<\/i> − <i>r<\/i> = 6 − 2 = 4 (см), <i>R<\/i> + <i>r<\/i> = 6 + 2 = 8 (см).","why":"Готуємо обидва числа для порівняння.","hl":["c1","c2"]},{"do":"<i>d<\/i> = 4 см = <i>R<\/i> − <i>r<\/i>, отже, кола дотикаються внутрішньо: менше коло всередині більшого і має з ним одну спільну точку T.","why":"Якщо <i>d<\/i> = <i>R<\/i> − <i>r<\/i>, дотик внутрішній.","hl":["d"]},{"do":"Якщо <i>d<\/i> = 5 см, то 4 < 5 < 8, тобто <i>R<\/i> − <i>r<\/i> < <i>d<\/i> < <i>R<\/i> + <i>r<\/i>, і кола перетинаються у двох точках.","why":"Так буває, коли відстань між центрами між різницею і сумою радіусів."}],"answer":"Відповідь: при 4 см кола дотикаються внутрішньо; при 5 см — перетинаються у двох точках."},{"task":"Три кола з радіусами 1 см, 2 см і 3 см попарно дотикаються зовні. Знайдіть периметр трикутника з вершинами в центрах кіл.","fig":{"caption":"Кола з центрами O1, O2, O3 радіусів 1, 2, 3 попарно дотикаються зовні; трикутник O1O2O3.","view":[-3.3,-2.4,5.4,7.3],"points":{"O1":[0,0],"O2":[3,0],"O3":[0,4]},"lp":{"O1":"sw","O2":"se","O3":"n"},"items":[{"t":"circle","c":"O1","r":1},{"t":"circle","c":"O2","r":2},{"t":"circle","c":"O3","r":3},{"t":"seg","p":["O1","O2"],"s":"hl","id":"s12"},{"t":"seg","p":["O1","O3"],"s":"hl","id":"s13"},{"t":"seg","p":["O2","O3"],"s":"hl2","id":"s23"}],"check":[{"len":[["O1","O2"],3]},{"len":[["O1","O3"],4]},{"len":[["O2","O3"],5]}]},"steps":[{"do":"O<sub>1<\/sub>O<sub>2<\/sub> = 1 + 2 = 3 (см).","why":"Для кіл, що дотикаються зовні, відстань між центрами дорівнює сумі радіусів.","hl":["s12"]},{"do":"O<sub>1<\/sub>O<sub>3<\/sub> = 1 + 3 = 4 (см), O<sub>2<\/sub>O<sub>3<\/sub> = 2 + 3 = 5 (см).","why":"Те саме правило для двох інших пар кіл.","hl":["s13","s23"]},{"do":"P = 3 + 4 + 5 = 12 (см).","why":"Периметр — сума сторін. Інакше: кожен радіус входить двічі, 2 · (1 + 2 + 3) = 12.","hl":["s12","s13","s23"]}],"answer":"Відповідь: 12 см."}],"mistakes":["Порівнювати <i>d<\/i> лише із сумою радіусів. Якщо <i>d<\/i> < <i>R<\/i> + <i>r<\/i>, кола ще не обов'язково перетинаються: перевір і різницю <i>R<\/i> − <i>r<\/i>.","Забувати другий випадок у задачі «кола дотикаються». Дотик буває зовнішній (<i>d<\/i> = <i>R<\/i> + <i>r<\/i>) і внутрішній (<i>d<\/i> = <i>R<\/i> − <i>r<\/i>).","Брати діаметри замість радіусів. У всіх правилах — радіуси."],"check":[{"q":"<b>Пастка.<\/b> Радіуси кіл 8 см і 3 см, відстань між центрами 5 см. Як розміщені кола?","options":["Перетинаються у двох точках","Дотикаються внутрішньо","Дотикаються зовні"],"correct":1,"a":"<i>R<\/i> − <i>r<\/i> = 8 − 3 = 5 = <i>d<\/i>, тож кола дотикаються внутрішньо. Те, що 5 < 8 + 3, ще не означає перетину."},{"q":"Кола з радіусами 7 см і 4 см дотикаються. Знайдіть відстань між їхніми центрами (у см). Запишіть обидві можливі відповіді через «;» — від меншої до більшої.","accept":["3; 11","11; 3"],"a":"Внутрішній дотик: 7 − 4 = 3 (см). Зовнішній дотик: 7 + 4 = 11 (см)."},{"q":"На стіні дві круглі плями світла від ліхтариків з радіусами 30 см і 20 см. Відстань між їхніми центрами 60 см. Чи накладаються плями?","options":["Так, перетинаються","Лише дотикаються","Ні, між ними є проміжок"],"correct":2,"a":"30 + 20 = 50 < 60, тобто <i>d<\/i> > <i>R<\/i> + <i>r<\/i>: кола не мають спільних точок, між плямами 10 см."}]}}]},{"id":"G4.6","name":"Задачі на побудову","what":"Будуємо циркулем і лінійкою.","subtopics":[{"id":"G4.6.1","name":"Трикутник за трьома сторонами","status":"ready","programmeRef":"побудова трикутника за трьома сторонами;","lesson":{"what":"<b>Задача на побудову<\/b> — побудувати фігуру лише циркулем і лінійкою без поділок. Лінійкою проводять пряму, циркулем — коло і відкладають відрізок даної довжини. Перша така задача — трикутник за трьома сторонами.","fig":{"caption":"Готова побудова трикутника за трьома сторонами: AB = c, коло з центром A радіуса b і коло з центром B радіуса a перетинаються в точці C.","view":[-4.4,-4.4,8.9,4.4],"points":{"A":[0,0],"B":[5,0],"C":[2.875,2.781]},"lp":{"A":"sw","B":"se","C":"n"},"items":[{"t":"circle","c":"A","r":4,"s":"faint"},{"t":"circle","c":"B","r":3.5,"s":"faint"},{"t":"poly","p":["A","B","C"],"s":"hl"},{"t":"label","at":[2.5,-0.5],"text":"c"},{"t":"label","at":[1.05,1.6],"text":"b"},{"t":"label","at":[4.3,1.6],"text":"a"}],"check":[{"len":[["A","B"],5]},{"len":[["A","C"],4]},{"len":[["B","C"],3.5]},{"onc":["C","A",4]},{"onc":["C","B",3.5]}]},"ideas":["Лінійкою можна лише провести пряму через дві точки — міряти поділками не можна. Циркулем можна провести коло з даним центром і радіусом, тобто «перенести» відрізок.","Розв'язати задачу на побудову — описати кроки побудови і пояснити, чому побудована фігура — саме та, що потрібна.","Третя вершина C має бути на відстані b від A і на відстані a від B. Тож вона лежить на двох колах одночасно — у їхній точці перетину.","Якщо одна сторона не менша за суму двох інших, кола не перетнуться (або лише дотикнуться на прямій) — трикутника не існує."],"rules":[{"f":"Побудова: AB = c; коло (A; b); коло (B; a); C — точка перетину кіл; △ABC — шуканий.","means":"Запис «коло (A; b)» означає коло з центром A і радіусом b."},{"f":"Трикутник, побудований за трьома сторонами, єдиний з точністю до рівності.","means":"Будь-які два трикутники з такими сторонами рівні за третьою ознакою рівності трикутників."}],"examples":[{"task":"Побудуйте трикутник ABC, у якого AB = 6 см, AC = 4 см, BC = 5 см.","fig":{"caption":"Пряма, на ній AB = 6 см; коло з центром A радіуса 4 см і коло з центром B радіуса 5 см перетинаються в точці C; трикутник ABC.","view":[-4.5,-5.5,11.5,5.5],"points":{"A":[0,0],"B":[6,0],"C":[2.25,3.307],"X":[-3,0]},"hide":["X"],"lp":{"A":"sw","B":"se","C":"n"},"items":[{"t":"line","p":["X","B"],"s":"faint","id":"ln"},{"t":"seg","p":["A","B"],"id":"ab"},{"t":"circle","c":"A","r":4,"s":"faint","id":"cA"},{"t":"circle","c":"B","r":5,"s":"faint","id":"cB"},{"t":"poly","p":["A","B","C"],"s":"hl","id":"tr"}],"check":[{"len":[["A","B"],6]},{"len":[["A","C"],4]},{"len":[["B","C"],5]},{"onc":["C","A",4]},{"onc":["C","B",5]}]},"steps":[{"do":"Проводимо пряму і позначаємо на ній точку A.","why":"Лінійкою проводимо пряму.","hl":["ln"]},{"do":"Розхиляємо циркуль на 6 см і з центром A робимо засічку на прямій — точку B. AB = 6 см.","why":"Циркулем відкладаємо відрізок даної довжини.","hl":["ab"]},{"do":"Проводимо коло з центром A радіуса 4 см.","why":"Вершина C має бути на відстані 4 см від A, тобто на цьому колі.","hl":["cA"]},{"do":"Проводимо коло з центром B радіуса 5 см. Точку перетину кіл позначаємо C.","why":"C має бути на відстані 5 см і від B — тобто на обох колах одночасно.","hl":["cB"]},{"do":"Сполучаємо C з A і B. Маємо AB = 6 см, AC = 4 см, BC = 5 см.","why":"Будь-який трикутник з такими сторонами дорівнює побудованому за трьома сторонами — третя ознака рівності.","hl":["tr"]}],"answer":"Відповідь: △ABC побудовано; друга точка перетину кіл (нижче прямої) дає рівний йому трикутник."},{"task":"Чи можна побудувати трикутник зі сторонами 2 см, 3 см і 6 см?","fig":{"caption":"Відрізок AB = 6 см; коло з центром A радіуса 2 см і коло з центром B радіуса 3 см не перетинаються.","view":[-2.6,-3.6,9.6,3.6],"points":{"A":[0,0],"B":[6,0]},"lp":{"A":"s","B":"s"},"items":[{"t":"seg","p":["A","B"],"s":"hl","id":"ab"},{"t":"circle","c":"A","r":2,"s":"dash","id":"cA"},{"t":"circle","c":"B","r":3,"s":"dash","id":"cB"}],"check":[{"len":[["A","B"],6]}]},"steps":[{"do":"Відкладаємо найбільшу сторону AB = 6 см.","why":"Решту вершин шукаємо з її кінців.","hl":["ab"]},{"do":"Проводимо коло з центром A радіуса 2 см і коло з центром B радіуса 3 см.","why":"Третя вершина має лежати на обох колах.","hl":["cA","cB"]},{"do":"2 + 3 = 5 < 6, тож кола не дістають одне одного і не перетинаються.","why":"Відстань між центрами більша за суму радіусів.","hl":["cA","cB"]},{"do":"Третьої вершини немає — трикутник побудувати не можна.","why":"Нерівність трикутника: кожна сторона менша за суму двох інших, а тут 6 > 2 + 3."}],"answer":"Відповідь: ні, такого трикутника не існує."},{"task":"Побудуйте рівнобедрений трикутник з основою 4 см і бічною стороною 5 см.","fig":{"caption":"Основа AB = 4 см; кола з центрами A і B однакового радіуса 5 см перетинаються в точці C; AC = BC = 5 см.","view":[-5.5,-5.6,9.5,5.6],"points":{"A":[0,0],"B":[4,0],"C":[2.0,4.583]},"lp":{"A":"sw","B":"se","C":"n"},"items":[{"t":"seg","p":["A","B"],"id":"ab"},{"t":"circle","c":"A","r":5,"s":"faint","id":"cA"},{"t":"circle","c":"B","r":5,"s":"faint","id":"cB"},{"t":"seg","p":["A","C"],"s":"hl","ticks":1,"id":"ac"},{"t":"seg","p":["B","C"],"s":"hl","ticks":1,"id":"bc"}],"check":[{"len":[["A","B"],4]},{"len":[["A","C"],5]},{"onc":["C","A",5]},{"onc":["C","B",5]}]},"steps":[{"do":"Відкладаємо основу AB = 4 см.","why":"Циркулем переносимо даний відрізок на пряму.","hl":["ab"]},{"do":"Не змінюючи розхилу циркуля (5 см), проводимо кола з центрами A і B.","why":"Обидві бічні сторони дорівнюють 5 см.","hl":["cA","cB"]},{"do":"Точку перетину кіл позначаємо C і проводимо AC і BC.","why":"C на відстані 5 см і від A, і від B.","hl":["ac","bc"]},{"do":"△ABC — шуканий: AB = 4 см, AC = BC = 5 см.","why":"Це та сама побудова за трьома сторонами, у якій дві сторони рівні.","hl":["ac","bc"]}],"answer":"Відповідь: △ABC побудовано (AC = BC = 5 см, AB = 4 см)."}],"mistakes":["Проводити коло з центром A радіусом a, а з центром B — радіусом b. Радіус кола з центром у вершині дорівнює стороні, що виходить з цієї вершини.","Міряти сторони поділками лінійки. У задачах на побудову відрізок переносять циркулем.","Не перевіряти, чи кола взагалі перетинаються. Якщо найбільша сторона не менша за суму двох інших, трикутника немає."],"check":[{"q":"Треба побудувати трикутник за трьома сторонами a, b, c. Який порядок дій правильний?","options":["Коло (A; b) → коло (B; a) → відкласти AB = c → сполучити точки","Відкласти AB = c → коло (A; b) → коло (B; a) → точку перетину C сполучити з A і B","Відкласти AB = c → коло (A; a) → коло (B; c) → сполучити точки"],"correct":1,"a":"Спершу відрізок AB = c, бо кола проводять з центрами в його кінцях. Потім коло (A; b) і коло (B; a), C — точка їхнього перетину."},{"q":"<b>Пастка.<\/b> Чи можна побудувати трикутник зі сторонами 3 см, 4 см і 7 см?","options":["Так, як і будь-який інший","Так, він буде прямокутним","Ні: кола лише дотикаються в точці на AB, і трикутника немає"],"correct":2,"a":"3 + 4 = 7: кола радіусів 3 і 4 з центрами на відстані 7 мають одну спільну точку на відрізку AB. Усі три «вершини» на одній прямій — трикутника немає."},{"q":"Тато робить трикутну полицю зі сторонами 30 см, 40 см і 50 см і вже відміряв на фанері сторону AB = 50 см. Вершину C шукає шнуром як циркулем. Якої довжини шнур закріпити в точці A, якщо AC = 30 см?","options":["30 см","40 см","50 см"],"correct":0,"a":"C лежить на колі з центром A радіуса AC = 30 см. Потім шнур 40 см з центром B — і точка перетину дасть C."}]}},{"id":"G4.6.2","name":"Кут, що дорівнює даному","status":"ready","programmeRef":"побудова кута, що дорівнює даному;","lesson":{"what":"Даний кут можна «скопіювати» циркулем і лінійкою — побудувати рівний йому кут від будь-якого променя. Для цього переносимо циркулем три відрізки, які утворюють трикутник з цим кутом.","fig":{"caption":"Ліворуч — даний кут A; коло з центром A перетинає його сторони в B і C. Праворуч — промінь OM, коло того ж радіуса з центром O перетинає OM у D, коло з центром D радіуса BC перетинає перше коло в E; ∠DOE = ∠A.","view":[-8.7,-3,7,3.6],"points":{"A":[-6,0],"B":[-3.5,0.0],"C":[-4.393,1.915],"P1":[-2,0],"P2":[-3.429,3.064],"O":[1,0],"M":[6,0],"D":[3.5,0.0],"E":[2.607,1.915]},"hide":["P1","P2"],"lp":{"A":"sw","B":"s","C":"nw","O":"sw","D":"s","E":"nw","M":"s"},"items":[{"t":"seg","p":["A","P1"]},{"t":"seg","p":["A","P2"]},{"t":"angle","p":["B","A","C"],"arcs":1},{"t":"circle","c":"A","r":2.5,"s":"faint","id":"c1"},{"t":"seg","p":["B","C"],"s":"dash","id":"bc"},{"t":"ray","p":["O","M"]},{"t":"circle","c":"O","r":2.5,"s":"faint","id":"c2"},{"t":"circle","c":"D","r":2.113,"s":"faint","id":"c3"},{"t":"seg","p":["D","E"],"s":"dash","id":"de"},{"t":"ray","p":["O","E"],"s":"hl","id":"oe"},{"t":"angle","p":["D","O","E"],"arcs":1,"s":"hl","id":"ang"}],"check":[{"eq":[["A","B"],["O","D"]]},{"eq":[["A","C"],["O","E"]]},{"eq":[["B","C"],["D","E"]]},{"onc":["E","O",2.5]},{"onc":["E","D",2.113]},{"col":["O","D","M"]},{"ang":[["D","O","E"],50]}]},"ideas":["Коло з центром у вершині кута відтинає на його сторонах рівні відрізки AB = AC. Відстань BC «запам'ятовує» розхил кута.","Тим самим радіусом проводимо коло з центром O, а потім відкладаємо хорду DE = BC. Отримуємо трикутник ODE зі сторонами, рівними сторонам △ABC.","Чому кути рівні: △ABC = △ODE за трьома сторонами, а в рівних трикутниках відповідні кути рівні.","Ця побудова — цеглинка для складніших: трикутник за двома сторонами і кутом між ними, кут удвічі більший за даний тощо."],"rules":[{"f":"Коло (A; r) → B, C; коло (O; r) → D; коло (D; BC) → E; промінь OE.","means":"Чотири кроки. Перші два кола — однакового радіуса; третє — радіуса BC."},{"f":"△ABC = △ODE за трьома сторонами, тому ∠DOE = ∠A.","means":"Пояснення, чому побудова правильна."}],"examples":[{"task":"Дано кут A і промінь OM. Побудуйте кут з вершиною O, однією стороною OM, що дорівнює куту A.","fig":{"caption":"Ліворуч — даний кут A; коло з центром A перетинає його сторони в B і C. Праворуч — промінь OM, коло того ж радіуса з центром O перетинає OM у D, коло з центром D радіуса BC перетинає перше коло в E; ∠DOE = ∠A.","view":[-8.7,-3,7,3.6],"points":{"A":[-6,0],"B":[-3.5,0.0],"C":[-4.393,1.915],"P1":[-2,0],"P2":[-3.429,3.064],"O":[1,0],"M":[6,0],"D":[3.5,0.0],"E":[2.607,1.915]},"hide":["P1","P2"],"lp":{"A":"sw","B":"s","C":"nw","O":"sw","D":"s","E":"nw","M":"s"},"items":[{"t":"seg","p":["A","P1"]},{"t":"seg","p":["A","P2"]},{"t":"angle","p":["B","A","C"],"arcs":1},{"t":"circle","c":"A","r":2.5,"s":"faint","id":"c1"},{"t":"seg","p":["B","C"],"s":"dash","id":"bc"},{"t":"ray","p":["O","M"]},{"t":"circle","c":"O","r":2.5,"s":"faint","id":"c2"},{"t":"circle","c":"D","r":2.113,"s":"faint","id":"c3"},{"t":" льшим за відстань від M до прямої; тоді MA = MB.","hl":["cM"]},{"do":"Проводимо кола з центрами A і B радіуса AM. Вони перетинаються в точці M і ще в точці N по інший бік від a.","why":"Тоді NA = NB = MA = MB.","hl":["cA","cB"]},{"do":"Проводимо пряму MN. Вона перетинає a в точці H.","why":"Лінійкою через дві точки.","hl":["mn"]},{"do":"Чому MN ⊥ a: △AMN = △BMN за трьома сторонами, тож ∠AMH = ∠BMH. У рівнобедреному △AMB бісектриса MH є й висотою.","why":"Третя ознака рівності трикутників і властивість рівнобедреного трикутника.","hl":["ma","mb","na","nb","rt"]}],"answer":"Відповідь: пряма MN перпендикулярна до a."},{"task":"Побудуйте кут 45° циркулем і лінійкою.","fig":{"caption":"Пряма a, точка M; побудовано перпендикуляр MP (кола з центрами M, A, B); у прямому куті BMP побудовано бісектрису ML (коло з центром M дає K, кола з центрами B і K дають L); ∠BML = 45°.","view":[-5.8,-3.9,5.8,4.4],"points":{"M":[0,0],"A":[-2,0],"B":[2,0],"P":[0.0,2.872],"K":[0,2],"L":[2.0,2.0],"X":[4,0]},"hide":["X"],"lp":{"M":"sw","A":"s","B":"s","P":"n","K":"w","L":"ne"},"items":[{"t":"line","p":["A","X"]},{"t":"circle","c":"M","r":2,"s":"faint","id":"cM"},{"t":"circle","c":"A","r":3.5,"s":"faint","id":"cA"},{"t":"circle","c":"B","r":3.5,"s":"faint","id":"cB"},{"t":"ray","p":["M","P"],"s":"hl2","id":"mp"},{"t":"right","p":["B","M","P"],"id":"rt"},{"t":"circle","c":"B","r":2,"s":"dash","id":"cB2"},{"t":"circle","c":"K","r":2,"s":"dash","id":"cK"},{"t":"ray","p":["M","L"],"s":"hl","id":"ml"},{"t":"angle","p":["B","M","L"],"label":"45°","s":"hl","id":"a45"}],"check":[{"onc":["P","A",3.5]},{"onc":["P","B",3.5]},{"onc":["K","M",2]},{"col":["M","K","P"]},{"onc":["L","B",2]},{"onc":["L","K",2]},{"perp":[["M","P"],["A","B"]]}]},"steps":[{"do":"Будуємо перпендикуляр MP до прямої a в точці M (як у прикладі 1).","why":"Побудова прямої, перпендикулярної до даної.","hl":["cM","cA","cB","mp"]},{"do":"∠BMP = 90°.","why":"MP ⊥ a.","hl":["rt"]},{"do":"Коло з центром M перетинає MP у точці K. Проводимо ко // Змінюй, коли змінюється сторінка або уроки, щоб репетитор знав, що опубліковану копію учня треба оновити.
const MAP_VERSION = "2026-10-14h";
const DATA = (typeof CONTENT !== "undefined" && CONTENT && Array.isArray(CONTENT.subjects)) ? CONTENT : { subjects: [] };

/* ---------- Покажчики ---------- */
const SUBJ = {}, SEC = {}, TOP = {}, SUB = {};
DATA.subjects.forEach((s, si) => {
  s.color = `var(--s${(si % 4) + 1})`;
  s.sections = Array.isArray(s.sections) ? s.sections : [];
  s.subs = [];
  SUBJ[s.id] = s;
  s.sections.forEach(sec => {
    sec.subject = s; SEC[sec.id] = sec; sec.subs = [];
    (sec.topics || []).forEach(t => {
      t.section = sec; t.subject = s; TOP[t.id] = t;
      t.subtopics = t.subtopics || [];
      t.subtopics.forEach(st => {
        st.topic = t; st.section = sec; st.subject = s; SUB[st.id] = st;
        st.ready = st.status === "ready" && !!st.lesson;
        st.checks = st.ready ? (st.lesson.check || []).map((c, i) => ({ id: `${st.id}-${i + 1}`, q: c.q, a: c.a,
          fig: c.fig || null, options: Array.isArray(c.options) ? c.options : null, correct: c.correct, accept: Array.isArray(c.accept) ? c.accept : null })) : [];
        st.examples = st.ready && Array.isArray(st.lesson.examples) ? st.lesson.examples : [];
        sec.subs.push(st); s.subs.push(st);
      });
    });
  });
});

/* ---------- Сховище ---------- */
const LS_PROGRESS = "school-map:progress", LS_UI = "school-map:ui";
function lsGet(k) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
const clone = o => JSON.parse(JSON.stringify(o == null ? {} : o));
const isObj = v => !!v && typeof v === "object" && !Array.isArray(v);
function deepMerge(into, patch) {
  Object.keys(patch || {}).forEach(k => { if (isObj(patch[k])) into[k] = deepMerge(isObj(into[k]) ? into[k] : {}, patch[k]); else into[k] = patch[k]; });
  return into;
}
function normProgress(d) { d = isObj(d) ? d : {}; return { read: isObj(d.read) ? d.read : {}, checks: isObj(d.checks) ? d.checks : {}, updatedAt: d.updatedAt || null }; }

let progress = normProgress(lsGet(LS_PROGRESS));
let practice = {};                   // learner/practice → subtopics
let plan = { name: "", current: null, next: [] }; // learner/plan
let db = null, dbState = "local";    // local | live | readonly
let remoteExists = false, remoteBase = null;
let pending = null, inflight = null, writing = false;

/* Запис лише після дії учня, по одному за раз: зміни, що прийшли під час запису, чекають і йдуть одним наступним записом. */
function record(patch) {
  const now = new Date().toISOString();
  deepMerge(progress, patch);
  progress.updatedAt = now;
  lsSet(LS_PROGRESS, progress);
  if (!db || dbState !== "live") return;
  pending = deepMerge(pending || {}, patch);
  pump();
}
async function pump() {
  if (writing || !pending || !db) return;
  writing = true; inflight = pending; pending = null;
  const stamp = { updatedAt: new Date().toISOString(), mapVersion: MAP_VERSION };
  const ref = db.doc("learner/progress");
  const whole = () => ref.set(Object.assign(clone({ read: progress.read, checks: progress.checks }), stamp));
  try {
    if (!remoteExists) { await whole(); remoteExists = true; }
    else {
      try { await ref.update(Object.assign(clone(inflight), stamp)); }
      catch (e) {
        if (e && e.code === "invalid_argument") { await whole(); remoteExists = true; } // документ могли видалити
        else if (e && e.code === "unavailable") { await new Promise(r => setTimeout(r, 600 + Math.random() * 900)); await ref.update(Object.assign(clone(inflight), stamp)); }
        else throw e;
      }
    }
  } catch (e) {
    if (e && (e.code === "invalid_argument" || e.code === "revoked" || e.code === "not_granted")) { dbState = "readonly"; pending = null; paintStatus(); }
  } finally {
    inflight = null; writing = false;
    if (pending) pump();
  }
}
function applyRemoteProgress(d) {
  remoteBase = normProgress(clone(d));
  const merged = normProgress(clone(remoteBase));
  if (inflight) deepMerge(merged, inflight);
  if (pending) deepMerge(merged, pending);
  const changed = JSON.stringify([merged.read, merged.checks]) !== JSON.stringify([progress.read, progress.checks]);
  progress = merged;
  lsSet(LS_PROGRESS, progress);
  return changed;
}

/* ---------- Підрахунки ---------- */
function practiceOf(id) { const p = practice[id]; return p && +p.answered > 0 ? { answered: +p.answered, correct: +p.correct || 0, last: p.last || "" } : null; }
function isMastered(p) { return !!p && p.answered >= 3 && p.correct / p.answered >= 0.8; }
function checkCount(st) { const know = st.checks.filter(c => progress.checks[c.id] === "know").length; return { know, total: st.checks.length }; }
function statusOf(st) {
  if (!st.ready) return "planned";
  if (isMastered(practiceOf(st.id))) return "mastered";
  const c = checkCount(st);
  if (c.total && c.know === c.total) return "checked";
  if (progress.read[st.id]) return "read";
  return "new";
}
const STATUS = {
  planned: ["урок готується", "st-planned"],
  mastered: ["опановано на практиці", "st-mastered"],
  checked: ["самоперевірка пройдена", "st-checked"],
  read: ["прочитано", "st-read"],
  new: ["ще не відкрито", "st-new"]
};
// Бал підтеми: прочитано, самоперевірка, практика — по третині; «опановано» = 100 %.
function scoreOf(st) {
  const p = practiceOf(st.id);
  if (isMastered(p)) return 1;
  const c = checkCount(st);
  const prac = p ? Math.min(1, p.answered / 3) * Math.min(1, (p.correct / p.answered) / 0.8) : 0;
  return ((progress.read[st.id] ? 1 : 0) + (c.total ? c.know / c.total : 0) + prac) / 3;
}
function agg(subs) {
  const ready = subs.filter(s => s.ready);
  const pct = ready.length ? Math.round(ready.reduce((a, s) => a + scoreOf(s), 0) / ready.length * 100) : null;
  return { all: subs.length, ready: ready.length, pct,
    read: ready.filter(s => progress.read[s.id]).length,
    mastered: ready.filter(s => isMastered(practiceOf(s.id))).length };
}
const topicSubs = t => t.subtopics;

/* ---------- Допоміжне ---------- */
function esc(s) { return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
// У текстах уроків дозволено лише <b>, <i>, <sub>, <sup>; усе інше екранується.
function rich(s) { return esc(s).replace(/&lt;(\/?)(b|i|sub|sup)&gt;/g, "<$1$2>"); }

  if (!iso) return "";
  const d = new Date(String(iso).length === 10 ? iso + "T12:00:00" : iso);
  if (isNaN(d)) return String(iso);
  try { return d.toLocaleDateString("uk-UA", { day: "numeric", month: "long", year: "numeric" }).replace(/\s*р\.$/, ""); } catch (e) { return String(iso).slice(0, 10); }
}
function ring(pct, size, color, big) {
  const sw = big ? 7 : 6, r = (size - sw) / 2, c = 2 * Math.PI * r, cx = size / 2;
  const v = pct == null ? 0 : Math.max(0, Math.min(100, pct));
  return `<svg class="ring${big ? " big" : ""}" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true" style="--ring-c:${color}">`
    + `<circle class="trk" cx="${cx}" cy="${cx}" r="${r}" stroke-width="${sw}"/>`
    + (v > 0 ? `<circle class="val" cx="${cx}" cy="${cx}" r="${r}" stroke-width="${sw}" stroke-dasharray="${(c * v / 100).toFixed(2)} ${c.toFixed(2)}" transform="rotate(-90 ${cx} ${cx})"/>` : "")
    + `<text x="${cx}" y="${cx}">${pct == null ? "—" : pct + "%"}</text></svg>`;
}

/* ---------- Малюнки (fig): опис фігури → SVG. Формат — study-map/FIGURES.md ----------
   Математичні координати (y вгору) переводимо в пікселі самі, тож товщина ліній не залежить від `view`.
   Зламаний малюнок не малюємо (console.warn), сторінка працює далі. */
const FIG = { maxW: 300, maxH: 300, pad: 26, dot: 3.5, tick: 12, tickGap: 5, right: 12, arcGap: 5 };
let figSeq = 0;
const SUBS = "₀₁₂₃₄₅₆₇₈₉";
function figName(n) { const m = String(n).match(/^(.*?\D)(\d+)$/); return m ? m[1] + m[2].replace(/\d/g, d => SUBS[+d]) : String(n); }
function figNum(v) { const r = Math.round(v * 1000) / 1000; return (r < 0 ? "−" : "") + String(Math.abs(r)).replace(".", ","); }
const fin = v => typeof v === "number" && isFinite(v);
const LP = { n: [0, -1], ne: [.75, -.75], e: [1, 0], se: [.75, .75], s: [0, 1], sw: [-.75, .75], w: [-1, 0], nw: [-.75, -.75] };
function figStyle(s) {
  const t = String(s || "").split(/\s+/).filter(Boolean);
  return { cls: t.map(x => "s-" + x).join(" "), hl: t.includes("hl"), hl2: t.includes("hl2"), tokens: t };
}
// Відрізок, обрізаний прямокутником (Liang–Barsky). t0, t1 — межі параметра; повертає [x0, y0, x1, y1] або null.

  const p = [-dx, dx, -dy, dy], q = [x0 - v[0], v[2] - x0, y0 - v[1], v[3] - y0];
  for (let i = 0; i < 4; i++) {
    if (Math.abs(p[i]) < 1e-12) { if (q[i] < 0) return null; continue; }
    const r = q[i] / p[i];
    if (p[i] < 0) { if (r > t1) return null; if (r > t0) t0 = r; }
    else { if (r < t0) return null; if (r < t1) t1 = r; }
  }
  return [x0 + t0 * dx, y0 + t0 * dy, x0 + t1 * dx, y0 + t1 * dy];
}
function renderFig(fig, hl) {
  try { return buildFig(fig, hl || []); }
  catch (e) { try { console.warn("Малюнок не намальовано:", e && e.message, fig && fig.caption); } catch (_) {} return ""; }
}
function buildFig(fig, hl) {
  if (!isObj(fig)) throw new Error("fig не об'єкт");
  const v = fig.view;
  if (!Array.isArray(v) || v.length !== 4 || !v.every(fin) || v[0] >= v[2] || v[1] >= v[3]) throw new Error("погане view");
  const P = {};
  Object.keys(fig.points || {}).forEach(k => { const p = fig.points[k]; if (!Array.isArray(p) || p.length !== 2 || !fin(p[0]) || !fin(p[1])) throw new Error("погана точка " + k); P[k] = p; });
  const pt = n => { if (Array.isArray(n) && n.length === 2 && fin(n[0]) && fin(n[1])) return n; if (!P[n]) throw new Error("немає точки " + n); return P[n]; };
  const dx = v[2] - v[0], dy = v[3] - v[1];
  const sc = Math.min(FIG.maxW / dx, FIG.maxH / dy), pad = FIG.pad;
  const W = dx * sc + 2 * pad, H = dy * sc + 2 * pad;
  const X = x => pad + (x - v[0]) * sc, Y = y => pad + (v[3] - y) * sc;
  const f = n => Math.round(n * 10) / 10;
  const id = "fg" + (++figSeq);
  const back = [], body = [], top = [], front = [];
  const hlSet = new Set(hl);
  // Радіус дуги: біля спільної вершини менший кут — ближче до вершини (як у зразку).
  const angRank = {};
  (fig.items || []).forEach((it, i) => {
    if (!isObj(it) || it.t !== "angle" || !Array.isArray(it.p) || it.p.length !== 3 || !P[it.p[0]] || !P[it.p[1]] || !P[it.p[2]]) return;
    const [A, O, B] = it.p.map(n => P[n]), tA = Math.atan2(A[1] - O[1], A[0] - O[0]), tB = Math.atan2(B[1] - O[1], B[0] - O[0]);
    let a = tB - tA; while (a <= -Math.PI) a += 2 * Math.PI; while (a > Math.PI) a -= 2 * Math.PI;
    if (Math.abs(Math.abs(a) - Math.PI) < 1e-9) a = Math.PI; // розгорнутий — проти годинникової від OA
    const s = a >= 0 ? tA : tB, d = Math.abs(a);
    (angRank[it.p[1]] = angRank[it.p[1]] || []).push([d, i, s]);
  });
  // Дуга відходить далі від вершини лише тоді, коли всередині цього кута лежить менший кут
  // (вкладені кути). Сусідні кути, що не перекриваються (напр. чотири кути при перетині прямих), — однаковий радіус.

  const inside = (inner, outer) => { const off = norm(inner[2] - outer[2]); return off <= outer[0] + 1e-6 && off + inner[0] <= outer[0] + 1e-6; };

    let k = 0;
    list.forEach(y => { if (y !== x && (y[0] < x[0] - 1e-6 || (Math.abs(y[0] - x[0]) <= 1e-6 && y[1] < x[1])) && inside(y, x)) k++; });

  const segs = [], boxes = [], later = [];

  // opt.inside — прямокутник [x0, y0, x1, y1], у якому підпис має бути повністю (для fn/vline — видима область view); тоді без зсуву.

  }

  if (isObj(fig.axes)) {

    const yAx = v[0] <= 0 && 0 <= v[2], xAx = v[1] <= 0 && 0 <= v[3];

        out.push(`<circle class="stk" cx="${f(X(c[0]))}" cy="${f(Y(c[1]))}" r="${f(r * sc)}" clip-path="url(#${id}-c)"/>`);

        let d = a2 - a1; while (d <= -Math.PI) d += 2 * Math.PI; while (d > Math.PI) d -= 2 * Math.PI;
        if (Math.abs(Math.abs(d) - Math.PI) < 1e-6) d = Math.PI; // розгорнутий — проти годинникової від OA до OB
        const k = (rankOf[idx] || 0) + 1;
        const lenA = Math.hypot(A[0] - O[0], A[1] - O[1]) * sc, lenB = Math.hypot(B[0] - O[0], B[1] - O[1]) * sc;
        if (!(lenA > 0 && lenB > 0)) throw new Error("angle: нульовий промінь");
        const arcs = Math.max(1, Math.min(3, Math.round(+it.arcs || 1)));
        let r = fin(it.r) && it.r > 0 ? it.r : Math.max(16, Math.min(28 + (k - 1) * 12, 0.45 * Math.min(lenA, lenB)));
        const cx = X(O[0]), cy = Y(O[1]);
        const at = (th, rr) => [cx + rr * Math.cos(th), cy - rr * Math.sin(th)];
        let path = "";
        for (let i = 0; i < arcs; i++) {
          const rr = r + i * FIG.arcGap, m = a1 + d / 2, s0 = at(a1, rr), s1 = at(m, rr), s2 = at(a1 + d, rr), sw = d > 0 ? 0 : 1;
          path += `M${f(s0[0])} ${f(s0[1])}A${f(rr)} ${f(rr)} 0 0 ${sw} ${f(s1[0])} ${f(s1[1])}A${f(rr)} ${f(rr)} 0 0 ${sw} ${f(s2[0])} ${f(s2[1])}`;

          const m = a1 + d / 2, ux = Math.cos(m), uy = -Math.sin(m), txt = String(it.label);
          const outer = r + (arcs - 1) * FIG.arcGap, tw = textW(txt, 14), dist = outer + 6 + Math.abs(ux) * tw / 2 + Math.abs(uy) * 8;

          out.push(`<path class="stk" d="M${f(xx)} ${f(Y(v[1]))}V${f(Y(v[3]))}"/>`);
          if (it.label) {

            [10, 18].forEach(off => [0.8, 0.65, 0.5, 0.35, 0.2].forEach(t => { const yy = Y(v[1]) + (Y(v[3]) - Y(v[1])) * t; cands.push({ x: xx + off, y: yy, ux: 1, uy: 0 }, { x: xx - off, y: yy, ux: -1, uy: 0 }); }));

    + back.join("") + body.map(x => x.join("")).join("") + top.join("") + front.join("")
