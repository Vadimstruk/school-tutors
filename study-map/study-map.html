>Хлопчик біг, не зважаючи на калюжі<\/i>."],"rules":[{"f":"з (із) + прийменник → дефіс: з-під, з-за, з-поміж","means":"Якщо складний прийменник починається з <i>з<\/i> (<i>із<\/i>), ставимо дефіс: <i>вибіг з-за рогу, виглянув з-під ковдри<\/i>."},{"f":"інші складні → разом: понад, поміж, навколо, заради","means":"<i>Понад річкою, поміж деревами, заради друзів<\/i>."},{"f":"складені → окремо: під час, відповідно до, незважаючи на","means":"Кілька слів працюють як один прийменник, але кожне пишемо окремо: <i>під час гри, відповідно до правил<\/i>."}],"examples":[{"task":"Як написати: <i>(з)(під) снігу<\/i>?","steps":[{"do":"Це складний прийменник із двох частин: <i>з<\/i> і <i>під<\/i>","why":"Він означає «звідки»: з-під чогось."},{"do":"Перша частина — <i>з<\/i>, тому ставимо дефіс","why":"Складні прийменники з першою частиною <i>з<\/i> (<i>із<\/i>) пишемо через дефіс."}],"answer":"<i>з-під снігу<\/i>: <i>З-під снігу вже виглядають проліски.<\/i>"},{"task":"Разом, окремо чи з дефісом: <i>(по)серед двору, (під)(час) гри, (з)(поміж) учнів<\/i>?","steps":[{"do":"<i>посеред двору<\/i> — разом","why":"Складний прийменник, першої частини <i>з<\/i> немає."},{"do":"<i>під час гри<\/i> — окремо","why":"Складений прийменник: два окремі слова."},{"do":"<i>з-поміж учнів<\/i> — через дефіс","why":"Складний прийменник з першою частиною <i>з<\/i>."}],"answer":"<i>посеред двору, під час гри, з-поміж учнів<\/i>."},{"task":"Виправ помилки: <i>Не зважаючи на мороз, у парку було людно, а з за паркану визирав пес Сірко.<\/i>","steps":[{"do":"<i>Не зважаючи на мороз<\/i> → <i>Незважаючи на мороз<\/i>","why":"Тут немає людини, яка «не зважає»; слово можна замінити на <i>попри<\/i>: <i>попри мороз<\/i>. Це прийменник, його першу частину пишемо разом."},{"do":"<i>з за паркану<\/i> → <i>з-за паркану<\/i>","why":"Складний прийменник із першою частиною <i>з<\/i> — через дефіс."},{"do":"<i>у парку<\/i> — правильно","why":"Простий прийменник пишемо окремо від іменника."}],"answer":"<i>Незважаючи на мороз, у парку було людно, а з-за паркану визирав пес Сірко.<\/i>"}],"mistakes":["<i>з під столу<\/i>, <i>зпід столу<\/i> → <i>з-під столу<\/i>: складний прийменник із першою частиною <i>з<\/i> пишемо через дефіс.","<i>по між деревами<\/i> → <i>поміж деревами<\/i>: складний прийменник без <i>з<\/i> на початку пишемо разом.","<i>під-час уроку<\/i>, <i>підчас уроку<\/i> → <i>під час уроку<\/i>: складений прийменник пишемо окремо."],"check":[{"q":"Напиши правильно лише прийменник: <i>(з)(за) хмари<\/i>.","accept":["з-за"],"a":"<i>з-за<\/i> — складний прийменник з першою частиною <i>з<\/i>, тому пишемо через дефіс: <i>з-за хмари<\/i>."},{"q":"Пастка: де написано правильно?","options":["Не зважаючи на дощ, футбольний матч відбувся.","Незважаючи на дощ, футбольний матч відбувся."],"correct":1,"a":"Матч не може «не звертати уваги», тут <i>незважаючи на<\/i> — прийменник (= <i>попри дощ<\/i>), першу частину пишемо разом. Окремо <i>не зважаючи<\/i> — лише дієприслівник: <i>Хлопчик біг, не зважаючи на калюжі<\/i>."},{"q":"Табличка біля шкільної їдальні. Де все написано правильно?","options":["Обід — підчас великої перерви.","Обід — під-час великої перерви.","Обід — під час великої перерви."],"correct":2,"a":"<i>Під час<\/i> — складений прийменник, обидва слова пишемо окремо, без дефіса."}]}},{"id":"U6.1.3","name":"Уживання прийменників","status":"ready","programmeRef":"Особливості вживання окремих прийменників","lesson":{"what":"Деякі прийменники легко вжити неправильно. Найчастіше помиляються з <b>по<\/b>, з вибором <b>у / в<\/b> та <b>з / із / зі<\/b>. А ще прийменники бувають <b>синонімічні<\/b> — близькі за значенням, як <i>біля<\/i> і <i>поблизу<\/i>.","ideas":["Прийменник <i>по<\/i> доречний, коли йдеться про рух поверхнею чи простором (<i>ходити по кімнаті<\/i>), про дію, що повторюється в часі (<i>по середах<\/i>), про розподіл (<i>дали по дві цукерки<\/i>), про межу (<i>вода по коліна<\/i>), у значенні «після» (<i>по закінченні уроків<\/i>) і в сполуці <i>по черзі<\/i>.","У багатьох сполуках замість <i>по<\/i> треба інший прийменник: <i>контрольна <b>з<\/b> математики, змагання <b>з<\/b> футболу, урок <b>з<\/b> історії<\/i>; <i><b>за<\/b> бажанням, <b>за<\/b> правилами, <b>за<\/b> розкладом<\/i>; <i>сумую <b>за<\/b> тобою<\/i>; <i>пропустив <b>через<\/b> хворобу<\/i>.","<b>У<\/b> пишемо між приголосними (<i>Тарас <b>у<\/b> школі<\/i>), на початку речення перед приголосним (<i><b>У<\/b> лісі тихо<\/i>), а також перед <i>в, ф<\/i> і сполученнями <i>льв, св, тв, хв<\/i> (<i>були <b>у<\/b> Львові, прийшла <b>у<\/b> вівторок<\/i>). <b>В<\/b> пишемо між голосними (<i>Оля <b>в<\/b> автобусі<\/i>) і після голосного перед більшістю приголосних (<i>сестра <b>в<\/b> школі<\/i>). Так мовлення звучить милозвучно, без збігу звуків.","<b>З<\/b> пишемо між голосними та після голосного перед більшістю приголосних (<i>пішла <b>з<\/b> мамою<\/i>); <b>із<\/b> — між приголосними, особливо свистячими й шиплячими (<i>брат <b>із<\/b> сестрою<\/i>); <b>зі<\/b> — перед збігом приголосних, найчастіше з першими <i>з, с, ш, щ<\/i> (<i><b>зі<\/b> школи, <b>зі<\/b> сміхом, <b>зі<\/b> мною<\/i>). Рідше трапляється варіант <i>зо<\/i> (<i>зо мною<\/i>).","<b>Синонімічні прийменники<\/b> близькі за значенням: <i>біля — коло — поблизу<\/i> (будинку). Але <i>завдяки<\/i> вживаємо лише тоді, коли причина добра (<i>перемогли завдяки підтримці друзів<\/i>), а <i>через<\/i> — коли погана (<i>матч перенесли через дощ<\/i>)."],"rules":[{"f":"з + назва предмета чи виду спорту: контрольна з математики, змагання з футболу","means":"Назву навчального предмета, виду спорту ставимо після <i>з<\/i> у родовому відмінку, а не після <i>по<\/i>."},{"f":"у — між приголосними; в — між голосними","means":"<i>Тарас у школі<\/i>, але <i>Оля в автобусі<\/i>."},{"f":"з / із / зі","means":"<i>пішла з мамою<\/i>, <i>брат із сестрою<\/i>, <i>повернувся зі школи<\/i>."}],"examples":[{"task":"Відредагуй речення: <i>Завтра контрольна по математиці.<\/i>","steps":[{"do":"Знаходимо сполуку з <i>по<\/i>: <i>по математиці<\/i>","why":"Це назва навчального предмета."},{"do":"Замінюємо на <i>з<\/i> + родовий відмінок: <i>з математики<\/i>","why":"Так рекомендують підручники: <i>контрольна з математики, урок з історії<\/i>."}],"answer":"<i>Завтра контрольна з математики.<\/i>"},{"task":"Вибери <i>у<\/i> чи <i>в<\/i>: 1) <i>Тарас (у/в) школі.<\/i> 2) <i>Оля (у/в) автобусі.<\/i> 3) <i>Ми були (у/в) Львові.<\/i>","steps":[{"do":"1) <i>Тарас у школі<\/i>","why":"Між приголосними <i>с<\/i> і <i>ш<\/i> пишемо <i>у<\/i>."},{"do":"2) <i>Оля в автобусі<\/i>","why":"Слово <i>Оля<\/i> закінчується на голосний, <i>автобусі<\/i> починається з голосного: між голосними — <i>в<\/i>."},{"do":"3) <i>Ми були у Львові<\/i>","why":"Перед сполученням <i>льв<\/i> пишемо <i>у<\/i>, навіть після голосного."}],"answer":"1) у; 2) в; 3) у."},{"task":"Вибери <i>з<\/i>, <i>із<\/i> чи <i>зі<\/i>: <i>Максим повернувся (…) школи (…) другом.<\/i>","steps":[{"do":"<i>зі школи<\/i>","why":"Перед збігом приголосних <i>шк<\/i> пишемо <i>зі<\/i>."},{"do":"<i>(школи) з другом<\/i>","why":"Після голосного <i>и<\/i> перед приголосним <i>д<\/i> пишемо <i>з<\/i>."}],"answer":"<i>Максим повернувся зі школи з другом.<\/i>"}],"mistakes":["<i>по бажанню<\/i> → <i>за бажанням<\/i>; <i>по розкладу<\/i> → <i>за розкладом<\/i>; <i>по причині хвороби<\/i> → <i>через хворобу<\/i>.","<i>сумую по тобі<\/i> → <i>сумую за тобою<\/i>: з дієсловом <i>сумувати<\/i> вживаємо <i>за<\/i> + орудний відмінок.","<i>Завдяки дощу матч перенесли<\/i> → <i>Через дощ матч перенесли<\/i>: <i>завдяки<\/i> вживаємо лише для доброї причини."],"check":[{"q":"Заміни неправильний прийменник і напиши сполуку: <i>змагання по футболу<\/i>.","accept":["змагання з футболу","з футболу"],"a":"Правильно: <i>змагання з футболу<\/i>. Назву виду спорту вживаємо з прийменником <i>з<\/i>, а не <i>по<\/i>."},{"q":"Пастка: де прийменник <i>по<\/i> вжито правильно?","options":["урок по історії","змагання по шахах","по моєму бажанню","по середах у нас басейн"],"correct":3,"a":"<i>По середах<\/i> — дія повторюється в часі, тут <i>по<\/i> доречне. Решту треба виправити: <i>урок з історії<\/i>, <i>змагання з шахів<\/i>, <i>за моїм бажанням<\/i>."},{"q":"Повідомлення другові. Яке написано правильно?","options":["Я вже у автобусі, буду за 10 хвилин.","Я вже в автобусі, буду за 10 хвилин."],"correct":1,"a":"<i>вже в автобусі<\/i>: слово <i>вже<\/i> закінчується на голосний, <i>автобусі<\/i> починається з голосного — між голосними пишемо <i>в<\/i>."}]}}]},{"id":"U6.2","name":"Сполучник","what":"Слова, що з'єднують слова і речення: «і», «але», «щоб».","subtopics":[{"id":"U6.2.1","name":"Сполучник: види за будовою","status":"ready","programmeRef":"Сполучник як службова частина мови. Види сполучників за будовою.","lesson":{"what":"<b>Сполучник<\/b> — службова частина мови, яка з’єднує однорідні члени речення або частини складного речення: <i>Оля <b>і<\/b> Петро<\/i>; <i>Я прийду, <b>якщо<\/b> встигну<\/i>. Сполучник не змінюється і не є членом речення.","ideas":["За будовою сполучники бувають <b>прості<\/b> — з однієї частини: <i>і, а, але, бо, що, чи<\/i>; <b>складні<\/b> — злиті з кількох слів в одне: <i>проте, зате, якщо, тобто, неначе<\/i>; <b>складені<\/b> — з кількох окремих слів: <i>тому що, через те що, для того щоб, незважаючи на те що<\/i>.","За вживанням сполучники бувають <b>одиничні<\/b> — трапляються один раз: <i>Сонце світить, <b>але<\/b> холодно<\/i>; <b>повторювані<\/b> — те саме слово стоїть перед кожним однорідним членом: <i>і… і, ні… ні, або… або, то… то, чи… чи<\/i>; <b>парні<\/b> — з двох різних частин у різних місцях речення: <i>не тільки… а й, як… так і, хоч… але, якщо… то<\/i>.","Перед другою частиною повторюваного чи парного сполучника ставимо кому: <i>І тато, і мама прийшли на концерт.<\/i> <i>Я люблю не тільки футбол, а й баскетбол.<\/i>","Сполучник — не прийменник: прийменник пов’язує іменник з іншим словом і вимагає певного відмінка (<i>до школи<\/i>), а сполучник лише з’єднує рівні частини й відмінка не змінює (<i>школа і стадіон<\/i>)."],"rules":[{"f":"прості: і, а, але · складні: проте, якщо · складені: тому що, для того щоб","means":"Простий — одна частина; складний — одне слово з кількох частин; складений — кілька окремих слів."},{"f":"одиничні: але · повторювані: ні… ні · парні: не тільки… а й","means":"Повторюваний — те саме слово кілька разів, парний — дві різні частини. Перед другою частиною — кома."}],"examples":[{"task":"Знайди сполучники й визнач їхній вид за будовою: <i>Ми залишилися вдома, бо йшов дощ, проте не нудьгували.<\/i>","steps":[{"do":"<i>бо<\/i> — простий","why":"Складається з однієї частини."},{"do":"<i>проте<\/i> — складний","why":"Злитий з двох слів (<i>про<\/i> + <i>те<\/i>) в одне, пишемо разом."}],"answer":"<i>бо<\/i> — простий сполучник, <i>проте<\/i> — складний."},{"task":"Одиничний, повторюваний чи парний сполучник? <i>На змаганнях ми бачили як лижників, так і біатлоністів.<\/i>","steps":[{"do":"Сполучник має дві різні частини: <i>як<\/i> і <i>так і<\/i>","why":"Вони стоять у різних місцях — перед кожним однорідним членом."},{"do":"Це парний сполучник","why":"Дві різні частини працюють разом."},{"do":"Перед <i>так і<\/i> — кома","why":"Кому ставимо перед другою частиною парного сполучника."}],"answer":"Парний сполучник <i>як…, так і<\/i>."},{"task":"Виправ помилку: <i>Улюблену пісню співали як діти, і дорослі.<\/i>","steps":[{"do":"Бачимо першу частину парного сполучника <i>як<\/i>","why":"Парний сполучник <i>як… так і<\/i> має дві сталі частини."},{"do":"Друга частина неповна: замість <i>і<\/i> треба <i>так і<\/i>","why":"Частини парного сполучника не можна скорочувати чи замінювати іншими."}],"answer":"<i>Улюблену пісню співали як діти, так і дорослі.<\/i>"}],"mistakes":["<i>не тільки в класі, але також і на перерві<\/i> → <i>не тільки в класі, а й на перерві<\/i>: у парному сполучнику дві сталі частини, зайвих слів не додаємо.","<i>Ні Остап ні Марко не запізнилися<\/i> → <i>Ні Остап, ні Марко не запізнилися<\/i>: перед другим <i>ні<\/i> повторюваного сполучника ставимо кому.","Плутають складний і складений сполучник: <i>проте<\/i> — одне слово (складний), <i>тому що<\/i> — два слова (складений)."],"check":[{"q":"Який сполучник складений?","options":["зате","через те що","або","тобто"],"correct":1,"a":"<i>Через те що<\/i> — складений: три окремі слова. <i>Зате<\/i> і <i>тобто<\/i> — складні (одне слово), <i>або<\/i> — простий."},{"q":"Пастка: у реченні <i>Ні дощ, ні вітер не завадили грі.<\/i> сполучник…","options":["повторюваний","одиничний","парний"],"correct":0,"a":"Повторюваний: те саме <i>ні<\/i> стоїть перед кожним однорідним членом. Парний сполучник складається з <b>різних<\/b> частин (<i>не тільки… а й<\/i>)."},{"q":"Повідомлення в класному чаті. Де все правильно?","options":["Беріть як ручки так і олівці.","Беріть як ручки, і олівці.","Беріть як ручки, так і олівці."],"correct":2,"a":"Парний сполучник <i>як… так і<\/i>: обидві частини на місці, а перед <i>так і<\/i> стоїть кома."}]}},{"id":"U6.2.2","name":"Сполучники сурядності та підрядності","status":"ready","programmeRef":"Сполучники сурядності та підрядності.","lesson":{"what":"<b>Сполучники сурядності<\/b> з’єднують рівноправні частини: однорідні члени речення або частини складносурядного речення. <b>Сполучники підрядності<\/b> з’єднують частини складнопідрядного речення, де одна частина залежить від іншої: від головної частини до підрядної можна поставити питання.","ideas":["Сполучники сурядності бувають <b>єднальні<\/b>: <i>і (й), та<\/i> (= і), <i>ні… ні<\/i>; <b>протиставні<\/b>: <i>а, але, та<\/i> (= але), <i>проте, зате, однак<\/i>; <b>розділові<\/b>: <i>або, чи, то… то, не то… не то<\/i>.","Сполучники підрядності: <i>що, щоб, бо, тому що, якщо, коли, хоч (хоча), ніби, наче<\/i>. Вони показують, як пов’язані частини: причина (<i>бо, тому що<\/i>), мета (<i>щоб<\/i>), умова (<i>якщо<\/i>), час (<i>коли<\/i>), порівняння (<i>ніби, наче<\/i>).","Сполучниками підрядності не можна поєднувати однорідні члени: однорідні члени рівноправні, а підрядний сполучник завжди показує залежність. Кажемо <i>Оля <b>і<\/b> Марко<\/i>, <i>малий, <b>але<\/b> сміливий<\/i>.","<b>Синонімічні сполучники<\/b> можна замінити один одним, зміст не зміниться: <i>але — проте — однак<\/i>; <i>бо — тому що — через те що<\/i>; <i>щоб — для того щоб<\/i>.","Між однорідними членами перед <i>а, але, проте, зате<\/i> ставимо кому, а перед одиничними <i>і, й, та<\/i> (= і), <i>або, чи<\/i> — ні: <i>малий, але сміливий<\/i>; <i>малий і сміливий<\/i>."],"rules":[{"f":"сурядні: і, та, а, але, або, чи · підрядні: що, щоб, бо, якщо, коли","means":"Перевірка: якщо від однієї частини до іншої можна поставити питання (<i>чому? з якою метою? за якої умови? коли?<\/i>), сполучник підрядний. Якщо частини рівноправні — сурядний."}],"examples":[{"task":"Сурядний чи підрядний сполучник? <i>Надворі мороз, але сонце гріє.<\/i>","steps":[{"do":"Пробуємо поставити питання від однієї частини до іншої — не виходить","why":"Обидві частини рівноправні, кожна має свою граматичну основу."},{"do":"<i>але<\/i> — сурядний протиставний","why":"Він протиставляє: мороз — а сонце все одно гріє."}],"answer":"<i>але<\/i> — сполучник сурядності (протиставний)."},{"task":"Визнач сполучник і його вид: <i>Мама розбудила мене раніше, щоб я не запізнився на потяг.<\/i>","steps":[{"do":"Ставимо питання: розбудила раніше <i>з якою метою?<\/i> — щоб я не запізнився","why":"Друга частина залежить від першої й пояснює її."},{"do":"<i>щоб<\/i> — сполучник підрядності","why":"Він приєднує залежну частину й виражає мету."}],"answer":"<i>щоб<\/i> — підрядний сполучник мети."},{"task":"Заміни сполучник синонімічним: <i>Матч перенесли, бо поле було мокре.<\/i>","steps":[{"do":"<i>бо<\/i> — підрядний сполучник причини","why":"Питання: перенесли <i>чому?<\/i>"},{"do":"Синоніми: <i>тому що<\/i>, <i>через те що<\/i>","why":"Вони теж виражають причину й не змінюють змісту."},{"do":"Кома стоїть перед усім складеним сполучником","why":"Ним починається підрядна частина: <i>…, тому що поле було мокре<\/i>."}],"answer":"<i>Матч перенесли, тому що поле було мокре<\/i> (або <i>через те що поле було мокре<\/i>)."}],"mistakes":["Вважають <i>і<\/i> між частинами складного речення підрядним: <i>Задзвонив дзвоник, і діти вибігли на подвір’я.<\/i> Частини рівноправні, питання не поставиш — <i>і<\/i> сурядний.","<i>Купили зошити, і ручки<\/i> → <i>Купили зошити і ручки<\/i>: перед одиничним <i>і<\/i> між однорідними членами коми не ставимо.","<i>Хотів прийти та не встиг<\/i> → <i>Хотів прийти, та не встиг<\/i>: тут <i>та<\/i> = <i>але<\/i> (протиставний сполучник), перед ним потрібна кома."],"check":[{"q":"Який сполучник — підрядний?","options":["або","зате","якщо","та"],"correct":2,"a":"<i>Якщо<\/i> приєднує залежну частину з умовою (<i>за якої умови?<\/i>). <i>Або, зате, та<\/i> — сурядні."},{"q":"Пастка: <i>Оля прийшла, та Марко запізнився.<\/i> Сполучник <i>та<\/i> тут…","options":["сурядний єднальний (= і)","сурядний протиставний (= але)","підрядний"],"correct":1,"a":"Можна замінити на <i>але<\/i>: <i>Оля прийшла, але Марко запізнився<\/i>. Отже, <i>та<\/i> — сурядний протиставний."},{"q":"Повідомлення тренерові: <i>Не прийду на тренування, бо захворів.<\/i> Напиши складений сполучник-синонім до <i>бо<\/i>.","accept":["тому що","через те що"],"a":"<i>тому що<\/i> або <i>через те що<\/i>: <i>Не прийду на тренування, тому що захворів.<\/i> Усі ці сполучники виражають причину."}]}},{"id":"U6.2.3","name":"Написання сполучників","status":"ready","programmeRef":"Написання сполучників разом та окремо.","lesson":{"what":"Складні сполучники пишемо <b>разом<\/b>: <i>зате, проте, щоб, якби, якщо, тобто<\/i>. Але так само звучать сполуки інших слів, які пишемо <b>окремо<\/b>: <i>за те, про те, що б, як би<\/i>. Розрізнити їх допомагає заміна.","ideas":["<b>Зате<\/b> — сполучник (= <i>але<\/i>): <i>Дорога важка, <b>зате<\/b> вид чудовий<\/i>. <b>За те<\/b> — прийменник і займенник, після них часто йде <i>що<\/i>: <i>Дякую <b>за те<\/b>, що допоміг<\/i>.","<b>Проте<\/b> — сполучник (= <i>але<\/i>): <i>Було холодно, <b>проте<\/b> ми купалися<\/i>. <b>Про те<\/b> — прийменник і займенник: <i>Розкажи <b>про те<\/b>, що бачив<\/i>.","<b>Щоб<\/b> — сполучник мети (= <i>для того щоб<\/i>): <i>Я встав рано, <b>щоб<\/b> побачити світанок<\/i>. <b>Що б<\/b> — займенник <i>що<\/i> і частка <i>б<\/i>: <i><b>Що б<\/b> ти хотів на день народження?<\/i> Частку тут можна переставити: <i>Що ти хотів <b>би<\/b>…?<\/i>","<b>Якби<\/b> — сполучник умови (= <i>коли б<\/i>): <i><b>Якби<\/b> не дощ, ми пішли б у ліс<\/i>. <b>Як би<\/b> — прислівник <i>як<\/i> і частка <i>б<\/i>: <i><b>Як би<\/b> я хотів побачити море!<\/i>","Складені сполучники пишемо окремо: <i>тому що, через те що, для того щоб, так що, незважаючи на те що<\/i>."],"rules":[{"f":"сполучники — разом: зате, проте, щоб, якби","means":"Перевірка заміною: <i>зате<\/i>, <i>проте<\/i> → <i>але<\/i>; <i>щоб<\/i> → <i>для того щоб<\/i>; <i>якби<\/i> → <i>коли б<\/i>."},{"f":"окремо: за те, про те, що б, як би","means":"Це два різні слова: прийменник і займенник (<i>за те, про те<\/i>) або займенник чи прислівник і частка (<i>що б, як би<\/i>). Частку <i>б<\/i> часто можна переставити: <i>Що ти робив би?<\/i>"}],"examples":[{"task":"Разом чи окремо? <i>Задача складна, (за)(те) цікава.<\/i>","steps":[{"do":"Пробуємо замінити на <i>але<\/i>: <i>складна, але цікава<\/i>","why":"Зміст не змінився — отже, це сполучник."},{"do":"Пишемо разом: <i>зате<\/i>","why":"Сполучник <i>зате<\/i> пишемо разом."}],"answer":"<i>Задача складна, зате цікава.<\/i>"},{"task":"Разом чи окремо? <i>(Що)(б) ти робив на моєму місці?<\/i>","steps":[{"do":"Це питання, <i>що<\/i> — питальний займенник","why":"Робив <i>що?<\/i> — займенник тут є членом речення (додатком), а не сполучником."},{"do":"Частку можна переставити: <i>Що ти робив би на моєму місці?<\/i>","why":"Якщо <i>б<\/i> можна відділити, це окреме слово — пишемо окремо."}],"answer":"<i>Що б ти робив на моєму місці?<\/i>"},{"task":"Знайди й виправ помилки: <i>Як би мені дали час, я дописав би твір. Учитель розповів проте, що буде на контрольній.<\/i>","steps":[{"do":"<i>Як би мені дали час<\/i> → <i>Якби мені дали час<\/i>","why":"Тут умова (= <i>коли б мені дали час<\/i>), це сполучник — пишемо разом."},{"do":"<i>розповів проте, що буде<\/i> → <i>розповів про те, що буде<\/i>","why":"Розповів <i>про що?<\/i> — <i>про те<\/i>: прийменник і займенник; замінити на <i>але<\/i> не можна."}],"answer":"<i>Якби мені дали час, я дописав би твір. Учитель розповів про те, що буде на контрольній.<\/i>"}],"mistakes":["<i>Дякую зате, що прийшов<\/i> → <i>Дякую за те, що прийшов<\/i>: дякую <i>за що?<\/i> — прийменник і займенник, пишемо окремо.","<i>Я вчу вірш що б розповісти його на святі<\/i> → <i>Я вчу вірш, щоб розповісти його на святі<\/i>: це мета (= <i>для того щоб<\/i>), сполучник пишемо разом, а перед ним ставимо кому.","<i>Якби я хотів побачити море!<\/i> → <i>Як би я хотів побачити море!<\/i>: тут не умова, а оклик-побажання; <i>як<\/i> — прислівник, <i>б<\/i> — окрема частка."],"check":[{"q":"Напиши одним словом або двома: <i>Хочу поїхати до бабусі, (що)(б) допомогти їй у саду.<\/i>","accept":["щоб"],"a":"<i>щоб<\/i> — разом: це мета (= <i>для того щоб<\/i>), тобто сполучник."},{"q":"Пастка: де правильно?","options":["Ми говорили проте, як готуватися до олімпіади.","Ми говорили про те, як готуватися до олімпіади.","Ми говорили про-те, як готуватися до олімпіади."],"correct":1,"a":"Говорили <i>про що?<\/i> — <i>про те<\/i>: прийменник і займенник, пишемо окремо й без дефіса. Замінити на <i>але<\/i> тут не можна."},{"q":"Повідомлення другові. Де все правильно?","options":["Якби не дощ, ми б уже були на стадіоні.","Як би не дощ, ми б уже були на стадіоні."],"correct":0,"a":"Тут умова (= <i>коли б не дощ<\/i>), тому сполучник <i>якби<\/i> пишемо разом."}]}}]},{"id":"U6.3","name":"Частка","what":"Слова, що додають відтінок: «хай», «лише», «не».","subtopics":[{"id":"U6.3.1","name":"Частка: види","status":"ready","programmeRef":"Частка як службова частина мови. Частки формотворчі та словотворчі.","lesson":{"what":"<b>Частка<\/b> — службова частина мови, яка додає слову чи реченню відтінків значення (<i><b>лише<\/b> ти, <b>навіть<\/b> учитель<\/i>) або допомагає творити форми слів і нові слова (<i>прочитав <b>би<\/b>, хто<b>сь<\/b><\/i>). Частка не змінюється і не є членом речення.","ideas":["<b>Формотворчі<\/b> частки творять <b>форми<\/b> слова — слово залишається тим самим: <i>би (б)<\/i> — умовний спосіб дієслова (<i>прочитав би<\/i>); <i>хай, нехай<\/i> — наказовий спосіб (<i>хай співає<\/i>); <i>най-, якнай-, щонай-<\/i> — найвищий ступінь порівняння прикметників і прислівників (<i>найкращий, якнайшвидше<\/i>).","<b>Словотворчі<\/b> частки творять <b>нові слова<\/b>: <i>-сь<\/i> (<i>хтось, десь<\/i>), <i>-небудь<\/i> (<i>що-небудь<\/i>), <i>будь-<\/i> (<i>будь-хто<\/i>), <i>казна-, хтозна-<\/i> (<i>казна-що, хтозна-як<\/i>), <i>аби-<\/i> (<i>абихто<\/i>), <i>де-<\/i> (<i>дехто<\/i>), <i>ні-<\/i> (<i>ніхто<\/i>), <i>не-<\/i> (<i>неправда<\/i>).","Частки, що надають слову чи реченню <b>додаткових відтінків<\/b>: заперечні — <i>не, ні<\/i>; питальні — <i>чи, хіба, невже<\/i>; підсилювальні — <i>навіть, же (ж), таки, аж<\/i>; обмежувальні (видільні) — <i>лише, тільки, хоч<\/i>; вказівні — <i>ось, от, он<\/i>; стверджувальні — <i>так, авжеж<\/i>.","Порівняй: <i><b>Невже<\/b> канікули вже закінчилися?<\/i> — подив; <i><b>Лише<\/b> Оля розв’язала задачу<\/i> — виділено одну людину. Частки допомагають точно передати думку й почуття."],"rules":[{"f":"формотворчі: би (б), хай, нехай, най-","means":"Творять форму того самого слова: <i>прочитав — прочитав би; співає — хай співає; кращий — найкращий<\/i>."},{"f":"словотворчі: -сь, -небудь, будь-, казна-, ні-, не-","means":"Творять нове слово: <i>хто — хтось — будь-хто — ніхто<\/i>."}],"examples":[{"task":"Знайди частку й визнач, формотворча вона чи словотворча: <i>Я б залюбки пішов у кіно.<\/i>","steps":[{"do":"Частка <i>б<\/i>","why":"Разом із дієсловом <i>пішов<\/i> вона утворює умовний спосіб: <i>пішов би<\/i>."},{"do":"Формотворча","why":"Слово те саме (<i>піти<\/i>), змінилася лише його форма."}],"answer":"<i>б<\/i> — формотворча частка."},{"task":"Визнач вид частки: <i>Хтось залишив у класі рюкзак.<\/i>","steps":[{"do":"Частка <i>-сь<\/i> у слові <i>хтось<\/i>","why":"Від займенника <i>хто<\/i> утворилося нове слово — <i>хтось<\/i> (невідомо хто)."},{"do":"Словотворча","why":"Частка утворила нове слово, а не форму старого."}],"answer":"<i>-сь<\/i> — словотворча частка."},{"task":"Який відтінок додає частка? 1) <i>Навіть тато засміявся.<\/i> 2) <i>Хіба ти не чув дзвоника?<\/i> 3) <i>Тільки Марко розв’язав задачу.<\/i>","steps":[{"do":"1) <i>навіть<\/i> — підсилювальна","why":"Підкреслює несподіванку: засміялися всі, і тато теж."},{"do":"2) <i>хіба<\/i> — питальна","why":"Робить речення питанням із відтінком сумніву, подиву."},{"do":"3) <i>тільки<\/i> — обмежувальна (видільна)","why":"Виділяє одного з усіх."}],"answer":"1) підсилювальна; 2) питальна; 3) обмежувальна (видільна)."}],"mistakes":["Вважають <i>най-<\/i> у слові <i>найкращий<\/i> словотворчою часткою. <i>Найкращий<\/i> — форма найвищого ступеня, а не нове слово, тому <i>най-<\/i> — формотворча.","Плутають частку <i>б<\/i> і сполучник: у <i>щоб, якби<\/i> <i>б<\/i> — частина сполучника, а в <i>зробив би<\/i> — окрема формотворча частка.","Підкреслюють частку як член речення. У реченні <i>Лише Оля розв’язала задачу<\/i> підмет — <i>Оля<\/i>, а <i>лише<\/i> — частка, вона не є членом речення."],"check":[{"q":"Яка частка формотворча?","options":["-небудь (що-небудь)","нехай (нехай читає)","казна- (казна-що)","-сь (десь)"],"correct":1,"a":"<i>Нехай<\/i> творить форму наказового способу того самого дієслова: <i>читає — нехай читає<\/i>. Інші частки творять нові слова."},{"q":"Пастка: у слові <i>якнайшвидше<\/i> частка <i>якнай-<\/i>…","options":["формотворча","словотворча"],"correct":0,"a":"Формотворча: <i>якнайшвидше<\/i> — форма найвищого ступеня порівняння прислівника <i>швидко<\/i>, а не нове слово."},{"q":"Мама написала: <i>Купи, будь ласка, лише хліб.<\/i> Випиши частку, яка показує, що треба купити тільки одне.","accept":["лише"],"a":"<i>лише<\/i> — обмежувальна (видільна) частка: виділяє хліб серед усіх можливих покупок."}]}},{"id":"U6.3.2","name":"Написання часток","status":"ready","programmeRef":"Написання часток.","lesson":{"what":"Частки пишемо <b>окремо<\/b>, <b>разом<\/b> або <b>через дефіс<\/b>. Окремо — більшість часток: <i>би, же, хай, лише, навіть<\/i>. Разом — частки, що стали частиною слова: <i>-сь, ні-, де-, аби-, най-<\/i>. Через дефіс — <i>-небудь, будь-, казна-, хтозна-<\/i>, а також <i>-бо, -но, -то, -от, -таки<\/i>.","ideas":["<b>Окремо<\/b> пишемо <i>б (би), ж (же), хай, нехай, ось, лише, навіть, аж<\/i>: <i>зробив <b>би<\/b>, ти <b>ж<\/b> обіцяв, <b>хай<\/b> пише<\/i>. Після голосного зазвичай пишемо <i>б, ж<\/i>, після приголосного — <i>би, же<\/i>: <i>я б пішла, він пішов би<\/i>.","<b>Разом<\/b> пишемо <i>-сь<\/i> (<i>хтось, колись<\/i>), <i>ні-, де-, аби-<\/i> в займенниках і прислівниках (<i>ніхто, дехто, абияк<\/i>; але з прийменником усередині — окремо: <i>ні з ким, де в кого<\/i>), а також <i>най-, якнай-, щонай-<\/i> (<i>найкращий, якнайшвидше, щонайменше<\/i>).","<b>Через дефіс<\/b> пишемо <i>-небудь, будь-, казна-, хтозна-, бозна-<\/i>: <i>хто-небудь, будь-який, казна-що, хтозна-де<\/i>.","Частки <b>-бо, -но, -то, -от, -таки<\/b> пишемо через дефіс, коли вони стоять одразу після слова, до якого належать: <i>іди-бо, дай-но, тим-то, так-от, все-таки, знов-таки<\/i>. Якщо <i>таки<\/i> стоїть перед словом, якого стосується, — окремо: <i>Він <b>таки<\/b> прийшов<\/i>.","Не плутай частку зі сполучником, який звучить так само: <i>Я поспішав, <b>бо<\/b> запізнювався<\/i> — тут <i>бо<\/i> сполучник (= тому що), пишемо окремо й ставимо перед ним кому."],"rules":[{"f":"-бо, -но, -то, -от, -таки → дефіс: дай-но, все-таки","means":"Дефіс — коли частка стоїть одразу після свого слова. <i>Таки<\/i> перед словом — окремо: <i>таки знайшов<\/i>."},{"f":"-небудь, будь-, казна-, хтозна- → дефіс; -сь, ні-, де-, аби-, най- → разом","means":"<i>будь-хто, що-небудь, казна-де<\/i>; але <i>хтось, ніхто, дехто, найвищий<\/i>."},{"f":"б (би), ж (же), хай, лише → окремо","means":"<i>пішов би, ходімо ж, хай грає, лише ти<\/i>."}],"examples":[{"task":"Як написати: <i>(будь)(який)<\/i>, <i>(де)(небудь)<\/i>, <i>(хто)(сь)<\/i>?","steps":[{"do":"<i>будь-який<\/i>","why":"Частку <i>будь-<\/i> пишемо через дефіс."},{"do":"<i>де-небудь<\/i>","why":"Частку <i>-небудь<\/i> пишемо через дефіс. Тут <i>де<\/i> — прислівник (питання <i>де?<\/i>), а не частка <i>де-<\/i>."},{"do":"<i>хтось<\/i>","why":"Частку <i>-сь<\/i> пишемо разом."}],"answer":"<i>будь-який, де-небудь, хтось<\/i>."},{"task":"Дефіс чи окремо? <i>Скажи(но), де мій зошит? Він (таки) знайшов зошит.<\/i>","steps":[{"do":"<i>Скажи-но<\/i>","why":"Частка <i>-но<\/i> стоїть одразу після дієслова, до якого належить, — дефіс."},{"do":"<i>Він таки знайшов<\/i>","why":"<i>Таки<\/i> стоїть перед словом, якого стосується (<i>знайшов<\/i>), — окремо."}],"answer":"<i>Скажи-но, де мій зошит? Він таки знайшов зошит.<\/i>"},{"task":"Виправ помилки в повідомленні: <i>Ходи но сюди! Я все таки знайшов твій м’яч. Хтось закинув його казна куди.<\/i>","steps":[{"do":"<i>Ходи но<\/i> → <i>Ходи-но<\/i>","why":"<i>-но<\/i> одразу після свого слова — дефіс."},{"do":"<i>все таки<\/i> → <i>все-таки<\/i>","why":"<i>-таки<\/i> одразу після слова <i>все<\/i> — дефіс."},{"do":"<i>казна куди<\/i> → <i>казна-куди<\/i>","why":"Частку <i>казна-<\/i> пишемо через дефіс."},{"do":"<i>Хтось<\/i> — правильно","why":"Частку <i>-сь<\/i> пишемо разом."}],"answer":"<i>Ходи-но сюди! Я все-таки знайшов твій м’яч. Хтось закинув його казна-куди.<\/i>"}],"mistakes":["<i>хтонебудь<\/i>, <i>хто небудь<\/i> → <i>хто-небудь<\/i>: частку <i>-небудь<\/i> завжди пишемо через дефіс.","<i>будь-ласка<\/i> → <i>будь ласка<\/i>: тут <i>будь<\/i> — не частка <i>будь-<\/i>, а форма дієслова <i>бути<\/i>, тому пишемо окремо.","<i>Я поспішав-бо запізнювався<\/i> → <i>Я поспішав, бо запізнювався<\/i>: тут <i>бо<\/i> — сполучник причини (= тому що), пишемо окремо й ставимо перед ним кому."],"check":[{"q":"Напиши правильно: <i>(хтозна)(де)<\/i>.","accept":["хтозна-де"],"a":"<i>хтозна-де<\/i>: частку <i>хтозна-<\/i> пишемо через дефіс."},{"q":"Пастка: де правильно?","options":["Передай, будь-ласка, ручку.","Передай, будь ласка, ручку."],"correct":1,"a":"<i>Будь ласка<\/i> пишемо окремо: тут <i>будь<\/i> — форма дієслова <i>бути<\/i>, а не частка <i>будь-<\/i>, як у <i>будь-хто<\/i>."},{"q":"Повідомлення в чаті команди. Де все правильно?","options":["Ми все таки виграли матч!","Ми всетаки виграли матч!","Ми все-таки виграли матч!"],"correct":2,"a":"<i>Все-таки<\/i>: частка <i>-таки<\/i> стоїть одразу після слова <i>все<\/i>, тому пишемо через дефіс."}]}},{"id":"U6.3.3","name":"Не з різними частинами мови","status":"ready","programmeRef":"Написання не з різними частинами мови","lesson":{"what":"Частку <b>не<\/b> з одними словами пишемо <b>разом<\/b>, з іншими — <b>окремо<\/b>. Головні питання: якою частиною мови є слово, чи вживається воно без <i>не<\/i> і чи можна замінити його синонімом без <i>не<\/i>. Тут зібрано все разом — як таблицю.","ideas":["<b>Іменники, прикметники, прислівники<\/b> — <b>разом<\/b>, якщо без <i>не<\/i> не вживаються (<i>невдаха, необхідний, незабаром<\/i>) або з <i>не<\/i> утворюють нове слово, яке можна замінити синонімом без <i>не<\/i> (<i>недруг<\/i> = ворог, <i>невеликий<\/i> = малий, <i>недалеко<\/i> = близько). <b>Окремо<\/b> — коли є протиставлення: <i>не друг, а знайомий; не великий, а маленький; не далеко, а близько<\/i>.","З <b>прикметниками<\/b> і <b>прислівниками<\/b> <i>не<\/i> пишемо окремо також тоді, коли заперечення підсилюють слова <i>зовсім, далеко, ніскільки<\/i>: <i>зовсім не легкий, ніскільки не цікаво<\/i>.","<b>Дієслова<\/b> і <b>дієприслівники<\/b> — <b>окремо<\/b>: <i>не знаю, не прийшов, не читаючи<\/i>. <b>Разом<\/b> — лише ті, що без <i>не<\/i> не вживаються: <i>ненавидіти, нехтувати; ненавидячи, нехтуючи<\/i>.","<b>Дієприкметники<\/b> — <b>разом<\/b>, якщо дієприкметник-означення не має залежних слів: <i>незакінчена робота<\/i>; <b>окремо<\/b> — якщо є залежні слова: <i>не закінчена вчасно робота<\/i>. З формами на <i>-но, -то<\/i> — завжди окремо: <i>роботу не закінчено<\/i>.","<b>Займенники<\/b> і <b>числівники<\/b> — <b>окремо<\/b>: <i>не я, не той, не п’ять<\/i>. Але <i>неабиякий<\/i> пишемо разом."],"rules":[{"f":"іменник, прикметник, прислівник: разом — окремо при протиставленні","means":"Разом, якщо без <i>не<\/i> не вживається або є синонім без <i>не<\/i>: <i>негода, нечемний, невесело<\/i> (= сумно). Окремо, якщо є протиставлення з <i>а<\/i>: <i>не весело, а сумно<\/i>."},{"f":"дієслово, дієприслівник: окремо","means":"<i>не спав, не поспішаючи<\/i>. Разом лише ті, що без <i>не<\/i> не вживаються: <i>ненавидіти, ненавидячи<\/i>."},{"f":"дієприкметник: разом — означення без залежних слів; окремо — із залежними словами або в ролі присудка","means":"<i>непрочитана книжка<\/i>, але <i>не прочитана мною книжка<\/i>; <i>книжка не прочитана<\/i> (присудок); <i>книжку не прочитано<\/i>."}],"examples":[{"task":"Разом чи окремо: <i>(не)глибока річка<\/i>; <i>річка (не)глибока, а мілка<\/i>?","steps":[{"do":"<i>неглибока річка<\/i> — разом","why":"Прикметник з <i>не<\/i> можна замінити синонімом без <i>не<\/i>: <i>мілка<\/i>."},{"do":"<i>не глибока, а мілка<\/i> — окремо","why":"Є протиставлення з <i>а<\/i>."}],"answer":"<i>неглибока річка<\/i>; <i>річка не глибока, а мілка<\/i>."},{"task":"Разом чи окремо: <i>(не)навидіти брехню<\/i>, <i>(не)помітивши калюжі<\/i>, <i>(не)вивчений вірш<\/i>?","steps":[{"do":"<i>ненавидіти<\/i> — разом","why":"Без <i>не<\/i> це дієслово не вживається."},{"do":"<i>не помітивши<\/i> — окремо","why":"З дієприслівниками <i>не<\/i> пишемо окремо."},{"do":"<i>невивчений вірш<\/i> — разом","why":"Дієприкметник-означення без залежних слів."}],"answer":"<i>ненавидіти брехню, не помітивши калюжі, невивчений вірш<\/i>."},{"task":"Виправ помилки в записці: <i>Я не встиг зробити домашнє завдання, бо був незовсім здоровий. Не вивчений вірш повторю завтра.<\/i>","steps":[{"do":"<i>не встиг<\/i> — правильно","why":"З дієсловами <i>не<\/i> пишемо окремо."},{"do":"<i>незовсім<\/i> → <i>не зовсім<\/i>","why":"<i>Не зовсім<\/i> пишемо окремо: тут <i>не<\/i> лише заперечує, а слова «незовсім» у мові немає."},{"do":"<i>Не вивчений вірш<\/i> → <i>Невивчений вірш<\/i>","why":"Дієприкметник-означення без залежних слів — разом."}],"answer":"<i>Я не встиг зробити домашнє завдання, бо був не зовсім здоровий. Невивчений вірш повторю завтра.<\/i>"}],"mistakes":["<i>не навиджу<\/i> → <i>ненавиджу<\/i>: без <i>не<\/i> це дієслово не вживається, тому разом.","<i>незнаючи<\/i> → <i>не знаючи<\/i>: з дієприслівниками <i>не<\/i> пишемо окремо.","<i>Школа не далеко<\/i> (= близько) → <i>Школа недалеко<\/i>: є синонім без <i>не<\/i>. Окремо — лише з протиставленням: <i>не далеко, а близько<\/i>."],"check":[{"q":"Напиши разом чи окремо: <i>Він вийшов, (не)попрощавшись.<\/i> (Лише ці слова.)","accept":["не попрощавшись"],"a":"<i>не попрощавшись<\/i>: з дієприслівниками <i>не<\/i> пишемо окремо."},{"q":"Пастка: «з дієсловами <i>не<\/i> пишемо окремо». Де все ж правильно?","options":["Кіт ненавидить купатися.","Кіт не навидить купатися."],"correct":0,"a":"<i>Ненавидіти<\/i> без <i>не<\/i> не вживається, тому пишемо разом — це виняток із правила про дієслова."},{"q":"Записка мамі: <i>Мамо, я (не)довго, скоро буду!<\/i> Як написати?","options":["не довго","недовго"],"correct":1,"a":"<i>Недовго<\/i> можна замінити синонімом без <i>не<\/i> (<i>швидко<\/i>), протиставлення немає, тому пишемо разом."}]}}]},{"id":"U6.4","name":"Вигук","what":"Слова для почуттів і звуків: «ой», «ура», «гав».","subtopics":[{"id":"U6.4.1","name":"Вигук: групи за значенням","status":"ready","programmeRef":"Вигук як особлива частина мови. Групи вигуків за значенням.","lesson":{"what":"<b>Вигук<\/b> — особлива частина мови: він не називає предметів, ознак чи дій, а виражає почуття, спонукання (заклик, наказ) або є формулою ввічливості: <i>ой, ура, агов, цить, привіт<\/i>. Вигук не належить ні до самостійних, ні до службових частин мови й не змінюється.","ideas":["<b>Емоційні<\/b> вигуки передають почуття: радість (<i>ура<\/i>), подив (<i>ого, ах<\/i>), біль чи переляк (<i>ой, ох<\/i>), жаль (<i>ех, леле<\/i>). Той самий вигук може передавати різні почуття — підказує інтонація.","<b>Спонукальні<\/b> вигуки виражають заклик чи наказ: <i>агов, гей<\/i> (кличемо), <i>цить<\/i> (тихо!), <i>геть<\/i>, <i>тпру<\/i> (до коня).","<b>Етикетні<\/b> вигуки — формули ввічливості: <i>привіт, добридень, спасибі, бувай<\/i>.","До вигуків близькі <b>звуконаслідувальні слова<\/b>: вони відтворюють звуки тварин, природи, предметів: <i>гав, няв, кукуріку, тік-так, бах<\/i>.","Вигук зазвичай не є членом речення. Але якщо його вжито в значенні іменника, він стає членом речення: <i>Гучне <b>ура<\/b> пролунало на стадіоні<\/i> — тут <i>ура<\/i> підмет."],"rules":[{"f":"емоційні: ой, ура, ого · спонукальні: агов, цить, геть · етикетні: привіт, спасибі","means":"Почуття — емоційні; заклик чи наказ — спонукальні; ввічливість — етикетні."}],"examples":[{"task":"Визнач групу вигуку: <i>Ура, ми виграли!<\/i>","steps":[{"do":"<i>ура<\/i> передає радість","why":"Вираження почуття — ознака емоційного вигуку."}],"answer":"<i>ура<\/i> — емоційний вигук."},{"task":"Визнач групи вигуків: <i>Агов, Петре! Добридень, пані Ганно! Цить, малий спить.<\/i>","steps":[{"do":"<i>агов<\/i> — спонукальний","why":"Ним кличемо, привертаємо увагу."},{"do":"<i>добридень<\/i> — етикетний","why":"Це формула привітання."},{"do":"<i>цить<\/i> — спонукальний","why":"Це наказ замовкнути."}],"answer":"<i>агов, цить<\/i> — спонукальні, <i>добридень<\/i> — етикетний."},{"task":"Чи є вигук членом речення? 1) <i>Ой, я забула ключі!<\/i> 2) <i>Гучне ура пролунало на стадіоні.<\/i>","steps":[{"do":"1) <i>ой<\/i> — не член речення","why":"Він лише передає почуття (переляк) і граматично не пов’язаний з іншими словами."},{"do":"2) <i>ура<\/i> вжито в значенні іменника: пролунало <i>що?<\/i> — ура","why":"Має при собі означення <i>гучне<\/i> і відповідає на питання <i>що?<\/i>"},{"do":"Отже, у 2) <i>ура<\/i> — підмет","why":"Вигук, ужитий як іменник, стає членом речення."}],"answer":"1) не член речення; 2) підмет."}],"mistakes":["Вважають вигук службовою частиною мови. Вигук — особлива частина мови: він нічого не з’єднує й не уточнює, а виражає почуття чи спонукання.","Плутають вигук і звуконаслідувальне слово: <i>ой<\/i> виражає почуття людини (вигук), а <i>гав<\/i> відтворює звук, який видає собака (звуконаслідувальне слово).","Вважають <i>гей<\/i> підметом у реченні <i>Гей, ходіть сюди!<\/i> Тут вигук не є членом речення: він лише кличе."],"check":[{"q":"До якої групи належить вигук <i>спасибі<\/i>?","options":["емоційні","спонукальні","етикетні"],"correct":2,"a":"<i>Спасибі<\/i> — формула ввічливості, тобто етикетний вигук."},{"q":"Пастка: слова <i>гав, няв, тік-так<\/i> — це…","options":["емоційні вигуки","звуконаслідувальні слова"],"correct":1,"a":"Вони не виражають почуттів, а відтворюють звуки тварин і предметів — це звуконаслідувальні слова."},{"q":"Повідомлення другові: <i>Агов, ти вже вдома?<\/i> Випиши вигук.","accept":["агов"],"a":"<i>агов<\/i> — спонукальний вигук: ним кличуть, привертають увагу."}]}},{"id":"U6.4.2","name":"Дефіс, кома і знак оклику з вигуками","status":"ready","programmeRef":"Дефіс у вигуках. Кома та знак оклику в реченнях із вигуками.","lesson":{"what":"Вигуки, утворені повторенням, пишемо <b>через дефіс<\/b>: <i>ой-ой-ой, ха-ха-ха<\/i>. У реченні вигук відокремлюємо <b>комою<\/b>, а якщо вимовляємо його з сильним почуттям, після нього ставимо <b>знак оклику<\/b>.","ideas":["Через дефіс пишемо вигуки та звуконаслідувальні слова, утворені повторенням: <i>ой-ой-ой, ох-ох, ну-ну, ха-ха-ха, ку-ку, гав-гав<\/i>, а також складні: <i>тік-так<\/i>.","Вигук на початку речення відокремлюємо комою: <i>Ой, я забула зошит!<\/i> Якщо вигук стоїть усередині речення, його виділяємо комами з обох боків.","Якщо вигук вимовляємо з сильним почуттям, після нього ставимо <b>знак оклику<\/b>, а наступне слово пишемо з великої букви: <i>Ура! Канікули!<\/i> <i>Ох! Я ледве встиг.<\/i>","<b>Не<\/b> відокремлюємо комою вигук <i>о<\/i> перед звертанням: <i>О друзі, як я радий вас бачити!<\/i> Також не відокремлюємо вигук, ужитий у значенні іменника: <i>Гучне ура пролунало на стадіоні.<\/i>"],"rules":[{"f":"ой-ой-ой, ха-ха-ха, тік-так","means":"Повторювані й складні вигуки та звуконаслідувальні слова пишемо через дефіс."},{"f":"Ой, … / Ура! …","means":"Вигук відокремлюємо комою; якщо вимовляємо з сильним почуттям — ставимо знак оклику, далі велика буква."},{"f":"О + звертання — без коми після о","means":"<i>О рідний краю!<\/i> Кому після <i>о<\/i> не ставимо."}],"examples":[{"task":"Як написати: <i>(ха)(ха)(ха)<\/i>, <i>(ой)(ой)<\/i>?","steps":[{"do":"<i>ха-ха-ха<\/i>","why":"Вигук утворено повторенням — пишемо через дефіс."},{"do":"<i>ой-ой<\/i>","why":"Теж повтор того самого вигуку — дефіс."}],"answer":"<i>ха-ха-ха, ой-ой<\/i>."},{"task":"Розстав розділові знаки: <i>Ой я забув ключі вдома<\/i>","steps":[{"do":"Вигук <i>ой<\/i> стоїть на початку — відокремлюємо комою","why":"Вигук не є членом речення, його відділяємо від решти."},{"do":"Речення вимовляємо з почуттям — у кінці знак оклику","why":"Це окличне речення: переляк, прикрість."}],"answer":"<i>Ой, я забув ключі вдома!<\/i>"},{"task":"Поясни розділові знаки: 1) <i>Ура! Ми перемогли!<\/i> 2) <i>О друзі, як я радий вас бачити!<\/i>","steps":[{"do":"1) Після <i>Ура<\/i> — знак оклику, далі велика буква","why":"Вигук вимовлено з сильним почуттям, окремо від речення."},{"do":"2) Після <i>О<\/i> коми немає","why":"Вигук <i>о<\/i> перед звертанням не відокремлюємо."},{"do":"2) Кома після <i>друзі<\/i>","why":"<i>Друзі<\/i> — звертання, його відокремлюємо."}],"answer":"1) вигук з окличною інтонацією — знак оклику; 2) <i>о<\/i> перед звертанням — без коми, звертання відокремлене."}],"mistakes":["<i>ой ой ой<\/i> → <i>ой-ой-ой<\/i>: повтор вигуку пишемо через дефіс.","<i>О, мамо!<\/i> → <i>О мамо!<\/i>: вигук <i>о<\/i> перед звертанням комою не відокремлюємо.","<i>Ура ми перемогли<\/i> → <i>Ура, ми перемогли!<\/i> або <i>Ура! Ми перемогли!<\/i>: вигук обов’язково відокремлюємо."],"check":[{"q":"Напиши правильно одним записом: <i>хі хі хі<\/i>.","accept":["хі-хі-хі"],"a":"<i>хі-хі-хі<\/i>: вигук утворено повторенням, тому пишемо через дефіс."},{"q":"Пастка: де правильно?","options":["О, Україно моя!","О Україно моя!"],"correct":1,"a":"Вигук <i>о<\/i> перед звертанням (<i>Україно<\/i>) комою не відокремлюємо."},{"q":"Повідомлення другові. Де правильно?","options":["Ого, ти вже приїхав!","Ого ти вже приїхав!","Ого ти, вже приїхав!"],"correct":0,"a":"Вигук <i>ого<\/i> на початку речення відокремлюємо комою."}]}}]},{"id":"U6.5","name":"Мовлення: поштова адреса","what":"Як правильно написати адресу.","subtopics":[{"id":"U6.5.1","name":"Поштова адреса","status":"ready","programmeRef":"Загальні вимоги щодо написання поштової адреси","lesson":{"what":"<b>Поштова адреса<\/b> — точні відомості про те, кому й куди доставити лист, посилку чи документ. Її пишуть на конверті, бланку посилки, у різних формах і заявах. Помилка в адресі — і відправлення може не дійти.","ideas":["В адресі вказують: <b>кому<\/b> — прізвище та ім’я (за потреби й по батькові) <b>адресата<\/b>, тобто того, кому надсилають; <b>куди<\/b> — вулицю, номер будинку й квартири, населений пункт (місто, селище, село), за потреби район і область; <b>поштовий індекс<\/b>.","Пиши <b>повністю, точно й розбірливо<\/b>, без помилок у назвах. Номери будинку й квартири — цифрами. Поштовий індекс в Україні складається з п’яти цифр.","Скорочуй лише загальноприйняті слова: <i>вул.<\/i> (вулиця), <i>просп.<\/i> (проспект), <i>буд.<\/i> (будинок), <i>кв.<\/i> (квартира), <i>м.<\/i> (місто), <i>с.<\/i> (село), <i>р-н<\/i> (район), <i>обл.<\/i> (область). Власні назви вулиць і міст пишемо повністю.","На конверті пишуть дві адреси: <b>адресата<\/b> і <b>відправника<\/b> (того, хто надсилає), щоб лист можна було повернути. Адреса відправника — угорі ліворуч, адреса адресата — внизу праворуч.","У бланках і формах кожну частину адреси пишемо у своєму полі; якщо бланк вимагає, — друкованими літерами."],"rules":[{"f":"адресат → вулиця, будинок, квартира → населений пункт → район, область → індекс","means":"Кожну частину пишемо з нового рядка. Наприклад: <i>Коваленко О. П. / вул. Шевченка, буд. 15, кв. 8 / м. Полтава / 36011<\/i>."}],"examples":[{"task":"Що треба вказати в адресі, щоб лист точно дійшов?","steps":[{"do":"Кому: прізвище та ім’я адресата","why":"Щоб лист отримала саме та людина."},{"do":"Куди: вулицю, номер будинку й квартири, населений пункт, за потреби район і область","why":"Щоб листоноша знайшов точне місце."},{"do":"Поштовий індекс","why":"За ним пошта сортує відправлення й надсилає їх у потрібне відділення."}],"answer":"Адресата, точне місце (вулиця, будинок, квартира, населений пункт, за потреби район і область) та поштовий індекс."},{"task":"Розташуй частини адреси по порядку: <i>м. Полтава; 36011; Коваленко О. П.; вул. Шевченка, буд. 15, кв. 8<\/i>.","steps":[{"do":"1) <i>Коваленко О. П.<\/i>","why":"Спершу пишемо, кому."},{"do":"2) <i>вул. Шевченка, буд. 15, кв. 8<\/i>","why":"Далі — вулиця, будинок, квартира."},{"do":"3) <i>м. Полтава<\/i>","why":"Потім — населений пункт."},{"do":"4) <i>36011<\/i>","why":"Наприкінці — поштовий індекс."}],"answer":"<i>Коваленко О. П. / вул. Шевченка, буд. 15, кв. 8 / м. Полтава / 36011<\/i>."},{"task":"Що не так з адресою на конверті: <i>Бондар І. А. / вул. Лесі Українки / м. Вінниця<\/i>?","steps":[{"do":"Немає номера будинку (і квартири, якщо вона є)","why":"Без них листоноша не знатиме, куди саме доставити лист."},{"do":"Немає поштового індексу","why":"Індекс — обов’язкова частина адреси, без нього відправлення може затриматися."}],"answer":"Треба додати номер будинку (квартири) та індекс, наприклад: <i>Бондар І. А. / вул. Лесі Українки, буд. 7, кв. 12 / м. Вінниця / 21000<\/i>."}],"mistakes":["Пропускають індекс або номер квартири. Без них відправлення може затриматися чи повернутися назад.","<i>вл. Шевч.<\/i> → <i>вул. Шевченка<\/i>: скорочуємо лише загальноприйняті слова (<i>вул., буд., кв., м., обл.<\/i>), а назви пишемо повністю.","Пишуть усю адресу в один рядок нерозбірливо. Правильно: кожна частина — з нового рядка (у бланку — у своєму полі), чітко й без помилок."],"check":[{"q":"Яку адресу записано правильно й повно? (Риска / означає новий рядок.)","options":["Коваленко О. П. / вул. Шевченка / м. Полтава","вул. Шевченка, буд. 15, кв. 8 / м. Полтава / 36011","Коваленко О. П. / вул. Шевченка, буд. 15, кв. 8 / м. Полтава / 36011"],"correct":2,"a":"Є все: адресат, вулиця з номерами будинку й квартири, населений пункт та індекс. У першій адресі немає номерів та індексу, у другій — адресата."},{"q":"Пастка: яке скорочення неправильне?","options":["вул.","кв.","обл.","будин."],"correct":3,"a":"Загальноприйняте скорочення слова <i>будинок<\/i> — <i>буд.<\/i>; <i>вул., кв., обл.<\/i> — правильні."},{"q":"Ти заповнюєш бланк посилки. Скільки цифр має поштовий індекс в Україні? Напиши число.","accept":["5"],"a":"5 (п’ять) цифр, наприклад: 36011."}]}}]}]},{"id":"U7","subject":"ukr","name":"Узагальнення вивченого","what":"Повторюємо частини мови й головні орфограми 7 класу.","topics":[{"id":"U7.1","name":"Частини мови й правопис","what":"Самостійні й службові частини мови, форми дієслова, орфограми.","subtopics":[{"id":"U7.1.1","name":"Самостійні та службові частини мови","status":"ready","programmeRef":"Самостійні та службові частини мови, вигук; роль їх у мовленні; основні морфологічні ознаки; синтаксична роль.","lesson":{"what":"Усі слова поділяються на <b>частини мови<\/b>. <b>Самостійні<\/b> частини мови називають предмети, ознаки, кількість, дії тощо й бувають членами речення. <b>Службові<\/b> (прийменник, сполучник, частка) зв’язують слова чи додають відтінки значення й членами речення не бувають. <b>Вигук<\/b> — особлива частина мови: він виражає почуття чи спонукання, але не називає їх.","ideas":["Самостійні частини мови: <b>іменник<\/b> (хто? що?), <b>прикметник<\/b> (який? чий?), <b>числівник<\/b> (скільки? котрий?), <b>займенник<\/b> (указує на предмет, ознаку чи кількість, не називаючи їх), <b>дієслово<\/b> (що робити? що зробити?), <b>прислівник<\/b> (як? де? коли? куди?).","<b>Дієприкметник<\/b> (<i>прочитаний<\/i>) і <b>дієприслівник<\/b> (<i>прочитавши<\/i>) — це особливі <b>форми дієслова<\/b>, а не окремі частини мови.","Службові частини мови: <b>прийменник<\/b> (<i>на, у, з-під, завдяки<\/i>) зв’язує слова в словосполученні; <b>сполучник<\/b> (<i>і, але, бо, щоб<\/i>) з’єднує однорідні члени речення й частини складного речення; <b>частка<\/b> (<i>не, ні, би, -но<\/i>) додає слову чи реченню відтінків значення або допомагає творити форми слів.","Змінні частини мови мають закінчення (іменник, прикметник, числівник, займенник, дієслово), незмінні — не мають (прислівник, дієприслівник, службові частини мови, вигук).","Найчастіша синтаксична роль: іменник і займенник — підмет або додаток; дієслово — присудок; прикметник і дієприкметник — означення; прислівник і дієприслівник — обставина. Службові слова й вигуки членами речення не бувають."],"rules":[{"f":"самостійні: іменник, прикметник, числівник, займенник, дієслово (і його форми), прислівник","means":"Мають лексичне значення, відповідають на питання й бувають членами речення: <i>Учора (коли?) ми (хто?) грали (що робили?)<\/i>."},{"f":"службові: прийменник, сполучник, частка; окремо — вигук","means":"На питання не відповідають і членами речення не бувають. У реченні <i>Ой, я забув зошит!<\/i> слово <i>ой<\/i> — вигук."}],"examples":[{"task":"Визнач частини мови: <i>Учора ми з друзями весело грали у футбол на шкільному стадіоні.<\/i>","steps":[{"do":"<i>грали<\/i> — дієслово; <i>ми<\/i> — займенник.","why":"Що робили? — дієслово-присудок; <i>ми<\/i> вказує на осіб, не називаючи їх, — займенник-підмет."},{"do":"<i>друзями, футбол, стадіоні<\/i> — іменники; <i>шкільному<\/i> — прикметник.","why":"Іменники відповідають на питання <i>з ким? у що? на чому?<\/i>; прикметник — на питання <i>якому?<\/i>"},{"do":"<i>учора, весело<\/i> — прислівники.","why":"Відповідають на питання <i>коли?<\/i> і <i>як?<\/i>, не змінюються."},{"do":"<i>з, у, на<\/i> — прийменники.","why":"Службові слова: зв’язують іменники з дієсловом."}],"answer":"Відповідь: учора (присл.), ми (займ.), з (прийм.), друзями (ім.), весело (присл.), грали (дієсл.), у (прийм.), футбол (ім.), на (прийм.), шкільному (прикм.), стадіоні (ім.)."},{"task":"Визнач частину мови й синтаксичну роль виділених слів: <i>Діти, <b>захоплені<\/b> грою, не помітили дощу. Діти грали, <b>не помічаючи<\/b> дощу.<\/i>","steps":[{"do":"<i>захоплені<\/i> — дієприкметник, означення.","why":"Діти (які?) захоплені; змінюється, як прикметник; називає ознаку за дією."},{"do":"<i>помічаючи<\/i> — дієприслівник, обставина.","why":"Грали (що роблячи?) не помічаючи; не змінюється; називає додаткову дію."},{"do":"<i>не<\/i> — частка, службова частина мови.","why":"Додає заперечення й окремим членом речення не є."}],"answer":"Відповідь: <i>захоплені<\/i> — дієприкметник (означення); <i>не помічаючи<\/i> — дієприслівник з часткою <i>не<\/i> (обставина)."},{"task":"Знайди службові частини мови й вигук: <i>Ой, почався дощ, але ми не змокли, бо взяли парасольки.<\/i>","steps":[{"do":"<i>ой<\/i> — вигук.","why":"Виражає почуття, але не називає його; після вигуку — кома."},{"do":"<i>але, бо<\/i> — сполучники.","why":"З’єднують частини складного речення."},{"do":"<i>не<\/i> — частка.","why":"Додає значення заперечення."}],"answer":"Відповідь: вигук — <i>ой<\/i>; сполучники — <i>але, бо<\/i>; частка — <i>не<\/i>."}],"mistakes":["Вважають дієприслівник чи дієприкметник окремою частиною мови. Правильно: це форми дієслова.","Вважають вигук членом речення: у <i>Ура, ми перемогли!<\/i> слово <i>ура<\/i> не є ні підметом, ні присудком — воно лише виражає радість.","Плутають сполучник і однозвучне поєднання прийменника із займенником: <i>Дорога довга, зате цікава<\/i> (сполучник, = <i>але<\/i>), але <i>Дякую за те, що допоміг<\/i> (прийменник <i>за<\/i> + займенник <i>те<\/i>)."],"check":[{"q":"До якої групи належить прийменник?","options":["службові частини мови","самостійні частини мови","вигук"],"correct":0,"a":"Прийменник — службова частина мови: він не відповідає на питання, не є членом речення, а лише зв’язує слова (<i>на стадіоні, з друзями<\/i>)."},{"q":"Пастка: що таке слово <i>сміючись<\/i>?","options":["окрема самостійна частина мови","форма дієслова — дієприслівник"],"correct":1,"a":"Дієприслівник — це форма дієслова (як і дієприкметник), а не окрема частина мови. Від дієслова він має вид і час."},{"q":"Друг пише: «Я вже вдома. Зателефоную ввечері». Яка частина мови слово <i>ввечері<\/i>? Напиши одним словом.","accept":["прислівник"],"a":"прислівник: відповідає на питання <i>коли?<\/i>, не змінюється, у реченні — обставина часу."}]}},{"id":"U7.1.2","name":"Основні орфограми 7 класу","status":"ready","programmeRef":"Основні орфограми в словах різних частин мови","lesson":{"what":"<b>Орфограма<\/b> — це місце в слові, де можна помилитися і де написання вибираємо за правилом. Щоб вибрати правильно, спершу визнач, <b>яка це частина мови<\/b>: правила для <i>не<\/i>, для написання разом чи з дефісом у різних частин мови різні.","ideas":["Порядок дій: 1) визнач частину мови; 2) знайди «небезпечне» місце (префікс, суфікс, закінчення, <i>не<\/i>, межа між словами); 3) згадай правило саме для цієї частини мови.","<b>-ться, -шся<\/b> в дієсловах пишемо так, хоч вимовляємо інакше: <i>вчиться<\/i> [ц’:а], <i>смієшся<\/i> [с’:а].","<b>Не<\/b>: з дієсловами й дієприслівниками — окремо (<i>не знаю, не знаючи<\/i>), крім слів, що без <i>не<\/i> не вживаються (<i>ненавидіти, ненавидячи<\/i>); з дієприкметником без залежних слів — разом (<i>незакінчена робота<\/i>), із залежними словами — окремо (<i>не закінчена вчасно робота<\/i>); з прислівниками на <i>-о<\/i> — разом, якщо слово можна замінити синонімом без <i>не<\/i> (<i>недалеко<\/i> — близько).","Через дефіс пишемо прислівники з <i>по-<\/i> на <i>-ому, -ему, -ськи<\/i> (<i>по-новому, по-моєму, по-братськи<\/i>), складні прийменники на зразок <i>з-під, з-за, із-за<\/i>, частки <i>-бо, -но, -то<\/i> (<i>іди-но, скажи-бо<\/i>), повтори у вигуках (<i>ой-ой-ой, ха-ха-ха<\/i>).","Сполучники <i>зате, щоб, якби, проте<\/i> пишемо разом, а однозвучні поєднання слів <i>за те, що б, як би, про те<\/i> — окремо: <i>Хочу, щоб ти прийшов<\/i>, але <i>Що б тобі подарувати?<\/i>"],"rules":[{"f":"-ться, -шся","means":"<i>Він вчиться<\/i> (що робить?), <i>ти смієшся<\/i> (що робиш?). У кінці таких дієслів є <i>-ся<\/i>: <i>вчить + ся = вчиться<\/i>, <i>смієш + ся = смієшся<\/i>."},{"f":"не: дієслово, дієприслівник — окремо; дієприкметник без залежних слів — разом","means":"<i>не прийшов, не прийшовши<\/i>; <i>незакінчений малюнок<\/i>, але <i>не закінчений учора малюнок<\/i>."},{"f":"зате, щоб, якби — разом; за те, що б, як би — окремо","means":"Сполучник можна замінити іншим сполучником: <i>зате<\/i> = <i>але<\/i>, <i>щоб<\/i> = <i>аби<\/i>. В окремому написанні є займенник, до якого можна поставити питання: <i>Дякую за те<\/i> (за що?), <i>Що б<\/i> (що?) <i>тобі подарувати?<\/i>"}],"examples":[{"task":"Напиши правильно: <i>(не)знаючи; (не)закінчений твір; (не)далеко від школи<\/i>.","steps":[{"do":"<i>(не)знаючи<\/i> — дієприслівник → <i>не знаючи<\/i>.","why":"Не з дієприслівниками пишемо окремо."},{"do":"<i>(не)закінчений твір<\/i> — дієприкметник без залежних слів → <i>незакінчений<\/i>.","why":"Не з дієприкметником без залежних слів пишемо разом."},{"do":"<i>(не)далеко<\/i> — прислівник на <i>-о<\/i>, синонім — <i>близько<\/i> → <i>недалеко<\/i>.","why":"Якщо прислівник з <i>не<\/i> можна замінити синонімом без <i>не<\/i>, пишемо разом."}],"answer":"Відповідь: <i>не знаючи; незакінчений твір; недалеко від школи<\/i>."},{"task":"Вибери <i>зате<\/i> або <i>за те<\/i>: <i>Ми довго йшли, (зате / за те) побачили водоспад. Дякую тобі (зате / за те), що допоміг.<\/i>","steps":[{"do":"Перше речення: <i>зате<\/i>.","why":"Можна замінити сполучником <i>але<\/i>: <i>Ми довго йшли, але побачили водоспад<\/i>. Отже, це сполучник — пишемо разом."},{"do":"Друге речення: <i>за те<\/i>.","why":"Дякую (за що?) за те — прийменник <i>за<\/i> і займенник <i>те<\/i>, замінити на <i>але<\/i> не можна. Пишемо окремо."}],"answer":"Відповідь: <i>Ми довго йшли, зате побачили водоспад. Дякую тобі за те, що допоміг.<\/i>"},{"task":"Знайди й виправ помилки в повідомленні: <i>Привіт! Тренування почнеця о п’ятій. Неспізнюйся! Візьми мяч.<\/i>","steps":[{"do":"<i>почнеця → почнеться<\/i>","why":"Дієслово з <i>-ся<\/i>: що зробить? — <i>почне + ся<\/i>, пишемо <i>-ться<\/i>."},{"do":"<i>Неспізнюйся → Не спізнюйся<\/i>","why":"Не з дієсловами пишемо окремо."},{"do":"<i>мяч → м’яч<\/i>","why":"Апостроф пишемо після губних <i>б, п, в, м, ф<\/i> перед <i>я, ю, є, ї<\/i>, якщо перед губним у корені немає іншого приголосного (крім <i>р<\/i>): <i>м’яч, п’ять, верб’я<\/i>; але <i>свято, цвях<\/i>."}],"answer":"Відповідь: <i>Привіт! Тренування почнеться о п’ятій. Не спізнюйся! Візьми м’яч.<\/i>"}],"mistakes":["Пишуть за вимовою: <i>вчиця, смієся<\/i>. Правильно: <i>вчиться, смієшся<\/i>.","Пишуть <i>не<\/i> разом із дієсловом чи дієприслівником: <i>незнаю, незнаючи<\/i>. Правильно: <i>не знаю, не знаючи<\/i>.","Пишуть сполучник окремо: <i>Я прийшов, що б допомогти<\/i>. Правильно: <i>Я прийшов, щоб допомогти<\/i> (= <i>аби допомогти<\/i>)."],"check":[{"q":"Допиши дієслово повністю: <i>Мій брат теж (вчит..ся) у сьомому класі.<\/i>","accept":["вчиться","учиться"],"a":"вчиться (або учиться): що робить? — <i>вчить + ся<\/i>, тому пишемо <i>-ться<\/i>, хоч вимовляємо [ц’:а]."},{"q":"Пастка: <i>(Що б / Щоб) ти хотів на день народження?<\/i>","options":["Щоб","Що б"],"correct":1,"a":"<i>Що б<\/i> — окремо: це займенник <i>що<\/i> (питання <i>що?<\/i>) і частка <i>б<\/i>. Сполучник <i>щоб<\/i> (= <i>аби<\/i>) тут не підходить: «Аби ти хотів…» — змісту немає."},{"q":"Яке оголошення про тренування написано без помилок?","options":["Не запізнюйтеся! Тренування починаєтся о 16:00.","Незапізнюйтеся! Тренування починається о 16:00.","Не запізнюйтеся! Тренування починається о 16:00."],"correct":2,"a":"<i>Не запізнюйтеся<\/i> — не з дієсловом окремо; <i>починається<\/i> — <i>починає + ся<\/i>, тому <i>-ться<\/i>."}]}}]}]}]},{"id":"eng","name":"Англійська мова","grade":7,"tutor":"Том","tutorCall":"Томе","icon":"🇬🇧","refLabel":"З підручника «Think 2»","sections":[{"id":"E0","subject":"eng","name":"Welcome","what":"Повторення на початку року: знайомство, питання, погода, родина, їжа, покупки, плани.","topics":[{"id":"E0.1","name":"Welcome A–B","what":"Знайомство, питання, погода, родина, речі вдома.","subtopics":[{"id":"E0.1.1","name":"Introducing yourself. Asking questions","status":"planned","programmeRef":"Introducing yourself; Asking questions"},{"id":"E0.1.2","name":"The weather. Families","status":"planned","programmeRef":"The weather; Families"},{"id":"E0.1.3","name":"Irregular past participles","status":"planned","programmeRef":"Irregular past participles"},{"id":"E0.1.4","name":"Furniture. Losing things","status":"planned","programmeRef":"Losing things; Furniture"}]},{"id":"E0.2","name":"Welcome C–D","what":"Їжа, магазини, обов'язки, плани, спорт, подорожі.","subtopics":[{"id":"E0.2.1","name":"Food. In a restaurant. Shops","status":"planned","programmeRef":"Buying and talking about food; In a restaurant; Shops"},{"id":"E0.2.2","name":"Things you have to do","status":"planned","programmeRef":"Things you have to do"},{"id":"E0.2.3","name":"Plans and arrangements. Travel plans","status":"planned","programmeRef":"Plans and arrangements" const MAP_VERSION = "2026-10-14j";
const DATA = (typeof CONTENT !== "undefined" && CONTENT && Array.isArray(CONTENT.subjects)) ? CONTENT : { subjects: [] };

/* ---------- Покажчики ---------- */
const SUBJ = {}, SEC = {}, TOP = {}, SUB = {};
DATA.subjects.forEach((s, si) => {
  s.color = `var(--s${(si % 4) + 1})`;
  s.sections = Array.isArray(s.sections) ? s.sections : [];
  s.subs = [];
  SUBJ[s.id] = s;
  s.sections.forEach(sec => {
    sec.subject = s; SEC[sec.id] = sec; sec.subs = [];
    (sec.topics || []).forEach(t => {
      t.section = sec; t.subject = s; TOP[t.id] = t;
      t.subtopics = t.subtopics || [];
      t.subtopics.forEach(st => {
        st.topic = t; st.section = sec; st.subject = s; SUB[st.id] = st;
        st.ready = st.status === "ready" && !!st.lesson;
        st.checks = st.ready ? (st.lesson.check || []).map((c, i) => ({ id: `${st.id}-${i + 1}`, q: c.q, a: c.a,
          fig: c.fig || null, options: Array.isArray(c.options) ? c.options : null, correct: c.correct, accept: Array.isArray(c.accept) ? c.accept : null })) : [];
        st.examples = st.ready && Array.isArray(st.lesson.examples) ? st.lesson.examples : [];
        sec.subs.push(st); s.subs.push(st);
      });
    });
  });
});

/* ---------- Сховище ---------- */
const LS_PROGRESS = "school-map:progress", LS_UI = "school-map:ui";
function lsGet(k) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
const clone = o => JSON.parse(JSON.stringify(o == null ? {} : o));
const isObj = v => !!v && typeof v === "object" && !Array.isArray(v);
function deepMerge(into, patch) {
  Object.keys(patch || {}).forEach(k => { if (isObj(patch[k])) into[k] = deepMerge(isObj(into[k]) ? into[k] : {}, patch[k]); else into[k] = patch[k]; });
  return into;
}
function normProgress(d) { d = isObj(d) ? d : {}; return { read: isObj(d.read) ? d.read : {}, checks: isObj(d.checks) ? d.checks : {}, updatedAt: d.updatedAt || null }; }

let progress = normProgress(lsGet(LS_PROGRESS));
let practice = {};                   // learner/practice → subtopics
let plan = { name: "", current: null, next: [] }; // learner/plan
let db = null, dbState = "local";    // local | live | readonly
let remoteExists = false, remoteBase = null;
let pending = null, inflight = null, writing = false;

/* Запис лише після дії учня, по одному за раз: зміни, що прийшли під час запису, чекають і йдуть одним наступним записом. */
function record(patch) {
  const now = new Date().toISOString();
  deepMerge(progress, patch);
  progress.updatedAt = now;
  lsSet(LS_PROGRESS, progress);
  if (!db || dbState !== "live") return;
  pending = deepMerge(pending || {}, patch);
  pump();
}
async function pump() {
  if (writing || !pending || !db) return;
  writing = true; inflight = pending; pending = null;
  const stamp = { updatedAt: new Date().toISOString(), mapVersion: MAP_VERSION };
  const ref = db.doc("learner/progress");
  const whole = () => ref.set(Object.assign(clone({ read: progress.read, checks: progress.checks }), stamp));
  try {
    if (!remoteExists) { await whole(); remoteExists = true; }
    else {
      try { await ref.update(Object.assign(clone(inflight), stamp)); }
      catch (e) {
        if (e && e.code === "invalid_argument") { await whole(); remoteExists = true; } // документ могли видалити
        else if (e && e.code === "unavailable") { await new Promise(r => setTimeout(r, 600 + Math.random() * 900)); await ref.update(Object.assign(clone(inflight), stamp)); }
        else throw e;
      }
    }
  } catch (e) {
    if (e && (e.code === "invalid_argument" || e.code === "revoked" || e.code === "not_granted")) { dbState = "readonly"; pending = null; paintStatus(); }
  } finally {
    inflight = null; writing = false;
    if (pending) pump();
  }
}
function applyRemoteProgress(d) {
  remoteBase = normProgress(clone(d));
  const merged = normProgress(clone(remoteBase));
  if (inflight) deepMerge(merged, inflight);
  if (pending) deepMerge(merged, pending);
  const changed = JSON.stringify([merged.read, merged.checks]) !== JSON.stringify([progress.read, progress.checks]);
  progress = merged;
  lsSet(LS_PROGRESS, progress);
  return changed;
}

/* ---------- Підрахунки ---------- */
function practiceOf(id) { const p = practice[id]; return p && +p.answered > 0 ? { answered: +p.answered, correct: +p.correct || 0, last: p.last || "" } : null; }
function isMastered(p) { return !!p && p.answered >= 3 && p.correct / p.answered >= 0.8; }
function checkCount(st) { const know = st.checks.filter(c => progress.checks[c.id] === "know").length; return { know, total: st.checks.length }; }
function statusOf(st) {
  if (!st.ready) return "planned";
  if (isMastered(practiceOf(st.id))) return "mastered";
  const c = checkCount(st);
  if (c.total && c.know === c.total) return "checked";
  if (progress.read[st.id]) return "read";
  return "new";
}
const STATUS = {
  planned: ["урок готується", "st-planned"],
  mastered: ["опановано на практиці", "st-mastered"],
  checked: ["самоперевірка пройдена", "st-checked"],
  read: ["прочитано", "st-read"],
  new: ["ще не відкрито", "st-new"]
};
// Бал підтеми: прочитано, самоперевірка, практика — по третині; «опановано» = 100 %.
function scoreOf(st) {
  const p = practiceOf(st.id);
  if (isMastered(p)) return 1;
  const c = checkCount(st);
  const prac = p ? Math.min(1, p.answered / 3) * Math.min(1, (p.correct / p.answered) / 0.8) : 0;
  return ((progress.read[st.id] ? 1 : 0) + (c.total ? c.know / c.total : 0) + prac) / 3;
}
function agg(subs) {
  const ready = subs.filter(s => s.ready);
  const pct = ready.length ? Math.round(ready.reduce((a, s) => a + scoreOf(s), 0) / ready.length * 100) : null;
  return { all: subs.length, ready: ready.length, pct,
    read: ready.filter(s => progress.read[s.id]).length,
    mastered: ready.filter(s => isMastered(practiceOf(s.id))).length };
}
const topicSubs = t => t.subtopics;

/* ---------- Допоміжне ---------- */
function esc(s) { return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
// У текстах уроків дозволено лише <b>, <i>, <sub>, <sup>; усе інше екранується.
function rich(s) { return esc(s).replace(/&lt;(\/?)(b|i|sub|sup)&gt;/g, "<$1$2>"); }
function plain(s) { return String(s == null ? "" : s).replace(/<\/?(b|i|sub|sup)>/g, ""); }
function plural(n, f) { const a = Math.abs(n) % 100, b = a % 10; return a > 10 && a < 20 ? f[2] : b === 1 ? f[0] : b >= 2 && b <= 4 ? f[1] : f[2]; }
function fmtDate(iso) {
  if (!iso) return "";
  const d = new Date(String(iso).length === 10 ? iso + "T12:00:00" : iso);
  if (isNaN(d)) return String(iso);
  try { return d.toLocaleDateString("uk-UA", { day: "numeric", month: "long", year: "numeric" }).replace(/\s*р\.$/, ""); } catch (e) { return String(iso).slice(0, 10); }
}
function ring(pct, size, color, big) {
  const sw = big ? 7 : 6, r = (size - sw) / 2, c = 2 * Math.PI * r, cx = size / 2;
  const v = pct == null ? 0 : Math.max(0, Math.min(100, pct));
  return `<svg class="ring${big ? " big" : ""}" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true" style="--ring-c:${color}">`
    + `<circle class="trk" cx="${cx}" cy="${cx}" r="${r}" stroke-width="${sw}"/>`
    + (v > 0 ? `<circle class="val" cx="${cx}" cy="${cx}" r="${r}" stroke-width="${sw}" stroke-dasharray="${(c * v / 100).toFixed(2)} ${c.toFixed(2)}" transform="rotate(-90 ${cx} ${cx})"/>` : "")
    + `<text x="${cx}" y="${cx}">${pct == null ? "—" : pct + "%"}</text></svg>`;
}
function bar(pct, color) { return `<span class="bar" aria-hidden="true"><i style="width:${pct || 0}%;${color ? `--bar-c:${color}` : ""}"></i></span>`; }

/* ---------- Стан інтерфейсу ---------- */
const uiSaved = lsGet(LS_UI) || {};
const ui = {
  subject: SUBJ[uiSaved.subject] ? uiSaved.subject : (DATA.subjects[0] && DATA.subjects[0].id) || null,
  view: "map",         // map | lesson | parents

  chk: {},             // самоперевірка в цьому візиті: { phase: "fresh"|"retry"|"done", value, wrong: [], msg }
  copied: null
};
function saveUi() { lsSet(LS_UI, { subject: ui.subject, open: [...ui.open], openTouched: ui.openTouched }); }
function autoOpen() {
  // Поки учень сам нічого не розгортав: розгорнути тему «Зараз у школі» (або перший розділ).
  if (ui.openTouched) return;
  const cur = plan.current && TOP[plan.current.topic];
  if (cur && cur.subject.id === ui.subject) { ui.open.add(cur.section.id); ui.open.add(cur.id); return; }
  const s = SUBJ[ui.subject];
  if (s && s.sections[0] && !s.sections.some(x => ui.open.has(x.id))) ui.open.add(s.sections[0].id);
}

const $ = id => document.getElementById(id);

  const grades = [...new Set(DATA.subjects.map(s => s.grade).filter(Boolean))];

function emptyHtml(title, text) {
  return `<div class="card empty"><div class="big" aria-hidden="true">🌱</div><h2>${title}</h2><p>${text}</p></div>`;
}
function subjectHtml(s) {
  if (!s.sections.length) return emptyHtml("Карта ще наповнюється…", `Уроки з предмета «${esc(s.name)}» скоро з'являться. А поки можна просто поговорити з репетитором: напиши «Привіт, ${esc(s.tutorCall || s.tutor || "")}».`);
  const a = agg(s.subs);
  const cur = plan.current && plan.current.subject === s.id ? TOP[plan.current.topic] : null;
  const next = (plan.next || []).map(id => SUB[id]).filter(st => st && st.subject.id === s.id);
  let hints = "";
  if (cur || next.length) {
    hints = `<div class="hints">`
      + (cur ? `<div class="hint now"><span class="lbl">📍 Зараз у школі:</span><span>${rich(cur.name)}</span><button class="chip now" type="button" data-act="goto-topic" data-id="${cur.id}" data-k="goto-${cur.id}">Показати на карті</button></div>` : "")
      + (next.length ? `<div class="hint next"><span class="lbl">➜ Наступний крок:</span>${next.map(st => `<button class="chip next" type="button" data-act="open" data-id="${st.id}" data-k="nx-${st.id}">${rich(st.name)}</button>`).join("")}</div>` : "")
      + `</div>`;
  }
  return `<section class="card intro" aria-label="Огляд предмета">

          const outer = r + (arcs - 1) * FIG.arcGap, tw = textW(txt, 14), dist = outer + 6 + Math.abs(ux) * tw / 2 + Math.abs(uy) * 8;
          const lx = cx + ux * dist, ly = cy + uy * dist, lw = textW(txt, 14);
          boxes.push([lx - lw / 2, ly - 7, lx + lw / 2, ly + 7]);
          out.push(`<text class="alb" x="${f(lx)}" y="${f(ly)}" text-anchor="middle" dominant-baseline="central">${esc(txt)}</text>`);
        }
        break;
      }
      case "right": {
        if (p.length !== 3) throw new Error("right: потрібні 3 точки");
        const [A, Hh, B] = p, hx = X(Hh[0]), hy = Y(Hh[1]);
        const u = [X(A[0]) - hx, Y(A[1]) - hy], w = [X(B[0]) - hx, Y(B[1]) - hy], lu = Math.hypot(...u), lw = Math.hypot(...w);
        if (!(lu > 0 && lw > 0)) throw new Error("right: нульова сторона");
        const s = FIG.right, a = [hx + u[0] / lu * s, hy + u[1] / lu * s], b = [hx + w[0] / lw * s, hy + w[1] / lw * s];
        out.push(`<path class="rmk" d="M${f(a[0])} ${f(a[1])}L${f(a[0] + b[0] - hx)} ${f(a[1] + b[1] - hy)}L${f(b[0])} ${f(b[1])}"/>`);
        break;
      }
      case "label": {
        const q = pt(it.at);
        { const lw = textW(it.text, 15); boxes.push([X(q[0]) - lw / 2, Y(q[1]) - 8, X(q[0]) + lw / 2, Y(q[1]) + 8]); }
        out.push(`<text class="flb" x="${f(X(q[0]))}" y="${f(Y(q[1]))}" text-anchor="middle" dominant-baseline="central">${esc(it.text)}</text>`);
        break;
      }
      case "fn": {
        if (!fin(it.k) || !fin(it.b)) throw new Error("fn: k і b — числа");
        const c = clipLine(v[0], it.k * v[0] + it.b, dx, it.k * dx, 0, 1, v);
        if (c) {
          const sx = X(c[0]), sy = Y(c[1]), ex = X(c[2]), ey = Y(c[3]);
          addSeg(sx, sy, ex, ey);
          out.push(`<path class="stk" d="M${f(sx)} ${f(sy)}L${f(ex)} ${f(ey)}"/>`);
          if (it.label) {
            const L = Math.hypot(ex - sx, ey - sy) || 1, ux = (ex - sx) / L, uy = (ey - sy) / L, cands = [];
            // Уздовж видимої частини прямої, по обидва боки, перпендикулярно до неї.
            [10, 18].forEach(off => [0.8, 0.65, 0.5, 0.35, 0.2].forEach(t => [[uy, -ux], [-uy, ux]].forEach(([nx, ny]) => cands.push({ x: sx + (ex - sx) * t + nx * off, y: sy + (ey - sy) * t + ny * off, ux: nx, uy: ny }))));
            later.push({ g: idx, html: () => place(cands, it.label, "flb", 15, { inside: viewBox }) });
          }
        }
        break;
      }
      case "vline": {
        if (!fin(it.x)) throw new Error("vline: x — число");
        if (it.x >= v[0] && it.x <= v[2]) {
          const xx = X(it.x); addSeg(xx, Y(v[1]), xx, Y(v[3]));
          out.push(`<path class="stk" d="M${f(xx)} ${f(Y(v[1]))}V${f(Y(v[3]))}"/>`);
          if (it.label) {
            const cands = [];
            [10, 18].forEach(off => [0.8, 0.65, 0.5, 0.35, 0.2].forEach(t => { const yy = Y(v[1]) + (Y(v[3]) - Y(v[1])) * t; cands.push({ x: xx + off, y: yy, ux: 1, uy: 0 }, { x: xx - off, y: yy, ux: -1, uy: 0 }); }));
            later.push({ g: idx, html: () => place(cands, it.label, "flb", 15, { inside: viewBox }) });
          }
        }
        break;
      }
      case "plot": {
        const ps = (it.pts || []).map(q => pt(q));
        if (ps.length < 2) throw new Error("plot: потрібно ≥ 2 точки");
        ps.slice(1).forEach((q, j) => addSeg(X(ps[j][0]), Y(ps[j][1]), X(q[0]), Y(q[1])));
        out.push(`<path class="stk" d="M${ps.map(q => `${f(X(q[0]))} ${f(Y(q[1]))}`).join("L")}" clip-path="url(#${id}-c)"/>`);
        break;
      }
      default: throw new Error("невідомий тип " + it.t);
    }
    body.push([`<g class="${cls}"${data}>${out.join("")}`, "</g>"]);
  });

  // Точки й підписи — поверх усього.
  const hide = new Set(Array.isArray(fig.hide) ? fig.hide : []), lp = isObj(fig.lp) ? fig.lp : {};
  const shown = Object.keys(P).filter(k => !hide.has(k));
  const cxm = shown.reduce((a, k) => a + P[k][0], 0) / (shown.length || 1), cym = shown.reduce((a, k) => a + P[k][1], 0) / (shown.length || 1);
  shown.forEach(k => { const x = X(P[k][0]), y = Y(P[k][1]); boxes.push([x - 4, y - 4, x + 4, y + 4]); front.push(`<circle class="pt" cx="${f(x)}" cy="${f(y)}" r="${FIG.dot}"/>`); });
  const dirs = Object.keys(LP).map(key => { const [a, b] = LP[key], L = Math.hypot(a, b); return [a / L, b / L]; });
  shown.forEach(k => {
    const x = X(P[k][0]), y = Y(P[k][1]);
    let prefer = LP[lp[k]] ? [LP[lp[k]]] : null;
    if (!prefer) {
      let ax = P[k][0] - cxm, ay = -(P[k][1] - cym); const L = Math.hypot(ax, ay);
      if (L < 1e-9) { ax = 0.7; ay = -0.7; } else { ax /= L; ay /= L; }
      prefer = dirs.slice().sort((p1, p2) => (p2[0] * ax + p2[1] * ay) - (p1[0] * ax + p1[1] * ay));
    }
    const cands = prefer.map(([a, b]) => { const L = Math.hypot(a, b); return { x: x + a / L * 9, y: y + b / L * 9, ux: a / L, uy: b / L }; });
    // Власна точка не заважає своєму підпису: тимчасово прибираємо її квадратик.
    const own = boxes.findIndex(bx => bx[0] === x - 4 && bx[1] === y - 4);
    const saved = own >= 0 ? boxes.splice(own, 1)[0] : null;
    front.push(place(cands, figName(k), "plb", 17));
    if (saved) boxes.push(saved);
  });
  later.forEach(l => { body[l.g] && (body[l.g][0] += l.html()); });
  const cap = String(fig.caption || "");
  return `<figure class="fig"><svg class="fig-svg" viewBox="0 0 ${f(W)} ${f(H)}" width="${f(W)}" height="${f(H)}" role="img" aria-label="${esc(cap)}">`
    + `<defs><clipPath id="${id}-c"><rect x="${f(X(v[0]))}" y="${f(Y(v[3]))}" width="${f(dx * sc)}" height="${f(dy * sc)}"/></clipPath></defs>`
    + back.join("") + body.map(x => x.join("")).join("") + top.join("") + front.join("")
    + `</svg>${cap ? `<figcaption aria-hidden="true">${esc(cap)}</figcaption>` : ""}</figure>`;
}
