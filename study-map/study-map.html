а на многочлен","status":"ready","programmeRef":"Додавання, віднімання і множення многочленів.","lesson":{"what":"Щоб помножити одночлен на многочлен, множимо цей одночлен на <b>кожен<\/b> член многочлена і результати додаємо. Це розподільний закон множення, який ти вже знаєш: a(b + c) = ab + ac.","ideas":["Множимо по черзі на кожен член — так «розкриваємо дужки».","Знак члена множиться разом із ним: −2x · (−3) = 6x, бо мінус на мінус — плюс.","Однакові букви множимо, додаючи показники: x<sup>2<\/sup> · x<sup>3<\/sup> = x<sup>5<\/sup>.","Скільки членів у дужках, стільки й добутків. Порахуй, чи нічого не пропустив."],"rules":[{"f":"a(b + c − d) = ab + ac − ad","means":"Одночлен a множимо на кожен член у дужках і результати додаємо."}],"examples":[{"task":"Помнож: 3x(2x − 5).","steps":[{"do":"3x · 2x = 6x<sup>2<\/sup>","why":"Числа множимо: 3 · 2 = 6; x · x = x<sup>2<\/sup>."},{"do":"3x · (−5) = −15x","why":"Плюс на мінус — мінус."},{"do":"3x(2x − 5) = 6x<sup>2<\/sup> − 15x","why":"Записуємо обидва добутки."}],"answer":"Відповідь: 6x<sup>2<\/sup> − 15x."},{"task":"Помнож: −2a<sup>2<\/sup>(a<sup>2<\/sup> − 3ab + 4b).","steps":[{"do":"−2a<sup>2<\/sup> · a<sup>2<\/sup> = −2a<sup>4<\/sup>","why":"Показники a додаємо: 2 + 2 = 4."},{"do":"−2a<sup>2<\/sup> · (−3ab) = 6a<sup>3<\/sup>b","why":"Мінус на мінус — плюс; a<sup>2<\/sup> · a = a<sup>3<\/sup>."},{"do":"−2a<sup>2<\/sup> · 4b = −8a<sup>2<\/sup>b","why":"Мінус на плюс — мінус."},{"do":"−2a<sup>2<\/sup>(a<sup>2<\/sup> − 3ab + 4b) = −2a<sup>4<\/sup> + 6a<sup>3<\/sup>b − 8a<sup>2<\/sup>b","why":"Три члени в дужках — три добутки."}],"answer":"Відповідь: −2a<sup>4<\/sup> + 6a<sup>3<\/sup>b − 8a<sup>2<\/sup>b."},{"task":"Розв'яжи рівняння 4x(x − 3) − 2x(2x + 1) = 28.","steps":[{"do":"4x(x − 3) = 4x<sup>2<\/sup> − 12x","why":"Розкриваємо перші дужки."},{"do":"−2x(2x + 1) = −4x<sup>2<\/sup> − 2x","why":"Множимо на −2x разом зі знаком."},{"do":"4x<sup>2<\/sup> − 12x − 4x<sup>2<\/sup> − 2x = −14x","why":"4x<sup>2<\/sup> і −4x<sup>2<\/sup> дають нуль, −12x − 2x = −14x."},{"do":"−14x = 28; x = 28 : (−14) = −2","why":"Отримали лінійне рівняння."},{"do":"4 · (−2) · (−5) − 2 · (−2) · (−3) = 40 − 12 = 28","why":"Перевірка: підставляємо x = −2 у початкове рівняння."}],"answer":"Відповідь: x = −2."}],"mistakes":["Множать лише на перший член: 3x(2x − 5) = 6x<sup>2<\/sup> − 5. Правильно: множимо на кожен член — 6x<sup>2<\/sup> − 15x.","Гублять знак: −2a(a − 3) = −2a<sup>2<\/sup> − 6a. Правильно: −2a · (−3) = 6a, тож −2a<sup>2<\/sup> + 6a.","Множать показники: x<sup>2<\/sup> · x<sup>3<\/sup> = x<sup>6<\/sup>. Правильно: показники додаються — x<sup>5<\/sup>."],"check":[{"q":"Помнож: 5a(2a − 3b).","options":["10a<sup>2<\/sup> − 3b","10a − 15ab","10a<sup>2<\/sup> − 15ab","7a<sup>2<\/sup> − 15ab"],"correct":2,"a":"5a · 2a = 10a<sup>2<\/sup>; 5a · (−3b) = −15ab. Разом 10a<sup>2<\/sup> − 15ab."},{"q":"Пастка: спрости −3x(x − 4).","options":["−3x<sup>2<\/sup> − 12x","−3x<sup>2<\/sup> + 12x","3x<sup>2<\/sup> − 12x"],"correct":1,"a":"−3x · x = −3x<sup>2<\/sup>; −3x · (−4) = 12x — мінус на мінус дає плюс."},{"q":"Дві грядки мають однакову ширину x м. Довжина першої — (x + 4) м, другої — (6 − x) м. Їхня загальна площа x(x + 4) + x(6 − x) м<sup>2<\/sup>. Спрости вираз і знайди площу при x = 2,5.","accept":["25"],"a":"x<sup>2<\/sup> + 4x + 6x − x<sup>2<\/sup> = 10x. При x = 2,5: 10 · 2,5 = 25 м<sup>2<\/sup>."}]}},{"id":"A2.4.4","name":"Множення многочлена на многочлен","status":"ready","programmeRef":"Додавання, віднімання і множення многочленів.","lesson":{"what":"Щоб помножити многочлен на многочлен, множимо <b>кожен<\/b> член першого многочлена на <b>кожен<\/b> член другого і результати додаємо. Потім зводимо подібні члени.","ideas":["Двочлен на двочлен — 2 · 2 = 4 добутки; двочлен на тричлен — 2 · 3 = 6 добутків. Порахуй, чи нічого не пропустив.","Зручний порядок: перший член першої дужки множимо на всі члени другої, потім другий член — на всі.","Знак кожного добутку визначай окремо: мінус на мінус — плюс, мінус на плюс — мінус.","Після множення шукай подібні члени — вони майже завжди є."],"rules":[{"f":"(a + b)(c + d) = ac + ad + bc + bd","means":"Кожен член першої дужки множимо на кожен член другої."}],"examples":[{"task":"Помнож: (x + 3)(x + 5).","steps":[{"do":"(x + 3)(x + 5) = x · x + x · 5 + 3 · x + 3 · 5","why":"Кожен на кожен — 4 добутки."},{"do":"x · x + x · 5 + 3 · x + 3 · 5 = x<sup>2<\/sup> + 5x + 3x + 15","why":"Виконуємо множення."},{"do":"x<sup>2<\/sup> + 5x + 3x + 15 = x<sup>2<\/sup> + 8x + 15","why":"Зводимо подібні: 5x + 3x = 8x."}],"answer":"Відповідь: x<sup>2<\/sup> + 8x + 15."},{"task":"Помнож: (2a − 3)(a + 4).","steps":[{"do":"2a · a = 2a<sup>2<\/sup>; 2a · 4 = 8a","why":"Перший член 2a — на обидва члени другої дужки."},{"do":"−3 · a = −3a; −3 · 4 = −12","why":"Другий член −3 — теж на обидва, разом зі знаком."},{"do":"2a<sup>2<\/sup> + 8a − 3a − 12 = 2a<sup>2<\/sup> + 5a − 12","why":"Зводимо подібні: 8a − 3a = 5a."}],"answer":"Відповідь: 2a<sup>2<\/sup> + 5a − 12."},{"task":"Помнож: (x − 2)(x<sup>2<\/sup> + 3x − 1).","steps":[{"do":"x · (x<sup>2<\/sup> + 3x − 1) = x<sup>3<\/sup> + 3x<sup>2<\/sup> − x","why":"Перший член x — на кожен член тричлена."},{"do":"−2 · (x<sup>2<\/sup> + 3x − 1) = −2x<sup>2<\/sup> − 6x + 2","why":"Другий член −2 — теж на кожен. Мінус на мінус — плюс: −2 · (−1) = 2."},{"do":"x<sup>3<\/sup> + 3x<sup>2<\/sup> − x − 2x<sup>2<\/sup> − 6x + 2 = x<sup>3<\/sup> + x<sup>2<\/sup> − 7x + 2","why":"Усього 6 добутків. Зводимо подібні: 3x<sup>2<\/sup> − 2x<sup>2<\/sup> = x<sup>2<\/sup>, −x − 6x = −7x."}],"answer":"Відповідь: x<sup>3<\/sup> + x<sup>2<\/sup> − 7x + 2."}],"mistakes":["Множать лише перші й останні члени: (x + 3)(x + 5) = x<sup>2<\/sup> + 15. Правильно: 4 добутки — x<sup>2<\/sup> + 5x + 3x + 15 = x<sup>2<\/sup> + 8x + 15.","Гублять знак: (a − 2)(a − 3) = a<sup>2<\/sup> − 5a − 6. Правильно: (−2) · (−3) = 6, тож a<sup>2<\/sup> − 5a + 6.","Забувають звести подібні: x<sup>2<\/sup> + 5x + 3x + 15 — ще не кінець. Правильно: x<sup>2<\/sup> + 8x + 15."],"check":[{"q":"Помнож: (x − 4)(x + 2).","options":["x<sup>2<\/sup> − 8","x<sup>2<\/sup> − 2x − 8","x<sup>2<\/sup> + 2x − 8","x<sup>2<\/sup> − 6x − 8"],"correct":1,"a":"x<sup>2<\/sup> + 2x − 4x − 8 = x<sup>2<\/sup> − 2x − 8."},{"q":"Пастка: помнож (a − 3)(a − 5).","options":["a<sup>2<\/sup> − 8a − 15","a<sup>2<\/sup> + 15","a<sup>2<\/sup> − 8a + 15","a<sup>2<\/sup> − 2a + 15"],"correct":2,"a":"a<sup>2<\/sup> − 5a − 3a + 15 = a<sup>2<\/sup> − 8a + 15. (−3) · (−5) = 15 — з плюсом."},{"q":"Фото розміром x см на (x + 2) см вставили в рамку завширшки 3 см з кожного боку. Фото з рамкою має розміри (x + 6) см на (x + 8) см. Площа самої рамки (x + 6)(x + 8) − x(x + 2) см<sup>2<\/sup>. Спрости вираз і знайди площу рамки при x = 10.","accept":["168"],"a":"(x + 6)(x + 8) = x<sup>2<\/sup> + 14x + 48; x(x + 2) = x<sup>2<\/sup> + 2x. Різниця: 12x + 48. При x = 10: 120 + 48 = 168 см<sup>2<\/sup>."}]}}]},{"id":"A2.5","name":"Формули скороченого множення","what":"Готові формули, що прискорюють обчислення.","subtopics":[{"id":"A2.5.1","name":"Квадрат суми і квадрат різниці","status":"ready","programmeRef":"Формули квадрата двочлена","lesson":{"what":"<b>Формули скороченого множення<\/b> — готові результати множення, які трапляються дуже часто: з ними не треба множити «кожен на кожен». Перші дві — <b>квадрат суми<\/b> (a + b)<sup>2<\/sup> і <b>квадрат різниці<\/b> (a − b)<sup>2<\/sup>. Разом їх називають формулами квадрата двочлена.","ideas":["Звідки формула: (a + b)<sup>2<\/sup> = (a + b)(a + b) = a<sup>2<\/sup> + ab + ab + b<sup>2<\/sup> = a<sup>2<\/sup> + 2ab + b<sup>2<\/sup>.","Словами: квадрат першого виразу, плюс (або мінус) подвоєний добуток першого і другого, плюс квадрат другого.","Середній член 2ab не губи: (1 + 2)<sup>2<\/sup> = 9, а 1<sup>2<\/sup> + 2<sup>2<\/sup> = 5 — не те саме.","a і b можуть бути будь-якими виразами: у (3x − 2y)<sup>2<\/sup> перший вираз — 3x, другий — 2y.","Формули допомагають рахувати усно: 51<sup>2<\/sup> = (50 + 1)<sup>2<\/sup> = 2500 + 100 + 1 = 2601."],"rules":[{"f":"(a + b)<sup>2<\/sup> = a<sup>2<\/sup> + 2ab + b<sup>2<\/sup>","means":"Квадрат суми."},{"f":"(a − b)<sup>2<\/sup> = a<sup>2<\/sup> − 2ab + b<sup>2<\/sup>","means":"Квадрат різниці: мінус лише перед подвоєним добутком, b<sup>2<\/sup> — з плюсом."}],"examples":[{"task":"Піднеси до квадрата: (x + 4)<sup>2<\/sup>.","steps":[{"do":"Перший вираз — x, другий — 4","why":"Визначаємо, що в формулі означає a і b."},{"do":"(x + 4)<sup>2<\/sup> = x<sup>2<\/sup> + 2 · x · 4 + 4<sup>2<\/sup>","why":"Квадрат першого, подвоєний добуток, квадрат другого."},{"do":"x<sup>2<\/sup> + 2 · x · 4 + 4<sup>2<\/sup> = x<sup>2<\/sup> + 8x + 16","why":"Рахуємо: 2 · 4 = 8, 4<sup>2<\/sup> = 16."}],"answer":"Відповідь: x<sup>2<\/sup> + 8x + 16."},{"task":"Піднеси до квадрата: (3a − 2b)<sup>2<\/sup>.","steps":[{"do":"Перший вираз — 3a, другий — 2b","why":"Беремо цілі одночлени разом із числами."},{"do":"(3a − 2b)<sup>2<\/sup> = (3a)<sup>2<\/sup> − 2 · 3a · 2b + (2b)<sup>2<\/sup>","why":"Формула квадрата різниці."},{"do":"(3a)<sup>2<\/sup> − 2 · 3a · 2b + (2b)<sup>2<\/sup> = 9a<sup>2<\/sup> − 12ab + 4b<sup>2<\/sup>","why":"(3a)<sup>2<\/sup> = 9a<sup>2<\/sup> — до квадрата підносимо і число; 2 · 3 · 2 = 12."}],"answer":"Відповідь: 9a<sup>2<\/sup> − 12ab + 4b<sup>2<\/sup>."},{"task":"Обчисли зручним способом 99<sup>2<\/sup>.","steps":[{"do":"99<sup>2<\/sup> = (100 − 1)<sup>2<\/sup>","why":"99 близько до 100 — записуємо як різницю."},{"do":"(100 − 1)<sup>2<\/sup> = 100<sup>2<\/sup> − 2 · 100 · 1 + 1<sup>2<\/sup>","why":"Формула квадрата різниці."},{"do":"100<sup>2<\/sup> − 2 · 100 · 1 + 1<sup>2<\/sup> = 10 000 − 200 + 1 = 9801","why":"Усе легко рахується в голові."}],"answer":"Відповідь: 9801."}],"mistakes":["(a + b)<sup>2<\/sup> = a<sup>2<\/sup> + b<sup>2<\/sup>. Правильно: a<sup>2<\/sup> + 2ab + b<sup>2<\/sup> — не губи подвоєний добуток.","(3x)<sup>2<\/sup> = 3x<sup>2<\/sup>. Правильно: (3x)<sup>2<\/sup> = 9x<sup>2<\/sup> — до квадрата підносимо і число.","(a − b)<sup>2<\/sup> = a<sup>2<\/sup> − 2ab − b<sup>2<\/sup>. Правильно: a<sup>2<\/sup> − 2ab + b<sup>2<\/sup> — квадрат будь-якого числа не від'ємний, тож b<sup>2<\/sup> з плюсом."],"check":[{"q":"Піднеси до квадрата: (y − 5)<sup>2<\/sup>.","options":["y<sup>2<\/sup> − 25","y<sup>2<\/sup> − 10y + 25","y<sup>2<\/sup> − 5y + 25","y<sup>2<\/sup> + 10y − 25"],"correct":1,"a":"y<sup>2<\/sup> − 2 · y · 5 + 5<sup>2<\/sup> = y<sup>2<\/sup> − 10y + 25."},{"q":"Пастка: піднеси до квадрата (2x + 3)<sup>2<\/sup>.","options":["4x<sup>2<\/sup> + 9","2x<sup>2<\/sup> + 12x + 9","4x<sup>2<\/sup> + 6x + 9","4x<sup>2<\/sup> + 12x + 9"],"correct":3,"a":"(2x)<sup>2<\/sup> + 2 · 2x · 3 + 3<sup>2<\/sup> = 4x<sup>2<\/sup> + 12x + 9. Не губи подвоєний добуток і підноси до квадрата число 2."},{"q":"Обчисли зручним способом 101<sup>2<\/sup>, записавши 101 = 100 + 1.","accept":["10201"],"a":"(100 + 1)<sup>2<\/sup> = 10 000 + 2 · 100 · 1 + 1 = 10 201."}]}},{"id":"A2.5.2","name":"Різниця квадратів","status":"ready","programmeRef":"різниці квадратів","lesson":{"what":"Добуток різниці двох виразів на їхню суму дорівнює <b>різниці квадратів<\/b> цих виразів: (a − b)(a + b) = a<sup>2<\/sup> − b<sup>2<\/sup>. Середні члени взаємно знищуються, тому відповідь така коротка.","ideas":["Перевір множенням: (a − b)(a + b) = a<sup>2<\/sup> + ab − ab − b<sup>2<\/sup> = a<sup>2<\/sup> − b<sup>2<\/sup>.","Як упізнати: в обох дужках ті самі два вирази, але в одній між ними «−», а в іншій «+».","Порядок дужок не важливий: (a + b)(a − b) — теж a<sup>2<\/sup> − b<sup>2<\/sup>.","Формулу читають і навпаки: a<sup>2<\/sup> − b<sup>2<\/sup> = (a − b)(a + b). Це знадобиться для розкладання на множники.","Зручно для обчислень: 51 · 49 = (50 + 1)(50 − 1) = 2500 − 1 = 2499."],"rules":[{"f":"(a − b)(a + b) = a<sup>2<\/sup> − b<sup>2<\/sup>","means":"Добуток різниці й суми двох виразів — квадрат першого мінус квадрат другого."}],"examples":[{"task":"Помнож: (x − 6)(x + 6).","steps":[{"do":"Вирази x і 6; в одній дужці «−», в іншій «+»","why":"Це формула різниці квадратів."},{"do":"(x − 6)(x + 6) = x<sup>2<\/sup> − 6<sup>2<\/sup>","why":"Квадрат першого мінус квадрат другого."},{"do":"x<sup>2<\/sup> − 6<sup>2<\/sup> = x<sup>2<\/sup> − 36","why":"6<sup>2<\/sup> = 36."}],"answer":"Відповідь: x<sup>2<\/sup> − 36."},{"task":"Помнож: (5a + 2b)(5a − 2b).","steps":[{"do":"Вирази 5a і 2b; знаки в дужках різні","why":"Формула працює, хоч дужка з «+» стоїть першою."},{"do":"(5a + 2b)(5a − 2b) = (5a)<sup>2<\/sup> − (2b)<sup>2<\/sup>","why":"Квадрат першого мінус квадрат другого."},{"do":"(5a)<sup>2<\/sup> − (2b)<sup>2<\/sup> = 25a<sup>2<\/sup> − 4b<sup>2<\/sup>","why":"До квадрата підносимо і числа: 5<sup>2<\/sup> = 25, 2<sup>2<\/sup> = 4."}],"answer":"Відповідь: 25a<sup>2<\/sup> − 4b<sup>2<\/sup>."},{"task":"Обчисли зручним способом 52 · 48.","steps":[{"do":"52 · 48 = (50 + 2)(50 − 2)","why":"Обидва числа на 2 відрізняються від 50."},{"do":"(50 + 2)(50 − 2) = 50<sup>2<\/sup> − 2<sup>2<\/sup>","why":"Формула різниці квадратів."},{"do":"50<sup>2<\/sup> − 2<sup>2<\/sup> = 2500 − 4 = 2496","why":"Рахуємо усно."}],"answer":"Відповідь: 2496."}],"mistakes":["(x − 3)(x + 3) = x<sup>2<\/sup> + 9 чи x<sup>2<\/sup> − 6x − 9. Правильно: x<sup>2<\/sup> − 9 — середні члени знищуються, а квадрат другого — з мінусом.","(4y − 1)(4y + 1) = 4y<sup>2<\/sup> − 1. Правильно: (4y)<sup>2<\/sup> = 16y<sup>2<\/sup>, тож 16y<sup>2<\/sup> − 1.","Застосовують формулу до (x − 3)(x − 3). Правильно: тут знаки однакові — це (x − 3)<sup>2<\/sup> = x<sup>2<\/sup> − 6x + 9."],"check":[{"q":"Помнож: (m + 7)(m − 7).","options":["m<sup>2<\/sup> − 49","m<sup>2<\/sup> + 49","m<sup>2<\/sup> − 14","m<sup>2<\/sup> − 14m − 49"],"correct":0,"a":"m<sup>2<\/sup> − 7<sup>2<\/sup> = m<sup>2<\/sup> − 49."},{"q":"Пастка: помнож (3x − 1)(3x + 1).","options":["3x<sup>2<\/sup> − 1","9x<sup>2<\/sup> − 1","9x<sup>2<\/sup> + 1","9x<sup>2<\/sup> − 6x − 1"],"correct":1,"a":"(3x)<sup>2<\/sup> − 1<sup>2<\/sup> = 9x<sup>2<\/sup> − 1. Число 3 теж підносимо до квадрата."},{"q":"Квадратну ділянку зі стороною 40 м переробили: одну сторону збільшили на 3 м, а іншу зменшили на 3 м. Яка площа нової ділянки в м<sup>2<\/sup>?","accept":["1591"],"a":"(40 + 3)(40 − 3) = 40<sup>2<\/sup> − 3<sup>2<\/sup> = 1600 − 9 = 1591 м<sup>2<\/sup>. Цікаво: площа стала на 9 м<sup>2<\/sup> меншою, ніж була (1600 м<sup>2<\/sup>)."}]}},{"id":"A2.5.3","name":"Сума і різниця кубів","status":"ready","programmeRef":"суми і різниці кубів.","lesson":{"what":"<b>Сума кубів<\/b> a<sup>3<\/sup> + b<sup>3<\/sup> і <b>різниця кубів<\/b> a<sup>3<\/sup> − b<sup>3<\/sup> записуються як добуток двох множників. Другий множник — <b>неповний квадрат<\/b> різниці чи суми: a<sup>2<\/sup> − ab + b<sup>2<\/sup> або a<sup>2<\/sup> + ab + b<sup>2<\/sup>. «Неповний» — бо в ньому ab, а не 2ab.","ideas":["Перевір множенням: (a + b)(a<sup>2<\/sup> − ab + b<sup>2<\/sup>) = a<sup>3<\/sup> − a<sup>2<\/sup>b + ab<sup>2<\/sup> + a<sup>2<\/sup>b − ab<sup>2<\/sup> + b<sup>3<\/sup> = a<sup>3<\/sup> + b<sup>3<\/sup>.","Знаки: у першій дужці той самий знак, що між кубами, а перед ab — протилежний. Останній член b<sup>2<\/sup> — завжди з плюсом.","Корисно пам'ятати куби: 1, 8, 27, 64, 125, 216, 343, 512, 729, 1000. Наприклад, 8x<sup>3<\/sup> = (2x)<sup>3<\/sup>.","Формули читають в обидва боки: (a − b)(a<sup>2<\/sup> + ab + b<sup>2<\/sup>) = a<sup>3<\/sup> − b<sup>3<\/sup> — так довге множення стає коротким.","Сума кубів і куб суми — різні речі: 1<sup>3<\/sup> + 1<sup>3<\/sup> = 2, а (1 + 1)<sup>3<\/sup> = 8."],"rules":[{"f":"a<sup>3<\/sup> + b<sup>3<\/sup> = (a + b)(a<sup>2<\/sup> − ab + b<sup>2<\/sup>)","means":"Сума кубів: сума виразів на неповний квадрат їхньої різниці."},{"f":"a<sup>3<\/sup> − b<sup>3<\/sup> = (a − b)(a<sup>2<\/sup> + ab + b<sup>2<\/sup>)","means":"Різниця кубів: різниця виразів на неповний квадрат їхньої суми."}],"examples":[{"task":"Розклади на множники x<sup>3<\/sup> + 8.","steps":[{"do":"x<sup>3<\/sup> + 8 = x<sup>3<\/sup> + 2<sup>3<\/sup>","why":"8 = 2<sup>3<\/sup>, тож це сума кубів: перший вираз x, другий 2."},{"do":"x<sup>3<\/sup> + 2<sup>3<\/sup> = (x + 2)(x<sup>2<\/sup> − x · 2 + 2<sup>2<\/sup>)","why":"Формула суми кубів."},{"do":"(x + 2)(x<sup>2<\/sup> − x · 2 + 2<sup>2<\/sup>) = (x + 2)(x<sup>2<\/sup> − 2x + 4)","why":"Спрощуємо другу дужку."}],"answer":"Відповідь: (x + 2)(x<sup>2<\/sup> − 2x + 4)."},{"task":"Спрости вираз (a − 3)(a<sup>2<\/sup> + 3a + 9).","steps":[{"do":"Друга дужка: a<sup>2<\/sup> + a · 3 + 3<sup>2<\/sup> — неповний квадрат суми a і 3","why":"Перша дужка — різниця a і 3, отже маємо формулу різниці кубів."},{"do":"(a − 3)(a<sup>2<\/sup> + 3a + 9) = a<sup>3<\/sup> − 3<sup>3<\/sup>","why":"Читаємо формулу справа наліво."},{"do":"a<sup>3<\/sup> − 3<sup>3<\/sup> = a<sup>3<\/sup> − 27","why":"3<sup>3<\/sup> = 27."}],"answer":"Відповідь: a<sup>3<\/sup> − 27."},{"task":"Розклади на множники 27m<sup>3<\/sup> − 1.","steps":[{"do":"27m<sup>3<\/sup> − 1 = (3m)<sup>3<\/sup> − 1<sup>3<\/sup>","why":"27m<sup>3<\/sup> = (3m)<sup>3<\/sup>, а 1 = 1<sup>3<\/sup> — різниця кубів."},{"do":"(3m)<sup>3<\/sup> − 1<sup>3<\/sup> = (3m − 1)((3m)<sup>2<\/sup> + 3m · 1 + 1<sup>2<\/sup>)","why":"Формула різниці кубів: перший вираз 3m, другий 1."},{"do":"(3m − 1)((3m)<sup>2<\/sup> + 3m · 1 + 1<sup>2<\/sup>) = (3m − 1)(9m<sup>2<\/sup> + 3m + 1)","why":"(3m)<sup>2<\/sup> = 9m<sup>2<\/sup>."}],"answer":"Відповідь: (3m − 1)(9m<sup>2<\/sup> + 3m + 1)."}],"mistakes":["Пишуть у дужці подвоєний добуток: x<sup>3<\/sup> + 8 = (x + 2)(x<sup>2<\/sup> − 4x + 4). Правильно: у неповному квадраті — просто добуток: (x + 2)(x<sup>2<\/sup> − 2x + 4).","Плутають знаки: a<sup>3<\/sup> − b<sup>3<\/sup> = (a − b)(a<sup>2<\/sup> − ab + b<sup>2<\/sup>). Правильно: (a − b)(a<sup>2<\/sup> + ab + b<sup>2<\/sup>) — перед ab знак протилежний до знака в першій дужці.","Плутають суму кубів із кубом суми: a<sup>3<\/sup> + b<sup>3<\/sup> = (a + b)<sup>3<\/sup>. Правильно: a<sup>3<\/sup> + b<sup>3<\/sup> = (a + b)(a<sup>2<\/sup> − ab + b<sup>2<\/sup>)."],"check":[{"q":"Розклади на множники y<sup>3<\/sup> − 1.","options":["(y − 1)(y<sup>2<\/sup> − y + 1)","(y − 1)<sup>3<\/sup>","(y − 1)(y<sup>2<\/sup> + y + 1)","(y + 1)(y<sup>2<\/sup> + y + 1)"],"correct":2,"a":"y<sup>3<\/sup> − 1<sup>3<\/sup> = (y − 1)(y<sup>2<\/sup> + y · 1 + 1<sup>2<\/sup>) = (y − 1)(y<sup>2<\/sup> + y + 1)."},{"q":"Пастка: чому дорівнює (x + 4)(x<sup>2<\/sup> − 4x + 16)?","options":["x<sup>3<\/sup> + 64","(x + 4)<sup>3<\/sup>","x<sup>3<\/sup> − 64","x<sup>3<\/sup> + 16"],"correct":0,"a":"Це сума кубів, прочитана справа наліво: x<sup>3<\/sup> + 4<sup>3<\/sup> = x<sup>3<\/sup> + 64. А не куб суми (x + 4)<sup>3<\/sup>."},{"q":"Знайди значення виразу (a + 2)(a<sup>2<\/sup> − 2a + 4) − a<sup>3<\/sup> при a = 17.","accept":["8"],"a":"(a + 2)(a<sup>2<\/sup> − 2a + 4) = a<sup>3<\/sup> + 8, тож вираз дорівнює a<sup>3<\/sup> + 8 − a<sup>3<\/sup> = 8 — при будь-якому a, і при a = 17 теж."}]}}]},{"id":"A2.6","name":"Розкладання многочленів на множники","what":"Як перетворити суму на добуток.","subtopics":[{"id":"A2.6.1","name":"Винесення спільного множника за дужки","status":"ready","programmeRef":"Розкладання многочленів на множники","lesson":{"what":"<b>Розкласти многочлен на множники<\/b> — означає записати його як добуток. Найпростіший спосіб — <b>винести спільний множник за дужки<\/b>. Це розподільний закон, прочитаний справа наліво: ab + ac = a(b + c).","ideas":["Як знайти спільний множник: число — найбільший спільний дільник (НСД) коефіцієнтів; букви — ті, що є в <b>кожному<\/b> члені, з найменшим показником.","У дужках залишається те, що виходить, коли кожен член поділити на винесений множник.","Якщо член збігається зі спільним множником, у дужках на його місці — 1: 4a<sup>2<\/sup> + a = a(4a + 1).","Спільним множником може бути й вираз у дужках: x(a + b) + 3(a + b) = (a + b)(x + 3).","Перевір себе: розкрий дужки — має вийти початковий многочлен."],"rules":[{"f":"ab + ac = a(b + c)","means":"Спільний множник a виносимо за дужки, у дужках — те, що залишилося від кожного члена."}],"examples":[{"task":"Розклади на множники 6x<sup>2<\/sup> − 9x.","steps":[{"do":"Спільний множник: 3x","why":"НСД(6; 9) = 3, і x є в обох членах (найменший показник — 1)."},{"do":"6x<sup>2<\/sup> = 3x · 2x; 9x = 3x · 3","why":"Ділимо кожен член на 3x."},{"do":"6x<sup>2<\/sup> − 9x = 3x(2x − 3)","why":"Записуємо добуток."},{"do":"3x · 2x − 3x · 3 = 6x<sup>2<\/sup> − 9x","why":"Перевірка: розкрили дужки — вийшов початковий многочлен."}],"answer":"Відповідь: 3x(2x − 3)."},{"task":"Розклади на множники 4a<sup>3<\/sup>b − 8a<sup>2<\/sup>b<sup>2<\/sup> + 12a<sup>2<\/sup>b.","steps":[{"do":"Спільний множник: 4a<sup>2<\/sup>b","why":"НСД(4; 8; 12) = 4; a є в кожному члені щонайменше в квадраті, b — у першому степені."},{"do":"4a<sup>3<\/sup>b − 8a<sup>2<\/sup>b<sup>2<\/sup> + 12a<sup>2<\/sup>b = 4a<sup>2<\/sup>b(a − 2b + 3)","why":"Ділимо кожен член на 4a<sup>2<\/sup>b: виходить a, 2b і 3."},{"do":"4a<sup>2<\/sup>b · a − 4a<sup>2<\/sup>b · 2b + 4a<sup>2<\/sup>b · 3 = 4a<sup>3<\/sup>b − 8a<sup>2<\/sup>b<sup>2<\/sup> + 12a<sup>2<\/sup>b","why":"Перевірка множенням."}],"answer":"Відповідь: 4a<sup>2<\/sup>b(a − 2b + 3)."},{"task":"Розв'яжи рівняння x<sup>2<\/sup> − 7x = 0.","steps":[{"do":"x<sup>2<\/sup> − 7x = x(x − 7)","why":"Виносимо спільний множник x."},{"do":"x(x − 7) = 0","why":"Тепер ліва частина — добуток."},{"do":"x = 0 або x − 7 = 0","why":"Добуток дорівнює нулю, коли хоча б один множник дорівнює нулю."},{"do":"x = 0 або x = 7","why":"Розв'язуємо кожне рівняння."}],"answer":"Відповідь: x = 0 або x = 7."}],"mistakes":["Виносять не весь спільний множник: 6x<sup>2<\/sup> − 9x = 3(2x<sup>2<\/sup> − 3x). Рівність правильна, але розкладання не закінчене — у дужках ще є спільний x. Правильно: 3x(2x − 3).","Забувають 1: 4a<sup>2<\/sup> + a = a · 4a. Правильно: a = a · 1, тож 4a<sup>2<\/sup> + a = a(4a + 1).","Ділять рівняння x<sup>2<\/sup> = 7x на x і отримують лише x = 7. Так губиться корінь 0. Правильно: x<sup>2<\/sup> − 7x = 0, x(x − 7) = 0, x = 0 або x = 7."],"check":[{"q":"Розклади на множники 12a<sup>2<\/sup> + 18ab.","options":["6a(2a + 3ab)","6a(2a + 3b)","6a(2a<sup>2<\/sup> + 3b)","6a(12a + 18b)"],"correct":1,"a":"НСД(12; 18) = 6, a є в обох членах. 12a<sup>2<\/sup> : 6a = 2a, 18ab : 6a = 3b. Разом 6a(2a + 3b)."},{"q":"Пастка: скільки коренів має рівняння x<sup>2<\/sup> = 5x?","options":["Два: x = 0 і x = 5","Один: x = 5","Жодного"],"correct":0,"a":"x<sup>2<\/sup> − 5x = 0, x(x − 5) = 0, тож x = 0 або x = 5. Якщо поділити на x, корінь 0 загубиться."},{"q":"Обчисли зручним способом 37 · 64 + 37 · 36.","accept":["3700"],"a":"Виносимо 37: 37 · (64 + 36) = 37 · 100 = 3700."}]}},{"id":"A2.6.2","name":"Спосіб групування","status":"ready","programmeRef":"Розкладання многочленів на множники","lesson":{"what":"Буває, що спільного множника в усіх членів немає, але він з'являється, якщо об'єднати члени в <b>групи<\/b>. <b>Спосіб групування<\/b>: групуємо члени, у кожній групі виносимо спільний множник, а потім виносимо спільну дужку.","ideas":["Після винесення в групах мають вийти <b>однакові<\/b> дужки — тоді їх виносимо як спільний множник.","Якщо перед групою стоїть мінус, у дужках змінюємо знаки: −b + 3 = −(b − 3).","Якщо дужки вийшли протилежні, наприклад (x − 2) і (2 − x), пам'ятай: 2 − x = −(x − 2).","Групувати можна по-різному. Не вийшли однакові дужки — спробуй згрупувати інакше."],"rules":[{"f":"ax + ay + bx + by = a(x + y) + b(x + y) = (x + y)(a + b)","means":"Групуємо, у кожній групі виносимо спільний множник, потім виносимо спільну дужку."}],"examples":[{"task":"Розклади на множники ax + ay + 5x + 5y.","steps":[{"do":"ax + ay + 5x + 5y = (ax + ay) + (5x + 5y)","why":"Групуємо по два члени."},{"do":"(ax + ay) + (5x + 5y) = a(x + y) + 5(x + y)","why":"У кожній групі виносимо свій спільний множник."},{"do":"a(x + y) + 5(x + y) = (x + y)(a + 5)","why":"Дужка (x + y) — спільний множник."}],"answer":"Відповідь: (x + y)(a + 5)."},{"task":"Розклади на множники x<sup>3<\/sup> − 2x<sup>2<\/sup> + 3x − 6.","steps":[{"do":"x<sup>3<\/sup> − 2x<sup>2<\/sup> + 3x − 6 = (x<sup>3<\/sup> − 2x<sup>2<\/sup>) + (3x − 6)","why":"Групуємо перші два і останні два члени."},{"do":"(x<sup>3<\/sup> − 2x<sup>2<\/sup>) + (3x − 6) = x<sup>2<\/sup>(x − 2) + 3(x − 2)","why":"З першої групи виносимо x<sup>2<\/sup>, з другої — 3."},{"do":"x<sup>2<\/sup>(x − 2) + 3(x − 2) = (x − 2)(x<sup>2<\/sup> + 3)","why":"Виносимо спільну дужку (x − 2)."}],"answer":"Відповідь: (x − 2)(x<sup>2<\/sup> + 3)."},{"task":"Розклади на множники 2ab − 6a − b + 3.","steps":[{"do":"2ab − 6a − b + 3 = (2ab − 6a) − (b − 3)","why":"Перед другою групою мінус, тому в дужках змінюємо знаки: −b + 3 = −(b − 3)."},{"do":"(2ab − 6a) − (b − 3) = 2a(b − 3) − (b − 3)","why":"З першої групи виносимо 2a."},{"do":"2a(b − 3) − (b − 3) = (b − 3)(2a − 1)","why":"Виносимо (b − 3). Від другої групи залишається −1, бо (b − 3) = (b − 3) · 1."},{"do":"(b − 3) · 2a − (b − 3) · 1 = 2ab − 6a − b + 3","why":"Перевірка множенням."}],"answer":"Відповідь: (b − 3)(2a − 1)."}],"mistakes":["Губляють 1: 2a(b − 3) − (b − 3) = (b − 3) · 2a. Правильно: (b − 3)(2a − 1).","Не змінюють знак у групі з мінусом: 2ab − 6a − b + 3 = (2ab − 6a) − (b + 3). Правильно: −b + 3 = −(b − 3).","Зупиняються на півдорозі: a(x + y) + 5(x + y) — це ще сума, а не добуток. Треба винести спільну дужку: (x + y)(a + 5)."],"check":[{"q":"Розклади на множники mn + 3m + 2n + 6.","options":["(n + 2)(m + 3)","(n + 3)(m + 2)","(n + 3)(m + 6)"],"correct":1,"a":"(mn + 3m) + (2n + 6) = m(n + 3) + 2(n + 3) = (n + 3)(m + 2)."},{"q":"Пастка: розклади на множники xy − 4x − y + 4.","options":["(y − 4)(x − 1)","(y − 4)(x + 1)","(y + 4)(x − 1)","x(y − 4)"],"correct":0,"a":"(xy − 4x) − (y − 4) = x(y − 4) − (y − 4) = (y − 4)(x − 1). Мінус перед групою змінює знаки в дужках, а від неї залишається −1."},{"q":"Обчисли зручним способом 17 · 23 + 17 · 7 + 13 · 23 + 13 · 7.","accept":["900"],"a":"17 · (23 + 7) + 13 · (23 + 7) = (23 + 7)(17 + 13) = 30 · 30 = 900."}]}},{"id":"A2.6.3","name":"Розкладання за формулами скороченого множення","status":"ready","programmeRef":"Розкладання многочленів на множники","lesson":{"what":"Формули скороченого множення, прочитані справа наліво, розкладають многочлен на множники. Головне — впізнати формулу: різниця квадратів, квадрат двочлена чи сума (різниця) кубів.","ideas":["Два члени, обидва — квадрати (x<sup>2<\/sup>, 9, 25y<sup>2<\/sup>), а між ними мінус: різниця квадратів.","Три члени: два з них — квадрати a<sup>2<\/sup> і b<sup>2<\/sup>, а третій — подвоєний добуток 2ab (з плюсом чи мінусом): квадрат двочлена. Середній член перевіряй обов'язково!","Два члени, обидва — куби (x<sup>3<\/sup>, 8, 27a<sup>3<\/sup>): сума чи різниця кубів.","Сума квадратів, наприклад x<sup>2<\/sup> + 9, за цими формулами на множники не розкладається."],"rules":[{"f":"a<sup>2<\/sup> − b<sup>2<\/sup> = (a − b)(a + b)","means":"Різниця квадратів."},{"f":"a<sup>2<\/sup> + 2ab + b<sup>2<\/sup> = (a + b)<sup>2<\/sup>; a<sup>2<\/sup> − 2ab + b<sup>2<\/sup> = (a − b)<sup>2<\/sup>","means":"Тричлен, що є квадратом двочлена."},{"f":"a<sup>3<\/sup> + b<sup>3<\/sup> = (a + b)(a<sup>2<\/sup> − ab + b<sup>2<\/sup>); a<sup>3<\/sup> − b<sup>3<\/sup> = (a − b)(a<sup>2<\/sup> + ab + b<sup>2<\/sup>)","means":"Сума і різниця кубів."}],"examples":[{"task":"Розклади на множники 16x<sup>2<\/sup> − 25.","steps":[{"do":"16x<sup>2<\/sup> = (4x)<sup>2<\/sup>; 25 = 5<sup>2<\/sup>","why":"Обидва члени — квадрати, між ними мінус."},{"do":"16x<sup>2<\/sup> − 25 = (4x)<sup>2<\/sup> − 5<sup>2<\/sup>","why":"Це різниця квадратів."},{"do":"(4x)<sup>2<\/sup> − 5<sup>2<\/sup> = (4x − 5)(4x + 5)","why":"Застосовуємо формулу."}],"answer":"Відповідь: (4x − 5)(4x + 5)."},{"task":"Розклади на множники y<sup>2<\/sup> − 12y + 36.","steps":[{"do":"y<sup>2<\/sup> — квадрат y; 36 = 6<sup>2<\/sup>","why":"Крайні члени — квадрати виразів y і 6."},{"do":"2 · y · 6 = 12y","why":"Середній член — подвоєний добуток, і він з мінусом. Отже, це квадрат різниці."},{"do":"y<sup>2<\/sup> − 12y + 36 = (y − 6)<sup>2<\/sup>","why":"Записуємо квадрат двочлена."}],"answer":"Відповідь: (y − 6)<sup>2<\/sup>."},{"task":"Розклади на множники a<sup>3<\/sup> + 125.","steps":[{"do":"a<sup>3<\/sup> + 125 = a<sup>3<\/sup> + 5<sup>3<\/sup>","why":"125 = 5<sup>3<\/sup>, тож це сума кубів."},{"do":"a<sup>3<\/sup> + 5<sup>3<\/sup> = (a + 5)(a<sup>2<\/sup> − a · 5 + 5<sup>2<\/sup>)","why":"Формула суми кубів."},{"do":"(a + 5)(a<sup>2<\/sup> − a · 5 + 5<sup>2<\/sup>) = (a + 5)(a<sup>2<\/sup> − 5a + 25)","why":"Спрощуємо неповний квадрат."}],"answer":"Відповідь: (a + 5)(a<sup>2<\/sup> − 5a + 25)."}],"mistakes":["x<sup>2<\/sup> + 9 = (x − 3)(x + 3). Правильно: (x − 3)(x + 3) = x<sup>2<\/sup> − 9. Сума квадратів так не розкладається.","x<sup>2<\/sup> + 4x + 16 = (x + 4)<sup>2<\/sup>. Правильно: (x + 4)<sup>2<\/sup> = x<sup>2<\/sup> + 8x + 16. Середній член 4x не дорівнює 8x, тож це не квадрат двочлена.","25 − y<sup>2<\/sup> = (y − 5)(y + 5). Правильно: перший вираз тут 5, тож 25 − y<sup>2<\/sup> = (5 − y)(5 + y)."],"check":[{"q":"Розклади на множники 9a<sup>2<\/sup> − 49b<sup>2<\/sup>.","options":["(9a − 7b)(9a + 7b)","(3a − 7b)<sup>2<\/sup>","(3a − 7b)(3a + 7b)"],"correct":2,"a":"9a<sup>2<\/sup> = (3a)<sup>2<\/sup>, 49b<sup>2<\/sup> = (7b)<sup>2<\/sup>. Різниця квадратів: (3a − 7b)(3a + 7b)."},{"q":"Пастка: який тричлен можна записати як квадрат двочлена?","options":["x<sup>2<\/sup> + 6x + 9","x<sup>2<\/sup> + 3x + 9","x<sup>2<\/sup> + 6x − 9","x<sup>2<\/sup> + 9x + 9"],"correct":0,"a":"x<sup>2<\/sup> + 6x + 9 = (x + 3)<sup>2<\/sup>, бо 2 · x · 3 = 6x. У x<sup>2<\/sup> + 3x + 9 середній член не той, а в x<sup>2<\/sup> + 6x − 9 число 9 з мінусом — це не квадрат."},{"q":"Обчисли зручним способом 67<sup>2<\/sup> − 33<sup>2<\/sup>.","accept":["3400"],"a":"(67 − 33)(67 + 33) = 34 · 100 = 3400."}]}},{"id":"A2.6.4","name":"Кілька способів разом","status":"ready","programmeRef":"Розкладання многочленів на множники","lesson":{"what":"Часто одного способу розкладання мало. Тоді застосовуємо кілька способів по черзі: спершу виносимо спільний множник, а те, що залишилося в дужках, розкладаємо за формулою чи групуванням.","ideas":["Порядок дій: спершу винеси спільний множник, якщо він є. Потім подивись, чи не формула те, що залишилося в дужках. Якщо членів чотири — спробуй групування.","Розкладай до кінця: перевір кожен множник — чи не розкладається він далі.","Групування може привести до формули: x<sup>2<\/sup> − 9 + x − 3 = (x − 3)(x + 3) + (x − 3) = (x − 3)(x + 4).","Перевірка: перемнож усі множники — має вийти початковий многочлен."],"rules":[{"f":"ab<sup>2<\/sup> − ac<sup>2<\/sup> = a(b<sup>2<\/sup> − c<sup>2<\/sup>) = a(b − c)(b + c)","means":"Спершу виносимо спільний множник, потім розкладаємо дужку за формулою."}],"examples":[{"task":"Розклади на множники 5x<sup>2<\/sup> − 20.","steps":[{"do":"5x<sup>2<\/sup> − 20 = 5(x<sup>2<\/sup> − 4)","why":"Спершу виносимо спільний множник 5."},{"do":"x<sup>2<\/sup> − 4 = x<sup>2<\/sup> − 2<sup>2<\/sup>","why":"У дужках — різниця квадратів."},{"do":"5(x<sup>2<\/sup> − 4) = 5(x − 2)(x + 2)","why":"Розкладаємо за формулою."}],"answer":"Відповідь: 5(x − 2)(x + 2)."},{"task":"Розклади на множники 2a<sup>3<\/sup> − 12a<sup>2<\/sup> + 18a.","steps":[{"do":"2a<sup>3<\/sup> − 12a<sup>2<\/sup> + 18a = 2a(a<sup>2<\/sup> − 6a + 9)","why":"Спільний множник 2a."},{"do":"a<sup>2<\/sup> − 6a + 9 = a<sup>2<\/sup> − 2 · a · 3 + 3<sup>2<\/sup>","why":"У дужках — квадрат різниці: a<sup>2<\/sup>, 3<sup>2<\/sup> і подвоєний добуток 2 · a · 3 = 6a."},{"do":"2a(a<sup>2<\/sup> − 6a + 9) = 2a(a − 3)<sup>2<\/sup>","why":"Записуємо квадрат двочлена."}],"answer":"Відповідь: 2a(a − 3)<sup>2<\/sup>."},{"task":"Розклади на множники x<sup>3<\/sup> − 3x<sup>2<\/sup> − 4x + 12.","steps":[{"do":"x<sup>3<\/sup> − 3x<sup>2<\/sup> − 4x + 12 = (x<sup>3<\/sup> − 3x<sup>2<\/sup>) − (4x − 12)","why":"Групуємо. Перед другою групою мінус — змінюємо знаки в дужках."},{"do":"(x<sup>3<\/sup> − 3x<sup>2<\/sup>) − (4x − 12) = x<sup>2<\/sup>(x − 3) − 4(x − 3)","why":"У кожній групі виносимо спільний множник."},{"do":"x<sup>2<\/sup>(x − 3) − 4(x − 3) = (x − 3)(x<sup>2<\/sup> − 4)","why":"Виносимо спільну дужку."},{"do":"(x − 3)(x<sup>2<\/sup> − 4) = (x − 3)(x − 2)(x + 2)","why":"x<sup>2<\/sup> − 4 — різниця квадратів, розкладаємо до кінця."}],"answer":"Відповідь: (x − 3)(x − 2)(x + 2)."}],"mistakes":["Зупиняються після першого кроку: 5x<sup>2<\/sup> − 20 = 5(x<sup>2<\/sup> − 4). Правильно: дужку можна розкласти далі — 5(x − 2)(x + 2).","Пропускають спільний множник і шукають формулу там, де її не видно: 2a<sup>3<\/sup> − 12a<sup>2<\/sup> + 18a — не квадрат двочлена. Правильно: спершу винеси 2a, а вже тоді впізнаєш формулу: 2a(a − 3)<sup>2<\/sup>.","Губляють спільний множник у відповіді: 3y<sup>3<\/sup> − 27y = (y − 3)(y + 3). Правильно: 3y(y − 3)(y + 3)."],"check":[{"q":"Розклади на множники 3y<sup>3<\/sup> − 27y.","options":["3y(y − 3)<sup>2<\/sup>","3(y<sup>3<\/sup> − 9)","3y(y − 9)(y + 9)","3y(y − 3)(y + 3)"],"correct":3,"a":"3y<sup>3<\/sup> − 27y = 3y(y<sup>2<\/sup> − 9) = 3y(y − 3)(y + 3)."},{"q":"Пастка: Оленка записала 4x<sup>2<\/sup> − 16 = (2x − 4)(2x + 4). Чи розклала вона многочлен до кінця?","options":["Так, далі розкладати нічого","Ні, з кожної дужки можна винести 2: 4(x − 2)(x + 2)"],"correct":1,"a":"Рівність правильна, але в дужках є спільний множник 2: (2x − 4)(2x + 4) = 2(x − 2) · 2(x + 2) = 4(x − 2)(x + 2). Зручніше одразу винести 4: 4(x<sup>2<\/sup> − 4)."},{"q":"Розв'яжи рівняння x<sup>3<\/sup> − 25x = 0. Скільки коренів воно має?","accept":["3"],"a":"x(x<sup>2<\/sup> − 25) = 0, x(x − 5)(x + 5) = 0. Корені: 0, 5 і −5 — три корені."}]}}]}]},{"id":"A3","subject":"algebra","name":"Функції","what":"Як одна величина залежить від іншої. Учимося читати й будувати графіки.","topics":[{"id":"A3.1","name":"Функція","what":"Залежність, у якій кожному значенню аргументу відповідає одне значення функції.","subtopics":[{"id":"A3.1.1","name":"Функціональна залежність","status":"ready","programmeRef":"Функціональна залежність між величинами як математична модель реальних процесів.","lesson":{"what":"Часто одна величина залежить від іншої: вартість покупки — від кількості товару, шлях — від часу руху. <b>Функціональна залежність<\/b>, або <b>функція<\/b>, — це така залежність змінної y від змінної x, при якій <b>кожному<\/b> значенню x відповідає <b>єдине<\/b> значення y. Змінну x називають <b>незалежною змінною<\/b>, або <b>аргументом<\/b>, а y — <b>залежною змінною<\/b>, або <b>функцією<\/b>.","ideas":["Приклади функцій: периметр квадрата P = 4a залежить від сторони a; шлях s = 15t велосипедиста, який їде зі швидкістю 15 км/год, залежить від часу t.","<b>Значення функції<\/b> — це число y, яке відповідає вибраному значенню x. Щоб його знайти, підстав x у формулу й обчисли.","Не кожна залежність — функція. Зріст і вага людей пов'язані, але людям з однаковим зростом відповідає різна вага — одному x відповідає кілька y.","Формула функції — це <b>математична модель<\/b> реального процесу: замість того щоб щоразу міряти чи рахувати вручну, ми обчислюємо за формулою."],"rules":[{"f":"P = 4a","means":"Периметр квадрата P залежить від сторони a: a — аргумент, P — функція. Кожній стороні відповідає один-єдиний периметр."}],"examples":[{"task":"Велосипедист їде зі швидкістю 15 км/год. Запиши формулу залежності шляху s (км) від часу t (год). Знайди шлях за 2 год.","steps":[{"do":"Аргумент — час t, функція — шлях s","why":"Шлях залежить від того, скільки часу їде велосипедист."},{"do":"s = 15t","why":"Шлях = швидкість · час."},{"do":"t = 2: s = 15 · 2 = 30","why":"Підставляємо значення аргументу у формулу."}],"answer":"Відповідь: s = 15t; за 2 год — 30 км."},{"task":"Функцію задано формулою y = 3x − 5. Знайди значення функції при x = −2 і при x = 0.","steps":[{"do":"x = −2: y = 3 · (−2) − 5 = −6 − 5 = −11","why":"Від'ємне число підставляємо в дужках; плюс на мінус дає мінус.","hl":["ay"]},{"do":"x = 0: y = 3 · 0 − 5 = 0 − 5 = −5","why":"Будь-яке число, помножене на 0, дає 0.","hl":["b"]},{"do":"Перевірка x = −2: 3 · (−2) = −6, −6 − 5 = −11","why":"Порахували ще раз окремими діями — результат той самий.","hl":["ay"]}],"answer":"Відповідь: при x = −2 значення функції −11, при x = 0 — −5.","fig":{"caption":"Графік функції y = 3x − 5. Точка A(−2; −11): при x = −2 значення функції −11. Точка B(0; −5): при x = 0 значення функції −5.","view":[-6,-12,6,2],"axes":{"step":1,"every":2},"points":{"A":[-2,-11],"B":[0,-5],"HO":[0,0],"Hay":[0,-11]},"hide":["HO","Hay"],"lp":{"A":"w","B":"e"},"items":[{"t":"fn","k":3,"b":-5,"id":"f"},{"t":"seg","p":["A","Hay"],"id":"ay","s":"dash"},{"t":"seg","p":["HO","B"],"id":"b","s":"hl2"},{"t":"label","at":[3.52,-1.64],"text":"y = 3x − 5","id":"ft"}],"check":[{"on":["A",3,-5]},{"on":["B",3,-5]}]}},{"task":"Чи є функцією залежність: а) кожному учневі класу ставлять у відповідність його рік народження; б) кожному року ставлять у відповідність учнів класу, народжених того року?","steps":[{"do":"а) Учень → рік народження","why":"Кожна людина народилася лише в одному році — одному аргументу відповідає одне значення."},{"do":"а) Отже, це функція","why":"Виконано головну умову: кожному x — єдине y."},{"do":"б) Рік → учні цього року народження","why":"Того самого року народилися багато учнів — одному аргументу відповідає кілька значень."},{"do":"б) Отже, це не функція","why":"Головна умова порушена."}],"answer":"Відповідь: а) так, це функція; б) ні, це не функція."}],"mistakes":["Плутають x і y: просять знайти y при x = 2, а учень розв'язує рівняння 3x − 5 = 2. Правильно: підстав 2 <b>замість x<\/b> і обчисли y = 3 · 2 − 5 = 1.","Гублять мінус: при x = −2 пишуть 3 · −2 і отримують 6. Правильно: бери від'ємне число в дужки: 3 · (−2) = −6.","Вважають функцією будь-який зв'язок між величинами. Перевір головне: чи <b>кожному<\/b> x відповідає <b>лише одне<\/b> y."],"check":[{"q":"Функцію задано формулою y = 2x + 7. Знайди значення функції при x = −3.","accept":["1"],"a":"y = 2 · (−3) + 7 = −6 + 7 = 1."},{"q":"Пастка: функцію задано формулою y = 5 — при будь-якому x значення y дорівнює 5. Чи є така залежність функцією?","options":["Ні, бо y не змінюється","Так, бо кожному x відповідає одне значення y"],"correct":1,"a":"Так. Умова функції — кожному x відповідає єдине y. Тут кожному x відповідає одне число 5. Те, що y не змінюється, не заважає."},{"q":"Поїздка на таксі коштує 40 грн за посадку і 15 грн за кожен кілометр. Вартість поїздки y (грн) залежить від відстані x (км): y = 15x + 40. Скільки гривень коштує поїздка на 6 км?","accept":["130"],"a":"y = 15 · 6 + 40 = 90 + 40 = 130 грн."}]}},{"id":"A3.1.2","name":"Область визначення і область значень","status":"ready","programmeRef":"Функція. Область визначення та область значень функції.","lesson":{"what":"<b>Область визначення<\/b> функції — це всі значення, яких може набувати аргумент x. <b>Область значень<\/b> — це всі значення, яких набуває сама функція y.","ideas":["Коротко: область визначення — про x, область значень — про y.","Якщо функцію задано формулою і нічого не сказано, область визначення — усі числа, при яких формулу можна обчислити. На нуль ділити не можна, тому викидаємо x, при яких знаменник дорівнює 0.","Якщо функцію задано таблицею, область визначення — числа з рядка x, а область значень — числа з рядка y (однакові записуємо один раз).","У задачах із життя важливий ще й зміст: кількість зошитів — ціле невід'ємне число, час руху не буває від'ємним.","Для функції y = 2x + 1 і область визначення, і область значень — усі числа."],"rules":[{"f":"y = 12/(x − 3): x ≠ 3","means":"При x = 3 знаменник x − 3 дорівнює 0, а на нуль ділити не можна. Тому область визначення — усі числа, крім 3."}],"examples":[{"task":"Функцію задано таблицею. x: −2, −1, 0, 1, 2; y: 4, 1, 0, 1, 4. Знайди її область визначення і область значень.","steps":[{"do":"Область визначення: −2, −1, 0, 1, 2","why":"Це всі значення аргументу — числа з рядка x.","hl":["Ax","Bx","Dx","Ex"]},{"do":"У рядку y є числа 4, 1, 0, 1, 4","why":"Деякі значення повторюються.","hl":["Dy","Ey"]},{"do":"Область значень: 0, 1, 4","why":"Кожне значення записуємо один раз.","hl":["Dy","Ey"]}],"answer":"Відповідь: область визначення — числа −2, −1, 0, 1, 2; область значень — числа 0, 1, 4.","fig":{"caption":"Функція, задана таблицею, — п'ять окремих точок: A(−2; 4), B(−1; 1), C(0; 0), D(1; 1), E(2; 4). Пунктир униз до осі x показує область визначення (−2, −1, 0, 1, 2), пунктир від точок до осі y — область значень (0, 1, 4).","view":[-4,-1,4,5],"axes":{"step":1,"every":1},"points":{"A":[-2,4],"B":[-1,1],"C":[0,0],"D":[1,1],"E":[2,4],"HAx":[-2,0],"HBx":[-1,0],"HDx":[1,0],"HEx":[2,0],"HDy":[0,1],"HEy":[0,4]},"hide":["HAx","HBx","HDx","HEx","HDy","HEy"],"lp":{"A":"nw","B":"nw","C":"se","D":"ne","E":"ne"},"items":[{"t":"seg","p":["HAx","A"],"id":"Ax","s":"dash"},{"t":"seg","p":["HBx","B"],"id":"Bx","s":"dash"},{"t":"seg","p":["HDx","D"],"id":"Dx","s":"dash"},{"t":"seg","p":["HEx","E"],"id":"Ex","s":"dash"},{"t":"seg","p":["D","HDy"],"id":"Dy","s":"dash"},{"t":"seg","p":["E","HEy"],"id":"Ey","s":"dash"}]}},{"task":"Знайди область визначення функції y = 12/(x − 3).","steps":[{"do":"Знаменник: x − 3","why":"Ділити на нуль не можна — шукаємо, коли знаменник дорівнює 0."},{"do":"x − 3 = 0, x = 3","why":"Розв'язуємо рівняння."},{"do":"При x = 3: y = 12/0 — не має змісту","why":"Отже, 3 не входить в область визначення. Будь-яке інше число підходить, наприклад x = 5: y = 12/2 = 6."}],"answer":"Відповідь: усі числа, крім 3."},{"task":"Зошит коштує 8 грн, у Марка 40 грн. Вартість y (грн) залежить від кількості куплених зошитів n: y = 8n. Знайди область визначення і область значень цієї функції.","steps":[{"do":"n може бути 0, 1, 2, 3, 4, 5","why":"Кількість зошитів — ціле невід'ємне число, а 6 зошитів коштують 48 грн — це більше за 40 грн."},{"do":"y: 8 · 0 = 0, 8 · 1 = 8, 16, 24, 32, 8 · 5 = 40","why":"Обчислюємо вартість для кожного можливого n."},{"do":"Область значень: 0, 8, 16, 24, 32, 40","why":"Це всі значення, яких набуває y."}],"answer":"Відповідь: область визначення — 0, 1, 2, 3, 4, 5; область значень — 0, 8, 16, 24, 32, 40."}],"mistakes":["Плутають області: в область значень записують числа з рядка x. Запам'ятай: визначення — x, значення — y.","Виключають не те число: у функції y = (x − 2)/5 пишуть «x ≠ 2». Але тут x − 2 — у чисельнику, а ділимо на 5 ≠ 0. Область визначення — усі числа.","Забувають зміст задачі: кажуть, що можна купити 2,5 зошита або −1 зошит."],"check":[{"q":"Яке число не входить в область визначення функції y = 7/(x + 4)?","accept":["−4"],"a":"Знаменник x + 4 = 0 при x = −4. На нуль ділити не можна, тому −4 не входить в область визначення."},{"q":"Пастка: яка область визначення функції y = (x − 2)/5?","options":["Усі числа, крім 2","Усі числа","Усі числа, крім 5"],"correct":1,"a":"Усі числа. Ділимо на 5, а 5 ≠ 0. Вираз x − 2 у чисельнику може дорівнювати нулю — це дозволено: при x = 2 маємо y = 0/5 = 0."},{"q":"Мобільний тариф коштує 150 грн на місяць. Сума оплати y (грн) за x місяців: y = 150x, де x — від 1 до 6 місяців. Яке найбільше число входить в область значень цієї функції?","accept":["900"],"a":"Найбільше x = 6, тоді y = 150 · 6 = 900. Область значень: 150, 300, 450, 600, 750, 900."}]}},{"id":"A3.1.3","name":"Способи задання функції","status":"ready","programmeRef":"Способи задання функції.","lesson":{"what":"Функцію можна задати чотирма способами: <b>формулою<\/b> (наприклад, y = 2x + 1), <b>таблицею<\/b> (пари значень x і y), <b>графіком<\/b> (рисунком на координатній площині) і <b>словесно<\/b> — описом словами, як за x знайти y.","ideas":["Формула зручна: за нею можна обчислити y для будь-якого x з області визначення.","Таблиця показує значення одразу, але лише для тих x, що в ній є. Якщо функцію задано тільки таблицею, інших x у неї немає.","Графік наочно показує, як змінюється функція (про нього — в наступному уроці).","Від одного способу можна перейти до іншого: зі слів скласти формулу, за формулою — таблицю, за таблицею вгадати формулу й перевірити її."],"rules":[{"f":"«на 4 менше від потроєного x» → y = 3x − 4","means":"Спершу записуємо те, від чого віднімаємо (3x), потім — скільки віднімаємо (4)."}],"examples":[{"task":"Функцію задано словесно: кожному числу x відповідає число, на 4 менше від потроєного x. Задай її формулою і знайди значення при x = 2.","steps":[{"do":"Потроєне x — це 3x","why":"«Потроєне» означає помножене на 3."},{"do":"y = 3x − 4","why":"«На 4 менше» — віднімаємо 4 від 3x."},{"do":"x = 2: y = 3 · 2 − 4 = 2","why":"Підставляємо 2 замість x."}],"answer":"Відповідь: y = 3x − 4; при x = 2 значення функції 2."},{"task":"Функцію задано формулою y = −2x + 1. Склади таблицю її значень для x: −2, −1, 0, 1, 2.","steps":[{"do":"x = −2: y = −2 · (−2) + 1 = 4 + 1 = 5","why":"Мінус на мінус — плюс.","hl":["ax"]},{"do":"x = −1: y = 2 + 1 = 3; x = 0: y = 0 + 1 = 1","why":"−2 · (−1) = 2; −2 · 0 = 0.","hl":["bx","cx"]},{"do":"x = 1: y = −2 + 1 = −1; x = 2: y = −4 + 1 = −3","why":"−2 · 1 = −2; −2 · 2 = −4.","hl":["dy","ey"]},{"do":"Таблиця — x: −2, −1, 0, 1, 2; y: 5, 3, 1, −1, −3","why":"Записуємо кожне y під своїм x.","hl":["ax","bx","cx","dy","ey"]}],"answer":"Відповідь: x: −2, −1, 0, 1, 2; y: 5, 3, 1, −1, −3.","fig":{"caption":"Точки з таблиці функції y = −2x + 1: A(−2; 5), B(−1; 3), C(0; 1), D(1; −1), E(2; −3). Пунктир від кожної точки до осі допомагає прочитати її координати.","view":[-4,-4,4,6],"axes":{"step":1,"every":1},"points":{"A":[-2,5],"B":[-1,3],"C":[0,1],"D":[1,-1],"E":[2,-3],"Hax":[-2,0],"Hbx":[-1,0],"Hcx":[0,0],"Hdy":[0,-1],"Hey":[0,-3]},"hide":["Hax","Hbx","Hcx","Hdy","Hey"],"lp":{"A":"ne","B":"ne","C":"ne","D":"ne","E":"ne"},"items":[{"t":"seg","p":["Hax","A"],"id":"ax","s":"dash"},{"t":"seg","p":["Hbx","B"],"id":"bx","s":"dash"},{"t":"seg","p":["Hcx","C"],"id":"cx","s":"dash"},{"t":"seg","p":["D","Hdy"],"id":"dy","s":"dash"},{"t":"seg","p":["E","Hey"],"id":"ey","s":"dash"}],"check":[{"on":["A",-2,1]},{"on":["B",-2,1]},{"on":["C",-2,1]},{"on":["D",-2,1]},{"on":["E",-2,1]}]}},{"task":"Вартість y (грн) зошитів залежить від їхньої кількості x і задана таблицею. x: 1, 2, 3, 4; y: 14, 28, 42, 56. Задай цю функцію словесно і формулою.","steps":[{"do":"1 зошит — 14 грн","why":"Отже, ціна одного зошита — 14 грн."},{"do":"Словесно: вартість дорівнює ціні 14 грн, помноженій на кількість зошитів","why":"Кожен наступний зошит додає ще 14 грн."},{"do":"y = 14x","why":"Записуємо ці слова формулою."},{"do":"Перевірка: 14 · 2 = 28, 14 · 3 = 42, 14 · 4 = 56","why":"Формула дає всі числа з таблиці."}],"answer":"Відповідь: словесно — «вартість дорівнює 14 грн, помноженим на кількість зошитів»; формулою — y = 14x."}],"mistakes":["Плутають порядок у словах: «на 4 менше від потроєного x» записують як 4 − 3x. Правильно: y = 3x − 4.","Помиляються зі знаком під час складання таблиці: −2 · (−2) пишуть як −4. Правильно: 4, бо мінус на мінус — плюс.","Думають, що таблиця дає значення для будь-якого x. Якщо функцію задано лише таблицею, вона визначена тільки для x із таблиці."],"check":[{"q":"Функцію задано словесно: кожному числу відповідає його подвоєне значення, зменшене на 5. Знайди значення функції при x = 4.","accept":["3"],"a":"Формула: y = 2x − 5. При x = 4: y = 2 · 4 − 5 = 8 − 5 = 3."},{"q":"Пастка: функцію задано лише таблицею. x: 1, 2, 3; y: 4, 8, 12. Яке значення функції при x = 5?","options":["20","16","Такого значення немає: x = 5 не входить в область визначення"],"correct":2,"a":"Функцію задано тільки для x = 1, 2, 3. Числа 5 у таблиці немає, тож і значення функції при x = 5 немає. Відповідь 20 була б правильною, якби функцію задали формулою y = 4x."},{"q":"Велосипедист їде зі сталою швидкістю 12 км/год. Яка формула задає залежність шляху s (км) від часу t (год)?","options":["s = t + 12","t = 12s","s = 12t","s = 12 : t"],"correct":2,"a":"Шлях = швидкість · час, тому s = 12t. Наприклад, за 2 год велосипедист проїде 24 км."}]}}]},{"id":"A3.2","name":"Графік функції","what":"Як зобразити функцію на координатній площині і як читати графік.","subtopics":[{"id":"A3.2.1","name":"Графік функції","status":"ready","programmeRef":"Графік функції.","lesson":{"what":"Кожну пару «аргумент — значення функції» (x; y) можна позначити точкою на координатній площині. <b>Графік функції<\/b> — це фігура з усіх таких точок: їхні <b>абсциси<\/b> (перші координати, x) — значення аргументу, а <b>ординати<\/b> (другі координати, y) — відповідні значення функції.","ideas":["Абсцису x відкладаємо по горизонтальній осі, ординату y — по вертикальній. У записі точки A(2; 5) спершу x = 2, потім y = 5.","Точка належить графіку, якщо, підставивши її x у формулу, отримаємо саме її y.","Як побудувати графік: склади таблицю значень → познач точки → з'єднай їх лінією.","Як читати графік: щоб знайти y за даним x, іди від x на осі x вертикально до графіка й подивись на висоту точки. Щоб знайти x за даним y — навпаки, іди горизонтально від y до графіка. Таких x може бути кілька."],"rules":[{"f":"A(2; 5) лежить на графіку y = 2x + 1, бо 2 · 2 + 1 = 5","means":"Підставляємо абсцису точки у формулу: якщо отримали її ординату — точка належить графіку."}],"examples":[{"task":"Чи належать графіку функції y = 3x − 1 точки A(2; 5) і B(−1; 2)?","steps":[{"do":"A: x = 2, y = 3 · 2 − 1 = 5","why":"Підставляємо абсцису точки A у формулу.","hl":["ax","ay"]},{"do":"5 = 5 — A належить графіку","why":"Отримали саме ординату точки A.","hl":["ax","ay"]},{"do":"B: x = −1, y = 3 · (−1) − 1 = −4","why":"Підставляємо абсцису точки B.","hl":["bc"]},{"do":"−4 ≠ 2 — B не належить графіку","why":"Ордината точки B інша.","hl":["bc"]}],"answer":"Відповідь: A належить графіку, B — не належить.","fig":{"caption":"Графік функції y = 3x − 1. Точка A(2; 5) лежить на ньому. Точка B(−1; 2) — ні: при x = −1 графік проходить через точку C(−1; −4), набагато нижче за B.","view":[-4,-5,5,8],"axes":{"step":1,"every":1},"points":{"A":[2,5],"B":[-1,2],"C":[-1,-4],"Hax":[2,0],"Hay":[0,5]},"hide":["Hax","Hay"],"lp":{"A":"e","B":"w","C":"w"},"items":[{"t":"fn","k":3,"b":-1,"id":"f"},{"t":"seg","p":["Hax","A"],"id":"ax","s":"dash"},{"t":"seg","p":["A","Hay"],"id":"ay","s":"dash"},{"t":"seg","p":["B","C"],"id":"bc","s":"hl2 dash"},{"t":"label","at":[2.24,-1.49],"text":"y = 3x − 1","id":"ft"}],"check":[{"on":["A",3,-1]},{"on":["C",3,-1]}]}},{"task":"Побудуй графік функції y = 2x − 3 для x від −1 до 3. За графіком знайди x, при якому y = 1.","steps":[{"do":"Таблиця — x: −1, 0, 1, 2, 3; y: −5, −3, −1, 1, 3","why":"Наприклад, x = −1: 2 · (−1) − 3 = −5; x = 3: 2 · 3 − 3 = 3."},{"do":"У зошиті накресли осі x і y, познач одиничні відрізки (1 клітинка = 1)","why":"Без осей і масштабу точки не поставиш."},{"do":"Познач точки (−1; −5), (0; −3), (1; −1), (2; 1), (3; 3) і з'єднай їх","why":"Точки лягли на одну пряму лінію — у таких функцій графік завжди пряма.","hl":["g"]},{"do":"Від позначки 1 на осі y іди горизонтально до графіка, потім вертикально вниз до осі x — потрапиш у 2","why":"Так за значенням функції знаходимо аргумент. Перевірка: 2 · 2 − 3 = 1.","hl":["r1","r2"]}],"answer":"Відповідь: графік — пряма через точки з таблиці; y = 1 при x = 2.","fig":{"caption":"Графік функції y = 2x − 3 для x від −1 до 3 — відрізок від A(−1; −5) до E(3; 3) через B(0; −3), C(1; −1), D(2; 1). Від 1 на осі y пунктир іде до точки D, а від неї вниз — у 2 на осі x.","view":[-4,-6,5,4],"axes":{"step":1,"every":1},"points":{"A":[-1,-5],"B":[0,-3],"C":[1,-1],"D":[2,1],"E":[3,3],"Hy1":[0,1],"Hx2":[2,0]},"hide":["Hy1","Hx2"],"lp":{"A":"se","B":"se","C":"se","D":"nw","E":"se"},"items":[{"t":"seg","p":["A","E"],"id":"g"},{"t":"seg","p":["Hy1","D"],"id":"r1","s":"hl2 dash"},{"t":"seg","p":["D","Hx2"],"id":"r2","s":"hl2 dash"}],"check":[{"on":["A",2,-3]},{"on":["B",2,-3]},{"on":["C",2,-3]},{"on":["D",2,-3]},{"on":["E",2,-3]}]}},{"task":"Температуру повітря міряли протягом доби. Час t (год): 0, 4, 8, 12, 16, 20, 24; температура T (°C): −4, −6, −2, 4, 6, 2, −2. Побудуй графік і дай відповідь: якою була температура о 12-й? О котрій годині вона була найвищою?","steps":[{"do":"Вісь t — горизонтальна (1 клітинка = 2 год), вісь T — вертикальна (1 клітинка = 1 °C)","why":"Аргумент — час, функція — температура."},{"do":"Познач 7 точок: (0; −4), (4; −6), (8; −2), (12; 4), (16; 6), (20; 2), (24; −2) і з'єднай їх плавною лінією","why":"Температура змінюється поступово, без стрибків.","hl":["p"]},{"do":"Над t = 12 точка графіка на висоті 4","why":"Шукаємо y за даним x.","hl":["mx","my"]},{"do":"Найвища точка графіка — (16; 6)","why":"Найбільша ордината серед точок — 6, вона при t = 16.","hl":["nx","ny"]}],"answer":"Відповідь: о 12-й температура була 4 °C; найвищою (6 °C) вона була о 16-й.","fig":{"caption":"Графік температури за добу: горизонтальна вісь — час t (год), вертикальна — температура T (°C), одна клітинка — 2 одиниці. Точки (0; −4), (4; −6), (8; −2), (12; 4), (16; 6), (20; 2), (24; −2) з'єднано лінією. M(12; 4) — температура о 12-й, N(16; 6) — найвища точка.","view":[-1,-7,25,8],"axes":{"step":2,"every":1},"points":{"M":[12,4],"N":[16,6],"Hmx":[12,0],"Hmy":[0,4],"Hnx":[16,0],"Hny":[0,6]},"hide":["Hmx","Hmy","Hnx","Hny"],"lp":{"M":"nw","N":"n"},"items":[{"t":"plot","pts":[[0,-4],[4,-6],[8,-2],[12,4],[16,6],[20,2],[24,-2]],"id":"p"},{"t":"seg","p":["Hmx","M"],"id":"mx","s":"dash"},{"t":"seg","p":["M","Hmy"],"id":"my","s":"dash"},{"t":"seg","p":["Hnx","N"],"id":"nx","s":"dash"},{"t":"seg","p":["N","Hny"],"id":"ny","s":"dash"}]}}],"mistakes":["Плутають порядок координат: точку (2; 5) ставлять на 5 вправо і 2 вгору. Правильно: спершу x = 2 по горизонталі, потім y = 5 по вертикалі.","Перевіряючи точку, підставляють у формулу її ординату замість абсциси. У формулу підставляй x, а результат порівнюй з y.","Думають, що одному y на графіку відповідає лише один x. Наприклад, на графіку температури значення 2 °C трапляється двічі — до полудня і ввечері."],"check":[{"q":"Чи належить точка M(−2; 7) графіку функції y = −3x + 1?","options":["Так","Ні"],"correct":0,"a":"Так: −3 · (−2) + 1 = 6 + 1 = 7 — це ордината точки M."},{"q":"Пастка: точка (4; 1) лежить на графіку функції y = x − 3. А точка (1; 4)?","options":["Теж лежить — числа ті самі","Не лежить"],"correct":1,"a":"Не лежить: при x = 1 маємо y = 1 − 3 = −2, а не 4. Порядок координат важливий."},{"q":"Графік вартості покупки цукерок проходить через точки (0; 0), (1; 60), (2; 120), (3; 180), де x — маса (кг), y — вартість (грн), і всі точки лежать на одній прямій. Скільки гривень коштують 2,5 кг цукерок?","accept":["150"],"a":"Кілограм коштує 60 грн, тобто y = 60x. При x = 2,5: y = 60 · 2,5 = 150 грн. На графіку це точка посередині між (2; 120) і (3; 180)."}]}}]},{"id":"A3.3","name":"Лінійна функція","what":"Функція y = kx + b, її графік — пряма.","subtopics":[{"id":"A3.3.1","name":"Лінійна функція та її графік","status":"ready","programmeRef":"Лінійна функція, її графік та властивості","lesson":{"what":"<b>Лінійна функція<\/b> — це функція, яку можна задати формулою y = kx + b, де x — аргумент, а k і b — деякі числа. Її графік — <b>пряма<\/b>. Щоб побудувати пряму, досить двох точок.","ideas":["Приклади лінійних функцій: y = 2x + 3 (k = 2, b = 3), y = 4 − 3x (k = −3, b = 4), y = 0,5x (b = 0), y = 5 (k = 0, графік — горизонтальна пряма).","Не лінійні функції: y = x<sup>2<\/sup>, y = 6/x — їх не можна записати у вигляді kx + b.","Область визначення лінійної функції — усі числа.","При x = 0 маємо y = b, тому пряма перетинає вісь y у точці (0; b).","Лінійна функція — модель багатьох процесів: оплата таксі, мобільного тарифу, рух зі сталою швидкістю."],"rules":[{"f":"y = kx + b","means":"k і b — числа, x — аргумент. Графік — пряма."},{"f":"x = 0 → y = b","means":"Пряма перетинає вісь y у точці (0; b)."}],"examples":[{"task":"Які з функцій лінійні: y = 3x − 1, y = x<sup>2<\/sup> + 1, y = 5/x, y = 4? Для лінійних назви k і b.","steps":[{"do":"y = 3x − 1 — лінійна, k = 3, b = −1","why":"Має вигляд kx + b."},{"do":"y = x<sup>2<\/sup> + 1 і y = 5/x — не лінійні","why":"x у квадраті або x у знаменнику — це не kx."},{"do":"y = 4 — лінійна, k = 0, b = 4","why":"Можна записати y = 0 · x + 4."}],"answer":"Відповідь: лінійні y = 3x − 1 (k = 3, b = −1) і y = 4 (k = 0, b = 4)."},{"task":"Побудуй графік функції y = 2x − 1.","steps":[{"do":"x = 0: y = 2 · 0 − 1 = −1; x = 2: y = 2 · 2 − 1 = 3","why":"Для прямої досить двох точок.","hl":["bx","by"]},{"do":"У зошиті накресли осі, познач точки (0; −1) і (2; 3)","why":"Спершу x по горизонталі, потім y по вертикалі.","hl":["bx","by"]},{"do":"Проведи через них пряму за лінійкою, до країв рисунка","why":"Графік — уся пряма, а не лише відрізок між точками.","hl":["f","ft"]},{"do":"Контроль: x = 1, y = 2 · 1 − 1 = 1 — точка (1; 1) має лежати на твоїй прямій","why":"Третя точка допомагає помітити помилку.","hl":["cx","cy"]}],"answer":"Відповідь: графік — пряма, що проходить через точки (0; −1), (1; 1), (2; 3).","fig":{"caption":"Графік функції y = 2x − 1 — пряма через точки A(0; −1) і B(2; 3). Контрольна точка C(1; 1) теж лежить на прямій.","view":[-5,-5,5,5],"axes":{"step":1,"every":1},"points":{"A":[0,-1],"B":[2,3],"C":[1,1],"Hbx":[2,0],"Hby":[0,3],"Hcx":[1,0],"Hcy":[0,1]},"hide":["Hbx","Hby","Hcx","Hcy"],"lp":{"A":"e","B":"e","C":"e"},"items":[{"t":"fn","k":2,"b":-1,"id":"f"},{"t":"seg","p":["Hbx","B"],"id":"bx","s":"dash"},{"t":"seg","p":["B","Hby"],"id":"by","s":"dash"},{"t":"seg","p":["Hcx","C"],"id":"cx","s":"dash"},{"t":"seg","p":["C","Hcy"],"id":"cy","s":"dash"},{"t":"label","at":[-2.5,-2.5],"text":"y = 2x − 1","id":"ft"}],"check":[{"on":["A",2,-1]},{"on":["B",2,-1]},{"on":["C",2,-1]}]}},{"task":"Таксі бере 40 грн за посадку і 15 грн за кожен кілометр. Задай вартість поїздки y (грн) як функцію відстані x (км). Скільки кілометрів можна проїхати за 160 грн?","steps":[{"do":"y = 15x + 40","why":"15 грн за кожен із x кілометрів плюс 40 грн за посадку. Це лінійна функція: k = 15, b = 40."},{"do":"15x + 40 = 160","why":"Відома вартість — шукаємо аргумент."},{"do":"15x = 120, x = 8","why":"Перенесли 40 праворуч зі зміною знака і поділили на 15."},{"do":"Перевірка: 15 · 8 + 40 = 120 + 40 = 160","why":"Сходиться з умовою."}],"answer":"Відповідь: y = 15x + 40; за 160 грн можна проїхати 8 км."}],"mistakes":["Будують пряму за однією точкою. Через одну точку проходить безліч прямих — потрібні дві (а третя — для перевірки).","Плутають k і b, коли доданки переставлено: у y = 4 − 3x пишуть k = 4. Правильно: k — число перед x, тобто k = −3, а b = 4.","Вважають, що y = 5 — не лінійна функція, бо «немає x». Це лінійна функція з k = 0, її графік — горизонтальна пряма."],"check":[{"q":"Для лінійної функції y = 4 − 3x знайди k.","accept":["−3"],"a":"Перепишемо: y = −3x + 4. Число перед x — це k = −3, а b = 4."},{"q":"Пастка: яка з функцій <b>не<\/b> є лінійною?","options":["y = 7","y = x/3 + 1","y = 3/x + 1","y = −x"],"correct":2,"a":"y = 3/x + 1 — не лінійна: x стоїть у знаменнику. А y = x/3 + 1 — лінійна, бо x/3 — це (1/3) · x, тобто k = 1/3."},{"q":"Мобільний тариф: 120 грн на місяць плюс 2 грн за кожну хвилину розмов понад пакет. Оплата y (грн) залежить від кількості таких хвилин x: y = 2x + 120. Скільки гривень треба заплатити за місяць, якщо понад пакет наговорили 35 хвилин?","accept":["190"],"a":"y = 2 · 35 + 120 = 70 + 120 = 190 грн."}]}},{"id":"A3.3.2","name":"Пряма пропорційність","status":"ready","programmeRef":"Лінійна функція, її графік та властивості","lesson":{"what":"<b>Пряма пропорційність<\/b> — це функція виду y = kx, де k ≠ 0. Це окремий вид лінійної функції, у якої b = 0. Число k називають <b>коефіцієнтом пропорційності<\/b>. Графік — пряма, що проходить через <b>початок координат<\/b>, тобто точку (0; 0).","ideas":["Чому через (0; 0): при x = 0 маємо y = k · 0 = 0.","Тому для побудови графіка досить узяти (0; 0) і ще одну точку, наприклад з x = 1: (1; k).","Якщо x збільшити у 2 рази, то й y збільшиться у 2 рази — звідси назва «пряма пропорційність».","Якщо k > 0, пряма проходить через I і III координатні чверті (праворуч угорі й ліворуч унизу); якщо k < 0 — через II і IV.","Приклади з життя: шлях при сталій швидкості s = vt, вартість покупки = ціна · кількість."],"rules":[{"f":"y = kx, k ≠ 0","means":"Лінійна функція y = kx + b, у якої b = 0. Графік проходить через (0; 0)."},{"f":"k = y : x","means":"Якщо відомо точку (x; y) графіка, де x ≠ 0, коефіцієнт k знаходимо діленням ординати на абсцису."}],"examples":[{"task":"Які з функцій є прямою пропорційністю: y = −4x, y = 4x − 1, y = x/2, y = 4?","steps":[{"do":"y = −4x — так, k = −4","why":"Має вигляд kx, b = 0."},{"do":"y = 4x − 1 — ні","why":"b = −1 ≠ 0. Це лінійна функція, але не пряма пропорційність."},{"do":"y = x/2 — так, k = 1/2 = 0,5","why":"x/2 = 0,5 · x."},{"do":"y = 4 — ні","why":"Тут k = 0, а для прямої пропорційності k ≠ 0."}],"answer":"Відповідь: y = −4x і y = x/2."},{"task":"Побудуй графік функції y = −2x.","steps":[{"do":"Перша точка — (0; 0)","why":"Графік прямої пропорційності завжди проходить через початок координат."},{"do":"x = 1: y = −2 · 1 = −2, друга точка — (1; −2)","why":"Для прямої потрібні дві точки.","hl":["ay"]},{"do":"У зошиті познач точки (0; 0) і (1; −2) та проведи через них пряму","why":"Пряма піде з лівого верхнього кута в правий нижній — через II і IV чверті, бо k = −2 < 0.","hl":["f","ft"]},{"do":"Контроль: x = −1, y = −2 · (−1) = 2 — точка (−1; 2) має лежати на прямій","why":"Перевіряємо третьою точкою.","hl":["bx"]}],"answer":"Відповідь: графік — пряма через точки (−1; 2), (0; 0), (1; −2).","fig":{"caption":"Графік функції y = −2x — пряма через початок координат і точку A(1; −2); контрольна точка B(−1; 2). Пряма йде через II і IV чверті.","view":[-5,-5,5,5],"axes":{"step":1,"every":1},"points":{"A":[1,-2],"B":[-1,2],"Hay":[0,-2],"Hbx":[-1,0]},"hide":["Hay","Hbx"],"lp":{"A":"e","B":"w"},"items":[{"t":"fn","k":-2,"b":0,"id":"f"},{"t":"seg","p":["A","Hay"],"id":"ay","s":"dash"},{"t":"seg","p":["Hbx","B"],"id":"bx","s":"dash"},{"t":"label","at":[3.467,-4.3],"text":"y = −2x","id":"ft"}],"check":[{"on":["A",-2,0]},{"on":["B",-2,0]}]}},{"task":"Графік прямої пропорційності проходить через точку A(3; −12). Задай функцію формулою. Чи проходить графік через точку B(−2; 8)?","steps":[{"do":"k = −12 : 3 = −4","why":"k = y : x для точки графіка.","hl":["ay"]},{"do":"y = −4x","why":"Підставляємо k у формулу y = kx.","hl":["f","ft"]},{"do":"B: x = −2, y = −4 · (−2) = 8","why":"Отримали ординату точки B — отже, B лежить на графіку.","hl":["bx"]}],"answer":"Відповідь: y = −4x; так, графік проходить через точку B.","fig":{"caption":"Графік прямої пропорційності y = −4x проходить через початок координат, точку A(3; −12) і точку B(−2; 8).","view":[-8,-13,8,10],"axes":{"step":1,"every":2},"points":{"A":[3,-12],"B":[-2,8],"Hay":[0,-12],"Hbx":[-2,0]},"hide":["Hay","Hbx"],"lp":{"A":"e","B":"w"},"items":[{"t":"fn","k":-4,"b":0,"id":"f"},{"t":"seg","p":["A","Hay"],"id":"ay","s":"dash"},{"t":"seg","p":["Hbx","B"],"id":"bx","s":"dash"},{"t":"label","at":[5.033,-8.86],"text":"y = −4x","id":"ft"}],"check":[{"on":["A",-4,0]},{"on":["B",-4,0]}]}}],"mistakes":["Вважають прямою пропорційністю будь-яку лінійну функцію, наприклад y = 2x + 3. Правильно: пряма пропорційність — лише y = kx, коли b = 0.","Будують графік лише за точкою (0; 0). Через одну точку проходить безліч прямих — потрібна ще одна, наприклад (1; k).","Перевертають дріб: шукають k як x : y. Правильно: k = y : x, бо y = k · x."],"check":[{"q":"Графік функції y = kx проходить через точку (5; 35). Знайди k.","accept":["7"],"a":"k = 35 : 5 = 7, отже, y = 7x. Перевірка: 7 · 5 = 35."},{"q":"Пастка: чи є функція y = 3x + 0,5 прямою пропорційністю?","options":["Ні, бо b = 0,5 ≠ 0","Так, бо в ній є 3x"],"correct":0,"a":"Ні. Це лінійна функція з b = 0,5, і її графік не проходить через (0; 0): при x = 0 маємо y = 0,5."},{"q":"Велосипедист їде зі сталою швидкістю 14 км/год, його шлях s = 14t (t — час у годинах). Скільки кілометрів він проїде за 2,5 год?","accept":["35"],"a":"s = 14 · 2,5 = 35 км. Час збільшився у 2,5 раза — і шлях теж: за 1 год 14 км, за 2,5 год 35 км."}]}},{"id":"A3.3.3","name":"Властивості лінійної функції за графіком","status":"ready","programmeRef":"Лінійна функція, її графік та властивості","lesson":{"what":"За графіком можна дізнатися про функцію багато корисного. <b>Нуль функції<\/b> — це значення x, при якому y = 0; у цьому місці графік перетинає вісь x. Функція набуває <b>додатних значень<\/b> (y > 0) там, де графік вище осі x, і <b>від'ємних<\/b> (y < 0) — де нижче.","ideas":["Нуль лінійної функції y = kx + b (k ≠ 0) знаходимо з рівняння kx + b = 0. Точка перетину з віссю x — (нуль; 0).","Точка перетину з віссю y — (0; b). Не плутай її з нулем функції.","Якщо k > 0, пряма зліва направо піднімається: ліворуч від нуля y < 0, праворуч — y > 0.","Якщо k < 0, пряма зліва направо опускається: ліворуч від нуля y > 0, праворуч — y < 0.","Функція y = b, де b ≠ 0, нулів не має: якщо b > 0, усі її значення додатні, якщо b < 0 — від'ємні."],"rules":[{"f":"kx + b = 0","means":"Корінь цього рівняння — нуль функції y = kx + b. У цій точці пряма перетинає вісь x."},{"f":"y > 0 — графік вище осі x; y < 0 — нижче","means":"Знак функції видно з того, по який бік від осі x лежить графік."}],"examples":[{"task":"Знайди нуль функції y = 2x − 6 і точки перетину її графіка з осями координат.","steps":[{"do":"2x − 6 = 0, 2x = 6, x = 3","why":"Нуль функції — x, при якому y = 0.","hl":["oa"]},{"do":"Перетин з віссю x — (3; 0)","why":"На осі x ордината дорівнює 0.","hl":["oa"]},{"do":"x = 0: y = 2 · 0 − 6 = −6, перетин з віссю y — (0; −6)","why":"На осі y абсциса дорівнює 0.","hl":["ob"]}],"answer":"Відповідь: нуль функції x = 3; графік перетинає осі в точках (3; 0) і (0; −6).","fig":{"caption":"Графік функції y = 2x − 6 перетинає вісь x у точці A(3; 0), а вісь y — у точці B(0; −6).","view":[-3,-8,6,4],"axes":{"step":1,"every":1},"points":{"A":[3,0],"B":[0,-6],"HO":[0,0]},"hide":["HO"],"lp":{"A":"nw","B":"e"},"items":[{"t":"fn","k":2,"b":-6,"id":"f"},{"t":"seg","p":["HO","A"],"id":"oa","s":"hl"},{"t":"seg","p":["HO","B"],"id":"ob","s":"hl2"},{"t":"label","at":[2.16,2.56],"text":"y = 2x − 6","id":"ft"}],"check":[{"on":["A",2,-6]},{"on":["B",2,-6]}]}},{"task":"Побудуй графік функції y = 2x − 6 і за ним знайди, при яких x функція набуває додатних значень, а при яких — від'ємних.","steps":[{"do":"У зошиті познач точки (0; −6) і (3; 0) з попереднього прикладу та проведи пряму","why":"Двох точок досить для прямої.","hl":["f","ft"]},{"do":"Праворуч від x = 3 пряма вище осі x","why":"k = 2 > 0 — пряма піднімається. Отже, y > 0 при x > 3.","hl":["pos"]},{"do":"Ліворуч від x = 3 пряма нижче осі x","why":"Отже, y < 0 при x < 3.","hl":["neg"]},{"do":"Перевірка: x = 5: y = 4 > 0; x = 0: y = −6 < 0","why":"Підставили по одному числу з кожного боку від нуля.","hl":["cx","cy","ob"]}],"answer":"Відповідь: y > 0 при x > 3; y < 0 при x < 3; y = 0 при x = 3.","fig":{"caption":"Графік функції y = 2x − 6. Праворуч від A(3; 0) пряма вище осі x — функція додатна, ліворуч — нижче, функція від'ємна. Точки для перевірки: C(5; 4) і B(0; −6).","view":[-2,-7,7,6],"axes":{"step":1,"every":1},"points":{"A":[3,0],"B":[0,-6],"C":[5,4],"HL":[-0.5,-7],"Hcx":[5,0],"Hcy":[0,4],"HO":[0,0]},"hide":["HL","Hcx","Hcy","HO"],"lp":{"A":"nw","B":"e","C":"w"},"items":[{"t":"fn","k":2,"b":-6,"id":"f"},{"t":"seg","p":["A","C"],"id":"pos","s":"hl"},{"t":"seg","p":["HL","A"],"id":"neg","s":"hl2"},{"t":"seg","p":["Hcx","C"],"id":"cx","s":"dash"},{"t":"seg","p":["C","Hcy"],"id":"cy","s":"dash"},{"t":"seg","p":["HO","B"],"id":"ob","s":"hl2 dash"},{"t":"label","at":[2.16,2.88],"text":"y = 2x − 6","id":"ft"}],"check":[{"on":["A",2,-6]},{"on":["B",2,-6]},{"on":["C",2,-6]},{"on":["HL",2,-6]}]}},{"task":"Для функції y = −x + 2 знайди нуль і визнач, при яких x функція додатна, а при яких — від'ємна.","steps":[{"do":"−x + 2 = 0, x = 2","why":"Шукаємо нуль функції."},{"do":"Познач у зошиті точки (0; 2) і (2; 0) та проведи пряму","why":"k = −1 < 0 — пряма зліва направо опускається.","hl":["f","ft"]},{"do":"Ліворуч від x = 2 графік вище осі x, праворуч — нижче","why":"Отже, y > 0 при x < 2, а y < 0 при x > 2.","hl":["pos","neg"]},{"do":"Перевірка: x = 0: y = 2 > 0; x = 4: y = −2 < 0","why":"Знаки збігаються з висновком.","hl":["cy"]}],"answer":"Відповідь: нуль x = 2; y > 0 при x < 2; y < 0 при x > 2.","fig":{"caption":"Графік функції y = −x + 2 перетинає осі в точках A(2; 0) і B(0; 2). Ліворуч від A пряма вище осі x (функція додатна), праворуч — нижче (функція від'ємна). Точка для перевірки: C(4; −2).","view":[-4,-4,6,6],"axes":{"step":1,"every":1},"points":{"A":[2,0],"B":[0,2],"C":[4,-2],"HL":[-4,6],"HR":[6,-4],"Hcy":[0,-2]},"hide":["HL","HR","Hcy"],"lp":{"A":"ne","B":"ne","C":"ne"},"items":[{"t":"fn","k":-1,"b":2,"id":"f"},{"t":"seg","p":["HL","A"],"id":"pos","s":"hl"},{"t":"seg","p":["A","HR"],"id":"neg","s":"hl2"},{"t":"seg","p":["C","Hcy"],"id":"cy","s":"dash"},{"t":"label","at":[3.5,-3.5],"text":"y = −x + 2","id":"ft"}],"check":[{"on":["A",-1,2]},{"on":["B",-1,2]},{"on":["C",-1,2]},{"on":["HL",-1,2]},{"on":["HR",-1,2]}]}}],"mistakes":["Плутають нуль функції з b: для y = 2x − 6 кажуть, що нуль −6. Але −6 — це y при x = 0, а нуль функції — x = 3, при якому y = 0.","Думають, що «y > 0» означає «праворуч від осі y», тобто x > 0. Додатні значення — там, де графік <b>вище осі x<\/b>.","Для спадної прямої (k < 0) механічно пишуть «y > 0 при x > нуля». Подивись на графік або перевір одним числом."],"check":[{"q":"Знайди нуль функції y = 3x + 12.","accept":["−4"],"a":"3x + 12 = 0, 3x = −12, x = −4. Перевірка: 3 · (−4) + 12 = 0."},{"q":"Пастка: при яких x функція y = −2x + 8 набуває додатних значень?","options":["x > 4","x < 4","x > 8"],"correct":1,"a":"Нуль: −2x + 8 = 0, x = 4. k = −2 < 0, пряма опускається, тому вище осі x вона ліворуч від 4: y > 0 при x < 4. Перевірка: x = 0, y = 8 > 0."},{"q":"На рахунку мобільного 200 грн, щодня знімають 8 грн. Залишок y (грн) через x днів: y = 200 − 8x. Через скільки днів залишок стане нулем?","accept":["25"],"a":"Шукаємо нуль функції: 200 − 8x = 0, 8x = 200, x = 25. Перевірка: 200 − 8 · 25 = 0."}]}}]}]},{"id":"A4","subject":"algebra","name":"Системи лінійних рівнянь з двома змінними","what":"Два рівняння з двома невідомими одночасно. Три способи розв'язування і задачі.","topics":[{"id":"A4.1","name":"Рівняння з двома змінними","what":"Розв'язки рівняння з двома змінними і його графік.","subtopics":[{"id":"A4.1.1","name":"Рівняння з двома змінними і його розв'язок","status":"ready","programmeRef":"Рівняння з двома змінними. Розв'язок рівняння з двома змінними.","lesson":{"what":"<b>Рівняння з двома змінними<\/b> — це рівняння, у якому є дві різні букви, наприклад x + y = 5. Його <b>розв'язок<\/b> — пара чисел (x; y), при якій рівняння перетворюється на правильну рівність. Рівняння виду ax + by = c, де a, b, c — числа, називають <b>лінійним рівнянням з двома змінними<\/b>.","ideas":["Розв'язок записують парою в дужках: (2; 3) означає x = 2, y = 3. Спершу завжди x, потім y.","Пари (2; 3) і (3; 2) — різні: у першій x = 2, у другій x = 3.","Щоб перевірити пару, підстав обидва числа і порахуй ліву частину. Збіглося з правою — розв'язок.","Лінійне рівняння з двома змінними має безліч розв'язків: обираєш будь-яке x і знаходиш до нього y.","Не кожне рівняння з двома змінними лінійне: xy = 6 чи x<sup>2<\/sup> + y = 1 — нелінійні, бо змінні перемножуються або стоять у степені."],"rules":[{"f":"ax + by = c","means":"Лінійне рівняння з двома змінними: x і y — змінні, a, b, c — числа (коефіцієнти)."},{"f":"2x + y = 7: (1; 5) — розв'язок, бо 2 · 1 + 5 = 7","means":"Розв'язок — це пара чисел, яка робить рівність правильною."}],"examples":[{"task":"Чи є пара (3; −1) розв'язком рівняння 2x + 5y = 1?","steps":[{"do":"x = 3, y = −1","why":"Перше число пари — x, друге — y."},{"do":"2 · 3 + 5 · (−1) = 6 − 5 = 1","why":"Підставили обидва числа в ліву частину."},{"do":"1 = 1 — рівність правильна","why":"Ліва частина дорівнює правій."}],"answer":"Відповідь: так, (3; −1) — розв'язок рівняння."},{"task":"Чи є розв'язками рівняння x − 2y = 4 пари (6; 1) і (1; 6)?","steps":[{"do":"(6; 1): 6 − 2 · 1 = 6 − 2 = 4; 4 = 4","why":"x = 6, y = 1 — рівність правильна."},{"do":"(1; 6): 1 − 2 · 6 = 1 − 12 = −11; −11 ≠ 4","why":"x = 1, y = 6 — рівність неправильна."},{"do":"Пари складаються з тих самих чисел, але відповідь різна","why":"Порядок у парі важливий."}],"answer":"Відповідь: (6; 1) — розв'язок, (1; 6) — ні."},{"task":"Знайди три розв'язки рівняння 3x + y = 10.","steps":[{"do":"y = 10 − 3x","why":"Виразили y через x: перенесли 3x праворуч зі зміною знака."},{"do":"x = 0: y = 10 − 0 = 10; x = 1: y = 10 − 3 = 7; x = 2: y = 10 − 6 = 4","why":"Обираємо будь-які зручні x і обчислюємо y."},{"do":"Перевірка (2; 4): 3 · 2 + 4 = 6 + 4 = 10","why":"Рівність правильна — пару знайдено вірно."}],"answer":"Відповідь: наприклад, (0; 10), (1; 7), (2; 4). Розв'язків безліч."}],"mistakes":["Плутають порядок у парі: для (3; −1) підставляють x = −1, y = 3. Правильно: перше число — завжди x.","Знаходять один розв'язок і кажуть, що він єдиний. Лінійне рівняння з двома змінними має безліч розв'язків.","Вважають лінійним рівняння xy = 6. Правильно: у лінійному рівнянні змінні не перемножуються і не стоять у степені."],"check":[{"q":"Яка з пар є розв'язком рівняння x + 3y = 11?","options":["(3; 2)","(2; 3)","(11; 1)"],"correct":1,"a":"(2; 3): 2 + 3 · 3 = 2 + 9 = 11. А (3; 2) дає 3 + 6 = 9, (11; 1) дає 11 + 3 = 14."},{"q":"Пастка: скільки розв'язків має рівняння x + y = 10?","options":["Один","Два","Безліч"],"correct":2,"a":"Безліч: (0; 10), (1; 9), (2,5; 7,5), (−1; 11)… Для будь-якого x знайдеться y = 10 − x."},{"q":"Зошит коштує x грн, ручка — y грн. Два зошити й одна ручка коштують 50 грн: 2x + y = 50. Скільки гривень коштує ручка, якщо зошит коштує 18 грн?","accept":["14"],"a":"2 · 18 + y = 50, 36 + y = 50, y = 50 − 36 = 14. Перевірка: 36 + 14 = 50."}]}},{"id":"A4.1.2","name":"Графік лінійного рівняння з двома змінними","status":"ready","programmeRef":"Лінійне рівняння з двома змінними та його графік.","lesson":{"what":"<b>Графік рівняння з двома змінними<\/b> — це всі точки координатної площини, координати яких є розв'язками рівняння. Графік лінійного рівняння ax + by = c (якщо a і b не обидва нулі) — <b>пряма<\/b>.","ideas":["Кожен розв'язок (x; y) — це точка на координатній площині: x — по горизонтальній осі, y — по вертикальній.","Пряму задають дві точки: знайди два розв'язки, познач точки й проведи через них пряму лінійкою. Третя точка — для перевірки.","Зручні точки — там, де пряма перетинає осі: постав x = 0 — отримаєш точку на осі y; постав y = 0 — точку на осі x.","Якщо в рівнянні немає y (наприклад, x = 3), графік — вертикальна пряма, паралельна осі y. Якщо немає x (y = −2) — горизонтальна, паралельна осі x.","Точка лежить на графіку, якщо її координати задовольняють рівняння."],"rules":[{"f":"ax + by = c → пряма","means":"Графік лінійного рівняння з двома змінними — пряма, якщо хоча б одне з чисел a, b не дорівнює нулю."},{"f":"x = 0 → точка на осі y; y = 0 → точка на осі x","means":"Так найпростіше знайти дві точки для побудови."}],"examples":[{"task":"Побудуй графік рівняння x + y = 4.","steps":[{"do":"x = 0: 0 + y = 4, y = 4 → точка (0; 4)","why":"Точка перетину з віссю y.","hl":["oa"]},{"do":"y = 0: x + 0 = 4, x = 4 → точка (4; 0)","why":"Точка перетину з віссю x.","hl":["ob"]},{"do":"Познач у зошиті точки (0; 4) і (4; 0) та проведи через них пряму","why":"Графік лінійного рівняння — пряма, а дві точки її задають.","hl":["f","ft"]},{"do":"Перевірка: точка (1; 3) лежить на прямій, бо 1 + 3 = 4","why":"Третя точка має потрапити на ту саму пряму.","hl":["cx","cy"]}],"answer":"Відповідь: пряма, що проходить через точки (0; 4) і (4; 0).","fig":{"caption":"Графік рівняння x + y = 4 — пряма через точки A(0; 4) на осі y і B(4; 0) на осі x. Контрольна точка C(1; 3) теж на прямій.","view":[-3,-3,6,6],"axes":{"step":1,"every":1},"points":{"A":[0,4],"B":[4,0],"C":[1,3],"HO":[0,0],"Hcx":[1,0],"Hcy":[0,3]},"hide":["HO","Hcx","Hcy"],"lp":{"A":"ne","B":"ne","C":"ne"},"items":[{"t":"fn","k":-1,"b":4,"id":"f"},{"t":"seg","p":["HO","A"],"id":"oa","s":"hl2"},{"t":"seg","p":["HO","B"],"id":"ob","s":"hl2"},{"t":"seg","p":["Hcx","C"],"id":"cx","s":"dash"},{"t":"seg","p":["C","Hcy"],"id":"cy","s":"dash"},{"t":"label","at":[4.68,-2.37],"text":"x + y = 4","id":"ft"}],"check":[{"on":["A",-1,4]},{"on":["B",-1,4]},{"on":["C",-1,4]}]}},{"task":"Побудуй графік рівняння 2x − y = 3.","steps":[{"do":"y = 2x − 3","why":"Виразили y через x — так легше рахувати.","hl":["f","ft"]},{"do":"x = 0: y = −3; x = 2: y = 4 − 3 = 1","why":"Дві точки: (0; −3) і (2; 1).","hl":["oa","bx","by"]},{"do":"x = 1: y = 2 − 3 = −1 → точка (1; −1)","why":"Третя точка для перевірки.","hl":["cy"]},{"do":"Познач (0; −3), (1; −1), (2; 1) і проведи пряму","why":"Якщо три точки лягли на одну лінію — обчислення правильні.","hl":["f","ft"]}],"answer":"Відповідь: пряма, що проходить через точки (0; −3), (1; −1) і (2; 1).","fig":{"caption":"Графік рівняння 2x − y = 3 (тобто y = 2x − 3) — пряма через точки A(0; −3), C(1; −1) і B(2; 1).","view":[-4,-5,5,4],"axes":{"step":1,"every":1},"points":{"A":[0,-3],"B":[2,1],"C":[1,-1],"HO":[0,0],"Hbx":[2,0],"Hby":[0,1],"Hcy":[0,-1]},"hide":["HO","Hbx","Hby","Hcy"],"lp":{"A":"e","B":"e","C":"e"},"items":[{"t":"fn","k":2,"b":-3,"id":"f"},{"t":"seg","p":["HO","A"],"id":"oa","s":"hl2"},{"t":"seg","p":["Hbx","B"],"id":"bx","s":"dash"},{"t":"seg","p":["B","Hby"],"id":"by","s":"dash"},{"t":"seg","p":["C","Hcy"],"id":"cy","s":"dash"},{"t":"label","at":[2.03,-2.12],"text":"2x − y = 3","id":"ft"}],"check":[{"on":["A",2,-3]},{"on":["B",2,-3]},{"on":["C",2,-3]}]}},{"task":"Чи лежать на графіку рівняння 3x + 2y = 6 точки A(2; 0), B(4; −3), C(1; 2)?","steps":[{"do":"A(2; 0): 3 · 2 + 2 · 0 = 6; 6 = 6","why":"Координати задовольняють рівняння — A лежить на графіку.","hl":["oa"]},{"do":"B(4; −3): 3 · 4 + 2 · (−3) = 12 − 6 = 6; 6 = 6","why":"B теж лежить на графіку.","hl":["by"]},{"do":"C(1; 2): 3 · 1 + 2 · 2 = 3 + 4 = 7; 7 ≠ 6","why":"C не лежить на графіку.","hl":["cd"]}],"answer":"Відповідь: A і B лежать на графіку, C — ні.","fig":{"caption":"Графік рівняння 3x + 2y = 6 — пряма через A(2; 0) і B(4; −3). Точка C(1; 2) лежить вище за пряму: при x = 1 на прямій y = 1,5.","view":[-3,-5,6,5],"axes":{"step":1,"every":1},"points":{"A":[2,0],"B":[4,-3],"C":[1,2],"HD":[1,1.5],"HO":[0,0],"Hby":[0,-3]},"hide":["HD","HO","Hby"],"lp":{"A":"ne","B":"ne","C":"ne"},"items":[{"t":"fn","k":-1.5,"b":3,"id":"f"},{"t":"seg","p":["HO","A"],"id":"oa","s":"hl"},{"t":"seg","p":["B","Hby"],"id":"by","s":"dash"},{"t":"seg","p":["C","HD"],"id":"cd","s":"hl2"},{"t":"label","at":[3.033,-4.5],"text":"3x + 2y = 6","id":"ft"}],"check":[{"on":["A",-1.5,3]},{"on":["B",-1.5,3]},{"on":["HD",-1.5,3]}]}}],"mistakes":["Позначають точку (4; 0) на осі y. Правильно: перше число — x, тож (4; 0) лежить на осі x, на 4 праворуч від початку координат.","Будують пряму за однією точкою. Через одну точку проходить безліч прямих — потрібні дві, а краще ще й третя для перевірки.","Графік y = −2 малюють вертикальним. Правильно: y = −2 у кожній точці — це горизонтальна пряма, паралельна осі x."],"check":[{"q":"Через яку точку проходить графік рівняння 2x + y = 8?","options":["(3; 1)","(1; 3)","(0; 8)","(8; 0)"],"correct":2,"a":"(0; 8): 2 · 0 + 8 = 8. Інші: 2 · 3 + 1 = 7, 2 · 1 + 3 = 5, 2 · 8 + 0 = 16."},{"q":"Пастка: який вигляд має графік рівняння y = 3?","options":["Пряма, паралельна осі x","Пряма, паралельна осі y","Одна точка (0; 3)"],"correct":0,"a":"y = 3 для будь-якого x: точки (0; 3), (1; 3), (−5; 3)… Усі на висоті 3 — горизонтальна пряма, паралельна осі x."},{"q":"Зошит коштує 10 грн, ручка — 20 грн. На 100 грн купили x зошитів і y ручок без решти: 10x + 20y = 100. Точка, де графік перетинає вісь x, — це покупка самих зошитів (y = 0). Скільки зошитів у цій точці?","accept":["10"],"a":"y = 0: 10x = 100, x = 10. Точка (10; 0). Перевірка: 10 · 10 + 20 · 0 = 100."}]}}]},{"id":"A4.2","name":"Системи двох лінійних рівнянь","what":"Що таке система, її розв'язок і способи розв'язування.","subtopics":[{"id":"A4.2.1","name":"Система і її розв'язок","status":"ready","programmeRef":"Система двох лінійних рівнянь з двома змінними та її розв'язок.","lesson":{"what":"<b>Система рівнянь<\/b> — це два рів
