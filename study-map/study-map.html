lp":{"A":"ne","B":"sw"},"items":[{"t":"line","p":["Al","Ar"]},{"t":"line","p":["Bl","Br"]},{"t":"line","p":["Cd","Cu"]},{"t":"label","at":[4.5,1.433],"text":"a"},{"t":"label","at":[4.5,-2.285],"text":"b"},{"t":"label","at":[-0.126,2.7],"text":"c"},{"t":"angle","p":["Ar","A","B"],"label":"75°","id":"a3","s":"hl"},{"t":"angle","p":["A","B","Br"],"label":"115°","id":"a6","s":"hl"}],"check":[{"col":["Al","A","Ar"]},{"col":["Bl","B","Br"]},{"col":["Cd","B","A"]},{"col":["B","A","Cu"]}]},"steps":[{"do":"∠3 і ∠6 — внутрішні односторонні; ∠3 + ∠6 = 75° + 115° = 190°.","why":"Обидва між прямими, праворуч від січної.","hl":["a3","a6"]},{"do":"Припустимо, що a ∥ b. Тоді ∠3 + ∠6 = 180°.","why":"Доведення від супротивного: властивість паралельних прямих.","hl":["a3","a6"]},{"do":"Але 190° ≠ 180° — суперечність. Отже, a і b не паралельні.","why":"Припущення хибне."}],"answer":"Відповідь: ні, прямі a і b не паралельні."}],"mistakes":["Користуватися властивостями (рівністю кутів), коли не сказано, що прямі паралельні. Без a ∥ b кути можуть бути будь-якими.","Вважати внутрішні односторонні кути рівними. Для паралельних прямих їхня сума 180°.","Думати, що обернене твердження завжди правильне. Його треба доводити окремо: «рівні кути — вертикальні» хибне, а властивості паралельних прямих — правильні."],"check":[{"q":"Паралельні прямі a і b перетнуто січною c, ∠1 = 54° (див. малюнок). Знайдіть ∠6. Введіть число.","fig":{"caption":"Паралельні прямі a і b, січна c; ∠1 = 54° (над a ліворуч від січної), ∠6 шуканий (над b праворуч від січної).","view":[-5,-3.0,5,3.0],"points":{"A":[-1.09,1.5],"B":[1.09,-1.5],"Al":[-4.09,1.5],"Ar":[1.91,1.5],"Bl":[-1.91,-1.5],"Br":[4.09,-1.5],"Cu":[-2.853,3.927],"Cd":[2.853,-3.927]},"hide":["Al","Ar","Bl","Br","Cu","Cd"],"lp":{"A":"ne","B":"sw"},"items":[{"t":"line","p":["Al","Ar"]},{"t":"line","p":["Bl","Br"]},{"t":"line","p":["Cd","Cu"]},{"t":"label","at":[4.5,1.85],"text":"a"},{"t":"label","at":[4.5,-1.15],"text":"b"},{"t":"label","at":[-1.612,2.7],"text":"c"},{"t":"angle","p":["Al","A","Cu"],"label":"54°","id":"a1","s":"hl"},{"t":"angle","p":["A","B","Br"],"label":"?","id":"a6","s":"hl2"}],"check":[{"col":["Al","A","Ar"]},{"col":["Bl","B","Br"]},{"col":["Cd","B","A"]},{"col":["B","A","Cu"]},{"par":[["Al","Ar"],["Bl","Br"]]}]},"accept":["126"],"a":"∠5 = ∠1 = 54° (відповідні, a ∥ b). ∠6 суміжний з ∠5: 180° − 54° = 126°. Інакше: ∠2 = 126° (суміжний з ∠1), ∠6 = ∠2 (відповідні)."},{"q":"<b>Пастка.<\/b> Паралельні прямі a і b перетнуто січною c, ∠4 = 70° (див. малюнок). Учень вважає, що кут 5 теж має 70°. Знайдіть ∠5 правильно. Введіть число.","fig":{"caption":"Паралельні прямі a і b, січна c; ∠4 = 70° (під a ліворуч від січної), ∠5 шуканий (над b ліворуч від січної).","view":[-5,-3.0,5,3.0],"points":{"A":[0.546,1.5],"B":[-0.546,-1.5],"Al":[-2.454,1.5],"Ar":[3.546,1.5],"Bl":[-3.546,-1.5],"Br":[2.454,-1.5],"Cu":[1.572,4.319],"Cd":[-1.572,-4.319]},"hide":["Al","Ar","Bl","Br","Cu","Cd"],"lp":{"A":"nw","B":"se"},"items":[{"t":"line","p":["Al","Ar"]},{"t":"line","p":["Bl","Br"]},{"t":"line","p":["Cd","Cu"]},{"t":"label","at":[4.5,1.85],"text":"a"},{"t":"label","at":[4.5,-1.15],"text":"b"},{"t":"label","at":[0.633,2.7],"text":"c"},{"t":"angle","p":["B","A","Al"],"label":"70°","id":"a4","s":"hl"},{"t":"angle","p":["Bl","B","A"],"label":"?","id":"a5","s":"hl2"}],"check":[{"col":["Al","A","Ar"]},{"col":["Bl","B","Br"]},{"col":["Cd","B","A"]},{"col":["B","A","Cu"]},{"par":[["Al","Ar"],["Bl","Br"]]}]},"accept":["110"],"a":"∠4 і ∠5 — внутрішні односторонні, їхня сума 180°: ∠5 = 180° − 70° = 110°. Рівні були б різносторонні кути ∠3 і ∠5."},{"q":"Дві рейки прямої залізниці паралельні. Пряма дорога перетинає першу рейку під кутом 62°. Під яким кутом вона перетинає другу рейку? Введіть число.","accept":["62"],"a":"Дорога — січна для паралельних рейок. Відповідні кути рівні, тож кут між дорогою і другою рейкою теж 62°."}]}}]}]},{"id":"G3","subject":"geometry","name":"Трикутники. Ознаки рівності трикутників","what":"Найважливіша фігура 7 класу: її елементи, види, рівність і властивості кутів і сторін.","topics":[{"id":"G3.1","name":"Трикутник і його елементи","what":"Сторони, кути, висота, бісектриса, медіана.","subtopics":[{"id":"G3.1.1","name":"Трикутник і його елементи","status":"ready","programmeRef":"Трикутник і його елементи.","lesson":{"what":"<b>Трикутник<\/b> — фігура з трьох точок, які не лежать на одній прямій, і трьох відрізків, що їх сполучають. Точки — це <b>вершини<\/b> трикутника, відрізки — його <b>сторони<\/b>. Трикутник ABC записують коротко: △ABC.","ideas":["У △ABC три вершини (A, B, C), три сторони (AB, BC, CA) і три <b>кути<\/b>: ∠A, ∠B, ∠C. Повна назва кута A — ∠BAC: вершина кута завжди посередині.","Кожна сторона лежить <b>проти<\/b> одного кута: сторона BC — проти ∠A, сторона AC — проти ∠B, сторона AB — проти ∠C. Два інші кути <b>прилеглі<\/b> до сторони: ∠B і ∠C прилеглі до BC.","<b>Периметр<\/b> трикутника — сума довжин усіх трьох сторін. Позначають буквою P.","△ABC, △BCA, △CAB — назви одного й того самого трикутника: важливо лише, які три точки — вершини.","Якщо три точки лежать на одній прямій, трикутника вони не утворюють: відрізки «злипаються» в один."],"rules":[{"f":"P<sub>△ABC<\/sub> = AB + BC + CA","means":"Щоб знайти периметр, додай довжини всіх трьох сторін."},{"f":"Сторона BC лежить проти ∠A; ∠B і ∠C прилеглі до сторони BC.","means":"Протилежний кут «дивиться» на сторону з іншої вершини, прилеглі кути — на кінцях цієї сторони."}],"examples":[{"task":"Назвіть вершини, сторони і кути △MNK. Яка сторона лежить проти кута N? Які кути прилеглі до сторони MK?","fig":{"caption":"Трикутник MNK: сторона MK внизу, вершина N угорі.","view":[-1.0,-1.0,8.0,5.0],"points":{"M":[0.0,0.0],"N":[2.5,4],"K":[7,0.0]},"items":[{"t":"poly","p":["M","N","K"]},{"t":"seg","p":["M","K"],"s":"hl","id":"s1"},{"t":"angle","p":["M","N","K"],"s":"hl2","id":"aN"},{"t":"angle","p":["N","M","K"],"s":"hl","id":"aM"},{"t":"angle","p":["M","K","N"],"s":"hl","id":"aK"}]},"steps":[{"do":"Вершини: M, N, K. Сторони: MN, NK, MK. Кути: ∠M, ∠N, ∠K (повністю ∠NMK, ∠MNK, ∠MKN).","why":"Вершини — три точки, сторони — відрізки між ними, у назві кута вершина посередині."},{"do":"Проти ∠N лежить сторона MK.","why":"Протилежна сторона сполучає дві інші вершини — M і K.","hl":["aN","s1"]},{"do":"До сторони MK прилеглі кути M і K.","why":"Прилеглі кути мають вершини на кінцях сторони.","hl":["s1","aM","aK"]}],"answer":"Відповідь: проти ∠N лежить сторона MK; до MK прилеглі ∠M і ∠K."},{"task":"Сторони трикутника ABC: AB = 5 см, BC = 7 см, AC = 6 см. Знайдіть периметр трикутника.","fig":{"caption":"Трикутник ABC: AB = 5 см, BC = 7 см, AC = 6 см.","view":[-1.0,-1.0,7.0,5.899],"points":{"A":[0.0,0.0],"B":[1,4.899],"C":[6,0.0]},"items":[{"t":"poly","p":["A","B","C"],"s":"hl","id":"t"},{"t":"label","at":[0.01,2.549],"text":"5 см"},{"t":"label","at":[3.85,2.807],"text":"7 см"},{"t":"label","at":[3.0,-0.5],"text":"6 см"}],"check":[{"len":[["A","B"],5]},{"len":[["B","C"],7]},{"len":[["A","C"],6]}]},"steps":[{"do":"Дано: AB = 5 см, BC = 7 см, AC = 6 см. Знайти: P<sub>△ABC<\/sub>.","why":"Записуємо умову."},{"do":"P = AB + BC + AC = 5 + 7 + 6.","why":"Периметр — сума всіх трьох сторін.","hl":["t"]},{"do":"5 + 7 + 6 = 18 (см).","why":"Додаємо."}],"answer":"Відповідь: 18 см."},{"task":"Периметр трикутника 32 см. Одна його сторона 8 см, а друга на 3 см довша за першу. Знайдіть третю сторону.","fig":{"caption":"Трикутник ABC з периметром 32 см: AB = 8 см, BC на 3 см довша, сторона AC невідома.","view":[-1.0,-1.0,14.0,7.741],"points":{"A":[0.0,0.0],"B":[4.308,6.741],"C":[13,0.0]},"items":[{"t":"poly","p":["A","B","C"]},{"t":"seg","p":["A","B"],"s":"hl","id":"ab"},{"t":"seg","p":["B","C"],"s":"hl","id":"bc"},{"t":"seg","p":["A","C"],"s":"hl2","id":"ac"},{"t":"label","at":[1.733,3.64],"text":"8 см"},{"t":"label","at":[8.96,3.766],"text":"8 + 3"},{"t":"label","at":[6.5,-0.5],"text":"?"}],"check":[{"len":[["A","B"],8]},{"len":[["B","C"],11]},{"len":[["A","C"],13]}]},"steps":[{"do":"Дано: P = 32 см, AB = 8 см, BC = AB + 3 см. Знайти: AC.","why":"Позначаємо сторони на малюнку."},{"do":"BC = 8 + 3 = 11 (см).","why":"Друга сторона на 3 см довша за першу.","hl":["bc"]},{"do":"AB + BC = 8 + 11 = 19 (см).","why":"Сума двох відомих сторін.","hl":["ab","bc"]},{"do":"AC = 32 − 19 = 13 (см). Перевірка: 8 + 11 + 13 = 32.","why":"Периметр — сума всіх сторін, тож третя сторона — це периметр без двох інших.","hl":["ac"]}],"answer":"Відповідь: 13 см."}],"mistakes":["Плутають протилежну сторону з прилеглою: «проти ∠A лежить AB». Правильно: проти ∠A лежить сторона BC — та, на якій немає вершини A.","Пишуть ∠ABC, маючи на увазі кут A. Правильно: у назві з трьох літер вершина посередині, тож кут A — це ∠BAC.","Для периметра додають лише дві сторони. Правильно: периметр — сума <b>всіх трьох<\/b> сторін."],"check":[{"q":"<b>Пастка.<\/b> Яка сторона △ABC лежить проти кута B?","fig":{"caption":"Трикутник ABC.","view":[-1.0,-1.0,8.0,4.8],"points":{"A":[0.0,0.0],"B":[2.2,3.8],"C":[7,0.0]},"items":[{"t":"poly","p":["A","B","C"]},{"t":"angle","p":["A","B","C"],"s":"hl"}]},"options":["AB","BC","AC"],"correct":2,"a":"AC. Протилежна до ∠B сторона сполучає дві інші вершини — A і C. Сторони AB і BC прилеглі до ∠B."},{"q":"Ділянку у формі трикутника зі сторонами 12 м, 15 м і 20 м треба обгородити сіткою. Скільки метрів сітки потрібно? Введіть число.","accept":["47"],"a":"Потрібен периметр: 12 + 15 + 20 = 47 (м)."},{"q":"Периметр трикутника 24 см, дві його сторони — 7 см і 9 см. Знайдіть третю сторону (у сантиметрах).","accept":["8"],"a":"24 − 7 − 9 = 8 (см). Перевірка: 7 + 9 + 8 = 24."}],"fig":{"caption":"Трикутник ABC з вершинами A, B, C. Виділено кут A і протилежну йому сторону BC.","view":[-1.0,-1.0,8.0,4.8],"points":{"A":[0.0,0.0],"B":[2.2,3.8],"C":[7,0.0]},"items":[{"t":"poly","p":["A","B","C"],"fill":true},{"t":"angle","p":["B","A","C"],"s":"hl"},{"t":"seg","p":["B","C"],"s":"hl2"}]}}},{"id":"G3.1.2","name":"Висота, бісектриса і медіана","status":"ready","programmeRef":"Висота, бісектриса і медіана трикутника.","lesson":{"what":"З кожної вершини трикутника можна провести три особливі відрізки до протилежної сторони. <b>Медіана<\/b> сполучає вершину з серединою протилежної сторони. <b>Бісектриса<\/b> трикутника — відрізок бісектриси кута від вершини до протилежної сторони. <b>Висота<\/b> — перпендикуляр, проведений з вершини до прямої, що містить протилежну сторону.","ideas":["Медіана ділить навпіл <b>сторону<\/b>: якщо BM — медіана △ABC, то AM = MC.","Бісектриса ділить навпіл <b>кут<\/b>: якщо BL — бісектриса, то ∠ABL = ∠LBC.","Висота утворює з прямою протилежної сторони <b>прямий кут<\/b> (90°). Точку, де висота перетинає цю пряму, називають основою висоти.","У кожного трикутника по три медіани, три бісектриси і три висоти — по одній з кожної вершини.","Якщо кут трикутника тупий, то висоти з двох інших вершин падають не на сторону, а на її продовження — поза трикутник."],"rules":[{"f":"BM — медіана △ABC ⇒ AM = MC","means":"Медіана впирається в середину протилежної сторони."},{"f":"BL — бісектриса △ABC ⇒ ∠ABL = ∠LBC = ∠ABC : 2","means":"Бісектриса ділить кут трикутника на два рівні кути."},{"f":"BH — висота △ABC ⇒ BH ⊥ AC, ∠BHA = 90°","means":"Висота перпендикулярна до прямої, що містить протилежну сторону."}],"examples":[{"task":"AM — медіана трикутника ABC, BC = 14 см. Знайдіть BM.","fig":{"caption":"Трикутник ABC, AM — медіана: точка M — середина сторони BC, BC = 14 см.","view":[-1.0,-1.0,15.0,6.0],"points":{"A":[4,5],"B":[0.0,0.0],"C":[14,0.0],"M":[7,0.0]},"lp":{"M":"s"},"items":[{"t":"poly","p":["A","B","C"]},{"t":"seg","p":["A","M"],"s":"hl","id":"am"},{"t":"seg","p":["B","M"],"ticks":1,"s":"hl2","id":"bm"},{"t":"seg","p":["M","C"],"ticks":1,"id":"mc"}],"check":[{"mid":["M","B","C"]},{"len":[["B","C"],14]}]},"steps":[{"do":"Дано: AM — медіана △ABC, BC = 14 см. Знайти: BM.","why":"Записуємо умову, позначаємо на малюнку.","hl":["am"]},{"do":"M — середина BC, тому BM = MC.","why":"Медіана сполучає вершину з серединою протилежної сторони.","hl":["bm","mc"]},{"do":"BM = 14 : 2 = 7 (см).","why":"Сторона BC складається з двох рівних половин.","hl":["bm"]}],"answer":"Відповідь: 7 см."},{"task":"AL — бісектриса трикутника ABC, ∠BAC = 72°. Знайдіть ∠BAL.","fig":{"caption":"Трикутник ABC, ∠BAC = 72°; AL — бісектриса, вона ділить кут A на два рівні кути.","view":[-1.0,-1.0,9.0,5.755],"points":{"A":[0.0,0.0],"B":[1.545,4.755],"C":[8,0.0],"L":[4.028,2.926]},"lp":{"L":"ne"},"items":[{"t":"poly","p":["A","B","C"]},{"t":"angle","p":["C","A","B"],"label":"72°","r":46,"id":"big"},{"t":"seg","p":["A","L"],"s":"hl","id":"al"},{"t":"angle","p":["B","A","L"],"arcs":1,"label":"?","s":"hl","r":26,"id":"a1"},{"t":"angle","p":["L","A","C"],"arcs":1,"s":"hl2","r":26,"id":"a2"}],"check":[{"col":["B","L","C"]},{"ang":[["B","A","C"],72]}]},"steps":[{"do":"Дано: AL — бісектриса △ABC, ∠BAC = 72°. Знайти: ∠BAL.","why":"Записуємо умову.","hl":["big"]},{"do":"∠BAL = ∠LAC.","why":"Бісектриса ділить кут навпіл.","hl":["a1","a2"]},{"do":"∠BAL = 72° : 2 = 36°.","why":"Кут BAC складається з двох рівних частин.","hl":["a1"]}],"answer":"Відповідь: 36°."},{"task":"BK — висота трикутника ABC, ∠ABK = 25°, ∠KBC = 40°. Знайдіть ∠ABC і ∠AKB. Чи є BK бісектрисою трикутника?","fig":{"caption":"Трикутник ABC, BK — висота до сторони AC; ∠ABK = 25°, ∠KBC = 40°.","view":[-2.865,-1.0,4.356,5.0],"points":{"A":[-1.865,0.0],"B":[0.0,4],"C":[3.356,0.0],"K":[0.0,0.0]},"lp":{"K":"s"},"items":[{"t":"poly","p":["A","B","C"]},{"t":"seg","p":["B","K"],"s":"hl","id":"bk"},{"t":"right","p":["A","K","B"],"id":"r"},{"t":"angle","p":["A","B","K"],"label":"25°","s":"hl2","id":"a1"},{"t":"angle","p":["K","B","C"],"label":"40°","s":"hl2","id":"a2"}],"check":[{"col":["A","K","C"]},{"perp":[["B","K"],["A","C"]]}]},"steps":[{"do":"Дано: BK — висота, ∠ABK = 25°, ∠KBC = 40°. Знайти: ∠ABC, ∠AKB.","why":"Записуємо умову.","hl":["bk"]},{"do":"∠ABC = ∠ABK + ∠KBC = 25° + 40° = 65°.","why":"Промінь BK проходить між сторонами кута B, тож кут дорівнює сумі частин.","hl":["a1","a2"]},{"do":"∠AKB = 90°.","why":"Висота перпендикулярна до прямої AC.","hl":["r"]},{"do":"25° ≠ 40°, тож BK не ділить кут B навпіл.","why":"Бісектриса ділила б кут на дві рівні частини.","hl":["a1","a2"]}],"answer":"Відповідь: ∠ABC = 65°, ∠AKB = 90°; BK не є бісектрисою."}],"mistakes":["Плутають медіану з бісектрисою: «медіана ділить кут навпіл». Правильно: медіана ділить навпіл <b>сторону<\/b>, а бісектриса — <b>кут<\/b>.","Проводять «висоту» до середини сторони або навскіс. Правильно: висота завжди перпендикулярна до прямої протилежної сторони, а куди саме вона впаде — залежить від трикутника.","Думають, що висота завжди всередині трикутника. Правильно: якщо в трикутнику є тупий кут, дві висоти лежать поза ним — на продовженнях сторін."],"check":[{"q":"<b>Пастка.<\/b> Медіана трикутника ділить навпіл…","options":["кут, з вершини якого її проведено","протилежну сторону","і кут, і протилежну сторону"],"correct":1,"a":"Протилежну сторону. Кут навпіл ділить бісектриса; медіана в загальному випадку кут навпіл не ділить."},{"q":"AL — бісектриса трикутника ABC, ∠BAL = 31°. Знайдіть ∠BAC (у градусах).","fig":{"caption":"Трикутник ABC, AL — бісектриса; ∠BAL = 31°, кут BAC позначено знаком питання.","view":[-1.0,-1.0,9.0,5.856],"points":{"A":[0.0,0.0],"B":[2.582,4.856],"C":[8,0.0],"L":[4.789,2.878]},"lp":{"L":"ne"},"items":[{"t":"poly","p":["A","B","C"]},{"t":"seg","p":["A","L"],"s":"hl"},{"t":"angle","p":["B","A","L"],"label":"31°","r":30},{"t":"angle","p":["C","A","B"],"label":"?","r":50,"s":"hl2"}],"check":[{"col":["B","L","C"]},{"ang":[["B","A","L"],31]},{"ang":[["L","A","C"],31]}]},"accept":["62"],"a":"Бісектриса ділить кут навпіл, тому ∠BAC = 2 · 31° = 62°."},{"q":"Трикутний шматок фанери треба розрізати від вершини одним прямим розрізом так, щоб протилежний край поділився навпіл. Який відрізок трикутника треба провести?","options":["Висоту","Бісектрису","Медіану"],"correct":2,"a":"Медіану: вона сполучає вершину із серединою протилежної сторони."}],"fig":{"caption":"Трикутник ABC і три відрізки з вершини B до сторони AC: висота BH (BH ⊥ AC), бісектриса BL (ділить кут B навпіл), медіана BM (M — середина AC).","view":[-1.0,-1.0,9.0,5.0],"points":{"A":[0.0,0.0],"B":[2,4],"C":[8,0.0],"H":[2,0.0],"L":[3.062,0.0],"M":[4,0.0]},"lp":{"H":"s","L":"s","M":"s"},"items":[{"t":"poly","p":["A","B","C"]},{"t":"seg","p":["B","H"],"s":"hl"},{"t":"right","p":["A","H","B"]},{"t":"seg","p":["B","L"],"s":"hl2"},{"t":"angle","p":["A","B","L"],"arcs":1,"s":"hl2"},{"t":"angle","p":["L","B","C"],"arcs":1,"s":"hl2"},{"t":"seg","p":["B","M"],"s":"dash"},{"t":"seg","p":["A","M"],"ticks":2},{"t":"seg","p":["M","C"],"ticks":2}],"check":[{"mid":["M","A","C"]},{"perp":[["B","H"],["A","C"]]}]}}}]},{"id":"G3.2","name":"Рівність трикутників","what":"Коли два трикутники рівні і як це довести.","subtopics":[{"id":"G3.2.1","name":"Рівні фігури","status":"ready","programmeRef":"Рівність геометричних фігур.","lesson":{"what":"Дві фігури називають <b>рівними<\/b>, якщо їх можна сумістити накладанням — так, щоб вони повністю збіглися. У рівних трикутниках <b>відповідні<\/b> сторони і <b>відповідні<\/b> кути рівні.","ideas":["Уяви, що одну фігуру вирізали з паперу. Якщо її можна перекласти (зсунути, повернути або перевернути) так, що вона точно закриє другу, — фігури рівні.","Рівність трикутників записують так: △ABC = △KMN. <b>Порядок літер важливий<\/b>: A накладається на K, B — на M, C — на N.","Відповідні елементи «читаємо» з запису: AB = KM, BC = MN, AC = KN, ∠A = ∠K, ∠B = ∠M, ∠C = ∠N.","На малюнках рівні сторони позначають однаковою кількістю рисочок, а рівні кути — однаковою кількістю дуг.","У рівних фігур рівні й периметри. Але однаковий периметр ще не означає, що фігури рівні."],"rules":[{"f":"△ABC = △A₁B₁C₁ ⇒ AB = A₁B₁, BC = B₁C₁, AC = A₁C₁, ∠A = ∠A₁, ∠B = ∠B₁, ∠C = ∠C₁","means":"У рівних трикутниках рівні всі відповідні сторони і всі відповідні кути. Відповідні — ті, що на однакових місцях у записі."}],"examples":[{"task":"△ABC = △KMN, AB = 6 см, ∠B = 50°. Знайдіть сторону KM і кут M.","fig":{"caption":"Рівні трикутники ABC і KMN (другий — дзеркальна копія першого): AB = 6 см, ∠B = 50°; сторона KM і кут M позначені знаком питання.","view":[-1.0,-1.0,18.0,5.596],"points":{"A":[3.857,4.596],"B":[0.0,0.0],"C":[7,0.0],"K":[13.143,4.596],"M":[17.0,0.0],"N":[10.0,0.0]},"items":[{"t":"poly","p":["A","B","C"]},{"t":"poly","p":["K","M","N"]},{"t":"seg","p":["A","B"],"ticks":1,"s":"hl","id":"ab"},{"t":"seg","p":["K","M"],"ticks":1,"s":"hl","id":"km"},{"t":"label","at":[1.545,2.619],"text":"6 см"},{"t":"label","at":[15.455,2.619],"text":"?"},{"t":"angle","p":["A","B","C"],"arcs":1,"label":"50°","s":"hl2","id":"b"},{"t":"angle","p":["K","M","N"],"arcs":1,"label":"?","s":"hl2","id":"m"}],"check":[{"len":[["A","B"],6]},{"ang":[["A","B","C"],50]},{"eq":[["A","B"],["K","M"]]}]},"steps":[{"do":"Дано: △ABC = △KMN, AB = 6 см, ∠B = 50°. Знайти: KM, ∠M.","why":"Записуємо умову."},{"do":"З запису: A ↔ K, B ↔ M, C ↔ N.","why":"Порядок літер показує, яка вершина на яку накладається."},{"do":"AB відповідає KM, тому KM = AB = 6 см.","why":"Відповідні сторони рівних трикутників рівні.","hl":["ab","km"]},{"do":"∠B відповідає ∠M, тому ∠M = ∠B = 50°.","why":"Відповідні кути рівних трикутників рівні.","hl":["b","m"]}],"answer":"Відповідь: KM = 6 см, ∠M = 50°."},{"task":"△ABC = △DEF. AB = 5 см, BC = 7 см, DF = 6 см. Знайдіть периметр трикутника DEF.","fig":{"caption":"Рівні трикутники ABC і DEF (другий повернуто): AB = 5 см, BC = 7 см, DF = 6 см.","view":[-1.0,-1.399,14.0,5.899],"points":{"A":[0.0,0.0],"B":[1,4.899],"C":[6,0.0],"D":[13.0,4.5],"E":[12.0,-0.399],"F":[7.0,4.5]},"items":[{"t":"poly","p":["A","B","C"]},{"t":"poly","p":["D","E","F"],"s":"hl","id":"def"},{"t":"seg","p":["A","B"],"ticks":1,"id":"ab"},{"t":"seg","p":["D","E"],"ticks":1,"id":"de"},{"t":"seg","p":["B","C"],"ticks":2,"id":"bc"},{"t":"seg","p":["E","F"],"ticks":2,"id":"ef"},{"t":"seg","p":["A","C"],"ticks":3,"id":"ac"},{"t":"seg","p":["D","F"],"ticks":3,"id":"df"},{"t":"label","at":[0.01,2.549],"text":"5 см"},{"t":"label","at":[3.85,2.807],"text":"7 см"},{"t":"label","at":[10.0,5.0],"text":"6 см"}],"check":[{"len":[["A","B"],5]},{"len":[["B","C"],7]},{"len":[["D","F"],6]}]},"steps":[{"do":"Відповідність: A ↔ D, B ↔ E, C ↔ F.","why":"Читаємо з запису △ABC = △DEF."},{"do":"DE = AB = 5 см, EF = BC = 7 см.","why":"Відповідні сторони рівних трикутників рівні.","hl":["ab","de","bc","ef"]},{"do":"P<sub>△DEF<\/sub> = DE + EF + DF = 5 + 7 + 6 = 18 (см).","why":"Периметр — сума всіх сторін.","hl":["def"]}],"answer":"Відповідь: 18 см."},{"task":"Трикутники ABC і ABD мають спільну сторону AB, точки C і D лежать по різні боки від прямої AB, і △ABC = △ABD. ∠CAB = 40°. Знайдіть ∠CAD.","fig":{"caption":"Рівні трикутники ABC і ABD зі спільною стороною AB, точки C і D — по різні боки від AB; ∠CAB = 40°, кут CAD позначено знаком питання.","view":[-1.0,-3.571,7.0,3.571],"points":{"A":[0.0,0.0],"B":[6,0.0],"C":[3.064,2.571],"D":[3.064,-2.571]},"items":[{"t":"poly","p":["A","B","C"]},{"t":"poly","p":["A","B","D"]},{"t":"seg","p":["A","C"],"ticks":1},{"t":"seg","p":["A","D"],"ticks":1},{"t":"seg","p":["B","C"],"ticks":2},{"t":"seg","p":["B","D"],"ticks":2},{"t":"angle","p":["C","A","B"],"arcs":1,"label":"40°","s":"hl","r":28,"id":"a1"},{"t":"angle","p":["B","A","D"],"arcs":1,"s":"hl","r":28,"id":"a2"},{"t":"angle","p":["C","A","D"],"label":"?","s":"hl2","r":48,"id":"a3"}],"check":[{"ang":[["C","A","B"],40]},{"eq":[["A","C"],["A","D"]]},{"eq":[["B","C"],["B","D"]]}]},"steps":[{"do":"Дано: △ABC = △ABD, ∠CAB = 40°. Знайти: ∠CAD.","why":"Записуємо умову.","hl":["a1"]},{"do":"∠BAD = ∠BAC = 40°.","why":"Вершина A відповідає A, тож кути при вершині A рівних трикутників рівні.","hl":["a1","a2"]},{"do":"∠CAD = ∠CAB + ∠BAD = 40° + 40° = 80°.","why":"Промінь AB проходить між сторонами кута CAD (C і D по різні боки від AB).","hl":["a3"]}],"answer":"Відповідь: 80°."}],"mistakes":["Беруть відповідні елементи «за малюнком на око», а не за записом. Правильно: з △ABC = △KMN випливає BC = MN, бо B ↔ M і C ↔ N.","Думають, що повернутий чи перевернутий трикутник — уже не рівний. Правильно: повертати й перевертати можна, головне — щоб фігури збіглися.","Вважають рівними трикутники з однаковим периметром. Правильно: периметри 3 + 4 + 5 і 4 + 4 + 4 однакові, а трикутники різні."],"check":[{"q":"<b>Пастка.<\/b> △ABC = △MNK. Яка сторона трикутника MNK дорівнює стороні BC?","options":["NK","MN","MK"],"correct":0,"a":"NK: B ↔ N, C ↔ K, тому BC = NK."},{"q":"△ABC = △PQR, AB = 4 см, BC = 5 см, AC = 6 см. Знайдіть периметр △PQR (у сантиметрах).","accept":["15"],"a":"У рівних трикутників відповідні сторони рівні, тож і периметри рівні: 4 + 5 + 6 = 15 (см)."},{"q":"Дві кахлини з однієї упаковки мають однакову трикутну форму й розміри. Одну з них повернули на підлозі. Чи рівні вони як фігури?","options":["Ні, бо одну повернули","Так","Лише якщо їх не повертати"],"correct":1,"a":"Так: одну кахлину можна накласти на другу (повернувши), і вони збіжуться."}],"fig":{"caption":"Рівні трикутники ABC і A₁B₁C₁: другий — повернута копія першого. Рівні сторони позначено однаковими рисочками, рівні кути — однаковими дугами.","view":[-1.0,-1.0,15.938,6.148],"points":{"A":[0.0,0.0],"B":[6,0.0],"C":[2.25,3.307],"A1":[9.5,1.2],"B1":[14.938,3.736],"C1":[10.142,5.148]},"items":[{"t":"poly","p":["A","B","C"],"fill":true},{"t":"poly","p":["A1","B1","C1"],"fill":true},{"t":"seg","p":["A","B"],"ticks":1},{"t":"seg","p":["A1","B1"],"ticks":1},{"t":"seg","p":["B","C"],"ticks":2},{"t":"seg","p":["B1","C1"],"ticks":2},{"t":"seg","p":["A","C"],"ticks":3},{"t":"seg","p":["A1","C1"],"ticks":3},{"t":"angle","p":["B","A","C"],"arcs":1},{"t":"angle","p":["B1","A1","C1"],"arcs":1},{"t":"angle","p":["A","B","C"],"arcs":2},{"t":"angle","p":["A1","B1","C1"],"arcs":2},{"t":"angle","p":["A","C","B"],"arcs":3},{"t":"angle","p":["A1","C1","B1"],"arcs":3}]}}},{"id":"G3.2.2","name":"Ознаки рівності трикутників","status":"ready","programmeRef":"Ознаки рівності трикутників.","lesson":{"what":"Щоб довести, що два трикутники рівні, не треба вирізати їх і накладати. Досить знайти три пари рівних елементів, розміщених певним чином. Такі умови називають <b>ознаками рівності трикутників<\/b>.","ideas":["<b>Перша ознака<\/b> (за двома сторонами і кутом між ними): кут має лежати саме між цими двома сторонами.","<b>Друга ознака<\/b> (за стороною і двома прилеглими кутами): обидва кути мають прилягати до цієї сторони — лежати на її кінцях.","<b>Третя ознака<\/b> (за трьома сторонами): досить, щоб відповідні сторони були попарно рівні.","Часто допомагають «безкоштовні» рівності: <b>спільна сторона<\/b> двох трикутників і <b>вертикальні кути<\/b> (вони завжди рівні).","Довівши рівність трикутників, отримуємо рівність і всіх інших відповідних елементів — так розв'язують багато задач."],"rules":[{"f":"AB = A₁B₁, AC = A₁C₁, ∠A = ∠A₁ ⇒ △ABC = △A₁B₁C₁","means":"Перша ознака: дві сторони і кут між ними."},{"f":"AB = A₁B₁, ∠A = ∠A₁, ∠B = ∠B₁ ⇒ △ABC = △A₁B₁C₁","means":"Друга ознака: сторона і два прилеглі до неї кути."},{"f":"AB = A₁B₁, BC = B₁C₁, AC = A₁C₁ ⇒ △ABC = △A₁B₁C₁","means":"Третя ознака: три сторони."}],"examples":[{"task":"Відрізки AB і CD перетинаються в точці O, яка є серединою кожного з них. AC = 5 см. Знайдіть BD. (Перша ознака.)","fig":{"caption":"Відрізки AB і CD перетинаються в точці O, яка є серединою кожного з них. Сполучено A з C і B з D; AC = 5 см.","view":[-3.954,-4.5,3.954,4.5],"points":{"A":[-2.954,-0.521],"B":[2.954,0.521],"C":[0.018,3.5],"D":[-0.018,-3.5],"O":[0.0,0.0]},"lp":{"O":"e"},"items":[{"t":"seg","p":["A","O"],"ticks":1,"id":"ao"},{"t":"seg","p":["O","B"],"ticks":1,"id":"ob"},{"t":"seg","p":["C","O"],"ticks":2,"id":"co"},{"t":"seg","p":["O","D"],"ticks":2,"id":"od"},{"t":"seg","p":["A","C"],"s":"hl","id":"ac"},{"t":"seg","p":["B","D"],"s":"hl2","id":"bd"},{"t":"angle","p":["A","O","C"],"arcs":1,"id":"o1"},{"t":"angle","p":["B","O","D"],"arcs":1,"id":"o2"},{"t":"label","at":[-1.87,1.787],"text":"5 см"},{"t":"label","at":[1.87,-1.787],"text":"?"}],"check":[{"mid":["O","A","B"]},{"mid":["O","C","D"]},{"len":[["A","C"],5]}]},"steps":[{"do":"Розглянемо △AOC і △BOD. AO = OB і CO = OD.","why":"O — середина відрізків AB і CD.","hl":["ao","ob","co","od"]},{"do":"∠AOC = ∠BOD.","why":"Це вертикальні кути, а вертикальні кути рівні.","hl":["o1","o2"]},{"do":"△AOC = △BOD.","why":"За першою ознакою: дві сторони і кут між ними."},{"do":"BD = AC = 5 см.","why":"Відповідні сторони рівних трикутників рівні (BD лежить проти ∠BOD, AC — проти ∠AOC).","hl":["ac","bd"]}],"answer":"Відповідь: BD = 5 см."},{"task":"Точки B і D лежать по різні боки від прямої AC, ∠BAC = ∠DAC і ∠BCA = ∠DCA. AB = 7 см. Знайдіть AD. (Друга ознака.)","fig":{"caption":"Трикутники ABC і ADC зі спільною стороною AC, точки B і D — по різні боки від AC; ∠BAC = ∠DAC, ∠BCA = ∠DCA, AB = 7 см.","view":[-1.0,-5.015,10.103,5.015],"points":{"A":[0.0,0.0],"B":[5.734,4.015],"C":[9.103,0.0],"D":[5.734,-4.015]},"lp":{"A":"w","C":"e"},"items":[{"t":"poly","p":["A","B","C"]},{"t":"poly","p":["A","D","C"]},{"t":"seg","p":["A","C"],"s":"hl2","id":"ac"},{"t":"angle","p":["B","A","C"],"arcs":1,"s":"hl","id":"a1"},{"t":"angle","p":["C","A","D"],"arcs":1,"s":"hl","id":"a2"},{"t":"angle","p":["A","C","B"],"arcs":2,"s":"hl","id":"c1"},{"t":"angle","p":["D","C","A"],"arcs":2,"s":"hl","id":"c2"},{"t":"seg","p":["A","B"],"id":"ab"},{"t":"seg","p":["A","D"],"id":"ad"},{"t":"label","at":[2.58,2.417],"text":"7 см"},{"t":"label","at":[2.58,-2.417],"text":"?"}],"check":[{"len":[["A","B"],7]}]},"steps":[{"do":"Розглянемо △ABC і △ADC. Сторона AC — спільна.","why":"Спільна сторона дорівнює сама собі.","hl":["ac"]},{"do":"∠BAC = ∠DAC і ∠BCA = ∠DCA.","why":"За умовою; ці кути прилеглі до сторони AC.","hl":["a1","a2","c1","c2"]},{"do":"△ABC = △ADC.","why":"За другою ознакою: сторона і два прилеглі кути."},{"do":"AD = AB = 7 см.","why":"Відповідні сторони рівних трикутників рівні.","hl":["ab","ad"]}],"answer":"Відповідь: AD = 7 см."},{"task":"У чотирикутнику ABCD AB = AD і CB = CD, ∠BAD = 70°. Знайдіть ∠BAC. (Третя ознака.)","fig":{"caption":"Чотирикутник ABCD: AB = AD, CB = CD, проведено відрізок AC; ∠BAD = 70°, кут BAC позначено знаком питання.","view":[-1.0,-3.294,8.0,3.294],"points":{"A":[0.0,0.0],"B":[3.277,2.294],"C":[7,0.0],"D":[3.277,-2.294]},"lp":{"A":"w","C":"e"},"items":[{"t":"poly","p":["A","B","C","D"]},{"t":"seg","p":["A","C"],"s":"hl2","id":"ac"},{"t":"seg","p":["A","B"],"ticks":1,"s":"hl","id":"ab"},{"t":"seg","p":["A","D"],"ticks":1,"s":"hl","id":"ad"},{"t":"seg","p":["C","B"],"ticks":2,"s":"hl","id":"cb"},{"t":"seg","p":["C","D"],"ticks":2,"s":"hl","id":"cd"},{"t":"angle","p":["B","A","D"],"label":"70°","r":48,"id":"a"},{"t":"angle","p":["B","A","C"],"label":"?","r":26,"s":"hl","id":"a1"}],"check":[{"ang":[["B","A","D"],70]}]},"steps":[{"do":"Розглянемо △ABC і △ADC: AB = AD, CB = CD, AC — спільна.","why":"Дві рівності за умовою, третя — спільна сторона.","hl":["ab","ad","cb","cd","ac"]},{"do":"△ABC = △ADC.","why":"За третьою ознакою: три сторони."},{"do":"∠BAC = ∠DAC.","why":"Відповідні кути рівних трикутників рівні.","hl":["a1"]},{"do":"∠BAC = 70° : 2 = 35°.","why":"Промінь AC ділить кут BAD на дві рівні частини.","hl":["a","a1"]}],"answer":"Відповідь: 35°."}],"mistakes":["Беруть дві сторони і кут, що <b>не лежить між ними<\/b>, і кажуть «за першою ознакою». Правильно: для першої ознаки кут має бути утворений саме цими двома сторонами.","Для другої ознаки беруть кут, що не прилягає до сторони. Правильно: обидва кути мають лежати на кінцях цієї сторони.","Забувають записати спільну сторону чи вертикальні кути. Правильно: це теж рівні елементи, і їх треба назвати з поясненням «бо спільна», «бо вертикальні»."],"check":[{"q":"<b>Пастка.<\/b> У △ABC і △A₁B₁C₁ AB = A₁B₁, BC = B₁C₁ і ∠A = ∠A₁. Чи можна стверджувати, що трикутники рівні за першою ознакою?","options":["Ні: ∠A не лежить між сторонами AB і BC","Так, за першою ознакою","Так, за третьою ознакою"],"correct":0,"a":"Ні. Між сторонами AB і BC лежить ∠B, а не ∠A. Для першої ознаки потрібна рівність ∠B = ∠B₁."},{"q":"Відрізки AB і CD перетинаються в точці O, AO = OB, ∠OAC = ∠OBD. За якою ознакою рівні трикутники AOC і BOD?","fig":{"caption":"Відрізки AB і CD перетинаються в точці O; AO = OB, ∠OAC = ∠OBD. Сполучено A з C і B з D.","view":[-3.819,-3.125,3.819,3.125],"points":{"A":[-2.819,1.026],"B":[2.819,-1.026],"C":[0.569,2.125],"D":[-0.569,-2.125],"O":[0.0,0.0]},"lp":{"O":"e"},"items":[{"t":"seg","p":["A","O"],"ticks":1},{"t":"seg","p":["O","B"],"ticks":1},{"t":"seg","p":["C","D"]},{"t":"seg","p":["A","C"]},{"t":"seg","p":["B","D"]},{"t":"angle","p":["O","A","C"],"arcs":1},{"t":"angle","p":["O","B","D"],"arcs":1}],"check":[{"mid":["O","A","B"]},{"col":["C","O","D"]}]},"options":["За трьома сторонами","За двома сторонами і кутом між ними","За стороною і двома прилеглими кутами"],"correct":2,"a":"AO = OB, ∠OAC = ∠OBD (за умовою), ∠AOC = ∠BOD (вертикальні). Обидва кути прилягають до сторін AO і OB — це друга ознака."},{"q":"Щоб виміряти ширину ставка AB, поставили стовпчик O, відклали OA₁ = AO на продовженні AO і OB₁ = BO на продовженні BO. Виміряли A₁B₁ = 25 м. Яка ширина ставка AB (у метрах)?","fig":{"caption":"Ширина ставка AB. Стовпчик O; на продовженні AO відкладено OA₁ = AO, на продовженні BO — OB₁ = BO; A₁B₁ = 25 м.","view":[-17.134,-19.083,17.134,19.083],"points":{"A":[-13.134,15.083],"B":[11.821,13.575],"O":[0.0,0.0],"A1":[13.134,-15.083],"B1":[-11.821,-13.575]},"lp":{"O":"e"},"items":[{"t":"seg","p":["A","B"],"s":"dash hl"},{"t":"label","at":[-0.536,16.325],"text":"?"},{"t":"seg","p":["A","O"],"ticks":1},{"t":"seg","p":["O","A1"],"ticks":1},{"t":"seg","p":["B","O"],"ticks":2},{"t":"seg","p":["O","B1"],"ticks":2},{"t":"seg","p":["A1","B1"],"s":"hl2"},{"t":"label","at":[0.536,-16.325],"text":"25 м"}],"check":[{"mid":["O","A","A1"]},{"mid":["O","B","B1"]},{"len":[["A1","B1"],25]}]},"accept":["25"],"a":"△AOB = △A₁OB₁ за першою ознакою (AO = OA₁, BO = OB₁, кути при O вертикальні). Тому AB = A₁B₁ = 25 м."}],"fig":{"caption":"Перша ознака: у трикутниках ABC і A₁B₁C₁ AB = A₁B₁, AC = A₁C₁ і ∠A = ∠A₁ (кут між цими сторонами). Тоді трикутники рівні.","view":[-1.0,-1.794,14.33,4.059],"points":{"A":[0.0,0.0],"B":[5,0.0],"C":[1.7,3.059],"A1":[8.5,0.5],"B1":[13.33,-0.794],"C1":[10.934,3.015]},"items":[{"t":"poly","p":["A","B","C"]},{"t":"poly","p":["A1","B1","C1"]},{"t":"seg","p":["A","B"],"ticks":1,"s":"hl"},{"t":"seg","p":["A1","B1"],"ticks":1,"s":"hl"},{"t":"seg","p":["A","C"],"ticks":2,"s":"hl"},{"t":"seg","p":["A1","C1"],"ticks":2,"s":"hl"},{"t":"angle","p":["B","A","C"],"arcs":1,"s":"hl2"},{"t":"angle","p":["B1","A1","C1"],"arcs":1,"s":"hl2"}]}}}]},{"id":"G3.3","name":"Види трикутників","what":"Рівнобедрений, рівносторонній, гострокутний, прямокутний, тупокутний.","subtopics":[{"id":"G3.3.1","name":"Види трикутників","status":"ready","programmeRef":"Види трикутників.","lesson":{"what":"Трикутники ділять на види <b>за кутами<\/b> і <b>за сторонами<\/b>. За кутами: гострокутні, прямокутні, тупокутні. За сторонами: різносторонні, рівнобедрені, рівносторонні.","ideas":["<b>Гострокутний<\/b> — усі три кути гострі (менші від 90°). <b>Прямокутний<\/b> — є прямий кут. <b>Тупокутний<\/b> — є тупий кут. Чому прямий чи тупий кут у трикутнику може бути лише один — дізнаємося в темі «Сума кутів трикутника».","У прямокутному трикутнику сторони, що утворюють прямий кут, — <b>катети<\/b>, а сторона проти прямого кута — <b>гіпотенуза<\/b>.","<b>Рівнобедрений<\/b> — дві сторони рівні. Рівні сторони називають <b>бічними<\/b>, третю — <b>основою<\/b>.","<b>Рівносторонній<\/b> — усі три сторони рівні. Він теж рівнобедрений (будь-яку сторону можна вважати основою). <b>Різносторонній<\/b> — усі сторони різні.","Моделі навколо нас: фронтон даху — рівнобедрений трикутник, косинець (креслярський трикутник) — прямокутний, дорожній знак «Увага» — рівносторонній."],"rules":[{"f":"Гострокутний: усі кути < 90°. Прямокутний: один кут = 90°. Тупокутний: один кут > 90°.","means":"Вид за кутами визначає найбільший кут трикутника."},{"f":"Рівнобедрений: AB = BC. Рівносторонній: AB = BC = CA.","means":"Вид за сторонами залежить від того, скільки сторін рівні."}],"examples":[{"task":"Кути трикутників: △ABC — 50°, 60°, 70°; △DEF — 25°, 90°, 65°; △KLM — 20°, 120°, 40°. Визначте вид кожного трикутника за кутами.","fig":{"caption":"Три трикутники: ABC з кутами 50°, 60°, 70°; DEF з кутами 25°, 90°, 65°; KLM з кутами 20°, 120°, 40°.","view":[-1.0,-1.0,22.0,5.987],"points":{"A":[0.0,0.0],"C":[6.0,0.0],"B":[4.185,4.987],"D":[7.5,0.0],"F":[13.5,0.0],"E":[12.428,2.298],"K":[15.0,0.0],"M":[21.0,0.0],"L":[19.185,1.523]},"items":[{"t":"poly","p":["A","B","C"],"s":"hl","id":"t1"},{"t":"angle","p":["B","A","C"],"label":"50°"},{"t":"angle","p":["A","C","B"],"label":"70°"},{"t":"angle","p":["A","B","C"],"label":"60°"},{"t":"poly","p":["D","E","F"],"s":"hl","id":"t2"},{"t":"angle","p":["E","D","F"],"label":"25°"},{"t":"angle","p":["D","F","E"],"label":"65°"},{"t":"right","p":["D","E","F"]},{"t":"poly","p":["K","L","M"],"s":"hl","id":"t3"},{"t":"angle","p":["L","K","M"],"label":"20°"},{"t":"angle","p":["K","M","L"],"label":"40°"},{"t":"angle","p":["K","L","M"],"label":"120°"}]},"steps":[{"do":"У △ABC усі кути менші від 90°, тож він гострокутний.","why":"Гострокутний — усі три кути гострі.","hl":["t1"]},{"do":"У △DEF ∠E = 90°, тож він прямокутний.","why":"Прямокутний — є прямий кут.","hl":["t2"]},{"do":"У △KLM ∠L = 120° > 90°, тож він тупокутний.","why":"Тупокутний — є тупий кут.","hl":["t3"]}],"answer":"Відповідь: △ABC — гострокутний, △DEF — прямокутний, △KLM — тупокутний."},{"task":"Бічна сторона рівнобедреного трикутника 8 см, основа 6 см. Знайдіть периметр.","fig":{"caption":"Рівнобедрений трикутник ABC: бічні сторони AB = BC = 8 см, основа AC = 6 см.","view":[-1.0,-1.0,7.0,8.416],"points":{"A":[0.0,0.0],"B":[3,7.416],"C":[6,0.0]},"items":[{"t":"poly","p":["A","B","C"],"s":"hl","id":"t"},{"t":"seg","p":["A","B"],"ticks":1,"id":"ab"},{"t":"seg","p":["B","C"],"ticks":1,"id":"bc"},{"t":"label","at":[1.036,3.896],"text":"8 см"},{"t":"label","at":[3.0,-0.5],"text":"6 см"}],"check":[{"len":[["A","B"],8]},{"len":[["A","C"],6]}]},"steps":[{"do":"Дано: AB = BC = 8 см, AC = 6 см. Знайти: P.","why":"У рівнобедреному трикутнику дві бічні сторони рівні.","hl":["ab","bc"]},{"do":"P = 8 + 8 + 6 = 22 (см).","why":"Периметр — сума всіх трьох сторін, бічну сторону беремо двічі.","hl":["t"]}],"answer":"Відповідь: 22 см."},{"task":"Периметр рівнобедреного трикутника 25 см, основа на 2 см коротша за бічну сторону. Знайдіть сторони трикутника.","fig":{"caption":"Рівнобедрений трикутник ABC з основою AC: бічні сторони x, основа x − 2, периметр 25 см.","view":[-1.0,-1.0,8.0,9.292],"points":{"A":[0.0,0.0],"B":[3.5,8.292],"C":[7,0.0]},"items":[{"t":"poly","p":["A","B","C"]},{"t":"seg","p":["A","B"],"ticks":1,"s":"hl","id":"ab"},{"t":"seg","p":["B","C"],"ticks":1,"s":"hl","id":"bc"},{"t":"seg","p":["A","C"],"s":"hl2","id":"ac"},{"t":"label","at":[1.289,4.34],"text":"x"},{"t":"label","at":[5.711,4.34],"text":"x"},{"t":"label","at":[3.5,-0.5],"text":"x − 2"}],"check":[{"len":[["A","B"],9]},{"len":[["A","C"],7]}]},"steps":[{"do":"Нехай бічна сторона x см, тоді основа (x − 2) см.","why":"Позначаємо невідоме буквою; бічні сторони рівні.","hl":["ab","bc","ac"]},{"do":"x + x + (x − 2) = 25, тобто 3x − 2 = 25.","why":"Периметр — сума трьох сторін."},{"do":"3x = 27, x = 9.","why":"Розв'язуємо рівняння."},{"do":"Основа: 9 − 2 = 7 (см). Перевірка: 9 + 9 + 7 = 25.","why":"Основа на 2 см коротша.","hl":["ac"]}],"answer":"Відповідь: 9 см, 9 см, 7 см."}],"mistakes":["Називають трикутник гострокутним, бо в нього «є гострий кут». Правильно: гострі кути є в кожному трикутнику; гострокутний — коли гострі <b>всі три<\/b>.","Думають, що рівносторонній трикутник — не рівнобедрений. Правильно: у нього теж є дві рівні сторони, тож він — окремий випадок рівнобедреного.","Називають гіпотенузою будь-яку найдовшу на вигляд сторону. Правильно: гіпотенуза — сторона проти прямого кута, і буває вона лише в прямокутному трикутнику."],"check":[{"q":"<b>Пастка.<\/b> Один із кутів трикутника 40°. Чи можна стверджувати, що трикутник гострокутний?","options":["Так","Ні: гострими мають бути всі три кути","Так, бо 40° менше від 90°"],"correct":1,"a":"Ні. Гострий кут є в будь-якому трикутнику. Інший кут може бути, наприклад, 110° — тоді трикутник тупокутний."},{"q":"Як називається сторона AB у трикутнику ABC з прямим кутом C?","fig":{"caption":"Трикутник ABC з прямим кутом C.","view":[-1.0,-1.0,5.0,4.0],"points":{"A":[4,0.0],"B":[0.0,3],"C":[0.0,0.0]},"items":[{"t":"poly","p":["A","B","C"]},{"t":"right","p":["A","C","B"]},{"t":"seg","p":["A","B"],"s":"hl"}]},"options":["Катет","Основа","Гіпотенуза"],"correct":2,"a":"Гіпотенуза — сторона проти прямого кута. AC і BC — катети."},{"q":"Фронтон будиночка — рівнобедрений трикутник з основою 8 м і бічними сторонами по 5 м. Скільки метрів декоративної рейки треба, щоб обрамити його по периметру?","accept":["18"],"a":"P = 5 + 5 + 8 = 18 (м)."}],"fig":{"caption":"Ліворуч рівнобедрений трикутник ABC: бічні сторони AB = BC (однакові рисочки), AC — основа. Праворуч прямокутний трикутник KMN з прямим кутом N: KN і MN — катети, KM — гіпотенуза.","view":[-1.2,-1.2,13.2,5.2],"points":{"A":[0.0,0.0],"B":[2.5,4],"C":[5,0.0],"N":[8,0.0],"K":[12,0.0],"M":[8,3]},"items":[{"t":"poly","p":["A","B","C"]},{"t":"seg","p":["A","B"],"ticks":1},{"t":"seg","p":["B","C"],"ticks":1},{"t":"seg","p":["A","C"],"s":"hl"},{"t":"label","at":[2.5,-0.6],"text":"основа"},{"t":"poly","p":["K","M","N"]},{"t":"right","p":["K","N","M"]},{"t":"seg","p":["K","M"],"s":"hl2"},{"t":"label","at":[10.8,2.3],"text":"гіпотенуза"}]}}},{"id":"G3.3.2","name":"Рівнобедрений трикутник","status":"ready","programmeRef":"Рівнобедрений трикутник, його властивості та ознаки.","lesson":{"what":"У <b>рівнобедреному<\/b> трикутнику дві сторони рівні (бічні), третя — основа. Кути, прилеглі до основи, називають <b>кутами при основі<\/b>, а кут між бічними сторонами — <b>кутом при вершині<\/b>. Рівнобедрений трикутник має особливі властивості, а за ознакою можна довести, що трикутник рівнобедрений.","ideas":["Проведемо в △ABC (AB = BC) бісектрису BD. Тоді △ABD = △CBD за першою ознакою: AB = CB, BD — спільна, ∠ABD = ∠CBD. Звідси й випливають усі властивості.","З рівності △ABD = △CBD: ∠A = ∠C — кути при основі рівні.","Також AD = DC (BD — медіана) і ∠ADB = ∠CDB, а разом вони 180° (суміжні), тож кожен 90° (BD — висота).","<b>Ознака<\/b>: якщо в трикутнику два кути рівні, то він рівнобедрений — рівні сторони лежать проти рівних кутів.","Медіана чи висота, проведена до <b>основи<\/b>, — теж і бісектриса, і медіана, і висота. Для відрізків до бічної сторони це не так."],"rules":[{"f":"AB = BC ⇒ ∠A = ∠C","means":"Властивість: у рівнобедреному трикутнику кути при основі рівні."},{"f":"AB = BC, BD — бісектриса ⇒ BD — медіана і висота","means":"Бісектриса, проведена до основи, ділить основу навпіл і перпендикулярна до неї."},{"f":"∠A = ∠C ⇒ AB = BC","means":"Ознака: якщо два кути трикутника рівні, то він рівнобедрений."}],"examples":[{"task":"У трикутнику ABC AB = BC, ∠A = 65°. Знайдіть ∠C.","fig":{"caption":"Рівнобедрений трикутник ABC, AB = BC; ∠A = 65°, кут C позначено знаком питання.","view":[-1.0,-1.0,7.0,7.434],"points":{"A":[0.0,0.0],"B":[3,6.434],"C":[6,0.0]},"items":[{"t":"poly","p":["A","B","C"]},{"t":"seg","p":["A","B"],"ticks":1,"id":"ab"},{"t":"seg","p":["B","C"],"ticks":1,"id":"bc"},{"t":"seg","p":["A","C"],"s":"hl2","id":"ac"},{"t":"angle","p":["C","A","B"],"label":"65°","arcs":1,"s":"hl","id":"a"},{"t":"angle","p":["A","C","B"],"label":"?","arcs":1,"s":"hl","id":"c"}],"check":[{"ang":[["C","A","B"],65]},{"eq":[["A","B"],["B","C"]]}]},"steps":[{"do":"Дано: AB = BC, ∠A = 65°. Знайти: ∠C.","why":"Записуємо умову.","hl":["ab","bc"]},{"do":"AC — основа, ∠A і ∠C — кути при основі.","why":"Основа — сторона, яка не є бічною; AB і BC рівні, тож вони бічні.","hl":["ac"]},{"do":"∠C = ∠A = 65°.","why":"У рівнобедреному трикутнику кути при основі рівні.","hl":["a","c"]}],"answer":"Відповідь: 65°."},{"task":"У рівнобедреному трикутнику ABC з основою AC = 12 см проведено медіану BD; ∠ABC = 80°. Знайдіть AD, ∠ADB і ∠ABD.","fig":{"caption":"Рівнобедрений трикутник ABC з основою AC = 12 см, ∠ABC = 80°; BD — медіана.","view":[-1.0,-1.0,13.0,8.151],"points":{"A":[0.0,0.0],"B":[6,7.151],"C":[12,0.0],"D":[6,0.0]},"lp":{"D":"s"},"items":[{"t":"poly","p":["A","B","C"]},{"t":"seg","p":["A","B"],"ticks":1},{"t":"seg","p":["B","C"],"ticks":1},{"t":"seg","p":["B","D"],"s":"hl","id":"bd"},{"t":"seg","p":["A","D"],"ticks":2,"s":"hl2","id":"ad"},{"t":"seg","p":["D","C"],"ticks":2,"id":"dc"},{"t":"right","p":["A","D","B"],"id":"r"},{"t":"angle","p":["A","B","C"],"label":"80°","r":48,"id":"b"},{"t":"angle","p":["A","B","D"],"label":"?","r":26,"s":"hl","id":"b1"}],"check":[{"len":[["A","C"],12]},{"mid":["D","A","C"]},{"ang":[["A","B","C"],80]}]},"steps":[{"do":"AD = 12 : 2 = 6 (см).","why":"Медіана ділить основу навпіл.","hl":["ad"]},{"do":"BD — медіана, проведена до основи, тож вона і висота, і бісектриса.","why":"Властивість рівнобедреного трикутника.","hl":["bd"]},{"do":"∠ADB = 90°.","why":"BD — висота.","hl":["r"]},{"do":"∠ABD = 80° : 2 = 40°.","why":"BD — бісектриса кута B.","hl":["b","b1"]}],"answer":"Відповідь: AD = 6 см, ∠ADB = 90°, ∠ABD = 40°."},{"task":"У трикутнику ABC ∠A = ∠C, AB = 7 см, AC = 5 см. Знайдіть периметр трикутника.","fig":{"caption":"Трикутник ABC, у якого ∠A = ∠C; AB = 7 см, AC = 5 см, сторона BC позначена знаком питання.","view":[-1.0,-1.0,6.0,7.538],"points":{"A":[0.0,0.0],"B":[2.5,6.538],"C":[5,0.0]},"items":[{"t":"poly","p":["A","B","C"],"id":"t"},{"t":"angle","p":["C","A","B"],"arcs":1,"s":"hl","id":"a"},{"t":"angle","p":["A","C","B"],"arcs":1,"s":"hl","id":"c"},{"t":"seg","p":["B","C"],"s":"hl2","id":"bc"},{"t":"label","at":[0.783,3.448],"text":"7 см"},{"t":"label","at":[2.5,-0.5],"text":"5 см"},{"t":"label","at":[4.217,3.448],"text":"?"}],"check":[{"len":[["A","B"],7]},{"len":[["A","C"],5]}]},"steps":[{"do":"Дано: ∠A = ∠C, AB = 7 см, AC = 5 см. Знайти: P.","why":"Записуємо умову.","hl":["a","c"]},{"do":"△ABC рівнобедрений з основою AC, тож BC = AB = 7 см.","why":"Ознака: якщо два кути рівні, трикутник рівнобедрений; проти рівних кутів A і C лежать рівні сторони BC і AB.","hl":["bc"]},{"do":"P = 7 + 7 + 5 = 19 (см).","why":"Периметр — сума сторін.","hl":["t"]}],"answer":"Відповідь: 19 см."}],"mistakes":["Вважають рівними кут при вершині і кут при основі. Правильно: рівні саме кути <b>при основі<\/b> — ті, що прилягають до основи.","Думають, що медіана, проведена до бічної сторони, — теж висота. Правильно: «три в одному» лише для відрізка, проведеного до <b>основи<\/b>.","За ознакою роблять рівними не ті сторони. Правильно: рівні сторони лежать <b>проти<\/b> рівних кутів: ∠A = ∠C ⇒ BC = AB."],"check":[{"q":"<b>Пастка.<\/b> У трикутнику ABC AB = BC, ∠B = 50°. Чи правильно, що ∠A = 50°?","options":["Ні: рівні кути при основі — ∠A і ∠C","Так, ∠A = ∠B"],"correct":0,"a":"Ні. AB = BC, отже основа — AC, а рівні кути при основі — ∠A і ∠C. ∠B — кут при вершині."},{"q":"У рівнобедреному трикутнику ABC з основою AC = 18 см проведено висоту BH. Знайдіть AH (у сантиметрах).","fig":{"caption":"Рівнобедрений трикутник ABC з основою AC = 18 см (AB = BC), BH — висота.","view":[-1.5,-1.5,19.5,8.5],"points":{"A":[0.0,0.0],"B":[9,7],"C":[18,0.0],"H":[9,0.0]},"lp":{"H":"s"},"items":[{"t":"poly","p":["A","B","C"]},{"t":"seg","p":["A","B"],"ticks":1},{"t":"seg","p":["B","C"],"ticks":1},{"t":"seg","p":["B","H"],"s":"hl"},{"t":"right","p":["A","H","B"]},{"t":"label","at":[9.0,-1.2],"text":"18 см"}],"check":[{"len":[["A","C"],18]}]},"accept":["9"],"a":"Висота, проведена до основи, — це й медіана, тож AH = 18 : 2 = 9 (см)."},{"q":"Дві однакові кроквяні балки двосхилого даху утворюють з горищним перекриттям рівнобедрений трикутник. З одного боку кут між балкою і перекриттям 35°. Який кут з іншого боку (у градусах)?","accept":["35"],"a":"Перекриття — основа, а кути при основі рівнобедреного трикутника рівні: 35°."}],"fig":{"caption":"Рівнобедрений трикутник ABC з основою AC (AB = BC). Кути при основі A і C рівні. BD — бісектриса, медіана і висота одночасно: AD = DC, BD ⊥ AC.","view":[-1.0,-1.0,7.0,6.0],"points":{"A":[0.0,0.0],"B":[3,5],"C":[6,0.0],"D":[3,0.0]},"lp":{"D":"s"},"items":[{"t":"poly","p":["A","B","C"]},{"t":"seg","p":["A","B"],"ticks":1},{"t":"seg","p":["B","C"],"ticks":1},{"t":"angle","p":["C","A","B"],"arcs":1,"s":"hl"},{"t":"angle","p":["A","C","B"],"arcs":1,"s":"hl"},{"t":"seg","p":["B","D"],"s":"hl2"},{"t":"angle","p":["A","B","D"],"arcs":2,"s":"hl2"},{"t":"angle","p":["D","B","C"],"arcs":2,"s":"hl2"},{"t":"seg","p":["A","D"],"ticks":2},{"t":"seg","p":["D","C"],"ticks":2},{"t":"right","p":["A","D","B"]}]}}},{"id":"G3.3.3","name":"Рівносторонній трикутник","status":"ready","programmeRef":"Рівносторонній трикутник.","lesson":{"what":"<b>Рівносторонній<\/b> трикутник — трикутник, у якого всі три сторони рівні. Він є окремим випадком рівнобедреного, тому має всі його властивості — і навіть «у три рази більше».","ideas":["Будь-яку сторону рівностороннього трикутника можна вважати основою. Тому з AB = BC маємо ∠A = ∠C, а з BC = CA маємо ∠B = ∠A. Отже, <b>усі кути рівні<\/b>.","Скільки градусів у кожному куті, дізнаємося в темі «Сума кутів трикутника».","Кожна бісектриса рівностороннього трикутника — це і медіана, і висота (бо кожна сторона може бути основою).","<b>Ознака<\/b>: якщо всі кути трикутника рівні, він рівносторонній (застосуй ознаку рівнобедреного двічі).","Периметр рівностороннього трикутника зі стороною a: P = 3a."],"rules":[{"f":"AB = BC = CA ⇒ ∠A = ∠B = ∠C","means":"У рівностороннього трикутника всі кути рівні."},{"f":"∠A = ∠B = ∠C ⇒ AB = BC = CA","means":"Ознака: трикутник з трьома рівними кутами — рівносторонній."},{"f":"P = 3a","means":"Периметр — три однакові сторони."}],"examples":[{"task":"Периметр рівностороннього трикутника 27 см. Знайдіть його сторону.","fig":{"caption":"Рівносторонній трикутник ABC з периметром 27 см; сторона AC позначена знаком питання.","view":[-1.0,-1.0,10.0,8.794],"points":{"A":[0.0,0.0],"B":[4.5,7.794],"C":[9,0.0]},"items":[{"t":"poly","p":["A","B","C"],"s":"hl","id":"t"},{"t":"seg","p":["A","B"],"ticks":1},{"t":"seg","p":["B","C"],"ticks":1},{"t":"seg","p":["A","C"],"ticks":1},{"t":"label","at":[4.5,-0.5],"text":"?"}],"check":[{"len":[["A","C"],9]}]},"steps":[{"do":"P = 3a, де a — сторона.","why":"Усі три сторони рівні.","hl":["t"]},{"do":"a = 27 : 3 = 9 (см).","why":"Ділимо периметр на три рівні частини."},{"do":"Перевірка: 9 + 9 + 9 = 27.","why":"Підставляємо в умову."}],"answer":"Відповідь: 9 см."},{"task":"Трикутник ABC рівносторонній зі стороною 10 см, BM — медіана. Знайдіть AM і ∠AMB. Порівняйте ∠ABM і ∠MBC.","fig":{"caption":"Рівносторонній трикутник ABC зі стороною 10 см; BM — медіана.","view":[-1.0,-1.0,11.0,9.66],"points":{"A":[0.0,0.0],"B":[5.0,8.66],"C":[10,0.0],"M":[5,0.0]},"lp":{"M":"s"},"items":[{"t":"poly","p":["A","B","C"]},{"t":"seg","p":["A","B"],"ticks":1},{"t":"seg","p":["B","C"],"ticks":1},{"t":"seg","p":["B","M"],"s":"hl","id":"bm"},{"t":"seg","p":["A","M"],"ticks":2,"s":"hl2","id":"am"},{"t":"seg","p":["M","C"],"ticks":2,"id":"mc"},{"t":"right","p":["A","M","B"],"id":"r"},{"t":"angle","p":["A","B","M"],"arcs":1,"id":"b1"},{"t":"angle","p":["M","B","C"],"arcs":1,"id":"b2"},{"t":"label","at":[5.0,-0.9],"text":"10 см"}],"check":[{"len":[["A","C"],10]},{"mid":["M","A","C"]}]},"steps":[{"do":"AM = 10 : 2 = 5 (см).","why":"Медіана ділить сторону AC навпіл.","hl":["am","mc"]},{"do":"AC можна вважати основою рівнобедреного △ABC (AB = BC), тож BM — і висота, і бісектриса.","why":"Медіана, проведена до основи рівнобедреного трикутника.","hl":["bm"]},{"do":"∠AMB = 90°.","why":"BM — висота.","hl":["r"]},{"do":"∠ABM = ∠MBC.","why":"BM — бісектриса.","hl":["b1","b2"]}],"answer":"Відповідь: AM = 5 см, ∠AMB = 90°, ∠ABM = ∠MBC."},{"task":"У трикутнику ABC AB = BC і ∠A = ∠B, AC = 6 см. Доведіть, що трикутник рівносторонній, і знайдіть його периметр.","fig":{"caption":"Трикутник ABC: AB = BC, ∠A = ∠B, AC = 6 см.","view":[-1.0,-1.0,7.0,6.196],"points":{"A":[0.0,0.0],"B":[3.0,5.196],"C":[6,0.0]},"items":[{"t":"poly","p":["A","B","C"],"id":"t"},{"t":"seg","p":["A","B"],"ticks":1,"s":"hl","id":"ab"},{"t":"seg","p":["B","C"],"ticks":1,"s":"hl","id":"bc"},{"t":"angle","p":["C","A","B"],"arcs":1,"s":"hl2","id":"a"},{"t":"angle","p":["A","B","C"],"arcs":1,"s":"hl2","id":"b"},{"t":"seg","p":["A","C"],"id":"ac"},{"t":"label","at":[3.0,-0.5],"text":"6 см"}],"check":[{"len":[["A","C"],6]}]},"steps":[{"do":"AB = BC, тож ∠A = ∠C.","why":"Кути при основі AC рівнобедреного трикутника рівні.","hl":["ab","bc","a"]},{"do":"∠A = ∠B (за умовою) і ∠A = ∠C, отже ∠A = ∠B = ∠C.","why":"Два кути, рівні третьому, рівні між собою.","hl":["a","b"]},{"do":"△ABC рівносторонній: AB = BC = AC = 6 см.","why":"Ознака рівностороннього трикутника.","hl":["ac"]},{"do":"P = 3 · 6 = 18 (см).","why":"P = 3a.","hl":["t"]}],"answer":"Відповідь: трикутник рівносторонній, P = 18 см."}],"mistakes":["Кажуть, що рівносторонній трикутник — не рівнобедрений. Правильно: він рівнобедрений, причому основою можна вважати будь-яку сторону.","Шукають сторону, ділячи периметр на 2. Правильно: сторін три, тож a = P : 3.","Думають, що досить двох рівних сторін, щоб трикутник був рівностороннім. Правильно: потрібні три рівні сторони (або три рівні кути)."],"check":[{"q":"<b>Пастка.<\/b> Чи є кожен рівносторонній трикутник рівнобедреним?","options":["Ні","Так"],"correct":1,"a":"Так: у нього є дві рівні сторони (навіть три), а це й означає рівнобедрений."},{"q":"Рівносторонній трикутник і квадрат мають однакові периметри. Сторона квадрата 6 см. Знайдіть сторону трикутника (у сантиметрах).","accept":["8"],"a":"Периметр квадрата 4 · 6 = 24 см. Сторона трикутника 24 : 3 = 8 см."},{"q":"Дорожній знак «Увага» має форму рівностороннього трикутника зі стороною 90 см. Скільки сантиметрів світловідбивної стрічки треба, щоб обклеїти його край?","accept":["270"],"a":"P = 3 · 90 = 270 (см)."}],"fig":{"caption":"Рівносторонній трикутник ABC: усі сторони рівні (по одній рисочці) і всі кути рівні (по одній дузі).","view":[-1.0,-1.0,7.0,6.196],"points":{"A":[0.0,0.0],"B":[3.0,5.196],"C":[6,0.0]},"items":[{"t":"poly","p":["A","B","C"],"fill":true},{"t":"seg","p":["A","B"],"ticks":1},{"t":"seg","p":["B","C"],"ticks":1},{"t":"seg","p":["A","C"],"ticks":1},{"t":"angle","p":["C","A","B"],"arcs":1,"s":"hl"},{"t":"angle","p":["A","B","C"],"arcs":1,"s":"hl"},{"t":"angle","p":["B","C","A"],"arcs":1,"s":"hl"}]}}}]},{"id":"G3.4","name":"Кути трикутника","what":"Сума кутів трикутника і зовнішній кут.","subtopics":[{"id":"G3.4.1","name":"Сума кутів трикутника","status":"ready","programmeRef":"Сума кутів трикутника.","lesson":{"what":"Сума кутів будь-якого трикутника дорівнює 180°. Це одна з найважливіших теорем геометрії: знаючи два кути, завжди знайдемо третій.","ideas":["Доведення: через вершину B проведемо пряму, паралельну AC. Кут A дорівнює куту між цією прямою і BA, а кут C — куту між прямою і BC: це різносторонні кути при паралельних прямих.","Ці два кути разом з ∠B утворюють розгорнутий кут, тобто 180°. Тому ∠A + ∠B + ∠C = 180°.","Наслідок: у трикутнику може бути лише один прямий або тупий кут — бо два такі кути вже дали б 180° або більше.","Наслідок: кожен кут рівностороннього трикутника дорівнює 180° : 3 = 60°.","Наслідок: у прямокутному трикутнику сума двох гострих кутів 90°."],"rules":[{"f":"∠A + ∠B + ∠C = 180°","means":"Сума кутів трикутника — розгорнутий кут."},{"f":"∠C = 180° − ∠A − ∠B","means":"Третій кут — це 180° без двох відомих."}],"examples":[{"task":"У трикутнику ABC ∠A = 48°, ∠B = 67°. Знайдіть ∠C.","fig":{"caption":"Трикутник ABC: ∠A = 48°, ∠B = 67°, кут C позначено знаком питання.","view":[-1.0,-1.0,7.0,5.39],"points":{"A":[0.0,0.0],"B":[3.953,4.39],"C":[6,0.0]},"items":[{"t":"poly","p":["A","B","C"]},{"t":"angle","p":["C","A","B"],"label":"48°","s":"hl","id":"a"},{"t":"angle","p":["A","B","C"],"label":"67°","s":"hl","id":"b"},{"t":"angle","p":["A","C","B"],"label":"?","s":"hl2","id":"c"}]},"steps":[{"do":"Дано: ∠A = 48°, ∠B = 67°. Знайти: ∠C.","why":"Записуємо умову.","hl":["a","b"]},{"do":"∠A + ∠B = 48° + 67° = 115°.","why":"Спершу додаємо відомі кути."},{"do":"∠C = 180° − 115° = 65°.","why":"Сума кутів трикутника 180°.","hl":["c"]},{"do":"Перевірка: 48° + 67° + 65° = 180°.","why":"Підставляємо."}],"answer":"Відповідь: 65°."},{"task":"Кут при вершині рівнобедреного трикутника 40°. Знайдіть кути при основі.","fig":{"caption":"Рівнобедрений трикутник ABC з основою AC (AB = BC); кут при вершині B 40°, кути при основі позначені знаком питання.","view":[-1.0,-1.0,5.0,6.495],"points":{"A":[0.0,0.0],"B":[2,5.495],"C":[4,0.0]},"items":[{"t":"poly","p":["A","B","C"]},{"t":"seg","p":["A","B"],"ticks":1},{"t":"seg","p":["B","C"],"ticks":1},{"t":"angle","p":["A","B","C"],"label":"40°","s":"hl","id":"b"},{"t":"angle","p":["C","A","B"],"label":"?","arcs":1,"s":"hl2","id":"a"},{"t":"angle","p":["A","C","B"],"label":"?","arcs":1,"s":"hl2","id":"c"}]},"steps":[{"do":"Нехай кути при основі ∠A = ∠C = x.","why":"Кути при основі рівнобедреного трикутника рівні.","hl":["a","c"]},{"do":"x + x + 40° = 180°, тобто 2x = 140°.","why":"Сума кутів трикутника 180°.","hl":["b"]},{"do":"x = 140° : 2 = 70°.","why":"Ділимо порівну між двома кутами.","hl":["a","c"]}],"answer":"Відповідь: 70° і 70°."},{"task":"Кути трикутника відносяться як 2 : 3 : 4. Знайдіть ці кути.","fig":{"caption":"Трикутник ABC, кути якого відносяться як 2 : 3 : 4: ∠A = 2x, ∠B = 3x, ∠C = 4x.","view":[-1.0,-1.0,7.0,5.386],"points":{"A":[0.0,0.0],"B":[5.227,4.386],"C":[6,0.0]},"items":[{"t":"poly","p":["A","B","C"],"id":"t"},{"t":"angle","p":["C","A","B"],"label":"2x","s":"hl"},{"t":"angle","p":["A","B","C"],"label":"3x","s":"hl"},{"t":"angle","p":["A","C","B"],"label":"4x","s":"hl"}],"check":[{"ang":[["C","A","B"],40]},{"ang":[["A","B","C"],60]},{"ang":[["A","C","B"],80]}]},"steps":[{"do":"Нехай кути 2x, 3x і 4x.","why":"Відношення 2 : 3 : 4 означає, що кути містять 2, 3 і 4 однакові частини."},{"do":"2x + 3x + 4x = 180°, тобто 9x = 180°.","why":"Сума кутів трикутника 180°.","hl":["t"]},{"do":"x = 20°.","why":"180° : 9 = 20°."},{"do":"Кути: 2 · 20° = 40°, 3 · 20° = 60°, 4 · 20° = 80°. Перевірка: 40° + 60° + 80° = 180°.","why":"Множимо кожну кількість частин на одну частину."}],"answer":"Відповідь: 40°, 60°, 80°."}],"mistakes":["Віднімають від 180° лише один відомий кут. Правильно: від 180° віднімають <b>обидва<\/b> відомі кути.","У рівнобедреному трикутнику плутають кут при вершині з кутом при основі. Правильно: спершу визнач, який кут дано, а потім склади рівняння.","У задачі на відношення знаходять x і зупиняються. Правильно: x — це лише одна частина; кути — 2x, 3x, 4x."],"check":[{"q":"<b>Пастка.<\/b> Чи може трикутник мати два тупі кути?","options":["Так, якщо третій кут дуже малий","Ні","Так, якщо трикутник рівнобедрений"],"correct":1,"a":"Ні. Два тупі кути разом уже більші за 180°, а сума всіх трьох кутів має бути рівно 180°."},{"q":"У трикутнику ABC ∠A = 75°, ∠C = 35°. Знайдіть ∠B (у градусах).","fig":{"caption":"Трикутник ABC: ∠A = 75°, ∠C = 35°, кут B позначено знаком питання.","view":[-1.0,-1.0,7.0,4.538],"points":{"A":[0.0,0.0],"B":[0.948,3.538],"C":[6,0.0]},"items":[{"t":"poly","p":["A","B","C"]},{"t":"angle","p":["C","A","B"],"label":"75°"},{"t":"angle","p":["A","C","B"],"label":"35°"},{"t":"angle","p":["A","B","C"],"label":"?","s":"hl"}]},"accept":["70"],"a":"∠B = 180° − 75° − 35° = 70°."},{"q":"Полицю тримає трикутний кронштейн: між стіною і полицею прямий кут, а між підкосом і полицею — 40°. Який кут між підкосом і стіною (у градусах)?","accept":["50"],"a":"Кути трикутника: 90° + 40° + x = 180°, x = 50°."}],"fig":{"caption":"Доведення: через вершину B трикутника ABC проведено пряму DE, паралельну AC. ∠DBA = ∠A і ∠EBC = ∠C як різносторонні; разом з ∠B вони утворюють розгорнутий кут DBE.","view":[-2.5,-1.0,10.5,5.0],"points":{"A":[0.0,0.0],"B":[3,4],"C":[8,0.0],"D":[-1.5,4],"E":[9.5,4]},"lp":{"B":"n"},"items":[{"t":"poly","p":["A","B","C"]},{"t":"line","p":["D","E"], "]}]},"steps":[{"do":"Зовнішній кут BCD не суміжний з ∠A і ∠B.","why":"Він суміжний лише з ∠ACB.","hl":["ext"]},{"do":"∠BCD = ∠A + ∠B = 50° + 70° = 120°.","why":"Зовнішній кут дорівнює сумі двох кутів, не суміжних з ним.","hl":["a","b"]},{"do":"Перевірка іншим способом: ∠C = 180° − 50° − 70° = 60°, ∠BCD = 180° − 60° = 120°.","why":"Сума кутів трикутника і суміжні кути.","hl":["ext"]}],"answer":"Відповідь: 120°."},{"task":"Зовнішній кут при вершині B трикутника ABC дорівнює 130°, ∠A = 55°. Знайдіть ∠C.","fig":{"caption":"Трикутник ABC: ∠A = 55°; AB продовжено за B до точки D, зовнішній кут CBD = 130°; кут C позначено знаком питання.","view":[-1.0,-1.0,8.376,11.535],"points":{"A":[0.0,0.0],"B":[4.339,6.197],"C":[6,0.0],"D":[7.376,10.535]},"lp":{"B":"w"},"items":[{"t":"poly","p":["A","B","C"]},{"t":"seg","p":["B","D"]},{"t":"angle","p":["C","A","B"],"label":"55°","s":"hl2","id":"a"},{"t":"angle","p":["C","B","D"],"label":"130°","s":"hl","id":"ext"},{"t":"angle","p":["A","C","B"],"label":"?","s":"hl2","id":"c"}],"check":[{"col":["A","B","D"]}]},"steps":[{"do":"∠CBD = ∠A + ∠C.","why":"Зовнішній кут при B дорівнює сумі кутів A і C.","hl":["ext","a","c"]},{"do":"130° = 55° + ∠C.","why":"Підставляємо дані."},{"do":"∠C = 130° − 55° = 75°.","why":"Невідомий доданок: сума мінус відомий доданок.","hl":["c"]}],"answer":"Відповідь: 75°."},{"task":"Зовнішній кут при основі рівнобедреного трикутника 110°. Знайдіть кути трикутника.","fig":{"caption":"Рівнобедрений трикутник ABC з основою AC (AB = BC); AC продовжено за C до точки D, зовнішній кут BCD = 110°.","view":[-1.0,-1.0,9.0,7.869],"points":{"A":[0.0,0.0],"B":[2.5,6.869],"C":[5,0.0],"D":[8,0.0]},"items":[{"t":"poly","p":["A","B","C"]},{"t":"seg","p":["C","D"]},{"t":"seg","p":["A","B"],"ticks":1},{"t":"seg","p":["B","C"],"ticks":1},{"t":"angle","p":["B","C","D"],"label":"110°","s":"hl","id":"ext"},{"t":"angle","p":["C","A","B"],"arcs":1,"s":"hl2","id":"a"},{"t":"angle","p":["A","C","B"],"arcs":1,"s":"hl2","id":"c"},{"t":"angle",
