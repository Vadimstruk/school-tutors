не суміщати нуль шкали зі стороною.","Розглядати лише один випадок розміщення променів, коли в задачі немає малюнка."],"check":[{"q":"<b>Пастка.<\/b> Учень виміряв гострий кут і прочитав 130° — не з тієї шкали. Скільки градусів насправді має цей кут? Введіть число.","accept":["50"],"a":"Дві шкали в сумі дають 180°: 180° − 130° = 50°. Гострий кут і має бути менший за 90°."},{"q":"Скільки градусів кут між стрілками годинника о 4:00? Введіть число.","accept":["120"],"a":"4 поділки по 30°: 4 · 30° = 120°."},{"q":"∠AOB = 70°, ∠BOC = 45°. Знайдіть ∠AOC у градусах. Запишіть обидві можливі відповіді через «;» — від меншої до більшої.","accept":["25; 115","115; 25"],"a":"Якщо OC між OA і OB: 70° − 45° = 25°. Якщо OB між OA і OC: 70° + 45° = 115°."}]}}]}]},{"id":"G2","subject":"geometry","name":"Взаємне розміщення прямих на площині","what":"Як прямі можуть розташовуватися одна щодо одної: перетинатися, бути перпендикулярними чи паралельними.","topics":[{"id":"G2.1","name":"Суміжні та вертикальні кути","what":"Кути, що утворюються, коли прямі перетинаються.","subtopics":[{"id":"G2.1.1","name":"Суміжні кути","status":"planned","programmeRef":"Суміжні та вертикальні кути, їх властивості."},{"id":"G2.1.2","name":"Вертикальні кути","status":"planned","programmeRef":"Суміжні та вертикальні кути, їх властивості."}]},{"id":"G2.2","name":"Перпендикулярні й паралельні прямі","what":"Перпендикуляр, відстань від точки до прямої, паралельність.","subtopics":[{"id":"G2.2.1","name":"Перпендикулярні прямі. Відстань від точки до прямої","status":"planned","programmeRef":"Перпендикуляр. Відстань від точки до прямої."},{"id":"G2.2.2","name":"Паралельні прямі","status":"planned","programmeRef":"Паралельні та перпендикулярні прямі, їх властивості."},{"id":"G2.2.3","name":"Кут між прямими, що перетинаються","status":"planned","programmeRef":"Кут між двома прямими, що перетинаються."}]},{"id":"G2.3","name":"Паралельні прямі і січна","what":"Кути при перетині двох прямих третьою і як за ними впізнати паралельні прямі.","subtopics":[{"id":"G2.3.1","name":"Кути, утворені при перетині двох прямих січною","status":"planned","programmeRef":"Кути, утворені при перетині двох прямих січною."},{"id":"G2.3.2","name":"Ознаки паралельності прямих","status":"planned","programmeRef":"Ознаки паралельності прямих."},{"id":"G2.3.3","name":"Властивості кутів при паралельних прямих і січній","status":"planned","programmeRef":"Властивості кутів, утворених при перетині паралельних прямих січною"}]}]},{"id":"G3","subject":"geometry","name":"Трикутники. Ознаки рівності трикутників","what":"Найважливіша фігура 7 класу: її елементи, види, рівність і властивості кутів і сторін.","topics":[{"id":"G3.1","name":"Трикутник і його елементи","what":"Сторони, кути, висота, бісектриса, медіана.","subtopics":[{"id":"G3.1.1","name":"Трикутник і його елементи","status":"planned","programmeRef":"Трикутник і його елементи."},{"id":"G3.1.2","name":"Висота, бісектриса і медіана","status":"planned","programmeRef":"Висота, бісектриса і медіана трикутника."}]},{"id":"G3.2","name":"Рівність трикутників","what":"Коли два трикутники рівні і як це довести.","subtopics":[{"id":"G3.2.1","name":"Рівні фігури","status":"planned","programmeRef":"Рівність геометричних фігур."},{"id":"G3.2.2","name":"Ознаки рівності трикутників","status":"planned","programmeRef":"Ознаки рівності трикутників."}]},{"id":"G3.3","name":"Види трикутників","what":"Рівнобедрений, рівносторонній, гострокутний, прямокутний, тупокутний.","subtopics":[{"id":"G3.3.1","name":"Види трикутників","status":"planned","programmeRef":"Види трикутників."},{"id":"G3.3.2","name":"Рівнобедрений трикутник","status":"planned","programmeRef":"Рівнобедрений трикутник, його властивості та ознаки."},{"id":"G3.3.3","name":"Рівносторонній трикутник","status":"planned","programmeRef":"Рівносторонній трикутник."}]},{"id":"G3.4","name":"Кути трикутника","what":"Сума кутів трикутника і зовнішній кут.","subtopics":[{"id":"G3.4.1","name":"Сума кутів трикутника","statu const MAP_VERSION = "2026-10-14c";
const DATA = (typeof CONTENT !== "undefined" && CONTENT && Array.isArray(CONTENT.subjects)) ? CONTENT : { subjects: [] };

/* ---------- Покажчики ---------- */
const SUBJ = {}, SEC = {}, TOP = {}, SUB = {};
DATA.subjects.forEach((s, si) => {
  s.color = `var(--s${(si % 4) + 1})`;
  s.sections = Array.isArray(s.sections) ? s.sections : [];
  s.subs = [];
  SUBJ[s.id] = s;
  s.sections.forEach(sec => {
    sec.subject = s; SEC[sec.id] = sec; sec.subs = [];
    (sec.topics || []).forEach(t => {
      t.section = sec; t.subject = s; TOP[t.id] = t;
      t.subtopics = t.subtopics || [];
      t.subtopics.forEach(st => {
        st.topic = t; st.section = sec; st.subject = s; SUB[st.id] = st;
        st.ready = st.status === "ready" && !!st.lesson;
        st.checks = st.ready ? (st.lesson.check || []).map((c, i) => ({ id: `${st.id}-${i + 1}`, q: c.q, a: c.a,
          options: Array.isArray(c.options) ? c.options : null, correct: c.correct, accept: Array.isArray(c.accept) ? c.accept : null })) : [];
        st.examples = st.ready && Array.isArray(st.lesson.examples) ? st.lesson.examples : [];
        sec.subs.push(st); s.subs.push(st);

/* ---------- Сховище ---------- */
const LS_PROGRESS = "school-map:progress", LS_UI = "school-map:ui";
function lsGet(k) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
const clone = o => JSON.parse(JSON.stringify(o == null ? {} : o));
const isObj = v => !!v && typeof v === "object" && !Array.isArray(v);
function deepMerge(into, patch) {
  Object.keys(patch || {}).forEach(k => { if (isObj(patch[k])) into[k] = deepMerge(isObj(into[k]) ? into[k] : {}, patch[k]); else into[k] = patch[k]; });
  return into;
}
function normProgress(d) { d = isObj(d) ? d : {}; return { read: isObj(d.read) ? d.read : {}, checks: isObj(d.checks) ? d.checks : {}, updatedAt: d.updatedAt || null }; }

let progress = normProgress(lsGet(LS_PROGRESS));
let practice = {};                   // learner/practice → subtopics
let plan = { name: "", current: null, next: [] }; // learner/plan
let db = null, dbState = "local";    // local | live | readonly
let remoteExists = false, remoteBase = null;
let pending = null, inflight = null, writing = false;

/* Запис лише після дії учня, по одному за раз: зміни, що прийшли під час запису, чекають і йдуть одним наступним записом. */
function record(patch) {
  const now = new Date().toISOString();
  deepMerge(progress, patch);
  progress.updatedAt = now;
  lsSet(LS_PROGRESS, progress);
  if (!db || dbState !== "live") return;
  pending = deepMerge(pending || {}, patch);
  pump();
}
async function pump() {
  if (writing || !pending || !db) return;
  writing = true; inflight = pending; pending = null;
  const stamp = { updatedAt: new Date().toISOString(), mapVersion: MAP_VERSION };
  const ref = db.doc("learner/progress");
  const whole = () => ref.set(Object.assign(clone({ read: progress.read, checks: progress.checks }), stamp));
  try {
    if (!remoteExists) { await whole(); remoteExists = true; }
    else {
      try { await ref.update(Object.assign(clone(inflight), stamp)); }
      catch (e) {
        if (e && e.code === "invalid_argument") { await whole(); remoteExists = true; } // документ могли видалити
        else if (e && e.code === "unavailable") { await new Promise(r => setTimeout(r, 600 + Math.random() * 900)); await ref.update(Object.assign(clone(inflight), stamp)); }
        else throw e;
      }
    }
  } catch (e) {
    if (e && (e.code === "invalid_argument" || e.code === "revoked" || e.code === "not_granted")) { dbState = "readonly"; pending = null; paintStatus(); }
  } finally {
    inflight = null; writing = false;
    if (pending) pump();
  }
}
function applyRemoteProgress(d) {
  remoteBase = normProgress(clone(d));
  const merged = normProgress(clone(remoteBase));
  if (inflight) deepMerge(merged, inflight);
  if (pending) deepMerge(merged, pending);
  const changed = JSON.stringify([merged.read, merged.checks]) !== JSON.stringify([progress.read, progress.checks]);
  progress = merged;
  lsSet(LS_PROGRESS, progress);
  return changed;
}

/* ---------- Підрахунки ---------- */
function practiceOf(id) { const p = practice[id]; return p && +p.answered > 0 ? { answered: +p.answered, correct: +p.correct || 0, last: p.last || "" } : null; }
function isMastered(p) { return !!p && p.answered >= 3 && p.correct / p.answered >= 0.8; }
function checkCount(st) { const know = st.checks.filter(c => progress.checks[c.id] === "know").length; return { know, total: st.checks.length }; }
function statusOf(st) {
  if (!st.ready) return "planned";
  if (isMastered(practiceOf(st.id))) return "mastered";
  const c = checkCount(st);
  if (c.total && c.know === c.total) return "checked";
  if (progress.read[st.id]) return "read";
  return "new";
}
const STATUS = {
  planned: ["урок готується", "st-planned"],
  mastered: ["опановано на практиці", "st-mastered"],
  checked: ["самоперевірка пройдена", "st-checked"],
  read: ["прочитано", "st-read"],
  new: ["ще не відкрито", "st-new"]
};
// Бал підтеми: прочитано, самоперевірка, практика — по третині; «опановано» = 100 %.
function scoreOf(st) {
  const p = practiceOf(st.id);
  if (isMastered(p)) return 1;
  const c = checkCount(st);
  const prac = p ? Math.min(1, p.answered / 3) * Math.min(1, (p.correct / p.answered) / 0.8) : 0;
  return ((progress.read[st.id] ? 1 : 0) + (c.total ? c.know / c.total : 0) + prac) / 3;
}
function agg(subs) {
  const ready = subs.filter(s => s.ready);
  const pct = ready.length ? Math.round(ready.reduce((a, s) => a + scoreOf(s), 0) / ready.length * 100) : null;
  return { all: subs.length, ready: ready.length, pct,
    read: ready.filter(s => progress.read[s.id]).length,
    mastered: ready.filter(s => isMastered(practiceOf(s.id))).length };
}
const topicSubs = t => t.subtopics;

/* ---------- Допоміжне ---------- */
function esc(s) { return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
// У текстах уроків дозволено лише <b>, <i>, <sub>, <sup>; усе інше екранується.
function rich(s) { return esc(s).replace(/&lt;(\/?)(b|i|sub|sup)&gt;/g, "<$1$2>"); }
function plain(s) { return String(s == null ? "" : s).replace(/<\/?(b|i|sub|sup)>/g, ""); }
function plural(n, f) { const a = Math.abs(n) % 100, b = a % 10; return a > 10 && a < 20 ? f[2] : b === 1 ? f[0] : b >= 2 && b <= 4 ? f[1] : f[2]; }
function fmtDate(iso) {
  if (!iso) return "";
  const d = new Date(String(iso).length === 10 ? iso + "T12:00:00" : iso);
  if (isNaN(d)) return String(iso);
  try { return d.toLocaleDateString("uk-UA", { day: "numeric", month: "long", year: "numeric" }).replace(/\s*р\.$/, ""); } catch (e) { return String(iso).slice(0, 10); }
}
function ring(pct, size, color, big) {
  const sw = big ? 7 : 6, r = (size - sw) / 2, c = 2 * Math.PI * r, cx = size / 2;
  const v = pct == null ? 0 : Math.max(0, Math.min(100, pct));
  return `<svg class="ring${big ? " big" : ""}" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true" style="--ring-c:${color}">`
    + `<circle class="trk" cx="${cx}" cy="${cx}" r="${r}" stroke-width="${sw}"/>`
    + (v > 0 ? `<circle class="val" cx="${cx}" cy="${cx}" r="${r}" stroke-width="${sw}" stroke-dasharray="${(c * v / 100).toFixed(2)} ${c.toFixed(2)}" transform="rotate(-90 ${cx} ${cx})"/>` : "")
    + `<text x="${cx}" y="${cx}">${pct == null ? "—" : pct + "%"}</text></svg>`;
}
function bar(pct, color) { return `<span class="bar" aria-hidden="true"><i style="width:${pct || 0}%;${color ? `--bar-c:${color}` : ""}"></i></span>`; }

function autoOpen() {

function subjectHtml(s) {

function exampleHtml(st, ex, k) {

/* Перевірка введеної відповіді: однаково записані відповіді збігаються, а числа порівнюються як числа
   («x = 65», «65 грн» і «65» — те саме; «2,5» = «2.5»; «−2» = «-2»). */
function normAns(x) {
  let v = String(x == null ? "" : x).trim().toLowerCase().replace(/\s+/g, "")
    .replace(/[−–—‐‑]/g, "-").replace(/,/g, ".").replace(/[×*]/g, "·");
  return v.replace(/\.$/, "");
}
function numAns(x) {
  let v = normAns(x).replace(/^\p{L}+=/u, "").replace(/[\p{L}°%]+$/u, "");
  let m = v.match(/^([+-]?(?:\d+(?:\.\d+)?|\.\d+))$/);
  if (m) return Number(m[1]);
  m = v.match(/^([+-]?\d+(?:\.\d+)?)\/(\d+(?:\.\d+)?)$/);
  if (m && +m[2] !== 0) return Number(m[1]) / Number(m[2]);
  return null;
}
function isAccepted(c, input) {
  const ni = normAns(input), xi = numAns(input);
  if (!ni) return false;
  return c.accept.some(a => normAns(a) === ni || (xi !== null && numAns(a) !== null && Math.abs(numAns(a) - xi) < 1e-9));
}
function checkHtml(c, i) {
  const stored = progress.checks[c.id], u = ui.chk[c.id];
  const head = `<p class="q">${i + 1}. ${rich(c.q)}</p>`;
  const explain = `<p class="a"><b>Пояснення:</b> ${rich(c.a)}</p>`;
  const again = `<div class="row"><button class="btn ghost" type="button" data-act="chk-again" data-id="${c.id}" data-k="again-${c.id}">Спробувати ще раз</button></div>`;
  // Уже відповідали раніше (або щойно): показати результат і пояснення.
  if ((!u && stored) || (u && u.phase === "done")) {
    const res = u ? u.result : stored;
    const msg = u ? u.msg : (stored === "know" ? "Минулого разу: правильно з першої спроби ✓" : "Минулого разу: ще треба повторити.");
    const opts = c.options ? `<div class="opts">${c.options.map((o, j) => `<button class="opt${j === c.correct ? " right" : u && u.wrong.includes(j) ? " wrong" : ""}" type="button" disabled>${"АБВГ"[j]}) ${rich(o)}</button>`).join("")}</div>` : "";
    return `<div class="check" data-check="${c.id}">${head}${opts}
      <p class="res ${res}" role="status">${esc(msg)}</p>${explain}${again}</div>`;
  }
  const st = u || { phase: "fresh", value: "", wrong: [] };
  const retryMsg = st.phase === "retry" ? `<p class="res not-yet" role="status">Не зовсім. Спробуй ще раз.</p>` : "";
  const giveUp = st.phase === "retry" ? `<button class="btn ghost" type="button" data-act="chk-show" data-id="${c.id}" data-k="show-${c.id}">Показати відповідь</button>` : "";
  if (c.options) {
    return `<div class="check" data-check="${c.id}">${head}
      <div class="opts" role="group" aria-label="Варіанти відповіді">${c.options.map((o, j) => `<button class="opt${st.wrong.includes(j) ? " wrong" : ""}" type="button" data-act="chk-opt" data-id="${c.id}" data-i="${j}" data-k="opt-${c.id}-${j}"${st.wrong.includes(j) ? " disabled" : ""}>${"АБВГ"[j]}) ${rich(o)}</button>`).join("")}</div>
      ${retryMsg}${giveUp ? `<div class="row">${giveUp}</div>` : ""}</div>`;
  }
  return `<div class="check" data-check="${c.id}">${head}
    <div class="row ans-row"><label class="sr" for="in-${c.id}">Твоя відповідь</label>
      <input class="chk-in" id="in-${c.id}" data-id="${c.id}" data-k="in-${c.id}" type="text" inputmode="text" autocomplete="off" spellcheck="false" placeholder="Твоя відповідь" value="${esc(st.value)}">
      <button class="btn" type="button" data-act="chk-submit" data-id="${c.id}" data-k="submit-${c.id}">Перевірити</button>${giveUp}</div>
    ${retryMsg}</div>`;
}
function findCheck(id) { const st = SUB[id.replace(/-\d+$/, "")]; return st ? st.checks.find(c => c.id === id) : null; }
function answerCheck(id, right, extra) {
  const c = findCheck(id); if (!c) return;
  const u = ui.chk[id] || (ui.chk[id] = { phase: "fresh", value: "", wrong: [] });
  if (extra && extra.value != null) u.value = extra.value;
  let result = null, msg = "";
  if (right && u.phase === "fresh") { result = "know"; msg = "Правильно!"; }
  else if (right) { result = "not-yet"; msg = "Правильно з другої спроби. Глянь пояснення, щоб наступного разу вийшло одразу."; }
  else if (u.phase === "fresh") { u.phase = "retry"; if (extra && extra.opt != null) u.wrong.push(extra.opt); }
  else { result = "not-yet"; msg = "Не зовсім. Ось правильна відповідь і пояснення — нічого страшного, повториш."; if (extra && extra.opt != null) u.wrong.push(extra.opt); }
  if (result) { u.phase = "done"; u.result = result; u.msg = msg; record({ checks: { [id]: result } }); }
}
function practiceLine(st, p) {
  const who = esc(st.subject.tutor || "репетитор");
  if (!p) return dbState === "local" ? `Тут з'являться результати задач, які дасть ${who}, коли карту відкрито як твою особисту сторінку з чату.` : `Поки задач на цю тему не було. Попроси їх нижче — результат з'явиться тут.`;
  const pct = Math.round(p.correct / p.answered * 100);
  return `Правильно <b>${p.correct} з ${p.answered}</b> (${pct}%)${p.last ? `, востаннє ${esc(fmtDate(p.last))}` : ""}. `
    + (isMastered(p) ? "Це вже опановано на практиці. Чудово!" : "Тему вважаємо опанованою, коли правильно хоча б 8 з 10 (і розв'язано щонайменше 3 задачі).");
}

/* ---------- Для батьків ---------- */
function parentsHtml() {
  const allPr = Object.keys(practice).map(id => [SUB[id], practiceOf(id)]).filter(x => x[0] && x[1]);
  const dates = [progress.updatedAt, ...allPr.map(x => x[1].last)].filter(Boolean).map(String).sort();
  const last = dates.length ? dates[dates.length - 1] : null;
  const cards = DATA.subjects.map(s => {
    const a = agg(s.subs);
    const cur = plan.current && plan.current.subject === s.id ? TOP[plan.current.topic] : null;
    const byTopic = [];
    s.sections.forEach(sec => sec.topics.forEach(t => {
      const ps = t.subtopics.map(st => practiceOf(st.id)).filter(Boolean);
      if (!ps.length) return;
      const ans = ps.reduce((x, p) => x + p.answered, 0), cor = ps.reduce((x, p) => x + p.correct, 0);
      byTopic.push([t, cor, ans]);
    }));
    const weak = s.subs.map(st => [st, practiceOf(st.id)]).filter(([, p]) => p && p.answered >= 3 && p.correct / p.answered < 0.6);
    const tone = pct => pct >= 80 ? "var(--good)" : pct >= 60 ? "var(--mid)" : "var(--bad)";
    const word = pct => pct >= 80 ? "добре" : pct >= 60 ? "непогано" : "варто підтягнути";
    return `<section class="card" aria-labelledby="ph-${s.id}">
      <h3 id="ph-${s.id}">${esc(s.icon || "")} ${esc(s.name)}${s.tutor ? ` <span class="note">· репетитор ${esc(s.tutor)}</span>` : ""}</h3>
      ${a.ready ? `<div class="meters">
        <div class="meter"><div class="lbl"><span>Прочитано уроків</span><b>${a.read} з ${a.ready}</b></div>${bar(Math.round(a.read / a.ready * 100), "var(--accent)")}</div>
        <div class="meter"><div class="lbl"><span>Опановано на практиці</span><b>${a.mastered} з ${a.ready}</b></div>${bar(Math.round(a.mastered / a.ready * 100), "var(--good)")}</div>
      </div>
      <p class="note" style="margin-top:8px">Рахуємо лише готові уроки (${a.ready} з ${a.all} підтем). Решта ще готується.</p>`
      : `<p class="note">Уроки з цього предмета ще готуються.</p>`}
      <p style="margin-top:12px"><b>Зараз у школі:</b> ${cur ? `${esc(cur.id)} ${rich(cur.name)}` : "репетитор ще не позначив тему."}</p>
      ${byTopic.length ? `<h3 style="margin-top:14px">Точність у задачах за темами</h3>
        <table class="acc"><thead><tr><th>Тема</th><th>Правильно</th><th class="barcol"><span class="sr">Шкала</span></th></tr></thead><tbody>
        ${byTopic.map(([t, cor, ans]) => { const pct = Math.round(cor / ans * 100); return `<tr><td>${rich(t.name)}</td><td class="num">${cor} з ${ans} · <b style="color:${tone(pct)}">${pct}%</b> <span class="note">${word(pct)}</span></td><td class="barcol">${bar(pct, tone(pct))}</td></tr>`; }).join("")}
        </tbody></table>` : `<p class="note" style="margin-top:8px">${dbState === "local" ? "Результати задач з репетитором видно, коли карту відкрито як особисту сторінку учня з чату." : "Задач з репетитором ще не було."}</p>`}
      ${weak.length ? `<h3 style="margin-top:14px">Що варто підтягнути</h3><ul class="weak">${weak.map(([st, p]) => `<li>${rich(st.name)} — правильно ${p.correct} з ${p.answered}</li>`).join("")}</ul>` : ""}
    </section>`;
  }).join("");
  return `<section class="par-head"><h2>Як ідуть справи</h2>
      <p class="note" style="margin-top:4px">${last ? `Остання активність: ${esc(fmtDate(last))}.` : "Поки що жодної позначки: уроки ще не відкривали."}</p></section>
    <div class="subj-cards">${cards}</div>
    <section class="card"><h3>Як допомогти</h3><ul class="tips">
      <li>Попросіть дитину пояснити Вам одну підтему своїми словами. Пояснити іншому — найкращий спосіб запам'ятати.</li>
      <li>Короткі заняття часто (15–20 хвилин кілька разів на тиждень) дають більше, ніж одне довге.</li>
      <li>Хваліть за старання й за чесне «Ще ні» в самоперевірці — так видно, що повторити.</li>
      <li>Якщо тема «варто підтягнути», не сваріть: у кожному уроці є готовий запит, щоб попросити в репетитора ще задач.</li>
      <li>Не розв'язуйте задачі замість дитини. Краще спитайте: «З чого ти почнеш?»</li>
    </ul><p class="note" style="margin-top:10px">Відсотки тут — з карти й задач з репетитором. Це не шкільна оцінка.</p></section>`;
}

/* ---------- Малювання ---------- */
function render(opts) {
  opts = opts || {};
  const main = $("main");
  const ae = document.activeElement, key = ae && ae.closest && ae.closest("[data-k]") && ae.dataset.k;
  renderHeader();
  let html;
  if (!DATA.subjects.length) html = emptyHtml("Карта ще наповнюється…", "Тут з'являться предмети, теми й короткі уроки. Зазирни трохи згодом — або вже зараз поговори з репетитором у чаті.");
  else if (ui.view === "parents") html = parentsHtml();
  else if (ui.view === "lesson" && SUB[ui.lesson] && SUB[ui.lesson].ready) html = lessonHtml(SUB[ui.lesson]);
  else { ui.view = "map"; autoOpen(); html = subjectHtml(SUBJ[ui.subject]); }
  main.innerHTML = html;
  paintStatus();
  if (opts.focus) { const el = document.querySelector(opts.focus); if (el) { el.focus({ preventScroll: !!opts.noScroll }); if (el.tagName === "INPUT") { try { el.setSelectionRange(el.value.length, el.value.length); } catch (e) {} } if (!opts.noScroll && el.scrollIntoView) el.scrollIntoView({ block: opts.block || "nearest" }); } }
  else if (key && document.activeElement === document.body) { const el = document.querySelector(`[data-k="${key}"]`); if (el) el.focus({ preventScroll: true }); }
}

function openLesson(id) {
  const st = SUB[id];
  if (!st || !st.ready) return;
  ui.subject = st.subject.id; ui.view = "lesson"; ui.lesson = id; ui.copied = null;
  ui.open.add(st.section.id); ui.open.add(st.topic.id);
  saveUi();
  render({ focus: "#lesson-title", noScroll: true });
  window.scrollTo(0, 0);
}
function backToMap() {
  const from = ui.lesson; ui.view = "map"; ui.lesson = null;
  render({ focus: from ? `[data-k="s-${from}"]` : "#main", block: "center" });
}

document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]");
  if (!b) return;
  const act = b.dataset.act, id = b.dataset.id;
  if (act === "tab") { ui.subject = id; ui.view = "map"; ui.lesson = null; saveUi(); render({ focus: `#tab-${id}`, noScroll: true }); }
  else if (act === "toggle") {
    ui.openTouched = true;
    if (ui.open.has(id)) ui.open.delete(id); else ui.open.add(id);
    saveUi(); render({ focus: `[data-k="h-${id}"]`, noScroll: true });
  }
  else if (act === "goto-topic") {
    const t = TOP[id]; if (!t) return;
    ui.open.add(t.section.id); ui.open.add(t.id); ui.openTouched = true; saveUi();
    render({ focus: `[data-k="h-${id}"]`, block: "center" });
  }
  else if (act === "open") openLesson(id);
  else if (act === "back") backToMap();
  else if (act === "step" || act === "steps-all" || act === "steps-reset") {
    const k = +b.dataset.ex, key = `${id}#${k}`, n = ((SUB[id].examples[k] || {}).steps || []).length;
    ui.steps[key] = act === "step" ? Math.min(n, (ui.steps[key] || 0) + 1) : act === "steps-all" ? n : 0;
    render({ focus: ui.steps[key] >= n ? `[data-k="steps-reset-${k}"]` : `[data-k="step-${k}"]`, noScroll: true });
  }
  else if (act === "chk-opt") { const c = findCheck(id), j = +b.dataset.i; answerCheck(id, j === c.correct, { opt: j }); focusCheck(id); }
  else if (act === "chk-submit") submitInput(id);
  else if (act === "chk-show") { const u = ui.chk[id]; if (u) { u.phase = "done"; u.result = "not-yet"; u.msg = "Ось правильна відповідь і пояснення. Спробуй потім ще раз."; record({ checks: { [id]: "not-yet" } }); } focusCheck(id); }
  else if (act === "chk-again") { ui.chk[id] = { phase: "fresh", value: "", wrong: [] }; focusCheck(id); }
  else if (act === "read") { record({ read: { [id]: !progress.read[id] } }); render({ focus: `[data-k="read"]`, noScroll: true }); }
  else if (act === "copy") copyAsk(b);
});
function focusCheck(id) {
  const u = ui.chk[id], c = findCheck(id);
  let sel = `[data-k="again-${id}"]`;
  if (u && u.phase !== "done") sel = c && c.options ? `[data-check="${id}"] .opt:not([disabled])` : `[data-k="in-${id}"]`;
  render({ focus: sel, noScroll: true });
}
function submitInput(id) {
  const inp = document.getElementById("in-" + id), c = findCheck(id);
  if (!inp || !c) return;
  const v = inp.value;
  if (!v.trim()) { inp.focus(); return; }
  answerCheck(id, isAccepted(c, v), { value: v });
  focusCheck(id);
}
document.addEventListener("keydown", e => {
  if (e.key === "Enter" && e.target.classList && e.target.classList.contains("chk-in")) { e.preventDefault(); submitInput(e.target.dataset.id); }
});
document.addEventListener("input", e => {
  if (e.target.classList && e.target.classList.contains("chk-in")) { const id = e.target.dataset.id; (ui.chk[id] = ui.chk[id] || { phase: "fresh", value: "", wrong: [] }).value = e.target.value; }
});
$("parents-toggle").addEventListener("click", () => {
  ui.view = ui.view === "parents" ? "map" : "parents";
  render({ focus: "#parents-toggle", noScroll: true });
  window.scrollTo(0, 0);
});
// Стрілки ліворуч/праворуч, Home, End — між вкладками предметів.
$("tabs").addEventListener("keydown", e => {
  const ids = DATA.subjects.map(s => s.id), i = ids.indexOf(ui.subject);
  let j = null;
  if (e.key === "ArrowRight") j = (i + 1) % ids.length; else if (e.key === "ArrowLeft") j = (i - 1 + ids.length) % ids.length;
  else if (e.key === "Home") j = 0; else if (e.key === "End") j = ids.length - 1;
  if (j === null) return;
  e.preventDefault();
  ui.subject = ids[j]; ui.view = "map"; ui.lesson = null; saveUi();
  render({ focus: `#tab-${ids[j]}`, noScroll: true });
});
function copyAsk(btn) {
  const ta = $("ask-text"), note = $("copy-note"), id = ui.lesson;
  const ok = () => { ui.copied = id; btn.textContent = "Скопійовано ✓"; note.textContent = "Тепер встав у чат з репетитором."; };
  const fallback = () => {
    ta.focus(); ta.select();
    let done = false;
    try { done = document.execCommand("copy"); } catch (e) {}
    if (done) ok(); else note.textContent = "Текст виділено — натисни Ctrl+C (або «Копіювати» на телефоні).";
  };
  try { navigator.clipboard.writeText(ta.value).then(ok, fallback); } catch (e) { fallback(); }
}

/* ---------- Спільна база (коли карта — особиста опублікована сторінка учня) ---------- */
let retries = 0;
function watch(path, onData) {
  let unsub = null;
  const start = () => {
    try {
      unsub = db.doc(path).onSnapshot(snap => onData(snap.exists ? (snap.data() || {}) : null), err => {
        if (err && err.code === "unavailable" && retries < 5) { retries++; setTimeout(start, 4000 * retries); }
      });
    } catch (e) {}
  };
  start();
}
let softPending = false;
function rerenderSoft() {
  // Поки учень друкує відповідь, не перебудовуємо сторінку: оновимося, коли поле втратить фокус.
  const ae = document.activeElement;
  if (ae && ae.classList && ae.classList.contains("chk-in")) { softPending = true; return; }
  softPending = false; render();
}
document.addEventListener("focusout", e => {
  if (softPending && e.target.classList && e.target.classList.contains("chk-in")) setTimeout(() => { if (softPending) rerenderSoft(); }, 0);
});
async function connect() {
  const c = window.claude;
  if (!c || typeof c.use !== "function") return;
  let handle = null;
  try { handle = await c.use("db"); } catch (e) { handle = null; }
  if (!handle) return;
  db = handle; dbState = "live"; paintStatus();
  try {
    const snap = await db.doc("learner/progress").get();
    if (snap.exists) {
      remoteExists = true;
      const remote = normProgress(clone(snap.data()));
      // Позначки, зроблені в цьому браузері, поки бази не було, доливаємо одним записом (база перемагає в суперечках).
      const extra = {};
      ["read", "checks"].forEach(k => Object.keys(progress[k]).forEach(id => { if (!(id in remote[k])) { extra[k] = extra[k] || {}; extra[k][id] = progress[k][id]; } }));
      applyRemoteProgress(remote);
      if (Object.keys(extra).length) record(extra);
    } else if (Object.keys(progress.read).length || Object.keys(progress.checks).length) {
      record({});
    }
  } catch (e) {
    if (e && (e.code === "revoked" || e.code === "not_granted" || e.code === "capability_disabled" || e.code === "capability_removed")) { db = null; dbState = "local"; paintStatus(); return; }
  }
  render();
  watch("learner/progress", d => { if (d) { remoteExists = true; if (applyRemoteProgress(d)) rerenderSoft(); } });
  watch("learner/practice", d => {
    const next = d && isObj(d.subtopics) ? clone(d.subtopics) : {};
    if (JSON.stringify(next) !== JSON.stringify(practice)) { practice = next; rerenderSoft(); }
  });
  watch("learner/plan", d => {
    const next = { name: d && typeof d.name === "string" ? d.name.trim() : "",
      current: d && isObj(d.current) && d.current.topic ? { subject: String(d.current.subject || (TOP[d.current.topic] ? TOP[d.current.topic].subject.id : "")), topic: String(d.current.topic) } : null,
      next: d && Array.isArray(d.next) ? d.next.map(String) : [] };
    if (JSON.stringify(next) !== JSON.stringify(plan)) { plan = next; rerenderSoft(); }
  });
}

render();
connect();
</script>
</body>
</html>
